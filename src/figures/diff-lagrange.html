<p class="fig__title">At the constrained optimum, \(\nabla f\) is parallel to \(\nabla g\).</p>
<div class="fig__stage" data-fig="diff-lagrange"></div>
<figcaption>The objective is \(f(x, y) = x + 2y\), shaded darker where it is larger and drawn with its level lines. The constraint is the ellipse \(g(x, y) = x^2 + 4y^2 = 4\). Drag the point along the ellipse, or use the slider. The orange arrow is the direction of \(\nabla f\), the blue arrow is the direction of \(\nabla g\), and the purple arrow is the part of \(\nabla f\) that points along the curve. While the purple arrow has any length, moving that way raises \(f\) without leaving the constraint. At the default \(\theta = 150^\circ\) the two gradients are 67.5° apart and \(f\) rises at 2.07 per unit length along the curve. Press “jump to maximum”: the purple arrow shrinks to nothing, the gradients line up, and \(f = 2.83\) at \((1.41, 0.71)\) with \(\lambda = 0.354\). At the minimum, \(f = -2.83\) at \((-1.41, -0.71)\), the gradients point in opposite directions and \(\lambda = -0.354\). The plot of \(f\) along the curve, below the ellipse, is flat at both points.</figcaption>
