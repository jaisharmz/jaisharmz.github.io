<p class="fig__title">Counting microstates makes the occupancy of energy levels fall off exponentially.</p>
<div class="fig__stage" data-fig="diff-macrostates"></div>
<figcaption>Bars: the fraction of balls at energy level \(j\), averaged over every microstate, from an exact count of all macrostates. Curve: the Lagrange solution \(n_j / n = C e^{-\lambda_2 E_j}\), with \(C\) and \(\lambda_2\) fixed by the two constraints. Dots: the macrostate with the largest \(W\). At the default \(n = 25\) there are 1958 macrostates and \(6.32 \times 10^{13}\) microstates, and each bar is about half the one before it (0.490, 0.255, 0.130, 0.065). The fit gives \(\lambda_2 = 0.691\) and the constraints give 0.693, which is \(\ln 2\): a mean energy of one unit per ball forces \(e^{-\lambda_2} = 1/2\), so in the text's terms this toy sits at \(k_B T = 1/\ln 2 = 1.44\) energy units. The most probable macrostate, \((11, 7, 4, 2, 1, 0, \dots)\), holds only 2.5% of the microstates, yet its occupancies already follow the curve. Slide \(n\) down to 3 for the text's table: A \((0,3,0,0)\) has \(W = 1\), B \((1,1,1,0)\) has \(W = 6\), and C \((2,0,0,1)\) has \(W = 3\). With so few balls the bars fall along a straight line: 0.4, 0.3, 0.2, 0.1. At \(n = 40\) there are 37338 macrostates and the fit reaches 0.692. The log scale turns the exponential into a straight line and shows where the count leaves it: at the default, level 10 holds half the occupancy the curve predicts, and at \(n = 40\) it holds 0.68 of it, because a finite number of balls cuts off the tail.</figcaption>
