<p class="fig__title">Particles under gravity and random kicks reach the Boltzmann profile only when \(D = k_B T / \gamma\).</p>
<div class="fig__stage" data-fig="diff-sedimentation"></div>
<figcaption>Each of 3000 particles follows \(dz = -\frac{mg}{\gamma}\,dt + \sqrt{2D}\,dw\) with a floor at \(z = 0\), in units where \(mg = 1\) and \(\gamma = 1\). Left: the particles. Right: the histogram of their heights, the Boltzmann profile \(\rho(z) \propto e^{-mgz/k_B T}\) in orange, and the profile this \(D\) actually produces, \(\rho(z) \propto e^{-mgz/\gamma D}\), dashed. The mean height is the decay length of an exponential profile, so it is the number to compare. The particles start well mixed at a mean height of 2.95 and settle within about 15 time units, a few seconds of animation. At the default \(D = k_B T/\gamma\), averaged over \(t = 20\) to 40, the mean height is 1.005 against the Boltzmann decay length 1.000. Raise \(D\) to \(4\,k_B T/\gamma\) at the same temperature and the cloud swells to a mean height of 4.05, with about a fifth of the particles above the top of the plot. Drop it to \(0.25\,k_B T/\gamma\) and the cloud collapses to 0.253. With \(D\) held at \(k_B T/\gamma\), doubling \(k_B T\) to 2 doubles the height to 2.02. Only the Einstein Stokes value of \(D\) makes the random kicks balance the drift at the Boltzmann profile.</figcaption>
