<p class="fig__title">Gradient descent walks downhill on the cost surface, and the learning rate decides whether it reaches the bottom.</p>
<div class="fig__stage" data-fig="idl-linreg"></div>
<figcaption>The data plot shows 20 points, the current line \(h(x) = \theta_0 + \theta_1 x\), and the residual of each point in red. The contour plot shows the cost \(J(\theta_0, \theta_1)\), the path of gradient descent from \(\theta_0 = \theta_1 = 0\), and a cross at the least squares answer \(\theta_0 = 1.284\), \(\theta_1 = 1.156\). On this toy, at \(\alpha = 0.3\) the path comes within 0.01 of the cross in 79 steps. Drop \(\alpha\) to 0.05 and it needs 481 steps. Raise it to 0.8 and the path zigzags across the valley but arrives in 29. Above 0.89 each step overshoots farther than the last, and at 0.95 the cost reaches 518 after 20 steps and keeps growing. Click anywhere on the contours to start from there.</figcaption>
