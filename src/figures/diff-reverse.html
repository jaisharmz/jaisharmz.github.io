<p class="fig__title">The reverse SDE turns \(N(0,1)\) noise back into the data, but its drift without the noise term sends every starting point to the same place.</p>
<div class="fig__stage" data-fig="diff-reverse"></div>
<figcaption>300 samples start from \(N(0,1)\) at \(t = 1\) and take 1000 steps of \(x_{t-\Delta t} = x_t - \Delta x\) down to \(t = 0\), with \(\beta_{\min} = 0.1\) and \(\beta_{\max} = 20\). The figure uses the exact score of the data \(0.3\,N(-2, 0.3^2) + 0.7\,N(1.5, 0.3^2)\) in place of a trained network \(s_\theta\). Paths are colored by the mode they end in, the shading is the exact \(P(x,t)\), and the right panel compares the samples with \(P(x,t)\) at the current time. With the noise term, 0.29 of the samples end near \(-2\) and 0.71 near 1.5, against true weights of 0.30 and 0.70, and the spread within each mode is 0.29 and 0.31 against 0.30. Switch to no noise term, which keeps the drift \(f - g(t)^2 s\) and drops \(g(t)\,d\overline{w}\). The same 300 starting points all end within 0.01 of \(x = 1.47\), the Introduction's point that a deterministic update can send many starting points to the same image. A deterministic sampler can still work: halving the score term gives the probability flow ODE of Song et al. (2021), \(dx = [f - \tfrac{1}{2}g(t)^2 s]\,dt\), which recovers 0.29 and 0.71 with spreads of 0.29 and 0.30.</figcaption>
