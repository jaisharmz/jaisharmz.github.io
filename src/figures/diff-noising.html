<p class="fig__title">Adding noise carries two small regions of real images into one wide Gaussian at the origin, and the reverse SDE carries that noise back into both regions.</p>
<div class="fig__stage" data-fig="diff-noising"></div>
<figcaption>A 2D stand-in for image space. Real images live in two tight modes labeled faces and cars, each a Gaussian with standard deviation \(s = 0.25\) about 2.8 from the origin, and noise is \(N(0, I)\). Press play on forward: 400 points run the forward SDE \(dx = -\tfrac{1}{2}\beta(t)\,x\,dt + \sqrt{\beta(t)}\,dw\) with \(\beta_{\min} = 0.1\) and \(\beta_{\max} = 20\). Their mean distance from the origin falls from 2.81 to 1.27 (it is 1.25 for \(N(0, I)\) itself), and the share within \(2s\) of a mode falls from 0.88 to under 0.01. Switch to reverse: 400 fresh draws from \(N(0, I)\) run the reverse SDE from \(t = 1\) back to \(t = 0\), using the exact score of the two-mode mixture in place of a trained network. The share near a mode climbs back to 0.88, split 0.44 faces and 0.44 cars, and the two runs trace nearly the same curves on the right. The shading is the exact density \(P(x,t)\).</figcaption>
