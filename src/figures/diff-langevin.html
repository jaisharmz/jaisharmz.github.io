<p class="fig__title">The \(\sqrt{2\epsilon}\) in the noise term is what makes Langevin dynamics sample \(P(x)\) instead of climbing to its peaks.</p>
<div class="fig__stage" data-fig="diff-langevin"></div>
<figcaption>500 particles start from a broad cloud and repeat \(x \leftarrow x + \epsilon \nabla_x \log P(x) + c\,z\) on a mixture of three Gaussians with weights 0.5, 0.3, and 0.2 and std 0.55, using the exact score. The shading is \(P(x)\), each particle takes the color of its nearest mode, and the bars average the last 500 steps. At the default \(\epsilon = 0.05\), after 2000 steps with \(c = \sqrt{2\epsilon}\), the mode weights are 0.500, 0.298, and 0.202, and each mode's variance is 1.09 to 1.10 times the target, the discretization error of the unadjusted algorithm, which predicts 1.090 for a single Gaussian mode. Halving the noise variance halves \(T\) in \(P \propto e^{-E/k_B T}\), so \(c = \sqrt{\epsilon}\) samples \(P^2\). From the same start it gives variances of 0.56 to 0.59 of the target and weights of 0.633, 0.259, and 0.108, close to the 0.657, 0.237, and 0.106 of \(P^2\). With no noise every particle climbs to its nearest peak. The variance goes to 0, and the weights freeze at 0.356, 0.320, and 0.324, set only by where the particles started. Toggle the noise term mid-run to watch the cloud tighten or collapse, and raise \(\epsilon\) to 0.2 to see even the correct noise overshoot the variance, by 1.43 to 1.46 times.</figcaption>
