<p class="fig__title">Sampling utilization every \(\Delta t\) misses revenue in proportion to \(\Delta t\), so halving the interval halves the expected loss.</p>
<div class="fig__stage" data-fig="cx-sampling"></div>
<figcaption>Utilization follows geometric Brownian motion with \(\mu = 0.5\), \(\sigma = 0.3\), and \(R_0 = 1\) over one billing period \(T = 1\), and the provider bills at the left endpoints \(t_i = (i-1)\Delta t\), as in the text's sum. At \(\Delta t = 1/8\) the exact formula gives \(E[\text{Loss}] = 0.04012\), the first-order term \(\frac{1}{2} R_0 (e^{\mu T} - 1)\Delta t\) gives 0.04055, and the mean over 2000 simulated paths is 0.03947 with a standard error of 0.00074. Halve \(\Delta t\): the exact loss falls by a factor of 1.990 and the simulated loss by 2.003, and on the doubling axes the points sit on a line of slope one. The factor is slightly below 2 because the bracket in the exact formula equals \(\Delta t/2 - \mu \Delta t^2/12\) plus smaller terms, and going from one sample to two divides the loss by only 1.914. The spread of the loss across paths shrinks in proportion too (a standard deviation of 0.0333 at \(\Delta t = 1/8\)), so between 9.4% and 10.4% of paths are over-billed at every \(\Delta t\). The text's derivation holds: the direct sum and its closed form agree to eight digits, and with \(\sigma = 0\) the simulation matches the formula to within \(10^{-6}\).</figcaption>
