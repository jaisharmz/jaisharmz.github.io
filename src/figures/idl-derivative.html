<p class="fig__title">The derivative is the number that the slope of the secant line approaches as \(h\) shrinks to 0.</p>
<div class="fig__stage" data-fig="idl-derivative"></div>
<figcaption>The curve is \(f(x) = x^2 + 2x + 3\), the function in the next example. The orange secant passes through \((x, f(x))\) and \((x + h, f(x + h))\), which is the line through \((x, f(x))\) and \((a, f(a))\) with \(a = x + h\). The dashed blue line is the tangent. At \(x = 5\) with \(h = 2\) the secant slope is 14, while \(f'(5) = 12\). Slide \(h\) down: the slope is 12.1 at \(h = 0.1\) and 12.001 at \(h = 0.001\), and the secant lies on top of the tangent. Approach from the left and the slope rises to 12 from below, from 10 at \(h = -2\) to 11.999 at \(h = -0.001\). The two sides agree, so the derivative exists. For this \(f\) the gap is exactly \(h\), because \(\frac{f(x + h) - f(x)}{h} = 2x + 2 + h\). Drag along the curve to move the point.</figcaption>
