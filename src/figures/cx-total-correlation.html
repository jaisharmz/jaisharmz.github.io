<p class="fig__title">The sum of the tokens' entropies minus their joint entropy is zero for independent tokens and grows as the tokens move together.</p>
<div class="fig__stage" data-fig="cx-total-correlation"></div>
<figcaption>Token returns are jointly Gaussian with a daily standard deviation of 0.05 and a common pairwise correlation \(r\), so the metric equals \(-\frac{1}{2}\log\det R = -\frac{1}{2}\left[(n-1)\log(1-r) + \log(1+(n-1)r)\right]\), in nats. At the defaults (\(n = 5\) and \(r = 0.5\)), each marginal entropy is \(-1.5768\) nats (differential entropy can be negative), the sum of the marginals is \(-7.8840\), the joint entropy is \(-8.7210\), and the metric is their difference, 0.8370 nats. Set \(r = 0\) and the metric is 0. At \(r = 0.3\) it is 0.047 nats for 2 tokens and 2.437 for 20, so the metric grows with the number of tokens even when the pairwise correlation stays fixed. It also rises when \(r\) is negative: for 2 tokens, \(r = -0.5\) gives the same 0.1438 as \(r = 0.5\), so on its own the metric cannot tell tokens that hedge each other from tokens that move together. The shaded region is \(r < -1/(n-1)\), where no valid correlation matrix exists. Estimated from 2000 simulated days, the metric reads 0.8727 at the defaults. For 20 independent tokens it reads 0.0466 instead of 0, close to the known upward bias \(n(n-1)/(4N) = 0.0475\) of this estimate, which is one thing "approximated correctly" has to handle.</figcaption>
