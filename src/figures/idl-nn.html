<p class="fig__title">A hidden layer with a nonlinear activation lets the network bend its decision boundary, and with a linear activation the whole network collapses to logistic regression.</p>
<div class="fig__stage" data-fig="idl-nn"></div>
<figcaption>A network with inputs \(x_1, x_2\), one hidden layer of \(H\) units \(a^{(1)}_j\), and one sigmoid output \(h\), trained on 200 points by gradient descent on the cross entropy cost with \(\alpha = 1\). The weights start at random values in \([-1, 1]\) and the biases at 0, as in the text. The shading is the network's \(h\), the black curve is \(h = 0.5\), and each edge in the diagram is drawn thicker the larger its weight. On the circles with \(H = 4\), a sigmoid hidden layer reaches a cost of 0.0201 and 100.0% accuracy after 3000 epochs. Switch the activation to linear and the boundary stays a straight line: the cost stalls at 0.6930 with 50.0% accuracy, because stacking linear functions gives another linear function, so the network is logistic regression with \(\theta = (\theta_0, \theta_1, \theta_2)\) computed from its weights. The dashed line drawn from that \(\theta\) sits exactly on the boundary. With \(H = 1\) even the sigmoid network draws a straight boundary and gets 68.0% on the circles. On XOR at \(H = 4\), sigmoid reaches 99.0% and linear 52.0%.</figcaption>
