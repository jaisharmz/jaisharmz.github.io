<p class="fig__title">The Fokker-Planck equation moves the whole density deterministically, and it lands where a histogram of many noisy particles lands.</p>
<div class="fig__stage" data-fig="diff-fokker-planck"></div>
<figcaption>Starting from \(0.4\,N(-2.5, 0.35^2) + 0.6\,N(2, 0.35^2)\), the orange curve solves \(\partial P/\partial t = -\partial_x[f(x)P] + D\,\partial^2 P/\partial x^2\) with a conservative finite-volume scheme on 560 cells. The bars are a histogram of particles that each run the matching SDE \(dx = f\,dt + \sqrt{2D}\,dw\), since the Reverse SDE section shows that \(g(t)^2 = 2D\). The figure takes \(f(x) = -x\) and \(D = 1\), which is the forward SDE's drift \(-\tfrac{1}{2}\beta(t)\,x\) with \(\beta\) held at 2, so with both terms on the density settles to the dashed \(N(0, 1)\). Press play. At \(t = 3\) the L1 gap between the curve and 2000 particles is 0.084. It falls to 0.035 with 8000 particles and rises to 0.168 with 500, the \(1/\sqrt{N}\) shrinkage of sampling noise, while the PDE's total mass stays at 1.000000. The PDE's mean follows \(m(t) = m(0)\,e^{-t}\) from the forward SDE section, 0.0736 at \(t = 1\). Turn diffusion off and both blobs slide into a spike at the center. Turn drift off and they only spread.</figcaption>
