<p class="fig__title">With few predictor steps the reverse SDE lands off the data, and a few Langevin corrector steps at each noise level pull the samples back.</p>
<div class="fig__stage" data-fig="diff-predictor-corrector"></div>
<figcaption>2000 samples start from \(N(0,1)\) at \(t = 1\) and run the reverse SDE to \(t = 0.001\) in \(N\) Euler-Maruyama predictor steps. After each one, \(K\) corrector steps \(x \leftarrow x + \epsilon\, s_\theta(x,t) + \sqrt{2\epsilon}\,z\) run at the new \(t\), with \(\epsilon\) set to half the variance of one mixture component of \(P(x,t)\), \(\epsilon = \tfrac{1}{2}(\alpha^2 s^2 + 1 - \alpha^2)\). The data are \(0.7\,N(-1, 0.15^2) + 0.3\,N(1.2, 0.15^2)\), and the exact score stands in for \(s_\theta\). The right panel plots the 1-Wasserstein distance \(W_1\) to the true density. At the default \(N = 10\) the predictor alone gives \(W_1 = 0.346\), one corrector step per level brings it to 0.167, and two bring it to 0.123, against 0.021 expected from 2000 exact draws. At \(N = 3\) the predictor alone overshoots, with 48% of samples off the plot and \(W_1 = 2.556\), and \(K = 2\) pulls it back to 0.311. Each corrector step costs one more score evaluation, so switch the x-axis to score evaluations. At 20 evaluations, \(N = 20\) with \(K = 0\) reaches 0.076, better than \(N = 10\) with \(K = 1\), so on this toy extra predictor steps beat corrector steps. At large \(N\) the corrector hurts. At \(N = 200\), \(K = 0\) gives 0.008 and \(K = 1\) gives 0.055 (0.004 against 0.043 in a 20,000-sample check), because the corrector's own step error acts like a slightly higher temperature, which pulls the mode weights toward equal: 0.680 instead of 0.70.</figcaption>
