<p class="fig__title">Only random kicks of strength \(C = 2\gamma k_B T\), set by the drag, give the equipartition spread \(\langle v^2 \rangle = k_B T/m\).</p>
<div class="fig__stage" data-fig="diff-equipartition"></div>
<figcaption>2000 particles start at rest and follow \(m\,dv = -\gamma v\,dt + \sqrt{C}\,dW\), the text's \(m\frac{dv}{dt} = -\gamma v + F_{\text{random}}(t)\) with white noise \(\langle F_{\text{random}}(t) F_{\text{random}}(s)\rangle = C\,\delta(t-s)\). So \(C\) is what the text calls \(\mathrm{Var}[F_{\text{random}}]\), and over a step \(\Delta t\) the random force delivers an impulse of variance \(C\,\Delta t\). Units are \(m = 1\) and \(k_B T = 1\), and each step of \(\Delta t = 0.02\) uses the exact solution of the equation, so there is no discretization error. Left: \(\langle v^2\rangle\) rises along \(\frac{C}{2\gamma m}(1 - e^{-2\gamma t/m})\), which is the text's \(v(t)\) with its integral started at \(t = 0\), and levels off at \(C/(2\gamma m)\). At the default \(C = 2\gamma k_B T\) the plateau measures 1.017 against \(k_B T/m = 1\), and over 20 other seeds it averages 0.999 with a spread of 0.011. Slide \(C\) to 0.25 times and the plateau drops to 0.254; at 4 times it reaches 4.068. The slider holds \(C\) in units of \(2\gamma k_B T\), so moving the drag moves the kicks with it and changes only the speed of the approach: the plateau is 1.032 at \(\gamma = 0.25\) and 1.005 at \(\gamma = 4\). Right: the velocity forgets its past as \(e^{-\gamma\tau/m}\), the memory weight in the text's \(v(t)\), and at \(\tau = m/\gamma\) the measured correlation is 0.379 against \(e^{-1} = 0.368\).</figcaption>
