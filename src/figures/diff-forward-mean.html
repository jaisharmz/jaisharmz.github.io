<p class="fig__title">The noising paths average out to the derived mean \(m(t)\), which reaches zero only when \(\beta(t)\) is large enough.</p>
<div class="fig__stage" data-fig="diff-forward-mean"></div>
<figcaption>150 Euler-Maruyama paths of \(dx = -\tfrac{1}{2}\beta(t)\,x\,dt + \sqrt{\beta(t)}\,dw\) from \(x_0 = 2.5\), with \(\beta_{\min} = \beta_{\max}/200\). The orange curve is the derived \(m(t) = x_0\,e^{-\frac{1}{2}\int_0^t \beta(s)\,ds}\), and the band adds two standard deviations of \(\sqrt{1-\alpha(t)^2}\), where \(\alpha(t) = e^{-\frac{1}{2}\int_0^t \beta(s)\,ds}\). At the default \(\beta_{\max} = 20\) the integral of \(\beta\) over \([0,1]\) is 10.05, so \(m(1) = 0.016\) and \(\mathrm{Var}(1) = 1.000\). The paths end with mean 0.049 and variance 0.991, which is the \(N(0,1)\) the reverse process starts from. Press \(\beta_{\max} = 0.02\), the per-step value of a 1000-step schedule read as a continuous rate. The integral drops to 0.010, \(m(1) = 2.487\) and \(\mathrm{Var}(1) = 0.010\), and the paths end at 2.490 on average with a spread of 0.10, barely noised.</figcaption>
