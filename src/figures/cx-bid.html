<p class="fig__title">The provider's best ask trades margin against the chance of winning, so expected profit peaks at an ask strictly above cost.</p>
<div class="fig__stage" data-fig="cx-bid"></div>
<figcaption>The lowest competing ask \(B^*\) follows \(\Gamma(k, \lambda)\) with shape \(k\) and rate \(\lambda\), which is the simplest reading of the text. At the defaults (\(k = 4\) and \(\lambda = 2\), so \(B^*\) has mean 2 and standard deviation 1, with \(C = 1\)), the best ask is 2.077. It wins 40.4% of the time and earns an expected 0.435 per auction, and 2000 simulated auctions at that ask win 40.3%. At the optimum the margin \(B - C\) equals \((1 - F(B))/f(B)\), the inverse hazard rate of \(B^*\), and both sides read 1.077. Raise \(C\) from 1 to 2: the best ask rises by only 0.79, to 2.868, so the provider absorbs part of the cost increase and still wins 17.6% of auctions. Set \(k = 12\) and \(\lambda = 6\) to keep the mean at 2 with tighter competition, and the margin on this toy falls from 1.08 to 0.82. Hover over the plot to price a trial ask.</figcaption>
