<p class="fig__title">Coin-flip walkers spread into the Gaussian that solves \(\partial P/\partial t = D\,\partial^2 P/\partial x^2\), whose variance grows as \(2Dt\).</p>
<div class="fig__stage" data-fig="diff-random-walk"></div>
<figcaption>Each of 4000 walkers starts at \(x = 0\) and steps \(\pm dx\) with probability \(\tfrac{1}{2}\) every \(dt\). The curve is the heat-equation solution for a start at the origin: a Gaussian with variance \(2Dt\), where \(D = dx^2/(2\,dt) = 0.5\). At \(t = 1\) with \(dx = 0.2\) the walkers have taken 25 steps, and their variance is 1.033 against \(2Dt = 1.000\). Change the step size and \(dt\) changes with it so that \(D\) stays 0.5. At \(dx = 0.05\) the walk takes 400 steps to reach \(t = 1\) and its variance is 1.029. At \(dx = 0.4\) the lattice is coarse and time moves in jumps of 0.16, yet the variance still tracks \(2Dt\) (0.971 against 0.960 at \(t = 0.96\)). The bars get finer as \(dx\) shrinks while the curve stays put, because \(dx\) and \(dt\) enter the spread only through \(D\).</figcaption>
