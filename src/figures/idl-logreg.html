<p class="fig__title">Logistic regression learns a line that splits the two classes, and when the classes can be split perfectly the cost keeps pushing after every point is already correct.</p>
<div class="fig__stage" data-fig="idl-logreg"></div>
<figcaption>Squares are \(y = 0\) and circles are \(y = 1\). The solid line is the decision boundary \(h = 0.5\), the dashed lines are \(h = 0.1\) and \(h = 0.9\), and the shading is the predicted probability. A ring marks a point on the wrong side. Gradient descent starts from \(\theta = 0\) with \(\alpha = 1\), and \(|\theta|\) is the length of \((\theta_0, \theta_1, \theta_2)\). On the separable data every point is on the right side from iteration 209, yet the cross entropy cost is still 0.0180 at iteration 1000 and 0.0004 at 100,000. It keeps falling because making \(\theta\) longer in the same direction pushes every \(h\) closer to 0 or 1, so \(|\theta|\) grows without stopping: 11.88 at iteration 1000, 21.82 at 10,000, and 35.05 at 100,000, while the band between the dashed lines shrinks to a sharp edge. Switch to the overlapping data and the cost stops at 0.3077 with 88.3% accuracy, and \(|\theta|\) settles at 3.19 by iteration 1000.</figcaption>
