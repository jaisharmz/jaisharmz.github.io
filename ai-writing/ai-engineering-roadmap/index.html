re": "Agentic RL trains the model inside its production harness: it rolls out whole episodes with real tools in sandboxes, scores the result, and updates on the model’s own tokens. Most of the work is infrastructure: many sandboxes, slow uneven rollouts, and unstable long episodes.", "reach": "Needs environments to train in, and feeds the systems that generate their own tasks and rewards.", "uses": "Cursor trained Composer with RL inside its own agent harness, Cognition trained SWE-grep for fast parallel code search, and Agentica’s open DeepSWE reached 59 percent on SWE-bench Verified with test-time scaling.", "worth": "you run an agent harness with a steady task stream and a GPU budget, and prompting has plateaued; reinforcement fine-tuning and sandboxes first. Most teams should improve the harness instead.", "resources": [{"title": "Introducing SWE-grep and SWE-grep-mini: RL for Multi-Turn, Fast Context Retrieval", "url": "https://cognition.com/blog/swe-grep", "type": "blog", "by": "Cognition, 2025", "level": 1, "note": "Speeds are Cognition’s own; the training section covers the reward, parallel tool calls, and fixes for unstable rollouts."}, {"title": "DeepSWE: Training a Fully Open-sourced, State-of-the-Art Coding Agent by Scaling RL", "url": "https://www.together.ai/blog/deepswe", "type": "blog", "by": "Agentica and Together AI, 2025", "level": 2, "note": "Code, data, and training logs are open."}, {"title": "Composer: Building a fast frontier model with RL", "url": "https://cursor.com/blog/composer", "type": "blog", "by": "Cursor, 2025", "level": 1, "note": "Cursor’s own claims, measured on its internal benchmark."}, {"title": "RAGEN: Understanding Self-Evolution in LLM Agents via Multi-Turn Reinforcement Learning", "url": "https://arxiv.org/abs/2504.20073", "type": "paper", "by": "Wang et al., 2025", "level": 3}, {"title": "The Landscape of Agentic Reinforcement Learning for LLMs: A Survey", "url": "https://arxiv.org/html/2509.02547v5#S2", "type": "section", "by": "Zhang et al., 2025", "level": 2, "section": "Section 2, Preliminary: From LLM RL to Agentic RL", "covers": "How agent training differs from RL on single replies: a partially observed, multistep process with text and tool actions, changing state, and rewards on task completion or step progress."}, {"title": "ART•E LangGraph notebook", "url": "https://github.com/OpenPipe/art-notebooks/blob/main/examples/langgraph/art-e-langgraph.ipynb", "type": "project", "by": "OpenPipe, 2025", "level": 2, "note": "RULER calls an OpenAI model as its judge, so you need an API key.", "build": "A Qwen 2.5 7B agent that searches and reads emails through LangGraph tools, trained with GRPO under a judge reward and an exact-match reward.", "teaches": "What a rollout, a group, and a reward look like when the episode is a tool loop, and how the choice of reward changes what the agent learns.", "time": "a weekend", "mode": "Code along, then change it", "task": "Run OpenPipe’s ART•E LangGraph notebook on a Colab T4 to train Qwen 2.5 7B to answer questions from an email inbox, then swap the RULER judge reward for the exact-match check and compare."}]}, {"id": "envs", "title": "Building RL environments", "kind": "concept", "track": "adapt", "pre": ["agenticrl", "agentbench"], "frontier": true, "core": "An environment is a set of tasks, the sandbox and tools the agent uses, and a grader for each attempt. A good one is built like an eval an optimizer will attack: the tests are hidden, a gold answer passes, and an untouched task fails.", "reach": "Every agent benchmark is most of an environment, and self-generated tasks extend it to environments a model writes for itself.", "uses": "Repositories whose tests grade coding agents, as in SWE-bench; Prime Intellect’s Environments Hub; the environments startups sell to AI labs; and in-house evals, which become training environments once they have a scorer.", "worth": "you will train agents with RL or write evals that others will optimize against; agentic RL and agent benchmarks first. If you only call hosted models, a solid eval is enough.", "resources": [{"title": "The Second Half", "url": "https://ysymyth.github.io/The-Second-Half/", "type": "blog", "by": "Shunyu Yao, 2025", "level": 1}, {"title": "verifiers: Overview", "url": "https://github.com/PrimeIntellect-ai/verifiers/blob/main/docs/overview.md", "type": "code", "by": "Prime Intellect, 2026", "level": 1, "note": "The parts of an environment as one library names them: taskset, harness, agent, environment, toolset, and trace."}, {"title": "Reward Hacking in Reinforcement Learning", "url": "https://lilianweng.github.io/posts/2024-11-28-reward-hacking/", "type": "blog", "by": "Lilian Weng, 2024", "level": 2}, {"title": "SWE-smith: Scaling Data for Software Engineering Agents", "url": "https://arxiv.org/abs/2504.21798", "type": "paper", "by": "Yang et al., Stanford and Princeton, 2025", "level": 2}, {"title": "Natural Emergent Misalignment from Reward Hacking in Production RL", "url": "https://arxiv.org/abs/2511.18397", "type": "paper", "by": "MacDiarmid et al., Anthropic and Redwood Research, 2025", "level": 3}, {"title": "Build and validate a verifiers environment", "url": "https://github.com/PrimeIntellect-ai/verifiers/blob/main/docs/building-environments.md", "type": "project", "by": "Prime Intellect, 2026", "level": 2, "note": "If the small model scores as well as the large one, fix the grader before you train on it.", "build": "An installable environment with a hidden grader in a separate sandbox, passing validation, with reward distributions for two models.", "teaches": "What each task, tool, and grader needs before training starts, and how to tell a grader that measures skill from one the agent can game.", "time": "a weekend", "mode": "Code along, then change it", "task": "Follow the verifiers guide to package a taskset for a task a program can grade, pass vf-validate on its gold and untouched cases, then run vf-eval with a small and a large model."}]}, {"id": "openweights", "title": "Running open-weight models", "kind": "concept", "track": "serving", "pre": ["costlat"], "frontier": false, "core": "Self-hosting lets you pick the model and precision and keep data private. At 4 bits a 27B model takes 17 GB, enough for a 32 GB laptop; on a GPU, vLLM serves it behind an API. You pay for GPU hours, used or not.", "reach": "Batching and speculative decoding make it cheap to serve, and every weight change in the adapting track starts from open weights.", "uses": "Ollama and LM Studio on laptops; gpt-oss and Qwen served on private GPUs for data that cannot leave; models you fine-tuned yourself; and every RL training run, which needs weights it can update.", "worth": "your data cannot leave, your volume is high and steady, or you plan to fine-tune; cost per task first. For a prototype or spiky traffic, a hosted API is cheaper.", "resources": [{"title": "OpenAI’s new open weight (Apache 2) models are really good", "url": "https://simonwillison.net/2025/Aug/5/gpt-oss/", "type": "blog", "by": "Simon Willison, 2025", "level": 1, "note": "The LM Studio and Ollama steps, with memory and speed for the 20B model."}, {"title": "A Visual Guide to Quantization", "url": "https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization", "type": "blog", "by": "Maarten Grootendorst, 2024", "level": 1}, {"title": "Quickstart", "url": "https://docs.vllm.ai/en/latest/getting_started/quickstart/", "type": "tutorial", "by": "vLLM project", "level": 1, "note": "Serving a model behind an OpenAI-compatible API on a GPU server."}, {"title": "Inference Engineering", "url": "https://www.baseten.co/inference-engineering/", "type": "book", "by": "Philip Kiely, Baseten, 2026", "level": 2, "note": "Chapter 1 on choosing a model and budgeting latency and cost; Chapter 4 on inference engines."}, {"title": "AWQ: Activation-aware Weight Quantization for LLM Compression and Acceleration", "url": "https://arxiv.org/abs/2306.00978", "type": "paper", "by": "Lin et al., MIT, 2024", "level": 2}, {"title": "Quantize one model with llama.cpp and measure each step down", "url": "https://github.com/ggml-org/llama.cpp/tree/master/tools/quantize", "type": "project", "by": "ggml-org, llama.cpp", "level": 1, "build": "Four quantized copies of one model, each with its file size, KL divergence from the 16-bit model, and tokens per second on your machine.", "teaches": "Where quality starts to fall as bits drop, and how memory and speed on your own hardware decide which model you can run.", "time": "a day", "mode": "Apply it", "task": "Convert one open model to GGUF, quantize it to Q8_0, Q6_K, Q4_K_M, and Q2_K with llama-quantize, then measure each with llama-perplexity against the 16-bit model and with llama-bench."}]}, {"id": "batching", "title": "Batching and paged attention", "kind": "concept", "track": "serving", "pre": ["openweights"], "frontier": false, "core": "Decoding one request leaves a GPU mostly reading weights, so serving many together costs little more per step. Continuous batching swaps requests in and out each step, and a paged KV cache fits more of them. Batch size trades each user’s speed for total throughput.", "reach": "Sets your cost per token on open weights, and its prefix caching is why stable prompt prefixes get cheaper.", "uses": "Every serving engine, including vLLM, SGLang, and TensorRT-LLM; the OpenAI and Anthropic batch APIs, which charge half for jobs that can wait; and RL training, where generating rollouts is a large batch inference job.", "worth": "you serve open weights or generate rollouts or synthetic data at scale; running open weights first. If you only call APIs, knowing why batch endpoints cost half is enough.", "resources": [{"title": "How continuous batching enables 23x throughput in LLM inference while reducing p50 latency", "url": "https://www.anyscale.com/blog/continuous-batching-llm-inference", "type": "blog", "by": "Daniel, Shen, Liang, Liaw, Anyscale, 2023", "level": 1}, {"title": "Optimization and Tuning", "url": "https://docs.vllm.ai/en/latest/configuration/optimization/", "type": "tutorial", "by": "vLLM project", "level": 2, "note": "Preemption, chunked prefill, and the max_num_seqs and max_num_batched_tokens settings."}, {"title": "Orca: A Distributed Serving System for Transformer-Based Generative Models", "url": "https://www.usenix.org/conference/osdi22/presentation/yu", "type": "paper", "by": "Yu et al., Seoul National University, OSDI 2022", "level": 2}, {"title": "Efficient Memory Management for Large Language Model Serving with PagedAttention", "url": "https://arxiv.org/abs/2309.06180", "type": "paper", "by": "Kwon et al., Berkeley, 2023", "level": 2}, {"title": "Fast and Expressive LLM Inference with RadixAttention and SGLang", "url": "https://lmsys.org/blog/2024-01-17-sglang/", "type": "blog", "by": "Zheng et al., LMSYS, 2024", "level": 2}, {"title": "Sweep vLLM’s batch size and load, then price the result", "url": "https://docs.vllm.ai/en/latest/benchmarking/sweeps/", "type": "project", "by": "vLLM project, 2026", "level": 2, "build": "A Pareto plot of tokens per second per user against tokens per second per GPU, with a cost per million output tokens at each point.", "teaches": "How batching trades one user’s speed for total throughput, and what your own price per token is next to an API’s.", "time": "a day", "mode": "Apply it", "task": "Serve one open model with vLLM on a rented GPU, run vllm bench sweep over max_num_seqs and request rate on ShareGPT, plot the Pareto frontier, and convert each point to dollars per million tokens.", "signature": true}]}, {"id": "specdec", "title": "Speculative decoding", "kind": "concept", "track": "serving", "pre": ["batching"], "frontier": false, "core": "A cheap drafter guesses the next few tokens and the large model checks them in one pass, keeping the agreed prefix, so outputs follow the same distribution. It cuts latency on a lightly loaded server with predictable output, and it can slow a busy one.", "reach": "Drafts copied from the prompt suit agents and code edits, which repeat their context.", "uses": "vLLM and SGLang serve EAGLE-3 drafters, DeepSeek-V3’s multi-token prediction head doubles as a drafter, Snowflake’s Arctic Inference speeds up repetitive agent output with SuffixDecoding, and Cursor drafts file rewrites from the original file.", "worth": "you serve open models where latency matters at modest load; batching first. On hosted APIs the provider decides, so knowing why repetitive output streams faster is enough.", "resources": [{"title": "How Speculative Decoding Boosts vLLM Performance by up to 2.8x", "url": "https://vllm.ai/blog/2024-10-17-spec-decode", "type": "blog", "by": "vLLM team, 2024", "level": 1}, {"title": "Fast Inference from Transformers via Speculative Decoding", "url": "https://arxiv.org/abs/2211.17192", "type": "paper", "by": "Leviathan, Kalman, Matias, Google, 2023", "level": 2}, {"title": "Speculative Decoding", "url": "https://docs.vllm.ai/en/latest/features/speculative_decoding/", "type": "tutorial", "by": "vLLM project", "level": 2, "note": "The summary table of methods by load; each method has its own page."}, {"title": "EAGLE-3: Scaling up Inference Acceleration of Large Language Models via Training-Time Test", "url": "https://arxiv.org/abs/2503.01840", "type": "paper", "by": "Li, Wei, Zhang, Zhang, 2025", "level": 2}, {"title": "SuffixDecoding: Extreme Speculative Decoding for Emerging AI Applications", "url": "https://arxiv.org/abs/2411.04975", "type": "paper", "by": "Oliaro, Jia, Campos, Qiao, Snowflake and CMU, 2024", "level": 3}, {"title": "Find where speculative decoding pays in vLLM", "url": "https://docs.vllm.ai/en/latest/features/speculative_decoding/", "type": "project", "by": "vLLM project, 2026", "level": 2, "build": "A table of inter-token latency and throughput for three speculation settings, two workloads, and two load levels, with acceptance rates.", "teaches": "Which workloads and loads speculation helps, and why copying from the prompt does well on summaries and code edits.", "time": "a day", "mode": "Apply it", "task": "Serve one model in vLLM with no speculation, n-gram speculation, and an EAGLE-3 drafter, then benchmark each with vllm bench serve on chat and summarization prompts at low and high request rates."}]}, {"id": "routing", "title": "Model routing and cascades", "kind": "concept", "track": "serving", "pre": ["costlat", "evaldesign"], "frontier": false, "core": "Most queries do not need the best model. A router predicts which model is good enough for each query; a cascade tries the cheap model and escalates when a check fails. Both need an eval scored on every model, and a threshold sets the cost.", "reach": "Turns cost per task and eval design into savings; Poetiq reports that its metasystem wrote a router of its own.", "uses": "ChatGPT’s GPT-5 router picks between a fast model and a thinking model, OpenRouter’s Auto Router picks a model per request, coding agents hand small subtasks to small models, and support bots escalate to a larger model or a person.", "worth": "you pay for a high, mixed query volume and have an eval that scores several models; eval design first. At low volume, picking one good model is simpler.", "resources": [{"title": "RouteLLM: An Open-Source Framework for Cost-Effective LLM Routing", "url": "https://lmsys.org/blog/2024-07-01-routellm/", "type": "blog", "by": "Ong et al., LMSYS, 2024", "level": 1}, {"title": "FrugalGPT: How to Use Large Language Models While Reducing Cost and Improving Performance", "url": "https://arxiv.org/abs/2305.05176", "type": "paper", "by": "Chen, Zaharia, Zou, Stanford, 2023", "level": 2}, {"title": "Our Metasystem Built and Optimized an LLM Router", "url": "https://poetiq.ai/posts/llm_router/", "type": "blog", "by": "Poetiq, 2026", "level": 2, "note": "Self-reported, on question sets Poetiq generated, with no independent check."}, {"title": "Large Language Model Cascades with Mixture of Thoughts Representations for Cost-efficient Reasoning", "url": "https://arxiv.org/abs/2310.03094", "type": "paper", "by": "Yue et al., 2024", "level": 2}, {"title": "RouterBench: A Benchmark for Multi-LLM Routing System", "url": "https://arxiv.org/abs/2403.12031", "type": "paper", "by": "Hu et al., Martian, 2024", "level": 3}, {"title": "RouteLLM: Learning to Route LLMs with Preference Data", "url": "https://arxiv.org/html/2406.18665v4#S2", "type": "section", "by": "Ong et al., 2024", "level": 2, "section": "Section 2, Related Work", "covers": "The routing lineage in a page: ensembles that query every model, cascades such as FrugalGPT and AutoMix that pay for extra calls, and single-call routers such as Hybrid LLM."}, {"title": "RouteLLM: evaluate routers, then write one", "url": "https://github.com/lm-sys/RouteLLM", "type": "project", "by": "LMSYS, 2024", "level": 2, "note": "The mf router needs an OpenAI key for embeddings.", "build": "Cost and quality curves for four routers on two benchmarks, one of them a router you wrote.", "teaches": "How much a learned router beats random routing, how the threshold sets the share of strong calls, and how hard a better router is to write.", "time": "a day", "mode": "Extend it", "task": "Run RouteLLM’s evaluate script on GSM8K and MT Bench for the random, bert, and mf routers from its cached results, then implement a router of your own and add it to the plot."}]}, {"id": "injection", "title": "Prompt injection", "kind": "concept", "track": "prod", "pre": ["tooluse"], "frontier": false, "core": "A model cannot reliably tell its developer’s instructions from instructions planted in text it reads, so any web page, email, or file can steer an agent. An agent with private data, untrusted input, and a way to send data out can be made to leak.", "reach": "Guardrails, permissions, and sandboxes answer this threat, and each defense against it has to be tested by an adaptive attacker.", "uses": "Securing anything that reads untrusted text: Simon Willison lists working exploits against Microsoft 365 Copilot, GitHub’s MCP server, and GitLab Duo. Browser agents, email assistants, coding agents that read issues, and retrieval over shared documents all inherit the problem.", "worth": "you give a model tools, private data, or a way to send messages; tool calling is the only prerequisite. Text in, text out apps holding no secrets can skip it.", "resources": [{"title": "The lethal trifecta for AI agents: private data, untrusted content, and external communication", "url": "https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/", "type": "blog", "by": "Simon Willison, 2025", "level": 1, "note": "The three ingredients, a list of real exploits, and why a filter that stops 95 percent of attacks fails as security."}, {"title": "Not what you’ve signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection", "url": "https://arxiv.org/abs/2302.12173", "type": "paper", "by": "Greshake et al., 2023", "level": 2, "note": "Names indirect prompt injection and demonstrates it on Bing Chat and code completion, with data theft, fraud, and malware as payloads."}, {"title": "AgentDojo: A Dynamic Environment to Evaluate Prompt Injection Attacks and Defenses for LLM Agents", "url": "https://arxiv.org/abs/2406.13352", "type": "paper", "by": "Debenedetti et al., ETH Zurich, 2024", "level": 2, "note": "97 tasks and 629 security test cases across workspace, banking, travel, and Slack tools, with attacks and defenses you can swap in."}, {"title": "The Attacker Moves Second: Stronger Adaptive Attacks Bypass Defenses Against Llm Jailbreaks and Prompt Injections", "url": "https://arxiv.org/abs/2510.09023", "type": "paper", "by": "Nasr, Carlini et al., 2025", "level": 3, "note": "Attacks tuned to each defense break 12 published ones, most above 90 percent success, though most had reported near zero."}, {"title": "LLM01:2025 Prompt Injection", "url": "https://genai.owasp.org/llmrisk/llm01-prompt-injection/", "type": "notes", "by": "OWASP GenAI Security Project, 2025", "level": 1, "note": "The industry checklist entry: direct and indirect injection, example scenarios, and mitigations."}, {"title": "Not what you’ve signed up for: Compromising Real-World LLM-Integrated Applications with Indirect Prompt Injection", "url": "https://arxiv.org/html/2302.12173v2#S3", "type": "section", "by": "Greshake et al., 2023", "level": 1, "section": "Section 3, Attack Surface of LLM-Integrated Applications", "covers": "How planted prompts reach a model, through retrieved pages, incoming email, text a user pastes, or hidden and encoded payloads, and the threats each one opens."}, {"title": "AgentDojo", "url": "https://github.com/ethz-spylab/agentdojo", "type": "project", "by": "Debenedetti et al., ETH Zurich, 2024", "level": 2, "note": "Start with one suite and a few user tasks to check the setup; a full run makes thousands of model calls, and the tool_filter defense needs an OpenAI model.", "build": "Utility and targeted attack success rates for one model across AgentDojo’s four suites, undefended and under two defenses, set beside the published results.", "teaches": "That every defense trades solved tasks for security, and how much injection success survives the common defenses.", "time": "a weekend", "mode": "Apply it", "task": "Run AgentDojo’s benchmark script on one model under the important_instructions attack with no defense, then with spotlighting_with_delimiting and with transformers_pi_detector, and compare utility and attack success across runs.", "signature": true}]}, {"id": "guardrails", "title": "Guardrails and output checks", "kind": "concept", "track": "prod", "pre": ["injection", "judge"], "frontier": false, "core": "Wrap the model in fast checks: a classifier on input, schema and policy checks on output, and a block or retry when one fires. Set each threshold on labeled data at a false positive rate users tolerate, and assume a determined attacker gets through.", "reach": "Guardrails reuse judges as inline checks; against injection they lower the odds, and permissions limit the damage when one misses.", "uses": "Anthropic’s Constitutional Classifiers screen Claude traffic for weapons jailbreaks, Meta releases Llama Guard alongside Llama, and the OpenAI Agents SDK runs input, output, and tool guardrails as tripwires. Products also use them for topic limits, PII redaction, and schema checks.", "worth": "you serve a model to the public or under a content policy; judges and injection first, and measure each guardrail’s false positive rate on real traffic before trusting it.", "resources": [{"title": "Guardrails", "url": "https://openai.github.io/openai-agents-python/guardrails/", "type": "notes", "by": "OpenAI Agents SDK, 2026", "level": 1, "note": "Input, output, and tool guardrails as tripwires, and the latency trade between running a check beside the model or before it."}, {"title": "Llama Guard: LLM-based Input-Output Safeguard for Human-AI Conversations", "url": "https://arxiv.org/abs/2312.06674", "type": "paper", "by": "Inan et al., Meta, 2023", "level": 2, "note": "A Llama 2 7B classifier that reads the policy from its prompt and labels both user prompts and model responses as safe or unsafe."}, {"title": "Constitutional Classifiers++: Efficient Production-Grade Defenses against Universal Jailbreaks", "url": "https://arxiv.org/abs/2601.04603", "type": "paper", "by": "Cunningham, Wei et al., Anthropic, 2026", "level": 3, "note": "A cheap probe screens all traffic and escalates suspicious exchanges, cutting cost 40 times at a 0.05 percent refusal rate; the first version is arXiv 2501.18837."}, {"title": "The Attacker Moves Second: Stronger Adaptive Attacks Bypass Defenses Against Llm Jailbreaks and Prompt Injections", "url": "https://arxiv.org/html/2510.09023v1#S2", "type": "section", "by": "Nasr, Carlini et al., 2025", "level": 2, "section": "Section 2, A Brief History of Adversarial ML Evaluations", "covers": "Why security counts a defense as robust only against adaptive attackers, and why most LLM defenses are still tested on static prompt sets or cheap optimizers that humans routinely beat."}, {"title": "Agent Breaker", "url": "https://play.lakera.ai/agent-breaker", "type": "project", "by": "Lakera, 2025", "level": 1, "build": "A log of the attacks that cleared each level, typed directly or hidden in a document or webpage the app reads, against defenses that tighten level by level.", "teaches": "How quickly a single filter falls to rephrasing, and why layered checks hold out longer than any one of them.", "time": "an afternoon", "mode": "Enter the challenge", "task": "Pick two of the hackable apps and clear their levels with prompt attacks that score 75 or more, logging the defense at each level and the attack that beat it."}, {"title": "Score ToxicChat with Llama Guard", "url": "https://arxiv.org/abs/2312.06674", "type": "project", "by": "Built on Inan et al., Meta, 2023", "level": 2, "note": "The weights are meta-llama/LlamaGuard-7b on Hugging Face, behind a license click; the data is lmsys/toxic-chat.", "build": "A precision and recall curve for Llama Guard on real user prompts, and a chosen operating threshold with its recall and false positive rate.", "teaches": "That a guardrail is a classifier with an operating point, and how many harmful prompts a low false positive rate lets through.", "time": "a day", "mode": "Reproduce a result", "task": "Run Llama Guard 7B zero shot with ToxicChat’s taxonomy over ToxicChat’s test split, compute AUPRC from the unsafe token probability, then pick the threshold that gives a 1 percent false positive rate.", "made": true, "done": "AUPRC on the ToxicChat test split lands within a few points of the paper’s 0.626, above the 0.588 it reports for the OpenAI Moderation API in Table 2."}]}, {"id": "permissions", "title": "Permissions and least privilege for agents", "kind": "concept", "track": "prod", "pre": ["injection", "sandbox"], "frontier": false, "core": "Give an agent only the tools, files, credentials, and network access its task needs, and ask a person before irreversible actions. Then keep untrusted text from choosing actions, for example by fixing the plan before the agent reads any data.", "reach": "Least privilege bounds what a successful prompt injection can do, and leaves monitors fewer and narrower actions to watch.", "uses": "Claude Code’s sandbox limits writes to the project folder and network access to approved domains, Codex runs commands in a sandboxed workspace, and the same thinking hands an agent read-only database credentials or one mailbox instead of the whole account.", "worth": "you let an agent act on real systems; injection and sandboxes first, and plan to apply it to every agent whose tools change state or send data.", "resources": [{"title": "Agents Rule of Two: A Practical Approach to AI Agent Security", "url": "https://ai.meta.com/blog/practical-ai-agent-security/", "type": "blog", "by": "Meta AI, 2025", "level": 1, "note": "In one session an agent may have at most two of untrusted input, private data, and the ability to change state or send data out; all three need a human."}, {"title": "Beyond permission prompts: making Claude Code more secure and autonomous", "url": "https://www.anthropic.com/research/claude-code-sandboxing", "type": "blog", "by": "Dworken, Weller-Davies, Anthropic, 2025", "level": 1, "note": "Filesystem and network isolation for a coding agent, which cut permission prompts by 84 percent in internal use; the sandbox runtime is open source."}, {"title": "Design Patterns for Securing LLM Agents against Prompt Injections", "url": "https://arxiv.org/abs/2506.08837", "type": "paper", "by": "Beurer-Kellner et al., 2025", "level": 2, "note": "Six architectures, from action selector to context minimization, each giving up some utility for resistance by construction, worked through ten case studies."}, {"title": "Defeating Prompt Injections by Design", "url": "https://arxiv.org/abs/2503.18813", "type": "paper", "by": "Debenedetti et al., Google DeepMind and ETH Zurich, 2025", "level": 3, "note": "CaMeL: a privileged model writes the plan as code, a quarantined model reads untrusted data, and capabilities block disallowed data flows; 77 percent of AgentDojo tasks solved with provable security."}, {"title": "LLM06:2025 Excessive Agency", "url": "https://genai.owasp.org/llmrisk/llm062025-excessive-agency/", "type": "notes", "by": "OWASP GenAI Security Project, 2025", "level": 1, "note": "Splits the problem into excessive functionality, permissions, and autonomy, with mitigations such as read-only credentials and authorization enforced downstream."}, {"title": "Design Patterns for Securing LLM Agents against Prompt Injections", "url": "https://arxiv.org/html/2506.08837v3#S3.SS1", "type": "section", "by": "Beurer-Kellner et al., 2025", "level": 1, "section": "Section 3.1, Design Patterns for Securing LLM Agents", "covers": "The six patterns, with a diagram each: action selector, plan then execute, map reduce, dual LLM, code then execute, and context minimization, and what each one stops."}, {"title": "CaMeL on AgentDojo", "url": "https://github.com/google-research/camel-prompt-injection", "type": "project", "by": "Debenedetti et al., Google, 2025", "level": 3, "note": "A research artifact; the authors warn that the interpreter has bugs and is unsupported.", "build": "CaMeL’s interpreter, with its privileged and quarantined models and its security policies, run over AgentDojo’s suites with and without attacks.", "teaches": "What it costs in solved tasks to stop untrusted data from changing an agent’s plan, and which tasks that design cannot do.", "time": "a weekend", "mode": "Reproduce a result", "task": "Run the repository’s main.py against AgentDojo with one supported model, with and without --run-attack, and compare its utility with the paper’s 77 percent and its attack success with the undefended agent’s."}]}, {"id": "monitoring", "title": "Monitoring agents and AI control", "kind": "concept", "track": "prod", "pre": ["tracing", "judge", "permissions"], "frontier": true, "core": "Assume an agent may misbehave and watch it: a trusted model scores each action and its reasoning for suspicion, and the most suspicious go to a human or get blocked. A red team playing the agent tests the setup, scored as safety against usefulness.", "reach": "Monitors build on traces and permissions; OpenAI’s monitor for its internal coding agents carries control research into production.", "uses": "OpenAI’s monitor reviews its internal coding agents’ actions and reasoning within 30 minutes and escalates cases such as encoded commands and credential extraction; UK AISI’s ControlArena tests such protocols against red teams before they are trusted.", "worth": "you deploy agents with real access or work on AI safety; tracing and permissions first. Product teams can start with a judge over traces and leave red team protocols for later.", "resources": [{"title": "How we monitor internal coding agents for misalignment", "url": "https://openai.com/index/how-we-monitor-internal-coding-agents-misalignment/", "type": "blog", "by": "OpenAI, 2026", "level": 1, "note": "A monitor reads internal coding agents’ actions and chains of thought within 30 minutes and escalates to people; it flagged every case employees reported."}, {"title": "The case for ensuring that powerful AIs are controlled", "url": "https://blog.redwoodresearch.org/p/the-case-for-ensuring-that-powerful", "type": "blog", "by": "Greenblatt, Shlegeris, Redwood Research, 2024", "level": 1, "note": "Why to plan for an agent that may be trying to evade you, and why safety under that assumption can be tested."}, {"title": "AI Control: Improving Safety Despite Intentional Subversion", "url": "https://arxiv.org/abs/2312.06942", "type": "paper", "by": "Greenblatt, Shlegeris, Sachan, Roger, 2023", "level": 2, "note": "Trusted monitoring, defer to trusted, and trusted editing, tested against a red team that hides backdoors in code."}, {"title": "Ctrl-Z: Controlling AI Agents via Resampling", "url": "https://arxiv.org/abs/2504.10374", "type": "paper", "by": "Bhatt et al., Redwood Research, 2025", "level": 2, "note": "Control for a multistep bash agent; resampling suspicious actions cuts attack success from 58 to 7 percent at a 5 percent cost to useful work."}, {"title": "Monitoring Reasoning Models for Misbehavior and the Risks of Promoting Obfuscation", "url": "https://arxiv.org/abs/2503.11926", "type": "paper", "by": "Baker et al., OpenAI, 2025", "level": 3, "note": "GPT-4o reading o3-mini’s chain of thought catches reward hacking that actions alone hide, but training against the monitor teaches the model to hide its intent."}, {"title": "Ctrl-Z: Controlling AI Agents via Resampling", "url": "https://arxiv.org/html/2504.10374v1#S3.SS1", "type": "section", "by": "Bhatt et al., Redwood Research, 2025", "level": 2, "section": "Section 3.1, Existing Protocols", "covers": "Upfront auditing, trusted monitoring with a 1 percent audit budget, and defer to trusted, restated for an agent, with the safety each reaches on BashBench."}, {"title": "ARENA 3.5: AI Control", "url": "https://learn.arena.education/chapter3_llm_evals/05_ai_control/intro", "type": "project", "by": "ARENA, 2026", "level": 3, "build": "A control experiment: a model that writes backdoored code, a monitor that tries to catch it, and protocols scored on safety against usefulness.", "teaches": "How to keep a model useful while assuming it may be working against you, and what each protocol costs.", "time": "a weekend", "mode": "Do the assignment", "task": "Fill in ARENA 3.5’s notebook to build the backdoor generator, the monitor, and the four control protocols, then run its Monte Carlo analysis and plot safety against usefulness for each."}, {"title": "ControlArena tutorial", "url": "https://control-arena.aisi.org.uk/tutorial.html", "type": "project", "by": "UK AI Security Institute and Redwood Research, 2025", "level": 2, "build": "A control evaluation with untrusted and trusted models, a suspicion monitor, and defer to trusted, scored for safety and usefulness at several thresholds.", "teaches": "How a monitor’s threshold trades caught attacks against lost useful work, measured with a library built for control research.", "time": "a day", "mode": "Code along, then change it", "task": "Code along with the tutorial to run defer to trusted on its programming tasks in honest and attack modes, then sweep the deferral threshold and plot safety against usefulness."}]}, {"id": "reliability", "title": "Durable execution and retries", "kind": "concept", "track": "prod", "pre": ["agentloop"], "frontier": false, "core": "A long agent run will hit rate limits, timeouts, and crashes, so save the result of each model and tool call as it finishes. Retry transient errors with exponential backoff and jitter, make side effects safe to repeat, and resume from the last saved step.", "reach": "Durable workflow engines such as Temporal provide it, so long-running agents and human approval steps survive restarts.", "uses": "Any agent run longer than a few minutes: Anthropic’s research system resumes agents from where they failed, Temporal replays workflow history after a crash, and LangGraph checkpoints graph state so a run can wait days for a human approval.", "worth": "your agents run for minutes to hours, call paid APIs, or wait on people; the agent loop is the only prerequisite, and single call apps can skip it.", "resources": [{"title": "How we built our multi-agent research system", "url": "https://www.anthropic.com/research/multi-agent-research-system", "type": "blog", "by": "Hadfield, Zhang, Lien et al., Anthropic, 2025", "level": 1, "note": "Read the section on production reliability: errors compound in stateful agents, so the system resumes from where an agent failed and deploys gradually."}, {"title": "Timeouts, retries, and backoff with jitter", "url": "https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/", "type": "blog", "by": "Marc Brooker, Amazon Builders’ Library, 2019", "level": 2, "note": "Retry at one layer, cap the backoff, add jitter, and retry only idempotent calls; three retries at each of five layers multiply load 243 times."}, {"title": "The definitive guide to Durable Execution", "url": "https://temporal.io/blog/what-is-durable-execution", "type": "blog", "by": "Tom Wheeler, Temporal, 2025", "level": 2, "note": "Execution that keeps its state through a crash and continues on another machine, for runs lasting seconds to years."}, {"title": "12-Factor Agents", "url": "https://github.com/humanlayer/12-factor-agents", "type": "notes", "by": "Dex Horthy, HumanLayer, 2025", "level": 2, "note": "Factors 5, 6, 8, and 12 cover unified state, launch, pause, and resume, owning the control flow, and the agent as a stateless reducer."}, {"title": "How To Build a Durable AI Agent with Temporal and Python", "url": "https://learn.temporal.io/tutorials/ai/durable-ai-agent/", "type": "project", "by": "Temporal, 2025", "level": 2, "build": "A chat agent that finds events, searches flights, and creates an invoice, whose conversation and tool results survive a killed Worker and a dropped network.", "teaches": "Which parts of an agent must be deterministic, which run as retried activities, and what resuming from recorded history looks like.", "time": "a weekend", "mode": "Code along, then change it", "task": "Type out the tutorial’s tools, Activities, and Workflow, run the chat agent, kill the Worker and cut the network as its durability section asks, then add a tool that fails at random."}]}], "macro": [{"from": "found", "to": "prompt", "links": 3}, {"from": "prompt", "to": "context", "links": 1}, {"from": "prompt", "to": "evals", "links": 1}, {"from": "prompt", "to": "agents", "links": 2}, {"from": "prompt", "to": "search", "links": 2}, {"from": "context", "to": "re h2>About this map<\/h2>\n<p>The Tracks view is the map at the largest scale: 13 tracks, with an arrow from one track to another\nwhen ideas in the second build on ideas in the first and a learner should meet the first track before it. Arrows get\nthicker the more ideas they connect. Some links skip a column or run against the arrows; each track's panel lists\nevery link, counted.<\/p>\n<p>The Map view is the same graph one level down. Each box is one idea: a concept, or a single paper, book or course\nthat defines one. An arrow from A to B means learn A before B. Arrows inside a track are always drawn; arrows between\ntracks appear when you click an idea, or all at once with Links. Click an idea and every idea on its path lights up,\nso you can see the whole chain to learn first.<\/p>\n<p>Each idea opens with why to learn it: what it is used for, including uses that are not obvious and links that\nare only conceptual, and who should put in the time to learn it and its prerequisites.<\/p>\n<p>Inside each idea, resources are ordered so that the first one is the best place to start and each one after it\nadds what the ones above did not. Start, Core and Deep say how far in each one goes. Ideas marked frontier are active research as of late 2026: expect the reading list there to move.<\/p>\n<p>Projects are the other half: things to build. Each says what to do with its link (do the assignment, rebuild\nit yourself, reproduce a result, apply it, and so on), what you end up with, what it teaches and roughly how long it takes.\nMost are an assignment, an exercise set or a repository that people in the field actually work through. Where no such project exists, 33 were written for this map: each is built on a named paper, dataset or repository, and ends on a number from that source that tells you when you are done. Every track has one\nsignature project, the one to build if you build only one. Projects sit in each idea's list beside what to read, at\nthe top of each track's panel, and all together in the Projects view.<\/p>\n<p>Paper sections point at one section of a paper: its background, preliminaries or related work. A good one restates an idea in a page, in the notation later work uses, or maps the line of work that led to it. Each says which section to read and what it covers; there are 33.<\/p>\n<p>Show, beside the views, hides what you do not want to see: paper sections, all projects, or only the projects\nwritten for this map. Hidden resources leave the lists and the progress counts, and the choice is saved in this\nbrowser.<\/p>\n\n<p>Tracks that share a color are close in subject, and the track name is always written next to the color. The List\nview holds the same content as text.<\/p>\n<p>The companion maps are the <a href=\"../ml-research-roadmap/\">Machine Learning Research Roadmap<\/a>, the <a href=\"../science-and-engineering-roadmap/\">Science and Engineering Roadmap<\/a>, and the <a href=\"../mathematics-roadmap/\">Mathematics Roadmap<\/a>.<\/p>\n<h2>How it was made<\/h2>\n<p>Built by Claude at Jai Sharma's direction in October 2026, on the pattern of the NeetCode roadmap. Claude\nchose the 73 ideas and 124 prerequisite edges, then separate Claude agents wrote each idea's core and\ngathered its 318 resources; later passes added 100 projects, 33 of them written for this map, and 33 paper sections. Every link was opened, every course page\nwas read for what its assignment asks, every arXiv ID was checked against its title, and every video was checked to\nstill exist before it went on the map. Progress ticks are saved in your browser only.<\/p>", "storeKey": "aieng-roadmap:done:v1", "trackHint": "13 tracks, each a graph of its own ideas. Open a track to see what it builds on and where to start."};

  function close() {

  { const seen = new Set(); const visit = id => { if (seen.has(id)) return; seen.add(id); byId[id].pre.forEach(visit); order.push(id); }; DATA.nodes.forEach(n => visit(n.id)); }

  const trackNodes = t => order.filter(x => byId[x].track === t).map(x => byId[x]);
  const trackProg = t => trackNodes(t).reduce((acc, n) => { const [d, tot] = prog(n); return [acc[0] + d, acc[1] + tot]; }, [0, 0]);
  let tmode = null, tEls = {}, tEdges = [], currentTrack = null;
  function renderTrackMap() {
