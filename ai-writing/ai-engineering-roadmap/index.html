<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Engineering Roadmap</title>
<script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<meta name="description" content="A prerequisite graph of AI engineering, the practical side of AI: context engineering, agents and harnesses, test-time search, evals, prompt and program optimization, and recursive self-improvement, with verified resources and a project for every idea.">
<style>
/* Layout: a compact header, then the map fills the viewport; a panel slides in from the right
   (a bottom sheet on phones). Colors: the site's paper and ink, plus six track families. */
:root {
  color-scheme: light;
  --paper: #ffffff; --sunk: #f6f5f2; --card: #ffffff;
  --ink: #1b1b1d; --ink-2: #4a4a50; --muted: #70707a; --rule: #e4e3de; --rule-soft: #efeeea;
  --accent: #1a4f8c; --accent-soft: #e6eef8;
  --edge: #b9b8b2; --edge-x: #d8d7d2;
  --f-0: #8a8983; --f-1: #2a78d6; --f-2: #eb6834; --f-3: #1baf7a;
  --f-4: #eda100; --f-5: #e87ba4; --f-6: #008300; --f-7: #6250d6; --f-8: #e34948;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #16161a; --sunk: #1c1c21; --card: #212127;
    --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
    --accent: #7fb2e3; --accent-soft: #1d2b3b;
    --edge: #5d5d66; --edge-x: #3d3d45;
    --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
    --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #16161a; --sunk: #1c1c21; --card: #212127;
  --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
  --accent: #7fb2e3; --accent-soft: #1d2b3b;
  --edge: #5d5d66; --edge-x: #3d3d45;
  --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
  --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }

/* header */
header { flex: none; border-bottom: 1px solid var(--rule); padding-block: .7rem .6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(28rem, 1fr) minmax(0, auto); gap: .5rem 1.2rem; align-items: end; }
.crumb { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .25rem; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.25rem, 2.6vw, 1.7rem); line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.lede { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; margin: .3rem 0 0; max-width: 62rem; }
.tools { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.search { position: relative; }
.search input { width: 15rem; max-width: 100%; font: .9rem var(--sans); color: var(--ink); background: var(--sunk); border: 1px solid var(--rule);
  border-radius: 8px; padding: .45rem .7rem; }
.results { position: absolute; right: 0; top: calc(100% + 4px); width: min(24rem, 86vw); max-height: 60vh; overflow: auto; z-index: 40;
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); padding: .3rem; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: .45rem .55rem; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--sunk); }
.results .rt { font-weight: 600; font-size: .88rem; }
.results .rm { font-size: .76rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: .42rem .75rem; font-size: .85rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tcol { display: flex; flex-direction: column; align-items: flex-end; gap: .45rem; min-width: 0; }
.show { display: inline-flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
.show .sl { font-family: var(--mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: .1rem; }
.show button { font: .78rem var(--sans); color: var(--muted); background: none; border: 1px dashed var(--rule); border-radius: 999px;
  padding: .24rem .6rem; cursor: pointer; white-space: nowrap; }
.show button[aria-pressed="true"] { color: var(--ink); border: 1px solid var(--ink-2); background: var(--sunk); }
.show button[aria-pressed="true"]::before { content: "\2713\00a0"; color: var(--accent); }
.show button:disabled { opacity: .45; cursor: default; }
.totals { font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem .35rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; color: var(--ink-2); background: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: .18rem .55rem; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* map */
main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sunk); touch-action: none; cursor: grab; }
main.dragging { cursor: grabbing; }
main[hidden] { display: none !important; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }
.e { fill: none; stroke: var(--edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.e.x { stroke: var(--edge-x); stroke-width: 1.2; display: none; }
main.all-links .e.x, .e.x.hot { display: inline; }
.e.hot { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.e.dim { opacity: .18; }
.track { position: absolute; z-index: 0; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper); }
.track .tl { position: absolute; left: 14px; top: 9px; display: flex; gap: .45rem; align-items: center;
  font-family: var(--mono); font-size: clamp(11px, calc(9px * var(--inv, 1)), 17px); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
.track .tl .dot { width: 8px; height: 8px; }
.node { position: absolute; z-index: 2; display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--rule);
  border-top: 3px solid var(--c); border-radius: 8px; padding: 5px 8px 6px; cursor: pointer; overflow: hidden;
  box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.node:hover { box-shadow: 0 3px 10px rgb(0 0 0 / .12); border-color: var(--muted); border-top-color: var(--c); }
.node .k { display: flex; justify-content: space-between; gap: 4px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.node .k .fr { color: var(--ink-2); }
.node .t { font-size: 12.5px; font-weight: 600; line-height: 1.22; color: var(--ink); margin-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .p { margin-top: auto; height: 3px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.node .p i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 2px; }
.node.done { background: color-mix(in srgb, var(--c) 9%, var(--card)); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); border-top-color: var(--c); }
.node.anc { border-color: var(--accent); }
.node.dim { opacity: .3; }
.node.hit { box-shadow: 0 0 0 3px var(--accent); }
.zoom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-size: 1.05rem; line-height: 1; }
.zoom button.w { width: auto; padding: 0 .55rem; font-size: .75rem; }
.zoom button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 180px; z-index: 5;
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 6px; cursor: pointer; }
.mini svg { display: block; width: 100%; height: auto; }
.mini .vp { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 18; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 4; font-size: .76rem; color: var(--muted);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .75rem; white-space: nowrap; }

/* track map */
.tview { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--sunk); }
.tview[hidden] { display: none !important; }
.tscroll { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 12px; }
.tsize { margin: auto; position: relative; flex: none; }
.tworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tworld svg.edges { z-index: 1; }
.te { fill: none; stroke: var(--edge); vector-effect: non-scaling-stroke; }
.te.hot { stroke: var(--accent); }
.te.dim { opacity: .2; }
.tnode { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--card);
  border: 1px solid var(--rule); border-top: 4px solid var(--c); border-radius: 10px; padding: 9px 12px 7px; cursor: pointer;
  box-shadow: 0 1px 3px rgb(0 0 0 / .06); transition: opacity .15s, box-shadow .15s; overflow: hidden; }
.tnode:hover { box-shadow: 0 4px 14px rgb(0 0 0 / .13); border-color: var(--muted); border-top-color: var(--c); }
.tnode .tk { display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tnode .tt { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.15; color: var(--ink); }
.tnode .tc { font-family: var(--serif); font-size: 12.5px; line-height: 1.32; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tnode .tf { margin-top: auto; display: flex; align-items: center; gap: .5rem; flex: none; }
.tnode .p { flex: 1; height: 4px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.tnode .tpj { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; line-height: 1; }
.tnode .p i { display: block; height: 100%; width: 0; background: var(--c); }
.tnode.sel { box-shadow: 0 0 0 2px var(--accent); }
.tnode.anc { border-color: var(--accent); border-top-color: var(--c); }
.tnode.dim { opacity: .32; }
.thint { flex: none; margin: 0; padding: .5rem 16px .7rem; text-align: center; font-size: .8rem; color: var(--muted); }
.narrow .tnode { padding: 7px 9px 8px; }
.narrow .tnode .tt { font-size: 14.5px; }
.narrow .tnode .tc { font-size: 11.5px; -webkit-line-clamp: 2; }
.primary { display: inline-flex; align-items: center; gap: .4rem; margin: .2rem 0 .2rem; font-size: .86rem; font-weight: 600; color: var(--paper);
  background: var(--ink); border: 0; border-radius: 8px; padding: .5rem .85rem; cursor: pointer; }
.tlinks { font-size: .86rem; color: var(--ink-2); line-height: 1.5; margin: 0; }
.ideas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.ideas li button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .8rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .55rem .1rem; cursor: pointer; }
.ideas li button:hover { background: var(--sunk); }
.ideas .it { font-weight: 600; font-size: .9rem; }
.ideas .ik { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .35rem; font-weight: 400; }
.ideas .ip { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* list */
.list { flex: 1; min-height: 0; overflow: auto; background: var(--paper); }
.list[hidden] { display: none !important; }
.list .in { max-width: 54rem; margin: 0 auto; padding-block: 1.2rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list h2 { display: flex; gap: .5rem; align-items: center; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; margin: 2rem 0 .4rem; padding-bottom: .45rem; border-bottom: 1px solid var(--rule); }
.list h2:first-child { margin-top: .4rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .75rem .2rem; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row .rt { font-weight: 600; font-size: .98rem; }
.row .rk { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .4rem; font-weight: 400; }
.row .rc { grid-column: 1; font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.row .rp { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* panel */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .25); z-index: 49; }
.scrim[hidden] { display: none !important; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(31rem, 100%); z-index: 50; background: var(--card);
  border-left: 1px solid var(--rule); box-shadow: -12px 0 40px rgb(0 0 0 / .12); overflow: auto; overscroll-behavior: contain;
  padding-block: calc(1.1rem + env(safe-area-inset-top, 0px)) calc(2.5rem + env(safe-area-inset-bottom, 0px));
  padding-left: 1.4rem; padding-right: max(1.4rem, env(safe-area-inset-right, 0px)); }
aside[hidden] { display: none !important; }
.close { position: sticky; top: 0; float: right; width: 32px; height: 32px; margin: -.2rem -.4rem 0 0; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--card); cursor: pointer; font-size: 1.1rem; line-height: 1; z-index: 2; }
.pk { display: flex; flex-wrap: wrap; gap: .35rem .6rem; align-items: center; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.badge { border: 1px solid var(--rule); border-radius: 4px; padding: .05rem .35rem; color: var(--ink-2); }
aside h2 { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1.15; margin: 0 2.2rem .7rem 0; text-wrap: balance; }
.prog { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--c); }
.core { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; margin: 0 0 .6rem; }
.reach { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: 0 0 1.1rem; }
.uses, .worth { font-family: var(--serif); font-size: 1rem; line-height: 1.5; margin: 0 0 .45rem; }
.uses b, .worth b { font-family: var(--mono); font-weight: 500; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: .35rem; }
.worth { margin-bottom: 1rem; }
.row .ru { grid-column: 1 / -1; font-family: var(--serif); font-size: .9rem; color: var(--ink-2); line-height: 1.4; }
.sec { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.3rem 0 .5rem; }
.links { display: flex; flex-wrap: wrap; gap: .35rem; }
.links button { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: .25rem .5rem; cursor: pointer; text-align: left; }
.links button:hover { border-color: var(--muted); }
.links .none { font-size: .85rem; color: var(--muted); }
.path { font-size: .8rem; color: var(--muted); margin: .45rem 0 0; }
.res { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.res li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .1rem .65rem; padding: .7rem 0; border-bottom: 1px solid var(--rule-soft); }
.res input { width: 1.05rem; height: 1.05rem; margin: .2rem 0 0; accent-color: var(--accent); cursor: pointer; }
.res .rn a { font-weight: 600; font-size: .93rem; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.res .rn a:hover { border-bottom-color: var(--accent); }
.res .rb { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
.res .note { font-family: var(--serif); font-size: .9rem; color: var(--ink-2); margin-top: .2rem; line-height: 1.4; }
.res li.ok .rn a { color: var(--muted); }
.lv { align-self: start; font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: .12rem .4rem; white-space: nowrap; }
.lv1 { color: var(--accent); background: var(--accent-soft); }
.lv2 { color: var(--ink-2); background: var(--rule-soft); }
.lv3 { color: var(--paper); background: var(--ink-2); }
.foot { font-size: .8rem; color: var(--muted); margin-top: 1.4rem; line-height: 1.5; }
/* projects: a resource row with a label line and what you build and learn */
.res .pt { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: .2rem; }
.res .pb { font-family: var(--serif); font-size: .92rem; color: var(--ink-2); line-height: 1.42; margin: .25rem 0 0; }
.res .pb b { font-family: var(--mono); font-weight: 500; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: .4rem; }
.res li.psec { border-left: 2px solid var(--rule); padding-left: .55rem; }
.res li.proj { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); border-radius: 6px; padding-left: .45rem; padding-right: .2rem; }
.res .ichip { margin-top: .45rem; }
.row .rk.pj { color: var(--accent); }
.pintro { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: .4rem 0 0; max-width: 46rem; }
.about { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.55; }
.about p { margin: 0 0 .7rem; }

@media (max-width: 1100px) {
  header { grid-template-columns: minmax(0, 1fr); }
  .tools { justify-content: flex-start; }
  .tcol { align-items: flex-start; }
}

@media (max-width: 720px) {
  header { grid-template-columns: minmax(0, 1fr); }
  .tools { justify-content: flex-start; }

<script>
const DATA = {"tracks": [{"id": "found", "label": "Working with models", "family": 0, "core": "What an engineer needs to know about a model they call but did not train: messages, tokens, sampling, reasoning budgets, price, and latency."}, {"id": "prompt", "label": "Prompts and structured output", "family": 1, "core": "Say what you want so the model does it: instructions, examples, room to reason, and output a program can parse."}, {"id": "context", "label": "Context engineering", "family": 1, "core": "Decide what goes into the window on every turn, since the model knows only what is in front of it and gets worse as the window fills."}, {"id": "retrieval", "label": "Retrieval and memory", "family": 2, "core": "Bring the right facts into the window from outside it: embeddings, hybrid search, reranking, agentic search, and memory that outlives a session."}, {"id": "agents", "label": "Agents and tools", "family": 3, "core": "Put the model in a loop with tools: tool calls, tool design, MCP, code as actions, computer use, workflows, subagents, and skills."}, {"id": "harness", "label": "Harnesses", "family": 3, "core": "The code around the model that makes it work on real tasks: the loop, sandboxes, coding agents, execution feedback, and long runs across many windows."}, {"id": "search", "label": "Test-time search and verification", "family": 4, "core": "Spend more inference to get a better answer: sample many, check them, refine, search trees of attempts, and evolve programs."}, {"id": "evals", "label": "Evals and observability", "family": 5, "core": "Know whether a change helped: error analysis, judges, error bars, agent benchmarks, contamination, and traces."}, {"id": "optimize", "label": "Prompt and program optimization", "family": 6, "core": "Let an optimizer write the prompts and the pipeline against a metric: APE and OPRO, DSPy, textual gradients, GEPA, and automated agent design."}, {"id": "rsi", "label": "Recursive self-improvement", "family": 6, "core": "Systems whose improvements make them better at improving: self-improving scaffolds, self-editing agents, skill libraries, self-play, automated research, and Poetiq's metasystem."}, {"id": "adapt", "label": "Adapting models", "family": 7, "core": "When the harness is not enough, change the weights: fine-tuning, distillation, reinforcement fine-tuning, agentic RL, and the environments it trains in."}, {"id": "serving", "label": "Inference and cost", "family": 8, "core": "Run models fast and cheap: open weights, batching, speculative decoding, and routing each query to the cheapest model that can answer it."}, {"id": "prod", "label": "Shipping safely", "family": 5, "core": "Put agents in front of real data and real users: prompt injection, guardrails, permissions, monitoring, and durable execution."}], "nodes": [{"id": "llmapi", "title": "Calling a model: messages, tokens and sampling", "kind": "concept", "track": "found", "pre": [], "frontier": false, "core": "A model call sends the conversation as system, user, and assistant messages, which become tokens; the model then samples one token at a time from a predicted distribution until it stops. The API keeps no memory, so each call resends everything.", "reach": "Every idea after this one shapes that request: what goes into the messages, what the tokens cost, and what the output is allowed to be.", "uses": "Every app built on a hosted model, from Claude Code and Cursor to a ten-line script, sends messages and pays by the token; tokenization also explains why models miscount the letters in a word.", "worth": "you will call a model from code at all; it takes an afternoon, and everything else on this map assumes it.", "resources": [{"title": "Deep Dive into LLMs like ChatGPT", "url": "https://www.youtube.com/watch?v=7xTGNNLPyMI", "type": "video", "by": "Andrej Karpathy, 2025", "level": 1, "note": "The chapters from tokenization through post-training conversations (0:07 to 1:20) cover this idea."}, {"title": "Using the Messages API", "url": "https://platform.claude.com/docs/en/build-with-claude/working-with-messages", "type": "notes", "by": "Anthropic, 2026", "level": 1, "note": "Shows that the API is stateless and how system prompts and multiple turns are sent."}, {"title": "How to generate text: using different decoding methods for language generation with Transformers", "url": "https://huggingface.co/blog/how-to-generate", "type": "tutorial", "by": "Patrick von Platen, Hugging Face, 2020", "level": 2, "note": "Greedy search, beam search, temperature, top-k, and top-p on GPT-2; current Claude models fix these settings, so try them on an open model."}, {"title": "Let’s build the GPT Tokenizer", "url": "https://www.youtube.com/watch?v=zduSFxRajkE", "type": "video", "by": "Andrej Karpathy, 2024", "level": 2, "note": "Many odd model behaviors, from spelling to arithmetic, trace back to the tokenizer."}, {"title": "The Curious Case of Neural Text Degeneration", "url": "https://arxiv.org/abs/1904.09751", "type": "paper", "by": "Holtzman, Buys, Du, Forbes, Choi, 2020", "level": 3, "note": "Why greedy decoding repeats itself, and where top-p sampling came from."}, {"title": "minbpe exercise: build your own GPT-4 tokenizer", "url": "https://github.com/karpathy/minbpe/blob/master/exercise.md", "type": "project", "by": "Andrej Karpathy, 2024", "level": 2, "build": "A byte pair encoding tokenizer with GPT-4’s split pattern that reproduces tiktoken’s encoding of any string.", "teaches": "What a token is, why prices and context limits count tokens instead of words, and what causes tokenization quirks.", "time": "a weekend", "mode": "Rebuild it yourself", "task": "Write BasicTokenizer and then RegexTokenizer from an empty file as the exercise’s steps describe, load GPT-4’s merges, and check that your encode and decode match tiktoken’s cl100k_base."}, {"title": "Anthropic API fundamentals", "url": "https://github.com/anthropics/courses/tree/master/anthropic_api_fundamentals", "type": "project", "by": "Anthropic, 2024", "level": 1, "note": "The notebooks name the retired Claude 3 Haiku; set a current model, and note that the newest models reject custom temperature.", "build": "Working calls with system prompts, multiple turns, stop sequences, max_tokens, streaming, and images, plus a chat loop that counts tokens.", "teaches": "How a request is shaped, why each turn costs more than the last, and what each parameter changes.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Run the six notebooks with your own API key, then turn the messages notebook into a chat loop that prints input and output tokens for every turn."}]}, {"id": "costlat", "title": "Cost, latency and tokens per task", "kind": "concept", "track": "found", "pre": ["llmapi"], "frontier": false, "core": "Providers charge per token, output several times more than input, and latency is roughly time to first token plus output length over decode speed. Measure both per finished task, since a cheaper model that takes more turns or thinks longer can cost more.", "reach": "Prompt caching, compaction, routing, and reasoning effort are all ways to move a system along this cost and accuracy curve.", "uses": "Choosing a model tier, deciding whether a nightly job can wait for the batch discount, setting an agent’s budget per ticket or per pull request, and explaining why a reasoning model’s bill is mostly output tokens.", "worth": "you will ship anything with a bill or a user waiting; learn messages and tokens first. Prototypes on a free tier can skip it until usage grows.", "resources": [{"title": "Latency optimization", "url": "https://developers.openai.com/api/docs/guides/latency-optimization", "type": "notes", "by": "OpenAI, 2026", "level": 1, "note": "Seven principles, from generating fewer tokens to not calling a model at all, with a worked example."}, {"title": "Pricing", "url": "https://platform.claude.com/docs/en/about-claude/pricing", "type": "notes", "by": "Anthropic, 2026", "level": 1, "note": "How input, output, cache writes, cache reads, and batch requests are each priced."}, {"title": "Artificial Analysis", "url": "https://artificialanalysis.ai/", "type": "notes", "by": "Artificial Analysis, 2026", "level": 1, "note": "Compare its cost per task and output tokens per task charts with each model’s per-token price."}, {"title": "Holistic Agent Leaderboard: The Missing Infrastructure for AI Agent Evaluation", "url": "https://arxiv.org/abs/2510.11977", "type": "paper", "by": "Kapoor, Stroebl, Kirgis, et al., Princeton, 2025", "level": 3, "note": "21,730 agent runs scored on cost and accuracy together; higher reasoning effort lowered accuracy in most runs."}, {"title": "AI Agents That Matter", "url": "https://arxiv.org/html/2407.01502v1#S2", "type": "section", "by": "Kapoor, Stroebl, Siegel, Nadgir, Narayanan, 2024", "level": 2, "section": "Section 2, AI agent evaluations must be cost-controlled", "covers": "Why accuracy alone rewards endless retries, how to plot agents on an accuracy and dollar cost Pareto curve, and simple baselines matching costly HumanEval agents."}, {"title": "Cost Optimization on the Claude API", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/cost_optimization/cost_optimization.ipynb", "type": "project", "by": "Anthropic, 2026", "level": 2, "note": "Running it top to bottom costs about 40 dollars in API credits.", "build": "An insurance claims agent with a ten-claim eval, measured for pass rate and cost per task under caching, token trimming, batching, effort, and model choices.", "teaches": "How to measure cost per finished task, and which levers move the Pareto frontier on a real agent while the pass rate holds.", "time": "a day", "mode": "Code along, then change it", "task": "Run the notebook’s claims adjuster agent through each cost lever, then rerun its ten-claim eval three times per configuration and plot your own cost per task against pass rate.", "signature": true}]}, {"id": "reasoning", "title": "Reasoning models and reasoning effort", "kind": "concept", "track": "found", "pre": ["llmapi"], "frontier": false, "core": "Reasoning models are trained to write a long chain of thought before answering, and you buy accuracy with those thinking tokens, billed as output. Set the effort level per task, because more thinking costs time and money and on some tasks lowers accuracy.", "reach": "Asking for step by step reasoning becomes mostly redundant on these models; scaling test-time compute and reinforcement fine-tuning explain how they are made.", "uses": "Claude Code and Codex let users raise effort for hard refactors and lower it for quick edits; math, planning, and code review gain the most, while extraction and chat rarely justify the thinking tokens.", "worth": "you call frontier models, where thinking is now on by default; know messages and tokens first. If you only run small open models without reasoning, skim it.", "resources": [{"title": "Reasoning models", "url": "https://developers.openai.com/api/docs/guides/reasoning", "type": "notes", "by": "OpenAI, 2026", "level": 1, "note": "Reasoning effort, reasoning tokens in the usage object, and leaving room for them in the context window."}, {"title": "Effort", "url": "https://platform.claude.com/docs/en/build-with-claude/effort", "type": "notes", "by": "Anthropic, 2026", "level": 1, "note": "Fixed thinking budgets have given way to effort levels; the page says what each level does and to sweep them on your own evals."}, {"title": "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning", "url": "https://arxiv.org/abs/2501.12948", "type": "paper", "by": "DeepSeek-AI, 2025", "level": 2, "note": "How long reasoning emerges from reinforcement learning with rule-based rewards, from an open lab."}, {"title": "Inverse Scaling in Test-Time Compute", "url": "https://arxiv.org/abs/2507.14417", "type": "paper", "by": "Gema, Hägele, Chen, Arditi, et al., 2025", "level": 2, "note": "Tasks where longer reasoning lowers accuracy, with five distinct ways models fail as they think more."}, {"title": "s1: Simple test-time scaling", "url": "https://arxiv.org/abs/2501.19393", "type": "paper", "by": "Muennighoff et al., 2025", "level": 3, "note": "Budget forcing: end the thinking early, or append “Wait” to stretch it, and accuracy follows the length."}, {"title": "Find where more thinking hurts", "url": "https://github.com/safety-research/inverse-scaling-ttc", "type": "project", "by": "Built on Gema et al., 2025", "level": 2, "note": "Current Claude models take effort levels instead of thinking budgets, so map the repository’s budgets onto effort.", "build": "Accuracy, reasoning tokens, and dollar cost per question at each effort level for one model, on a distractor task and a plain math set.", "teaches": "How to pick an effort level from your own curve, and that extra thinking can lower accuracy.", "time": "a weekend", "mode": "Apply it", "task": "Run the repository’s Misleading Math task and its standard benchmark config, which includes GSM8K, on one current reasoning model at four or more effort levels or budgets, then plot accuracy and cost against reasoning tokens.", "made": true, "done": "Misleading Math accuracy falls as reasoning tokens grow, as Claude Opus 4’s fell from nearly 100 to about 85 to 90 percent in the paper’s Figure 3."}]}, {"id": "prompting", "title": "Writing prompts", "kind": "concept", "track": "prompt", "pre": ["llmapi"], "frontier": false, "core": "Write the prompt as a brief for a capable colleague new to your situation: the goal, the audience, the context, the constraints, and what a good answer looks like, with inputs in tags. Then run it on real inputs and fix what fails.", "reach": "Examples, room to reason, structured output, and automatic prompt optimization all start from a prompt written and tested this way.", "uses": "System prompts for support bots, extraction pipelines, LLM judges, and coding agents; Anthropic publishes Claude’s own system prompts, which show the craft at scale. The same skill writes a clear task brief for a person.", "worth": "you will put a model into any product; it needs only the API basics. Nobody building on models can skip it, though optimizers take over some of the tuning later.", "resources": [{"title": "Prompting best practices", "url": "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices", "type": "notes", "by": "Anthropic, 2026", "level": 1, "note": "Start with General principles; the agentic sections matter once you build agents."}, {"title": "Prompting Fundamentals and How to Apply them Effectively", "url": "https://eugeneyan.com/writing/prompting/", "type": "blog", "by": "Eugene Yan, 2024", "level": 1, "note": "A practitioner’s tactics with examples; its advice on prefill and temperature predates current Claude models, which reject both."}, {"title": "Prompt engineering", "url": "https://developers.openai.com/api/docs/guides/prompt-engineering", "type": "notes", "by": "OpenAI, 2026", "level": 1, "note": "Message roles and which instructions win, versioning prompts in code, and Markdown and XML structure."}, {"title": "Quantifying Language Models’ Sensitivity to Spurious Features in Prompt Design or: How I learned to start worrying about prompt formatting", "url": "https://arxiv.org/abs/2310.11324", "type": "paper", "by": "Sclar, Choi, Tsvetkov, Suhr, 2024", "level": 2, "note": "Formatting changes that keep the meaning moved accuracy by up to 76 points, so test a prompt across formats."}, {"title": "The Prompt Report: A Systematic Survey of Prompt Engineering Techniques", "url": "https://arxiv.org/abs/2406.06608", "type": "paper", "by": "Schulhoff et al., 2024", "level": 3, "note": "A taxonomy of 58 prompting techniques and a shared vocabulary for them."}, {"title": "Prompt Engineering Interactive Tutorial", "url": "https://github.com/anthropics/prompt-eng-interactive-tutorial", "type": "project", "by": "Anthropic, 2024", "level": 1, "note": "Written for Claude 3 Haiku, now retired; set a current model, and note that Claude 4.6 and later reject the prefills in Chapter 5.", "build": "Graded prompts for every chapter’s exercises, ending in two complex prompts built from scratch for industry cases.", "teaches": "Clear instructions, roles, separating data from instructions, output formats, step by step thinking, and examples, each tested on a model until it works.", "time": "a weekend", "mode": "Work the exercises", "task": "Work through the nine chapters in order, revising each exercise’s prompt until its grader passes, then finish the financial services and coding exercises in Chapter 9.", "signature": true}]}, {"id": "fewshot", "title": "Examples in the prompt", "kind": "concept", "track": "prompt", "pre": ["prompting"], "frontier": false, "core": "A few input and output examples show the format, tone, and edge cases faster than a description can. Models copy surface features of examples, so pick diverse ones covering hard cases and keep their format consistent; the labels matter less than you would expect.", "reach": "Few-shot examples are what DSPy bootstraps and optimizes, and the cheapest thing to try before fine-tuning.", "uses": "Classification and extraction prompts that must match a house format, style transfer, synthetic data generated from seed examples, and DSPy programs that bootstrap their own demonstrations; many-shot prompts can stand in for a small fine-tune.", "worth": "you need a specific output format or label set; it builds on writing prompts and takes an hour. If you use reasoning models, try zero-shot first.", "resources": [{"title": "Prompt Engineering", "url": "https://lilianweng.github.io/posts/2023-03-15-prompt-engineering/", "type": "blog", "by": "Lilian Weng, 2023", "level": 1, "note": "Read the Few-shot section, with its tips on choosing and ordering examples."}, {"title": "Language Models are Few-Shot Learners", "url": "https://arxiv.org/abs/2005.14165", "type": "paper", "by": "Brown et al., OpenAI, 2020", "level": 2, "note": "Section 2 and Figure 2.1 define zero-shot, one-shot, and few-shot prompting."}, {"title": "Rethinking the Role of Demonstrations: What Makes In-Context Learning Work?", "url": "https://arxiv.org/abs/2202.12837", "type": "paper", "by": "Min, Lyu, Holtzman, Artetxe, Lewis, Hajishirzi, Zettlemoyer, 2022", "level": 2, "note": "Random labels barely hurt; the label space, the input distribution, and the format do the work."}, {"title": "Calibrate Before Use: Improving Few-Shot Performance of Language Models", "url": "https://arxiv.org/abs/2102.09690", "type": "paper", "by": "Zhao, Wallace, Feng, Klein, Singh, 2021", "level": 2, "note": "Why the order and label balance of examples swing accuracy from near chance to near the best, and a cheap correction."}, {"title": "Many-Shot In-Context Learning", "url": "https://arxiv.org/abs/2404.11018", "type": "paper", "by": "Agarwal et al., Google DeepMind, 2024", "level": 3, "note": "Hundreds or thousands of examples in a long window keep improving many tasks."}, {"title": "Do the labels in your examples matter?", "url": "https://github.com/Alrope123/rethinking-demonstrations", "type": "project", "by": "Built on Min et al., 2022", "level": 2, "build": "Accuracy tables for no demonstrations, gold labels, and random labels across the paper’s classification and multiple choice tasks for one model.", "teaches": "Which parts of an example the model actually uses, so you spend effort on format and coverage first.", "time": "a weekend", "mode": "Reproduce a result", "task": "Use the repository’s data and demonstration variants to run no demonstrations, gold labels, and random labels with k=16 on a small open model of your choice, then compare accuracy by task.", "made": true, "done": "Random labels cost under 5 points of accuracy against gold labels while dropping the demonstrations costs more, as in the paper’s Figure 3 (a 0 to 5 point drop)."}]}, {"id": "cot", "title": "Asking the model to reason first", "kind": "concept", "track": "prompt", "pre": ["prompting", "reasoning"], "frontier": false, "core": "A model spends the same compute on each token, so writing steps before the answer gives it room to work; one added sentence nearly quadrupled GSM8K accuracy in 2022. The gain is mostly on math and logic, and reasoning models already do it unprompted.", "reach": "Sampling many chains and voting, self-refinement, and verifiers at test time all build on reasoning written out before the answer.", "uses": "Rubrics and LLM judges that reason before scoring, math tutoring, multistep extraction, and any non-reasoning model in a pipeline; the same idea, trained into the weights, became today’s reasoning models.", "worth": "you use cheaper non-reasoning models or need reasoning you can parse; read reasoning models first. If you only call reasoning models, the history matters more than the technique.", "resources": [{"title": "Deep Dive into LLMs like ChatGPT", "url": "https://www.youtube.com/watch?v=7xTGNNLPyMI", "type": "video", "by": "Andrej Karpathy, 2025", "level": 1, "note": "Watch the chapter “models need tokens to think” (1:46:56 to 2:01:11)."}, {"title": "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", "url": "https://arxiv.org/abs/2201.11903", "type": "paper", "by": "Wei et al., Google, 2022", "level": 2}, {"title": "Large Language Models are Zero-Shot Reasoners", "url": "https://arxiv.org/abs/2205.11916", "type": "paper", "by": "Kojima, Gu, Reid, Matsuo, Iwasawa, 2022", "level": 2, "note": "“Let’s think step by step” took GSM8K from 10.4 to 40.7 percent on text-davinci-002."}, {"title": "To CoT or not to CoT? Chain-of-thought helps mainly on math and symbolic reasoning", "url": "https://arxiv.org/abs/2409.12183", "type": "paper", "by": "Sprague et al., UT Austin, 2025", "level": 2, "note": "A meta-analysis of over 100 papers plus 14 models: outside math and logic, chain of thought barely helps."}, {"title": "Prompting Science Report 2: The Decreasing Value of Chain of Thought in Prompting", "url": "https://arxiv.org/abs/2506.07142", "type": "paper", "by": "Meincke, Mollick, Mollick, Shapiro, Wharton, 2025", "level": 2, "note": "On reasoning models, asking for steps adds little accuracy and a lot of time and tokens."}, {"title": "Language Models Don’t Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting", "url": "https://arxiv.org/abs/2305.04388", "type": "paper", "by": "Turpin, Michael, Perez, Bowman, 2023", "level": 3, "note": "The written reasoning can leave out what actually drove the answer, so do not read it as an explanation."}, {"title": "Where does chain of thought help?", "url": "https://arxiv.org/abs/2409.12183", "type": "project", "by": "Built on Sprague et al., 2025, and Kojima et al., 2022", "level": 2, "build": "Accuracy and tokens per answer for direct and step by step prompts on one math set and one commonsense set.", "teaches": "When reasoning before the answer is worth its tokens, and how to pull a final answer out of free text reliably.", "time": "a day", "mode": "Reproduce a result", "task": "Write a harness that asks a non-reasoning model for a direct answer and for zero-shot chain of thought on 500 GSM8K and 500 CommonsenseQA questions, then compare accuracy and output tokens.", "made": true, "done": "The chain of thought gain on GSM8K is at least 10 points while CommonsenseQA moves about 1 point or less, as Sprague et al. report (12.3 points for math, 0.7 elsewhere)."}]}, {"id": "structured", "title": "Structured outputs and constrained decoding", "kind": "concept", "track": "prompt", "pre": ["llmapi"], "frontier": false, "core": "When a program reads the output, constrain decoding: at each step the sampler masks every token that would break a JSON schema or grammar, so the result always parses. Providers offer this as structured outputs; Outlines and XGrammar do it for open models.", "reach": "Tool calling is structured output with one schema per tool, and every agent loop parses its actions this way.", "uses": "Extraction into database rows, tool and function calls, classification over a fixed label set, interfaces generated from JSON, and every agent action a program has to parse; vLLM and SGLang use XGrammar for open models.", "worth": "code will parse what the model returns; it needs only the API basics. Chat apps that show text to people can skip the decoding internals.", "resources": [{"title": "Structured outputs", "url": "https://platform.claude.com/docs/en/build-with-claude/structured-outputs", "type": "notes", "by": "Anthropic, 2026", "level": 1, "note": "Read Important considerations: grammar compilation, property ordering, and the cases where output can still miss the schema."}, {"title": "Efficient Guided Generation for Large Language Models", "url": "https://arxiv.org/abs/2307.09702", "type": "paper", "by": "Willard and Louf, 2023", "level": 2, "note": "Compiles a regex to a finite state machine and indexes the vocabulary once, so each step’s mask is a lookup."}, {"title": "Let Me Speak Freely? A Study on the Impact of Format Restrictions on Performance of Large Language Models", "url": "https://arxiv.org/abs/2408.02442", "type": "paper", "by": "Tam et al., 2024", "level": 2, "note": "Reports that format restrictions hurt reasoning; read it together with the reply below."}, {"title": "Say What You Mean: A Response to ‘Let Me Speak Freely’", "url": "https://blog.dottxt.ai/say-what-you-mean.html", "type": "blog", "by": "Will Kurt, dottxt, 2024", "level": 2, "note": "Rerunning the paper’s tasks with fixed prompts and parsing, structured generation matched or beat free text."}, {"title": "JSONSchemaBench: A Rigorous Benchmark of Structured Outputs for Language Models", "url": "https://arxiv.org/abs/2501.10868", "type": "paper", "by": "Geng et al., 2025", "level": 3, "note": "Six constrained decoding frameworks compared on 10,000 real schemas for speed, coverage, and output quality."}, {"title": "XGrammar: Flexible and Efficient Structured Generation Engine for Large Language Models", "url": "https://arxiv.org/html/2411.15100v3#S2", "type": "section", "by": "Dong et al., 2024", "level": 2, "section": "Section 2, Background", "covers": "Constrained decoding as a mask over the vocabulary at each step, and how a context-free grammar becomes a pushdown automaton that decides which tokens are valid."}, {"title": "Write a constrained decoder", "url": "https://arxiv.org/abs/2307.09702", "type": "project", "by": "Built on Willard and Louf, 2023", "level": 2, "build": "A sampler that forces GPT-2 to emit strings matching any regular expression, with a precomputed index from states to allowed tokens.", "teaches": "Why constrained output always parses, why tokens that cross pattern boundaries are the hard part, and where the indexing cost goes.", "time": "a weekend", "mode": "Rebuild it yourself", "task": "Write a regex constrained sampler for GPT-2 from an empty file: compile the regex to a finite state machine, precompute allowed tokens per state, mask logits, then compare outputs and speed with Outlines.", "made": true, "done": "All 100 samples for the paper’s floating point regex match it, and time per token stays flat from 10 to 100 generated tokens, as in Section 3.2."}, {"title": "Does JSON output hurt reasoning?", "url": "https://github.com/dottxt-ai/demos/tree/main/say-what-you-mean", "type": "project", "by": "Built on dottxt’s Say What You Mean notebooks, 2024", "level": 2, "build": "GSM8K accuracy for free JSON, constrained JSON, and constrained JSON with the reasoning field moved after the answer.", "teaches": "That schema design, such as letting the model reason before it answers, matters more than the constraint itself.", "time": "a day", "mode": "Extend it", "task": "Rerun the GSM8K JSON notebook with Llama 3 8B Instruct and Outlines, with and without constrained decoding, then add a run with the reasoning field placed after the answer field.", "made": true, "done": "Constrained JSON scores at least as high as unconstrained JSON, as in the post’s 0.78 against 0.77, and moving reasoning after the answer lowers accuracy."}]}, {"id": "contextwin", "title": "The context window and how it degrades", "kind": "concept", "track": "context", "pre": ["llmapi"], "frontier": false, "core": "A model can accept far more tokens than it uses well: recall falls as the window fills, facts in the middle get lost, and similar distractors make it worse, well before the advertised limit. Treat the usable window as much smaller than the stated one.", "reach": "Every context engineering move, from compaction to just-in-time loading to retrieval, exists because of this degradation.", "uses": "Deciding how much of a codebase, transcript, or document set to load, explaining why long chat sessions get worse, and choosing when Claude Code or Codex should compact; RULER and NoLiMa test each new model.", "worth": "you build anything that fills the window, especially agents and question answering over documents; read it before context engineering. Short single prompts rarely hit it.", "resources": [{"title": "Context Rot: How Increasing Input Tokens Impacts LLM Performance", "url": "https://www.trychroma.com/research/context-rot", "type": "blog", "by": "Hong, Troynikov, Huber, Chroma, 2025", "level": 1, "note": "18 models get worse as input grows, even on simple tasks; vendor research with released code."}, {"title": "Lost in the Middle: How Language Models Use Long Contexts", "url": "https://arxiv.org/abs/2307.03172", "type": "paper", "by": "Liu, Lin, Hewitt, Paranjape, Bevilacqua, Petroni, Liang, 2024", "level": 2, "note": "Accuracy is highest when the relevant passage comes first or last, which is why long documents go above the question."}, {"title": "How Long Contexts Fail", "url": "https://www.dbreunig.com/2025/06/22/how-contexts-fail-and-how-to-fix-them.html", "type": "blog", "by": "Drew Breunig, 2025", "level": 1, "note": "Four ways an agent’s context goes bad: poisoning, distraction, confusion, and clash, each with a case."}, {"title": "RULER: What’s the Real Context Size of Your Long-Context Language Models?", "url": "https://arxiv.org/abs/2404.06654", "type": "paper", "by": "Hsieh et al., NVIDIA, 2024", "level": 2, "note": "Of 17 models claiming 32K or more, only half held up at 32K on tasks harder than finding one needle."}, {"title": "NoLiMa: Long-Context Evaluation Beyond Literal Matching", "url": "https://arxiv.org/abs/2502.05167", "type": "paper", "by": "Modarressi et al., 2025", "level": 3, "note": "With no word overlap between question and needle, 11 of 13 models fell below half their short input score at 32K."}, {"title": "Context Rot replication toolkit", "url": "https://github.com/chroma-core/context-rot", "type": "project", "by": "Chroma, 2025", "level": 2, "build": "Accuracy for one new model on focused and full LongMemEval histories, and on repeated words sequences from 25 to 10,000 words.", "teaches": "How quickly your own model degrades with length, measured on tasks where the right answer is never in doubt.", "time": "a weekend", "mode": "Apply it", "task": "Run the toolkit’s LongMemEval and repeated words experiments on one current model the report did not test, then plot accuracy against input length beside the report’s curves."}]}, {"id": "ctxeng", "title": "Context engineering", "kind": "concept", "track": "context", "pre": ["contextwin", "prompting"], "frontier": true, "core": "On every turn, assemble the smallest set of high signal tokens the model needs: instructions, tool definitions, retrieved facts, notes, and recent history. The work is deciding what to write outside the window, select back in, compress, and isolate in subagents.", "reach": "Caching, compaction, just-in-time loading, retrieval, and memory are its tools, and ACE and GEPA show the context itself can be optimized.", "uses": "Agents such as Claude Code, Cursor, and Manus choosing what each turn sees: system prompt, tool list, retrieved files, notes, and trimmed history. Support bots and research agents need the same choices between steps.", "worth": "you build agents or multi-turn products; know how the context window fails and how to write prompts first. Pipelines of single calls need only a little of it.", "resources": [{"title": "Effective context engineering for AI agents", "url": "https://www.anthropic.com/research/effective-context-engineering-for-ai-agents", "type": "blog", "by": "Anthropic, 2025", "level": 1}, {"title": "Context Engineering for AI Agents: Lessons from Building Manus", "url": "https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus", "type": "blog", "by": "Yichao Ji, Manus, 2025", "level": 2, "note": "Six lessons from production, among them masking tools instead of removing them and keeping failed actions in the context."}, {"title": "Context Engineering", "url": "https://www.langchain.com/blog/context-engineering-for-agents", "type": "blog", "by": "LangChain, 2025", "level": 2, "note": "Sorts the techniques into write, select, compress, and isolate, with examples from shipped agents."}, {"title": "How to Fix Your Context", "url": "https://www.dbreunig.com/2025/06/26/how-to-fix-your-context.html", "type": "blog", "by": "Drew Breunig, 2025", "level": 2, "note": "Six tactics: retrieval, tool loadouts, quarantine, pruning, summarization, and offloading."}, {"title": "Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models", "url": "https://arxiv.org/abs/2510.04618", "type": "paper", "by": "Zhang et al., 2025", "level": 3, "note": "Treats the context as a playbook that a generator, reflector, and curator improve from feedback, with no weight updates."}, {"title": "Context Engineering for AI Agents: Memory vs. Compaction vs. Tool Clearing", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/tool_use/context_engineering/context_engineering_tools.ipynb", "type": "project", "by": "Anthropic, 2026", "level": 2, "build": "A research agent reading about 320,000 tokens of documents, with context trajectories under clearing, compaction, and file-backed memory across two sessions.", "teaches": "Which kind of context growth each technique handles, and how to check what a summary kept.", "time": "a day", "mode": "Code along, then change it", "task": "Run the research agent over its eight documents with no context management, then with tool result clearing, compaction, and memory, plotting context size per turn; then write your own compaction prompt and probe what survives.", "signature": true}, {"title": "ACE: Agentic Context Engineering", "url": "https://github.com/ace-agent/ace", "type": "project", "by": "Zhang et al., 2025", "level": 3, "build": "Playbooks of strategies learned from execution feedback on FiNER and on your own task, each scored against the same model with no playbook.", "teaches": "How a context can be optimized like a parameter, and how small incremental edits keep it from collapsing into a short generic prompt.", "time": "a weekend", "mode": "Extend it", "task": "Run ACE’s offline adaptation on the FiNER task with the provided script, then add a dataset of your own following its tutorial and compare the learned playbook against an empty one."}]}, {"id": "promptcache", "title": "Prompt caching and stable prefixes", "kind": "concept", "track": "context", "pre": ["ctxeng", "costlat"], "frontier": false, "core": "Providers reuse the attention state of a recently seen prompt prefix at a tenth or less of the input price, which also cuts time to first token. Only an exact prefix matches, so put stable content first, append instead of editing, and keep timestamps out.", "reach": "Manus treats cache hit rate as its most important production metric; batching and paged attention do the same reuse on open models.", "uses": "Coding agents and chat apps with long system prompts, repeated questions over the same document, and LLM judges reusing one rubric; Manus designs its whole context around cache hits to cut cost and latency.", "worth": "you send the same long prefix more than once, which every agent does; cost and context engineering first. It takes a few hours and is often the largest single saving.", "resources": [{"title": "Prompt caching", "url": "https://platform.claude.com/docs/en/build-with-claude/prompt-caching", "type": "notes", "by": "Anthropic, 2026", "level": 1, "note": "Read how prefixes are matched, what invalidates the cache, and the 5-minute and 1-hour lifetimes."}, {"title": "Context Engineering for AI Agents: Lessons from Building Manus", "url": "https://manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus", "type": "blog", "by": "Yichao Ji, Manus, 2025", "level": 2, "note": "The first lesson, Design Around the KV-Cache: stable prefixes, append-only context, and deterministic serialization."}, {"title": "Prompt caching", "url": "https://developers.openai.com/api/docs/guides/prompt-caching", "type": "notes", "by": "OpenAI, 2026", "level": 2, "note": "Its optimization and gotchas sections cover adding tools and changing effort without breaking the prefix."}, {"title": "Don’t Break the Cache: An Evaluation of Prompt Caching for Long-Horizon Agentic Tasks", "url": "https://arxiv.org/abs/2601.06007", "type": "paper", "by": "Lumer et al., 2026", "level": 2, "note": "Across three providers caching cut agent cost 41 to 80 percent, and caching only the stable part was the most reliable."}, {"title": "SGLang: Efficient Execution of Structured Language Model Programs", "url": "https://arxiv.org/html/2312.07104v2#S3", "type": "section", "by": "Zheng et al., 2024", "level": 3, "section": "Section 3, Efficient KV Cache Reuse with RadixAttention", "covers": "How a server reuses the KV cache across requests that share a prefix, keeping cached sequences in a radix tree with LRU eviction and cache aware scheduling."}, {"title": "Prompt caching with the Claude API", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/misc/prompt_caching.ipynb", "type": "project", "by": "Anthropic, 2026", "level": 1, "build": "Timed calls over a 187,000-token novel with and without caching, single turn and multi-turn, plus one deliberately broken prefix.", "teaches": "What a cache hit looks like in the usage fields, and how one changed token at the front erases it.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Run the notebook’s uncached, automatic, and explicit breakpoint examples on the full novel, then put the current time at the top of the system prompt and record what happens to cache reads."}, {"title": "Cache an agent’s prefix three ways", "url": "https://arxiv.org/abs/2601.06007", "type": "project", "by": "Built on Lumer et al., 2026", "level": 2, "build": "Cost and time to first token per session for three caching strategies on one provider, over the same research questions.", "teaches": "Where to put cache breakpoints in an agent, and why caching dynamic tool results can make latency worse.", "time": "a weekend", "mode": "Reproduce a result", "task": "Build a web search agent with a 10,000-token system prompt, run 20 DeepResearch Bench questions with no caching, full context caching, and system prompt only caching, and log cost and time to first token.", "made": true, "done": "System prompt only caching cuts cost by at least 41 percent and time to first token by at least 13 percent against no caching, the low ends of the paper’s ranges."}]}, {"id": "compaction", "title": "Compaction: summarizing and pruning history", "kind": "concept", "track": "context", "pre": ["ctxeng"], "frontier": false, "core": "When history nears the window limit, replace old turns with a summary of decisions, open problems, and file paths, or drop old tool outputs the agent can fetch again. On SWE-bench, masking stale observations halved cost and matched the solve rate of LLM summaries.", "reach": "Long-running agents depend on it, and memory carries across sessions what compaction would lose.", "uses": "Claude Code and Codex compact their history when the window fills, Cursor summarizes long chats and keeps the full history as a searchable file, and research agents compress their notes between steps.", "worth": "your agents or chats run past one window; context engineering first. Short sessions can skip it, but anyone building a coding or research agent will need it.", "resources": [{"title": "Cutting Through the Noise: Smarter Context Management for LLM-Powered Agents", "url": "https://blog.jetbrains.com/research/2025/12/efficient-context-management/", "type": "blog", "by": "Katie Fraser and Tobias Lindenbauer, JetBrains Research, 2025", "level": 1}, {"title": "The Complexity Trap: Simple Observation Masking Is as Efficient as LLM Summarization for Agent Context Management", "url": "https://arxiv.org/abs/2508.21433", "type": "paper", "by": "Lindenbauer, Slinko, Felder, Bogomolov, Zharov, 2025", "level": 2}, {"title": "Evaluating Context Compression for AI Agents", "url": "https://factory.com/news/evaluating-compression", "type": "blog", "by": "Factory Research, 2025", "level": 2, "note": "Probes whether an agent can keep working after compression; a vendor’s own comparison, which scores its method highest."}, {"title": "Compaction", "url": "https://platform.claude.com/docs/en/build-with-claude/compaction", "type": "notes", "by": "Anthropic, 2026", "level": 2, "note": "Server-side compaction at a token threshold, in the background, on demand, or keeping recent turns verbatim."}, {"title": "MemGPT: Towards LLMs as Operating Systems", "url": "https://arxiv.org/abs/2310.08560", "type": "paper", "by": "Packer, Wooders, Lin, Fang, Patil, Stoica, Gonzalez, 2023", "level": 3, "note": "Treats the window as main memory and pages history in and out, with recursive summaries of evicted messages."}, {"title": "Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models", "url": "https://arxiv.org/html/2510.04618v3#S2", "type": "section", "by": "Zhang et al., 2025", "level": 2, "section": "Section 2, Background and Motivation", "covers": "Two ways repeated rewriting damages a context: brevity bias toward short generic prompts, and context collapse when a model rewrites the whole context and loses detail."}, {"title": "Session Memory Compaction", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/misc/session_memory_compaction.ipynb", "type": "project", "by": "Anthropic, 2026", "level": 1, "build": "A long conversation compacted by a blocking summary and by a summary kept current in a background thread, with prompt caching on the updates.", "teaches": "What a compaction prompt has to keep, and how to compact without making the user wait.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Run the notebook’s traditional and instant compaction examples, then rewrite its session memory prompt and ask ten questions about early turns to see which details survive each version."}, {"title": "Mask or summarize an agent’s history", "url": "https://github.com/JetBrains-Research/the-complexity-trap", "type": "project", "by": "Built on Lindenbauer et al., 2025", "level": 3, "build": "Solve rate and cost per task for three context strategies on the same 50 SWE-bench Verified tasks and model.", "teaches": "That the cheapest pruning rule can match a summarizer, and how to measure a context policy on a real agent.", "time": "a week", "mode": "Reproduce a result", "task": "Use the repository’s SWE-agent configs to run the raw agent, observation masking with a 10-turn window, and LLM summarization on a 50-task subset of SWE-bench Verified with one current model, then compare solve rate and cost.", "made": true, "done": "Masking costs about half of the raw agent with a solve rate within a few points of summarization, as in the paper (54.8 against 53.8 percent with Qwen3-Coder 480B)."}]}, {"id": "jit", "title": "Just-in-time context and progressive disclosure", "kind": "concept", "track": "context", "pre": ["ctxeng", "tooluse"], "frontier": true, "core": "Keep short references in the window (file paths, tool names, skill descriptions) and let the agent load full content with a tool when a task needs it. Claude Code greps files on demand, and Agent Skills show only a name and description until used.", "reach": "Agent skills, MCP tool search, and agentic search are this idea applied to instructions, tools, and documents.", "uses": "Claude Code reading files with grep instead of preloading a repository, Agent Skills that load on demand, tool search across hundreds of MCP tools, and Cursor writing long tool outputs to files the agent reads later.", "worth": "you build agents with many tools, files, or skills; tool calling and context engineering first. Simple chatbots with one prompt and no tools can skip it.", "resources": [{"title": "Equipping agents for the real world with Agent Skills", "url": "https://www.anthropic.com/research/equipping-agents-for-the-real-world-with-agent-skills", "type": "blog", "by": "Zhang, Lazuka, Murag, Anthropic, 2025", "level": 1, "note": "Progressive disclosure in three levels: metadata in the system prompt, the SKILL.md body, then linked files."}, {"title": "Dynamic context discovery", "url": "https://cursor.com/blog/dynamic-context-discovery", "type": "blog", "by": "Jediah Katz, Cursor, 2026", "level": 1, "note": "Tool outputs, chat history, terminals, and MCP tools become files the agent reads when needed; the 46.9 percent token cut is Cursor’s own A/B test."}, {"title": "Code execution with MCP: Building more efficient agents", "url": "https://www.anthropic.com/research/code-execution-with-mcp", "type": "blog", "by": "Anthropic, 2025", "level": 2, "note": "Tool definitions as files the agent lists and reads, which cut one workflow from 150,000 tokens to 2,000."}, {"title": "Introducing advanced tool use on the Claude Developer Platform", "url": "https://www.anthropic.com/research/advanced-tool-use", "type": "blog", "by": "Anthropic, 2025", "level": 2, "note": "The tool search tool and deferred loading, which keep hundreds of tool definitions out of the window until needed."}, {"title": "RAG-MCP: Mitigating Prompt Bloat in LLM Tool Selection via Retrieval-Augmented Generation", "url": "https://arxiv.org/abs/2505.03275", "type": "paper", "by": "Gan and Sun, 2025", "level": 3, "note": "Retrieving tool descriptions before the call more than tripled selection accuracy, 43.13 against 13.62 percent."}, {"title": "Tool Search with Embeddings", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/tool_use/tool_search_with_embeddings.ipynb", "type": "project", "by": "Anthropic, 2026", "level": 2, "build": "An agent that finds tools by embedding search and loads only their definitions, tested with 8 and with 200 tools.", "teaches": "What on-demand loading saves in tokens, and when a search step starts to miss the right tool.", "time": "a day", "mode": "Code along, then change it", "task": "Build the notebook’s tool_search tool over its eight tools, then grow the library to 200 generated tools and compare input tokens and tool choice accuracy against loading every definition."}]}, {"id": "longvsrag", "title": "Long context or retrieval", "kind": "concept", "track": "context", "pre": ["contextwin", "rag"], "frontier": false, "core": "If the corpus fits and the model reads it well, put it all in the window; retrieval wins on cost, latency, freshness, and corpora larger than any window. Many systems retrieve first and send the full context only when retrieval cannot answer.", "reach": "Contextual retrieval, hybrid search, and agentic search improve the retrieval side; prompt caching makes the long context side cheaper.", "uses": "Choosing an architecture for document question answering, contract review, and questions about a codebase; Anthropic suggests putting knowledge bases under 200,000 tokens straight into a cached prompt, while search engines and company wikis still need retrieval.", "worth": "you are designing a system over documents; learn retrieval and the context window’s limits first. Teams whose corpus is a few files can go straight to long context.", "resources": [{"title": "Introducing Contextual Retrieval", "url": "https://www.anthropic.com/research/contextual-retrieval", "type": "blog", "by": "Anthropic, 2024", "level": 1, "note": "It opens by saying a knowledge base under 200,000 tokens can go straight into a cached prompt."}, {"title": "Retrieval Augmented Generation or Long-Context LLMs? A Comprehensive Study and Hybrid Approach", "url": "https://arxiv.org/abs/2407.16833", "type": "paper", "by": "Li, Li, Zhang, Mei, Bendersky, 2024", "level": 2, "note": "Long context beat retrieval on average, retrieval cost far less, and Self-Route kept most of both."}, {"title": "Long Context vs. RAG for LLMs: An Evaluation and Revisits", "url": "https://arxiv.org/abs/2501.01880", "type": "paper", "by": "Li, Cao, Ma, Sun, 2024", "level": 2, "note": "Long context wins on Wikipedia questions, retrieval on dialogue and general queries, and summary-based retrieval matches long context."}, {"title": "Retrieval meets Long Context Large Language Models", "url": "https://arxiv.org/abs/2310.03025", "type": "paper", "by": "Xu et al., NVIDIA, 2024", "level": 2, "note": "A 4K model with retrieval matched a 16K long context model, and retrieval still helped at 32K."}, {"title": "Long-Context LLMs Meet RAG: Overcoming Challenges for Long Inputs in RAG", "url": "https://arxiv.org/abs/2410.05983", "type": "paper", "by": "Jin, Yoon, Han, Arik, 2024", "level": 3, "note": "Giving a long context model more retrieved passages first helps and then hurts, because of hard negatives."}, {"title": "Route between retrieval and the full document", "url": "https://arxiv.org/abs/2407.16833", "type": "project", "by": "Built on Li et al., 2024", "level": 2, "build": "Scores and input token counts for full context, retrieval, and Self-Route on three LongBench question answering sets with one current model.", "teaches": "How often cheap retrieval already gives the long context answer, and what routing saves.", "time": "a weekend", "mode": "Reproduce a result", "task": "Write a pipeline over LongBench’s NarrativeQA, Qasper, and HotpotQA sets that answers each question with full context, with the top 5 retrieved chunks, and with Self-Route, logging score and input tokens.", "made": true, "done": "Self-Route scores close to full context while cutting input tokens by at least 39 percent, the saving the paper reports for GPT-4o (65 percent for Gemini 1.5 Pro)."}]}, {"id": "embeddings", "title": "Embeddings and vector search", "kind": "concept", "track": "retrieval", "pre": ["llmapi"], "frontier": false, "core": "An embedding model turns a text into a vector so that texts with similar meaning land near each other. Search embeds the query and returns the nearest stored vectors, found fast by an approximate index such as HNSW. Test models on your own queries.", "reach": "The first stage of RAG and memory lookups; hybrid search and reranking repair the queries that nearest vectors miss.", "uses": "Semantic search over docs and help centers, duplicate question detection, recommendations by nearest neighbor, clustering user feedback, and the vector stores behind OpenAI’s file search and most RAG products.", "worth": "you will build search, RAG, or memory over your own data; learn it before any other retrieval idea, and skip the index internals unless you run your own.", "resources": [{"title": "Embeddings: What they are and why they matter", "url": "https://simonwillison.net/2023/Oct/23/embeddings/", "type": "blog", "by": "Simon Willison, 2023", "level": 1}, {"title": "Sentence-BERT: Sentence Embeddings using Siamese BERT-Networks", "url": "https://arxiv.org/abs/1908.10084", "type": "paper", "by": "Reimers and Gurevych, UKP Lab, 2019", "level": 2}, {"title": "MTEB: Massive Text Embedding Benchmark", "url": "https://arxiv.org/abs/2210.07316", "type": "paper", "by": "Muennighoff, Tazi, Magne, Reimers, 2022", "level": 2, "note": "No model wins every task, which is why you test on your own data; the live leaderboard is a Hugging Face Space."}, {"title": "Efficient and robust approximate nearest neighbor search using Hierarchical Navigable Small World graphs", "url": "https://arxiv.org/abs/1603.09320", "type": "paper", "by": "Malkov and Yashunin, 2016", "level": 3}, {"title": "On the Theoretical Limitations of Embedding-Based Retrieval", "url": "https://arxiv.org/abs/2508.21038", "type": "paper", "by": "Weller, Boratko, Naim, Lee, Google DeepMind, 2025", "level": 3}, {"title": "Semantic search with FAISS", "url": "https://huggingface.co/learn/llm-course/chapter5/6", "type": "project", "by": "Hugging Face LLM Course, Chapter 5", "level": 1, "build": "A semantic search engine over the GitHub issues of the Hugging Face Datasets library, answering questions like how to load a dataset offline.", "teaches": "The whole embed, index, and query path in a few dozen lines, and how much the choice of embedding model changes what comes back.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Type out the chapter’s code to embed GitHub issue comments with a sentence-transformers model and index them in FAISS, then swap in a second embedding model and compare the top five results for ten queries."}, {"title": "Find the ceiling of single-vector retrieval on LIMIT", "url": "https://github.com/google-deepmind/limit", "type": "project", "by": "Built on Weller et al., LIMIT, 2025", "level": 2, "build": "Recall at 2, 10, and 100 for BM25 and a dense model on both sizes of LIMIT, plotted against embedding dimension.", "teaches": "That one fixed-size vector per document cannot express every combination of relevant documents, which is why keyword search and rerankers stay in production stacks.", "time": "a day", "mode": "Reproduce a result", "task": "Run BM25 and one open embedding model on LIMIT and LIMIT-small through MTEB’s LIMIT retrieval tasks, then repeat at two smaller embedding dimensions if the model allows truncation, and plot recall against dimension.", "made": true, "done": "BM25 reaches about 94 percent recall@100 on full LIMIT while your single-vector model stays under 20 percent, as in the paper’s Table 5."}]}, {"id": "rag", "title": "Retrieval-augmented generation", "kind": "concept", "track": "retrieval", "pre": ["embeddings", "prompting"], "frontier": false, "core": "Retrieval-augmented generation searches your own documents for passages relevant to the question and puts them in the prompt, so the model answers from text it can quote and cite. Score retrieval and the final answer separately, since most bad answers start with a missed passage.", "reach": "Hybrid search, chunking, and reranking improve the retrieval half; agentic search turns the single lookup into a loop.", "uses": "Support bots that answer from a help center, Perplexity and ChatGPT search citing web pages, internal document search such as Glean, and legal or medical assistants that must quote their source.", "worth": "your model must answer from documents it was never trained on, or cite them; embeddings first, and if the corpus fits in the window, long context may be simpler.", "resources": [{"title": "Patterns for Building LLM-based Systems & Products", "url": "https://eugeneyan.com/writing/llm-patterns/", "type": "blog", "by": "Eugene Yan, 2023", "level": 1, "note": "Read the section Retrieval-Augmented Generation: To add knowledge."}, {"title": "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks", "url": "https://arxiv.org/abs/2005.11401", "type": "paper", "by": "Lewis et al., Facebook AI, 2020", "level": 2}, {"title": "Systematically Improving Your RAG", "url": "https://jxnl.co/writing/2024/05/22/systematically-improving-your-rag/", "type": "blog", "by": "Jason Liu, 2024", "level": 2}, {"title": "Retrieval-Augmented Generation for Large Language Models: A Survey", "url": "https://arxiv.org/html/2312.10997v5#S2", "type": "section", "by": "Gao et al., Tongji and Fudan, 2023", "level": 2, "section": "Section II, Overview of RAG", "covers": "The indexing, retrieval, and generation steps of a basic pipeline, then the query rewriting, reranking, and modular designs that later systems added to fix its failures."}, {"title": "Retrieval Augmented Generation guide", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/capabilities/retrieval_augmented_generation/guide.ipynb", "type": "project", "by": "Anthropic Claude Cookbooks, 2024", "level": 2, "build": "A RAG system over Anthropic’s documentation with its own evaluation suite, improved first by summary indexing and then by reranking with Claude.", "teaches": "How to evaluate retrieval apart from answers; in the recorded run, end-to-end accuracy rose from 71 to 81 percent across the three levels.", "time": "a day", "mode": "Code along, then change it", "task": "Rebuild the notebook’s three levels over the Claude documentation, scoring precision, recall, MRR, and end-to-end accuracy on its 100 questions at each level, then add one improvement of your own and score it."}]}, {"id": "hybrid", "title": "Hybrid search and reranking", "kind": "concept", "track": "retrieval", "pre": ["rag"], "frontier": false, "core": "Keyword search with BM25 finds exact names, error codes, and rare terms that embeddings blur, and embeddings find paraphrases that keywords miss. Run both, merge their rankings with reciprocal rank fusion, then let a cross-encoder reread the top hundred against the query and reorder them.", "reach": "Contextual retrieval runs this same stack over chunks with added context, and agentic search calls it as a tool.", "uses": "Elasticsearch, OpenSearch, Weaviate, and Vespa ship BM25 fused with vector search; Cohere and Voyage sell rerankers; code search needs the exact ide
