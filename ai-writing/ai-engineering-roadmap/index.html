 DeepMind, 2025", "level": 1, "note": "The results that made the method famous: 0.7 percent of Google’s compute recovered, a 23 percent kernel speedup, and new bounds on open problems."}, {"title": "Mathematical discoveries from program search with large language models", "url": "https://www.nature.com/articles/s41586-023-06924-6", "type": "paper", "by": "Romera-Paredes et al., Google DeepMind, Nature, 2023", "level": 2, "note": "FunSearch, the first version: an island-based program database and an evaluator found larger cap sets and better bin-packing heuristics."}, {"title": "AlphaEvolve: A coding agent for scientific and algorithmic discovery", "url": "https://arxiv.org/abs/2506.13131", "type": "paper", "by": "Novikov et al., Google DeepMind, 2025", "level": 2}, {"title": "ShinkaEvolve: Towards Open-Ended And Sample-Efficient Program Evolution", "url": "https://arxiv.org/abs/2509.19349", "type": "paper", "by": "Lange, Imajuku, Cetin, Sakana AI, 2025", "level": 3, "note": "Parent sampling, novelty rejection, and a bandit over models; a new best circle packing in about 150 samples."}, {"title": "OpenEvolve circle packing", "url": "https://github.com/algorithmicsuperintelligence/openevolve", "type": "project", "by": "OpenEvolve contributors, 2025", "level": 2, "note": "The example’s README reports 2.634 after about 800 generations with the default configuration.", "build": "An evolved program that packs 26 circles in a unit square, scored by the example’s evaluator against AlphaEvolve’s sum of radii of 2.635.", "teaches": "How the evaluator, the program database, and the prompt each steer the search, and why runs plateau until the configuration changes.", "time": "a weekend", "mode": "Reproduce a result", "task": "Run OpenEvolve’s circle_packing example for 26 circles with its two-phase configs and any OpenAI-compatible model, then read how the evolved programs changed between phases.", "signature": true}]}, {"id": "arc", "title": "ARC-AGI: refinement loops on an unsolved benchmark", "kind": "concept", "track": "search", "pre": ["evosearch", "selfrefine"], "frontier": true, "core": "A refinement loop has the model write a program for an ARC task’s rule, runs it on the example grids, and feeds the mismatches into the next try. Poetiq’s loop took Gemini 3 Pro from 31% to 54% on ARC-AGI-2, a score ARC Prize verified.", "reach": "Greenblatt’s sampling and test-time training are the other two routes; by late 2026, frontier models alone pass 90% on ARC-AGI-2.", "uses": "ARC Prize competitions and the verified leaderboard, Poetiq’s open solver, and test-time training in Kaggle entries. The same propose, run, and repair loop drives coding agents and AlphaEvolve, here on puzzles where memorized knowledge does not help.", "worth": "you want a clean testbed for search, refinement, and test-time training with cheap exact checks; evolutionary search and self-refinement first. Product builders can skim the results posts.", "resources": [{"title": "ARC Prize 2025 Results & Analysis", "url": "https://arcprize.org/blog/arc-prize-2025-results-analysis", "type": "blog", "by": "Mike Knoop, ARC Prize, 2025", "level": 1, "note": "Defines refinement loops; Poetiq’s 54 percent and Opus 4.5’s 37.6 percent here are scores ARC Prize verified itself."}, {"title": "Getting 50% (SoTA) on ARC-AGI with GPT-4o", "url": "https://blog.redwoodresearch.org/p/getting-50-sota-on-arc-agi-with-gpt", "type": "blog", "by": "Ryan Greenblatt, Redwood Research, 2024", "level": 1, "note": "Self-reported, on 100 public evaluation tasks: about 8,000 programs per task, revisions of the best, and a vote, gaining about 3 points per doubling of samples."}, {"title": "Poetiq Shatters ARC-AGI-2 State of the Art at Half the Cost", "url": "https://poetiq.ai/posts/arcagi_verified/", "type": "blog", "by": "Poetiq, 2025", "level": 2, "note": "The 54 percent at $30.57 a task is ARC Prize verified; Poetiq’s later 75 percent with GPT-5.2 is self-reported, on the public set."}, {"title": "The Surprising Effectiveness of Test-Time Training for Few-Shot Learning", "url": "https://arxiv.org/abs/2411.07279", "type": "paper", "by": "Akyürek et al., MIT, 2024", "level": 2, "note": "Self-reported, on the public validation set: fine-tuning an 8B model on each task’s examples reached 53 percent, and 61.9 with program synthesis."}, {"title": "ARC-AGI Leaderboard", "url": "https://arcprize.org/leaderboard", "type": "notes", "by": "ARC Prize Foundation, 2026", "level": 1, "note": "Verified semi-private scores with cost per task; refinement systems carry a Refine. label beside the model name."}, {"title": "ARC Prize 2024: Technical Report", "url": "https://arxiv.org/html/2412.04604v2#S3", "type": "section", "by": "Chollet, Knoop, Kamradt, Landers, 2024", "level": 2, "section": "Section 3, Top Approaches", "covers": "The three routes that lifted the private score from 33 to 55.5 percent: deep learning guided program synthesis, test-time training, and program synthesis combined with transduction."}, {"title": "ARC-AGI-2: A New Challenge for Frontier AI Reasoning Systems", "url": "https://arxiv.org/html/2505.11831v1#S7", "type": "section", "by": "Chollet, Knoop, Kamradt, Landers, Pinkard, 2025", "level": 2, "section": "Section 7, What makes ARC-AGI-2 more challenging?", "covers": "What ARC-AGI-2 adds over the first version: tasks with several interacting rules, steps that depend on earlier steps, rules chosen by context, and symbols defined inside the task."}, {"title": "Poetiq ARC-AGI solver", "url": "https://github.com/poetiq-ai/poetiq-arc-agi-solver", "type": "project", "by": "Poetiq, 2025", "level": 2, "build": "Accuracy and cost per task for the full refinement loop, a single attempt, and an eight-expert vote on the same 40 tasks.", "teaches": "How much feeding program failures back adds to the score compared with sampling and voting, on your own budget.", "time": "a weekend", "mode": "Extend it", "task": "Run Poetiq’s open solver on the first 40 ARC-AGI-2 public evaluation tasks with one affordable model, then rerun with max_iterations set to 1 and with 8 experts, and compare accuracy and cost."}]}, {"id": "evaldesign", "title": "Error analysis and eval design", "kind": "concept", "track": "evals", "pre": ["prompting"], "frontier": false, "core": "Read a hundred real traces, write a note on what went wrong in each, group the notes into failure modes, and count them. Then write a pass or fail check for each frequent failure, as code where possible and as a judge where needed.", "reach": "Judges are checked against the failures it labels, and prompt optimizers and harness search climb the test sets it builds.", "uses": "Deciding what to measure in any LLM product; in Hamel Husain’s NurtureBoss case, three failure types made up over 60 percent of problems. The same labeled failures become the test sets that DSPy and GEPA optimize against, and the regression suite for every model upgrade.", "worth": "you ship anything built on a model; it needs no math, only hours spent reading outputs, and the rest of this track builds on it.", "resources": [{"title": "A Field Guide to Rapidly Improving AI Products", "url": "https://hamel.dev/blog/posts/field-guide/", "type": "blog", "by": "Hamel Husain, 2025", "level": 1, "note": "Start with the sections on skipping error analysis and on building a simple data viewer."}, {"title": "AI Evals: Everything You Need to Know", "url": "https://hamel.dev/blog/posts/evals-faq/", "type": "blog", "by": "Hamel Husain and Shreya Shankar, 2026", "level": 2, "note": "Read the error analysis and evaluation design questions first: open and axial coding, how many traces to review, and binary labels over 1 to 5 scales."}, {"title": "Who Validates the Validators? Aligning LLM-Assisted Evaluation of LLM Outputs with Human Preferences", "url": "https://arxiv.org/abs/2404.12272", "type": "paper", "by": "Shankar, Zamfirescu-Pereira, Hartmann, Parameswaran, Arawjo, 2024", "level": 2, "note": "Finds criteria drift: people work out their grading criteria by grading outputs, so the criteria cannot all be written down in advance."}, {"title": "Task-Specific LLM Evals that Do & Don’t Work", "url": "https://eugeneyan.com/writing/evals/", "type": "blog", "by": "Eugene Yan, 2024", "level": 2, "note": "Metrics that hold up for classification, summarization, translation, copyright regurgitation, and toxicity, and the ones that do not."}, {"title": "AI Evals course, Homework 2: Recipe Bot error analysis", "url": "https://github.com/ai-evals-course/recipe-chatbot/tree/main/homeworks/hw2", "type": "project", "by": "Husain and Shankar, AI Evals course, 2025", "level": 1, "note": "The folder ships 250 query and response traces with a viewer, so you can start at open coding.", "build": "A failure taxonomy for the Recipe Bot, each mode with a title, a one sentence definition, and examples taken from your own traces.", "teaches": "That the failure modes worth measuring come out of reading traces, and how much a note per trace reveals that a generic metric misses.", "time": "a day", "mode": "Do the assignment", "task": "Generate test queries along three or four dimensions, run the Recipe Bot on them, open code the traces with free notes, then group the notes into a failure taxonomy in the provided template."}]}, {"id": "judge", "title": "LLM as a judge", "kind": "concept", "track": "evals", "pre": ["evaldesign"], "frontier": false, "core": "A judge is a model prompted to grade an output against one written criterion, pass or fail. Treat it as a classifier: label a hundred traces yourself, measure its true positive and true negative rates on held out labels, and correct its reported pass rates.", "reach": "Guardrails run judges inline, prompt optimizers use them as the score, and their error rates widen the error bars on every eval they grade.", "uses": "Grading open-ended outputs at scale: MT-Bench and AlpacaEval rank chat models with a GPT-4 judge, Langfuse and Arize Phoenix run judges over live traces, and Constitutional AI turns model judgments into the training reward.", "worth": "you grade outputs that have no single right answer; do error analysis first, and skip it if every check you need can be written as code.", "resources": [{"title": "Using LLM-as-a-Judge For Evaluation: A Complete Guide", "url": "https://hamel.dev/blog/posts/llm-judge/", "type": "blog", "by": "Hamel Husain, 2024", "level": 1, "note": "One domain expert’s pass or fail labels and written critiques become the judge’s examples; iterate until it agrees with the expert."}, {"title": "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena", "url": "https://arxiv.org/abs/2306.05685", "type": "paper", "by": "Zheng et al., LMSYS, 2023", "level": 2, "note": "GPT-4 as a judge agrees with human preferences over 80 percent of the time, about as often as humans agree with each other."}, {"title": "Evaluating the Effectiveness of LLM-Evaluators (aka LLM-as-Judge)", "url": "https://eugeneyan.com/writing/llm-evaluators/", "type": "blog", "by": "Eugene Yan, 2024", "level": 2, "note": "A survey of judge techniques and when each holds up; argues for binary outputs scored with precision and recall against expert labels."}, {"title": "Limits to scalable evaluation at the frontier: LLM as Judge won’t beat twice the data", "url": "https://arxiv.org/abs/2410.13341", "type": "paper", "by": "Dorner, Nastl, Hardt, 2025", "level": 3, "note": "When the judge is no more accurate than the model it grades, no debiasing method cuts the human labels needed by more than half."}, {"title": "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena", "url": "https://arxiv.org/html/2306.05685v4#S3.SS3", "type": "section", "by": "Zheng et al., LMSYS, 2023", "level": 1, "section": "Section 3.3, Limitations of LLM-as-a-Judge", "covers": "Position bias, verbosity bias, self-enhancement bias, and weak grading of math answers, each measured with a small experiment you can copy for your own judge."}, {"title": "AI Evals course, Homework 3: LLM as a judge", "url": "https://github.com/ai-evals-course/recipe-chatbot/tree/main/homeworks/hw3", "type": "project", "by": "Husain and Shankar, AI Evals course, 2025", "level": 2, "note": "The provided 101 labeled traces let you skip labeling and start at writing the judge.", "build": "A dietary adherence judge with measured true positive and true negative rates, run over 500 or more new traces, and a corrected success rate with a 95 percent confidence interval.", "teaches": "That a judge is a measuring instrument with its own error, and how that error changes the number you report and how sure you can be of it.", "time": "a weekend", "mode": "Do the assignment", "task": "Label 100 to 200 Recipe Bot traces for dietary adherence, split them into train, dev, and test, refine a judge prompt on dev, report its rates on test, then correct the pass rate with judgy.", "signature": true}]}, {"id": "evalstats", "title": "Error bars on evals", "kind": "concept", "track": "evals", "pre": ["evaldesign"], "frontier": false, "core": "An eval score is a sample mean over questions, so report it with a standard error. Cluster the error when questions share a passage, compare two models with paired differences on the same questions, and work out beforehand how many questions a given gap needs.", "reach": "These numbers decide whether a prompt change or a new harness actually helped, and how many trials an agent benchmark comparison needs.", "uses": "Telling whether a prompt change, a new model, or a harness tweak beat the old one; Inspect reports clustered standard errors, Chatbot Arena puts confidence intervals on its ratings, and A/B tests of prompts need the same power calculation.", "worth": "you compare systems on fewer than a few thousand questions, which covers most agent evals; introductory statistics is enough, and the Anthropic post covers most of it in an hour.", "resources": [{"title": "A statistical approach to model evaluations", "url": "https://www.anthropic.com/research/statistical-approach-to-model-evals", "type": "blog", "by": "Anthropic, 2024", "level": 1, "note": "Five recommendations on one page: standard errors, clustering, resampling, paired differences, and power analysis."}, {"title": "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations", "url": "https://arxiv.org/abs/2411.00640", "type": "paper", "by": "Evan Miller, Anthropic, 2024", "level": 2, "note": "The formulas behind each recommendation; on DROP the clustered standard error comes out about three times the naive one."}, {"title": "Scoring: Metrics", "url": "https://inspect.aisi.org.uk/metrics.html", "type": "code", "by": "UK AI Security Institute, Inspect", "level": 2, "note": "Clustered standard errors, Wilson intervals for binary scores, and epochs for resampling, built into an eval runner."}, {"title": "Position: Don’t Use the CLT in LLM Evals With Fewer Than a Few Hundred Datapoints", "url": "https://arxiv.org/abs/2503.01747", "type": "paper", "by": "Bowyer, Aitchison, Ivanova, 2025", "level": 3, "note": "On small benchmarks, CLT error bars come out too narrow; it gives frequentist and Bayesian intervals that hold up."}, {"title": "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations", "url": "https://arxiv.org/html/2411.00640v1#S4.SS2", "type": "section", "by": "Evan Miller, Anthropic, 2024", "level": 2, "section": "Section 4.2, Paired analysis", "covers": "Why scoring two models on the same questions removes question difficulty from the comparison, and how far the standard error of the difference falls as their scores correlate."}, {"title": "Clustered and paired error bars on MGSM", "url": "https://github.com/UKGovernmentBEIS/inspect_evals/tree/main/src/inspect_evals/mgsm", "type": "project", "by": "Built on Miller, 2024, and inspect_evals", "level": 2, "note": "MGSM asks each of 250 questions in 11 languages, so the task clusters on question_id.", "build": "A results table in the paper’s suggested format: each score with naive and clustered errors, the paired difference with its interval, and the correlation of the two models’ question scores.", "teaches": "How much of a gap between two models is noise from which questions were drawn, and how clustering and pairing change that answer.", "time": "a day", "mode": "Apply it", "task": "Run inspect_evals’ MGSM task on two models, compute the naive standard error beside the clustered one it reports, then compute the paired difference and its standard error from the per-sample logs.", "made": true, "done": "The clustered standard error comes out well above the naive one, near the ratio of 1.88 in the paper’s Table 4, and the paired error falls below the unpaired one."}]}, {"id": "agentbench", "title": "Agent benchmarks", "kind": "concept", "track": "evals", "pre": ["evaldesign", "agentloop"], "frontier": false, "core": "An agent benchmark gives each task an environment and a checker that inspects the end state, such as hidden tests on a repository or rows in a database. Runs vary, so run each task several times and report how often all trials pass.", "reach": "Benchmarks become RL environments and the scores automated research agents chase; contamination and broken checkers decide how long each stays useful.", "uses": "Model launches report SWE-bench Pro, Terminal-Bench 2.0, and τ²-bench scores; METR tracks agent progress in hours of human work; and the same task, environment, and checker format becomes the RL environments coding agents train in.", "worth": "you build, buy, or train agents and need to compare them; eval design first, and expect to read transcripts, since a score alone hides broken tasks.", "resources": [{"title": "Demystifying evals for AI agents", "url": "https://www.anthropic.com/research/demystifying-evals-for-ai-agents", "type": "blog", "by": "Grace, Hadfield, Olivares, De Jonghe, Anthropic, 2026", "level": 1, "note": "Tasks, trials, graders, and transcripts; pass@k against pass^k; and starting from 20 to 50 tasks drawn from real failures."}, {"title": "SWE-bench: Can Language Models Resolve Real-World GitHub Issues?", "url": "https://arxiv.org/abs/2310.06770", "type": "paper", "by": "Jimenez, Yang et al., Princeton, 2024", "level": 2, "note": "2,294 issues from 12 Python repositories, graded by the tests from the pull request that fixed each one."}, {"title": "τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains", "url": "https://arxiv.org/abs/2406.12045", "type": "paper", "by": "Yao, Shinn, Razavi, Narasimhan, Sierra, 2024", "level": 2, "note": "A simulated user, written domain policies, and a check on the final database; introduces pass^k, which falls below 25 percent at k = 8 for gpt-4o on retail."}, {"title": "Establishing Best Practices for Building Rigorous Agentic Benchmarks", "url": "https://arxiv.org/abs/2507.02825", "type": "paper", "by": "Zhu et al., 2025", "level": 2, "note": "Flaws in task setup or grading misstate agent performance by up to 100 percent in relative terms; τ-bench, for one, counted empty responses as successes."}, {"title": "Terminal-Bench: Benchmarking Agents on Hard, Realistic Tasks in Command Line Interfaces", "url": "https://arxiv.org/abs/2601.11868", "type": "paper", "by": "Merrill, Shaw, Carlini et al., 2026", "level": 2, "note": "89 tasks in containers, each with a human solution and tests; frontier agents score under 65 percent."}, {"title": "Measuring AI Ability to Complete Long Software Tasks", "url": "https://arxiv.org/abs/2503.14499", "type": "paper", "by": "Kwa, West et al., METR, 2025", "level": 3, "note": "Measures agents by the human working time of tasks they finish half the time, a length that has doubled about every seven months."}, {"title": "Establishing Best Practices for Building Rigorous Agentic Benchmarks", "url": "https://arxiv.org/html/2507.02825v5#S4", "type": "section", "by": "Zhu et al., 2025", "level": 2, "section": "Section 4, ABC: Agentic Benchmark Checklist", "covers": "Checks for task validity, such as pinned tool versions, clean isolated environments, and an oracle solver, then for graders that cannot be fooled and for honest reporting."}, {"title": "mini-SWE-agent on SWE-bench", "url": "https://mini-swe-agent.com/latest/usage/swebench/", "type": "project", "by": "SWE-agent team, Princeton and Stanford, 2025", "level": 2, "build": "Patches and full trajectories for 50 SWE-bench instances from two models, each scored against the hidden tests, with a failure label on the unresolved ones you read.", "teaches": "What an agent benchmark actually checks, how much a resolve rate moves between models on 50 tasks, and how often a failure traces back to the task.", "time": "a weekend", "mode": "Apply it", "task": "Run mini-extra swebench on a 50 instance slice of SWE-bench Verified with two models, score both prediction files with sb-cli, then read five failed trajectories and label why each failed."}, {"title": "τ²-bench", "url": "https://github.com/sierra-research/tau2-bench", "type": "project", "by": "Sierra Research, 2025", "level": 2, "build": "Three trials per retail task for one model, with single trial success and pass^3 computed and the inconsistent tasks pulled out for reading.", "teaches": "How far reliability across repeated runs falls below one trial success, and which kinds of task an agent gets right only sometimes.", "time": "a day", "mode": "Apply it", "task": "Run tau2 run-pass3 on the retail domain with one agent model, compare its pass^3 with its single trial success rate, then read the transcripts of tasks it passed only some of the time."}]}, {"id": "contamination", "title": "Contamination and saturated benchmarks", "kind": "concept", "track": "evals", "pre": ["agentbench"], "frontier": false, "core": "A benchmark stops measuring skill once its questions and answers leak into training data, or once the best models all score near the top. Prefer problems dated after the model’s cutoff, private test sets, and probes for memorization, such as asking for a gold patch.", "reach": "Agent benchmarks keep being replaced for this reason, and any harness search needs a held out split it never tunes on.", "uses": "Reading leaderboards with care: OpenAI stopped reporting SWE-bench Verified in February 2026 after models recited gold patches, LiveCodeBench scores only problems newer than a model, and a private split keeps a harness optimizer from fitting its test set.", "worth": "you pick models from public scores or tune a system against a benchmark; agent benchmarks first, a day’s reading, and teams that rely only on private evals can skim it.", "resources": [{"title": "Why SWE-bench Verified no longer measures frontier coding capabilities", "url": "https://openai.com/index/why-we-no-longer-evaluate-swe-bench-verified/", "type": "blog", "by": "OpenAI, 2026", "level": 1, "note": "Of 138 hard tasks audited, 59.4 percent had flawed tests, and every frontier model probed could reproduce gold patches or problem details for some tasks."}, {"title": "LiveCodeBench: Holistic and Contamination Free Evaluation of Large Language Models for Code", "url": "https://arxiv.org/abs/2403.07974", "type": "paper", "by": "Jain et al., 2024", "level": 2, "note": "Every problem carries a release date; DeepSeek and GPT-4o score far lower on problems published after their release and cutoff dates."}, {"title": "A Careful Examination of Large Language Model Performance on Grade School Arithmetic", "url": "https://arxiv.org/abs/2405.00332", "type": "paper", "by": "Zhang et al., Scale AI, 2024", "level": 2, "note": "GSM1k, a new set written to match GSM8K; some model families drop up to 8 points while many frontier models barely move."}, {"title": "The SWE-Bench Illusion: When State-of-the-Art LLMs Remember Instead of Reason", "url": "https://arxiv.org/abs/2506.12286", "type": "paper", "by": "Liang, Garg, Zilouchian Moghaddam, Microsoft, 2025", "level": 3, "note": "From the issue text alone, models name the file to edit up to 76 percent of the time on SWE-bench Verified and up to 53 percent on other repositories."}, {"title": "Benchmarks Are Dead (for us)", "url": "https://poetiq.ai/posts/benchmarks_are_dead/", "type": "blog", "by": "Poetiq, 2026", "level": 3, "note": "The vendor’s own case, with self-reported results: a self-improving system saturates static benchmarks, so it moves to ones like ArXivMath built after training cutoffs."}, {"title": "LiveCodeBench", "url": "https://github.com/LiveCodeBench/LiveCodeBench", "type": "project", "by": "Jain et al., 2024", "level": 2, "note": "DeepSeek-Coder-33B-Instruct reproduces the paper’s Figure 1; any open model with a published cutoff works.", "build": "Pass@1 by release month on LiveCodeBench problems for one open model, with its release date marked on the plot.", "teaches": "What contamination looks like in a score, and how a dated benchmark lets you score only problems a model cannot have seen.", "time": "a day", "mode": "Apply it", "task": "Run lcb_runner’s code generation scenario on an open model with a known release date, then score monthly windows with compute_scores and its start_date flag and plot pass@1 by month."}, {"title": "Probe SWE-bench Verified for memorization", "url": "https://arxiv.org/abs/2506.12286", "type": "project", "by": "Built on Liang, Garg, Zilouchian Moghaddam, 2025", "level": 2, "build": "File path predictions made from issue text alone for two sets of tasks, scored against the files each gold patch touches.", "teaches": "A cheap test for memorization to run on any benchmark before trusting its scores.", "time": "a day", "mode": "Reproduce a result", "task": "Give a model only the issue text for 100 SWE-bench Verified tasks and 100 tasks from repositories outside SWE-bench, such as SWE-bench Pro’s public set, and score its file guesses against the gold patches.", "made": true, "done": "Accuracy on Verified issues comes out well above accuracy on the outside set, in the direction of the paper’s 76 against 53 percent."}]}, {"id": "tracing", "title": "Tracing and observability", "kind": "concept", "track": "evals", "pre": ["agentloop", "evaldesign"], "frontier": false, "core": "Record each run as a trace: a tree of spans, one per model call, tool call, or retrieval, each holding its inputs, outputs, tokens, latency, and errors. Traces are what error analysis reads and how you find why step 40 failed.", "reach": "Error analysis, online judges, and agent monitors all read from traces.", "uses": "Debugging agents in production: Langfuse, Arize Phoenix, LangSmith, and the OpenAI Agents SDK record nested spans, and Anthropic credits full production tracing for finding why its research agents failed. Traces also feed error analysis, online judges, and cost dashboards.", "worth": "you run anything with more than one model call; learn the agent loop first, and instrument with OpenTelemetry conventions so traces can move between vendors.", "resources": [{"title": "Observability Data Model", "url": "https://langfuse.com/docs/observability/data-model", "type": "notes", "by": "Langfuse, 2026", "level": 1, "note": "Traces, nested observations, and sessions, with user, tag, and release attributes for filtering; built on OpenTelemetry."}, {"title": "Tracing", "url": "https://openai.github.io/openai-agents-python/tracing/", "type": "notes", "by": "OpenAI Agents SDK, 2026", "level": 1, "note": "The spans a framework records by default for agents, model calls, tools, guardrails, and handoffs, and the switch that keeps sensitive inputs out."}, {"title": "Semantic conventions for generative AI systems", "url": "https://github.com/open-telemetry/semantic-conventions-genai/blob/main/docs/gen-ai/README.md", "type": "notes", "by": "OpenTelemetry GenAI SIG, 2026", "level": 2, "note": "Standard span names and attributes for model calls, agents, tools, and MCP, so traces move between vendors; the status is still Development."}, {"title": "Hugging Face Agents Course, Bonus Unit 2: Observability and evaluation of agents", "url": "https://huggingface.co/learn/agents-course/bonus-unit2/monitoring-and-evaluating-agents-notebook", "type": "project", "by": "Hugging Face Agents Course and Langfuse, 2025", "level": 1, "build": "A traced smolagents agent whose model and tool spans, token costs, latencies, user feedback, and judge scores show in Langfuse, plus an offline run on GSM8K items.", "teaches": "What a real agent trace contains, and how online scores and offline dataset runs attach to the same traces.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Type out the notebook’s steps to instrument a smolagents agent with OpenInference and send traces to Langfuse, then add a judge score of your own and rerun the GSM8K dataset run with a second model."}]}, {"id": "promptopt", "title": "Automatic prompt optimization", "kind": "concept", "track": "optimize", "pre": ["prompting", "evaldesign"], "frontier": false, "core": "Treat the instruction as a parameter. A model proposes candidate prompts, your metric scores each on a small labeled set, and the best ones go back into the next proposal with their scores. Without a labeled set and a metric there is nothing to optimize.", "reach": "DSPy extends the search to whole pipelines, and textual gradients and GEPA also show the proposer why each failure happened.", "uses": "Tuning the system prompts of classifiers, extractors, and LLM judges once a labeled set exists; Vertex AI’s prompt optimizer and MLflow’s optimize_prompts automate it, and teams rerun it whenever they switch models.", "worth": "you maintain prompts graded by a metric and change models often; eval design first. If you have no labeled examples yet, write some before trying this.", "resources": [{"title": "Automatic Prompt Optimization", "url": "https://cameronrwolfe.substack.com/p/automatic-prompt-optimization", "type": "blog", "by": "Cameron R. Wolfe, 2024", "level": 1, "note": "Covers APE, APO, GRIPS, OPRO, EvoPrompt, and Promptbreeder in turn."}, {"title": "Large Language Models as Optimizers", "url": "https://arxiv.org/abs/2309.03409", "type": "paper", "by": "Yang et al., Google DeepMind, 2024", "level": 2, "note": "Section 4 lays out the meta-prompt, and Table 1 lists the GSM8K instructions it found."}, {"title": "Large Language Models Are Human-Level Prompt Engineers", "url": "https://arxiv.org/abs/2211.01910", "type": "paper", "by": "Zhou et al., University of Toronto and Vector Institute, 2023", "level": 2}, {"title": "A Systematic Survey of Automatic Prompt Optimization Techniques", "url": "https://arxiv.org/abs/2502.16923", "type": "paper", "by": "Ramnath et al., 2025", "level": 3}, {"title": "Rebuild OPRO on GSM8K", "url": "https://arxiv.org/abs/2309.03409", "type": "project", "by": "Built on Yang et al., Google DeepMind, 2024", "level": 2, "build": "A prompt optimizer that proposes, scores, and keeps instructions, with a plot of training accuracy by step and the winning instruction’s test accuracy.", "teaches": "How far one instruction moves a model, how much the scored history guides new proposals, and how quickly a small training slice gets overfit.", "time": "a weekend", "mode": "Rebuild it yourself", "task": "Write OPRO’s loop from an empty file: a meta-prompt holding the best 20 instructions with their scores, eight proposals per step, and a small open model scoring each on 3.5 percent of GSM8K train.", "made": true, "done": "Your best instruction beats “Let’s think step by step” on the GSM8K test set with the same scorer, as OPRO’s 80.2 beat 71.8 with PaLM 2-L in Table 1."}]}, {"id": "dspy", "title": "Programming, not prompting: DSPy", "kind": "concept", "track": "optimize", "pre": ["promptopt", "workflows"], "frontier": false, "core": "Write the pipeline as code made of modules with declared signatures, such as question to answer, and let an optimizer compile each module’s instructions and examples against a metric. When the model changes, you recompile and leave the prompts to the optimizer.", "reach": "MIPROv2 and GEPA are DSPy optimizers, and the same program can later be distilled into a smaller model’s weights.", "uses": "Multi-step RAG, extraction, and classification pipelines that must survive a model swap by recompiling; MLflow logs DSPy programs, Databricks documents it, and MIPROv2 and GEPA both run inside it.", "worth": "you build pipelines with several model calls and a metric you trust; workflows first. A single prompt in a product with no eval set gains little from it.", "resources": [{"title": "Program, don’t prompt", "url": "https://dspy.ai/current/getting-started/program-dont-prompt/", "type": "tutorial", "by": "DSPy docs, 2026", "level": 1, "note": "Read on through the Getting Started pages, from signatures and modules to metrics."}, {"title": "DSPy: Compiling Declarative Language Model Calls into Self-Improving Pipelines", "url": "https://arxiv.org/abs/2310.03714", "type": "paper", "by": "Khattab et al., Stanford, 2024", "level": 2}, {"title": "Optimizing Instructions and Demonstrations for Multi-Stage Language Model Programs", "url": "https://arxiv.org/abs/2406.11695", "type": "paper", "by": "Opsahl-Ong, Ryan et al., Stanford, 2024", "level": 2, "note": "The paper behind MIPROv2, a Bayesian search over each module’s instructions and demonstrations."}, {"title": "Fine-Tuning and Prompt Optimization: Two Great Steps that Work Better Together", "url": "https://arxiv.org/abs/2407.10930", "type": "paper", "by": "Soylu, Potts, Khattab, Stanford, 2024", "level": 3}, {"title": "GEPA: Reflective Prompt Evolution Can Outperform Reinforcement Learning", "url": "https://arxiv.org/html/2507.19457v2#S2", "type": "section", "by": "Agrawal et al., 2026", "level": 2, "section": "Section 2, Problem Statement", "covers": "A compound AI system written as modules, control flow, and schemas, with prompts and weights as its parameters, and optimization as maximizing a held-out metric under a rollout budget."}, {"title": "DSPy tutorial: Multi-Hop RAG", "url": "https://dspy.ai/current/tutorials/multihop_search/", "type": "project", "by": "DSPy docs, 2026", "level": 2, "build": "A multi-hop claim retrieval program over Wikipedia abstracts on Llama-3.1-8B, which MIPROv2 took from 31 to 59 percent top-5 recall in the tutorial’s run.", "teaches": "What an optimizer actually writes into each module’s prompt, and how much compiling a pipeline improves it.", "time": "a day", "mode": "Code along, then change it", "task": "Type out the tutorial’s HoVer retrieval program and its MIPROv2 run, confirm the gain in top-5 recall on the dev set, then rerun with a second optimizer at the same budget and compare."}]}, {"id": "textgrad", "title": "Textual feedback as a gradient", "kind": "concept", "track": "optimize", "pre": ["promptopt", "selfrefine"], "frontier": false, "core": "Run the system, have a model critique the output, and send that critique back through the computation to the prompt, code, or answer that caused it, where another call rewrites it. The critique does the job a gradient does in backpropagation.", "reach": "GEPA keeps the written feedback and adds a population with Pareto selection, and Trace runs the same backward pass over whole programs.", "uses": "Refining one hard answer at test time, such as code that fails its tests, a molecule scored by a docking tool, or a treatment plan checked against constraints, and tuning prompts where a critic can say what went wrong.", "worth": "a critic or tool can explain failures in your task, as tests, rubrics, and simulators do; self-refinement first. With only a pass or fail bit, the gradient has little to say.", "resources": [{"title": "TextGrad: Automatic “Differentiation” via Text", "url": "https://arxiv.org/abs/2406.07496", "type": "paper", "by": "Yuksekgonul et al., Stanford, 2024", "level": 2, "note": "Published in Nature in 2025 as “Optimizing generative AI by backpropagating language model feedback”."}, {"title": "Automatic Prompt Optimization with “Gradient Descent” and Beam Search", "url": "https://arxiv.org/abs/2305.03495", "type": "paper", "by": "Pryzant et al., Microsoft, 2023", "level": 2, "note": "The first textual gradient: critiques of a minibatch of errors, edits that answer them, and beam search over the edits."}, {"title": "Trace is the Next AutoDiff: Generative Optimization with Rich Feedback, Execution Traces, and LLMs", "url": "https://arxiv.org/abs/2406.16218", "type": "paper", "by": "Cheng, Nie, Swaminathan, Microsoft Research, 2024", "level": 3}, {"title": "TextGrad tutorial: Optimizing a Prompt", "url": "https://github.com/zou-group/textgrad/blob/main/examples/notebooks/Tutorial-Prompt-Optimization.ipynb", "type": "project", "by": "Zou group, Stanford, 2024", "level": 2, "build": "A system prompt rewritten by GPT-4o’s textual gradients, which lifted GPT-3.5’s object counting test accuracy from about 71 to 86 percent in the notebook’s run.", "teaches": "What a textual gradient says about a real failure, and why the loop needs a validation check that reverts bad steps.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Run the notebook’s system prompt optimization on BIG-Bench Hard object counting, then point the same loop at a second BBH task and compare its prompt with one you wrote."}]}, {"id": "gepa", "title": "Reflective prompt evolution: GEPA", "kind": "concept", "track": "optimize", "pre": ["dspy", "textgrad", "evosearch"], "frontier": true, "core": "Run the program on a few examples, let a strong model read the traces and the metric’s written feedback, and have it rewrite one module’s instruction. Parents are drawn from candidates best on at least one example, so fixes for different failures survive and merge.", "reach": "optimize_anything runs the same loop on code, agent architectures, and skill files, the step from prompt optimizers to harness optimizers.", "uses": "Optimizing DSPy programs, agent system prompts, and skill files; MLflow’s optimize_prompts, Pydantic AI, and Google’s ADK docs integrate it, and its README reports Databricks using it so open models beat Claude Opus 4.1.", "worth": "you have a few hundred rollouts of budget and a metric that can explain its scores; DSPy and textual gradients first. Teams with abundant labeled data may do better fine-tuning.", "resources": [{"title": "GEPA: Reflective Prompt Evolution Can Outperform Reinforcement Learning", "url": "https://arxiv.org/abs/2507.19457", "type": "paper", "by": "Agrawal et al., 2026", "level": 2, "note": "ICLR 2026 oral; Section 3 is the algorithm and Section 4 the comparisons with GRPO and MIPROv2."}, {"title": "GEPA in depth", "url": "https://dspy.ai/current/diving-deeper/gepa-in-depth/", "type": "notes", "by": "DSPy docs, 2026", "level": 2, "note": "Feedback metrics, Pareto sampling, merges, and what each budget preset costs in metric calls."}, {"title": "optimize_anything: A Universal API for Optimizing any Text Parameter", "url": "https://gepa-ai.github.io/gepa/blog/2026/02/18/introducing-optimize-anything/", "type": "blog", "by": "Agrawal, Lee et al., 2026", "level": 2, "note": "The authors’ own results on agent architectures, kernels, and skills, not independently checked."}, {"title": "DSPy tutorial: GEPA for AIME", "url": "https://dspy.ai/current/tutorials/gepa_aime/", "type": "project", "by": "DSPy docs, 2026", "level": 2, "build": "A chain of thought math program whose instruction GEPA rewrote, taking GPT-4.1 mini from 46.7 to 56.7 percent on AIME 2025 in the tutorial’s run.", "teaches": "How written feedback steers the proposer, how the metric call budget buys accuracy, and what an evolved instruction actually says.", "time": "a day", "mode": "Code along, then change it", "task": "Run the notebook with GPT-4.1 mini as the task model and confirm its gain on AIME 2025, then write a metric that returns textual feedback for a task of your own and optimize that.", "signature": true}]}, {"id": "adas", "title": "Automated design of agentic systems", "kind": "concept", "track": "optimize", "pre": ["dspy", "evosearch"], "frontier": true, "core": "Write each agent as code, keep an archive of every design tried with its score, and have a meta agent read the archive and program the next design. Because the search covers workflows, tools, and control flow, it can find agents nobody wrote by hand.", "reach": "The Darwin Gödel Machine makes the designed agent its own designer, and Poetiq’s metasystem applies the search to whole harnesses.", "uses": "Searching agent designs for one fixed task, such as reading comprehension or math pipelines, before committing to one; MetaGPT ships AFlow, and Meta-Harness searches coding harnesses on TerminalBench-2.", "worth": "you run one task at scale and can pay for hundreds of evaluated designs; DSPy and evolutionary search first. For a one-off task, a hand-built workflow is cheaper.", "resources": [{"title": "Automated Design of Agentic Systems", "url": "https://arxiv.org/abs/2408.08435", "type": "paper", "by": "Hu, Lu, Clune, UBC and Vector Institute, 2025", "level": 2, "note": "Section 3 is Meta Agent Search; Appendix J puts one run at about $300 to $500 in API costs."}, {"title": "AFlow: Automating Agentic Workflow Generation", "url": "https://arxiv.org/abs/2410.10762", "type": "paper", "by": "Zhang et al., 2025", "level": 2, "note": "Monte Carlo tree search over workflows written as code, refined by code edits and execution feedback."}, {"title": "Meta-Harness: End-to-End Optimization of Model Harnesses", "url": "https://arxiv.org/abs/2603.28052", "type": "paper", "by": "Lee, Nair, Zhang, Lee, Khattab, Finn, 2026", "level": 3, "note": "A coding agent proposes new harnesses after reading a filesystem of every past harness’s code, scores, and traces."}, {"title": "Automated Design of Agentic Systems", "url": "https://arxiv.org/html/2408.08435v2#S2", "type": "section", "by": "Hu, Lu, Clune, 2025", "level": 1, "section": "Section 2, Automated Design of Agentic Systems (ADAS)", "covers": "The three choices that define any agent design search: the search space of agents it can represent, the algorithm that explores it, and the evaluation function that scores candidates."}, {"title": "Meta Agent Search", "url": "https://github.com/ShengranHu/ADAS", "type": "project", "by": "Hu, Lu, Clune, 2025", "level": 2, "build": "An archive of agents written in code by a meta agent for DROP reading comprehension, each with its held-out F1 beside chain of thought, self-consistency, and self-refine.", "teaches": "What a meta agent invents when it can write any workflow, and how much of the gain survives on held-out questions.", "time": "a weekend", "mode": "Reproduce a result", "task": "Run the repository’s DROP search with a current cheap model evaluating the agents, then score the archive on the 800 held-out questions against the seven hand-designed agents it starts from."}]}, {"id": "rsidef", "title": "What makes improvement recursive", "kind": "concept", "track": "rsi", "pre": ["promptopt"], "frontier": false, "core": "Improvement is recursive when a system improves itself and the improved version runs the next round, so one gain can speed up later gains. Poetiq names these two conditions R and S; I. J. Good’s intelligence explosion and Schmidhuber’s Gödel machine are the older statements.", "reach": "STOP, the Darwin Gödel Machine, and Poetiq’s metasystem meet both conditions; an automated scientist improving a separate model meets neither.", "uses": "Mostly conceptual: telling a self-improving system from ordinary iterative optimization when reading a vendor’s claims or a lab’s policy, such as Anthropic’s on AI building its successor. It frames the rest of this track.", "worth": "you will build, evaluate, or govern systems that modify themselves; an hour after prompt optimization. If you only call models, the definitions still help you read claims.", "resources": [{"title": "A Poetiq Perspective on Recursive Self-Improvement", "url": "https://poetiq.ai/posts/rsi_perspective/", "type": "blog", "by": "Poetiq, 2026", "level": 1, "note": "The I, R, and S definitions open the post; its benchmark results are Poetiq’s own claims."}, {"title": "When AI builds itself", "url": "https://www.anthropic.com/institute/recursive-self-improvement", "type": "blog", "by": "Favaro and Clark, Anthropic, 2026", "level": 1, "note": "Anthropic’s own measurements of how much of its code and research Claude now does."}, {"title": "Speculations Concerning the First Ultraintelligent Machine", "url": "https://www.sciencedirect.com/science/article/pii/S0065245808604180", "type": "paper", "by": "I. J. Good, Advances in Computers, 1965", "level": 2, "note": "The origin of the intelligence explosion argument.", "paid": true}, {"title": "Goedel Machines: Self-Referential Universal Problem Solvers Making Provably Optimal Self-Improvements", "url": "https://arxiv.org/abs/cs/0309048", "type": "paper", "by": "Jürgen Schmidhuber, IDSIA, 2003", "level": 3}, {"title": "Darwin Gödel Machine: Open-Ended Evolution of Self-Improving Agents", "url": "https://arxiv.org/html/2505.22954v3#S2", "type": "section", "by": "Zhang, Hu, Lu, Lange, Clune, 2025", "level": 2, "section": "Section 2, Related Work", "covers": "Self-improvement from Good and Schmidhuber to STOP, Gödel Agent, and SICA, and why a fixed meta agent or a meta-utility that drifts from the real task limits it."}, {"title": "Test the recursion in STOP", "url": "https://github.com/microsoft/stop", "type": "project", "by": "Built on Zelikman, Lorch, Mackey, Kalai, 2024", "level": 2, "build": "Learning curves on held-out noisy parity for an improver that rewrites itself each round and for a fixed improver given the same budget.", "teaches": "Whether improving the improver buys more than improving the task directly, how noisy one round is, and why weaker models can make it worse.", "time": "a weekend", "mode": "Extend it", "task": "Run the repository’s self-improvement on noisy parity with a current model for three rounds, then write the paper’s greedy iterative improver as a control at the same budget and score both on 50 held-out instances.", "made": true, "done": "Your third-round improver beats your seed and your greedy control on held-out instances; with GPT-4 the paper’s seed scored 61 percent and its greedy baseline 64.2."}]}, {"id": "stop", "title": "Scaffolds that improve themselves", "kind": "concept", "track": "rsi", "pre": ["rsidef", "harnessdef"], "frontier": true, "core": "A scaffold is a program that calls a model. Give a seed improver its own source as the program to improve, score each version by how well it improves other programs, and keep the best. The weights stay fixed, so every gain is readable code.", "reach": "The Darwin Gödel Machine adds an archive and coding benchmarks, and Promptbreeder applies the same idea to mutation prompts.", "uses": "Mostly research so far: Gödel Agent and SICA extend it, and Poetiq’s metasystem is a commercial descendant; for any optimizer you write, it shows the search code itself can be a target.", "worth": "you write optimizers or agent scaffolds and want them to tune themselves; harnesses and prompt optimization first. Teams shipping fixed pipelines can skip it.", "resources": [{"title": "Self-Taught Optimizer (STOP): Recursively Self-Improving Code Generation", "url": "https://arxiv.org/abs/2310.02304", "type": "paper", "by": "Zelikman, Lorch, Mackey, Kalai, Microsoft Research and Stanford, 2024", "level": 2, "note": "Section 5 holds the results; Section 6 shows the strategies GPT-4 proposed and its attempts to turn off the sandbox."}, {"title": "Promptbreeder: Self-Referential Self-Improvement Via Prompt Evolution", "url": "https://arxiv.org/abs/2309.16797", "type": "paper", "by": "Fernando et al., Google DeepMind, 2023", "level": 2, "note": "Evolves task prompts and also the mutation prompts that rewrite them."}, {"title": "Gödel Agent: A Self-Referential Agent Framework for Recursive Self-Improvement", "url": "https://arxiv.org/abs/2410.04444", "type": "paper", "by": "Yin et al., ACL 2025", "level": 2, "note": "Appendix D puts a run of 30 self-modifications across four benchmarks at about $15."}, {"title": "A Self-Improving Coding Agent", "url": "https://arxiv.org/abs/2504.15228", "type": "paper", "by": "Robeyns, Szummer, Aitchison, University of Bristol and iGent AI, 2025", "level": 2, "note": "A coding agent edits its own codebase, going from 17 to 53 percent on a SWE-bench Verified subset."}, {"title": "Gödel Agent", "url": "https://github.com/Arvid-pku/Godel_Agent", "type": "project", "by": "Yin et al., 2025", "level": 2, "build": "A self-modified policy for multilingual grade school math, the log of edits that produced it, and its accuracy beside a chain of thought baseline.", "teaches": "What an agent changes when it may rewrite its own logic, which edits help, and how often it breaks itself.", "time": "a weekend", "mode": "Reproduce a result", "task": "Set the task to MGSM in agent_module.py, run src/main.py through its self-modification steps, read each edit the agent makes to itself, then score the final policy against a chain of thought baseline."}]}, {"id": "dgm", "title": "Self-editing coding agents: the Darwin Gödel Machine", "kind": "concept", "track": "rsi", "pre": ["stop", "codingagents", "evosearch", "openended"], "frontier": true, "core": "Keep an archive of coding agents, let a sampled agent edit its own source code, and add the child if it still works, scored on a coding benchmark. Since the agent’s job is coding, a better score also makes it a better editor of itself.", "reach": "The Huxley-Gödel Machine picks parents by how well their descendants score, and Poetiq’s metasystem runs a similar loop on task harnesses.", "uses": "Sakana’s Darwin Gödel Machine and the Huxley-Gödel Machine evolve coding agents for SWE-bench and Polyglot; the archive and self-edit loop can tune any agent whose job is writing code, including internal dev tools.", "worth": "you build coding agents and have a large benchmark budget; coding agents and evolutionary search first. At about $22,000 per full run, most teams should borrow the ideas and skip the loop.", "resources": [{"title": "The Darwin Gödel Machine: AI that improves itself by rewriting its own code", "url": "https://sakana.ai/dgm/", "type": "blog", "by": "Sakana AI, 2025", "level": 1}, {"title": "Darwin Gödel Machine: Open-Ended Evolution of Self-Improving Agents", "url": "https://arxiv.org/abs/2505.22954", "type": "paper", "by": "Zhang, Hu, Lu, Lange, Clune, UBC, Vector Institute, and Sakana AI, 2025", "level": 2, "note": "Sections 4.3 and 4.4 compare it with versions lacking self-improvement or the archive; Appendix E.1 puts a SWE-bench run near $22,000."}, {"title": "Huxley-Gödel Machine: Human-Level Coding Agent Development by an Approximation of the Optimal Self-Improving Machine", "url": "https://arxiv.org/abs/2510.21614", "type": "paper", "by": "Wang et al., 2025", "level": 3, "note": "Finds that an agent’s benchmark score is a poor guide to how well its descendants do, and selects parents by the descendants."}, {"title": "A small Darwin Gödel Machine on Polyglot", "url": "https://github.com/jennyzzt/dgm", "type": "project", "by": "Built on Zhang, Hu, Lu, Lange, Clune, 2025", "level": 3, "build": "Two lineages of self-edited coding agents, one open-ended and one greedy, with every agent’s score and the diffs behind the best one.", "teaches": "Which edits a coding agent makes to itself, why keeping weaker parents pays off, and what each point of improvement costs.", "time": "a week", "mode": "Extend it", "task": "Cut the repository’s Polyglot run down to a cheap model and 20 iterations, then run it twice, once with the archive and once always editing the latest agent, scoring both on the paper’s 50 tasks.", "made": true, "done": "The open-ended run’s best agent beats both the base agent and the greedy run’s best on the 50 Polyglot tasks, as the paper’s rose from 14.0 to 38.0 percent."}]}, {"id": "skilllib", "title": "Skill libraries and lifelong agents", "kind": "concept", "track": "rsi", "pre": ["skills", "memory"], "frontier": true, "core": "Each time an agent solves something, it saves a reusable piece, such as a function, a workflow, or a lesson from a failure, and later tasks load the relevant pieces into context. The library grows across tasks, so the agent gets better with fixed weights.", "reach": "Agent skills are the hand-written form; GEPA’s gskill learns them from a repository’s tasks, and ACE keeps a playbook detailed through repeated updates.", "uses": "Claude Code and other agents loading SKILL.md files, GEPA’s gskill learning those files from a repository’s own tasks, ACE playbooks on AppWorld, and Voyager’s Minecraft skills, the first clear demonstration.", "worth": "your agents repeat similar tasks and you can check whether they succeeded; skills and memory first. Agents that only face one-off tasks gain little from a library.", "resources": [{"title": "Voyager: An Open-Ended Embodied Agent with Large Language Models", "url": "https://arxiv.org/abs/2305.16291", "type": "paper", "by": "Wang et al., NVIDIA, 2023", "level": 2, "note": "An automatic curriculum, a growing library of skills stored as executable code, and self-verification."}, {"title": "Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models", "url": "https://arxiv.org/abs/2510.04618", "type": "paper", "by": "Zhang et al., ICLR 2026", "level": 2, "note": "Generation, reflection, and curation with small incremental updates, so the playbook keeps its detail."}, {"title": "Automatically Learning Skills for Coding Agents", "url": "https://gepa-ai.github.io/gepa/blog/2026/02/18/automatically-learning-skills-for-coding-agents/", "type": "blog", "by": "Tan, Agrawal et al., 2026", "level": 2, "note": "The authors’ own results: skills learned with gpt-5-mini also helped Claude Code."}, {"title": "Dynamic Cheatsheet: Test-Time Learning with Adaptive Memory", "url": "https://arxiv.org/abs/2504.07952", "type": "paper", "by": "Suzgun, Yuksekgonul, Bianchi, Jurafsky, Zou, Stanford, 2025", "level": 2}, {"title": "Agent Workflow Memory", "url": "https://arxiv.org/abs/2409.07429", "type": "paper", "by": "Wang, Mao, Fried, Neubig, CMU and MIT, 2024", "level": 2}, {"title": "gskill: learn a skills file for a repository", "url": "https://gepa-ai.github.io/gepa/guides/gskill/", "type": "project", "by": "GEPA team, 2026", "level": 2, "build": "A learned skills file for one repository, and resolve rates for two agents with and without it on held-out tasks.", "teaches": "What a skill learned from verified tasks contains, and whether it helps an agent and a model it was not learned with.", "time": "a weekend", "mode": "Apply it", "task": "Run gskill’s smoke test, then a full run on one SWE-smith repository, and evaluate mini-SWE-agent and Claude Code with and without the learned skills on its held-out tasks."}, {"title": "Dynamic Cheatsheet on Game of 24", "url": "https://github.com/suzgunmirac/dynamic-cheatsheet", "type": "project", "by": "Suzgun et al., 2025", "level": 1, "build": "Two scored runs on Game of 24 and the cheatsheet the model wrote for itself along the way.", "teaches": "How a memory of strategies, often a reusable Python solver here, changes accuracy within a single pass over a dataset.", "time": "an afternoon", "mode": "Reproduce a result", "task": "Run run_benchmark.py on Game of 24 with the default baseline, then with DynamicCheatsheet_Cumulative on the same model, and read how the cheatsheet changes from one problem to the next."}]}, {"id": "selfplay", "title": "Self-generated tasks and rewards", "kind": "concept", "track": "rsi", "pre": ["verifiers", "rft"], "frontier": true, "core": "Let the model make its own training data: it proposes problems or samples answers, a checker such as a code executor, unit tests, or its own judgment keeps what passes, and it trains on the survivors. The checker’s quality limits how far this goes.", "reach": "Reinforcement fine-tuning supplies the training step, and the metasystem runs a similar loop on harness code with the weights fixed.", "uses": "Generating verified training data for reasoning models with no human tasks, as Absolute Zero and R-Zero do; rejection sampling for fine-tuning sets; and synthetic tool-use tasks for agent RL, as in Self-Challenging agents.", "worth": "you train or fine-tune models and have a checker such as tests or an executor; verifiers and reinforcement fine-tuning first. Engineers who only call hosted models can skip it.", "resources": [{"title": "STaR: Bootstrapping Reasoning With Reasoning", "url": "https://arxiv.org/abs/2203.14465", "type": "paper", "by": "Zelikman, Wu, Mu, Goodman, Stanford and Google, 2022", "level": 2, "note": "Section 3.2, rationalization, gives the model the answer as a hint on problems it missed."}, {"title": "Absolute Zero: Reinforced Self-play Reasoning with Zero Data", "url": "https://arxiv.org/abs/2505.03335", "type": "paper", "by": "Zhao et al., Tsinghua, 2025", "level": 2, "note": "One model proposes and solves code reasoning tasks, and a Python executor checks both."}, {"title": "Self-Rewarding Language Models", "url": "https://arxiv.org/abs/2401.10020", "type": "paper", "by": "Yuan et al., Meta, 2024", "level": 2}, {"title": "R-Zero: Self-Evolving Reasoning LLM from Zero Data", "url": "https://arxiv.org/abs/2508.05004", "type": "paper", "by": "Huang et al., 2025", "level": 3}, {"title": "Self-Challenging Language Model Agents", "url": "https://arxiv.org/abs/2506.01716", "type": "paper", "by": "Zhou, Levine, Weston et al., Meta and Berkeley, 2025", "level": 3, "note": "Agents write tool-use tasks with a verification function and tests, then train on them."}, {"title": "Rebuild STaR on GSM8K", "url": "https://arxiv.org/abs/2203.14465", "type": "project", "by": "Built on Zelikman, Wu, Mu, Goodman, 2022", "level": 2, "build": "Three or more STaR iterations of a small model on GSM8K, with test accuracy and the fraction of kept examples after each.", "teaches": "How a correctness filter turns a model’s own samples into training data, and where the loop stalls when few samples pass.", "time": "a week", "mode": "Rebuild it yourself", "task": "Write the STaR loop for a small open model: sample rationales on GSM8K train, keep those with correct answers, rationalize misses with the answer as a hint, fine-tune from the base model, and repeat.", "made": true, "done": "After the last iteration your model beats the same model fine-tuned to answer directly on GSM8K test, as STaR’s 10.7 percent beat GPT-J’s 5.8 in Table 2."}]}, {"id": "aiscientist", "title": "Automated AI research", "kind": "concept", "track": "rsi", "pre": ["codingagents", "agentbench"], "frontier": true, "core": "An agent runs the research loop itself: propose a change, edit the code, run the experiment, read the metric, and keep or revert, sometimes ending in a written paper. The hard parts are a cheap, reliable metric and catching gains that are noise or bugs.", "reach": "By Poetiq’s definition this becomes recursive only when the improved system runs the next round, as in the Darwin Gödel Machine.", "uses": "Karpathy’s autoresearch tuning nanochat training overnight, Sakana’s AI Scientist writing workshop papers, agents on MLE-bench’s Kaggle tasks, and Anthropic’s report that Claude now writes most of its merged code.", "worth": "you run many small ML experiments with a cheap, reliable metric; coding agents and agent benchmarks first. Without a fast evaluation, the agent mostly produces noise.", "resources": [{"title": "autoresearch", "url": "https://github.com/karpathy/autoresearch", "type": "code", "by": "Andrej Karpathy, 2026", "level": 1, "note": "The whole loop in three files: fixed data and evaluation, a train.py the agent edits, and a program.md the human edits."}, {"title": "Towards end-to-end automation of AI research", "url": "https://www.nature.com/articles/s41586-026-10265-5", "type": "paper", "by": "Lu et al., Sakana AI, UBC, and Oxford, Nature, 2026", "level": 2, "note": "The AI Scientist from idea to reviewed paper, with its automated reviewer and its failure modes."}, {"title": "MLE-bench: Evaluating Machine Learning Agents on Machine Learning Engineering", "url": "https://arxiv.org/abs/2410.07095", "type": "paper", "by": "Chan et al., OpenAI, 2025", "level": 2}, {"title": "Evaluating Sakana’s AI Scientist: Bold Claims, Mixed Results, and a Promising Future?", "url": "https://arxiv.org/abs/2502.14297", "type": "paper", "by": "Beel, Kan, Baumgart, 2025", "level": 2, "note": "An independent test: 42 percent of experiments failed on coding errors, and novelty checks often missed known ideas."}, {"title": "The AI Scientist-v2: Workshop-Level Automated Scientific Discovery via Agentic Tree Search", "url": "https://arxiv.org/abs/2504.08066", "type": "paper", "by": "Yamada et al., Sakana AI, 2025", "level": 3}, {"title": "autoresearch overnight", "url": "https://github.com/karpathy/autoresearch", "type": "project", "by": "Andrej Karpathy, 2026", "level": 2, "build": "An overnight log of about 100 agent experiments on small nanochat training, and a table of which kept changes still lower val_bpb on rerun.", "teaches": "What an automated researcher tries, how often its wins are seed noise, and how much the human’s program.md steers it.", "time": "a weekend", "mode": "Apply it", "task": "Point a coding agent at program.md on one H100 for a night of 5-minute training runs, then replay each kept change from a clean checkout with new seeds to see which gains survive."}]}, {"id": "metasystem", "title": "Self-optimizing optimizers: the Poetiq metasystem", "kind": "concept", "track": "rsi", "pre": ["dgm", "gepa", "adas", "arc"], "frontier": true, "core": "Have an optimizer edit the whole harness, its prompts, code, tool use, search strategy, and stopping rule, score each version on the task’s data, and let the improved system run the next round. Poetiq reports these harnesses also lift models they were not built with.", "reach": "It combines GEPA’s reflective search, the code search space of ADAS, and the Darwin Gödel Machine’s self-editing, first shown on ARC-AGI.", "uses": "Poetiq’s harnesses for ARC-AGI-2, Humanity’s Last Exam, SimpleQA, LiveCodeBench Pro, and an LLM router, each built from a dataset; for engineers, optimizing a harness once and running it on cheaper or newer models.", "worth": "you answer for a benchmark or product metric and pay for frontier calls; GEPA, ADAS, and ARC refinement loops first. Without a held-out dataset you cannot tell gains from overfitting.", "resources": [{"title": "Traversing the Frontier of Superintelligence", "url": "https://poetiq.ai/posts/arcagi_announcement/", "type": "blog", "by": "Poetiq, 2025", "level": 1, "note": "The refinement loop and its self-audited stopping rule; the scores are Poetiq’s own, on public evaluation sets."}, {"title": "Recursive Self-Improvement Delivers New State-of-the-Art Coding Performance", "url": "https://poetiq.ai/posts/recursive_self_improvement_coding/", "type": "blog", "by": "Poetiq, 2026", "level": 1, "note": "Self-reported: one harness built on Gemini 3.1 Pro, then run unchanged on other models against LiveCodeBench Pro leaderboard baselines."}, {"title": "Poetiq Shatters ARC-AGI-2 State of the Art at Half the Cost", "url": "https://poetiq.ai/posts/arcagi_verified/", "type": "blog", "by": "Poetiq, 2025", "level": 2, "note": "The one result here checked by a third party: ARC Prize verified 54 percent at $30.57 a task."}, {"title": "Benchmarks Are Dead (for us)", "url": "https://poetiq.ai/posts/benchmarks_are_dead/", "type": "blog", "by": "Poetiq, 2026", "level": 2, "note": "Self-reported: harnesses built with no human tuning for six benchmarks."}, {"title": "Our Metasystem Built and Optimized an LLM Router", "url": "https://poetiq.ai/posts/llm_router/", "type": "blog", "by": "Poetiq, 2026", "level": 2, "note": "Self-reported, on simulated customer workloads."}, {"title": "A small harness optimizer for ARC-AGI-2", "url": "https://github.com/poetiq-ai/poetiq-arc-agi-solver", "type": "project", "by": "Built on Poetiq’s open-source ARC-AGI solver and the ARC Prize leaderboard, 2025", "level": 3, "build": "A harness optimizer, an archive of solver versions with their scores and costs, and one harness tested on held-out tasks with two models.", "teaches": "Which harness changes raise the score on a hard benchmark, how fast a small optimization set overfits, and whether a harness transfers across models.", "time": "two weeks", "mode": "Extend it", "task": "Write an outer loop where a model edits the solver’s prompts and config, scores each version on 60 ARC-AGI-2 public evaluation tasks, and keeps an archive; test the best on the other 60 with two models.", "signature": true, "made": true, "done": "On the 60 held-out tasks your harness beats the plain model and its verified ARC Prize score (GPT-5 Mini, medium: 4.0 percent), and lifts a second model unchanged."}]}, {"id": "openended", "title": "Open-endedness", "kind": "concept", "track": "rsi", "pre": ["evosearch", "rsidef"], "frontier": true, "core": "An open-ended system keeps producing artifacts that an observer finds new and can still learn from. Searching for novelty or interestingness while keeping an archive of stepping stones often reaches goals that optimizing the goal directly misses, because objectives can deceive.", "reach": "The archives in ADAS and the Darwin Gödel Machine descend from this line, and OMNI uses a model’s sense of what is interesting.", "uses": "Quality-diversity search in robotics and game level generation, Go-Explore on hard exploration games, the archives in the Darwin Gödel Machine and AlphaEvolve’s program database, and generated training environments such as OMNI-EPIC’s.", "worth": "you design long-running search or self-improving systems that stall on one metric; evolutionary search first. Teams optimizing a fixed product metric can skip it.", "resources": [{"title": "Open-Endedness is Essential for Artificial Superhuman Intelligence", "url": "https://arxiv.org/abs/2406.04268", "type": "paper", "by": "Hughes et al., Google DeepMind, 2024", "level": 1}, {"title": "Abandoning Objectives: Evolution Through the Search for Novelty Alone", "url": "https://doi.org/10.1162/EVCO_a_00025", "type": "paper", "by": "Lehman and Stanley, Evolutionary Computation, 2011", "level": 2, "note": "On the deceptive hard maze, novelty search succeeds in 39 of 40 runs and fitness search in 3.", "paid": true}, {"title": "OMNI: Open-endedness via Models of human Notions of Interestingness", "url": "https://arxiv.org/abs/2306.01711", "type": "paper", "by": "Zhang, Lehman, Stanley, Clune, 2024", "level": 2}, {"title": "Paired Open-Ended Trailblazer (POET): Endlessly Generating Increasingly Complex and Diverse Learning Environments and Their Solutions", "url": "https://arxiv.org/abs/1901.01753", "type": "paper", "by": "Wang, Lehman, Clune, Stanley, Uber AI Labs, 2019", "level": 2}, {"title": "OMNI-EPIC: Open-endedness via Models of human Notions of Interestingness with Environments Programmed in Code", "url": "https://arxiv.org/abs/2405.15568", "type": "paper", "by": "Faldor, Zhang, Cully, Clune, 2024", "level": 3, "note": "A model writes new environments and their success checks as code."}, {"title": "AI-GAs: AI-generating algorithms, an alternate paradigm for producing general artificial intelligence", "url": "https://arxiv.org/abs/1905.10985", "type": "paper", "by": "Jeff Clune, Uber AI Labs, 2019", "level": 3}, {"title": "Open-Endedness is Essential for Artificial Superhuman Intelligence", "url": "https://arxiv.org/html/2406.04268v1#S2", "type": "section", "by": "Hughes et al., Google DeepMind, 2024", "level": 2, "section": "Section 2, Defining Open-Endedness", "covers": "A formal test: a system is open-ended to an observer when its artifacts keep getting harder to predict while a longer history makes them easier to predict."}, {"title": "Novelty search on the deceptive maze", "url": "https://doi.org/10.1162/EVCO_a_00025", "type": "project", "by": "Built on Lehman and Stanley, 2011", "level": 2, "build": "A maze simulator, two evolutionary searches, and plots of where each search’s robots end up and how often each reaches the goal.", "teaches": "What a deceptive objective looks like in practice, and why rewarding new behavior can reach a goal that rewarding progress cannot.", "time": "a weekend", "mode": "Rebuild it yourself", "task": "Write a 2D maze robot simulator with the paper’s hard map, evolve small neural controllers once by distance to the goal and once by novelty of the final position, and run each 40 times.", "made": true, "done": "Novelty search reaches the goal in most of 40 runs within 250,000 evaluations while fitness search mostly stalls, as in the paper’s 39 against 3 of 40."}]}, {"id": "finetune", "title": "Fine-tuning and LoRA, and when to use them", "kind": "concept", "track": "adapt", "pre": ["fewshot", "evaldesign"], "frontier": false, "core": "Fine-tuning pays when prompts and examples cannot make a behavior hold every time: a strict format, a house style, or a narrow task a small model should do cheaply. LoRA trains a small adapter on a frozen model, using one GPU. Facts belong in retrieval.", "reach": "Distillation supplies the training data, reinforcement fine-tuning swaps the labels for a grader, and one served base model can carry many adapters.", "uses": "Honeycomb’s query assistant learned its query language this way; Apple Intelligence runs small task adapters on one on-device model; and vLLM and LoRAX serve many customers’ adapters on a single shared base model.", "worth": "prompts and examples already work on most cases but not reliably enough, or a cheaper model must match a costly one on one task; build the eval first, and skip it for facts.", "resources": [{"title": "Is Fine-Tuning Still Valuable?", "url": "https://hamel.dev/blog/posts/fine_tuning_valuable.html", "type": "blog", "by": "Hamel Husain, 2024", "level": 1, "note": "Cases where fine-tuning beat prompting, and why an eval has to exist first."}, {"title": "LoRA Without Regret", "url": "https://thinkingmachines.ai/blog/lora/", "type": "blog", "by": "John Schulman and Thinking Machines Lab, 2025", "level": 2, "note": "When LoRA matches full fine-tuning: adapters on every layer including the MLPs, about ten times the learning rate, and datasets of small to medium size."}, {"title": "Does Fine-Tuning LLMs on New Knowledge Encourage Hallucinations?", "url": "https://arxiv.org/abs/2405.05904", "type": "paper", "by": "Gekhman et al., 2024", "level": 2}, {"title": "LoRA: Low-Rank Adaptation of Large Language Models", "url": "https://arxiv.org/abs/2106.09685", "type": "paper", "by": "Hu et al., Microsoft, 2021", "level": 2}, {"title": "QLoRA: Efficient Finetuning of Quantized LLMs", "url": "https://arxiv.org/abs/2305.14314", "type": "paper", "by": "Dettmers et al., 2023", "level": 2}, {"title": "LoRA Land: 310 Fine-tuned LLMs that Rival GPT-4, A Technical Report", "url": "https://arxiv.org/html/2405.00732v1#S5.SS4", "type": "section", "by": "Zhao et al., Predibase, 2024", "level": 1, "section": "Section 5.4, When does GPT-4 consistently outperform fine-tuned models?", "covers": "Across 31 tasks, LoRA adapters on 7B models beat GPT-4 on narrow classification tasks such as GLUE, and lost on 6, the broad ones such as Python coding and MMLU."}, {"title": "smol course Unit 1: Fine-Tuning SmolLM3", "url": "https://huggingface.co/learn/smol-course/unit1/4", "type": "project", "by": "Hugging Face smol course, 2025", "level": 2, "build": "An instruction-tuned SmolLM3-3B, trained with SFT and with a LoRA adapter, pushed to the Hub and scored on the course leaderboard.", "teaches": "Chat templates, dataset formatting, and the training loop that every later method in this track reuses.", "time": "a weekend", "mode": "Do the assignment", "task": "Work through Unit 1’s exercises to fine-tune SmolLM3-3B-Base with TRL’s SFTTrainer, including the optional LoRA run, then compare base and tuned models and submit to the course leaderboard."}, {"title": "Prompt or fine-tune: few-shot against LoRA on MRPC", "url": "https://arxiv.org/abs/2405.00732", "type": "project", "by": "Built on Zhao et al., LoRA Land, 2024", "level": 2, "build": "A tuned few-shot prompt and a QLoRA adapter for one small open model, both scored on MRPC’s validation split.", "teaches": "How far examples in the prompt go on a narrow task, and what a cheap adapter adds on top of them.", "time": "a day", "mode": "Reproduce a result", "task": "Prompt a small open model few-shot on GLUE MRPC paraphrase pairs, then train a QLoRA adapter on the same model with the 3,668 training pairs, and score both on the 408 validation pairs.", "made": true, "done": "The adapter reaches 0.85 accuracy or more, near LoRA Land’s best of 0.887 in Table 4 and above its GPT-4 score of 0.777, and beats your best few-shot prompt."}]}, {"id": "distill", "title": "Distillation and synthetic data", "kind": "concept", "track": "adapt", "pre": ["finetune"], "frontier": false, "core": "A strong model writes the training data, as answers, reasoning traces, or new tasks; a checker filters it; and a small model trains on what passes. The student picks up the teacher’s style quickly and its skill only on the tasks the data covers.", "reach": "Makes the cheap models that routing sends easy queries to, and the warm start that reinforcement fine-tuning improves.", "uses": "DeepSeek’s R1-Distill models carry R1’s reasoning into Qwen and Llama models, Gemma 2’s smaller models were trained by distillation, and Cognition distilled SWE-grep into SWE-grep-mini. Provider terms often forbid training competing models on their outputs.", "worth": "you pay a large model for one narrow task at volume, or need that task on your own hardware; fine-tuning first, and read the teacher’s license before you start.", "resources": [{"title": "How to Generate and Use Synthetic Data for Finetuning", "url": "https://eugeneyan.com/writing/synthetic/", "type": "blog", "by": "Eugene Yan, 2024", "level": 1}, {"title": "On-Policy Distillation", "url": "https://thinkingmachines.ai/blog/on-policy-distillation/", "type": "blog", "by": "Kevin Lu and Thinking Machines Lab, 2025", "level": 2, "note": "Compares SFT on teacher samples, RL, and on-policy distillation by cost; the code is in the Tinker cookbook."}, {"title": "The False Promise of Imitating Proprietary LLMs", "url": "https://arxiv.org/abs/2305.15717", "type": "paper", "by": "Gudibande et al., Berkeley, 2023", "level": 2}, {"title": "Distilling the Knowledge in a Neural Network", "url": "https://arxiv.org/abs/1503.02531", "type": "paper", "by": "Hinton, Vinyals, Dean, 2015", "level": 2}, {"title": "OpenThoughts: Data Recipes for Reasoning Models", "url": "https://arxiv.org/abs/2506.04178", "type": "paper", "by": "Guha et al., 2025", "level": 3}, {"title": "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning", "url": "https://arxiv.org/html/2501.12948v1#S4.SS1", "type": "section", "by": "DeepSeek-AI, 2025", "level": 1, "section": "Section 4.1, Distillation v.s. Reinforcement Learning", "covers": "On Qwen-32B, fine-tuning on DeepSeek-R1’s outputs beat over 10,000 steps of large-scale RL on every benchmark, 72.6 against 47.0 on AIME 2024."}, {"title": "Distill GSM8K solutions into a 0.5B model", "url": "https://huggingface.co/datasets/openai/gsm8k", "type": "project", "by": "Built on GSM8K and the Qwen2.5 Technical Report, 2024", "level": 2, "build": "Two LoRA students of Qwen2.5-0.5B, one trained on filtered teacher solutions and one on human solutions, scored on the 1,319 test problems.", "teaches": "How much filtered teacher traces beat human labels for a small student, and what rejection sampling throws away.", "time": "a weekend", "mode": "Apply it", "task": "Sample four solutions per GSM8K training problem from Qwen2.5-7B-Instruct, keep those with the right final answer, LoRA fine-tune Qwen2.5-0.5B on them, and repeat with GSM8K’s own human solutions.", "made": true, "done": "Both students beat the 41.6 percent that the Qwen2.5 report’s Table 5 gives the 0.5B base model, and the teacher-trained student beats the human-trained one."}]}, {"id": "rft", "title": "Reinforcement fine-tuning with verifiable rewards", "kind": "concept", "track": "adapt", "pre": ["finetune", "verifiers"], "frontier": false, "core": "Reinforcement fine-tuning trains on a grade from a program: it samples several attempts per prompt, rewards the ones that pass, and pushes the model toward them. It needs a model that already succeeds sometimes, and it mostly sharpens skills the model has.", "reach": "Agentic RL runs the same loop over whole tool episodes, and the graders are the verifiers used at test time.", "uses": "Math and code models trained on answer checks and unit tests, as in DeepSeek-R1 and Tülu 3; SQL that must return the right rows; extraction into a schema a validator checks; and specialist answers graded against expert keys.", "worth": "you have a task with checkable answers where the model is right some of the time but not often enough; fine-tuning and test-time verifiers first. If nothing can grade the output, skip it.", "resources": [{"title": "Reinforcement fine-tuning", "url": "https://developers.openai.com/api/docs/guides/reinforcement-fine-tuning", "type": "tutorial", "by": "OpenAI, 2025", "level": 1, "note": "OpenAI closed its fine-tuning platform to new users in May 2026; read it for the checklist of when RFT fits."}, {"title": "Reinforcement Learning (RL) Guide", "url": "https://unsloth.ai/docs/get-started/reinforcement-learning-rl-guide", "type": "tutorial", "by": "Unsloth, 2025", "level": 1, "note": "Read Reward Functions / Verifiers and GRPO Requirement Guidelines."}, {"title": "Does Reinforcement Learning Really Incentivize Reasoning Capacity in LLMs Beyond the Base Model?", "url": "https://arxiv.org/abs/2504.13837", "type": "paper", "by": "Yue et al., Tsinghua, 2025", "level": 2}, {"title": "Spurious Rewards: Rethinking Training Signals in RLVR", "url": "https://arxiv.org/abs/2506.10947", "type": "paper", "by": "Shao et al., 2025", "level": 3}, {"title": "GRPO Trainer", "url": "https://huggingface.co/docs/trl/grpo_trainer", "type": "tutorial", "by": "Hugging Face TRL", "level": 2}, {"title": "Tülu 3: Pushing Frontiers in Open Language Model Post-Training", "url": "https://arxiv.org/html/2411.15124v5#S6", "type": "section", "by": "Lambert et al., Ai2, 2024", "level": 2, "section": "Section 6, Reinforcement Learning with Verifiable Rewards", "covers": "The open recipe that named RLVR: about 30,000 math and instruction prompts checked by exact match or constraint verifiers, run after SFT and DPO, and why trained tasks rise while the overall average may not."}, {"title": "Unsloth Qwen3 (4B) GRPO notebook", "url": "https://github.com/unslothai/notebooks/blob/main/nb/Qwen3_(4B)-GRPO.ipynb", "type": "project", "by": "Unsloth, 2025", "level": 2, "note": "Expect near zero reward for the first 100 steps or so, as the notebook warns.", "build": "Qwen3-4B-Base primed on a few formatted examples and trained with GRPO on DAPO-Math-17k, then retrained on your own checkable task.", "teaches": "How partial credit, format rewards, and a base model that sometimes succeeds decide whether the reward ever rises, and how long to wait.", "time": "a weekend", "mode": "Code along, then change it", "task": "Run Unsloth’s Qwen3 (4B) GRPO notebook on Colab, then replace its math dataset and reward functions with a task of your own that code can check, and compare pass rates before and after.", "signature": true}]}, {"id": "agenticrl", "title": "Agentic RL: training the whole loop", "kind": "concept", "track": "adapt", "pre": ["rft", "agentloop", "sandbox"], "frontier": true, "co
