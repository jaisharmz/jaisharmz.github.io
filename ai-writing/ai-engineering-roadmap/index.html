ntifier matches that embeddings miss.", "worth": "your RAG system misses queries with names, IDs, or jargon; it is the cheapest large gain after basic RAG, and anyone relying on long context alone can skip it.", "resources": [{"title": "Retrieve & Re-Rank", "url": "https://sbert.net/examples/sentence_transformer/applications/retrieve_rerank/README.html", "type": "tutorial", "by": "Sentence Transformers docs, UKP Lab and Hugging Face", "level": 1}, {"title": "BEIR: A Heterogenous Benchmark for Zero-shot Evaluation of Information Retrieval Models", "url": "https://arxiv.org/abs/2104.08663", "type": "paper", "by": "Thakur et al., 2021", "level": 2, "note": "Table 2: out of domain, BM25 beats most dense retrievers, and reranking BM25’s results wins on average."}, {"title": "Reciprocal Rank Fusion outperforms Condorcet and individual Rank Learning Methods", "url": "https://cormack.uwaterloo.ca/cormacksigir09-rrf.pdf", "type": "paper", "by": "Cormack, Clarke, Büttcher, SIGIR 2009", "level": 2, "note": "Two pages, and the fusion formula is one line."}, {"title": "Passage Re-ranking with BERT", "url": "https://arxiv.org/abs/1901.04085", "type": "paper", "by": "Nogueira and Cho, 2019", "level": 2}, {"title": "ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT", "url": "https://arxiv.org/abs/2004.12832", "type": "paper", "by": "Khattab and Zaharia, Stanford, 2020", "level": 3}, {"title": "BEIR: A Heterogenous Benchmark for Zero-shot Evaluation of Information Retrieval Models", "url": "https://arxiv.org/html/2104.08663v4#S4", "type": "section", "by": "Thakur et al., 2021", "level": 2, "section": "Section 4, Experimental Setup", "covers": "The five families of retrievers (lexical, learned sparse, dense, late interaction, and reranking), each described in a few lines with the model BEIR tested for it."}, {"title": "Hybrid search and reranking on BEIR", "url": "https://github.com/beir-cellar/beir", "type": "project", "by": "Built on Thakur et al., BEIR, 2021", "level": 2, "build": "Four retrieval pipelines on two BEIR datasets, with nDCG@10 and query latency for each in one table.", "teaches": "When keyword search beats embeddings, what fusion adds over either one alone, and how much latency reranking costs for its gain.", "time": "a weekend", "mode": "Reproduce a result", "task": "On BEIR’s SciFact and FiQA-2018, run BM25, one dense retriever, their reciprocal rank fusion, and a MiniLM cross-encoder over BM25’s top 100, scoring each with BEIR’s evaluation code.", "made": true, "done": "Reranked BM25 beats plain BM25 on both sets, as in the paper’s Table 2 (SciFact 0.665 to 0.688, FiQA-2018 0.236 to 0.347 nDCG@10)."}]}, {"id": "chunking", "title": "Chunking and contextual retrieval", "kind": "concept", "track": "retrieval", "pre": ["rag", "hybrid"], "frontier": false, "core": "A chunk cut from its document loses context: “revenue grew 3 percent” no longer says which company or quarter. Pick chunk size by measuring recall on your own questions, and before indexing, prepend to each chunk a short model-written note placing it in its document.", "reach": "Prompt caching makes the per-chunk notes cheap, and late chunking gets a similar effect inside the embedding model.", "uses": "Any RAG pipeline over long documents such as contracts, filings, manuals, and codebases; Anthropic reports contextual retrieval halving failed retrievals, and Jina’s embedding API offers late chunking as a flag.", "worth": "you index documents longer than a page; basic RAG first, and the contextual prefix is worth trying before any fancier chunker.", "resources": [{"title": "Introducing Contextual Retrieval", "url": "https://www.anthropic.com/research/contextual-retrieval", "type": "blog", "by": "Anthropic, 2024", "level": 1, "note": "The vendor’s own numbers: 49 percent fewer failed retrievals, and 67 percent with reranking."}, {"title": "Evaluating Chunking Strategies for Retrieval", "url": "https://www.trychroma.com/research/evaluating-chunking", "type": "blog", "by": "Smith and Troynikov, Chroma, 2024", "level": 2}, {"title": "Late Chunking: Contextual Chunk Embeddings Using Long-Context Embedding Models", "url": "https://arxiv.org/abs/2409.04701", "type": "paper", "by": "Günther et al., Jina AI, 2024", "level": 3}, {"title": "Dense X Retrieval: What Retrieval Granularity Should We Use?", "url": "https://arxiv.org/abs/2312.06648", "type": "paper", "by": "Chen et al., 2023", "level": 3}, {"title": "Enhancing RAG with Contextual Retrieval", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/capabilities/contextual-embeddings/guide.ipynb", "type": "project", "by": "Anthropic Claude Cookbooks, 2024", "level": 2, "build": "A retrieval pipeline with plain chunk embeddings, contextual embeddings, contextual BM25 fused by reciprocal rank fusion, and a reranker, scored at every stage.", "teaches": "What each retrieval technique is worth on real data; in the recorded run, Pass@10 rose from 87 to 95 percent across the four stages.", "time": "a day", "mode": "Code along, then change it", "task": "Rebuild the notebook’s four stages on its codebase dataset, checking Pass@5, @10, and @20 after each, then run the same four stages on a corpus and question set of your own.", "signature": true}, {"title": "chunking_evaluation", "url": "https://github.com/brandonstarxel/chunking_evaluation", "type": "project", "by": "Smith and Troynikov, Chroma, 2024", "level": 2, "build": "A chunker of your own design, scored for token-level IoU and recall on Chroma’s evaluation set next to two baselines.", "teaches": "How chunk size and overlap trade recall against wasted tokens, measured token by token.", "time": "an afternoon", "mode": "Extend it", "task": "Write your own chunker as a BaseChunker subclass, score it with GeneralEvaluation, and compare its IoU and recall against a 200 token recursive splitter and ClusterSemanticChunker."}]}, {"id": "agenticsearch", "title": "Agentic search and deep research", "kind": "concept", "track": "retrieval", "pre": ["rag", "agentloop"], "frontier": true, "core": "Give the model a search tool and let it run the loop: query, read, note what is still missing, and query again until it can answer. Deep research runs that loop for minutes across hundreds of pages and writes a cited report.", "reach": "Multi-agent research systems run several loops at once, and Search-R1 trains the loop with reinforcement learning.", "uses": "The deep research modes in ChatGPT, Gemini, Claude, and Perplexity; Claude Code and Codex searching a codebase with grep and file reads; due diligence memos and literature reviews.", "worth": "questions need several lookups, or the corpus changes too fast to index; the agent loop and RAG first, and single fact lookups can stay with plain RAG.", "resources": [{"title": "A Practical Guide to Implementing DeepSearch/DeepResearch", "url": "https://jina.ai/news/a-practical-guide-to-implementing-deepsearch-deepresearch/", "type": "blog", "by": "Han Xiao, Jina AI, 2025", "level": 1}, {"title": "BrowseComp: A Simple Yet Challenging Benchmark for Browsing Agents", "url": "https://arxiv.org/abs/2504.12516", "type": "paper", "by": "Wei et al., OpenAI, 2025", "level": 2}, {"title": "BrowseComp-Plus: A More Fair and Transparent Evaluation Benchmark of Deep-Research Agent", "url": "https://arxiv.org/abs/2508.06600", "type": "paper", "by": "Chen et al., Waterloo, 2025", "level": 2, "note": "Table 1: a better retriever lifts every agent, and more than doubles gpt-4.1’s accuracy."}, {"title": "Search-R1: Training LLMs to Reason and Leverage Search Engines with Reinforcement Learning", "url": "https://arxiv.org/abs/2503.09516", "type": "paper", "by": "Jin et al., 2025", "level": 3}, {"title": "Open Deep Research", "url": "https://github.com/huggingface/smolagents/tree/main/examples/open_deep_research", "type": "project", "by": "Hugging Face smolagents, 2025", "level": 2, "build": "An open replication of OpenAI’s deep research, a smolagents code agent that searches and reads the web, scored on part of GAIA.", "teaches": "Where a search agent spends its steps and tokens, and which failures trace to the search results and which to the model’s reading.", "time": "a weekend", "mode": "Reproduce a result", "task": "Install the example, run its agent on 20 GAIA validation questions with a model you can afford, and compare your pass rate with the 55 percent its README reports."}, {"title": "Separate the retriever from the agent on BrowseComp-Plus", "url": "https://github.com/texttron/BrowseComp-Plus", "type": "project", "by": "Built on Chen et al., BrowseComp-Plus, 2025", "level": 2, "build": "One search agent, two retrievers, and accuracy, evidence recall, and search calls for each on the same 100 queries.", "teaches": "How much a better retriever moves a deep research score compared with a better model, on a corpus that stays fixed between runs.", "time": "a weekend", "mode": "Reproduce a result", "task": "Write a search agent against BrowseComp-Plus’s fixed corpus, run it on 100 queries with the BM25 index and then the Qwen3-Embedding-8B index, and grade both runs with the repository’s evaluate_run.py.", "made": true, "done": "The dense index raises your agent’s accuracy over BM25, as it lifted gpt-4.1 from 14.6 to 35.4 percent in the paper’s Table 1."}]}, {"id": "memory", "title": "Long-term memory for agents", "kind": "concept", "track": "retrieval", "pre": ["compaction", "rag"], "frontier": true, "core": "An agent remembers across sessions only what it writes outside its context window, such as files, editable profile blocks, or a searchable log of past events. Most of the design is deciding what to save, update, or forget, and what to load back each turn.", "reach": "Long-running agents keep progress files the same way, and skill libraries store procedures where memory stores facts.", "uses": "ChatGPT’s saved memories and chat history reference, Claude’s memory tool, Letta’s stateful agents, and coding agents that keep notes files such as CLAUDE.md or AGENTS.md between sessions.", "worth": "your agent serves the same user or project over many sessions; compaction and RAG first, and tools used within a single session can skip it.", "resources": [{"title": "Memory for agents", "url": "https://www.langchain.com/blog/memory-for-agents", "type": "blog", "by": "Harrison Chase, LangChain, 2024", "level": 1}, {"title": "MemGPT: Towards LLMs as Operating Systems", "url": "https://arxiv.org/abs/2310.08560", "type": "paper", "by": "Packer et al., Berkeley, 2023", "level": 2, "note": "Section 2 is the design: main context, external context, and the function calls that move data between them."}, {"title": "LongMemEval: Benchmarking Chat Assistants on Long-Term Interactive Memory", "url": "https://arxiv.org/abs/2410.10813", "type": "paper", "by": "Wu et al., 2024", "level": 2}, {"title": "Memory tool", "url": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool", "type": "notes", "by": "Anthropic, Claude Platform docs", "level": 2, "note": "File-based memory as shipped: six file commands your code runs, and the path checks it needs."}, {"title": "Generative Agents: Interactive Simulacra of Human Behavior", "url": "https://arxiv.org/html/2304.03442v2#S4.SS1", "type": "section", "by": "Park et al., Stanford and Google, 2023", "level": 2, "section": "Section 4.1, Memory and Retrieval", "covers": "A memory stream of timestamped observations, retrieved by a weighted score of recency, importance, and relevance, and why that answers better than summarizing the whole history into the prompt."}, {"title": "Context Editing & Memory for Long-Running Agents", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/tool_use/memory_cookbook.ipynb", "type": "project", "by": "Anthropic Claude Cookbooks, 2025", "level": 2, "build": "An agent with Claude’s memory tool and context editing that stores a bug pattern in one session and applies it in the next.", "teaches": "What a memory store needs from your code: a file layout the model can browse, path checks, and rules for when to write.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Run the notebook’s code review assistant across two separate conversations so the second applies what the first saved, then teach it a second kind of lesson and check that a third conversation reuses it."}, {"title": "Build chat memory that beats the full history on LongMemEval", "url": "https://github.com/xiaowu0162/LongMemEval", "type": "project", "by": "Built on Wu et al., LongMemEval, 2024", "level": 3, "build": "A memory layer that splits past chats into rounds, indexes extracted facts beside them, and retrieves the top few for each question.", "teaches": "Which choices in a memory store move accuracy, and how questions about time and changed facts break naive retrieval.", "time": "a week", "mode": "Extend it", "task": "Starting from the repository’s retrieval baselines, index each LongMemEval_S chat history by rounds with extracted user facts as extra keys, answer all 500 questions, and score them with its evaluation script.", "made": true, "done": "Your system beats the same model reading the full history; in the paper GPT-4o scored 60.6 percent that way and 87.0 with only the evidence sessions."}]}, {"id": "tooluse", "title": "Tool calling", "kind": "concept", "track": "agents", "pre": ["structured"], "frontier": false, "core": "Describe each tool to the model with a name, a description, and a JSON schema for its arguments. When it wants one, the model returns a structured call; your code runs the function and sends the result back in the next message.", "reach": "The step every agent loop repeats; MCP standardizes the descriptions, and prompt injection enters through the results.", "uses": "Every agent product, from ChatGPT connectors to Claude Code; extraction pipelines that force a tool call to get parseable JSON; and assistants that book meetings or update records through an API.", "worth": "you will connect a model to any code or API; structured outputs first, and everything else on this track assumes it.", "resources": [{"title": "Tool use with Claude", "url": "https://platform.claude.com/docs/en/agents-and-tools/tool-use/overview", "type": "notes", "by": "Anthropic, Claude Platform docs", "level": 1}, {"title": "Toolformer: Language Models Can Teach Themselves to Use Tools", "url": "https://arxiv.org/abs/2302.04761", "type": "paper", "by": "Schick et al., Meta, 2023", "level": 2}, {"title": "Gorilla: Large Language Model Connected with Massive APIs", "url": "https://arxiv.org/abs/2305.15334", "type": "paper", "by": "Patil, Zhang, Wang, Gonzalez, Berkeley, 2023", "level": 3}, {"title": "Anthropic courses: Tool use", "url": "https://github.com/anthropics/courses/tree/master/tool_use", "type": "project", "by": "Anthropic courses, 2024", "level": 1, "build": "A calculator tool, a Wikipedia research assistant, forced JSON extraction, and a customer support chatbot that chooses among several tools.", "teaches": "The exact message format of a tool call and its result, when to force a tool, and how a system prompt curbs eager tool use.", "time": "a day", "mode": "Do the assignment", "task": "Work through the six notebooks in order and complete each exercise, ending with the TechNova support bot extended with tools that update contact details and combine user and order lookups."}, {"title": "Berkeley Function Calling Leaderboard", "url": "https://github.com/ShishirPatil/gorilla/tree/main/berkeley-function-call-leaderboard", "type": "project", "by": "Patil et al., Berkeley Gorilla, 2024 to 2026", "level": 2, "build": "BFCL scores for one model across four categories of function calling, with a short list of the ways it fails.", "teaches": "Which kinds of tool calls a model gets wrong, checked by parsing each call’s syntax tree and by tracking state across turns.", "time": "a day", "mode": "Apply it", "task": "Install bfcl-eval, generate and score one open model on the simple, parallel, multiple, and multi_turn categories, then read twenty of its failures and sort them by cause."}]}, {"id": "agentloop", "title": "The agent loop", "kind": "concept", "track": "agents", "pre": ["tooluse", "cot"], "frontier": false, "core": "An agent is a loop: send the conversation, run any tool calls that come back, append their results, and repeat until the model replies without one. The loop is a few dozen lines; the work goes into the tools, the context, and the stopping rule.", "reach": "Tool design, code actions, workflows, and subagents all modify this loop, and harnesses wrap it for long tasks.", "uses": "Claude Code, Codex, Cursor’s agent, Devin, and customer support agents all run this loop, as do research agents and spreadsheet bots, each with its own tools and stopping rule.", "worth": "you will build or debug any agent; write one from scratch once, since frameworks hide the loop you will later need to change.", "resources": [{"title": "LLM Powered Autonomous Agents", "url": "https://lilianweng.github.io/posts/2023-06-23-agent/", "type": "blog", "by": "Lilian Weng, 2023", "level": 1}, {"title": "Designing agentic loops", "url": "https://simonwillison.net/2025/Sep/30/designing-agentic-loops/", "type": "blog", "by": "Simon Willison, 2025", "level": 1}, {"title": "ReAct: Synergizing Reasoning and Acting in Language Models", "url": "https://arxiv.org/abs/2210.03629", "type": "paper", "by": "Yao et al., Princeton and Google, 2023", "level": 2}, {"title": "How to Build an Agent", "url": "https://ampcode.com/notes/how-to-build-an-agent", "type": "project", "by": "Thorsten Ball, Amp, 2025", "level": 1, "build": "A terminal coding agent under 400 lines with read_file, list_files, and edit_file tools, plus one tool of your own.", "teaches": "That a working coding agent is a model, a loop, and three tools, and where its first failures show up.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Type out the post’s Go agent step by step, or port it to Python, then add a fourth tool that runs a shell command and use it to make a failing test pass."}, {"title": "Agents Course Unit 4: Final project", "url": "https://huggingface.co/learn/agents-course/unit4/hands-on", "type": "project", "by": "Hugging Face Agents Course, 2025", "level": 2, "build": "Your own agent with web search, file reading, and code tools, scored on 20 GAIA validation questions, with its code public on a Space.", "teaches": "The whole track under one grader: tool choice, code actions, search, and how exact-match scoring punishes a chatty final answer.", "time": "a week", "mode": "Enter the challenge", "task": "Duplicate the course’s template Space, build an agent with any framework or none, fetch the 20 GAIA level 1 questions from the course API, and submit exact-match answers to the student leaderboard.", "signature": true}]}, {"id": "tooldesign", "title": "Designing tools for agents", "kind": "concept", "track": "agents", "pre": ["agentloop"], "frontier": false, "core": "The model knows a tool only by its name, description, parameters, and output, so write them for a capable newcomer: few tools, each finishing a whole task, results trimmed to what the next step needs, and errors that say how to fix the call.", "reach": "Skills and MCP servers package tool designs, and SWE-agent’s interface set the pattern coding agents follow.", "uses": "SWE-agent’s windowed file viewer and linting editor, Claude Code’s cap on tool output, MCP servers rewritten after evals, and tool search that loads definitions only when a server has dozens of tools.", "worth": "your agent picks the wrong tools or floods its context with output; the agent loop first, and it pays off more than prompt tweaks for any agent with custom tools.", "resources": [{"title": "Writing effective tools for agents, with agents", "url": "https://www.anthropic.com/research/writing-tools-for-agents", "type": "blog", "by": "Ken Aizawa, Anthropic, 2025", "level": 1}, {"title": "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering", "url": "https://arxiv.org/abs/2405.15793", "type": "paper", "by": "Yang et al., Princeton, 2024", "level": 2, "note": "Table 3 prices each interface choice, such as a 100 line file viewer, linting on every edit, and summarized search results."}, {"title": "Introducing advanced tool use on the Claude Developer Platform", "url": "https://www.anthropic.com/research/advanced-tool-use", "type": "blog", "by": "Anthropic, 2025", "level": 2, "note": "Tool search for large tool sets and worked examples in definitions; the accuracy gains are Anthropic’s own measurements."}, {"title": "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering", "url": "https://arxiv.org/html/2405.15793v3#S2", "type": "section", "by": "Yang et al., Princeton, 2024", "level": 1, "section": "Section 2, The Agent-Computer Interface", "covers": "Why a language model needs its own interface to a computer, and four principles for one: simple actions, compact actions, concise feedback, and guardrails that catch mistakes early."}, {"title": "Tool Evaluation", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/tool_evaluation/tool_evaluation.ipynb", "type": "project", "by": "Anthropic Claude Cookbooks, 2025", "level": 2, "build": "An evaluation harness in which agents run your tasks against your tool and report accuracy, tool calls, and suggested fixes.", "teaches": "How small changes to a tool’s name, description, and output format move an agent’s accuracy, measured on tasks you wrote.", "time": "a day", "mode": "Extend it", "task": "Replace the notebook’s calculator with a tool of your own, write ten evaluation tasks with checkable answers, run them, and revise the tool’s description and output from the agents’ feedback until accuracy improves."}, {"title": "Price the agent-computer interface on SWE-bench Lite", "url": "https://arxiv.org/abs/2405.15793", "type": "project", "by": "Built on Yang et al., SWE-agent, 2024", "level": 3, "build": "Two agents that differ only in their file viewing and editing tools, with resolve rates on one shared set of tasks.", "teaches": "How much of an agent’s score its interface carries, and how that share changes with the strength of the model.", "time": "a weekend", "mode": "Reproduce a result", "task": "Start from mini-swe-agent’s bash-only loop, add a windowed file viewer and an edit command that rejects code failing a linter, and run both versions on the same 50 SWE-bench Lite tasks with one small model.", "made": true, "done": "The version with the viewer and linting editor resolves more tasks; SWE-agent’s interface solved 10.7 points more of Lite than a shell-only agent did."}]}, {"id": "mcp", "title": "The Model Context Protocol", "kind": "concept", "track": "agents", "pre": ["tooluse"], "frontier": false, "core": "MCP is a shared protocol for connecting tools and data to models. A server exposes tools, resources, and prompts over JSON-RPC, and any MCP client, such as Claude, ChatGPT, Cursor, or VS Code, can use them, so one integration serves every compatible agent.", "reach": "Puts tool design behind a protocol; every connected server’s descriptions cost context and are untrusted input for prompt injection.", "uses": "Claude Desktop, Claude Code, ChatGPT, Cursor, and VS Code connect to MCP servers for GitHub, Slack, databases, and browsers, and companies publish official servers so agents can use their products.", "worth": "you will ship a tool for agents you do not control, or plug many tools into one agent; tool calling first, and tools inside your own agent do not need it.", "resources": [{"title": "Introducing the Model Context Protocol", "url": "https://www.anthropic.com/news/model-context-protocol", "type": "blog", "by": "Anthropic, 2024", "level": 1}, {"title": "Architecture overview", "url": "https://modelcontextprotocol.io/docs/learn/architecture", "type": "notes", "by": "Model Context Protocol docs, 2026", "level": 1}, {"title": "Model Context Protocol has prompt injection security problems", "url": "https://simonwillison.net/2025/Apr/9/mcp-prompt-injection/", "type": "blog", "by": "Simon Willison, 2025", "level": 2}, {"title": "Model Context Protocol Specification, version 2026-07-28", "url": "https://modelcontextprotocol.io/specification/2026-07-28", "type": "notes", "by": "Model Context Protocol project, 2026", "level": 3, "note": "The current version: stateless requests, with long tasks and inline apps as opt-in extensions."}, {"title": "Build an MCP server", "url": "https://modelcontextprotocol.io/docs/develop/build-server", "type": "project", "by": "Model Context Protocol docs", "level": 1, "build": "A local MCP server over stdio that serves National Weather Service alerts and forecasts, plus one tool of your own, to any MCP client.", "teaches": "What a server declares, how a client discovers and calls its tools, and why a stdio server must never print to standard output.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Follow the quickstart to build the weather server with get_alerts and get_forecast, connect it to Claude Desktop or another MCP client, then add a third tool that wraps an API you use."}, {"title": "MCP Course Unit 2: Building an End-to-End MCP Application", "url": "https://huggingface.co/learn/mcp-course/unit2/introduction", "type": "project", "by": "Hugging Face MCP Course, 2025", "level": 2, "build": "A sentiment analysis tool served over MCP from a Hugging Face Space and called by clients in two languages.", "teaches": "How one MCP server serves several clients, and what changes when the server is remote.", "time": "a day", "mode": "Code along, then change it", "task": "Build the unit’s Gradio sentiment analysis server, expose it over MCP, connect both the JavaScript client and the smolagents Python client, and deploy the server to a Hugging Face Space."}]}, {"id": "codeact", "title": "Code as the action space", "kind": "concept", "track": "agents", "pre": ["agentloop"], "frontier": false, "core": "Let the model act by writing a program that calls your tools as functions, run it in a sandbox, and return only what it prints. Loops, variables, and filters run in code, so ten tool calls and their raw outputs never enter the model’s context.", "reach": "Needs a sandbox; programmatic tool calling and Code Mode apply it to MCP, and evolutionary program search takes it furthest.", "uses": "smolagents’ CodeAgent, OpenHands, whose default agent is built on CodeAct, Claude’s programmatic tool calling, Cloudflare’s Code Mode for MCP, and ChatGPT’s data analysis, which answers by running Python.", "worth": "your agent chains many tool calls or handles large tool outputs; the agent loop first, and budget for a sandbox, which is the price of running model code.", "resources": [{"title": "Introducing smolagents, a simple library to build agents", "url": "https://huggingface.co/blog/smolagents", "type": "blog", "by": "Roucher, Noyan, Wolf, Hugging Face, 2024", "level": 1}, {"title": "Executable Code Actions Elicit Better LLM Agents", "url": "https://arxiv.org/abs/2402.01030", "type": "paper", "by": "Wang et al., UIUC, 2024", "level": 2, "note": "Section 2 holds the argument and the comparison; Section 3 fine-tunes an open model to act this way."}, {"title": "Code execution with MCP: Building more efficient agents", "url": "https://www.anthropic.com/research/code-execution-with-mcp", "type": "blog", "by": "Jones and Kelly, Anthropic, 2025", "level": 2, "note": "The drop from 150,000 to 2,000 tokens is Anthropic’s own example and unchecked elsewhere."}, {"title": "Programmatic Tool Calling with the Claude API", "url": "https://github.com/anthropics/claude-cookbooks/blob/main/tool_use/programmatic_tool_calling_ptc.ipynb", "type": "project", "by": "Anthropic Claude Cookbooks, 2025", "level": 2, "build": "Two versions of a team expense audit agent, one passing every tool result through the model and one filtering results in code.", "teaches": "Where code actions save tokens; in the recorded run the same audit used 110,473 tokens with direct calls and 15,919 with code.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Run the notebook’s expense audit with ordinary tool calls and then with programmatic tool calling, record tokens and time for each, then repeat both on a question you write against the same three tools."}, {"title": "Code versus JSON actions on M3ToolEval", "url": "https://github.com/xingyaoww/code-act/tree/main/scripts/eval/m3tooleval", "type": "project", "by": "Built on Wang et al., CodeAct, 2024", "level": 2, "build": "Success rates and turn counts for one model acting through code, JSON, and text on the same 82 tasks.", "teaches": "Whether code actions still help a current model, and on which tasks composing several tools in one step matters.", "time": "a day", "mode": "Reproduce a result", "task": "Run M3ToolEval from the CodeAct repository with one current model in all three action formats, code, JSON, and text, and record success rate and average turns for each.", "made": true, "done": "Code actions solve more tasks in fewer turns, as in Table 3, where gpt-4-1106-preview scored 74.4 percent with code and 52.4 with JSON."}]}, {"id": "computeruse", "title": "Computer use and browser agents", "kind": "concept", "track": "agents", "pre": ["agentloop"], "frontier": true, "core": "A computer use agent sees the screen as screenshots and acts with clicks and keystrokes at pixel coordinates, so it can drive any app a person can. It is slow and easily misled, so use an API or the page’s accessibility tree where one exists.", "reach": "Needs sandboxes and permissions more than any other agent, since every page it reads can carry a prompt injection.", "uses": "Claude’s computer use, ChatGPT agent (formerly Operator), and Google’s Project Mariner drive browsers and desktops; QA teams test interfaces with it; old software with no API gets automated.", "worth": "the app you need has no API to call; the agent loop and prompt injection first, and anything with an API is faster and safer through the API.", "resources": [{"title": "Developing a computer use model", "url": "https://www.anthropic.com/news/developing-computer-use", "type": "blog", "by": "Anthropic, 2024", "level": 1}, {"title": "OSWorld: Benchmarking Multimodal Agents for Open-Ended Tasks in Real Computer Environments", "url": "https://arxiv.org/abs/2404.07972", "type": "paper", "by": "Xie et al., HKU, 2024", "level": 2}, {"title": "GPT-4V(ision) is a Generalist Web Agent, if Grounded", "url": "https://arxiv.org/abs/2401.01614", "type": "paper", "by": "Zheng, Gou, Kil, Sun, Su, Ohio State, 2024", "level": 2}, {"title": "WebArena: A Realistic Web Environment for Building Autonomous Agents", "url": "https://arxiv.org/abs/2307.13854", "type": "paper", "by": "Zhou et al., CMU, 2023", "level": 2}, {"title": "Introducing OSWorld-Verified", "url": "https://xlang.ai/blog/osworld-verified", "type": "blog", "by": "XLANG Lab, 2025", "level": 3, "note": "The 2025 fixes to broken and ambiguous tasks, with the best agent at 61 percent against about 72 for people."}, {"title": "Computer use demo", "url": "https://github.com/anthropics/claude-quickstarts/tree/main/computer-use-demo", "type": "project", "by": "Anthropic Claude Quickstarts", "level": 1, "build": "A sandboxed Linux desktop driven by Claude through screenshots, mouse, and keyboard, with a log of five attempted tasks.", "teaches": "How slow and literal a screenshot loop is, and why the container, a domain allowlist, and human confirmation matter.", "time": "an afternoon", "mode": "Apply it", "task": "Run the demo’s Docker container, give the agent five desktop tasks of your own, and log for each whether it succeeded, how many screenshots it took, and where it misclicked."}, {"title": "BrowserGym", "url": "https://github.com/ServiceNow/BrowserGym", "type": "project", "by": "ServiceNow Research, 2024", "level": 2, "build": "Success rates for one web agent on 20 MiniWoB tasks under two observation settings, with a trace of each failure.", "teaches": "What the page’s structure gives an agent beyond pixels, on the same harness that runs WebArena and WorkArena.", "time": "a weekend", "mode": "Apply it", "task": "Install BrowserGym with MiniWoB, run its demo agent on 20 MiniWoB tasks with the same model twice, once with screenshots turned on and once with text observations only, and compare success rates."}]}, {"id": "workflows", "title": "Workflows: chains, routers and orchestrators", "kind": "concept", "track": "agents", "pre": ["agentloop"], "frontier": false, "core": "Write known steps as code and call the model at fixed points: a chain feeds each output to the next prompt, a router picks a branch, parallel calls split work or vote, and an orchestrator hands out subtasks. Keep agents for paths you cannot plan.", "reach": "DSPy optimizes these pipelines against a metric, and multi-agent systems are orchestrators whose workers are agents.", "uses": "Most production LLM features: ticket routers, document extraction chains, moderation that votes across parallel calls, and report writers with an evaluator loop; LangGraph and similar frameworks exist to build them.", "worth": "you are shipping an LLM feature with known steps, which is most of them; the agent loop first, so you can tell when a fixed workflow is enough.", "resources": [{"title": "Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents", "type": "blog", "by": "Schluntz and Zhang, Anthropic, 2024", "level": 1}, {"title": "12-Factor Agents", "url": "https://github.com/humanlayer/12-factor-agents", "type": "notes", "by": "Dex Horthy, HumanLayer, 2025", "level": 2}, {"title": "AI Agents That Matter", "url": "https://arxiv.org/abs/2407.01502", "type": "paper", "by": "Kapoor, Stroebl, Siegel, Nadgir, Narayanan, Princeton, 2024", "level": 2, "note": "Simple retry and escalation baselines match complex agent designs on HumanEval at a fraction of the cost."}, {"title": "Building Effective Agents cookbook", "url": "https://github.com/anthropics/claude-cookbooks/tree/main/patterns/agents", "type": "project", "by": "Anthropic Claude Cookbooks, 2024", "level": 1, "build": "Minimal prompt chaining, routing, parallelization, evaluator-optimizer, and orchestrator-workers code, plus one task built two ways.", "teaches": "How little code each pattern needs, and when a fixed chain matches an agent’s output for fewer tokens.", "time": "a day", "mode": "Code along, then change it", "task": "Type out the basic workflows, evaluator-optimizer, and orchestrator-workers notebooks, then build one task of your own both as a fixed chain and as a single agent and compare cost and output."}]}, {"id": "multiagent", "title": "Multi-agent systems and subagents", "kind": "concept", "track": "agents", "pre": ["workflows", "compaction"], "frontier": true, "core": "A lead agent splits a task, gives each part to a subagent with a fresh context window, and merges the summaries they return. Search runs in parallel and the lead’s context stays clean, at several times the tokens; results conflict when subagents must share decisions.", "reach": "Compaction across agents, since each subagent hands back a summary; deep research and coding subagents are the common uses.", "uses": "Claude’s Research feature, Claude Code subagents that search a codebase in parallel, handoffs in OpenAI’s Agents SDK, and open deep research tools with a supervisor and parallel researchers.", "worth": "a task splits into parallel parts that share little context, such as broad research; workflows and compaction first, and most coding tasks go better with one agent.", "resources": [{"title": "How we built our multi-agent research system", "url": "https://www.anthropic.com/research/multi-agent-research-system", "type": "blog", "by": "Hadfield et al., Anthropic, 2025", "level": 1, "note": "The 90.2 percent gain is on Anthropic’s internal research eval."}, {"title": "Don’t Build Multi-Agents", "url": "https://cognition.com/blog/dont-build-multi-agents", "type": "blog", "by": "Walden Yan, Cognition, 2025", "level": 1}, {"title": "Create custom subagents", "url": "https://code.claude.com/docs/en/sub-agents", "type": "notes", "by": "Anthropic, Claude Code docs", "level": 2}, {"title": "Why Do Multi-Agent LLM Systems Fail?", "url": "https://arxiv.org/html/2503.13657v3#S4", "type": "section", "by": "Cemri, Pan, Yang et al., Berkeley, 2025", "level": 2, "section": "Section 4, The Multi-Agent System Failure Taxonomy", "covers": "Fourteen ways multi-agent systems fail, grouped into system design, misalignment between agents, and weak verification, drawn from annotated traces of seven frameworks."}, {"title": "Agents Course: Multi-Agent Systems", "url": "https://huggingface.co/learn/agents-course/unit2/smolagents/multi_agent_systems", "type": "project", "by": "Hugging Face Agents Course, 2025", "level": 2, "build": "A manager agent and a web search agent that find filming locations, compute travel times with a custom tool, and plot them on a map.", "teaches": "How delegation splits context between agents, and what the manager’s planning and final check cost in tokens.", "time": "a day", "mode": "Code along, then change it", "task": "Run the unit’s notebook to build a manager code agent that delegates browsing to a web agent, then measure tokens and success against a single agent given the same tools."}, {"title": "One agent or a lead with subagents on BrowseComp-Plus", "url": "https://github.com/texttron/BrowseComp-Plus", "type": "project", "by": "Built on Chen et al., BrowseComp-Plus, 2025, and Anthropic, 2025", "level": 3, "build": "A single search agent and a lead with subagents, each scored on the same queries with tokens counted for every run.", "teaches": "Whether subagents add accuracy beyond the tokens they spend, the question on which Anthropic and Cognition disagree.", "time": "a weekend", "mode": "Extend it", "task": "Take a search agent that runs on BrowseComp-Plus, add a lead that spawns three subagents with separate contexts, run both versions on the same 100 queries, and log accuracy and total tokens.", "made": true, "done": "You report both systems’ accuracy at matched token budgets on 100 queries, testing Anthropic’s finding that token use explained 80 percent of BrowseComp variance."}]}, {"id": "skills", "title": "Agent skills", "kind": "concept", "track": "agents", "pre": ["jit", "tooldesign"], "frontier": true, "core": "A skill is a folder holding a SKILL.md of instructions, plus scripts and reference files, behind a one-line description. The agent reads only the descriptions until a task matches one, then loads that SKILL.md and opens other files as needed, so hundreds cost little context.", "reach": "Progressive disclosure applied to procedures; skill libraries let agents write their own, though SkillsBench finds self-written skills rarely help.", "uses": "Claude’s built-in docx, xlsx, pptx, and pdf skills; team skills checked into a repository for Claude Code; and OpenAI’s Codex and GitHub Copilot, which read the same open SKILL.md format.", "worth": "you keep pasting the same instructions or scripts into an agent; tool design first, and a skill helps only when someone who knows the task writes and tests it.", "resources": [{"title": "Equipping agents for the real world with Agent Skills", "url": "https://www.anthropic.com/research/equipping-agents-for-the-real-world-with-agent-skills", "type": "blog", "by": "Zhang, Lazuka, Murag, Anthropic, 2025", "level": 1}, {"title": "Skill authoring best practices", "url": "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices", "type": "notes", "by": "Anthropic, Claude Platform docs", "level": 2}, {"title": "SkillsBench: Benchmarking How Well Agent Skills Work Across Diverse Tasks", "url": "https://arxiv.org/abs/2602.12670", "type": "paper", "by": "Li et al., 2026", "level": 2, "note": "Curated skills add 16.2 points on average, self-written ones lose 1.3, and two or three focused skills beat four or more."}, {"title": "Claude Skills are awesome, maybe a bigger deal than MCP", "url": "https://simonwillison.net/2025/Oct/16/claude-skills/", "type": "blog", "by": "Simon Willison, 2025", "level": 2}, {"title": "Agent Skills specification", "url": "https://agentskills.io/specification", "type": "notes", "by": "Agent Skills open standard, 2025", "level": 3}, {"title": "anthropics/skills", "url": "https://github.com/anthropics/skills", "type": "project", "by": "Anthropic, 2025", "level": 1, "build": "A working skill folder with a SKILL.md, a bundled script, and a reference file, tested on prompts that should and should not trigger it.", "teaches": "How much the one-line description decides, and what belongs in SKILL.md and what in a file loaded on demand.", "time": "an afternoon", "mode": "Extend it", "task": "Write a new skill for a task you repeat, starting from the repository’s template folder and its skill-creator skill, install it in a skills client, and check it loads only for matching requests."}, {"title": "Measure your own skills on SkillsBench", "url": "https://github.com/benchflow-ai/skillsbench", "type": "project", "by": "Built on Li et al., SkillsBench, 2026", "level": 3, "build": "Pass rates for one agent under three skill conditions on five tasks, with your own skills kept beside the curated ones.", "teaches": "What separates a skill that helps from one that only adds tokens, judged by deterministic verifiers.", "time": "a weekend", "mode": "Reproduce a result", "task": "Pick five SkillsBench tasks, run one agent on each with no skills, with the curated skills, and with skills you write without seeing the curated ones, and score every run with the task’s verifier.", "made": true, "done": "Curated skills beat no skills on most of your five tasks, as their 16.2 point average gain predicts, and you report where your own skills land."}]}, {"id": "harnessdef", "title": "What a harness is", "kind": "concept", "track": "harness", "pre": ["agentloop", "ctxeng"], "frontier": false, "core": "A harness is the code around a model: its loop, tools, context policy, permissions, and stopping checks. Swapping it can matter as much as swapping models: on CORE-Bench Hard, Claude Opus 4.5 scored 42% in HAL’s CORE-Agent harness and 78% in Claude Code.", "reach": "Coding agents, sandboxes, and long runs are parts of a harness; Poetiq’s metasystem searches over whole harnesses.", "uses": "Claude Code, Codex, Cursor, and OpenHands are harnesses, and several of them can run the same model. LangChain and Poetiq raised benchmark scores by changing only the harness, and ARC Prize now reports ARC-AGI-3 results under two harnesses.", "worth": "you build on hosted models past a single prompt; the agent loop and context engineering come first, and nobody building agents should skip it.", "resources": [{"title": "Improving Deep Agents with harness engineering", "url": "https://www.langchain.com/blog/improving-deep-agents-with-harness-engineering", "type": "blog", "by": "Vivek Trivedy, LangChain, 2026", "level": 1, "note": "The vendor’s own numbers: Terminal-Bench 2.0 rose from 52.8 to 66.5 percent with gpt-5.2-codex held fixed."}, {"title": "Building agents with the Claude Agent SDK", "url": "https://claude.com/resources/articles/building-agents-with-the-claude-agent-sdk", "type": "blog", "by": "Thariq Shihipar, Anthropic, 2025", "level": 1, "note": "The gather context, take action, and verify loop that Claude Code runs, and what the harness supplies at each step."}, {"title": "Holistic Agent Leaderboard: The Missing Infrastructure for AI Agent Evaluation", "url": "https://arxiv.org/abs/2510.11977", "type": "paper", "by": "Kapoor, Stroebl, et al., Princeton, 2025", "level": 2, "note": "Independent runs across models and scaffolds; the CORE-Bench Hard page on hal.cs.princeton.edu holds the 42 and 78 percent rows."}, {"title": "Recursive Self-Improvement Delivers New State-of-the-Art Coding Performance", "url": "https://poetiq.ai/posts/recursive_self_improvement_coding/", "type": "blog", "by": "Poetiq, 2026", "level": 2, "note": "Self-reported: one automatically built harness raised every model tested on LiveCodeBench Pro, Gemini 3.1 Pro from 78.6 to 90.9 percent."}, {"title": "From Question Answering to Task Completion: A Survey on Agent System and Harness Design", "url": "https://arxiv.org/html/2606.20683v1#S5", "type": "section", "by": "Guo et al., 2026", "level": 2, "section": "Section 5, Anatomy of the Execution Harness", "covers": "A harness split into six jobs: turning raw signals into observations, managing context, running the control loop, mapping outputs to actions, storing state, and verifying or governing execution."}, {"title": "Building a minimal AI agent from scratch", "url": "https://minimal-agent.com/", "type": "project", "by": "Lieret, Jimenez, Yang, Press, SWE-agent team, 2025", "level": 1, "build": "A working shell agent of about a hundred lines: a model call, an action parser, a command runner, and a loop with stopping rules.", "teaches": "That a harness is a handful of small choices, and how each one changes what the agent can finish.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Type out the tutorial’s agent from an empty file as you read, then add a step limit, a cost counter, and a timeout on each shell command, and run it on three shell tasks of your own."}, {"title": "Same model, two harnesses on Terminal-Bench 2.0", "url": "https://github.com/harbor-framework/harbor", "type": "project", "by": "Built on Harbor and Terminal-Bench 2.0, 2026", "level": 2, "build": "Two scored runs that differ only in the harness, and a list of the failures each harness caused.", "teaches": "How much of an agent benchmark score belongs to the harness, and which harness choices create the gap.", "time": "a weekend", "mode": "Apply it", "task": "Run Harbor on the same 30 Terminal-Bench 2.0 tasks with one model under two of its built-in agents, terminus-2 and mini-swe-agent, then read the transcripts of every task where they disagree.", "made": true, "done": "Both agents have run the same 30 tasks with one model and you can name a cause for each disagreement; LangChain’s harness changes alone moved one model 13.7 points across all 89 tasks."}]}, {"id": "sandbox", "title": "Sandboxes and execution environments", "kind": "concept", "track": "harness", "pre": ["codeact"], "frontier": false, "core": "An agent that runs code needs a boundary: directories it may write, hosts it may reach, and a kernel it cannot touch. Containers share the host kernel; gVisor and Firecracker microVMs give each sandbox its own, at some cost in speed.", "reach": "Containers also make evaluation reproducible: SWE-bench builds an image per task, and agentic RL trains inside thousands of them at once.", "uses": "Claude Code’s sandbox mode and its cloud sessions, E2B’s per-agent Linux VMs, AWS Lambda and Fargate on Firecracker, OpenAI’s gVisor sandbox for grading Codex samples, and SWE-bench’s per-task Docker images. RL training runs thousands of these at once.", "worth": "your agent runs code, installs packages, or touches files you care about; learn containers first. Prompt-only applications can skip it until they add a code tool.", "resources": [{"title": "Beyond permission prompts: making Claude Code more secure and autonomous", "url": "https://www.anthropic.com/research/claude-code-sandboxing", "type": "blog", "by": "Dworken, Weller-Davies, Anthropic, 2025", "level": 1, "note": "Why filesystem and network isolation are needed together; Anthropic reports 84 percent fewer permission prompts in its own use."}, {"title": "E2B Documentation", "url": "https://docs.e2b.dev/", "type": "notes", "by": "E2B, 2026", "level": 1, "note": "What a hosted sandbox looks like from agent code: create a Linux VM, run commands, move files, pause, and resume."}, {"title": "What is gVisor?", "url": "https://gvisor.dev/docs/", "type": "notes", "by": "gVisor authors, Google", "level": 2, "note": "How an application kernel that intercepts system calls compares with plain containers and with virtual machines."}, {"title": "Firecracker: Lightweight Virtualization for Serverless Applications", "url": "https://www.usenix.org/conference/nsdi20/presentation/agache", "type": "paper", "by": "Agache et al., AWS, NSDI 2020", "level": 3, "note": "The virtual machine monitor behind AWS Lambda and Fargate, built to run many small VMs at once."}, {"title": "Docker Setup Guide", "url": "https://www.swebench.com/SWE-bench/guides/docker_setup/", "type": "notes", "by": "SWE-bench team, 2025", "level": 2, "note": "How the harness layers a base image, about 60 environment images, and one image per task, and the 100 to 120 GB of disk that takes."}, {"title": "Evaluating Large Language Models Trained on Code", "url": "https://arxiv.org/abs/2107.03374", "type": "section", "by": "Chen et al., OpenAI, 2021", "level": 2, "section": "Section 2.3, Sandbox for Executing Generated Programs", "covers": "Why generated code must run in isolation, and how OpenAI built it: the gVisor runtime guards the host, and eBPF firewall rules block network connections."}, {"title": "SWE-bench evaluation harness", "url": "https://github.com/SWE-bench/SWE-bench", "type": "project", "by": "SWE-bench team, Princeton and Stanford, 2025", "level": 2, "build": "A working local harness with its base, environment, and per-task images, and a results file showing which gold patches resolve.", "teaches": "How a benchmark pins each repository’s environment in a container so a patch is graded the same way on any machine, and what that costs in disk.", "time": "an afternoon", "mode": "Apply it", "task": "Install SWE-bench, run its gold-patch check on sympy__sympy-20590, then grade the gold patches for 20 SWE-bench Lite instances and read one instance’s build and test logs."}, {"title": "Put an agent’s shell inside sandbox-runtime", "url": "https://github.com/anthropics/sandbox-runtime", "type": "project", "by": "Built on Anthropic’s sandbox-runtime, 2025", "level": 2, "build": "An agent whose commands run under OS-level filesystem and network rules, with a log of what the sandbox refused.", "teaches": "What each boundary stops, what breaks when the rules are too tight, and how an agent reacts when a command is denied.", "time": "an afternoon", "mode": "Apply it", "task": "Wrap every shell command your minimal agent runs in srt, with settings that allow writes only to its project directory and network access to one domain, then ask the agent to read ~/.ssh and fetch example.com.", "made": true, "done": "All 3 probes from the srt README behave as documented from inside your agent: the allowed domain loads, example.com is blocked, and reading ~/.ssh/id_rsa fails."}]}, {"id": "codingagents", "title": "Coding agents", "kind": "concept", "track": "harness", "pre": ["harnessdef", "tooldesign", "sandbox"], "frontier": false, "core": "A coding agent is a model in a loop with a shell and a file editor in a repository, judged by whether hidden tests pass. Its tools decide much of its score: SWE-agent lost 7.7 of 18 points on SWE-bench Lite without its edit command.", "reach": "Execution feedback and long-running harnesses extend it; self-editing agents such as the Darwin Gödel Machine rewrite their own coding harness.", "uses": "Claude Code, Codex, Cursor’s agent, OpenHands, Devin, and mini-SWE-agent. An OpenAI team shipped a product with no hand-written code, and Anthropic’s agents built a 100,000-line C compiler that boots Linux.", "worth": "you write software or build developer tools; tool design and sandboxes come first, and SWE-agent’s interface choices pay off even if you only ever use Claude Code or Codex.", "resources": [{"title": "Best practices for Claude Code", "url": "https://code.claude.com/docs/en/best-practices", "type": "notes", "by": "Anthropic, 2026", "level": 1, "note": "How to drive a coding agent day to day: tell it what it cannot see, give it a check to run, and enforce the rules that allow no exceptions."}, {"title": "Raising the bar on SWE-bench Verified with Claude 3.5 Sonnet", "url": "https://www.anthropic.com/research/swe-bench-sonnet", "type": "blog", "by": "Anthropic, 2025", "level": 1, "note": "A complete minimal coding agent, a prompt plus a bash tool and an edit tool, with the tool descriptions it used."}, {"title": "Harness engineering: leveraging Codex in an agent-first world", "url": "https://openai.com/index/harness-engineering/", "type": "blog", "by": "Ryan Lopopolo, OpenAI, 2026", "level": 2, "note": "About 1,500 merged pull requests in five months with no hand-written code; a short AGENTS.md, a docs folder, and custom lints carry the team’s knowledge."}, {"title": "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering", "url": "https://arxiv.org/abs/2405.15793", "type": "paper", "by": "Yang et al., Princeton, 2024", "level": 2}, {"title": "Agentless: Demystifying LLM-based Software Engineering Agents", "url": "https://arxiv.org/abs/2407.01489", "type": "paper", "by": "Xia, Deng, Dunn, Zhang, UIUC, 2024", "level": 2, "note": "A fixed localize, repair, and validate pipeline that beat the open agents of its day on SWE-bench Lite at $0.70 an issue."}, {"title": "OpenHands: An Open Platform for AI Software Developers as Generalist Agents", "url": "https://arxiv.org/abs/2407.16741", "type": "paper", "by": "Wang et al., 2024", "level": 3, "note": "How a full open coding agent platform is built: a sandboxed runtime, an event stream of actions and observations, and evaluation on 15 tasks."}, {"title": "mini-SWE-agent on SWE-bench Verified", "url": "https://github.com/SWE-agent/mini-swe-agent", "type": "project", "by": "SWE-agent team, Princeton and Stanford, 2025", "level": 2, "note": "OpenAI reported in February 2026 that Verified is contaminated for frontier models, so read the two runs as a comparison between harnesses.", "build": "Two graded runs of a hundred-line coding agent on 50 real GitHub issues that differ by one harness change.", "teaches": "Where a bash-only agent fails on real repositories, and how far one prompt, limit, or tool change moves the resolve rate.", "time": "a weekend", "mode": "Extend it", "task": "Run mini-SWE-agent’s swebench batch mode on 50 SWE-bench Verified instances with one model, grade the patches with sb-cli, then change one thing in its config or prompt and rerun the same 50.", "signature": true}]}, {"id": "feedback", "title": "Execution feedback: tests, linters and repair loops", "kind": "concept", "track": "harness", "pre": ["codingagents", "selfrefine"], "frontier": false, "core": "Run what the model wrote, hand back the failing test, traceback, or linter message, and let it try again. Execution tells the model what rereading its own code cannot, and repair gains rise and fall with how precise that feedback is.", "reach": "Tests become the verifier in test-time search and the reward in reinforcement fine-tuning; long-running agents depend on them to stay on track.", "uses": "Claude Code and Codex rerunning tests after edits, SWE-agent’s linter rejecting broken edits, AlphaCodium iterating on generated tests, and OpenAI’s harness team writing lint errors as repair instructions for the agent.", "worth": "you let a model write code that runs; coding agents and self-refinement first. Work whose output cannot be executed or checked gains less, and should look at verifiers instead.", "resources": [{"title": "Building a C compiler with a team of parallel Claudes", "url": "https://www.anthropic.com/research/building-c-compiler", "type": "blog", "by": "Nicholas Carlini, Anthropic, 2026", "level": 1, "note": "Sixteen agents and about 2,000 sessions wrote a 100,000-line compiler; a test harness written for the model to read is what kept them going."}, {"title": "Teaching Large Language Models to Self-Debug", "url": "https://arxiv.org/abs/2304.05128", "type": "paper", "by": "Chen, Lin, Schärli, Zhou, Google, 2023", "level": 2}, {"title": "Is Self-Repair a Silver Bullet for Code Generation?", "url": "https://arxiv.org/abs/2306.09896", "type": "paper", "by": "Olausson et al., MIT and Microsoft, 2024", "level": 2, "note": "At equal sample budgets the gains are often modest; better feedback, from GPT-4 or from people, is what raises them."}, {"title": "Code Generation with AlphaCodium: From Prompt Engineering to Flow Engineering", "url": "https://arxiv.org/abs/2401.08500", "type": "paper", "by": "Ridnik, Kredo, Friedman, CodiumAI, 2024", "level": 2, "note": "Iterating on public and model-written tests lifted GPT-4 from 19 to 44 percent pass@5 on CodeContests validation."}, {"title": "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering", "url": "https://arxiv.org/html/2405.15793v3#S3", "type": "section", "by": "Yang et al., Princeton, 2024", "level": 2, "section": "Section 3, SWE-agent: Designing an ACI for Software Engineering", "covers": "The interface SWE-agent gives its model: summarized search, a 100-line file viewer, and an edit command whose linter rejects any edit that introduces a syntax error."}, {"title": "Repair or resample at equal budget", "url": "https://arxiv.org/abs/2306.09896", "type": "project", "by": "Built on Olausson et al., 2024", "level": 2, "build": "Pass rates for repair and for resampling on HumanEval at matched budgets, plus the same loop with feedback written by a stronger model.", "teaches": "When execution feedback beats drawing more samples, and why the quality of the explanation matters more than the retry.", "time": "a weekend", "mode": "Reproduce a result", "task": "Write a loop that runs each HumanEval sample against its unit tests and feeds the error back for one repair, then compare its pass rate with plain resampling at the same number of model calls.", "made": true, "done": "Both curves are plotted at matched budgets up to 20 samples; the paper found 10 GPT-4 samples with 1 repair each reached 1.05 times plain pass@20 on APPS."}]}, {"id": "longhorizon", "title": "Long-running agents: progress files and handoffs", "kind": "concept", "track": "harness", "pre": ["harnessdef", "feedback", "compaction", "memory"], "frontier": true, "core": "A task longer than one context window needs state outside the model: a feature list, a progress file, and git history that each fresh session reads. An initializer sets these up once; each later session finishes one feature, tests it, commits, and updates the notes.", "reach": "Parallel agents coordinate through the same files, git, and lock files; METR’s time horizon tracks how long the tasks agents finish have become.", "uses": "Anthropic’s autonomous coding quickstart and its C compiler run, Cursor’s week-long browser build, Codex runs of six hours or more at OpenAI, and the Ralph loop people leave running overnight. Research agents that run for days can borrow the same progress files.", "worth": "you run agents for hours or across sessions; compaction and memory first. If every task fits in one context window, skip it for now.", "resources": [{"title": "Effective harnesses for long-running agents", "url": "https://www.anthropic.com/research/effective-harnesses-for-long-running-agents", "type": "blog", "by": "Justin Young, Anthropic, 2025", "level": 1, "note": "The initializer and coding agent pattern, and the four failures it fixes, such as declaring victory early and marking untested features done."}, {"title": "Harness design for long-running application development", "url": "https://www.anthropic.com/research/harness-design-long-running-apps", "type": "blog", "by": "Prithvi Rajasekaran, Anthropic, 2026", "level": 2, "note": "A planner, a generator, and a separate evaluator; context resets compared with compaction; and which parts to remove as models improve."}, {"title": "Scaling long-running autonomous coding", "url": "https://cursor.com/blog/scaling-agents", "type": "blog", "by": "Wilson Lin, Cursor, 2026", "level": 2, "note": "Hundreds of agents on one codebase for weeks: locks failed, and a split into planners and workers held up."}, {"title": "Measuring AI Ability to Complete Long Software Tasks", "url": "https://arxiv.org/abs/2503.14499", "type": "paper", "by": "Kwa et al., METR, 2025", "level": 2, "note": "The 50 percent time horizon, which has doubled about every seven months since 2019."}, {"title": "Ralph Wiggum as a “software engineer”", "url": "https://ghuntley.com/ralph/", "type": "blog", "by": "Geoffrey Huntley, 2025", "level": 1, "note": "The smallest long-running harness: the same prompt fed to a coding agent in a bash loop, with a plan file and tests as backpressure."}, {"title": "Autonomous coding quickstart", "url": "https://github.com/anthropics/claude-quickstarts/tree/main/autonomous-coding", "type": "project", "by": "Anthropic, 2025", "level": 2, "build": "A small app built across five fresh context windows, with feature_list.json, claude-progress.txt, init.sh, and git history carrying the work between them.", "teaches": "What a fresh session must read to resume, and how often an agent marks a feature done without really testing it.", "time": "a day", "mode": "Apply it", "task": "Write your own app_spec.txt, cut the initializer’s feature count to about 30, run the two-agent harness for five sessions, then check by hand which features marked passing actually work."}]}, {"id": "sampling", "title": "Sampling many: self-consistency and best-of-n", "kind": "concept", "track": "search", "pre": ["cot"], "frontier": false, "core": "Draw many answers at nonzero temperature and keep one: the most common final answer (self-consistency) or the one a checker scores highest (best-of-n). The chance that some sample is right keeps climbing with samples; majority voting stalls much sooner.", "reach": "Verifiers turn that coverage into accuracy, and pass@k is how coding and agent benchmarks report repeated attempts.", "uses": "Majority voting behind many reported math scores, pass@k on HumanEval and SWE-bench, Codex’s original 100 samples per problem filtered by unit tests, and products that draft several replies and let a check or the user choose.", "worth": "you can afford several calls per query and have some way to compare answers; chain of thought first. Every fancier search method on this track has to beat it.", "resources": [{"title": "Self-Consistency Improves Chain of Thought Reasoning in Language Models", "url": "https://arxiv.org/abs/2203.11171", "type": "paper", "by": "Wang et al., Google, 2023", "level": 1, "note": "A majority vote over 40 sampled reasoning paths added 17.9 points on GSM8K."}, {"title": "Large Language Monkeys: Scaling Inference Compute with Repeated Sampling", "url": "https://arxiv.org/abs/2407.21787", "type": "paper", "by": "Brown, Juravsky, et al., Stanford, 2024", "level": 2, "note": "Coverage grows log-linearly with samples: DeepSeek-Coder-V2 went from 15.9 to 56 percent on SWE-bench Lite with 250 samples."}, {"title": "CodeMonkeys: Scaling Test-Time Compute for Software Engineering", "url": "https://arxiv.org/abs/2501.14723", "type": "paper", "by": "Ehrlich et al., Stanford, 2025", "level": 3, "note": "Serial and parallel sampling combined on SWE-bench Verified, with model-written tests to choose among edits; 57.4 percent for about $2,300."}, {"title": "Evaluating Large Language Models Trained on Code", "url": "https://arxiv.org/abs/2107.03374", "type": "section", "by": "Chen et al., OpenAI, 2021", "level": 2, "section": "Section 2.1, Functional Correctness", "covers": "The pass@k metric and its unbiased estimator from n samples with c correct, with a numerically stable implementation that later sampling papers reuse."}, {"title": "Large Language Monkeys coverage curves", "url": "https://github.com/ScalingIntelligence/large_language_monkeys", "type": "project", "by": "Brown et al., Stanford, 2024", "level": 2, "build": "Coverage and majority-vote curves for k from 1 to 100 on GSM8K, computed with the unbiased pass@k estimator.", "teaches": "How far the best sample runs ahead of the vote, which is the gap a verifier has to close.", "time": "a day", "mode": "Reproduce a result", "task": "Generate 100 samples for each of 200 GSM8K test problems with the repo’s vLLM script and a small instruct model, grade them with its evaluator, then plot coverage and majority-vote accuracy against k."}]}, {"id": "verifiers", "title": "Verifiers at test time", "kind": "concept", "track": "search", "pre": ["sampling"], "frontier": false, "core": "A verifier scores candidate answers so the system can keep the best one. Proof checkers are exact. Unit tests and reward models let some wrong answers through, and those false positives cap what more sampling can buy.", "reach": "Process reward models score each step, which lets tree search prune early; the same verifiers become rewards in reinforcement fine-tuning.", "uses": "Unit tests choosing among a coding agent’s patches, Lean proof checkers in theorem provers, reward models ranking best-of-N math answers, LLM judges in product pipelines, and the same checks reused as rewards when reasoning models are trained.", "worth": "you sample more than once or train with RL; sampling first. If your task has no checkable answer, read the limits paper and put the effort into judges instead.", "resources": [{"title": "Scaling test-time compute with open models", "url": "https://huggingface.co/spaces/HuggingFaceH4/blogpost-scaling-test-time-compute", "type": "blog", "by": "Beeching, Tunstall, Rush, Hugging Face, 2024", "level": 1, "note": "Majority vote, best-of-N, and weighted best-of-N with a process reward model, measured on MATH-500 with a 1B model."}, {"title": "Training Verifiers to Solve Math Word Problems", "url": "https://arxiv.org/abs/2110.14168", "type": "paper", "by": "Cobbe et al., OpenAI, 2021", "level": 2, "note": "The original setup: sample many solutions and let a trained verifier pick one; also the paper that introduced GSM8K."}, {"title": "Let’s Verify Step by Step", "url": "https://arxiv.org/abs/2305.20050", "type": "paper", "by": "Lightman et al., OpenAI, 2023", "level": 2, "note": "Process supervision beats outcome supervision; with a reward model trained on PRM800K’s step labels, best-of-N solves 78 percent of a MATH test subset."}, {"title": "The Limits of Inference Scaling Through Resampling", "url": "https://arxiv.org/abs/2411.17501", "type": "paper", "by": "Stroebl, Kapoor, Narayanan, Princeton, 2024", "level": 2, "note": "Unit tests with gaps let wrong programs through, so the best number of resamples is often under 10."}, {"title": "Generative Verifiers: Reward Modeling as Next-Token Prediction", "url": "https://arxiv.org/abs/2408.15240", "type": "paper", "by": "Zhang et al., Google DeepMind, 2024", "level": 3, "note": "A verifier that reasons before answering yes or no, and can vote over several checks; best-of-N on GSM8K rose from 73 to 93.4 percent."}, {"title": "Search and Learn: best-of-N with a process reward model", "url": "https://github.com/huggingface/search-and-learn", "type": "project", "by": "Beeching, Tunstall, Rush, Hugging Face, 2024", "level": 2, "note": "The authors ran the recipes on 80 GB H100s; lower the batch sizes on smaller GPUs.", "build": "Three accuracy curves against the number of samples for one small model, scored by the default process reward model.", "teaches": "How much a verifier adds over voting at each budget, and where its own errors flatten the curve.", "time": "a weekend", "mode": "Reproduce a result", "task": "Run the repo’s best_of_n recipe for Llama-3.2-1B-Instruct on MATH-500 at n=256, subsample to budgets from 4 to 256, and plot majority vote, best-of-N, and weighted best-of-N."}, {"title": "Measure how false positives cap resampling", "url": "https://arxiv.org/abs/2411.17501", "type": "project", "by": "Built on Stroebl, Kapoor, Narayanan, 2024", "level": 2, "build": "Accuracy and false positive rate against resampling budget for one weak and one strong model on HumanEval.", "teaches": "Why a verifier with gaps sets a ceiling no sample budget can pass, and how to find the budget where accuracy peaks.", "time": "a weekend", "mode": "Reproduce a result", "task": "Resample a weak and a strong code model on HumanEval until a program passes the original tests, then grade every accepted program with EvalPlus’s HumanEval+ tests and plot accuracy against the sample budget.", "made": true, "done": "The weak model’s accepted programs still fail HumanEval+ at every budget, its accuracy stays below the strong model’s single sample, and the best budget is under 10, as the paper reports."}]}, {"id": "selfrefine", "title": "Self-critique and refinement", "kind": "concept", "track": "search", "pre": ["cot"], "frontier": false, "core": "Ask the model to critique its own answer, rewrite it, and repeat. Self-critique helps on open-ended writing and when a check backs it, such as a failing test; on reasoning with no outside signal, models often turn right answers into wrong ones.", "reach": "Execution feedback is the case where the outside signal is a test; textual gradients and GEPA turn critiques into prompt updates.", "uses": "Writing assistants that draft and revise, OpenAI’s Codex reviewing its own changes before a pull request, Anthropic’s separate evaluator agent in long app builds, DSPy’s Refine module, and Reflexion notes that carry lessons between attempts.", "worth": "you are tempted to add a step that asks the model to check its answer; measure it before shipping. Builders with a real test or checker should go straight to execution feedback.", "resources": [{"title": "Self-Refine: Iterative Refinement with Self-Feedback", "url": "https://arxiv.org/abs/2303.17651", "type": "paper", "by": "Madaan et al., CMU, 2023", "level": 1, "note": "One model writes, critiques, and rewrites; about 20 points better on average across 7 tasks, with almost no gain on math."}, {"title": "Large Language Models Cannot Self-Correct Reasoning Yet", "url": "https://arxiv.org/abs/2310.01798", "type": "paper", "by": "Huang et al., Google DeepMind, 2024", "level": 2, "note": "Without outside feedback, two rounds of review dropped GPT-3.5 on CommonSenseQA from 75.8 to 41.8 percent."}, {"title": "Reflexion: Language Agents with Verbal Reinforcement Learning", "url": "https://arxiv.org/abs/2303.11366", "type": "paper", "by": "Shinn et al., 2023", "level": 2, "note": "Reflections grounded in test results or environment rewards, kept in memory across attempts; 91 percent pass@1 on HumanEval."}, {"title": "When Can LLMs Actually Correct Their Own Mistakes? A Critical Survey of Self-Correction of LLMs", "url": "https://arxiv.org/html/2406.01297v3#S7", "type": "section", "by": "Kamoi et al., Penn State, 2024", "level": 2, "section": "Section 7, Summary of Our Analysis", "covers": "When self-correction works: rarely from prompting alone, on tasks where checking is easier than solving, with reliable outside feedback such as code execution, and after fine-tuning on feedback data."}, {"title": "Output Refinement: BestOfN and Refine", "url": "https://dspy.ai/current/tutorials/output_refinement/best-of-n-and-refine/", "type": "project", "by": "DSPy, Stanford NLP, 2026", "level": 1, "build": "One DSPy program wrapped two ways, resampling against a reward and refining with generated feedback, scored on the same questions.", "teaches": "What Refine’s self-written feedback adds over plain resampling when the reward cannot see whether an answer is right.", "time": "an afternoon", "mode": "Code along, then change it", "task": "Type out the tutorial’s BestOfN and Refine examples, then run both on 50 GSM8K questions with a reward that checks only the answer’s format, and score them against the gold answers."}, {"title": "Reproduce intrinsic self-correction on GSM8K and CommonSenseQA", "url": "https://arxiv.org/abs/2310.01798", "type": "project", "by": "Built on Huang et al., 2024", "level": 2, "build": "Accuracy after zero, one, and two review rounds on two datasets, with counts of answers that flipped from right to wrong and from wrong to right.", "teaches": "Why self-review without a check mostly churns answers, and how to tell a real gain from a changed mind.", "time": "a day", "mode": "Reproduce a result", "task": "Answer 200 GSM8K and 200 CommonSenseQA questions with one model, ask it twice to review and revise with the paper’s prompt, and count how many answers flip each way.", "made": true, "done": "Accuracy does not rise after either round on either dataset, as in Table 3, where GPT-3.5 fell from 75.8 to 41.8 percent on CommonSenseQA."}]}, {"id": "treesearch", "title": "Tree search over thoughts and actions", "kind": "concept", "track": "search", "pre": ["verifiers", "agentloop"], "frontier": false, "core": "Treat partial solutions as nodes in a tree: propose several next steps, score each with a value estimate or a real environment, expand the promising ones, and back up from dead ends. Tree of Thoughts lifted GPT-4 on Game of 24 from 4% to 74%.", "reach": "Search over agent actions needs a way back to earlier states, so it depends on environments and sandboxes that can reset.", "uses": "Tree of Thoughts on puzzles, LATS on coding and question answering, best-first search for web agents on VisualWebArena, and beam search over steps scored by process reward models. AlphaGo’s Monte Carlo tree search is the conceptual ancestor.", "worth": "your task has steps you can score or states you can return to, such as puzzles, proofs, or environments that reset; verifiers first. For single-shot chat, skip it.", "resources": [{"title": "Tree of Thoughts: Deliberate Problem Solving with Large Language Models", "url": "https://arxiv.org/abs/2305.10601", "type": "paper", "by": "Yao et al., Princeton and Google DeepMind, 2023", "level": 1}, {"title": "Language Agent Tree Search Unifies Reasoning Acting and Planning in Language Models", "url": "https://arxiv.org/abs/2310.04406", "type": "paper", "by": "Zhou et al., UIUC, 2024", "level": 2, "note": "Monte Carlo tree search over agent actions, with environment feedback and self-reflection; 92.7 percent pass@1 on HumanEval with GPT-4."}, {"title": "Tree Search for Language Model Agents", "url": "https://arxiv.org/abs/2407.01476", "type": "paper", "by": "Koh, McAleer, Fried, Salakhutdinov, CMU, 2024", "level": 2, "note": "Best-first search inside real web environments raised a GPT-4o agent’s VisualWebArena success rate by 39.7 percent, relative."}, {"title": "Tree of Thoughts: Game of 24", "url": "https://github.com/princeton-nlp/tree-of-thought-llm", "type": "project", "by": "Yao et al., Princeton, 2023", "level": 2, "build": "Success rates and costs for chain of thought and breadth-first tree search on the same 100 puzzles.", "teaches": "What tree search buys over sampling at a similar cost, and whether a newer reasoning model still needs it.", "time": "a day", "mode": "Reproduce a result", "task": "Run the repo’s cot_sampling and bfs scripts for Game of 24 on puzzles 900 to 999 with one current model, then compare success rates and token costs with the paper’s 4 and 74 percent."}]}, {"id": "scalingtest", "title": "Scaling test-time compute", "kind": "concept", "track": "search", "pre": ["verifiers", "reasoning"], "frontier": false, "core": "Accuracy rises roughly with the log of inference compute, spent on more samples or longer reasoning. The best split depends on difficulty: revisions suit easy problems, search suits hard ones, and on problems it sometimes solves, a small model can beat one 14 times larger.", "reach": "Reasoning models move most of this compute into one long chain, and thinking budgets set its length per request.", "uses": "Reasoning effort settings in model APIs, s1’s budget forcing, ARC Prize charts that plot score against cost per task, and deciding whether a fixed budget buys a bigger model, more samples, or longer thinking.", "worth": "you set reasoning budgets, pay inference bills, or compare models at matched cost; verifiers and reasoning models first. Teams on a single fixed model and setting can skim it.", "resources": [{"title": "Why We Think", "url": "https://lilianweng.github.io/posts/2025-05-01-thinking/", "type": "blog", "by": "Lilian Weng, 2025", "level": 1, "note": "Parallel sampling, sequential revision, and reasoning trained with RL, in one map of test-time compute."}, {"title": "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters", "url": "https://arxiv.org/abs/2408.03314", "type": "paper", "by": "Snell, Lee, Xu, Kumar, 2024", "level": 2}, {"title": "s1: Simple test-time scaling", "url": "https://arxiv.org/abs/2501.19393", "type": "paper", "by": "Muennighoff et al., Stanford, 2025", "level": 2, "note": "Budget forcing: cut the thinking off, or append Wait to extend it; s1-32B went from 50 to 57 percent on AIME24."}, {"title": "Inference Scaling Laws: An Empirical Analysis of Compute-Optimal Inference for Problem-Solving with Language Models", "url": "https://arxiv.org/abs/2408.00724", "type": "paper", "by": "Wu et al., CMU, 2024", "level": 3, "note": "Compute-optimal inference across model sizes; Llemma-7B with tree search beat Llemma-34B on MATH."}, {"title": "s1: Simple test-time scaling", "url": "https://arxiv.org/html/2501.19393v3#S3", "type": "section", "by": "Muennighoff et al., Stanford, 2025", "level": 2, "section": "Section 3, Test-time scaling", "covers": "Sequential and parallel scaling defined, budget forcing as a cap or a forced Wait, and three measures for any method: control, scaling slope, and best performance."}, {"title": "Thinking budget against majority vote", "url": "https://github.com/simplescaling/s1", "type": "project", "by": "Built on Muennighoff et al., 2025", "level": 2, "build": "Accuracy against total thinking tokens on MATH-500 for sequential budget forcing and for parallel majority vote on one small model.", "teaches": "Where longer thinking beats more samples at the same token cost, and where forcing more Wait tokens stops helping.", "time": "a weekend", "mode": "Reproduce a result", "task": "Adapt the README’s vLLM budget forcing code to a small open reasoning model, sweep thinking budgets on MATH-500, and compare with majority vote over shorter samples at equal total tokens.", "made": true, "done": "Both curves span at least a 4x range of tokens and budget forcing has a positive scaling slope, as in the paper, where it took s1-32B from 50 to 57 percent on AIME24."}]}, {"id": "evosearch", "title": "Evolutionary program search", "kind": "concept", "track": "search", "pre": ["verifiers", "codeact"], "frontier": true, "core": "Keep a population of programs, ask a model to edit the best ones, score each child with an automatic evaluator, and keep the winners. AlphaEvolve’s loop found a way to multiply 4x4 complex matrices with 48 scalar multiplications, one fewer than Strassen’s method.", "reach": "GEPA evolves prompts the same way, the Darwin Gödel Machine evolves agents, and ARC solvers evolve one program per task.", "uses": "AlphaEvolve’s data center scheduler that recovers 0.7% of Google’s compute and its Gemini kernel speedup, FunSearch’s cap sets, OpenEvolve and ShinkaEvolve on math and kernels, and GEPA’s prompt evolution. Any problem with a fast, trusted score fits.", "worth": "you have a problem with an automatic score and room for thousands of model calls; verifiers and code as actions first. Without a reliable evaluator, it optimizes the evaluator’s bugs.", "resources": [{"title": "AlphaEvolve: A Gemini-powered coding agent for designing advanced algorithms", "url": "https://deepmind.google/blog/alphaevolve-a-gemini-powered-coding-agent-for-designing-advanced-algorithms/", "type": "blog", "by": "Google
