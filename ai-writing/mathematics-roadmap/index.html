<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathematics Roadmap</title>
<script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<meta name="description" content="A prerequisite graph of mathematics from proofs to graduate probability, theoretical statistics, analysis, algebra and topology, tiered from lower division to advanced graduate, with verified resources for every idea.">
<style>
/* Layout: a compact header, then the map fills the viewport; a panel slides in from the right
   (a bottom sheet on phones). Colors: the site's paper and ink, plus six track families. */
:root {
  color-scheme: light;
  --paper: #ffffff; --sunk: #f6f5f2; --card: #ffffff;
  --ink: #1b1b1d; --ink-2: #4a4a50; --muted: #70707a; --rule: #e4e3de; --rule-soft: #efeeea;
  --accent: #1a4f8c; --accent-soft: #e6eef8;
  --edge: #b9b8b2; --edge-x: #d8d7d2;
  --f-0: #8a8983; --f-1: #2a78d6; --f-2: #eb6834; --f-3: #1baf7a;
  --f-4: #eda100; --f-5: #e87ba4; --f-6: #008300; --f-7: #6250d6; --f-8: #e34948;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #16161a; --sunk: #1c1c21; --card: #212127;
    --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
    --accent: #7fb2e3; --accent-soft: #1d2b3b;
    --edge: #5d5d66; --edge-x: #3d3d45;
    --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
    --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #16161a; --sunk: #1c1c21; --card: #212127;
  --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
  --accent: #7fb2e3; --accent-soft: #1d2b3b;
  --edge: #5d5d66; --edge-x: #3d3d45;
  --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
  --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }

/* header */
header { flex: none; border-bottom: 1px solid var(--rule); padding-block: .7rem .6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.2rem; align-items: end; }
.crumb { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .25rem; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.25rem, 2.6vw, 1.7rem); line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.lede { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; margin: .3rem 0 0; max-width: 62rem; }
.tools { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.search { position: relative; }
.search input { width: 15rem; max-width: 100%; font: .9rem var(--sans); color: var(--ink); background: var(--sunk); border: 1px solid var(--rule);
  border-radius: 8px; padding: .45rem .7rem; }
.results { position: absolute; right: 0; top: calc(100% + 4px); width: min(24rem, 86vw); max-height: 60vh; overflow: auto; z-index: 40;
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); padding: .3rem; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: .45rem .55rem; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--sunk); }
.results .rt { font-weight: 600; font-size: .88rem; }
.results .rm { font-size: .76rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: .42rem .75rem; font-size: .85rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.tcol { display: flex; flex-direction: column; align-items: flex-end; gap: .45rem; min-width: 0; }
.show { display: inline-flex; align-items: center; gap: .3rem; flex-wrap: wrap; }
.show .sl { font-family: var(--mono); font-size: .66rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: .1rem; }
.show button { font: .78rem var(--sans); color: var(--muted); background: none; border: 1px dashed var(--rule); border-radius: 999px;
  padding: .24rem .6rem; cursor: pointer; white-space: nowrap; }
.show button[aria-pressed="true"] { color: var(--ink); border: 1px solid var(--ink-2); background: var(--sunk); }
.show button[aria-pressed="true"]::before { content: "\2713\00a0"; color: var(--accent); }
.show button:disabled { opacity: .45; cursor: default; }
.totals { font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem .35rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; color: var(--ink-2); background: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: .18rem .55rem; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* map */
main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sunk); touch-action: none; cursor: grab; }
main.dragging { cursor: grabbing; }
main[hidden] { display: none !important; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }
.e { fill: none; stroke: var(--edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.e.x { stroke: var(--edge-x); stroke-width: 1.2; display: none; }
main.all-links .e.x, .e.x.hot { display: inline; }
.e.hot { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.e.dim { opacity: .18; }
.track { position: absolute; z-index: 0; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper); }
.track .tl { position: absolute; left: 14px; top: 9px; display: flex; gap: .45rem; align-items: center;
  font-family: var(--mono); font-size: clamp(11px, calc(9px * var(--inv, 1)), 17px); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
.track .tl .dot { width: 8px; height: 8px; }
.node { position: absolute; z-index: 2; display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--rule);
  border-top: 3px solid var(--c); border-radius: 8px; padding: 5px 8px 6px; cursor: pointer; overflow: hidden;
  box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.node:hover { box-shadow: 0 3px 10px rgb(0 0 0 / .12); border-color: var(--muted); border-top-color: var(--c); }
.node .k { display: flex; justify-content: space-between; gap: 4px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.node .k .fr { color: var(--ink-2); }
.node .t { font-size: 12.5px; font-weight: 600; line-height: 1.22; color: var(--ink); margin-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .p { margin-top: auto; height: 3px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.node .p i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 2px; }
.node.done { background: color-mix(in srgb, var(--c) 9%, var(--card)); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); border-top-color: var(--c); }
.node.anc { border-color: var(--accent); }
.node.dim { opacity: .3; }
.node.hit { box-shadow: 0 0 0 3px var(--accent); }
.zoom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-size: 1.05rem; line-height: 1; }
.zoom button.w { width: auto; padding: 0 .55rem; font-size: .75rem; }
.zoom button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 180px; z-index: 5;
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 6px; cursor: pointer; }
.mini svg { display: block; width: 100%; height: auto; }
.mini .vp { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 18; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 4; font-size: .76rem; color: var(--muted);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .75rem; white-space: nowrap; }

/* track map */
.tview { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--sunk); }
.tview[hidden] { display: none !important; }
.tscroll { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 12px; }
.tsize { margin: auto; position: relative; flex: none; }
.tworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tworld svg.edges { z-index: 1; }
.te { fill: none; stroke: var(--edge); vector-effect: non-scaling-stroke; }
.te.hot { stroke: var(--accent); }
.te.dim { opacity: .2; }
.tnode { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--card);
  border: 1px solid var(--rule); border-top: 4px solid var(--c); border-radius: 10px; padding: 9px 12px 7px; cursor: pointer;
  box-shadow: 0 1px 3px rgb(0 0 0 / .06); transition: opacity .15s, box-shadow .15s; overflow: hidden; }
.tnode:hover { box-shadow: 0 4px 14px rgb(0 0 0 / .13); border-color: var(--muted); border-top-color: var(--c); }
.tnode .tk { display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tnode .tt { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.15; color: var(--ink); }
.tnode .tc { font-family: var(--serif); font-size: 12.5px; line-height: 1.32; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tnode .tf { margin-top: auto; display: flex; align-items: center; gap: .5rem; flex: none; }
.tnode .p { flex: 1; height: 4px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.tnode .tpj { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; line-height: 1; }
.tnode .p i { display: block; height: 100%; width: 0; background: var(--c); }
.tnode.sel { box-shadow: 0 0 0 2px var(--accent); }
.tnode.anc { border-color: var(--accent); border-top-color: var(--c); }
.tnode.dim { opacity: .32; }
.thint { flex: none; margin: 0; padding: .5rem 16px .7rem; text-align: center; font-size: .8rem; color: var(--muted); }
.narrow .tnode { padding: 7px 9px 8px; }
.narrow .tnode .tt { font-size: 14.5px; }
.narrow .tnode .tc { font-size: 11.5px; -webkit-line-clamp: 2; }
.primary { display: inline-flex; align-items: center; gap: .4rem; margin: .2rem 0 .2rem; font-size: .86rem; font-weight: 600; color: var(--paper);
  background: var(--ink); border: 0; border-radius: 8px; padding: .5rem .85rem; cursor: pointer; }
.tlinks { font-size: .86rem; color: var(--ink-2); line-height: 1.5; margin: 0; }
.ideas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.ideas li button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .8rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .55rem .1rem; cursor: pointer; }
.ideas li button:hover { background: var(--sunk); }
.ideas .it { font-weight: 600; font-size: .9rem; }
.ideas .ik { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .35rem; font-weight: 400; }
.ideas .ip { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* list */
.list { flex: 1; min-height: 0; overflow: auto; background: var(--paper); }
.list[hidden] { display: none !important; }
.list .in { max-width: 54rem; margin: 0 auto; padding-block: 1.2rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list h2 { display: flex; gap: .5rem; align-items: center; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; margin: 2rem 0 .4rem; padding-bottom: .45rem; border-bottom: 1px solid var(--rule); }
.list h2:first-child { margin-top: .4rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .75rem .2rem; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row .rt { font-weight: 600; font-size: .98rem; }
.row .rk { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .4rem; font-weight: 400; }
.row .rc { grid-column: 1; font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.row .rp { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* panel */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .25); z-index: 49; }
.scrim[hidden] { display: none !important; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(31rem, 100%); z-index: 50; background: var(--card);
  border-left: 1px solid var(--rule); box-shadow: -12px 0 40px rgb(0 0 0 / .12); overflow: auto; overscroll-behavior: contain;
  padding-block: calc(1.1rem + env(safe-area-inset-top, 0px)) calc(2.5rem + env(safe-area-inset-bottom, 0px));
  padding-left: 1.4rem; padding-right: max(1.4rem, env(safe-area-inset-right, 0px)); }
aside[hidden] { display: none !important; }
.close { position: sticky; top: 0; float: right; width: 32px; height: 32px; margin: -.2rem -.4rem 0 0; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--card); cursor: pointer; font-size: 1.1rem; line-height: 1; z-index: 2; }
.pk { display: flex; flex-wrap: wrap; gap: .35rem .6rem; align-items: center; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.badge { border: 1px solid var(--rule); border-radius: 4px; padding: .05rem .35rem; color: var(--ink-2); }
aside h2 { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1.15; margin: 0 2.2rem .7rem 0; text-wrap: balance; }
.prog { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--c); }
.core { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; margin: 0 0 .6rem; }
.reach { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: 0 0 1.1rem; }
.uses, .worth { font-family: var(--serif); font-size: 1rem; line-height: 1.5; margin: 0 0 .45rem; }
.uses b, .worth b { font-family: var(--mono); font-weight: 500; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: .35rem; }
.worth { margin-bottom: 1rem; }
.row .ru { grid-column: 1 / -1; font-family: var(--serif); font-size: .9rem; color: var(--ink-2); line-height: 1.4; }
.sec { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.3rem 0 .5rem; }
.links { display: flex; flex-wrap: wrap; gap: .35rem; }
.links button { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: .25rem .5rem; cursor: pointer; text-align: left; }
.links button:hover { border-color: var(--muted); }
.links .none { font-size: .85rem; color: var(--muted); }
.path { font-size: .8rem; color: var(--muted); margin: .45rem 0 0; }
.res { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.res li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .1rem .65rem; padding: .7rem 0; border-bottom: 1px solid var(--rule-soft); }
.res input { width: 1.05rem; height: 1.05rem; margin: .2rem 0 0; accent-color: var(--accent); cursor: pointer; }
.res .rn a { font-weight: 600; font-size: .93rem; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.res .rn a:hover { border-bottom-color: var(--accent); }
.res .rb { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
.res .note { font-family: var(--serif); font-size: .9rem; color: var(--ink-2); margin-top: .2rem; line-height: 1.4; }
.res li.ok .rn a { color: var(--muted); }
.lv { align-self: start; font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: .12rem .4rem; white-space: nowrap; }
.lv1 { color: var(--accent); background: var(--accent-soft); }
.lv2 { color: var(--ink-2); background: var(--rule-soft); }
.lv3 { color: var(--paper); background: var(--ink-2); }
.foot { font-size: .8rem; color: var(--muted); margin-top: 1.4rem; line-height: 1.5; }
/* projects: a resource row with a label line and what you build and learn */
.res .pt { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: .2rem; }
.res .pb { font-family: var(--serif); font-size: .92rem; color: var(--ink-2); line-height: 1.42; margin: .25rem 0 0; }
.res .pb b { font-family: var(--mono); font-weight: 500; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: .4rem; }
.res li.psec { border-left: 2px solid var(--rule); padding-left: .55rem; }
.res li.proj { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); border-radius: 6px; padding-left: .45rem; padding-right: .2rem; }
.res .ichip { margin-top: .45rem; }
.row .rk.pj { color: var(--accent); }
.pintro { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: .4rem 0 0; max-width: 46rem; }
.about { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.55; }
.about p { margin: 0 0 .7rem; }

@media (max-width: 720px) {
  header { grid-template-columns: minmax(0, 1fr); }
  .tools { justify-content: flex-start; }
  .tcol { align-items: stretch; }
  .search { flex: 1 1 10rem; }
  .search input { width: 100%; }
  .lede { display: none; }
  .legend { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .mini { display: none; }
  .hint { display: none; }

<script>
const DATA = {"tracks": [{"id": "found", "label": "Proofs and foundations", "family": 0, "core": "Read and write proofs: logic, sets, induction, and calculus done rigorously. Every other track assumes this."}, {"id": "analysis", "label": "Analysis", "family": 1, "core": "Limits made exact: real analysis, metric spaces, measure and integration, functional and harmonic analysis."}, {"id": "algebra", "label": "Algebra", "family": 2, "core": "Structure through symmetry: linear algebra done right, groups, rings, fields, modules, and representations."}, {"id": "combin", "label": "Combinatorics", "family": 7, "core": "Count and construct discrete objects, and prove that some must exist without building them."}, {"id": "prob", "label": "Probability", "family": 4, "core": "Probability as measure theory: limit theorems, martingales, Markov chains, Brownian motion, and concentration."}, {"id": "topology", "label": "Topology and geometry", "family": 3, "core": "Shape without distance and then with it: point-set and algebraic topology, manifolds, and curvature."}, {"id": "dynamics", "label": "Differential equations", "family": 6, "core": "How systems evolve: ODE theory and dynamics, PDEs, and the calculus of variations."}, {"id": "stats", "label": "Theoretical statistics", "family": 5, "core": "What data can and cannot tell you, proved: decision theory, testing, asymptotics, empirical processes, and minimax rates."}, {"id": "applied", "label": "Stochastic processes and information", "family": 8, "core": "Probability as engineers use it at the graduate level: random processes, estimation, information theory, and convex analysis."}], "nodes": [{"id": "logic", "title": "Logic, sets and proof writing", "kind": "concept", "track": "found", "pre": [], "frontier": false, "tier": "lower div", "core": "A proof chains steps, each justified by a definition or an earlier result, and the claim’s logical form sets its shape: to prove “for every x there is a y,” fix an arbitrary x and build y. Negation swaps “for all” with “there exists.”", "reach": "Every other node assumes it; the epsilon-delta arguments of calculus with proofs and real analysis are nested quantifiers handled exactly this way.", "uses": "Reading and writing every proof on this map, and outside it the formal specifications of software verification, type systems, the first-order logic beneath SQL, and proof assistants such as Lean.", "worth": "you plan to read any theory paper or take any upper-division course; nobody on this path skips it.", "resources": [{"title": "Book of Proof (3rd edition)", "url": "https://richardhammack.github.io/BookOfProof/", "type": "book", "by": "Richard Hammack, 2018", "level": 1, "note": "Chapters 4 to 7 and 10 teach direct proof, contrapositive, contradiction, existence proofs, and induction, and Chapter 14 handles countable and uncountable sets."}, {"title": "How to Prove It: A Structured Approach (3rd edition)", "url": "https://www.cambridge.org/highereducation/books/how-to-prove-it/6D2965D625C6836CD4A785A2C843B3DA", "type": "book", "by": "Daniel Velleman, Cambridge, 2019", "level": 2, "note": "Chapter 3 shows how the logical form of a goal, one connective or quantifier at a time, tells you how to start its proof.", "paid": true}, {"title": "Naive Set Theory", "url": "https://link.springer.com/book/10.1007/978-1-4757-1645-0", "type": "book", "by": "Paul Halmos, Springer, 1974", "level": 2, "note": "Sections 15 to 25 cover the axiom of choice, Zorn’s lemma, ordinals, and cardinals, which graduate analysis and algebra use without comment.", "paid": true}, {"title": "Natural Number Game", "url": "https://adam.math.hhu.de/#/g/leanprover-community/nng4", "type": "project", "by": "Kevin Buzzard, Jon Eugster, Lean 4 edition", "level": 1, "build": "Proofs in the Lean theorem prover of the laws of addition, multiplication, powers, and order on the natural numbers, starting from Peano’s axioms and induction.", "teaches": "What a proof is at the level a computer checks it, and induction as an everyday tool.", "time": "a weekend", "signature": true}, {"title": "Set Theory Game", "url": "https://adam.math.hhu.de/#/g/djvelleman/stg4", "type": "project", "by": "Daniel Velleman, Lean 4 game", "level": 1, "build": "Proofs in Lean about subsets, complements, unions, and intersections, including unions and intersections of whole families of sets, one level at a time.", "teaches": "The method of How to Prove It turned into habit: the logical form of each goal decides the first move of its proof.", "time": "a weekend"}]}, {"id": "rigcalc", "title": "Calculus with proofs", "kind": "concept", "track": "found", "pre": ["logic"], "frontier": false, "tier": "lower div", "core": "Calculus rests on one axiom the rationals lack: every nonempty set of reals bounded above has a least upper bound. Over Q, x^2 - 2 changes sign on [1, 2] without a root; completeness makes the intermediate value, extreme value, and mean value theorems true.", "reach": "Completeness becomes Cauchy completeness in real analysis and metric spaces, and later the reason Banach and Hilbert spaces behave.", "uses": "Justifying each limit, derivative, and integral used later: Taylor’s theorem with remainder gives the descent lemma behind gradient descent rates, and the intermediate value theorem guarantees bisection finds a root.", "worth": "real analysis is next for you; this is where calculus facts start needing proofs, a habit every later analysis course assumes.", "resources": [{"title": "Calculus (4th edition)", "url": "https://mathpop.com/products/calculus-4th-edition", "type": "book", "by": "Michael Spivak, Publish or Perish, 2008", "level": 2, "note": "Part II (Foundations), through the chapters Three Hard Theorems and Least Upper Bounds, is the heart, and Part V constructs the real numbers.", "paid": true}, {"title": "MIT 18.014: Calculus with Theory", "url": "https://ocw.mit.edu/courses/18-014-calculus-with-theory-fall-2010/", "type": "course", "by": "Christine Breiner, MIT OpenCourseWare, 2010", "level": 2, "note": "Free problem sets, exams, and James Munkres’s course notes, paced against Apostol’s Calculus, Volume 1."}, {"title": "Real Analysis, The Game", "url": "https://adam.math.hhu.de/#/g/AlexKontorovich/RealAnalysisGame", "type": "project", "by": "Alex Kontorovich, Rutgers Math 311H, 2025", "level": 2, "note": "Lecture notes and videos for the course are at alexkontorovich.github.io/2025F311H.", "build": "Lean proofs of the algebraic limit theorems, Cauchy sequences, Bolzano-Weierstrass, series and rearrangements, function limits, uniform continuity and convergence, and swapping limits with integrals.", "teaches": "Where completeness enters each theorem of calculus, because Lean accepts no limit until you name every epsilon and N yourself.", "time": "a term"}]}, {"id": "realanalysis", "title": "Real analysis (Math 104)", "kind": "concept", "track": "analysis", "pre": ["logic", "rigcalc"], "frontier": false, "tier": "upper div", "core": "Limits do not always commute: a pointwise limit of continuous functions can jump, and integrals need not converge to the integral of the limit. Uniform convergence restores the swap, and compactness (bounded sequences have convergent subsequences) turns local bounds into global ones.", "reach": "Metric spaces generalize compactness; measure theory is the fix when uniform convergence is too much to ask.", "uses": "Knowing when limits, sums, derivatives, and integrals may be swapped, as when differentiating under an expectation for policy gradients, plus the compactness and fixed-point arguments inside optimization and learning theory proofs.", "worth": "graduate probability, statistics, or theory papers are the goal; it is the gateway course, and reading statements cannot replace doing its proofs.", "resources": [{"title": "MIT 18.100A: Real Analysis", "url": "https://ocw.mit.edu/courses/18-100a-real-analysis-fall-2020/", "type": "course", "by": "Casey Rodriguez, MIT OpenCourseWare, 2020", "level": 1, "note": "Recorded lectures and full notes on sequences and series, continuity, the Riemann integral, and interchanging limits, the material of Berkeley’s Math 104."}, {"title": "Understanding Analysis (2nd edition)", "url": "https://link.springer.com/book/10.1007/978-1-4939-2712-8", "type": "book", "by": "Stephen Abbott, Springer, 2015", "level": 1, "note": "Chapters 1 to 7, the most readable rigorous treatment, with Chapter 6 on sequences and series of functions.", "paid": true}, {"title": "Analysis I (4th edition)", "url": "https://link.springer.com/book/10.1007/978-981-19-7261-4", "type": "book", "by": "Terence Tao, Springer, 2022", "level": 2, "note": "Chapters 2 to 5 build the natural numbers, integers, rationals, and reals from axioms, the step other texts assume.", "paid": true}, {"title": "Principles of Mathematical Analysis (3rd edition)", "url": "https://www.mheducation.co.in/principles-of-mathematical-analysis-9789355325969-india", "type": "book", "by": "Walter Rudin, McGraw Hill, 1976", "level": 3, "note": "Chapters 1 to 7, terse and complete, with exercises that carry much of the content.", "paid": true}, {"title": "A Lean companion to Analysis I", "url": "https://github.com/teorth/analysis", "type": "project", "by": "Terence Tao, 2025", "level": 2, "note": "A web version is at teorth.github.io/analysis.", "build": "Lean proofs of the exercises Tao leaves open in chapters 2 to 11 of Analysis I: the number systems, the reals as Cauchy sequences, limits, series, continuity, derivatives, and the integral.", "teaches": "Every quantifier made explicit, so a proof is finished only when Lean accepts it.", "time": "a term", "signature": true}]}, {"id": "metric", "title": "Metric spaces and the topology of R^n", "kind": "concept", "track": "analysis", "pre": ["realanalysis"], "frontier": false, "tier": "upper div", "core": "Convergence, continuity, and compactness need only a distance, so one set of proofs covers R^n, sequences, and spaces of functions. Closed and bounded means compact in R^n but not in infinite dimensions, where compact means complete and totally bounded.", "reach": "Leads to point-set topology, Lebesgue measure, and the function spaces of functional analysis.", "uses": "Treating functions, distributions, and policies as points in a space: the contraction mapping theorem proves value iteration converges, and Wasserstein and total variation distances compare probability distributions.", "worth": "you take real analysis seriously; it is often part of Math 104, and measure theory, topology, and functional analysis all start here.", "resources": [{"title": "Basic Analysis I: Introduction to Real Analysis, Volume I", "url": "https://www.jirka.org/ra/", "type": "book", "by": "Jiří Lebl, version 6.3, 2026", "level": 1, "note": "Chapter 7 (Metric Spaces) redoes limits, continuity, and compactness for a general distance."}, {"title": "Principles of Mathematical Analysis (3rd edition)", "url": "https://www.mheducation.co.in/principles-of-mathematical-analysis-9789355325969-india", "type": "book", "by": "Walter Rudin, McGraw Hill, 1976", "level": 2, "note": "Chapter 2 (Basic Topology) and Chapter 4 (Continuity) treat compact and connected sets and continuous maps in metric spaces.", "paid": true}, {"title": "Real Analysis: Lectures by Professor Francis Su", "url": "https://www.youtube.com/playlist?list=PL0E754696F72137EC", "type": "lectures", "by": "Francis Su, Harvey Mudd College, 2010", "level": 1, "note": "Lectures 8 to 12 cover metric spaces, open and closed sets, and compactness alongside Rudin’s Chapter 2."}, {"title": "Mathematics in Lean, Chapter 11: Topology", "url": "https://leanprover-community.github.io/mathematics_in_lean/C11_Topology.html", "type": "project", "by": "Avigad, Massot", "level": 2, "build": "Lean proofs about limits through filters, then balls, continuity, compactness, and completeness in metric spaces, then the same notions in general topological spaces, written against Mathlib.", "teaches": "How one notion, the filter, states every kind of limit, and what compactness and completeness arguments look like with nothing left implicit.", "time": "a week"}, {"title": "Fractals as fixed points of a contraction", "url": "https://maths-people.anu.edu.au/~john/Assets/Research%20Papers/fractals_self-similarity.pdf", "type": "project", "by": "Built on Hutchinson, 1981", "level": 2, "build": "Code that applies a finite set of contractions to compact sets in the plane again and again, tracks the Hausdorff distance between iterates, and estimates the limit set’s dimension by box counting.", "teaches": "The contraction mapping theorem in a complete space whose points are sets, and why the attractor exists, is unique, and is reached from any start.", "time": "a weekend", "made": true, "done": "Box counting on the generalised Cantor sets of Section 3.3 matches their dimension log 2 / log(1/r) within 0.02 for every r from 0.1 to 0.45."}]}, {"id": "severalvar", "title": "Analysis in several variables", "kind": "concept", "track": "analysis", "pre": ["metric", "linalg"], "frontier": false, "tier": "upper div", "core": "The derivative of a map from R^n to R^m is the linear map that best approximates it at a point. When that linear map is invertible, so is the function nearby (inverse function theorem); implicit functions, Lagrange multipliers, and change of variables follow.", "reach": "Manifolds are spaces where this local linear picture is all you have; curves and surfaces apply it in R^3.", "uses": "Lagrange multipliers, the change of variables formula behind normalizing flows, the implicit function theorem behind implicit differentiation in deep equilibrium models and bilevel optimization, and Jacobians throughout backpropagation.", "worth": "theory papers with Jacobians and constraints are ahead, or manifolds are; applied researchers can take the statements from multivariable calculus.", "resources": [{"title": "Basic Analysis II: Introduction to Real Analysis, Volume II", "url": "https://www.jirka.org/ra/", "type": "book", "by": "Jiří Lebl, version 6.3, 2026", "level": 1, "note": "Chapter 8 defines the derivative as a linear map and proves the inverse and implicit function theorems (Section 8.5), and Chapter 10 builds the multivariable integral through change of variables."}, {"title": "Calculus on Manifolds", "url": "https://www.routledge.com/Calculus-On-Manifolds-A-Modern-Approach-To-Classical-Theorems-Of-Advanced-Calculus/Spivak/p/book/9780805390216", "type": "book", "by": "Michael Spivak, 1965 (CRC Press)", "level": 2, "note": "Chapters 2 and 3 (differentiation, integration) are the course in brief, and Chapters 4 and 5 add forms and Stokes’ theorem.", "paid": true}, {"title": "Vector Calculus, Linear Algebra, and Differential Forms: A Unified Approach (5th edition)", "url": "https://matrixeditions.com/5thUnifiedApproach.html", "type": "book", "by": "John Hubbard, Barbara Burke Hubbard, Matrix Editions, 2015", "level": 1, "note": "Longer and gentler, it proves the main theorems with effective algorithms such as Newton’s method, so each proof is also a computation.", "paid": true}, {"title": "Mathematics in Lean, Chapter 12: Differential Calculus", "url": "https://leanprover-community.github.io/mathematics_in_lean/C12_Differential_Calculus.html", "type": "project", "by": "Avigad, Massot", "level": 2, "build": "Lean proofs about derivatives of real functions, then normed spaces, continuous linear maps, the Banach-Steinhaus theorem, and Fréchet derivatives, ending with the statement of the inverse function theorem.", "teaches": "The derivative as a continuous linear map between normed spaces, stated so precisely that a computer checks every use of it.", "time": "a week"}]}, {"id": "complex", "title": "Complex analysis (Math 185)", "kind": "concept", "track": "analysis", "pre": ["realanalysis"], "frontier": false, "tier": "upper div", "core": "Complex differentiability is a rigid constraint: it forces the integral around every closed loop in a simply connected region to vanish (Cauchy’s theorem). So values on a circle determine the function inside, every such function equals its power series, and real integrals reduce to residues.", "reach": "Contour integrals drive Fourier analysis, analytic combinatorics, and Stieltjes transforms in random matrix theory.", "uses": "Evaluating real integrals by residues, Laplace and z-transforms in control and signal processing, conformal maps for two-dimensional fluid flow, asymptotic counting in analytic combinatorics, and Stieltjes transforms in random matrix theory.", "worth": "Fourier analysis, random matrices, or analytic number theory is ahead; for most ML work, the residue theorem and a few examples suffice.", "resources": [{"title": "A First Course in Complex Analysis", "url": "https://matthbeck.github.io/complex.html", "type": "book", "by": "Beck, Marchesi, Pixton, Sabalka, edition 1.6, 2025", "level": 1, "note": "Chapters 2, 4, 5, 8, and 9 cover complex derivatives, Cauchy’s theorem and its consequences, Laurent series, and residues, the material of Berkeley’s Math 185."}, {"title": "Visual Complex Analysis", "url": "http://usf.usfca.edu/vca/", "type": "book", "by": "Tristan Needham, Oxford, 1997 (25th anniversary edition, 2023)", "level": 1, "note": "Chapter 4 (the amplitwist) and Chapters 7 to 9 (winding numbers, Cauchy’s theorem and formula) show in pictures why the theorems are true.", "paid": true}, {"title": "Complex Analysis (Princeton Lectures in Analysis II)", "url": "https://press.princeton.edu/books/hardcover/9780691113852/complex-analysis", "type": "book", "by": "Elias Stein, Rami Shakarchi, Princeton, 2003", "level": 2, "note": "Chapters 1 to 3 are the core course, Chapter 4 applies it to the Fourier transform, and Chapter 8 covers conformal maps.", "paid": true}, {"title": "Count the zeros of the zeta function", "url": "https://www-users.cse.umn.edu/~odlyzko/zeta_tables/index.html", "type": "project", "by": "Built on Odlyzko’s tables of zeta zeros", "level": 2, "build": "Code that integrates the logarithmic derivative of the zeta function around rectangles in the critical strip with mpmath, counts the zeros inside, and locates each by Newton’s method.", "teaches": "Contour integration as a computation: the argument principle turns counting zeros into a winding number you can evaluate and trust.", "time": "a weekend", "made": true, "done": "The contour count gives 29 zeros with imaginary part between 0 and 100, and the first sits at 14.134725142, matching Odlyzko’s table of the first 100,000 zeros."}]}, {"id": "measure", "title": "Measure theory and integration (Math 202A)", "kind": "concept", "track": "analysis", "pre": ["metric"], "frontier": false, "tier": "graduate", "core": "Riemann integration breaks under limits: indicators of the first n rationals in [0, 1] each integrate to 0, but their limit, the indicator of Q, has no Riemann integral. Measuring sets with countable additivity fixes this, and limits pass through integrals (monotone and dominated convergence).", "reach": "Measure-theoretic probability is this subject with total mass one; L^p spaces open functional analysis.", "uses": "Rigorous probability: densities as Radon-Nikodym derivatives, KL divergence between any two distributions, and dominated convergence, which justifies differentiating under an expectation in score-function gradients and variational inference.", "worth": "you aim for Stat 205A, Stat 210A, or theory papers, which all assume it; applied researchers can skip it.", "resources": [{"title": "Measure, Integration & Real Analysis", "url": "https://measure.axler.net/", "type": "book", "by": "Sheldon Axler, Springer, 2020 (free, revised 2026)", "level": 1, "note": "Section 1B shows where the Riemann integral fails, and Chapters 2 and 3 build Lebesgue measure and the convergence theorems; the Berkeley course is Math 202A."}, {"title": "An Introduction to Measure Theory", "url": "https://terrytao.wordpress.com/books/an-introduction-to-measure-theory/", "type": "book", "by": "Terence Tao, AMS, 2011", "level": 2, "note": "Section 1.1 poses the problem of measure through Jordan measure, and Sections 1.2 to 1.5 build Lebesgue measure, the integral, abstract measure spaces, and modes of convergence."}, {"title": "Real Analysis: Modern Techniques and Their Applications (2nd edition)", "url": "https://www.wiley.com/en-us/Real+Analysis%3A+Modern+Techniques+and+Their+Applications%2C+2nd+Edition-p-9780471317166", "type": "book", "by": "Gerald Folland, Wiley, 1999", "level": 3, "note": "Chapters 1 to 3 and 6 (measures, integration, signed measures and differentiation, L^p) at qualifying exam density.", "paid": true}, {"title": "Formalising Mathematics, Section 13: Measure Theory", "url": "https://github.com/ImperialCollegeLondon/formalising-mathematics-2024/tree/main/FormalisingMathematics2024/Section13measureTheory", "type": "project", "by": "Kevin Buzzard, Imperial College London, 2024", "level": 2, "build": "Lean proofs that given families of sets are sigma-algebras, identities in the extended nonnegative reals, and basic facts about measures, measurable functions, and integrals in Mathlib.", "teaches": "Why measure theory takes values in [0, ∞] and measures only measurable sets, through edge cases such as 0 times ∞ that a proof assistant will not let you skip.", "time": "a weekend"}]}, {"id": "functional", "title": "Functional analysis (Math 202B)", "kind": "concept", "track": "analysis", "pre": ["measure", "linalg"], "frontier": false, "tier": "graduate", "core": "Linear algebra in infinite dimensions breaks two ways: the unit ball is not compact, and linear maps need not be continuous. Completeness plus Baire category gives uniform boundedness and open mapping, Hahn-Banach supplies functionals, and compact operators keep the spectral theorem.", "reach": "The language of PDE, the calculus of variations, kernel methods, and the empirical processes of statistics.", "uses": "Reproducing kernel Hilbert spaces behind kernel methods and Gaussian processes, the neural tangent kernel view of wide networks, existence proofs for PDE solutions, and the Hilbert spaces of quantum mechanics.", "worth": "learning theory, PDE, or kernel methods research is your direction; otherwise, Hilbert space basics and the spectral theorem for compact operators cover most needs.", "resources": [{"title": "MIT 18.102: Introduction to Functional Analysis", "url": "https://ocw.mit.edu/courses/18-102-introduction-to-functional-analysis-spring-2021/", "type": "course", "by": "Casey Rodriguez, MIT OpenCourseWare, 2021", "level": 1, "note": "Recorded lectures and notes on normed spaces, Hahn-Banach, L^p, Hilbert spaces, and the spectral theorem for compact self-adjoint operators; the Berkeley course is Math 202B."}, {"title": "Measure, Integration & Real Analysis", "url": "https://measure.axler.net/", "type": "book", "by": "Sheldon Axler, Springer, 2020 (free, revised 2026)", "level": 2, "note": "Chapters 6 to 8 and 10 cover Banach spaces and the consequences of Baire’s theorem, L^p, Hilbert spaces, and compact operators with their spectral theorem."}, {"title": "Functional Analysis, Sobolev Spaces and Partial Differential Equations", "url": "https://link.springer.com/book/10.1007/978-0-387-70914-7", "type": "book", "by": "Haim Brezis, Springer, 2011", "level": 3, "note": "Chapters 1 to 6 are the core (Hahn-Banach, uniform boundedness, weak topologies, L^p, Hilbert spaces, compact operators), and Chapters 8 and 9 recast elliptic PDEs as Hilbert space problems.", "paid": true}, {"title": "Fredholm determinants by quadrature", "url": "https://arxiv.org/abs/0804.2543", "type": "project", "by": "Built on Bornemann, 2010", "level": 3, "build": "A Nyström discretization of the sine kernel operator on L^2(0, s) with Gauss-Legendre points, giving its eigenvalues and the Fredholm determinant det(I - A_s) from small matrices.", "teaches": "Why compact operators behave like matrices: their eigenvalues decay fast, finite sections converge to them, and the determinant of I minus the operator makes sense.", "time": "a weekend", "made": true, "done": "Five Gauss-Legendre points give E2(0; 0.1) = 0.900027271798259 to 15 digits, as in the paper’s introduction, and the error falls exponentially as points are added."}]}, {"id": "fourier", "title": "Fourier and harmonic analysis", "kind": "concept", "track": "analysis", "pre": ["measure", "complex"], "frontier": false, "tier": "graduate", "core": "Complex exponentials are eigenfunctions of every translation-invariant linear operator, so the Fourier transform turns convolution and differentiation into multiplication. Plancherel says it preserves L^2 norms, and the uncertainty principle says a function and its transform cannot both be concentrated.", "reach": "Characteristic functions in the central limit theorem, sampling, Roth’s theorem, and nonabelian groups through representations.", "uses": "The FFT, signal and image processing, MRI reconstruction from Fourier samples, cosine transforms inside JPEG and MP3, the characteristic-function proof of the central limit theorem, random Fourier features, and sinusoidal positional encodings.", "worth": "your work touches signals, PDE, limit theorems, or additive combinatorics; for applied ML, the discrete transform and the convolution theorem are enough.", "resources": [{"title": "EE261: The Fourier Transform and its Applications", "url": "https://see.stanford.edu/Course/EE261", "type": "course", "by": "Brad Osgood, Stanford Engineering Everywhere, 2007", "level": 1, "note": "Recorded lectures plus a book of notes whose Chapters 1 to 5 cover Fourier series, the transform, convolution, distributions, and sampling."}, {"title": "Fourier Analysis: An Introduction (Princeton Lectures in Analysis I)", "url": "https://press.princeton.edu/books/hardcover/9780691113845/fourier-analysis", "type": "book", "by": "Elias Stein, Rami Shakarchi, Princeton, 2003", "level": 2, "note": "Chapters 2 to 6 prove convergence of Fourier series and develop the transform on R and R^d, and Chapter 7 does Fourier analysis on finite groups.", "paid": true}, {"title": "Classical Fourier Analysis (3rd edition)", "url": "https://link.springer.com/book/10.1007/978-1-4939-1194-3", "type": "book", "by": "Loukas Grafakos, Springer, 2014", "level": 3, "note": "Chapters 1, 2, 5, and 6 (interpolation, maximal functions, singular integrals, Littlewood-Paley theory) are the core of graduate harmonic analysis.", "paid": true}, {"title": "Think DSP, Chapters 7 to 10", "url": "https://github.com/AllenDowney/ThinkDSP", "type": "project", "by": "Allen Downey, Green Tea Press, 2016", "level": 1, "note": "Each chapter’s exercises are notebooks in nb/, with solutions beside them.", "build": "A fast Fourier transform written by hand, convolution through the DFT, differentiation and integration as filters, and a recording passed through a room’s measured impulse response.", "teaches": "Why every linear, shift-invariant system is multiplication in frequency, seen on real sound, and where circular and linear convolution differ.", "time": "a week"}]}, {"id": "ot", "title": "Optimal transport", "kind": "concept", "track": "analysis", "pre": ["measure", "convexanalysis"], "frontier": false, "tier": "advanced", "core": "Move one distribution onto another at least total cost. Kantorovich relaxes maps to couplings, giving a linear program with a dual over potentials; for squared distance the optimal map is the gradient of a convex function (Brenier), and the optimal cost is the Wasserstein distance.", "reach": "Wasserstein gradient flows recast diffusion equations; entropic transport gives Sinkhorn’s algorithm and couplings for generative models.", "uses": "Wasserstein GANs, optimal-transport paths in flow matching, single-cell trajectory inference in biology, domain adaptation, Sinkhorn-based matching in vision, and matching markets in economics.", "worth": "you work on generative models or comparing distributions; the Kantorovich problem, its dual, and Sinkhorn are learnable without the full regularity theory.", "resources": [{"title": "Computational Optimal Transport", "url": "https://arxiv.org/abs/1803.00567", "type": "book", "by": "Gabriel Peyré, Marco Cuturi, 2019", "level": 1, "note": "Chapter 2 sets up Monge, Kantorovich, and duality on discrete measures, and Chapter 4 adds entropic regularization and Sinkhorn’s algorithm."}, {"title": "Optimal Transport for Applied Mathematicians", "url": "https://link.springer.com/book/10.1007/978-3-319-20828-2", "type": "book", "by": "Filippo Santambrogio, Birkhäuser, 2015", "level": 2, "note": "Chapter 1 (primal and dual problems), Chapter 5 (Wasserstein distances and curves), and Chapter 8 (gradient flows).", "paid": true}, {"title": "Topics in Optimal Transportation", "url": "https://www.ams.org/gsm/058", "type": "book", "by": "Cédric Villani, AMS, 2003", "level": 3, "note": "The graduate classic on Kantorovich duality, Brenier’s theorem, Wasserstein geometry, and displacement convexity.", "paid": true}, {"title": "Wasserstein GAN", "url": "https://arxiv.org/html/1701.07875v3#S2", "type": "section", "by": "Arjovsky, Chintala, Bottou, 2017", "level": 1, "section": "Section 2, Different Distances", "covers": "Total variation, KL, Jensen-Shannon, and earth mover’s distance side by side, and a two-line example where only the Wasserstein distance shrinks continuously as one distribution slides onto another."}, {"title": "Numerical Tours: Entropic Optimal Transport", "url": "https://www.numerical-tours.com/python/optimaltransp_5_entropic/", "type": "project", "by": "Gabriel Peyré, Numerical Tours", "level": 2, "build": "Sinkhorn’s algorithm for entropic transport between point clouds and between histograms, the coupling at several values of epsilon, and Wasserstein barycenters of several histograms.", "teaches": "How the entropic penalty turns a linear program into alternating rescalings of one kernel matrix, and how epsilon trades sharpness for speed.", "time": "a day"}]}, {"id": "linalg", "title": "Linear algebra done right (Math 110)", "kind": "concept", "track": "algebra", "pre": ["logic"], "frontier": false, "tier": "upper div", "core": "A matrix is a linear map written in a chosen basis, and what matters (rank, eigenvalues, diagonalizability) belongs to the map. Self-adjoint operators have an orthonormal eigenbasis (spectral theorem), and the singular value decomposition gives every map orthonormal bases that it simply stretches.", "reach": "Feeds matrix analysis, modules, representations, Markov chains, and the spectral theorems of functional analysis.", "uses": "Nearly everything numerical: PCA and the SVD, least squares, every neural network layer, PageRank’s eigenvector, quantum mechanics, linear control systems, and low-rank fine-tuning such as LoRA.", "worth": "you do anything quantitative; no one on this path can skip it, and the proof-based version pays off in every graduate course.", "resources": [{"title": "Interactive Linear Algebra", "url": "https://textbooks.math.gatech.edu/ila/", "type": "book", "by": "Dan Margalit, Joseph Rabinoff, Georgia Tech, 2019", "level": 1, "note": "Chapters 3 and 5 picture matrices as transformations and eigenvectors as the directions they stretch, with figures you can drag."}, {"title": "Linear Algebra Done Right (4th edition)", "url": "https://linear.axler.net/", "type": "book", "by": "Sheldon Axler, Springer, 2024 (open access)", "level": 2, "note": "Chapters 1 to 3 and 5 to 7, ending with the spectral theorem and, in Section 7E, the singular value decomposition; the Berkeley course is Math 110."}, {"title": "Finite-Dimensional Vector Spaces", "url": "https://link.springer.com/book/10.1007/978-1-4612-6387-6", "type": "book", "by": "Paul Halmos, Springer, 1974", "level": 3, "note": "Basis-free and written with infinite dimensions in mind, with Chapter 4 (Analysis) on norms and convergence of operators.", "paid": true}, {"title": "Mathematics in Lean, Chapter 10: Linear Algebra", "url": "https://leanprover-community.github.io/mathematics_in_lean/C10_Linear_Algebra.html", "type": "project", "by": "Avigad, Massot", "level": 2, "build": "Lean proofs about vector spaces and linear maps, subspaces and quotients, endomorphisms, eigenvalues and eigenvectors, and matrices, bases, and dimension, written against Mathlib.", "teaches": "The basis-free view of linear algebra made exact, and which arguments need coordinates and which never do.", "time": "a week"}, {"title": "Computational Linear Algebra for Coders", "url": "https://github.com/fastai/numerical-linear-algebra", "type": "project", "by": "Rachel Thomas, fast.ai and University of San Francisco, 2017", "level": 2, "build": "Notebooks that apply the SVD and NMF to topic modeling, randomized SVD and robust PCA to video, the power method to PageRank, and a QR factorization written by hand.", "teaches": "What decompositions cost in time, memory, and accuracy once matrices are large, which proofs about them never mention.", "time": "two weeks"}]}, {"id": "matrix", "title": "Matrix analysis and spectral theory", "kind": "concept", "track": "algebra", "pre": ["linalg", "realanalysis"], "frontier": false, "tier": "graduate", "core": "Eigenvalues of a symmetric matrix are optimization problems: the kth largest is the max over k-dimensional subspaces of the min of the Rayleigh quotient (Courant-Fischer). Interlacing and Weyl’s bound, that eigenvalues move at most the operator norm of a perturbation, follow in a few lines.", "reach": "The workhorse of concentration, random matrices, spectral graph theory, and PCA in high dimensions.", "uses": "Perturbation bounds for PCA and spectral clustering, conditioning of linear solvers, gradient descent rates set by Hessian eigenvalues, best low-rank approximation (Eckart-Young), and matrix concentration inequalities.", "worth": "you will prove things about PCA, spectral methods, or optimization; Courant-Fischer, Weyl, and Davis-Kahan cover most of what papers cite.", "resources": [{"title": "254A, Notes 3a: Eigenvalues and sums of Hermitian matrices", "url": "https://terrytao.wordpress.com/2010/01/12/254a-notes-3a-eigenvalues-and-sums-of-hermitian-matrices/", "type": "notes", "by": "Terence Tao, 2010", "level": 2, "note": "Courant-Fischer, then the Weyl, Wielandt-Hoffman, and Lidskii inequalities, each derived from the minimax formula."}, {"title": "Matrix Analysis (2nd edition)", "url": "https://www.cambridge.org/highereducation/books/matrix-analysis/FDA3627DC2B9F5C3DF2FD8C3CC136B48", "type": "book", "by": "Roger Horn, Charles Johnson, Cambridge, 2012", "level": 2, "note": "Chapters 4 to 8 cover Hermitian matrices, norms, eigenvalue location and perturbation, positive semidefinite matrices, and nonnegative matrices (Perron-Frobenius).", "paid": true}, {"title": "Matrix Analysis", "url": "https://link.springer.com/book/10.1007/978-1-4612-0653-8", "type": "book", "by": "Rajendra Bhatia, Springer, 1997", "level": 3, "note": "Chapter 3 (variational principles), Chapter 4 (symmetric norms), and Chapter 7 (perturbation of spectral subspaces).", "paid": true}, {"title": "Eigenvalue inequalities, tested", "url": "https://terrytao.wordpress.com/2010/01/12/254a-notes-3a-eigenvalues-and-sums-of-hermitian-matrices/", "type": "project", "by": "Built on Tao, 2010", "level": 2, "build": "Code that tests Courant-Fischer, Weyl, Cauchy interlacing, and Wielandt-Hoffman on random symmetric and Hermitian matrices, then measures how often two eigenvalues nearly collide.", "teaches": "Why eigenvalues move no more than the perturbation’s norm, and why they repel: a repeated eigenvalue costs two or three dimensions.", "time": "a weekend", "made": true, "done": "The chance that the smallest eigenvalue gap falls below δ scales like δ^2 for real symmetric and δ^3 for Hermitian matrices, the codimensions 2 and 3 of Exercise 10."}]}, {"id": "groups", "title": "Groups (Math 113)", "kind": "concept", "track": "algebra", "pre": ["logic"], "frontier": false, "tier": "upper div", "core": "A group abstracts the symmetries of an object: composition, identity, and inverses. Studying it through its actions (orbit size times stabilizer size equals the group’s order) and its homomorphisms (the image is the group modulo the kernel) yields Lagrange’s theorem, Sylow’s theorems, and small-group classifications.", "reach": "Rings and Galois theory, number theory, representations, fundamental groups, and Lie groups build on it.", "uses": "Describing symmetry: crystal structures, particle physics, the Rubik’s cube, Diffie-Hellman and elliptic curve cryptography, error-correcting codes, and equivariant neural networks that build rotation or permutation symmetry into the architecture.", "worth": "representation theory, topology, number theory, or equivariant deep learning is ahead; it is also the classic first course in abstract proof.", "resources": [{"title": "Abstract Algebra: Theory and Applications", "url": "https://judsonbooks.org/abstract-algebra-theory-and-applications/", "type": "book", "by": "Thomas Judson, 2024 edition", "level": 1, "note": "Chapters 3 to 6 and 9 to 11 (groups, cosets, Lagrange, quotients, homomorphisms), then 14 and 15 (group actions, Sylow); the Berkeley course is Math 113."}, {"title": "Algebra (2nd edition)", "url": "https://www.pearson.com/en-us/subject-catalog/p/algebra-classic-version/P200000006078", "type": "book", "by": "Michael Artin, Pearson, 2011", "level": 2, "note": "Chapters 2, 6, and 7 study groups through matrices and geometric symmetry.", "paid": true}, {"title": "Abstract Algebra (3rd edition)", "url": "https://www.wiley.com/en-us/Abstract+Algebra%2C+3rd+Edition-p-9780471433347", "type": "book", "by": "David Dummit, Richard Foote, Wiley, 2003", "level": 2, "note": "Part I (Chapters 1 to 6) is the standard reference, and its exercises are where fluency comes from.", "paid": true}, {"title": "Group Equivariant Convolutional Networks", "url": "https://arxiv.org/html/1602.07576v3#S4", "type": "section", "by": "Taco Cohen, Max Welling, 2016", "level": 1, "section": "Section 4, Mathematical Framework", "covers": "A group as the symmetries of an object, worked on grid translations and the wallpaper groups p4 and p4m as integer matrices, and a group’s action on functions, which composes as a homomorphism."}, {"title": "Mathematics in Lean, Chapter 9: Groups and Rings", "url": "https://leanprover-community.github.io/mathematics_in_lean/C09_Groups_and_Rings.html", "type": "project", "by": "Avigad, Massot", "level": 2, "build": "Lean proofs about monoids, groups, subgroups, quotients, group actions, rings, ideals, and polynomials, written against Mathlib.", "teaches": "How algebraic structures are built as hierarchies in a proof assistant, and how Mathlib states their theorems.", "time": "a week", "signature": true}, {"title": "The order of the Rubik’s cube group", "url": "https://www.cube20.org/", "type": "project", "by": "Built on Rokicki, Kociemba, Davidson, Dethridge (cube20.org)", "level": 2, "build": "The cube’s six face turns as permutations of its 48 moving facelets, and the Schreier-Sims algorithm, written from scratch, that computes the group’s order and tests membership.", "teaches": "Orbit-stabilizer as an algorithm: a chain of stabilizers turns a group too large to list into a product of orbit sizes.", "time": "a weekend", "made": true, "done": "Schreier-Sims returns 43,252,003,274,489,856,000, the count of cube positions on cube20.org, and rejects a single flipped edge as unreachable."}]}, {"id": "rings", "title": "Rings, fields and Galois theory", "kind": "concept", "track": "algebra", "pre": ["groups"], "frontier": false, "tier": "upper div", "core": "Galois theory turns questions about a polynomial’s roots into questions about a finite group, the root symmetries that respect arithmetic. Subfields match subgroups, and a polynomial is solvable by radicals exactly when its group is solvable; S_5 is not, so no quintic formula exists.", "reach": "Ideals and quotient rings set up modules and algebraic geometry; finite fields underlie coding and cryptography.", "uses": "Reed-Solomon codes in QR codes and storage, AES arithmetic over a finite field, polynomial identity testing, and impossibility proofs: no formula for the quintic, no angle trisection by ruler and compass.", "worth": "you move toward algebra, cryptography, or coding theory; on an analysis and probability path, finite fields and ideals are the parts that matter.", "resources": [{"title": "Abstract Algebra: Theory and Applications", "url": "https://judsonbooks.org/abstract-algebra-theory-and-applications/", "type": "book", "by": "Thomas Judson, 2024 edition", "level": 1, "note": "Chapters 16 to 18 (rings, polynomials, integral domains), then 21 to 23 (fields, finite fields, Galois theory)."}, {"title": "Abstract Algebra (3rd edition)", "url": "https://www.wiley.com/en-us/Abstract+Algebra%2C+3rd+Edition-p-9780471433347", "type": "book", "by": "David Dummit, Richard Foote, Wiley, 2003", "level": 2, "note": "Chapters 7 to 9 (rings, PIDs and UFDs, polynomial rings), then 13 and 14 (field theory and Galois theory, through solvability of the quintic).", "paid": true}, {"title": "Fields and Galois Theory", "url": "https://www.jmilne.org/math/CourseNotes/ft.html", "type": "notes", "by": "James Milne, version 5.10, 2022", "level": 3, "note": "Chapter 3 proves the fundamental theorem, and Chapters 4 and 5 compute Galois groups and apply them."}, {"title": "Galois groups from factoring mod p", "url": "https://kconrad.math.uconn.edu/blurbs/galoistheory/galoisSnAn.pdf", "type": "project", "by": "Built on Conrad, Recognizing Galois Groups S_n and A_n", "level": 2, "build": "Code that factors an integer polynomial modulo many primes, collects the cycle types Dedekind’s theorem places in its Galois group, and decides whether that group is S_n or A_n.", "teaches": "That a Galois group can be read off arithmetic: each prime hands you one permutation of the roots, and a few of them pin down the group.", "time": "a weekend", "made": true, "done": "For X^7 - X - 1, the first prime giving one quadratic and five linear factors is 191, as in Example 2.4, and about 1/7 of primes leave it irreducible."}]}, {"id": "numtheory", "title": "Number theory (Math 115)", "kind": "concept", "track": "algebra", "pre": ["groups"], "frontier": false, "tier": "upper div", "core": "The integers mod n form a ring whose units form a group, so Fermat’s little theorem is Lagrange’s theorem in disguise. Quadratic reciprocity links whether p is a square mod q to whether q is one mod p; Euler’s theorem makes RSA work.", "reach": "Leads to algebraic number theory and finite fields, additive problems, and analytic methods built on complex analysis.", "uses": "RSA and Diffie-Hellman key exchange, Miller-Rabin primality testing, universal hashing with arithmetic mod a prime, check digits on ISBNs and credit cards, and a supply of problems that sharpen proof technique.", "worth": "it draws you, or cryptography does; on a probability and statistics path it is optional, and modular arithmetic plus Fermat’s theorem suffice.", "resources": [{"title": "Elementary Number Theory: Primes, Congruences, and Secrets", "url": "https://wstein.org/ent/", "type": "book", "by": "William Stein, Springer, 2009 (free, revised 2017)", "level": 1, "note": "Chapters 1 to 4 cover primes, the ring Z/nZ, public key cryptography, and two proofs of quadratic reciprocity; the Berkeley course is Math 115."}, {"title": "A Classical Introduction to Modern Number Theory (2nd edition)", "url": "https://link.springer.com/book/10.1007/978-1-4757-2103-4", "type": "book", "by": "Kenneth Ireland, Michael Rosen, Springer, 1990", "level": 2, "note": "Chapters 1 to 8 run from unique factorization through quadratic reciprocity, Gauss sums, and finite fields, and Chapter 12 starts algebraic number theory.", "paid": true}, {"title": "A Computational Introduction to Number Theory and Algebra (2nd edition)", "url": "https://shoup.net/ntb/", "type": "book", "by": "Victor Shoup, Cambridge, 2008", "level": 2, "note": "Free from the author: number theory with algorithms and running times, plus the discrete probability that cryptography needs."}, {"title": "Cryptopals, Set 5", "url": "https://cryptopals.com/sets/5", "type": "project", "by": "NCC Group, the Cryptopals Crypto Challenges", "level": 2, "build": "Diffie-Hellman, Secure Remote Password, and RSA written from scratch with your own modular inverse, then broken, ending with the e = 3 broadcast attack through the Chinese remainder theorem.", "teaches": "Euler’s theorem and the Chinese remainder theorem as working tools, and how a weak parameter choice turns them into an attack.", "time": "a week"}, {"title": "Formalising Mathematics, Section 15: Number Theory", "url": "https://github.com/ImperialCollegeLondon/formalising-mathematics-2024/tree/main/FormalisingMathematics2024/Section15numberTheory", "type": "project", "by": "Kevin Buzzard, Imperial College London, 2024", "level": 2, "build": "Lean solutions to problems from Sierpinski’s book of 250 number theory problems, such as 13 dividing 2^70 + 3^70, then a proof that -1 is a square mod p when p is 1 mod 4.", "teaches": "Congruence arguments written so a machine checks them, and how much bookkeeping hides inside the words “reduce mod p.”", "time": "a weekend"}]}, {"id": "modules", "title": "Modules and multilinear algebra (Math 250A)", "kind": "concept", "track": "algebra", "pre": ["rings", "linalg"], "frontier": false, "tier": "graduate", "core": "A module is a vector space whose scalars come from a ring. One structure theorem for finitely generated modules over a principal ideal domain classifies finite abelian groups (over Z) and gives Jordan form (over k[x]); tensor products turn bilinear maps into linear ones.", "reach": "The language of commutative algebra, of representations as modules over group algebras, and of homology.", "uses": "Jordan and rational canonical forms, the classification of finite abelian groups, tensor products behind tensor decompositions and quantum states, exterior algebra for determinants and differential forms, and persistence modules in topological data analysis.", "worth": "algebraic geometry, algebraic topology, or representation theory is ahead; a statistics path needs only tensor products and the structure theorem’s statement.", "resources": [{"title": "Basic Algebra (digital second edition)", "url": "https://www.math.stonybrook.edu/~aknapp/download.html", "type": "book", "by": "Anthony Knapp, 2016", "level": 2, "note": "Chapter VI (multilinear algebra and tensor products) and Chapter VIII (commutative rings and their modules); the Berkeley course is Math 250A."}, {"title": "Abstract Algebra (3rd edition)", "url": "https://www.wiley.com/en-us/Abstract+Algebra%2C+3rd+Edition-p-9780471433347", "type": "book", "by": "David Dummit, Richard Foote, Wiley, 2003", "level": 2, "note": "Chapters 10 to 12 build modules and prove the structure theorem over a PID, deriving the rational and Jordan canonical forms.", "paid": true}, {"title": "Tensor Products", "url": "https://kconrad.math.uconn.edu/blurbs/linmultialg/tensorprod.pdf", "type": "notes", "by": "Keith Conrad, 2025", "level": 2, "note": "Sections 2 to 5 build the tensor product from bilinear maps and compute it in many examples."}, {"title": "Algebra: Chapter 0", "url": "https://www.ams.org/gsm/104", "type": "book", "by": "Paolo Aluffi, AMS, 2009", "level": 3, "note": "Groups, rings, and modules in the language of categories and universal properties.", "paid": true}, {"title": "Smith normal form, two ways", "url": "https://oeis.org/A000688", "type": "project", "by": "Built on OEIS A000688", "level": 2, "build": "Smith normal form over the integers and over Q[x], used to name the abelian group a presentation defines and to read a matrix’s rational canonical form off xI - A.", "teaches": "One algorithm, row and column operations over a principal ideal domain, behind both the classification of finite abelian groups and Jordan form.", "time": "a weekend", "made": true, "done": "Listing invariant factor chains reproduces OEIS A000688 for every order up to 1,000, including the 11 abelian groups of order 64."}]}, {"id": "rep", "title": "Representation theory", "kind": "concept", "track": "algebra", "pre": ["groups", "linalg"], "frontier": false, "tier": "graduate", "core": "Represent a group by matrices. Over C every finite-dimensional representation of a finite group splits into irreducibles, and characters (traces) are orthonormal, so a character determines its representation and the irreducibles number the conjugacy classes. For abelian groups this is the Fourier transform.", "reach": "Fourier analysis on groups, mixing times of random walks on groups, and the representations of Lie groups.", "uses": "Fourier analysis on nonabelian groups, mixing times of card shuffles and other random walks on groups, selection rules in quantum mechanics and chemistry, and equivariant networks for molecules and materials.", "worth": "you work on equivariant learning, quantum physics, or probability on groups; others can wait until Lie groups or harmonic analysis calls for it.", "resources": [{"title": "Representation Theory (lecture notes)", "url": "https://math.berkeley.edu/~teleman/math/RepThry.pdf", "type": "notes", "by": "Constantin Teleman, 2005", "level": 1, "note": "Schur’s lemma and character orthogonality for finite groups, then the compact groups U(1) and SU(2), where Fourier series appear as a special case."}, {"title": "Linear Representations of Finite Groups", "url": "https://link.springer.com/book/10.1007/978-1-4684-9458-7", "type": "book", "by": "Jean-Pierre Serre, Springer, 1977", "level": 2, "note": "Chapters 1 to 3 give the character theory of finite groups over C, and Chapter 4 extends it to compact groups.", "paid": true}, {"title": "Representation Theory: A First Course", "url": "https://link.springer.com/book/10.1007/978-1-4612-0979-9", "type": "book", "by": "William Fulton, Joe Harris, Springer, 1991", "level": 2, "note": "Lectures 1 to 4 cover finite groups, characters, induced representations, and the symmetric group through Young diagrams.", "paid": true}, {"title": "Group Representations in Probability and Statistics", "url": "https://projecteuclid.org/ebooks/lnms/Group-representations-in-probability-and-statistics/eISBN-/10.1214/lnms/1215467407", "type": "book", "by": "Persi Diaconis, IMS Lecture Notes, 1988", "level": 3, "note": "Fourier analysis on groups used to bound how fast card shuffles and other random walks mix, and to analyze ranked data."}, {"title": "Theoretical Aspects of Group Equivariant Neural Networks", "url": "https://arxiv.org/html/2004.05154v2#S2", "type": "section", "by": "Carlos Esteves, 2020", "level": 2, "section": "Section 2, Group representation theory", "covers": "Groups, cosets, and homogeneous spaces, then representations, irreducibles, Maschke’s theorem, characters, and induced representations, with SO(3) acting on the sphere as the running example, in the notation equivariant network papers use."}, {"title": "Formalising Mathematics, Section 20: Representation Theory", "url": "https://github.com/ImperialCollegeLondon/formalising-mathematics-2024/tree/main/FormalisingMathematics2024/Section20representationTheory", "type": "project", "by": "Kevin Buzzard, Imperial College London, 2024", "level": 3, "build": "Lean definitions and proofs about representations of a group on a vector space, maps between them, representations as modules over the group algebra, and the category of representations.", "teaches": "The three equivalent languages for a representation, and how a proof moves between linear maps, modules, and categories.", "time": "a weekend"}, {"title": "Random transpositions, solved with characters", "url": "https://arxiv.org/abs/1905.08514", "type": "project", "by": "Built on Teyssier, 2020", "level": 3, "build": "Characters of S_n from the Murnaghan-Nakayama rule, used to compute exactly how far the random transposition shuffle is from uniform after each step, for n up to about 20.", "teaches": "Why characters diagonalize any walk whose step is constant on conjugacy classes, with one eigenvalue per irreducible representation setting the mixing time.", "time": "a weekend", "made": true, "done": "Distance to uniform falls from near 1 to near 0 around (1/2) n log n steps, and at (1/2) n log n + cn steps approaches the Poisson limit of Theorem 1.1."}]}, {"id": "commalg", "title": "Commutative algebra and algebraic geometry", "kind": "concept", "track": "algebra", "pre": ["modules"], "frontier": false, "tier": "advanced", "core": "Polynomial equations and ideals describe the same objects: Hilbert’s Nullstellensatz matches solution sets over an algebraically closed field with radical ideals, and points with maximal ideals. So dimension, smoothness, and intersections become statements about rings and their modules.", "reach": "Gröbner bases make the dictionary computable; it underlies algebraic statistics and sum of squares methods in optimization.", "uses": "Solving polynomial systems with Gröbner bases in robot kinematics and camera pose estimation, sum of squares certificates in optimization, algebraic statistics for contingency tables, and the elliptic curves of modern cryptography.", "worth": "you head toward algebraic statistics, polynomial optimization, or pure algebra; for the probability and statistics checkpoints, it is safely skipped.", "resources": [{"title": "Commutative Algebra (class notes)", "url": "https://agag-gathmann.math.rptu.de/en/commalg.php", "type": "notes", "by": "Andreas Gathmann, RPTU Kaiserslautern, 2013 (revised 2026)", "level": 1, "note": "Chapter 0 explains how polynomial solution sets turn geometry into ring theory, and Chapter 10 proves Noether normalization and the Nullstellensatz."}, {"title": "Ideals, Varieties, and Algorithms (4th edition)", "url": "https://link.springer.com/book/10.1007/978-3-319-16721-3", "type": "book", "by": "David Cox, John Little, Donal O’Shea, Springer, 2015", "level": 1, "note": "Chapters 1 to 4: Gröbner bases make ideals computable, and Chapter 4 is the algebra-geometry dictionary.", "paid": true}, {"title": "Introduction to Commutative Algebra", "url": "https://www.routledge.com/Introduction-To-Commutative-Algebra/Atiyah/p/book/9780201407518", "type": "book", "by": "Michael Atiyah, Ian Macdonald, 1969 (CRC Press)", "level": 2, "note": "Chapters 1 to 7 and 11 (dimension theory), where the exercises carry much of the theory.", "paid": true}, {"title": "The Rising Sea: Foundations of Algebraic Geometry", "url": "https://math.stanford.edu/~vakil/216blog/", "type": "book", "by": "Ravi Vakil, Princeton, free notes of 2025", "level": 3, "note": "Schemes from the start, and the free notes match the published book’s content closely."}, {"title": "Hilbert’s Nullstellensatz and an Algorithm for Proving Combinatorial Infeasibility", "url": "https://arxiv.org/html/0801.3788v1#S2", "type": "section", "by": "De Loera, Lee, Malkin, Margulies, 2008", "level": 1, "section": "Section 2, The Nullstellensatz Linear Algebra (NulLA) Algorithm", "covers": "The weak Nullstellensatz as a certificate, a polynomial combination of the equations that equals 1, and how fixing the certificate’s degree turns the search for one into a linear system, with a worked example."}, {"title": "Formalising Mathematics, Section 16: Commutative Algebra", "url": "https://github.com/ImperialCollegeLondon/formalising-mathematics-2024/tree/main/FormalisingMathematics2024/Section16commutativeAlgebra", "type": "project", "by": "Kevin Buzzard, Imperial College London, 2024", "level": 3, "build": "Lean proofs from Keith Conrad’s notes on Noetherian rings: a surjective ring map from a Noetherian ring to itself is injective, and the start of the Hilbert basis theorem.", "teaches": "What finite generation of ideals buys, and how a proof by smallest counterexample is set up when every step must be explicit.", "time": "a weekend"}, {"title": "Prove a graph is not 3-colorable with the Nullstellensatz", "url": "https://arxiv.org/abs/0801.3788", "type": "project", "by": "Built on De Loera, Lee, Malkin, Margulies, 2008", "level": 3, "build": "Graph 3-coloring written as polynomial equations over GF(2), and a search for degree-one Nullstellensatz certificates by solving one sparse linear system per graph.", "teaches": "The Nullstellensatz as an algorithm: no common zero means 1 lies in the ideal, and a low-degree certificate is found with linear algebra.", "time": "a weekend", "made": true, "done": "Odd wheels and the (8, 3)-Kneser graph get degree-one certificates, the Kneser graph’s from a system with 15,737 rows, as in Table 1 of the paper."}]}, {"id": "graphtheory", "title": "Graph theory", "kind": "concept", "track": "combin", "pre": ["logic"], "frontier": false, "tier": "upper div", "core": "Many graph theorems are min-max dualities: the most disjoint paths between two vertex sets equals the fewest vertices separating them (Menger), and in bipartite graphs the largest matching equals the smallest vertex cover (König). Max-flow min-cut and LP duality are the same idea.", "reach": "Random graphs, extremal problems, random walks and mixing, and spectral clustering through the graph Laplacian.", "uses": "Network flows for routing, scheduling, and image segmentation, matching for assignment problems and kidney exchange, spectral clustering, PageRank, and graph neural networks over molecules and social networks.", "worth": "networks, algorithms, or combinatorics are in your work; Menger, König, and max-flow min-cut take a few weeks and repay them quickly.", "resources": [{"title": "Graph Theory (6th edition)", "url": "https://diestel-graph-theory.com/", "type": "book", "by": "Reinhard Diestel, Springer, 2025", "level": 2, "note
