"https://stat210a.berkeley.edu/fall-2026/homework/homework5.pdf", "type": "project", "by": "Will Fithian, Berkeley, Fall 2026", "level": 2, "build": "Ridge regression as a posterior mean, proofs that unique Bayes estimators are admissible, Bayes rules under other losses, and the Jeffreys prior derived from KL balls.", "teaches": "How a prior and a loss turn into an estimator, and why Bayes rules are admissible, worked through rather than read.", "time": "a week"}]}, {"id": "asymptotics", "title": "Asymptotic statistics (Stat 210B)", "kind": "concept", "track": "stats", "pre": ["testing", "martingales"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "Most estimators are smooth functions of averages, so the CLT, a Taylor expansion (the delta method), and Slutsky’s lemma make them asymptotically normal. An M-estimator is consistent when its criterion converges uniformly, and √n(θ̂ - θ) ≈ -V^-1 n^(-1/2) Σ ψ(X_i), a sum again.", "reach": "Local asymptotic normality makes every smooth model look locally like a Gaussian shift, which gives efficiency bounds; empirical process theory makes the uniform step rigorous.", "uses": "Standard errors and confidence intervals for nearly any estimator, the delta method, justification for the bootstrap, efficiency comparisons, and large-sample guarantees for maximum likelihood and M-estimation in econometrics and ML.", "worth": "statistical theory is the goal or you must defend uncertainty estimates; the delta method and M-estimator asymptotics serve applied researchers too.", "resources": [{"title": "Stat 210B: Theoretical Statistics (Spring 2013)", "url": "https://www.stat.berkeley.edu/~bartlett/courses/2013spring-stat210b/", "type": "notes", "by": "Peter Bartlett, Berkeley, 2013", "level": 2, "note": "Lecture notes 15, 16, and 21 to 23: M-estimators, the delta method, contiguity, and local asymptotic normality, each keyed to van der Vaart’s chapters."}, {"title": "Asymptotic Statistics", "url": "https://www.cambridge.org/core/books/asymptotic-statistics/A3C7DAD3F7E66A1FA60E9C8FE132EE1D", "type": "book", "by": "A. W. van der Vaart, Cambridge, 1998", "level": 2, "note": "Chapters 2, 3, 5, 7, and 8: stochastic convergence, the delta method, M- and Z-estimators, local asymptotic normality, and efficiency.", "paid": true}, {"title": "MIT 18.655: Mathematical Statistics", "url": "https://ocw.mit.edu/courses/18-655-mathematical-statistics-spring-2016/", "type": "course", "by": "Peter Kempthorne, MIT OCW, 2016", "level": 1, "note": "Lecture notes 14 to 18: convergence, limit theorems, consistency and the delta method, limiting distributions, and large-sample tests."}, {"title": "Stat 210A Homework 11: asymptotics of estimators", "url": "https://stat210a.berkeley.edu/fall-2026/homework/homework11.pdf", "type": "project", "by": "Will Fithian, Berkeley, Fall 2026", "level": 2, "build": "Limiting distributions for an adaptive precision-weighted average, several MLEs, and U-statistics through Hájek projection, plus a super-efficient estimator whose worst-case risk blows up.", "teaches": "The delta method, Slutsky’s lemma, and projection onto sums as working tools, and why pointwise efficiency can mislead.", "time": "a week"}]}, {"id": "empirical", "title": "Empirical processes and uniform laws (Stat 210B)", "kind": "concept", "track": "stats", "pre": ["asymptotics", "concentration"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "Pointwise laws of large numbers need not hold uniformly over a rich class, because some function fits the sample’s noise. Symmetrization bounds the gap sup|P_n f - Pf| by a Rademacher average over the sample alone, which VC dimension or chained covering numbers control.", "reach": "Gives consistency and rates for M-estimators in asymptotics, generalization bounds in learning theory, and Donsker theorems for the bootstrap and goodness of fit.", "uses": "Generalization bounds in learning theory through VC dimension and Rademacher complexity, consistency of M-estimators, bootstrap validity, and the Kolmogorov-Smirnov and related goodness-of-fit tests.", "worth": "you will read or write learning theory; symmetrization, Rademacher complexity, and VC bounds are the core, and chaining can come later.", "resources": [{"title": "STAT 210B: Theoretical Statistics, Lecture Notes", "url": "https://www.stat.berkeley.edu/~zhivotovskiy/Stat210BLectureNotes.pdf", "type": "notes", "by": "Nikita Zhivotovskiy, Berkeley, 2026", "level": 2, "note": "Chapters 8 to 10: chaining, then empirical processes, symmetrization, VC classes, and bracketing, as Berkeley’s 210B taught them in Spring 2026."}, {"title": "High-Dimensional Statistics: A Non-Asymptotic Viewpoint", "url": "https://www.cambridge.org/core/books/highdimensional-statistics/8A91ECEEC38F46DAB53E9FF8757C7A4E", "type": "book", "by": "Martin Wainwright, Cambridge, 2019", "level": 2, "note": "Chapters 4 and 5: uniform laws through Rademacher complexity, then metric entropy and chaining.", "paid": true}, {"title": "MIT 18.465: Topics in Statistics: Statistical Learning Theory", "url": "https://ocw.mit.edu/courses/18-465-topics-in-statistics-statistical-learning-theory-spring-2007/", "type": "course", "by": "Dmitry Panchenko, MIT OCW, 2007", "level": 2, "note": "Lecture notes 8 to 16: VC classes, symmetrization, covering numbers, chaining, and Dudley’s entropy integral."}, {"title": "Weak Convergence and Empirical Processes: With Applications to Statistics", "url": "https://link.springer.com/book/10.1007/978-3-031-29040-4", "type": "book", "by": "Aad van der Vaart, Jon Wellner, 2nd edition, Springer, 2023", "level": 3, "note": "Part 2: Glivenko-Cantelli and Donsker theorems under uniform and bracketing entropy, with the measurability details.", "paid": true}, {"title": "The DKW inequality against simulation", "url": "https://www.stat.berkeley.edu/~zhivotovskiy/Stat210BLectureNotes.pdf", "type": "project", "by": "Built on Zhivotovskiy’s Stat 210B notes, 2026", "level": 1, "build": "Empirical distribution functions of n uniform samples for n from 10 to 10,000, their sup distance to the true one, and its quantiles against the sharp DKW band.", "teaches": "A uniform law of large numbers you can measure, and the gap between a sharp constant and a general VC bound for the same class.", "time": "an afternoon", "made": true, "done": "The 95th percentile of √n sup|Fn - F| stays below √(log(40)/2) = 1.358, Remark 9.20 with δ = 0.05, at every n, and approaches it as n grows."}]}, {"id": "highdim", "title": "High-dimensional statistics", "kind": "concept", "track": "stats", "pre": ["empirical", "convexanalysis"], "frontier": false, "tier": "advanced", "core": "With more parameters than samples, estimation needs structure. If the true vector is s-sparse, the lasso’s error is of order σ√(s log(p)/n): it lies in a cone where the design is strongly convex (restricted eigenvalues), and log p pays for a union bound over coordinates.", "reach": "The same template, a decomposable regularizer plus restricted strong convexity, covers low-rank matrices and graphical models; minimax shows the rates cannot be beaten.", "uses": "Sparse regression in genomics, compressed sensing for faster MRI, matrix completion for recommender systems, sparse covariance and graphical model estimation, and theory for regression with more parameters than samples.", "worth": "statistical learning theory, sparse modeling, or genomics is your area; the lasso analysis is a template worth knowing even if you stop there.", "resources": [{"title": "High-Dimensional Statistics", "url": "https://arxiv.org/abs/2310.19244", "type": "notes", "by": "Philippe Rigollet, Jan-Christian Hütter, MIT 18.S997, 2023", "level": 1, "note": "Chapters 1 to 3: sub-Gaussian tools, then least squares and the lasso in high dimensions, and oracle inequalities."}, {"title": "High-Dimensional Statistics: A Non-Asymptotic Viewpoint", "url": "https://www.cambridge.org/core/books/highdimensional-statistics/8A91ECEEC38F46DAB53E9FF8757C7A4E", "type": "book", "by": "Martin Wainwright, Cambridge, 2019", "level": 2, "note": "Chapters 7 to 9: sparse linear models, high-dimensional PCA, and the decomposability and restricted strong convexity framework.", "paid": true}, {"title": "Statistics for High-Dimensional Data: Methods, Theory and Applications", "url": "https://link.springer.com/book/10.1007/978-3-642-20192-9", "type": "book", "by": "Peter Bühlmann, Sara van de Geer, Springer, 2011", "level": 3, "note": "Chapters 2, 6, and 7: the lasso, its oracle inequalities under compatibility conditions, and variable selection.", "paid": true}, {"title": "A Unified Framework for High-Dimensional Analysis of M-Estimators with Decomposable Regularizers", "url": "https://arxiv.org/html/1010.2731v3#S2", "type": "section", "by": "Negahban, Ravikumar, Wainwright, Yu, 2012", "level": 2, "section": "Section 2, Problem Formulation and Some Key Properties", "covers": "Why the lasso’s error vector lies in a cone, drawn in a figure, and why restricted strong convexity on that cone is all the curvature a problem with more parameters than samples needs."}, {"title": "The lasso’s fast rate, measured", "url": "https://arxiv.org/abs/2310.19244", "type": "project", "by": "Built on Rigollet and Hütter, High-Dimensional Statistics, 2023", "level": 2, "build": "Lasso fits on Gaussian designs with k-sparse truths, sweeping n, d, and k, with squared error compared against kσ² log(2d)/n.", "teaches": "Why the error pays only log d for searching among d coordinates, what sparsity buys, and how conservative the theorem’s tuning parameter is next to cross-validation.", "time": "a day", "made": true, "done": "With 2τ = 8σ√(log(2d)/n), the first term in Theorem 2.18, squared error divided by kσ² log(2d)/n stays roughly flat while n, d, and k each vary tenfold."}]}, {"id": "minimax", "title": "Nonparametric estimation and minimax lower bounds", "kind": "concept", "track": "stats", "pre": ["empirical", "infotheory"], "frontier": false, "tier": "advanced", "core": "To show no estimator beats a rate, pick parameters far apart in loss whose data distributions are close in KL divergence. An accurate estimator would then be a test telling them apart, which is impossible; Le Cam’s method uses two such points, Fano’s many.", "reach": "Matched with kernel or projection estimators, it proves nonparametric rates such as n^(-2β/(2β+d)) optimal for β-smooth functions in d dimensions.", "uses": "Proving no method beats a rate in density estimation, nonparametric regression, bandits, differential privacy, and active learning, which tells researchers when to stop looking for a better algorithm.", "worth": "you write theory papers that claim optimality; for others, knowing what Le Cam and Fano say and what rates mean is enough.", "resources": [{"title": "High-Dimensional Statistics", "url": "https://arxiv.org/abs/2310.19244", "type": "notes", "by": "Philippe Rigollet, Jan-Christian Hütter, MIT 18.S997, 2023", "level": 1, "note": "Chapter 4: reduction to testing, two-point and many-point lower bounds, and their use in the Gaussian sequence model and sparse estimation."}, {"title": "Introduction to Nonparametric Estimation", "url": "https://link.springer.com/book/10.1007/b13794", "type": "book", "by": "Alexandre Tsybakov, Springer, 2009", "level": 2, "note": "Chapter 1 builds kernel and projection estimators and their rates; Chapter 2 proves the matching lower bounds.", "paid": true}, {"title": "Lecture Notes on Statistics and Information Theory", "url": "https://web.stanford.edu/class/stats311/lecture-notes.pdf", "type": "notes", "by": "John Duchi, Stanford Stats 311, 2023", "level": 2, "note": "Chapter 8: the Le Cam, Fano, and Assouad methods with worked examples."}, {"title": "Information Theory: From Coding to Learning", "url": "https://people.lids.mit.edu/yp/homepage/data/itbook-export.pdf", "type": "book", "by": "Yury Polyanskiy, Yihong Wu, Cambridge, 2025", "level": 3, "note": "Part VI (Chapters 28 to 32): decision theory, the mutual information method, reduction to hypothesis testing, and entropic bounds."}, {"title": "Local Privacy, Data Processing Inequalities, and Statistical Minimax Rates", "url": "https://arxiv.org/html/1302.3203v4#S2", "type": "section", "by": "Duchi, Jordan, Wainwright, 2013", "level": 2, "section": "Section 2, Background and problem formulation", "covers": "Minimax risk, the reduction from estimation to a multiway test over a packing, and the Le Cam, Fano, and Assouad bounds on that test’s error, in two pages."}, {"title": "Sandwich the binomial minimax risk", "url": "https://stat210a.berkeley.edu/fall-2026/reader/minimax-estimation.html", "type": "project", "by": "Built on Fithian’s Stat 210A reader, 2026", "level": 2, "build": "Exact risk functions for estimating a coin’s bias: the sample mean, the minimax rule (X + √n/2)/(n + √n), and Bayes risks of two-point priors as Le Cam style lower bounds.", "teaches": "How lower bounds come from priors, why two points already give the right 1/n rate, and how much of the constant they lose.", "time": "an afternoon", "made": true, "done": "Two-point Bayes risks and the sample mean’s worst risk 1/(4n) bracket the reader’s exact minimax risk n/(4(n+√n)²) at every n from 16 to 10,000."}]}, {"id": "randproc", "title": "Random processes in systems (EE 226A)", "kind": "concept", "track": "applied", "pre": ["probug", "linalg"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "Zero-mean random variables with finite variance form a Hilbert space whose inner product is covariance. Best linear estimation is orthogonal projection there, and for a wide-sense stationary process the Fourier transform diagonalizes the covariance: a linear filter multiplies the power spectral density by |H(f)|^2.", "reach": "Estimation theory builds the Wiener and Kalman filters on this projection; EE 226B adds martingales, queueing networks, and stochastic calculus.", "uses": "Wiener and Kalman filtering, spectral analysis of signals, noise in communication and control systems, linear prediction in speech coding, and the Hilbert space view of least squares estimation.", "worth": "signals, time series, or control are your work; as the EE 226A checkpoint, it gives the projection view of estimation that statistics shares.", "resources": [{"title": "Probability in Electrical Engineering and Computer Science: An Application-Driven Course", "url": "https://link.springer.com/book/10.1007/978-3-030-49995-2", "type": "book", "by": "Jean Walrand, Springer, 2021, open access", "level": 1, "note": "Berkeley’s EECS 126 text; each topic has an A chapter and a B chapter that proves it, such as 5 and 6 on queues and continuous time Markov chains."}, {"title": "Random Processes for Engineers", "url": "https://hajek.ece.illinois.edu/ECE534Notes.html", "type": "book", "by": "Bruce Hajek, Cambridge, 2015, free preproduction copy", "level": 2, "note": "Chapters 2, 4, 7, and 8: convergence, random processes and Markov models, mean square calculus, and spectral analysis of linear systems."}, {"title": "MIT 6.262: Discrete Stochastic Processes", "url": "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/", "type": "course", "by": "Robert Gallager, MIT OCW, 2011", "level": 2, "note": "Video lectures and Gallager’s course text: Poisson processes, renewal theory, and Markov chains and processes in Chapters 2 to 6."}, {"title": "EE 226A: Random Processes in Systems", "url": "https://www2.eecs.berkeley.edu/Courses/EE226A/", "type": "course", "by": "Berkeley EECS catalog", "level": 2, "note": "Catalog topics: convergence, stationary processes and spectra, Wiener and Kalman filters, Markov, Poisson, and birth and death processes, queues, and detection; the current text is Thomas Courtade’s draft, given to enrolled students."}, {"title": "A Wiener filter, simulated", "url": "https://hajek.ece.illinois.edu/ECE534Notes.html", "type": "project", "by": "Built on Hajek, Random Processes for Engineers, 2015", "level": 2, "build": "Simulated signal and noise processes with covariances e^(-|τ|)/2 and e^(-2|τ|), the optimal noncausal linear filter applied to their sum, and its measured error.", "teaches": "Best linear estimation as projection, computed in frequency: the filter is S_X/(S_X + S_N), and its error is an integral over the spectrum.", "time": "a day", "made": true, "done": "The filter h(t) = δ(t)/5 + (3/(5√10)) e^(-√(8/5)|t|) of Example 9.2 reaches mean squared error within 2 percent of 1/√10 = 0.316."}]}, {"id": "estimation", "title": "Estimation and detection", "kind": "concept", "track": "applied", "pre": ["randproc"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "The conditional mean E[X|Y] minimizes mean squared error; for jointly Gaussian variables it is linear, and the Kalman filter updates it recursively. Detection is hypothesis testing: thresholding the likelihood ratio is optimal for Bayes and Neyman-Pearson criteria, and becomes a matched filter in Gaussian noise.", "reach": "The engineering face of decision theory and testing; Kalman filtering is exact Bayesian inference in linear Gaussian state space models.", "uses": "GPS and inertial navigation with Kalman filters, radar and sonar detection, matched filters in communication receivers, object tracking for robots and self-driving cars, and inference in hidden Markov and state space models.", "worth": "you work in robotics, signal processing, or sequential models; the Kalman filter and likelihood ratio detection are worth knowing for anyone.", "resources": [{"title": "Probability in Electrical Engineering and Computer Science: An Application-Driven Course", "url": "https://link.springer.com/book/10.1007/978-3-030-49995-2", "type": "book", "by": "Jean Walrand, Springer, 2021, open access", "level": 1, "note": "Chapters 7 to 10: detection and Bayes’ rule, hypothesis testing and the Neyman-Pearson theorem, linear and MMSE estimation, and the Kalman filter with its derivation."}, {"title": "Random Processes for Engineers", "url": "https://hajek.ece.illinois.edu/ECE534Notes.html", "type": "book", "by": "Bruce Hajek, Cambridge, 2015, free preproduction copy", "level": 2, "note": "Chapters 3 and 9: the orthogonality principle, Gaussian vectors, discrete time Kalman filtering, and causal Wiener filtering."}, {"title": "An Introduction to Signal Detection and Estimation", "url": "https://link.springer.com/book/10.1007/978-1-4757-2341-0", "type": "book", "by": "H. Vincent Poor, 2nd edition, Springer, 1994", "level": 2, "note": "Chapters 2 to 5: Bayes, minimax, and Neyman-Pearson tests, signal detection in discrete time, and parameter and signal estimation.", "paid": true}, {"title": "An Introduction to the Kalman Filter", "url": "https://techreports.cs.unc.edu/papers/95-041.pdf", "type": "section", "by": "Greg Welch, Gary Bishop, UNC TR 95-041, 2004", "level": 1, "section": "Section 1, The Discrete Kalman Filter", "covers": "The predict and update equations, the Kalman gain derived as the blend that minimizes the posterior error covariance, and why the estimate is the conditional mean when the noise is Gaussian."}, {"title": "Kalman and Bayesian Filters in Python", "url": "https://github.com/rlabbe/Kalman-and-Bayesian-Filters-in-Python", "type": "project", "by": "Roger Labbe, 2020", "level": 1, "build": "Filters for tracking problems in Jupyter notebooks, built up from a g-h filter to the Kalman filter, then the extended and unscented filters and a particle filter.", "teaches": "Estimation theory’s recursions as code, and how a filter’s assumed noise decides whether it trusts the model or the measurement.", "time": "two weeks", "signature": true}]}, {"id": "appliedsp", "title": "Applications of stochastic process theory (EE 226B)", "kind": "concept", "track": "applied", "pre": ["randproc", "markov", "martingales"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "Integrate against Brownian motion by summing at left endpoints and taking an L2 limit: the Itô integral. Itô’s formula, Girsanov’s change of measure, and stochastic differential equations follow, and with them option pricing, filtering, and diffusion processes.", "reach": "The stochastic calculus under Black-Scholes, Kalman-Bucy filtering, stochastic control, and the score SDEs behind diffusion models.", "uses": "Option pricing, Kalman-Bucy filtering, stochastic control, queueing models of data centers and communication networks, and the score-based SDEs used to train and sample diffusion models.", "worth": "the EE 226B checkpoint is your target, or diffusion models, networks, or control; it overlaps stochastic calculus, so one careful pass covers both.", "resources": [{"title": "Stochastic Calculus and Financial Applications", "url": "https://link.springer.com/book/10.1007/978-1-4684-9305-4", "type": "book", "by": "J. Michael Steele, Springer, 2001", "level": 1, "note": "One of the three texts Thomas Courtade lists for EE 226B (Spring 2026); the gentlest, building Brownian motion and the Ito integral before the finance.", "paid": true}, {"title": "Stochastic Differential Equations: An Introduction with Applications", "url": "https://link.springer.com/book/10.1007/978-3-642-14394-6", "type": "book", "by": "Bernt Øksendal, 6th edition, Springer, 2003", "level": 2, "note": "Second of Courtade’s three EE 226B texts: Ito integrals, the Ito formula, SDEs, filtering, and optimal stopping.", "paid": true}, {"title": "Introduction to Stochastic Integration", "url": "https://link.springer.com/book/10.1007/978-1-4614-9587-1", "type": "book", "by": "K. L. Chung, R. J. Williams, 2nd edition, Birkhäuser, 2014", "level": 3, "note": "Third of Courtade’s EE 226B texts: stochastic integration against continuous semimartingales at full rigor.", "paid": true}, {"title": "Stochastic Calculus, Filtering, and Stochastic Control", "url": "https://web.math.princeton.edu/~rvan/acm217/ACM217.pdf", "type": "notes", "by": "Ramon van Handel, Caltech ACM 217, 2007", "level": 2, "note": "A free route through the same ground: the Ito integral, SDEs, filtering, and control, with proofs."}, {"title": "EE 226B: Applications of Stochastic Process Theory", "url": "https://www2.eecs.berkeley.edu/Courses/EE226B/", "type": "course", "by": "Berkeley EECS catalog", "level": 2, "note": "Catalog topics: martingale theory, stochastic calculus, random fields, queueing networks, and stochastic control; a 2-unit course taught by Thomas Courtade in Spring 2026 and 2027."}, {"title": "An Algorithmic Introduction to Numerical Simulation of Stochastic Differential Equations", "url": "https://webhomes.maths.ed.ac.uk/~dhigham/Publications/P42.pdf", "type": "section", "by": "Desmond Higham, SIAM Review, 2001", "level": 1, "section": "Section 3, Stochastic Integrals", "covers": "Left endpoint and midpoint sums against one simulated Brownian path converge to different limits, the Itô and Stratonovich integrals, and quadratic variation explains why the Itô integral of W dW is (W(T)^2 - T)/2."}, {"title": "Black-Scholes for Scientific Computing Students", "url": "https://webhomes.maths.ed.ac.uk/~dhigham/Publications/P54.pdf", "type": "project", "by": "Desmond Higham, Computing in Science and Engineering, 2004", "level": 1, "build": "Monte Carlo, binomial tree, and finite difference prices for a European call, each checked against the Black-Scholes formula, then the article’s suggested projects.", "teaches": "Risk-neutral pricing three ways, from simulated asset paths, a discrete tree, and the Black-Scholes PDE, and how each method’s error behaves.", "time": "a week"}]}, {"id": "infotheory", "title": "Information theory (EE 229A)", "kind": "concept", "track": "applied", "pre": ["probug"], "frontier": false, "tier": "graduate", "core": "Entropy counts typical sequences: about 2^(nH) of them carry nearly all the probability of n source symbols, so the source compresses to H bits per symbol. A channel carries max I(X;Y) bits per use, because about 2^(nI) random codewords have nearly disjoint typical outputs.", "reach": "Fano’s inequality and KL divergence drive the lower bounds in minimax; entropy rates need ergodic theory, and error exponents meet testing.", "uses": "Compression in ZIP files and media codecs, channel codes in WiFi, cellular, and deep-space links, cross-entropy and KL losses, the ELBO in variational inference, mutual information objectives, and minimax lower bounds.", "worth": "you train models with cross-entropy and want to know why, or need lower bounds; entropy, KL, and mutual information belong in everyone’s kit.", "resources": [{"title": "Information Theory, Inference, and Learning Algorithms", "url": "https://www.inference.org.uk/itprnn/book.pdf", "type": "book", "by": "David MacKay, 2003", "level": 1, "note": "Chapters 4 to 6 and 8 to 10: source coding, typicality, and the noisy channel coding theorem, told with intuition first."}, {"title": "Elements of Information Theory", "url": "https://www.wiley.com/en-us/Elements+of+Information+Theory%2C+2nd+Edition-p-9780471241959", "type": "book", "by": "Thomas Cover, Joy Thomas, 2nd edition, Wiley, 2006", "level": 2, "note": "The standard text: Chapters 2, 3, 5, 7, and 10 cover entropy, the AEP, data compression, channel capacity, and rate distortion.", "paid": true}, {"title": "Information Theory: From Coding to Learning", "url": "https://people.lids.mit.edu/yp/homepage/data/itbook-export.pdf", "type": "book", "by": "Yury Polyanskiy, Yihong Wu, Cambridge, 2025", "level": 3, "note": "Parts I, II, and IV: information measures, lossless compression, and channel coding at research depth; Part VI turns them on statistics."}, {"title": "EE 274 Homework 1: prefix-free codes and Huffman coding", "url": "https://stanforddatacompressionclass.github.io/notes/homeworks/HW1.html", "type": "project", "by": "Stanford EE 274, Fall 2025", "level": 1, "build": "Shannon codes with tree and table decoders, and a Huffman coder for a real file, written in the Stanford Compression Library and graded by unit tests.", "teaches": "Entropy as the length a real code achieves, and the practical gaps: sending the code itself, rounded probabilities, and fast decoding.", "time": "a week"}]}, {"id": "convexanalysis", "title": "Convex analysis and optimization (EE 227BT)", "kind": "concept", "track": "applied", "pre": ["linalg", "realanalysis"], "frontier": false, "tier": "graduate", "core": "A closed convex set is the intersection of the halfspaces that contain it. For functions this gives conjugate duality (f** = f); for optimization it gives Lagrange duality: under Slater’s condition the dual bound is tight and the KKT conditions certify optimality.", "reach": "Supplies the duality behind the lasso analysis in high-dimensional statistics, Kantorovich duality in optimal transport, and variational formulas for KL divergence in information theory.", "uses": "Support vector machines, lasso and logistic regression solvers, portfolio optimization, model predictive control, Lagrangian duality for constrained training, and the convergence theory of gradient methods used to train neural networks.", "worth": "you train or analyze any model; duality and KKT conditions repay the time for everyone, and Boyd and Vandenberghe is the standard text.", "resources": [{"title": "Stanford EE364A: Convex Optimization I", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rMJqxxviPa4AmDClvcbHi6h", "type": "lectures", "by": "Stephen Boyd, Stanford Online, 2023", "level": 1, "note": "Recorded lectures that follow the book below; the early lectures cover convex sets, functions, problems, and duality."}, {"title": "Convex Optimization", "url": "https://web.stanford.edu/~boyd/cvxbook/", "type": "book", "by": "Stephen Boyd, Lieven Vandenberghe, 2004", "level": 2, "note": "Chapters 2 to 5: convex sets, convex functions, convex optimization problems, and duality with the KKT conditions."}, {"title": "Convex Analysis", "url": "https://press.princeton.edu/books/paperback/9780691015866/convex-analysis", "type": "book", "by": "R. Tyrrell Rockafellar, Princeton, 1970", "level": 3, "note": "The founding text on conjugate functions, subgradients, and duality; read it for proofs once Boyd and Vandenberghe feel routine.", "paid": true}, {"title": "Distributed Optimization and Statistical Learning via the Alternating Direction Method of Multipliers", "url": "https://web.stanford.edu/~boyd/papers/admm_distr_stats.html", "type": "section", "by": "Boyd, Parikh, Chu, Peleato, Eckstein, 2011", "level": 2, "section": "Section 2, Precursors", "covers": "The Lagrangian and the dual function written through the convex conjugate, then how strong duality becomes algorithms: dual ascent, dual decomposition, and the method of multipliers."}, {"title": "Additional Exercises for Convex Optimization", "url": "https://github.com/cvxgrp/cvxbook_additional_exercises", "type": "project", "by": "Stephen Boyd, Lieven Vandenberghe, 2026", "level": 2, "note": "Sections 2 to 5 follow the book’s Chapters 2 to 5; solutions go only to instructors.", "build": "Solved exercises from the sections on convex sets, convex functions, convex problems, and duality, the computational ones in CVXPY on the repository’s data files.", "teaches": "Recognizing convexity, reformulating a problem until a solver accepts it, and reading dual variables as certificates and sensitivities.", "time": "a month"}]}], "macro": [{"from": "found", "to": "analysis", "links": 2}, {"from": "found", "to": "algebra", "links": 2}, {"from": "found", "to": "combin", "links": 2}, {"from": "found", "to": "prob", "links": 1}, {"from": "analysis", "to": "prob", "links": 2}, {"from": "analysis", "to": "topology", "links": 3}, {"from": "algebra", "to": "topology", "links": 2}, {"from": "analysis", "to": "dynamics", "links": 3}, {"from": "prob", "to": "stats", "links": 4}, {"from": "prob", "to": "applied", "links": 4}, {"from": "analysis", "to": "app ng proofs to graduate probability, theoretical statistics, analysis, algebra and topology, each tiered from lower division to advanced graduate, drawn as two prerequisite graphs: one of 9 tracks, and one of the ideas inside them. Open a track, click an idea to see what to learn first, where to learn it and what to build, and tick resources off as you go.", "aboutHtml": "<h2>About this map<\/h2>\n<p>The Tracks view is the map at the largest scale: 9 tracks, with an arrow from one track to another\nwhen ideas in the second build on ideas in the first and a learner should meet the first track before it. Arrows get\nthicker the more ideas they connect. Some links skip a column or run against the arrows; each track's panel lists\nevery link, counted.<\/p>\n<p>The Map view is the same graph one level down. Each box is one idea: a concept, or a single paper, book or course\nthat defines one. An arrow from A to B means learn A before B. Arrows inside a track are always drawn; arrows between\ntracks appear when you click an idea, or all at once with Links. Click an idea and every idea on its path lights up,\nso you can see the whole chain to learn first.<\/p>\n<p>Each idea opens with why to learn it: what it is used for, including uses that are not obvious and links that\nare only conceptual, and who should put in the time to learn it and its prerequisites.<\/p>\n<p>Inside each idea, resources are ordered so that the first one is the best place to start and each one after it\nadds what the ones above did not. Start, Core and Deep say how far in each one goes.<\/p>\n<p>Projects are the other half: things to build, with what you build, what it teaches and roughly how long it takes.\nMost are an assignment, an exercise set or a repository that people in the field actually work through. Where no such project exists, 28 were written for this map: each is built on a named paper, dataset or repository, and ends on a number from that source that tells you when you are done. Every track has one\nsignature project, the one to build if you build only one. Projects sit in each idea's list beside what to read, at\nthe top of each track's panel, and all together in the Projects view.<\/p>\n<p>Paper sections point at one section of a paper: its background, preliminaries or related work. A good one restates an idea in a page, in the notation later work uses, or maps the line of work that led to it. Each says which section to read and what it covers; there are 19.<\/p>\n<p>Show, beside the views, hides what you do not want to see: paper sections, all projects, or only the projects\nwritten for this map. Hidden resources leave the lists and the progress counts, and the choice is saved in this\nbrowser.<\/p>\n<p>Every idea carries a tier: lower div and upper div follow an undergraduate sequence, graduate is first-year\nPhD material, and advanced is past the qualifying level. Ideas marked checkpoint are the graduate courses a PhD student\nin statistics or probability is expected to handle cold: Berkeley's Stat 205A/B in probability, Stat 210A/B in\ntheoretical statistics, and EE 226A/B in random processes. Getting there is the point of the map; the analysis and\nalgebra tracks are what make those courses readable.<\/p>\n<p>Tracks that share a color are close in subject, and the track name is always written next to the color. The List\nview holds the same content as text.<\/p>\n<p>The companion maps are the <a href=\"../ml-research-roadmap/\">Machine Learning Research Roadmap<\/a> and the <a href=\"../science-and-engineering-roadmap/\">Science and Engineering Roadmap<\/a>.<\/p>\n<h2>How it was made<\/h2>\n<p>Built by Claude at Jai Sharma's direction in October 2026, on the pattern of the NeetCode roadmap. Claude\nchose the 54 ideas and 84 prerequisite edges, then separate Claude agents wrote each idea's core and\ngathered its 176 resources; later passes added 64 projects, 28 of them written for this map, and 19 paper sections. Every link was opened, every course page\nwas read for what its assignment asks, every arXiv ID was checked against its title, and every video was checked to\nstill exist before it went on the map. Progress ticks are saved in your browser only.<\/p>", "storeKey": "math-roadmap:done:v1", "trackHint": "9 tracks, each a graph of its own ideas. Open a track to see what it builds on and where to start."};
// The roadmap's behaviour: pan and zoom over a precomputed layout, a NeetCode-style panel per idea,
// progress kept in this browser only, a list view for phones and screen readers, a view of every project, and a
// Show control that hides paper sections, projects, or only the projects written for the map.
(() => {
  "use strict";
  const L = DATA.layout;
  const byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
  const trackById = Object.fromEntries(DATA.tracks.map(t => [t.id, t]));
  const kids = {};
  for (const n of DATA.nodes) for (const p of n.pre) (kids[p] = kids[p] || []).push(n.id);
  const color = id => `var(--f-${trackById[byId[id].track].family})`;
  const KIND = { concept: "idea", paper: "paper", book: "book", course: "course", blog: "blog" };
  const LEVEL = { 1: "Start", 2: "Core", 3: "Deep" };
  const badgeOf = n => n.badge || (n.frontier ? "frontier" : "");
  const tagOf = n => n.tier || (n.kind === "concept" ? "" : KIND[n.kind]);
  const TYPE = { paper: "Paper", book: "Book", course: "Course", lectures: "Lectures", video: "Video", blog: "Blog", notes: "Notes", code: "Code", tutorial: "Tutorial", project: "Project", section: "Paper section" };
  const isProj = r => r.type === "project", isSec = r => r.type === "section";
  // what to show, saved in this browser and shared by the three maps
  const SHOW_KEY = "roadmap-show";
  const show = { sections: true, projects: true, made: true };
  try { Object.assign(show, JSON.parse(localStorage.getItem(SHOW_KEY) || "{}") || {}); } catch (e) {}
  const shown = r => isProj(r) ? show.projects && (show.made || !r.made) : isSec(r) ? show.sections : true;
  const projOf = n => n.resources.filter(r => isProj(r) && shown(r));
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k === "style") n.style.cssText = v; else n.setAttribute(k, v);
    }
    for (const k of kids) if (k != null) n.append(k);
    return n;
  };

  // progress, kept per browser
  const KEY = DATA.storeKey;
  let done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
  const rkey = (n, r) => n.id + "|" + r.url;
  const prog = n => { const rs = n.resources.filter(shown); return [rs.filter(r => done[rkey(n, r)]).length, rs.length]; };

  // ancestors: everything to learn first, transitively
  const ancCache = {};
  function ancestors(id) {
    if (ancCache[id]) return ancCache[id];
    const out = new Set();
    const walk = x => { for (const p of byId[x].pre) if (!out.has(p)) { out.add(p); walk(p); } };
    walk(id);
    return (ancCache[id] = out);
  }

  // header text
  const count = f => DATA.nodes.reduce((s, n) => s + n.resources.filter(f).length, 0);
  const nRead = count(r => !isProj(r) && !isSec(r)), nSec = count(isSec), nMadeAll = count(r => isProj(r) && r.made);
  document.getElementById("lede").textContent = DATA.lede;
  document.getElementById("thint").textContent = DATA.trackHint;
  function renderTotals() {
    const [d, tot] = DATA.nodes.reduce((a, n) => { const [x, y] = prog(n); return [a[0] + x, a[1] + y]; }, [0, 0]);
    const np = count(r => isProj(r) && shown(r));
    document.getElementById("totals").textContent = d ? `${d} of ${tot} done` : [`${DATA.nodes.length} ideas`, `${nRead} resources`,
      show.sections && nSec ? `${nSec} sections` : null, show.projects ? `${np} projects` : null].filter(Boolean).join(" · ");
  }
  const legend = document.getElementById("legend");
  for (const t of DATA.tracks) {
    const b = el("button", { class: "chip", style: `--c: var(--f-${t.family})`, title: "Show " + t.label }, el("span", { class: "dot" }), t.label);
    b.addEventListener("click", () => { setView("map"); focusTrack(t.id); });

    return out.sort((a, b) => !!b[1].signature - !!a[1].signature);
  }
  function openTrack(tid, opts = {}) {
    const t = trackById[tid]; if (!t) return;
    current = null; currentTrack = tid; panelProg = null;
    panel.textContent = ""; panel.style.setProperty("--c", `var(--f-${t.family})`);
    const closeBtn = el("button", { class: "close", "aria-label": "Close", text: "×" }); closeBtn.onclick = close;
    const ns = trackNodes(tid), [d, tot] = trackProg(tid);
    panel.append(closeBtn,
      el("p", { class: "pk" }, el("span", { class: "dot", style: `--c:var(--f-${t.family})` }), "Track", el("span", { class: "badge", text: `${ns.length} ideas` })),
      el("h2", { id: "ptitle", text: t.label }),
      el("div", { class: "prog" }, el("span", { class: "bar" }, el("i", { style: `width:${tot ? 100 * d / tot : 0}%` })), el("span", { text: `${d} / ${tot}` })),
      el("p", { class: "core", text: t.core }));
    const go = el("button", { class: "primary", text: "Open this track on the map" });
    go.onclick = () => { close(); setView("map"); focusTrack(tid); };
    panel.append(go);
    // what to build: the signature project first, then the rest in the order of the track's ideas
    const projs = trackProjects(tid);
    if (projs.length) {
      const sig = el("ul", { class: "res" }), more = el("ul", { class: "res" });
      for (const [n, r, i] of projs) (r.signature ? sig : more).append(resItem(n, r, i, true));
      if (sig.childElementCount) panel.append(el("p", { class: "sec", text: "Signature project" }), sig);
      if (more.childElementCount) panel.append(el("p", { class: "sec", text: sig.childElementCount ? "More projects in this track" : "Projects in this track" }), more);
    }
    panel.append(el("p", { class: "sec", text: "Learn first" }), trackChips(tUp[tid] || [], "Nothing. The map starts here."));
    panel.append(el("p", { class: "sec", text: "Leads to" }), trackChips(tDown[tid] || [], "Nothing further on this map."));
    const inL = DATA.trackLinks.filter(x => x.to === tid).sort((a, b) => b.links - a.links);
    const outL = DATA.trackLinks.filter(x => x.from === tid).sort((a, b) => b.links - a.links);
    const fmt = (arr, key) => arr.map(x => `${trackById[x[key]].label} (${x.links})`).join(", ");
    panel.append(el("p", { class: "sec", text: "Every link to other tracks" }),
      el("p", { class: "tlinks", text: (inL.length ? `Its ideas build on ideas in ${fmt(inL, "from")}.` : "Its ideas build on nothing outside it.")
        + (outL.length ? ` Ideas in ${fmt(outL, "to")} build on it.` : "") + " The numbers count prerequisite arrows between ideas; the track map draws the ones a learner needs first." }));
    const roots = ns.filter(n => !n.pre.some(p => byId[p].track === tid));
    const startBox = el("div", { class: "links" });
    for (const n of roots) { const b = el("button", { style: `--c:var(--f-${t.family})` }, el("span", { class: "dot" }), n.title); b.onclick = () => openOnMap(n.id); startBox.append(b); }
    panel.append(el("p", { class: "sec", text: "Start with" }), startBox);
    const ol = el("ul", { class: "ideas" });
    for (const n of ns) {
      const [dd, tt] = prog(n);
      const b = el("button", {}, el("span", { class: "it" }, n.title, el("span", { class: "ik", text: [tagOf(n), badgeOf(n)].filter(Boolean).join(" · ") })), el("span", { class: "ip", text: `${dd}/${tt}` }));
      b.onclick = () => openOnMap(n.id);
      ol.append(el("li", {}, b));
    }
    panel.append(el("p", { class: "sec", text: "Its ideas, in order" }), ol);
    panel.hidden = false; scrim.hidden = innerWidth > 720; panel.scrollTop = 0;
    highlightTrack(tid); highlight(null);
    try { history.replaceState(null, "", "#track-" + tid); } catch (e) {}
    if (!opts.noFocus) closeBtn.focus({ preventScroll: true });
  }
  addEventListener("resize", () => { if (!tview.hidden) renderTrackMap(); });

  // projects view: every project on the map, by track, each track's signature project first
  function renderProjects() {
    const box = document.getElementById("projin"); box.textContent = "";
    const nt = DATA.tracks.filter(t => trackProjects(t.id).length).length;
    const nAll = count(r => isProj(r) && shown(r)), nMade = show.made ? nMadeAll : 0;
    box.append(el("p", { class: "pintro", text: `${nAll} projects across ${nt} tracks: assignments, exercise sets, and repositories that people in each field actually work through` + (nMade ? `, and ${nMade} written for this map where none exists, each built on a named paper, dataset, or repository and ending on a number you can check` : "") + `. Each track's signature project comes first, the one to build if you build only one.`
      + (!show.made && nMadeAll ? ` The ${nMadeAll} written for this map are hidden by Show.` : "") }));
    for (const t of DATA.tracks) {
      const projs = trackProjects(t.id);
      if (!projs.length) continue;
      const head = el("h2", { style: `--c:var(--f-${t.family})` }, el("span", { class: "dot" }), t.label);
      const ul = el("ul", { class: "res", style: `--c:var(--f-${t.family})` });
      for (const [n, r, i] of projs) ul.append(resItem(n, r, i, true));
      box.append(head, ul);
    }
  }

  // views
  const views = { tracks: tview, map: document.getElementById("map"), list: document.getElementById("list"), projects: document.getElementById("projects"), about: document.getElementById("about") };
  let mapReady = false;
  function setView(v) {
    for (const [k, node] of Object.entries(views)) node.hidden = k !== v;
    for (const k of Object.keys(views)) document.getElementById("v-" + k).setAttribute("aria-pressed", String(k === v));
    if (v === "map") { if (!mapReady) { mapReady = true; initMap(); } else apply(); }
    if (v === "tracks") renderTrackMap();
    if (v === "projects") renderProjects();
  }
  for (const k of Object.keys(views)) document.getElementById("v-" + k).onclick = () => setView(k);

  // search
  const q = document.getElementById("q"), results = document.getElementById("results");
  let hits = [], hi = 0;
  const hideResults = () => { results.hidden = true; q.setAttribute("aria-expanded", "false"); for (const n of DATA.nodes) nodeEls[n.id].btn.classList.remove("hit"); };
  function search() {
    const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    for (const n of DATA.nodes) nodeEls[n.id].btn.classList.remove("hit");
    if (!words.length) { hideResults(); return; }
    hits = [];
    for (const n of DATA.nodes) {
      const head = (n.title + " " + trackById[n.track].label).toLowerCase();
      const text = r => r.title + " " + r.by + (isProj(r) ? " project " + r.build + " " + r.teaches + " " + (r.done || "") : "") + (isSec(r) ? " section " + r.section + " " + r.covers : "");
      const body = (n.core + " " + (n.reach || "") + " " + (n.uses || "") + " " + (n.worth || "") + " " + n.resources.filter(shown).map(text).join(" ")).toLowerCase();
      if (!words.every(w => head.includes(w) || body.includes(w))) continue;
      const res = n.resources.filter(shown).find(r => words.every(w => text(r).toLowerCase().includes(w)));
      hits.push({ n, score: words.every(w => head.includes(w)) ? 0 : 1, res });
    }
    hits.sort((a, b) => a.score - b.score);
    results.textContent = ""; hi = 0;
    if (!hits.length) results.append(el("div", { class: "rm", style: "padding:.5rem .6rem", text: "No idea or resource matches." }));
    hits.slice(0, 12).forEach((h, i) => {
      nodeEls[h.n.id].btn.classList.add("hit");
      const b = el("button", { role: "option", "aria-selected": String(i === 0) },
        el("div", { class: "rt", text: h.n.title }),
        el("div", { class: "rm", text: h.res ? (isProj(h.res) ? "Project: " : isSec(h.res) ? "Paper section: " : "Resource: ") + h.res.title : trackById[h.n.track].label }));
      b.addEventListener("click", () => { pick(h.n.id); });
      results.append(b);
    });
    results.hidden = false; q.setAttribute("aria-expanded", "true");
  }
  function pick(id) { hideResults(); q.blur(); if (map.hidden) setView("map"); open(id, { minS: .85 }); }
  q.addEventListener("input", search);
  q.addEventListener("keydown", ev => {
    const opts = [...results.querySelectorAll("button")];
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault(); if (!opts.length) return;
      hi = (hi + (ev.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.setAttribute("aria-selected", String(i === hi)));
    } else if (ev.key === "Enter" && hits[hi]) { ev.preventDefault(); pick(hits[hi].n.id); }
  });
  document.addEventListener("click", ev => { if (!ev.target.closest(".search")) { results.hidden = true; q.setAttribute("aria-expanded", "false"); } });

  // Show: paper sections, projects, and projects written for this map; everything that counts or lists resources follows it
  const sBtn = { sections: document.getElementById("s-sections"), projects: document.getElementById("s-projects"), made: document.getElementById("s-made") };
  if (!nSec) sBtn.sections.hidden = true;
  if (!nMadeAll) sBtn.made.hidden = true;
  function applyShow() {
    for (const [k, b] of Object.entries(sBtn)) b.setAttribute("aria-pressed", String(!!show[k]));
    sBtn.made.disabled = !show.projects;
    document.getElementById("v-projects").hidden = !show.projects;
    if (!show.projects && !views.projects.hidden) setView("tracks");
    try { localStorage.setItem(SHOW_KEY, JSON.stringify(show)); } catch (e) {}
    DATA.nodes.forEach(paintNode); renderTotals(); renderList();
    tmode = null; if (!tview.hidden) renderTrackMap();
    if (!views.projects.hidden) renderProjects();
    if (!panel.hidden) { if (current) open(current, { keepView: true, noFocus: true }); else if (currentTrack) openTrack(currentTrack, { noFocus: true }); }
    if (!results.hidden) search();
  }
  for (const [k, b] of Object.entries(sBtn)) b.addEventListener("click", () => { show[k] = !show[k]; applyShow(); });
  applyShow();

  // first frame: the track map, or the idea or track named in the link
  renderTotals();
  function start() {
    const h = location.hash.slice(1);
    if (byId[h]) { setView("map"); open(h, { noFocus: true, minS: .85 }); return; }
    if (h === "projects") { setView("projects"); return; }
    setView("tracks");
    if (h.startsWith("track-") && trackById[h.slice(6)]) openTrack(h.slice(6), { noFocus: true });
  }
  // the detailed map's first view: the foundations and the row under them, readable
  function initMap() {
    const r = map.getBoundingClientRect();
    const firstTrack = Object.keys(L.tracks).sort((p, q) => L.tracks[p].y - L.tracks[q].y || L.tracks[p].x - L.tracks[q].x)[0], f = L.tracks[firstTrack];
    if (r.width <= 720) {
      const top = DATA.nodes.filter(n => n.track === firstTrack).map(n => L.nodes[n.id]).sort((p, q) => p.y - q.y)[0];
      s = .62; tx = r.width / 2 - top.x * s; ty = 12 - f.y * s; apply(); return;
    }
    s = Math.min(.9, Math.max(.6, (r.width - 48) / (f.w + 600)));
    tx = r.width / 2 - (f.x + f.w / 2) * s; ty = 16 - f.y * s; apply();
  }
  start();
  addEventListener("resize", () => drawMini());
})();

</script>
</body>
</html>
