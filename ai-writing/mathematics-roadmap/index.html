": "Free to read online: Chapters 1 to 6, starred sections first, with König’s theorem in Section 2.1 and Menger’s in Section 3.3."}, {"title": "Spectral and Algebraic Graph Theory", "url": "http://cs-www.cs.yale.edu/homes/spielman/sagt/", "type": "book", "by": "Daniel Spielman, draft, 2025", "level": 2, "note": "Chapters 2, 3, 10 to 12, and 21 cover Laplacian eigenvalues, random walks as electrical networks, and Cheeger’s inequality linking the second eigenvalue to cuts."}, {"title": "Modern Graph Theory", "url": "https://link.springer.com/book/10.1007/978-1-4612-0619-4", "type": "book", "by": "Béla Bollobás, Springer, 1998", "level": 3, "note": "Chapters 2 (electrical networks), 7 (random graphs), and 9 (random walks on graphs) are the parts a probabilist uses most.", "paid": true}, {"title": "Baseball Elimination", "url": "https://coursera.cs.princeton.edu/algs4/assignments/baseball/specification.php", "type": "project", "by": "Kevin Wayne, Princeton COS 226", "level": 2, "build": "A program that decides which teams in a division are mathematically eliminated by solving a max-flow problem per team, and returns the teams on the min cut’s source side as proof.", "teaches": "Max-flow min-cut as a proof device: the cut that blocks the flow is a short certificate of elimination anyone can check.", "time": "a weekend"}]}, {"id": "enumerative", "title": "Enumerative combinatorics and generating functions", "kind": "concept", "track": "combin", "pre": ["logic"], "frontier": false, "tier": "upper div", "core": "Encode a counting sequence a_n as a power series, the sum of a_n x^n. Constructions become algebra (disjoint union a sum, pairing a product, sequences 1/(1 - f)), recursions become equations, and the series’ nearest singularity gives the growth rate of a_n.", "reach": "Analytic combinatorics leans on complex analysis; probability generating functions are the same object.", "uses": "Average-case running times of algorithms, solving recurrences, counting lattice paths and trees, partition functions in statistical mechanics, and probability generating functions for branching processes and random walks.", "worth": "you like combinatorics or analyze algorithms; on a statistics path, ordinary and probability generating functions plus solving recurrences are enough.", "resources": [{"title": "generatingfunctionology (2nd edition)", "url": "https://www2.math.upenn.edu/~wilf/DownldGF.html", "type": "book", "by": "Herbert Wilf, 1994", "level": 1, "note": "Short and conversational, free from the author, it turns recurrences into power series and back through many worked examples."}, {"title": "Enumerative Combinatorics, Volume 1 (2nd edition)", "url": "https://math.mit.edu/~rstan/ec/ec1.pdf", "type": "book", "by": "Richard Stanley, free draft, 2011", "level": 2, "note": "Chapter 1 through Section 1.9 (the twelvefold way), then Chapter 4 on rational generating functions."}, {"title": "Analytic Combinatorics", "url": "https://ac.cs.princeton.edu/home/AC.pdf", "type": "book", "by": "Philippe Flajolet, Robert Sedgewick, Cambridge, 2009", "level": 3, "note": "Part A (Chapters I to III) turns constructions into generating function equations, and Part B (Chapters IV to VII) reads asymptotics off singularities."}, {"title": "Project Euler", "url": "https://projecteuler.net/archives", "type": "project", "by": "Colin Hughes and contributors, since 2001", "level": 2, "build": "Programs that count objects too numerous to list, using recurrences, generating functions, inclusion-exclusion, and number theory to answer each within a minute.", "teaches": "Counting arguments made executable, and the gap between a formula and an algorithm.", "time": "a term", "signature": true}]}, {"id": "probmethod", "title": "The probabilistic method", "kind": "concept", "track": "combin", "pre": ["graphtheory", "probug"], "frontier": false, "tier": "graduate", "core": "Prove an object exists by picking one at random and showing it has the property with positive probability. Erdős colored each edge of the complete graph on 2^(k/2) vertices at random: likely no k vertices span one color, yet no explicit coloring is known.", "reach": "Its tools (second moment, Lovász local lemma, Chernoff bounds) return in concentration, random graphs, and extremal combinatorics.", "uses": "Proving good objects exist by choosing them at random: Ramsey graphs, expanders, codes meeting the Gilbert-Varshamov bound, Johnson-Lindenstrauss random projections, and randomized algorithms that are later derandomized.", "worth": "theoretical computer science, combinatorics, or learning theory is your direction; its moment bounds, union bounds, and local lemma return everywhere.", "resources": [{"title": "Probabilistic Methods in Combinatorics (MIT 18.226 lecture notes)", "url": "https://yufeizhao.com/pm/", "type": "notes", "by": "Yufei Zhao, MIT, 2022", "level": 1, "note": "Chapters 1 to 6 cover the basic method, linearity of expectation, alterations, the second moment, Chernoff bounds, and the Lovász local lemma."}, {"title": "The Probabilistic Method (4th edition)", "url": "https://www.wiley.com/en-us/The+Probabilistic+Method%2C+4th+Edition-p-9781119061953", "type": "book", "by": "Noga Alon, Joel Spencer, Wiley, 2016", "level": 2, "note": "Part I (Chapters 1 to 9) runs from the basic method through martingales, the Poisson paradigm, and quasirandomness.", "paid": true}, {"title": "MIT 18.226: Probabilistic Methods in Combinatorics", "url": "https://ocw.mit.edu/courses/18-226-probabilistic-methods-in-combinatorics-fall-2022/", "type": "course", "by": "Yufei Zhao, MIT OpenCourseWare, 2022", "level": 1, "note": "Recorded lectures and problem sets that go with Zhao’s notes."}, {"title": "Random colorings and the Ramsey number R(4, 4)", "url": "https://www.combinatorics.org/ojs/index.php/eljc/article/view/DS1", "type": "project", "by": "Built on Radziszowski, Small Ramsey Numbers", "level": 2, "build": "Random two-colorings of complete graphs, the expected number of one-color copies of K_k, derandomization by conditional expectations, and a local search for colorings with no one-color K_4.", "teaches": "What a first-moment argument buys and what it leaves behind: its bound sits far below the truth, and good explicit colorings are hard to find.", "time": "a weekend", "made": true, "done": "Local search colors K_17 with no one-color K_4, matching R(4, 4) = 18 in Section 2.1 of the survey, while the first moment alone guarantees only K_6."}]}, {"id": "extremal", "title": "Extremal and additive combinatorics", "kind": "concept", "track": "combin", "pre": ["probmethod", "fourier"], "frontier": false, "tier": "advanced", "core": "Every large dense graph splits into a bounded number of parts with random-looking edges between most pairs (Szemerédi’s regularity lemma). Counting triangles across those parts proves Roth’s theorem: any set of integers with positive density contains a 3-term arithmetic progression.", "reach": "Structure versus randomness recurs in graph limits, the Green-Tao theorem, and property testing; the Fourier proof of Roth’s theorem uses harmonic analysis.", "uses": "Szemerédi’s theorem and the Green-Tao theorem on primes in arithmetic progressions, property testing in theoretical computer science, graph limits for very large networks, and the structure versus randomness view in number theory.", "worth": "combinatorics or theoretical computer science research is the goal; on a statistics or ML path, read it for the ideas only.", "resources": [{"title": "MIT 18.225: Graph Theory and Additive Combinatorics", "url": "https://ocw.mit.edu/courses/18-225-graph-theory-and-additive-combinatorics-fall-2023/", "type": "course", "by": "Yufei Zhao, MIT OpenCourseWare, 2023", "level": 1, "note": "Recorded lectures and notes (the course was 18.217) on forbidden subgraphs, the regularity lemma, pseudorandom graphs, graph limits, and Roth’s theorem."}, {"title": "Graph Theory and Additive Combinatorics: Exploring Structure and Randomness", "url": "https://yufeizhao.com/gtacbook/", "type": "book", "by": "Yufei Zhao, Cambridge, 2023", "level": 2, "note": "The free author’s version: Chapters 1 and 2 (forbidding a subgraph, the regularity method), then Chapter 6 (3-term progressions)."}, {"title": "Additive Combinatorics", "url": "https://www.cambridge.org/core/books/additive-combinatorics/D408BA34B567974CC8FB0CEC2A49A807", "type": "book", "by": "Terence Tao, Van Vu, Cambridge, 2006", "level": 3, "note": "Chapters 2 (sum set estimates), 4 (Fourier-analytic methods), and 10 and 11 (Szemerédi’s theorem).", "paid": true}, {"title": "Graph removal lemmas", "url": "https://arxiv.org/html/1211.3487v1#S2.SS1", "type": "section", "by": "David Conlon, Jacob Fox, 2013", "level": 2, "section": "Section 2.1, The standard proof", "covers": "Szemerédi’s regularity lemma proved by the energy increment argument, then the counting lemma and the graph removal lemma deduced from it, the lemma from which Roth’s theorem follows."}, {"title": "Large sets with no 3-term progression", "url": "https://oeis.org/A003002", "type": "project", "by": "Built on OEIS A003002", "level": 2, "build": "An exact branch and bound search for the largest subset of 1 to n with no 3-term arithmetic progression, beside the greedy base 3 set and Behrend’s construction for large n.", "teaches": "How fast progression-free sets must thin out, as Roth’s theorem says, and why structured constructions beat random ones here.", "time": "a weekend", "made": true, "done": "The exact search matches OEIS A003002 through n = 60, where the largest set with no 3-term progression has 19 elements."}]}, {"id": "probug", "title": "Probability (Stat 134)", "kind": "concept", "track": "prob", "pre": ["rigcalc"], "frontier": false, "tier": "upper div", "core": "Most problems yield to two moves: write a count as a sum of indicators, so linearity of expectation works even for dependent pieces, and condition on the right variable, so total probability or total expectation splits a hard problem into easy cases.", "reach": "Measure-theoretic probability makes conditioning rigorous, Markov chains and random processes build on it, and mathematical statistics turns distributions into estimators.", "uses": "Losses written as expectations, dropout and sampling in machine learning, randomized algorithms, A/B tests, insurance pricing, queues, and reliability engineering; it is the working language of nearly every ML paper.", "worth": "you touch data or ML at all; no one on this path should skip it, and its problem-solving moves matter more than its formulas.", "resources": [{"title": "Harvard Stat 110: Probability", "url": "https://stat110.net/", "type": "lectures", "by": "Joe Blitzstein, Harvard, 2013", "level": 1, "note": "Lecture videos, the book below, and practice problems with solutions; the best first course."}, {"title": "Introduction to Probability", "url": "https://probabilitybook.net/", "type": "book", "by": "Joe Blitzstein, Jessica Hwang, 2nd edition, 2019", "level": 1, "note": "Chapters 1 to 10, from counting through conditional expectation and the limit theorems; Chapters 11 to 13 add Markov chains and Poisson processes."}, {"title": "Probability", "url": "https://link.springer.com/book/10.1007/978-1-4612-4374-8", "type": "book", "by": "Jim Pitman, Springer, 1993", "level": 2, "note": "Berkeley’s Stat 134 text for many years; its worked examples drill indicators and conditioning until they are reflexes.", "paid": true}, {"title": "Data 140 Lab 1: Total Variation", "url": "https://github.com/data-140-berkeley/materials-fa26/blob/main/lab/Lab_01.ipynb", "type": "project", "by": "Data 140, Berkeley, Fall 2026", "level": 1, "build": "Code for total variation distance, the exact distribution of fixed points of a random permutation, and how far it and Binomial(n, 1/n) sit from Poisson(1), checked against Le Cam’s bound.", "teaches": "Indicators and inclusion-exclusion turned into exact computation, and a way to measure how good an approximation is rather than trusting it.", "time": "a day"}]}, {"id": "measureprob", "title": "Measure-theoretic probability (Stat 205A)", "kind": "concept", "track": "prob", "pre": ["measure", "probug"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "Events such as “the running average converges” depend on infinitely many coin flips, so probability must be a countably additive measure and expectation a Lebesgue integral. Then Borel-Cantelli and truncation prove the strong law, and characteristic functions prove the central limit theorem.", "reach": "Conditional expectation, defined here through Radon-Nikodym, is what martingales, Brownian motion, and decision theory all build on.", "uses": "Rigorous conditional expectation, proofs of the strong law and central limit theorem, weak convergence of distributions, and the foundation for theory papers on diffusion models, reinforcement learning, and stochastic optimization.", "worth": "reading or writing probability and learning theory proofs is the goal; it is a checkpoint, and statements alone will not carry you through graduate papers.", "resources": [{"title": "Probability: Theory and Examples", "url": "https://services.math.duke.edu/~rtd/PTE/pte.html", "type": "book", "by": "Rick Durrett, 5th edition, Cambridge, 2019", "level": 2, "note": "Chapters 1 to 3: measure theory, the laws of large numbers, and central limit theorems; the usual text for the 205 sequence, free as a PDF."}, {"title": "Probability with Martingales", "url": "https://www.cambridge.org/core/books/probability-with-martingales/B4CFCE0D08930FB46C6E93E775503926", "type": "book", "by": "David Williams, Cambridge, 1991", "level": 2, "note": "Part A (Chapters 1 to 8) builds measure theory with the probabilistic reason for each step; read it beside Durrett.", "paid": true}, {"title": "Probability Theory: Stat C205A lecture notes", "url": "https://www.stat.berkeley.edu/~aldous/205A/sinho_chewi_notes.pdf", "type": "notes", "by": "David Aldous, Berkeley, Fall 2016, scribed by Sinho Chewi", "level": 2, "note": "Berkeley’s 205A as one instructor taught it: measure theory, the strong law, conditional expectation, and martingales."}, {"title": "MIT 18.175: Theory of Probability", "url": "https://ocw.mit.edu/courses/18-175-theory-of-probability-spring-2014/", "type": "course", "by": "Scott Sheffield, MIT OCW, 2014", "level": 2, "note": "Sheffield’s lecture slides follow Durrett; Lectures 1 to 17 cover this node, and later ones reach martingales, Markov chains, ergodic theory, and Brownian motion."}, {"title": "Probability and Measure", "url": "https://www.wiley.com/en-us/Probability+and+Measure%2C+Anniversary+Edition-p-9781118122372", "type": "book", "by": "Patrick Billingsley, Anniversary edition, Wiley, 2012", "level": 3, "note": "The encyclopedic reference; look things up in it rather than read it straight through.", "paid": true}, {"title": "Berry-Esseen: the CLT’s error against its constant", "url": "https://arxiv.org/abs/1111.6554", "type": "project", "by": "Built on Shevtsova, 2011", "level": 2, "build": "Exact distribution functions of standardized Bernoulli sums for many p and n up to 10,000, their Kolmogorov distance to the normal, and its ratio to β3/√n.", "teaches": "What the CLT’s rate means in numbers: the error shrinks like 1/√n, skewed summands converge slowest, and the worst case is a lopsided coin.", "time": "a day", "made": true, "done": "The ratio √n Δn / β3 stays below 0.4748 (Corollary 1) for every p and n, and its maximum over p approaches Esseen’s lower constant 0.4097."}]}, {"id": "martingales", "title": "Martingales", "kind": "concept", "track": "prob", "pre": ["measureprob"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "A martingale is a fair game: given the past, the expected next value is the current one. Optional stopping says no bounded stopping rule beats it, and Doob’s upcrossing inequality shows an L1-bounded martingale converges, since it crosses any interval only finitely often.", "reach": "Gives Azuma’s inequality for concentration, the strong law through reversed martingales, stochastic integrals in stochastic calculus, and the likelihood ratio behind sequential tests.", "uses": "Azuma-Hoeffding concentration, convergence proofs for stochastic approximation and SGD, sequential tests and anytime-valid confidence intervals, risk-neutral derivative pricing, gambler’s ruin, and high-probability regret bounds in online learning.", "worth": "learning theory, bandit, or sequential testing papers are ahead; optional stopping and Azuma come first, and the convergence theorems can follow.", "resources": [{"title": "Stochastic Processes (Stanford Math 136 lecture notes)", "url": "https://adembo.su.domains/math-136/nnotes.pdf", "type": "notes", "by": "Amir Dembo, revised by Kevin Ross, Stanford, 2021", "level": 1, "note": "Chapter 2 builds conditional expectation as a projection; Chapter 4 covers martingales, stopping times, optional stopping, and the convergence theorems."}, {"title": "Probability with Martingales", "url": "https://www.cambridge.org/core/books/probability-with-martingales/B4CFCE0D08930FB46C6E93E775503926", "type": "book", "by": "David Williams, Cambridge, 1991", "level": 2, "note": "Part B (Chapters 9 to 15): conditional expectation, the upcrossing proof of convergence, uniform integrability, and many applications; the classic account.", "paid": true}, {"title": "Probability: Theory and Examples", "url": "https://services.math.duke.edu/~rtd/PTE/pte.html", "type": "book", "by": "Rick Durrett, 5th edition, Cambridge, 2019", "level": 2, "note": "Chapter 4, Sections 4.1 to 4.8: conditional expectation through Doob’s inequality, uniform integrability, backwards martingales, and optional stopping."}, {"title": "Game-theoretic statistics and safe anytime-valid inference", "url": "https://arxiv.org/html/2210.01948v2#S2.SS2", "type": "section", "by": "Ramdas, Grünwald, Vovk, Shafer, 2023", "level": 2, "section": "Section 2.2, Test (Super)Martingales", "covers": "A nonnegative martingale as the wealth of a gambler betting against a hypothesis, likelihood ratios as the standard example, and optional stopping as the reason its value at any stopping time stays a fair bet."}, {"title": "Pólya’s urn, run to its limit", "url": "https://services.math.duke.edu/~rtd/PTE/pte.html", "type": "project", "by": "Built on Durrett, Probability: Theory and Examples, 2019", "level": 1, "build": "Thousands of Pólya urns run for 10,000 draws each, the fraction of green balls tracked as a martingale, and a histogram of where each one settles.", "teaches": "Martingale convergence as something you watch: every path settles down, but where it settles stays random, with a law that exchangeability predicts.", "time": "an afternoon", "made": true, "done": "Limits are uniform when the urn starts with one ball of each color and have density 2x from two green and one red, as in Durrett Section 4.3.2."}]}, {"id": "markov", "title": "Markov chains and mixing times", "kind": "concept", "track": "prob", "pre": ["probug", "linalg"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "A finite irreducible aperiodic chain forgets where it started and converges to its stationary distribution. Mixing time asks how fast, and coupling answers it: run two copies until they meet, and the distance from stationarity is at most the chance they have not met.", "reach": "Spectral gaps tie mixing to linear algebra; the same chains drive MCMC, randomized algorithms, and the queues of EE 226B.", "uses": "MCMC samplers for Bayesian inference, PageRank, how many riffle shuffles mix a deck (about seven for 52 cards), randomized approximate counting, Markov decision processes in reinforcement learning, and queueing networks.", "worth": "you use MCMC, reinforcement learning, or randomized algorithms; stationary distributions and coupling come quickly, and spectral gap bounds reward a second pass.", "resources": [{"title": "Essentials of Stochastic Processes", "url": "https://services.math.duke.edu/~rtd/EOSP/eosp.html", "type": "book", "by": "Rick Durrett, 3rd edition, Springer, 2016", "level": 1, "note": "Chapter 1: stationary distributions, detailed balance, the convergence theorem, and exit times, with many examples; free from the author."}, {"title": "Markov Chains and Mixing Times", "url": "https://pages.uoregon.edu/dlevin/MARKOV/mcmt2e.pdf", "type": "book", "by": "David Levin, Yuval Peres, Elizabeth Wilmer, 2nd edition, AMS, 2017", "level": 2, "note": "Chapters 4 and 5 define mixing time and bound it by coupling; Chapter 12 does the same with eigenvalues and the relaxation time."}, {"title": "Introduction to Probability Models", "url": "https://shop.elsevier.com/books/introduction-to-probability-models/ross/978-0-443-18761-2", "type": "book", "by": "Sheldon Ross, 13th edition, Elsevier, 2023", "level": 1, "note": "Chapters 4 and 6: discrete and continuous time chains with many worked problems; the text for Stanford’s Math 136 in Fall 2025.", "paid": true}, {"title": "Reversible Markov Chains and Random Walks on Graphs", "url": "https://www.stat.berkeley.edu/~aldous/RWG/book.html", "type": "book", "by": "David Aldous, James Allen Fill, unfinished monograph", "level": 3, "note": "An unfinished research monograph on reversible chains and random walks on graphs, free as one PDF."}, {"title": "The Markov chain Monte Carlo revolution", "url": "https://www.ams.org/journals/bull/2009-46-02/S0273-0979-08-01238-X/", "type": "section", "by": "Persi Diaconis, Bulletin of the AMS, 2009", "level": 1, "section": "Section 2, A brief treatise on Markov chains", "covers": "The fundamental theorem of Markov chains, the Metropolis algorithm and why detailed balance makes its target stationary, and the eigenvalue bound on distance to stationarity for reversible chains, applied to breaking a substitution cipher."}, {"title": "Data 140 Lab 3: Code Breaking by MCMC", "url": "https://github.com/data-140-berkeley/materials-fa26/blob/main/lab/Lab_03.ipynb", "type": "project", "by": "Data 140, Berkeley, Fall 2026", "level": 1, "build": "A Metropolis chain on substitution ciphers, scored by a bigram Markov chain fitted to English text, that decodes a scrambled message.", "teaches": "How a chain built to have a chosen stationary distribution searches an enormous space, and why the proposal and the score both matter.", "time": "a day"}, {"title": "Seven shuffles: exact mixing of the riffle shuffle", "url": "https://projecteuclid.org/journals/annals-of-applied-probability/volume-2/issue-2/Trailing-the-Dovetail-Shuffle-to-its-Lair/10.1214/aoap/1177005705.full", "type": "project", "by": "Built on Bayer and Diaconis, 1992", "level": 2, "build": "Exact total variation distance from uniform after k riffle shuffles of n cards, from the rising sequence formula, checked against simulated riffle shuffles.", "teaches": "Mixing time and cutoff as numbers: the distance stays near 1, then collapses within a few shuffles around (3/2) log2 n.", "time": "a day", "made": true, "done": "For 52 cards, the distance after 5, 6, 7, and 8 shuffles is 0.924, 0.614, 0.334, and 0.167, the values Bayer and Diaconis computed."}]}, {"id": "brownian", "title": "Brownian motion (Stat 205B)", "kind": "concept", "track": "prob", "pre": ["martingales"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "Brownian motion is the scaling limit of every finite-variance random walk (Donsker): continuous, nowhere differentiable, with independent Gaussian increments. The strong Markov property lets it restart afresh at stopping times, so the reflection principle gives the law of its running maximum.", "reach": "It is the central limit theorem for whole paths; stochastic calculus integrates against it, and empirical process theory uses its bridge for the Kolmogorov-Smirnov limit.", "uses": "Models of stock prices, particle diffusion, and thermal noise, the limiting law behind the Kolmogorov-Smirnov test, Langevin sampling, and the forward noising process of diffusion models.", "worth": "stochastic calculus, diffusion model theory, or finance is the aim; it is a checkpoint, and continuous-time probability rests on it.", "resources": [{"title": "Brownian Motion", "url": "https://www.mi.uni-koeln.de/~moerters/book/book.pdf", "type": "book", "by": "Peter Mörters, Yuval Peres, Cambridge, 2010", "level": 2, "note": "Chapters 1, 2, and 5: construction and path properties, the strong Markov property and reflection, and Donsker’s theorem; the book Berkeley’s 205B points to, free from the author."}, {"title": "Stochastic Processes (Stanford Math 136 lecture notes)", "url": "https://adembo.su.domains/math-136/nnotes.pdf", "type": "notes", "by": "Amir Dembo, revised by Kevin Ross, Stanford, 2021", "level": 1, "note": "Chapter 5: a shorter route through construction, the reflection principle, hitting times, and the variation of sample paths."}, {"title": "Probability Theory: Stat C205B lecture notes", "url": "https://www.stat.berkeley.edu/~aldous/205B/chewi_notes.pdf", "type": "notes", "by": "David Aldous, Berkeley, Spring 2017, scribed by Sinho Chewi", "level": 2, "note": "Berkeley’s 205B as one instructor taught it: weak convergence, Markov chains, and ergodic theory, then Skorokhod embedding, Donsker’s theorem, and the arcsine laws."}, {"title": "Brownian Motion, Martingales, and Stochastic Calculus", "url": "https://link.springer.com/book/10.1007/978-3-319-31089-3", "type": "book", "by": "Jean-François Le Gall, Springer, 2016", "level": 3, "note": "Chapters 1 to 3: Gaussian processes, Brownian motion, and continuous time martingales, the setup for stochastic integration.", "paid": true}, {"title": "Donsker in action: the reflection principle and the arcsine laws", "url": "https://www.mi.uni-koeln.de/~moerters/book/book.pdf", "type": "project", "by": "Built on Mörters and Peres, Brownian Motion, 2010", "level": 2, "build": "Rescaled random walks with coin flip and uniform steps, simulated many times, recording each walk’s running maximum, last zero, and time spent positive.", "teaches": "Why one Brownian limit governs every finite variance walk, and how surprising its laws are: the last zero is most likely near an end.", "time": "a day", "made": true, "done": "For walks of 10,000 steps, P(max ≥ √n) is within 0.01 of 2P(Z ≥ 1) = 0.317 (Theorem 5.25), and last zero and time positive fit the arcsine law (Theorems 5.26, 5.28)."}]}, {"id": "stochcalc", "title": "Stochastic calculus", "kind": "concept", "track": "prob", "pre": ["brownian"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "A Brownian path has quadratic variation t, so (dB)^2 = dt and the second-order Taylor term survives: Itô’s formula df(B) = f’(B) dB + (1/2) f’’(B) dt. Girsanov’s theorem adds the other half: changing the drift is a change of measure.", "reach": "Turns SDEs into PDEs (Feynman-Kac, Fokker-Planck) and underlies option pricing, diffusion models, filtering, and the stochastic control of EE 226B.", "uses": "Black-Scholes option pricing, the reverse-time SDEs of score-based diffusion models, Langevin dynamics for sampling, Kalman-Bucy filtering, stochastic control, and SDE approximations of SGD’s noise.", "worth": "you work on diffusion models, quantitative finance, or control; Itô’s formula and Girsanov carry most applications, and the construction can wait.", "resources": [{"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 1, "note": "Chapters 3 and 4: a pragmatic derivation of the Itô integral, Itô’s formula, and SDEs before the rigor."}, {"title": "Stochastic Calculus, Filtering, and Stochastic Control", "url": "https://web.math.princeton.edu/~rvan/acm217/ACM217.pdf", "type": "notes", "by": "Ramon van Handel, Caltech ACM 217, 2007", "level": 2, "note": "Chapters 3 to 5: the Wiener process, the Itô integral with Girsanov’s theorem, and SDEs, with proofs."}, {"title": "Stochastic Differential Equations: An Introduction with Applications", "url": "https://link.springer.com/book/10.1007/978-3-642-14394-6", "type": "book", "by": "Bernt Øksendal, 6th edition, Springer, 2003", "level": 2, "note": "Chapters 3 to 5: Itô integrals, the Itô formula with martingale representation, and SDEs, with worked examples.", "paid": true}, {"title": "Brownian Motion, Martingales, and Stochastic Calculus", "url": "https://link.springer.com/book/10.1007/978-3-319-31089-3", "type": "book", "by": "Jean-François Le Gall, Springer, 2016", "level": 3, "note": "Chapters 4, 5, and 8: continuous semimartingales, stochastic integration, and SDEs at full rigor.", "paid": true}, {"title": "An Algorithmic Introduction to Numerical Simulation of Stochastic Differential Equations", "url": "https://webhomes.maths.ed.ac.uk/~dhigham/Publications/P42.pdf", "type": "section", "by": "Desmond Higham, SIAM Review, 2001", "level": 1, "section": "Section 8, Stochastic Chain Rule", "covers": "Itô’s formula and its extra (1/2) g^2 V’’ dt term, checked by simulation: solving the SDE that the chain rule gives for sqrt(X) tracks the square root of the simulated X."}, {"title": "An Algorithmic Introduction to Numerical Simulation of SDEs: the programs", "url": "https://webhomes.maths.ed.ac.uk/~dhigham/algfiles.html", "type": "project", "by": "Desmond Higham, SIAM Review, 2001", "level": 1, "note": "The ten short MATLAB files accompany the paper; write each yourself first.", "build": "Simulations of Brownian paths, Itô and Stratonovich integrals, and the Euler-Maruyama and Milstein schemes, with measured strong and weak convergence orders and a stability test.", "teaches": "Itô calculus as numbers you can check: why the two integrals disagree, and why convergence orders are half what ODE intuition suggests.", "time": "a weekend", "signature": true}]}, {"id": "concentration", "title": "Concentration and high-dimensional probability", "kind": "concept", "track": "prob", "pre": ["measureprob", "linalg"], "frontier": false, "tier": "graduate", "core": "A smooth function of many independent variables, none of which matters much, is nearly constant: it strays from its mean by t standard deviations with probability at most about exp(-ct^2). Chernoff bounds prove this for sums; bounded differences and Gaussian concentration extend it.", "reach": "The working tool of empirical processes, high-dimensional statistics, and random matrix theory; in learning theory it turns one fixed hypothesis into a sample size bound.", "uses": "Sample complexity and generalization bounds, Johnson-Lindenstrauss dimension reduction, randomized linear algebra and sketching, compressed sensing guarantees, confidence bounds in bandit algorithms such as UCB, and high-dimensional covariance estimation.", "worth": "learning theory, high-dimensional statistics, or randomized algorithms are in your reading; Hoeffding, Bernstein, and sub-Gaussian tails cover most of it.", "resources": [{"title": "High-Dimensional Probability", "url": "https://www.math.uci.edu/~rvershyn/papers/HDP-book/HDP-book.html", "type": "book", "by": "Roman Vershynin, 2nd edition, 2026", "level": 1, "note": "Chapters 2, 3, and 5: sums, random vectors, and concentration without independence, written for self-study."}, {"title": "Concentration Inequalities: A Nonasymptotic Theory of Independence", "url": "https://global.oup.com/academic/product/concentration-inequalities-9780199535255", "type": "book", "by": "Stéphane Boucheron, Gábor Lugosi, Pascal Massart, Oxford, 2013", "level": 2, "note": "The standard reference: the entropy method, bounded differences, and Gaussian concentration, with full proofs.", "paid": true}, {"title": "Probability in High Dimension (APC 550 lecture notes)", "url": "https://web.math.princeton.edu/~rvan/APC550.pdf", "type": "notes", "by": "Ramon van Handel, Princeton, 2016", "level": 3, "note": "Chapters 2 to 4 explain why concentration holds: tensorization, Poincaré and log-Sobolev inequalities, and transportation."}, {"title": "Concentration of Measure Inequalities in Information Theory, Communications and Coding", "url": "https://arxiv.org/html/1212.4663v8#Ch2.S2", "type": "section", "by": "Maxim Raginsky, Igal Sason, 2nd edition, 2014", "level": 2, "section": "Section 2.2, Basic concentration inequalities", "covers": "The martingale method in two moves, a martingale decomposition along a filtration plus the Chernoff bound, and the Hoeffding lemma, Azuma-Hoeffding, and McDiarmid’s bounded differences inequality that follow, with proofs."}, {"title": "Hoeffding against Bernstein on a biased coin", "url": "https://www.stat.berkeley.edu/~zhivotovskiy/Stat210BLectureNotes.pdf", "type": "project", "by": "Built on Zhivotovskiy’s Stat 210B notes, 2026", "level": 1, "build": "Exact binomial tail probabilities P(|mean - p| ≥ t), plotted against Hoeffding’s and Bernstein’s bounds for p from 0.5 down to 0.01.", "teaches": "What a concentration bound gives up: Hoeffding ignores the variance and Bernstein uses it, so which one wins depends on the coin.", "time": "an afternoon", "made": true, "done": "Exact tails never exceed bounds (2) and (4) of Section 3.6; Hoeffding is tighter at p = 0.5, and Bernstein tighter by orders of magnitude at p = 0.01, n = 1000."}]}, {"id": "randommatrix", "title": "Random matrix theory", "kind": "concept", "track": "prob", "pre": ["concentration", "complex"], "frontier": false, "tier": "advanced", "core": "The eigenvalues of a large symmetric matrix with independent entries, scaled by 1/sqrt(n), fill Wigner’s semicircle whatever the entries’ distribution. The proof counts: E tr(X^k)/n sums over closed walks of length k, and only non-crossing pairings, counted by Catalan numbers, survive.", "reach": "Explains PCA thresholds and Marchenko-Pastur in high-dimensional statistics and spectra of neural network Hessians, and opens onto free probability.", "uses": "Sample covariance spectra in finance and genomics, the BBP phase transition that says when PCA can detect a signal, MIMO wireless capacity, nuclear energy levels, and spectra of neural network weights and Hessians.", "worth": "high-dimensional statistics, deep learning theory, or wireless is your field; the semicircle and Marchenko-Pastur laws plus the BBP transition are most cited.", "resources": [{"title": "Introduction to Random Matrices: Theory and Practice", "url": "https://arxiv.org/abs/1712.07903", "type": "book", "by": "Giacomo Livan, Marcel Novaes, Pierpaolo Vivo, 2017", "level": 1, "note": "Chapters 1 to 8 reach the semicircle by several routes at an easy pace; Chapter 14 derives Marchenko-Pastur."}, {"title": "Topics in Random Matrix Theory", "url": "https://terrytao.files.wordpress.com/2011/02/matrix-book.pdf", "type": "book", "by": "Terence Tao, AMS, 2012", "level": 2, "note": "Sections 2.3 and 2.4: the operator norm, then the semicircular law by the moment method and the Stieltjes transform."}, {"title": "An Introduction to Random Matrices", "url": "https://www.wisdom.weizmann.ac.il/~zeitouni/cupbook.pdf", "type": "book", "by": "Greg Anderson, Alice Guionnet, Ofer Zeitouni, Cambridge, 2010", "level": 3, "note": "Chapter 2: Wigner matrices through combinatorics, concentration, and Stieltjes transforms, with complete proofs."}, {"title": "Universality of Wigner random matrices: a Survey of Recent Results", "url": "https://arxiv.org/html/1004.0861v2#S1.SS4.SSS2", "type": "section", "by": "László Erdős, 2011", "level": 2, "section": "Section 1.4.2, The moment method", "covers": "Wigner’s original route in one page: in E tr H^k only backtracking index paths survive, Catalan numbers count them, and summing the moments gives the Stieltjes transform of the semicircle."}, {"title": "Wigner’s semicircle by the moment method", "url": "https://terrytao.files.wordpress.com/2011/02/matrix-book.pdf", "type": "project", "by": "Built on Tao, Topics in Random Matrix Theory, 2012", "level": 2, "build": "Symmetric matrices with Gaussian and with random sign entries, scaled by 1/√n, with eigenvalue histograms against the semicircle and the traces of their powers.", "teaches": "Universality you can see, and the counting behind it: only non-crossing pairings survive in tr(M^k)/n as n grows.", "time": "a day", "made": true, "done": "At n = 2000, for both entry types, even moments match the Catalan numbers 1, 2, 5, 14 (Lemma 2.3.15) within 2 percent, and the top eigenvalue is within 0.05 of 2."}]}, {"id": "ergodic", "title": "Ergodic theory", "kind": "concept", "track": "prob", "pre": ["measureprob", "markov"], "frontier": false, "tier": "advanced", "core": "Along almost every orbit of a measure-preserving map, time averages converge (Birkhoff), and the limit is the space average exactly when the system is ergodic: no invariant set has measure strictly between 0 and 1. It is the strong law for stationary sequences.", "reach": "Justifies MCMC averages over Markov chains and entropy rates in information theory; the subadditive theorem handles first passage percolation.", "uses": "Justifying that one long MCMC or simulation run estimates expectations, entropy rates through the Shannon-McMillan-Breiman theorem, statistical mechanics, and the digit statistics of continued fractions.", "worth": "you need time averages along one long trajectory, as in MCMC or information theory; Birkhoff’s theorem and the definitions are usually enough.", "resources": [{"title": "Probability: Theory and Examples", "url": "https://services.math.duke.edu/~rtd/PTE/pte.html", "type": "book", "by": "Rick Durrett, 5th edition, Cambridge, 2019", "level": 2, "note": "Chapter 6: definitions and examples, Birkhoff’s theorem, recurrence, and the subadditive ergodic theorem, written for probabilists."}, {"title": "Lecture Notes on Ergodic Theory", "url": "https://www.weizmann.ac.il/math/sarigo/sites/math.sarigo/files/uploads/ergodicnotes.pdf", "type": "notes", "by": "Omri Sarig, Weizmann Institute, 2023", "level": 2, "note": "Chapters 1 and 2: ergodicity and mixing with many examples, then the mean, pointwise, subadditive, and multiplicative ergodic theorems."}, {"title": "Ergodic Theory with a view towards Number Theory", "url": "https://link.springer.com/book/10.1007/978-0-85729-021-2", "type": "book", "by": "Manfred Einsiedler, Thomas Ward, Springer, 2011", "level": 3, "note": "Chapter 2 (ergodicity, recurrence, and mixing) is the core; later chapters turn the theory on number theory.", "paid": true}, {"title": "Birkhoff averages: Benford’s law and continued fraction digits", "url": "https://services.math.duke.edu/~rtd/PTE/pte.html", "type": "project", "by": "Built on Durrett, Probability: Theory and Examples, 2019", "level": 1, "build": "Time averages along two ergodic orbits: leading digits of 2^m, from rotating the circle by log10 2, and continued fraction digits of random reals, from the Gauss map.", "teaches": "The ergodic theorem as a tool: an average along one orbit equals a space average you can compute, with number theory as the payoff.", "time": "an afternoon", "made": true, "done": "Leading digits of 2^m for m below 100,000 match Example 6.2.7’s table (0.3010 for 1, 0.0458 for 9), and continued fraction digit 1 appears with frequency log2(4/3) = 0.415."}]}, {"id": "stein", "title": "Stein's method", "kind": "concept", "track": "prob", "pre": ["measureprob"], "frontier": false, "tier": "advanced", "core": "Z is standard normal exactly when E[f’(Z) - Zf(Z)] = 0 for all smooth f. So solve f’ - xf = h - Eh(Z) for a test function h; then Eh(W) - Eh(Z) equals E[f’(W) - Wf(W)], which local dependence or a coupling can bound.", "reach": "Gives explicit error rates for central limit theorems under dependence, Poisson approximation, and normal approximation in random graphs and permutations.", "uses": "Error bounds for normal and Poisson approximation under dependence, kernel Stein discrepancies that check MCMC samples against a target, Stein variational gradient descent, and Stein’s unbiased risk estimate for tuning shrinkage.", "worth": "you prove central limit theorems with rates or use Stein discrepancies; others can learn the characterizing identity and stop there.", "resources": [{"title": "Fundamentals of Stein’s method", "url": "https://arxiv.org/abs/1109.1880", "type": "paper", "by": "Nathan Ross, Probability Surveys, 2011", "level": 1, "note": "Sections 2 and 3: the Stein equation, then dependency neighborhoods, exchangeable pairs, and size bias and zero bias couplings."}, {"title": "A short survey of Stein’s method", "url": "https://arxiv.org/abs/1404.1392", "type": "paper", "by": "Sourav Chatterjee, ICM, 2014", "level": 2, "note": "A short survey of the method’s history and recent advances, then a general perturbative variant applied to minimal spanning trees."}, {"title": "Normal Approximation by Stein’s Method", "url": "https://link.springer.com/book/10.1007/978-3-642-15007-4", "type": "book", "by": "Louis Chen, Larry Goldstein, Qi-Man Shao, Springer, 2011", "level": 3, "note": "Chapters 2 and 3: the fundamentals and Berry-Esseen bounds for independent sums; later chapters treat local dependence and nonlinear statistics.", "paid": true}, {"title": "Stein’s Method Meets Computational Statistics: A Review of Some Recent Developments", "url": "https://arxiv.org/html/2105.03481v2#S2", "type": "section", "by": "Anastasiou et al., 2023", "level": 2, "section": "Section 2, The Basic Ingredients of Stein’s Method", "covers": "Stein operators, Stein classes, and Stein discrepancies, the Stein equation that ties them to integral probability metrics, and the generator and density recipes for building an operator for a new target."}, {"title": "Poisson approximation for head runs, with Stein’s bound", "url": "https://arxiv.org/abs/1109.1880", "type": "project", "by": "Built on Ross, Fundamentals of Stein’s method, 2011", "level": 2, "build": "The exact distribution of the number of head runs of length at least k in n coin tosses, by dynamic programming, and its distance to Poisson.", "teaches": "What Stein’s method buys: an explicit error for a Poisson limit under local dependence, and how close that error comes to the truth.", "time": "a day", "made": true, "done": "Total variation distance to Poisson(λ) stays below Theorem 4.8’s bound λ²(2k+1)/(n-k+1) + 2λp^k for every n up to 10,000, p, and k tried."}]}, {"id": "pointset", "title": "Point-set topology", "kind": "concept", "track": "topology", "pre": ["metric"], "frontier": false, "tier": "upper div", "core": "A topology only declares which sets are open, and continuity means preimages of open sets are open. Compactness (every open cover has a finite subcover) makes infinite problems behave finitely, and Tychonoff’s theorem says any product of compact spaces is compact.", "reach": "Feeds algebraic topology, manifolds, weak topologies, and weak convergence of probability measures.", "uses": "The vocabulary of weak convergence, function spaces, and manifolds; the payoff is mostly fluency in later courses, plus existence of equilibria in game theory and economics through compactness.", "worth": "algebraic topology, functional analysis, or measure-theoretic probability is ahead; the metric space version covers most needs, so learn the rest briefly.", "resources": [{"title": "Topology (2nd edition)", "url": "https://www.pearson.com/en-us/subject-catalog/p/topology/P200000006299/9780137848669", "type": "book", "by": "James Munkres, Pearson, 2000", "level": 2, "note": "Chapters 2 to 5 (Sections 12 to 38) cover topological spaces, connectedness and compactness, countability and separation axioms, and Tychonoff’s theorem.", "paid": true}, {"title": "MIT 18.901: Introduction to Topology", "url": "https://ocw.mit.edu/courses/18-901-introduction-to-topology-fall-2004/", "type": "course", "by": "James Munkres, MIT OpenCourseWare, 2004", "level": 1, "note": "Munkres teaching from his own book, with weekly readings by section, problem sets, and his supplementary notes."}, {"title": "Counterexamples in Topology", "url": "https://store.doverpublications.com/products/9780486687353", "type": "book", "by": "Lynn Steen, J. Arthur Seebach, Dover, 1995", "level": 3, "note": "A catalog of spaces that break plausible conjectures, for testing each new definition.", "paid": true}, {"title": "Formalising Mathematics, Section 10: Topological Spaces", "url": "https://github.com/ImperialCollegeLondon/formalising-mathematics-2024/tree/main/FormalisingMathematics2024/Section10TopologicalSpaces", "type": "project", "by": "Kevin Buzzard, Imperial College London, 2024", "level": 2, "build": "Lean definitions of the discrete and indiscrete topologies and of the usual topology on the reals from open sets, then proofs about continuous maps between topological spaces.", "teaches": "That a topology is nothing but its open sets, and that continuity follows from preimages alone, with no distance anywhere.", "time": "an afternoon"}, {"title": "Count the topologies on a finite set", "url": "https://oeis.org/A000798", "type": "project", "by": "Built on OEIS A000798", "level": 2, "build": "Code that enumerates every topology on a set of n points, then checks that topologies match preorders and that T0 topologies match partial orders.", "teaches": "What the open-set axioms permit on a finite set, and why a finite topology is the same thing as a preorder.", "time": "a day", "made": true, "done": "Direct enumeration finds 355 topologies on 4 points, the preorder count gives 6942 on 5, and the T0 counts of 219 and 4231 match OEIS A001035."}]}, {"id": "curves", "title": "Differential geometry of curves and surfaces (Math 140)", "kind": "concept", "track": "topology", "pre": ["severalvar"], "frontier": false, "tier": "upper div", "core": "Gaussian curvature, the product of a surface’s two principal curvatures, can be computed from distances measured inside the surface (Theorema Egregium), so every flat map of the sphere distorts it. Gauss-Bonnet ties total curvature to topology: it equals 2π times the Euler characteristic.", "reach": "Riemannian geometry extends intrinsic curvature to any dimension; discrete versions drive geometry processing.", "uses": "Computer graphics and geometry processing, map projections and why every flat map distorts, path planning with curvature limits for cars and robots, and intuition for Riemannian geometry and manifold learning.", "worth": "you want geometric intuition before Riemannian geometry, or you work in graphics; for probability and statistics, it is optional.", "resources": [{"title": "MIT 18.950: Differential Geometry", "url": "https://ocw.mit.edu/courses/18-950-differential-geometry-fall-2008/", "type": "course", "by": "Paul Seidel, MIT OpenCourseWare, 2008", "level": 1, "note": "Four chapters of lecture notes on plane curves, the local and global geometry of hypersurfaces, and lengths and distances; the Berkeley course is Math 140."}, {"title": "Differential Geometry of Curves and Surfaces (revised 2nd edition)", "url": "https://store.doverpublications.com/products/9780486806990", "type": "book", "by": "Manfredo do Carmo, Dover, 2016", "level": 2, "note": "Chapters 1 to 4 (curves, regular surfaces, the Gauss map, intrinsic geometry) reach the Theorema Egregium and Gauss-Bonnet.", "paid": true}, {"title": "Discrete Differential Geometry: An Applied Introduction", "url": "https://www.cs.cmu.edu/~kmcrane/Projects/DDG/", "type": "notes", "by": "Keenan Crane, CMU, 2022", "level": 2, "note": "Notes and a full set of video lectures on curvature, exterior calculus, and Stokes’ theorem as algorithms on meshes."}, {"title": "DDG Assignment 2: Investigating Curvature", "url": "https://brickisland.net/DDGSpring2022/2022/02/22/assignment-2-coding-investigating-curvature/", "type": "project", "by": "Keenan Crane, CMU 15-458/858, 2022", "level": 2, "build": "Discrete curvatures on triangle meshes: angle defects, dihedral angles, mean and principal curvatures, and five kinds of vertex normal, drawn on the surface.", "teaches": "Gaussian curvature as an angle defect you can add up, so total curvature on a closed mesh comes out to 2π times its Euler characteristic.", "time": "a week"}]}, {"id": "algtop", "title": "Algebraic topology (Math 215A)", "kind": "concept", "track": "topology", "pre": ["pointset", "groups"], "frontier": false, "tier": "graduate", "core": "Attach algebraic invariants that survive continuous deformation: the fundamental group records loops, and homology records holes in each dimension. Maps induce homomorphisms, so topology becomes algebra: the disk does not retract onto its boundary circle, which proves Brouwer’s fixed point theorem.", "reach": "Fixed point theorems give existence of equilibria; homology drives topological data analysis and de Rham cohomology on manifolds.", "uses": "Brouwer’s fixed point theorem behind Nash’s proof that equilibria exist, persistent homology in topological data analysis, sensor network coverage, robot configuration spaces, and impossibility results such as the hairy ball theorem.", "worth": "topological data analysis, geometry, or pure topology is your direction; for probability and statistics, Brouwer’s theorem and the idea of homology suffice.", "resources": [{"title": "Algebraic Topology", "url": "https://pi.math.cornell.edu/~hatcher/AT/ATpage.html", "type": "book", "by": "Allen Hatcher, Cambridge, 2002", "level": 2, "note": "Chapter 1 (fundamental group, van Kampen, covering spaces) and Chapter 2 (homology), with Chapter 0 first if CW complexes are new; the Berkeley course is Math 215A."}, {"title": "MIT 18.905: Algebraic Topology I", "url": "https://ocw.mit.edu/courses/18-905-algebraic-topology-i-fall-2016/", "type": "course", "by": "Haynes Miller, MIT OpenCourseWare, 2016", "level": 2, "note": "Lecture notes on singular homology, CW complexes, homological algebra, cohomology, and Poincaré duality, in a more categorical style."}, {"title": "Differential Forms in Algebraic Topology", "url": "https://link.springer.com/book/10.1007/978-1-4757-3951-0", "type": "book", "by": "Raoul Bott, Loring Tu, Springer, 1982", "level": 3, "note": "Chapter 1 (de Rham theory) computes cohomology with differential forms, the bridge to manifolds.", "paid": true}, {"title": "Barcodes: The persistent topology of data", "url": "https://www.ams.org/journals/bull/2008-45-01/S0273-0979-07-01191-3/", "type": "section", "by": "Robert Ghrist, Bulletin of the AMS, 2008", "level": 2, "section": "Section 2, Algebraic topology for data", "covers": "Why the homology of one complex built on a point cloud misleads, and how the maps a growing chain of complexes induces on homology, sorted by the structure theorem over a PID, give barcodes."}, {"title": "GUDHI TDA tutorials", "url": "https://github.com/GUDHI/TDA-tutorial", "type": "project", "by": "The GUDHI project, Inria", "level": 2, "build": "Simplicial complexes built from point clouds, Vietoris-Rips and alpha complexes, then persistence diagrams compared with the bottleneck distance, in Python notebooks.", "teaches": "Homology as a computation you can run on data, and which features of a shape persist across scales.", "time": "a weekend", "signature": true}]}, {"id": "manifolds", "title": "Smooth manifolds (Math 214)", "kind": "concept", "track": "topology", "pre": ["severalvar", "pointset"], "frontier": false, "tier": "graduate", "core": "A manifold looks like R^n near every point, with smooth coordinate changes, so calculus works locally. Forms and tangent vectors need no coordinates, and Stokes’ theorem (integrating dω over M equals integrating ω over its boundary) contains Green, Gauss, and the fundamental theorem.", "reach": "Riemannian geometry adds a metric, Lie groups are manifolds that are also groups, and diffusions on manifolds use both.", "uses": "Optimization over rotations, orthogonal, and low-rank matrices, general relativity, robot configuration spaces, symplectic integrators in Hamiltonian Monte Carlo, the manifold hypothesis in representation learning, and Stokes’ theorem across physics.", "worth": "geometric deep learning, optimization on manifolds, or Riemannian geometry is next; others can rely on several-variable calculus and the definitions.", "resources": [{"title": "Lectures on Geometrical Anatomy of Theoretical Physics", "url": "https://www.youtube.com/playlist?list=PLPH7f_7ZlzxTi6kS4vCmv4ZKm9u8g5yic", "type": "lectures", "by": "Frederic Schuller, 2015", "level": 1, "note": "Lectures 6 to 12 build topological and smooth manifolds, tangent spaces and bundles, tensors, and differential forms up to de Rham cohomology."}, {"title": "Introduction to Smooth Manifolds (2nd edition)", "url": "https://link.springer.com/book/10.1007/978-1-4419-9982-5", "type": "book", "by": "John Lee, Springer, 2012", "level": 2, "note": "Chapters 1 to 5, 8, 11, and 14 to 16 run from charts and tangent vectors through vector fields and covectors to differential forms and Stokes’ theorem; the Berkeley course is Math 214.", "paid": true}, {"title": "Topology from the Differentiable Viewpoint", "url": "https://press.princeton.edu/books/paperback/9780691048338/topology-from-the-differentiable-viewpoint", "type": "book", "by": "John Milnor, Princeton, 1965", "level": 2, "note": "Eighty pages on Sard’s theorem and the degree of a map, ending in smooth proofs of results such as Brouwer’s fixed point theorem.", "paid": true}, {"title": "DDG Assignment 1: Exterior Calculus", "url": "https://brickisland.net/DDGSpring2022/2022/02/03/assignment-1-coding-exterior-calculus/", "type": "project", "by": "Keenan Crane, CMU 15-458/858, 2022", "level": 2, "build": "The discrete exterior derivatives on 0-forms and 1-forms and the Hodge stars on 0-, 1-, and 2-forms of a triangle mesh, built with the cotan formula.", "teaches": "Differential forms as numbers on vertices, edges, and faces, where Stokes’ theorem defines d and applying d twice gives zero automatically.", "time": "a week"}, {"title": "DDG Assignment 6: Vector Field Decomposition and Design", "url": "https://brickisland.net/DDGSpring2022/2022/04/29/extra-assignment-6-coding-vector-field-decomposition-and-design-due-5-14/", "type": "project", "by": "Keenan Crane, CMU 15-458/858, 2022", "level": 3, "build": "Homology generators by the tree-cotree algorithm, a basis of harmonic 1-forms, and a Hodge decomposition of a 1-form into exact, coexact, and harmonic parts.", "teaches": "De Rham cohomology made computable: a closed surface of genus g carries exactly 2g independent harmonic fields, and you find them.", "time": "a week"}]}, {"id": "riemannian", "title": "Riemannian geometry", "kind": "concept", "track": "topology", "pre": ["manifolds", "curves"], "frontier": false, "tier": "advanced", "core": "A Riemannian metric is an inner product on each tangent space, which gives lengths, angles, and geodesics. Comparing vectors at different points needs a connection, and curvature measures how parallel transport around a small loop fails to bring a vector back to itself.", "reach": "Optimization on manifolds, the information geometry of statistical models, Brownian motion on manifolds, and Wasserstein geometry.", "uses": "General relativity, optimization on matrix manifolds, natural gradient and the Fisher information metric, Riemannian Hamiltonian Monte Carlo, hyperbolic embeddings of hierarchies, and the geometry of Wasserstein space.", "worth": "you work on information geometry, manifold optimization, or geometric learning; otherwise, metrics, geodesics, and what curvature means are enough.", "resources": [{"title": "An Introduction to Optimization on Smooth Manifolds", "url": "https://www.nicolasboumal.net/book/", "type": "book", "by": "Nicolas Boumal, Cambridge, 2023", "level": 1, "note": "The free preprint’s Chapters 3 and 5 build Riemannian gradients, connections, and Hessians on embedded submanifolds, Chapter 8 generalizes them, and Chapter 11 covers geodesic convexity."}, {"title": "Introduction to Riemannian Manifolds (2nd edition)", "url": "https://link.springer.com/book/10.1007/978-3-319-91755-9", "type": "book", "by": "John Lee, Springer, 2018", "level": 2, "note": "Chapters 1 to 7 (metrics, model spaces, connections, geodesics and distance, curvature), then 9 to 11 (Gauss-Bonnet, Jacobi fields, comparison theory).", "paid": true}, {"title": "Hyperbolic Neural Networks", "url": "https://arxiv.org/html/1805.09112v2#S2", "type": "section", "by": "Ganea, Bécigneul, Hofmann, 2018", "level": 1, "section": "Section 2, The Geometry of the Poincaré Ball", "covers": "A page of Riemannian basics (metric, geodesic distance, parallel transport, exponential map), then each of them in closed form on the Poincaré ball, a model of hyperbolic space."}, {"title": "Poincaré embeddings with Riemannian SGD", "url": "https://arxiv.org/abs/1705.08039", "type": "project", "by": "Built on Nickel, Kiela, 2017", "level": 2, "build": "Riemannian stochastic gradient descent on the Poincaré ball, rescaling each Euclidean gradient by the inverse metric, used to embed the WordNet mammal hierarchy in 2 and 5 dimensions.", "teaches": "What a metric does to an optimizer: the gradient is the inverse metric applied to the differential, and negative curvature gives a tree room to spread.", "time": "a weekend", "made": true, "done": "In 5 dimensions the mammal subtree reaches mean rank near 1.26 and MAP near 0.927, the values in the caption of Figure 2."}]}, {"id": "lie", "title": "Lie groups and Lie algebras", "kind": "concept", "track": "topology", "pre": ["manifolds", "rep"], "frontier": false, "tier": "advanced", "core": "A Lie group is also a smooth manifold, so near the identity it is determined by its tangent space there, the Lie algebra, whose bracket [X, Y] measures failure to commute. The exponential map (e^X for matrices) carries the algebra back to the group.", "reach": "Equivariant networks, Haar measure on random rotations, and harmonic analysis on groups.", "uses": "Rotations and rigid motions in robotics, SLAM, and computer vision, Noether’s link between symmetries and conservation laws, equivariant networks over rotation groups, and sampling uniformly random rotations with Haar measure.", "worth": "robotics, physics, or equivariant ML is your work; matrix groups such as SO(3) and the exponential map cover most practical use.", "resources": [{"title": "Lectures on Geometrical Anatomy of Theoretical Physics", "url": "https://www.youtube.com/playlist?list=PLPH7f_7ZlzxTi6kS4vCmv4ZKm9u8g5yic", "type": "lectures", "by": "Frederic Schuller, 2015", "level": 1, "note": "Lectures 13 to 18 cover Lie groups and their algebras, Dynkin diagrams, SL(2,C), representations, and rebuilding a group from its algebra."}, {"title": "Lie Groups, Lie Algebras, and Representations (2nd edition)", "url": "https://link.springer.com/book/10.1007/978-3-319-13467-3", "type": "book", "by": "Brian Hall, Springer, 2015", "level": 2, "note": "Chapters 1 to 5 stay with matrix groups (the matrix exponential, Lie algebras, the Baker-Campbell-Hausdorff formula), and Chapter 6 works out sl(3;C) by hand.", "paid": true}, {"title": "Introduction to Lie Groups and Lie Algebras", "url": "https://www.math.stonybrook.edu/~kirillov/mat552/liegroups.pdf", "type": "book", "by": "Alexander Kirillov Jr., draft, 2005", "level": 2, "note": "Chapters 2 and 3 treat general Lie groups, the exponential map, and the commutator that defines the Lie algebra."}, {"title": "Representation Theory: A First Course", "url": "https://link.springer.com/book/10.1007/978-1-4612-0979-9", "type": "book", "by": "William Fulton, Joe Harris, Springer, 1991", "level": 3, "note": "Lectures 7 to 15 go from Lie groups to Lie algebras, then sl2, sl3, and the general semisimple case.", "paid": true}, {"title": "A micro Lie theory for state estimation in robotics", "url": "https://arxiv.org/html/1812.01537v9#S2", "type": "section", "by": "Joan Solà, Jeremie Deray, Dinesh Atchuthan, 2018", "level": 1, "section": "Section II, A micro Lie Theory", "covers": "Lie groups and their actions, the Lie algebra as the tangent space at the identity, the exponential and logarithm maps, the adjoint, and derivatives on groups, worked on unit complex numbers, quaternions, and rotations."}, {"title": "Exp, log, and the Campbell-Hausdorff series on SO(3)", "url": "https://www.math.stonybrook.edu/~kirillov/mat552/liegroups.pdf", "type": "project", "by": "Built on Kirillov, 2005", "level": 2, "build": "Rodrigues’ formula for exp and its inverse, log, on SO(3), checked against the matrix power series, then a numerical test of the Campbell-Hausdorff series on random pairs.", "teaches": "How the bracket alone fixes the group law near the identity, and where log stops being single-valued, at rotations by π.", "time": "a day", "made": true, "done": "Subtracting X + Y + [X, Y]/2 + ([X, [X, Y]] + [Y, [Y, X]])/12 from log(exp(X) exp(Y)) leaves an error of fourth order, confirming the 1/2 and 1/12 of equation (3.15)."}]}, {"id": "odes", "title": "ODE theory and dynamical systems", "kind": "concept", "track": "dynamics", "pre": ["severalvar", "linalg"], "frontier": false, "tier": "upper div", "core": "If the vector field is Lipschitz, Picard iteration is a contraction for short times, so solutions exist and are unique. Near an equilibrium the eigenvalues of the linearization decide stability (Hartman-Grobman), and in the plane a bounded orbit avoiding equilibria approaches a closed orbit (Poincaré-Bendixson).", "reach": "Supplies the flows behind characteristics in PDEs, Euler-Lagrange equations in the calculus of variations, the SDEs of stochastic calculus, and gradient descent as a dynamical system.", "uses": "Population models, circuits, and orbital mechanics, stability analysis in control, gradient flow views of optimization, neural ODEs, and the probability flow ODEs used to sample diffusion and flow matching models.", "worth": "optimization dynamics, control, or continuous-time generative models interest you; existence, uniqueness, and linear stability are the core and come quickly.", "resources": [{"title": "Nonlinear Dynamics and Chaos (lectures)", "url": "https://www.youtube.com/playlist?list=PLbN57C5Zdl6j_qJA-pARJnKsmROzPnO9V", "type": "lectures", "by": "Steven Strogatz, Cornell, 2014", "level": 1, "note": "Phase portraits, bifurcations, limit cycles, and chaos, built from pictures before proofs."}, {"title": "Nonlinear Dynamics and Chaos", "url": "https://www.routledge.com/Nonlinear-Dynamics-and-Chaos-With-Applications-to-Physics-Biology-Chemistry-and-Engineering/Strogatz/p/book/9780367026509", "type": "book", "by": "Steven Strogatz, 3rd edition, CRC Press, 2024", "level": 1, "note": "Chapters 2 to 8: flows on the line and the circle, bifurcations, the phase plane, and limit cycles.", "paid": true}, {"title": "Ordinary Differential Equations and Dynamical Systems", "url": "https://www.mat.univie.ac.at/~gerald/ftp/book-ode/ode.pdf", "type": "book", "by": "Gerald Teschl, AMS, 2012", "level": 2, "note": "Chapters 2, 3, 6, 7, and 9: existence and uniqueness, linear systems, stability and Lyapunov functions, Poincaré-Bendixson, and Hartman-Grobman, with proofs; free from the author."}, {"title": "The Lorenz equation, from stability to chaos", "url": "https://www.mat.univie.ac.at/~gerald/ftp/book-ode/ode.pdf", "type": "project", "by": "Built on Teschl, Ordinary Differential Equations and Dynamical Systems, 2012", "level": 2, "build": "A numerical study of the Lorenz equation: eigenvalues of its linearizations as r grows, simulated orbits, its Lyapunov function, and the shrinking volume of a cloud of starting points.", "teaches": "Linearization, Lyapunov functions, and trapping regions on one system, and where linearization stops telling the whole story.", "time": "a weekend", "made": true, "done": "With σ = 10 and b = 8/3, the two nonzero fixed points lose stability at r = 470/19 = 24.74, as Section 8.2 states, and every orbit reaches the origin when r ≤ 1."}]}, {"id": "pde", "title": "Partial differential equations (Math 222A)", "kind": "concept", "track": "dynamics", "pre": ["functional", "odes"], "frontier": false, "tier": "graduate", "core": "Constant coefficient linear PDEs are solved by convolution with a fundamental solution (the response to a point source), made rigorous by distributions; energy estimates and maximum principles give uniqueness. Nonlinear first-order equations are solved along characteristics until those cross, after which viscosity solutions take over.", "reach": "Math 222B continues with Sobolev spaces and elliptic theory; the calculus of variations minimizes energies, and stochastic calculus links the heat equation to Brownian motion.", "uses": "Heat, wave, and fluid equations across physics and engineering, the Black-Scholes equation, Fokker-Planck equations for diffusion model densities, image denoising, physics-informed neural networks, and Hamilton-Jacobi-Bellman equations in control.", "worth": "scientific ML, diffusion theory, control, or physics is your field; otherwise the heat equation, Fokker-Planck, and characteristics are enough.", "resources": [{"title": "MIT 18.152: Introduction to Partial Differential Equations", "url": "https://ocw.mit.edu/courses/18-152-introduction-to-partial-differential-equations-fall-2011/", "type": "course", "by": "Jared Speck, MIT OCW, 2011", "level": 1, "note": "Lecture notes on the heat, Laplace, and wave equations through fundamental solutions, maximum principles, and energy estimates."}, {"title": "Lecture Notes for Math 222A", "url": "https://math.berkeley.edu/~sjoh/pdfs/notes-math222a.pdf", "type": "notes", "by": "Sung-Jin Oh, Berkeley, Fall 2023", "level": 2, "note": "Berkeley’s 222A in full: nonlinear first-order equations, distributions, the Laplace, heat, and wave equations, the Fourier transform, energy methods, and Sobolev spaces."}, {"title": "Partial Differential Equations", "url": "https://doi.org/10.1090/gsm/019", "type": "book", "by": "Lawrence C. Evans, 2nd edition, AMS, 2010", "level": 2, "note": "The standard text: Part I (the four linear equations and nonlinear first-order equations) and the Hamilton-Jacobi chapter on viscosity solutions are 222A; Part II opens with Sobolev spaces.", "paid": true}, {"title": "FEniCSx tutorial: Computing convergence rates", "url": "https://jsdokken.com/dolfinx-tutorial/chapter4/convergence.html", "type": "project", "by": "Jørgen Dokken", "level": 2, "build": "A finite element solver for the Poisson equation whose error against an exact solution, measured in the L2 and H1 norms, falls at the rates the theory predicts.", "teaches": "Weak solutions and Sobolev norms as computable objects, with the theory’s error estimates checked as slopes on a plot.", "time": "a day", "signature": true}]}, {"id": "calcvar", "title": "Calculus of variations", "kind": "concept", "track": "dynamics", "pre": ["functional", "pde"], "frontier": false, "tier": "advanced", "core": "Setting the first variation of J[u] = ∫ L(x, u, u’) dx to zero gives the Euler-Lagrange equation. The direct method proves a minimizer exists: a minimizing sequence has a weakly convergent subsequence, and convexity of L in u’ makes J lower semicontinuous along it.", "reach": "Pontryagin’s principle extends Euler-Lagrange to optimal control; ot, elliptic PDE, and minimal surfaces are variational problems.", "uses": "Classical mechanics through least action, optimal control via Pontryagin’s principle, minimal surfaces and soap films, total variation denoising in imaging, elasticity, and the variational form of optimal transport.", "worth": "you work on control, imaging, or optimal transport theory; the Euler-Lagrange equation alone serves most other readers.", "resources": [{"title": "Calculus of Variations and Optimal Control Theory: A Concise Introduction", "url": "https://liberzon.csl.illinois.edu/teaching/cvoc.pdf", "type": "book", "by": "Daniel Liberzon, 2012", "level": 1, "note": "Chapter 2: examples, the first variation and Euler-Lagrange, Hamiltonian form, constraints, and second-order conditions; Chapter 3 bridges to optimal control."}, {"title": "Partial Differential Equations", "url": "https://doi.org/10.1090/gsm/019", "type": "book", "by": "Lawrence C. Evans, 2nd edition, AMS, 2010", "level": 2, "note": "The chapter on the calculus of variations: the direct method, coercivity, and weak lower semicontinuity in Sobolev spaces.", "paid": true}, {"title": "Calculus of Variations", "url": "https://link.springer.com/book/10.1007/978-3-319-77637-8", "type": "book", "by": "Filip Rindler, Springer, 2018", "level": 3, "note": "Chapters 2 and 3: convexity and the direct method, then variations and the Euler-Lagrange equation; later chapters handle nonconvex integrands.", "paid": true}, {"title": "The brachistochrone by the direct method", "url": "https://www-users.cse.umn.edu/~olver/ln_/cv.pdf", "type": "project", "by": "Built on Olver, The Calculus of Variations, 2021", "level": 1, "build": "A bead’s travel time along a piecewise linear wire, minimized numerically over the node heights, and compared with the cycloid that solves the Euler-Lagrange equation.", "teaches": "The direct method in finite dimensions: minimizing a discretized functional converges to the Euler-Lagrange solution, despite the vertical tangent at the start.", "time": "an afternoon", "made": true, "done": "Minimized travel times come within 0.5 percent of the cycloid (3.30), and for an endpoint with β < 2b/π the optimal wire dips below it, as Olver notes."}]}, {"id": "statug", "title": "Mathematical statistics (Stat 135)", "kind": "concept", "track": "stats", "pre": ["probug"], "frontier": false, "tier": "upper div", "core": "An estimator is a function of random data and so is random; its sampling distribution gives its bias, variance, standard error, and confidence intervals. Maximum likelihood is the default because in large samples it is approximately normal with variance 1/(n I(θ)), the smallest possible.", "reach": "Decision theory makes “best estimator” precise, testing theory formalizes tests, and asymptotic statistics proves the large-sample claims made here.", "uses": "Confidence intervals, A/B test analysis, regression inference in medicine and economics, maximum likelihood training, which is what minimizing cross-entropy does, and telling a real experimental effect from noise.", "worth": "you will run experiments or read empirical papers; everyone on this path should take it before graduate statistics.", "resources": [{"title": "MIT 18.650: Statistics for Applications", "url": "https://ocw.mit.edu/courses/18-650-statistics-for-applications-fall-2016/", "type": "course", "by": "Philippe Rigollet, MIT OCW, 2016", "level": 1, "note": "Estimation, maximum likelihood, confidence intervals, tests, and regression, with lecture videos."}, {"title": "Mathematical Statistics and Data Analysis", "url": "https://www.cengage.com/c/mathematical-statistics-and-data-analysis-3e-rice/9780534399429/", "type": "book", "by": "John Rice, 3rd edition, 2006", "level": 2, "note": "The Stat 135 text: the course covers most of Chapters 7 to 14, which take in parameter estimation, parametric and nonparametric tests, and linear regression.", "paid": true}, {"title": "MIT 18.650 Problem Sets 2 to 4", "url": "https://ocw.mit.edu/courses/18-650-statistics-for-applications-fall-2016/pages/assignments/", "type": "project", "by": "Philippe Rigollet, MIT OCW, 2016", "level": 1, "note": "No solutions are posted.", "build": "Written solutions on bias and consistency, confidence intervals for Poisson and uniform samples, maximum likelihood, KL and total variation distances, Fisher information, and the method of moments.", "teaches": "Deriving estimators and their large sample behavior by hand, until bias, Fisher information, and 1/(n I(θ)) are routine computations.", "time": "two weeks"}]}, {"id": "decision", "title": "Decision theory and estimation (Stat 210A)", "kind": "concept", "track": "stats", "pre": ["statug", "measureprob"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "Judge an estimator by its risk R(θ, δ) = E_θ L(θ, δ(X)). No estimator wins at every θ, so average risk over a prior (Bayes), take the worst case, or restrict to unbiased estimators, where sufficiency and completeness single out the best (Rao-Blackwell).", "reach": "James-Stein shows the usual estimator of a normal mean in three or more dimensions is inadmissible; bayes and minimax develop the two summaries.", "uses": "Comparing estimators and learning algorithms by risk, James-Stein shrinkage and its ties to ridge regression and empirical Bayes, minimax rates, and the loss-and-risk language that statistical learning theory borrows.", "worth": "Stat 210A or statistical theory papers are the goal; for applied work, risk, Bayes, minimax, and the James-Stein surprise are enough.", "resources": [{"title": "Stat 210A: Theoretical Statistics", "url": "https://stat210a.berkeley.edu/fall-2026", "type": "course", "by": "Will Fithian, Berkeley, Fall 2026", "level": 2, "note": "The course reader and handwritten notes: estimation, exponential families, sufficiency, completeness, unbiased estimation, Bayes, James-Stein, and minimax."}, {"title": "Theoretical Statistics: Topics for a Core Course", "url": "https://link.springer.com/book/10.1007/978-0-387-93839-4", "type": "book", "by": "Robert Keener, Springer, 2010", "level": 2, "note": "The book the 210A syllabus calls closest to the course: Chapters 1 to 4 (risk, sufficiency, completeness, unbiased estimation), 7 (Bayes), and 11 (shrinkage).", "paid": true}, {"title": "MIT 18.655: Mathematical Statistics", "url": "https://ocw.mit.edu/courses/18-655-mathematical-statistics-spring-2016/", "type": "course", "by": "Peter Kempthorne, MIT OCW, 2016", "level": 2, "note": "Lecture notes 4 to 13: decision theory, sufficiency, exponential families, Bayes and minimax procedures, and unbiased estimation."}, {"title": "Theory of Point Estimation", "url": "https://link.springer.com/book/10.1007/b98854", "type": "book", "by": "Erich Lehmann, George Casella, 2nd edition, Springer, 1998", "level": 3, "note": "Chapters 1, 2, 4, and 5: preparations, unbiasedness, average risk optimality, and minimaxity and admissibility.", "paid": true}, {"title": "Stein’s Paradox in Statistics", "url": "https://efron.ckirby.su.domains/other/Article1977.pdf", "type": "project", "by": "Efron, Morris, Scientific American, 1977", "level": 1, "build": "The James-Stein estimator applied to the article’s 18 baseball players: shrink each early season batting average toward the grand mean and compare its error over the rest of the season.", "teaches": "Why the sample mean is inadmissible in three or more dimensions, seen on real data before it is proved.", "time": "a day", "signature": true}]}, {"id": "testing", "title": "Hypothesis testing and confidence sets (Stat 210A)", "kind": "concept", "track": "stats", "pre": ["decision"], "frontier": false, "tier": "graduate", "badge": "checkpoint", "core": "For two simple hypotheses, the best level α test rejects when the likelihood ratio is large (Neyman-Pearson); monotone likelihood ratios stretch this to one-sided composite tests. A confidence set is an inverted test: all parameter values a level α test would not reject.", "reach": "Nuisance parameters lead to conditional and invariant tests; asymptotics supplies Wald, score, and likelihood ratio tests when exact ones do not exist.", "uses": "Clinical trials, A/B testing, radar and signal detection, false discovery control in genomics, conformal prediction sets built by inverting tests, and the confidence intervals reported across science.", "worth": "you design experiments or read statistical theory; Neyman-Pearson and test inversion are quick to learn and clarify every p-value you meet.", "resources": [{"title": "Hypothesis Testing and the Neyman-Pearson Lemma (Stat 210A course reader)", "url": "https://stat210a.berkeley.edu/fall-2026/reader/hypothesis-testing.html", "type": "notes", "by": "Will Fithian, Berkeley, 2026", "level": 2, "note": "The first of four reader chapters: Neyman-Pearson, one-parameter tests, p-values and confidence regions, and nuisance parameters."}, {"title": "Theoretical Statistics: Topics for a Core Course", "url": "https://link.springer.com/book/10.1007/978-0-387-93839-4", "type": "book", "by": "Robert Keener, Springer, 2010", "level": 2, "note": "Chapters 12 and 13: hypothesis testing, then optimal tests in higher dimensions.", "paid": true}, {"title": "Testing Statistical Hypotheses", "url": "https://link.springer.com/book/10.1007/978-3-030-70578-7", "type": "book", "by": "Erich Lehmann, Joseph Romano, 4th edition, Springer, 2022", "level": 3, "note": "Chapters 3 to 6: UMP tests, unbiased tests, and invariant tests, with their confidence sets.", "paid": true}, {"title": "Stat 210A Homework 8: two-sided tests and confidence intervals", "url": "https://stat210a.berkeley.edu/fall-2026/homework/homework8.pdf", "type": "project", "by": "Will Fithian, Berkeley, Fall 2026", "level": 2, "build": "Computed UMPU and equal-tailed tests with power curves, a test for a genetic mixture, a quantile confidence interval from an inverted test, and tests against multidirectional alternatives.", "teaches": "Turning Neyman-Pearson and UMPU theory into cutoffs and power curves, and seeing when no uniformly most powerful test exists.", "time": "a week"}]}, {"id": "bayes", "title": "Bayesian theory", "kind": "concept", "track": "stats", "pre": ["decision"], "frontier": false, "tier": "graduate", "core": "The posterior combines prior and likelihood; the Bayes estimator minimizes posterior expected loss, and therefore average risk. Unique Bayes rules are admissible, and as n grows the posterior forgets the prior and looks like N(MLE, (n I(θ))^-1) (Bernstein-von Mises), so credible sets become confidence sets.", "reach": "Empirical Bayes explains James-Stein shrinkage; nonparametric priors and posterior contraction rates connect to minimax.", "uses": "Uncertainty estimates in Bayesian deep learning, Gaussian processes, hierarchical models in medicine and election forecasting, spam filtering, and deciding when a credible interval can be read as a confidence interval.", "worth": "you build probabilistic models or study theory; Bernstein-von Mises and admissibility matter for theory, while applied work needs priors, posteriors, and computation.", "resources": [{"title": "Bayes Estimation (Stat 210A course reader)", "url": "https://stat210a.berkeley.edu/fall-2026/reader/bayes-estimation.html", "type": "notes", "by": "Will Fithian, Berkeley, 2026", "level": 1, "note": "Bayes estimation, followed by a chapter on interpretations of probability and where priors come from."}, {"title": "Theoretical Statistics: Topics for a Core Course", "url": "https://link.springer.com/book/10.1007/978-0-387-93839-4", "type": "book", "by": "Robert Keener, Springer, 2010", "level": 2, "note": "Chapters 7, 11, and 15: Bayesian estimation, empirical Bayes and shrinkage, and Bayesian modeling and computation.", "paid": true}, {"title": "Asymptotic Statistics", "url": "https://www.cambridge.org/core/books/asymptotic-statistics/A3C7DAD3F7E66A1FA60E9C8FE132EE1D", "type": "book", "by": "A. W. van der Vaart, Cambridge, 1998", "level": 2, "note": "Chapter 10: Bayes procedures and the Bernstein-von Mises theorem.", "paid": true}, {"title": "Fundamentals of Nonparametric Bayesian Inference", "url": "https://www.cambridge.org/core/books/fundamentals-of-nonparametric-bayesian-inference/C96325101025D308C9F31F4470DEA2E8", "type": "book", "by": "Subhashis Ghosal, Aad van der Vaart, Cambridge, 2017", "level": 3, "note": "Posterior consistency and contraction rates for nonparametric priors such as Dirichlet and Gaussian processes.", "paid": true}, {"title": "Stat 210A Homework 5: Bayes estimators and admissibility", "url":
