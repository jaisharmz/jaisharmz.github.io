d a loop. Solving them gives every voltage and current.", "reach": "Capacitors and inductors turn these equations into ODEs, where signals and classical control begin; transistors make circuits the substrate of digital logic and VLSI.", "uses": "Power supplies, chargers, audio gear, sensors, and every electronic product. Analog in-memory computing for neural networks does matrix multiplies with Ohm’s law and Kirchhoff’s current law directly.", "worth": "you will build hardware, robots, or sensors, or study chip design; an ML researcher who stays in software can skip it.", "resources": [{"title": "MIT 6.002: Circuits and Electronics", "url": "https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/", "type": "lectures", "by": "Anant Agarwal, MIT OCW, 2007", "level": 1, "note": "Lectures 1 to 3 (lumped abstraction, node analysis, Thévenin), then 12 and 15 to 17 (first and second order circuits, impedance)."}, {"title": "EECS 16B: Designing Information Devices and Systems II", "url": "https://eecs16b.org/", "type": "notes", "by": "UC Berkeley, Spring 2024", "level": 2, "note": "Notes 1 to 7: RC and RLC circuits as differential equations, phasors, transfer functions, and Bode plots."}, {"title": "Circuit Simulator", "url": "https://www.falstad.com/circuit/", "type": "code", "by": "Paul Falstad", "level": 1, "note": "Runs in the browser and animates current flow; rebuild each lecture circuit and watch it settle."}, {"title": "The Art of Electronics (3rd edition)", "url": "https://artofelectronics.net/", "type": "book", "by": "Paul Horowitz, Winfield Hill, 2015", "level": 3, "note": "The practitioner’s reference for how real analog and digital circuits are designed.", "paid": true}]}, {"id": "digital", "title": "Digital logic and design", "kind": "concept", "track": "hardware", "pre": ["proofs"], "frontier": false, "core": "Any Boolean function can be built from a single gate type such as NAND. Add a clock and flip-flops that hold bits between ticks, and logic gains memory: a synchronous design is combinational logic between registers, and the clock period must exceed the slowest path.", "reach": "Registers, an ALU, and control logic make a CPU; VLSI turns the same logic into silicon, and embedded systems program it.", "uses": "Every CPU, GPU, phone, and FPGA, and the custom accelerators, such as Google’s TPU, that train and serve neural networks. FPGAs also run low-latency trading systems and prototype new chips.", "worth": "you want to understand or design hardware, ML accelerators included; skip it if you treat GPUs as a black box.", "resources": [{"title": "Build an 8-bit computer", "url": "https://eater.net/8bit/", "type": "project", "by": "Ben Eater", "level": 1, "build": "A programmable 8-bit computer on breadboards from logic chips: clock, registers, ALU, RAM, program counter, output display, and microcoded control logic.", "teaches": "How instructions become control signals, at a scale where you placed every wire.", "time": "a month", "signature": true}, {"title": "From Nand to Tetris", "url": "https://www.nand2tetris.org/", "type": "course", "by": "Noam Nisan, Shimon Schocken", "level": 1, "note": "Projects 1 to 5 build gates, an adder and ALU, memory, and a working CPU in a simple HDL."}, {"title": "MIT 6.004: Computation Structures", "url": "https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/", "type": "lectures", "by": "MIT OCW, 2017", "level": 2, "note": "The same climb with engineering rigor: timing, sequential logic, pipelining, and instruction set design."}, {"title": "HDLBits", "url": "https://hdlbits.01xz.net/", "type": "tutorial", "by": "Henry Wong, 01xz.net", "level": 2, "note": "Small Verilog exercises checked by simulation, from single gates to state machines."}]}, {"id": "signals", "title": "Signals and systems", "kind": "concept", "track": "hardware", "pre": ["diffeq", "linalg"], "frontier": false, "core": "A linear time-invariant system is fully described by its response to a single impulse: the output is the input convolved with that response. Sinusoids pass through it changed only in gain and phase, so in the frequency domain convolution becomes multiplication.", "reach": "Transfer functions, poles, and Bode plots carry straight into classical control; sampling and the DFT underlie RF and every digital measurement.", "uses": "Audio and speech processing, cellular and Wi-Fi communication, radar, medical imaging, noise-canceling headphones, and image filtering. Convolutional networks and state-space sequence models such as S4 apply these ideas directly.", "worth": "you work on audio, sensors, control, or state-space sequence models; otherwise keep convolution and the Fourier transform and skip the rest.", "resources": [{"title": "But what is the Fourier Transform? A visual introduction.", "url": "https://www.youtube.com/watch?v=spUNpyF58BY", "type": "video", "by": "3Blue1Brown, 2018", "level": 1, "note": "What a Fourier transform measures, drawn as winding a signal around a circle."}, {"title": "MIT 6.003: Signals and Systems", "url": "https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/", "type": "lectures", "by": "Dennis Freeman, MIT OCW, 2011", "level": 2, "note": "Lectures 8, 9, and 16 cover convolution, frequency response, and the Fourier transform; Lecture 21 covers sampling."}, {"title": "Digital Signals Theory", "url": "https://brianmcfee.net/dstbook-site/content/intro.html", "type": "book", "by": "Brian McFee", "level": 2, "note": "Chapters 2, 3, 5, and 10: sampling and aliasing, convolution, the DFT, and the convolution theorem, with code."}]}, {"id": "vlsi", "title": "VLSI and ASIC design", "kind": "concept", "track": "hardware", "pre": ["digital", "circuits"], "frontier": false, "core": "Describe hardware as registers and the logic between them (RTL). Synthesis maps that onto a library of standard cells, place and route lays the cells out on silicon, and static timing analysis checks that every path settles within the clock period before tapeout.", "reach": "Ties digital logic to the physical limits of power, area, and timing; the same flow builds the accelerators ML runs on.", "uses": "Designing every modern chip: CPUs, phone processors, GPUs, and ML accelerators like TPUs. Chip floorplanning is also an ML target, as in Google’s reinforcement learning work on TPU layouts.", "worth": "you want to build ML hardware or see why accelerators look the way they do; the path is long and tool-heavy, so skip it otherwise.", "resources": [{"title": "EECS 151/251A: Introduction to Digital Design and Integrated Circuits", "url": "https://eecs151.org/", "type": "course", "by": "UC Berkeley EECS", "level": 2, "note": "The ASIC labs take RTL through synthesis, place and route, clock tree synthesis, and signoff in SkyWater 130nm."}, {"title": "Tiny Tapeout", "url": "https://tinytapeout.com/", "type": "project", "by": "Matt Venn and contributors", "level": 1, "build": "A small digital design, from gates or Verilog, hardened with open-source tools into a tile on a shared chip that is fabricated and mailed back.", "teaches": "The path from a hardware description to silicon: synthesis, placement, routing, and the checks a foundry requires.", "time": "two weeks"}, {"title": "Zero to ASIC Course", "url": "https://www.zerotoasiccourse.com/", "type": "course", "by": "Matt Venn", "level": 2, "note": "A guided digital or analog course through the open source chip design flow.", "paid": true}, {"title": "EE 194/290C Tutorials", "url": "https://ucb-ee290c.github.io/tutorials/", "type": "tutorial", "by": "UC Berkeley tapeout class", "level": 3, "note": "Chipyard SoC generation and baremetal bringup, as used for Berkeley’s student tapeouts."}]}, {"id": "embedded", "title": "Embedded systems and microcontrollers", "kind": "concept", "track": "hardware", "pre": ["digital", "c"], "frontier": false, "core": "A microcontroller is a CPU whose peripherals (pins, timers, serial ports, ADCs) appear as memory addresses. Firmware drives hardware by reading and writing those registers and reacts to events through interrupts, within fixed timing and memory budgets, usually without an operating system.", "reach": "The layer between digital logic and the physical world; rocketry flight computers, drones, and robots all run on it.", "uses": "Cars, pacemakers, drones, appliances, factory controllers, and wearables; microcontrollers ship in far greater numbers than PC processors. TinyML runs small neural networks on them for wake-word detection and sensor monitoring.", "worth": "you build robots, drones, rockets, or on-device ML; skip it if your work never touches physical hardware.", "resources": [{"title": "Build a 6502 computer", "url": "https://eater.net/6502", "type": "project", "by": "Ben Eater", "level": 1, "build": "A breadboard computer around a 6502 CPU with ROM, RAM, an I/O chip, and an LCD, programmed in assembly.", "teaches": "Memory maps, address decoding, and interrupts, the layer every microcontroller hides.", "time": "a month"}, {"title": "Embedded Systems: Shape the World", "url": "https://users.ece.utexas.edu/~valvano/Volume1/E-Book/", "type": "book", "by": "Jonathan Valvano, Ramesh Yerraballi, UT Austin", "level": 2, "note": "Chapters 6, 10, 11, and 12: microcontroller ports, finite state machines, the UART, and interrupts on an ARM Cortex-M."}, {"title": "Introduction to the Internet of Things and Embedded Systems", "url": "https://www.coursera.org/learn/iot", "type": "course", "by": "Ian Harris, UC Irvine, Coursera", "level": 1, "note": "A gentle survey of embedded hardware, sensors, and networked devices."}, {"title": "Interrupt", "url": "https://interrupt.memfault.com/", "type": "blog", "by": "Memfault", "level": 3, "note": "Working firmware engineers on debugging, logging, RTOS tooling, and device reliability."}]}, {"id": "pcb", "title": "PCB design", "kind": "concept", "track": "hardware", "pre": ["circuits"], "frontier": false, "core": "A PCB turns a schematic into copper: assign each part a footprint, place the parts, route traces within the fab’s design rules, and export Gerber files. Every signal needs a short return path, usually a ground plane, or the board radiates and picks up noise.", "reach": "Where circuits meet manufacturing; embedded boards, RF front ends, and rocket flight computers all start here.", "uses": "Every electronic product, from phones and servers to hobby drones, flight computers, and custom sensor boards for labs and robots. High-speed accelerator boards make signal integrity the hard part.", "worth": "you want to build your own hardware; free tools like KiCad make it quick to learn, and software-only people can skip it.", "resources": [{"title": "Getting Started in KiCad", "url": "https://docs.kicad.org/10.0/en/getting_started_in_kicad/getting_started_in_kicad.html", "type": "tutorial", "by": "KiCad project, version 10.0", "level": 1, "note": "The official tutorial: one small board from schematic through layout to fabrication files."}, {"title": "Keyboard PCB Guide", "url": "https://github.com/ruiqimao/keyboard-pcb-guide", "type": "project", "by": "Ruiqi Mao, 2017", "level": 1, "note": "A complete keyboard PCB in KiCad; written for an older version, so menus differ, but the flow is the same.", "build": "A mechanical keyboard PCB in KiCad: a schematic with a switch matrix and microcontroller, footprints, a routed board, and files ready to order.", "teaches": "The whole PCB flow, schematic to manufacturing files, on a board you will actually use.", "time": "a weekend"}, {"title": "KiCad 6 STM32 PCB Design Full Tutorial - Phil’s Lab #65", "url": "https://www.youtube.com/watch?v=aVUqaB0IMh4", "type": "video", "by": "Phil’s Lab, 2022", "level": 2, "note": "A microcontroller board with USB, designed from schematic through layout and routing."}, {"title": "How to Achieve Proper Grounding", "url": "https://www.youtube.com/watch?v=ySuUZEjARPY", "type": "video", "by": "Rick Hartley, Altium, 2019", "level": 3, "note": "A long talk on return currents, ground planes, and EMI, the physics behind most layout rules."}]}, {"id": "rf", "title": "RF, antennas and ham radio", "kind": "concept", "track": "hardware", "pre": ["signals", "circuits", "em"], "frontier": false, "core": "At radio frequencies a wire can be a sizable fraction of a wavelength (λ = c/f), so circuits radiate. An antenna is a conductor sized to that wavelength, feed lines must match its impedance or power reflects, and radios carry information by modulating a carrier.", "reach": "Joins signals and electromagnetism; telemetry for rocketry and guidance, and every wireless link, depend on it.", "uses": "Wi-Fi, cellular networks, Bluetooth, GPS, satellite links, radar, and RFID tags; ham radio is the licensed hobby that teaches it hands-on. Classifying radio signals with neural networks is a small research area of its own.", "worth": "you build wireless hardware, drones, or rocket telemetry, or want ham radio as a hobby; skip it if radios stay behind an API for you.", "resources": [{"title": "No-Nonsense Technician Class License Study Guide", "url": "https://www.kb6nu.com/study-guides/", "type": "book", "by": "Dan Romanchik (KB6NU), 2026 to 2030 question pool", "level": 1, "note": "The free PDF covers the US entry license: rules, frequencies, antennas, and basic electronics."}, {"title": "PySDR: A Guide to SDR and DSP using Python", "url": "https://pysdr.org/", "type": "book", "by": "Marc Lichtman", "level": 2, "note": "Chapters 2 to 4 and 12: the frequency domain, IQ sampling, digital modulation, and link budgets, with a cheap SDR to try them on."}, {"title": "MIT 6.013: Electromagnetics and Applications", "url": "https://ocw.mit.edu/courses/6-013-electromagnetics-and-applications-spring-2009/", "type": "lectures", "by": "David Staelin, MIT OCW, 2009", "level": 3, "note": "Waves, radiation, guided waves, and antennas derived from Maxwell’s equations."}]}, {"id": "mechanics", "title": "Classical mechanics", "kind": "concept", "track": "physics", "pre": ["calc", "diffeq"], "frontier": false, "core": "Newton’s F = ma turns forces into a differential equation whose solution is the motion. The Lagrangian view reaches the same equations in any coordinates by making the action (kinetic minus potential energy, summed over time) stationary, and each symmetry then gives a conserved quantity.", "reach": "The language of every later physics node: electromagnetism adds fields, quantum mechanics quantizes the Hamiltonian, and structural and fluid mechanics apply F = ma to continua.", "uses": "Machines, vehicles, bridges, spacecraft, and the physics in robot simulators and games. Hamiltonian Monte Carlo samples distributions by simulating Hamilton’s equations, and Hamiltonian neural networks build energy conservation into learned models.", "worth": "you work on robotics, simulation, or physics-based ML, or want the picture behind HMC; Newtonian mechanics alone covers most engineering.", "resources": [{"title": "MIT 8.01SC: Classical Mechanics", "url": "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/", "type": "course", "by": "Chakrabarty, Dourmashkin, Tomasik, et al., MIT OCW, 2016", "level": 1, "note": "Lecture videos and problem sets on force, momentum, energy, torque, and angular momentum."}, {"title": "Classical Mechanics (The Theoretical Minimum)", "url": "https://theoreticalminimum.com/courses/classical-mechanics/2011/fall", "type": "lectures", "by": "Leonard Susskind, Stanford, 2011", "level": 1, "note": "Lectures 3 to 6: least action, symmetry and conservation laws, and Hamilton’s equations."}, {"title": "The Feynman Lectures on Physics, Volume II", "url": "https://www.feynmanlectures.caltech.edu/II_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1964", "level": 1, "note": "Chapter 19, The Principle of Least Action, explains why nature picks the stationary path."}, {"title": "Classical Dynamics", "url": "https://davidtong.org/teaching/classical-dynamics/", "type": "notes", "by": "David Tong, Cambridge", "level": 3, "note": "Chapters 2 to 4: the Lagrangian formulation, rigid bodies, and the Hamiltonian formulation."}, {"title": "SICM Exercise 1.44: Double pendulum behavior", "url": "https://mitp-content-server.mit.edu/books/content/sectbyfn/books_pres_0/9579/sicm_edition_2.zip/chapter001.html", "type": "project", "by": "Gerald Sussman, Jack Wisdom, MIT Press, 2nd edition, 2014", "level": 2, "note": "Assigned as the double pendulum project in MIT’s computational classical mechanics course, where it is exercise 1.39 of the first edition.", "build": "A Lagrangian for the double pendulum, its equations of motion integrated for 50 seconds, an energy conservation check, and two copies started 10^-10 m apart to watch their paths diverge.", "teaches": "How to get equations of motion from a Lagrangian you wrote down, and what chaos looks like: a tiny difference that grows exponentially from one start but not another.", "time": "a weekend"}]}, {"id": "em", "title": "Electricity and magnetism", "kind": "concept", "track": "physics", "pre": ["calc"], "frontier": false, "core": "Charges make electric fields, currents make magnetic fields, and a changing field of either kind makes the other; Maxwell’s four equations say exactly how. Solving them in empty space gives waves that travel at the speed of light, so light is an electromagnetic wave.", "reach": "Circuits, signals, and RF rest on it; relativity began as the puzzle of why every observer measures the same speed of light.", "uses": "Power grids, motors and generators, antennas, MRI machines, optical fiber, and induction cooktops. Chip designers fight it as crosstalk and signal-integrity problems; ML links run through hardware, not models.", "worth": "you head toward circuits, RF, optics, or physics; an ML researcher who will not build hardware can stop at the intuition.", "resources": [{"title": "MIT 8.02: Physics II, Electricity and Magnetism", "url": "https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2019/", "type": "course", "by": "Dourmashkin, Tomasik, et al., MIT OCW, 2019", "level": 1, "note": "Lecture videos and problem sets that build up to Maxwell’s equations."}, {"title": "Vector Calculus for Engineers", "url": "https://www.coursera.org/learn/vector-calculus-engineers", "type": "course", "by": "Jeffrey Chasnov, HKUST, Coursera", "level": 1, "note": "Weeks 2 and 5: divergence and curl, then the divergence and Stokes’ theorems that Maxwell’s equations are written in."}, {"title": "The Feynman Lectures on Physics, Volume II", "url": "https://www.feynmanlectures.caltech.edu/II_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1964", "level": 2, "note": "Chapter 1 for the big picture, chapter 18 for the Maxwell equations, and chapter 20 for their wave solutions."}, {"title": "Electromagnetism", "url": "https://davidtong.org/teaching/electromagnetism/", "type": "notes", "by": "David Tong, Cambridge", "level": 3, "note": "Chapters 4 and 5 rewrite Maxwell’s equations relativistically and derive radiation."}, {"title": "Understanding the FDTD Method", "url": "https://eecs.wsu.edu/~schneidj/ufdtd/", "type": "project", "by": "John B. Schneider, Washington State University, 2010", "level": 2, "note": "Chapter 3 builds the one dimensional code and chapter 8 the two dimensional one; each chapter comes with its C programs.", "build": "A one dimensional FDTD simulation of Maxwell’s equations on a staggered Yee grid, then sources, absorbing edges, a boundary that injects a clean plane wave, dielectric and lossy layers, and a two dimensional version.", "teaches": "Maxwell’s curl equations as a leapfrog between electric and magnetic fields, and how waves reflect, slow, and fade when they enter matter.", "time": "a week"}]}, {"id": "thermo", "title": "Thermodynamics and statistical mechanics", "kind": "concept", "track": "physics", "pre": ["prob", "mechanics"], "frontier": false, "core": "Entropy is the logarithm of the number of microscopic states consistent with what you measure. At temperature T a system occupies each state with probability proportional to exp(-E/kT), and the sum of those weights, the partition function, yields energy, pressure, and every other bulk quantity.", "reach": "Feeds the free energy of physical chemistry, heat transfer, and astrophysics; the Boltzmann distribution returns as softmax and energy models in machine learning.", "uses": "Engines, refrigerators, power plants, materials, and chemical processes. In ML the Boltzmann distribution is the softmax with a temperature, simulated annealing and energy-based models borrow its math, and Boltzmann machines took the name directly.", "worth": "you want the physics behind softmax temperature, energy-based models, and sampling, or plan chemistry or heat transfer; skip the heat-engine material.", "resources": [{"title": "Statistical Mechanics (The Theoretical Minimum)", "url": "https://theoreticalminimum.com/courses/statistical-mechanics/2013/spring", "type": "lectures", "by": "Leonard Susskind, Stanford, 2013", "level": 1, "note": "Lectures 1 to 4 derive entropy, temperature, and the Boltzmann distribution from counting states."}, {"title": "Statistical Physics", "url": "https://davidtong.org/teaching/statistical-physics/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapter 1 builds the ensembles and the partition function, chapter 4 recovers classical thermodynamics, and chapter 5 covers phase transitions."}, {"title": "Fundamentals of Statistical and Thermal Physics", "url": "https://www.waveland.com/browse.php?t=520", "type": "book", "by": "F. Reif, 1965, reissued by Waveland Press", "level": 2, "note": "Probability first, then statistical mechanics, thermodynamics, quantum gases, and transport, with 230 problems.", "paid": true}, {"title": "MIT 8.333: Statistical Mechanics I", "url": "https://ocw.mit.edu/courses/8-333-statistical-mechanics-i-statistical-mechanics-of-particles-fall-2013/", "type": "lectures", "by": "Mehran Kardar, MIT OCW, 2013", "level": 3, "note": "Graduate video lectures: thermodynamics, probability, kinetic theory, and interacting systems."}, {"title": "Programming a 2D Ising Model", "url": "https://wiki.ch.ic.ac.uk/wiki/Programming_a_2D_Ising_Model", "type": "project", "by": "Imperial College London, Chemistry", "level": 1, "build": "A Metropolis Monte Carlo simulation of the 2D Ising model in Python, sped up, then run across temperatures and lattice sizes to find the heat capacity and the Curie temperature.", "teaches": "How a phase transition emerges from local rules, and how finite size and sampling error blur it.", "time": "a week", "signature": true}]}, {"id": "qm", "title": "Quantum mechanics", "kind": "concept", "track": "physics", "pre": ["linalg", "pde", "mechanics"], "frontier": false, "core": "A system’s state is a vector of complex amplitudes, and the squared size of each amplitude is the probability of that measurement outcome. The Schrödinger equation rotates the vector in time; the allowed energies are the Hamiltonian’s eigenvalues, which is why atoms have discrete spectra.", "reach": "Underlies quantum computing, quantum chemistry, and the semiconductors in circuits and VLSI; the same linear algebra runs every quantum algorithm.", "uses": "Transistors, lasers, LEDs, solar cells, MRI, atomic clocks, and drug and materials design. ML meets it through quantum chemistry datasets and neural network wavefunctions such as DeepMind’s FermiNet.", "worth": "you aim for quantum computing, quantum chemistry, or materials ML; otherwise it is a long road with a mostly indirect payoff for ML.", "resources": [{"title": "MIT 8.04: Quantum Physics I", "url": "https://ocw.mit.edu/courses/8-04-quantum-physics-i-spring-2016/pages/video-lectures/part-1/", "type": "lectures", "by": "Barton Zwiebach, MIT OCW, 2016", "level": 1, "note": "Part 1, Basic Concepts, then part 2 on one-dimensional potentials and part 3 on angular momentum and central potentials."}, {"title": "The Feynman Lectures on Physics, Volume III", "url": "https://www.feynmanlectures.caltech.edu/III_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1965", "level": 1, "note": "Chapters 1 to 3 build quantum mechanics from amplitudes; chapters 8 to 11 treat two-state systems, the qubit before it had a name."}, {"title": "Quantum Mechanics", "url": "https://davidtong.org/teaching/quantum-mechanics/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapter 3, The Formalism of Quantum Mechanics, states the rules as linear algebra."}, {"title": "MIT 8.05: Quantum Physics II", "url": "https://ocw.mit.edu/courses/8-05-quantum-physics-ii-fall-2013/", "type": "lectures", "by": "Barton Zwiebach, MIT OCW, 2013", "level": 3, "note": "The general formalism, the harmonic oscillator, spin, and addition of angular momentum."}, {"title": "Hydrogen’s spectrum from a matrix eigenvalue problem", "url": "https://physics.nist.gov/PhysRefData/Handbook/Tables/hydrogentable2.htm", "type": "project", "by": "Built on the NIST Handbook of Basic Atomic Spectroscopic Data", "level": 2, "build": "A finite difference Hamiltonian for hydrogen’s radial Schrödinger equation, its lowest eigenvalues from a sparse eigensolver, and the wavelengths of the lines between those levels.", "teaches": "That a discrete spectrum is the set of eigenvalues of a matrix, and how grid spacing and box size decide which levels you can trust.", "time": "a day", "made": true, "done": "Levels follow -13.6/n^2 eV for n = 1 to 4, and the 2p to 1s line lands within 0.1 percent of the 1215.67 angstrom Lyman alpha wavelength in NIST’s table."}]}, {"id": "relativity", "title": "Special and general relativity", "kind": "concept", "track": "physics", "pre": ["mechanics", "em"], "frontier": false, "core": "Every observer measures the same speed of light, so space and time must mix: moving clocks run slow, and simultaneity depends on the observer. General relativity makes gravity the curvature of spacetime; matter sets the curvature, and free objects follow its straightest paths.", "reach": "Needed for black holes and cosmology in astrophysics, and for the satellite clocks behind GPS navigation, which correct for both effects.", "uses": "GPS, whose satellite clocks correct for both special and general relativity, particle accelerators, gravitational-wave detectors like LIGO, and cosmology. Its tie to machine learning is negligible.", "worth": "you love physics or plan astrophysics; for ML research it is safe to skip, since nothing in it feeds back into models.", "resources": [{"title": "The Feynman Lectures on Physics, Volume I", "url": "https://www.feynmanlectures.caltech.edu/I_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1963", "level": 1, "note": "Chapters 15 to 17: special relativity, relativistic energy and momentum, and space-time."}, {"title": "General relativity from first principles", "url": "https://www.youtube.com/watch?v=QbdbAhaJoCQ", "type": "video", "by": "Adam Brown with Dwarkesh Patel", "level": 1, "note": "Starts from the coincidence that inertial and gravitational mass are equal and follows Einstein from there."}, {"title": "General Relativity (The Theoretical Minimum)", "url": "https://theoreticalminimum.com/courses/general-relativity/2012/fall", "type": "lectures", "by": "Leonard Susskind, Stanford, 2012", "level": 2, "note": "Lecture 1 starts from the equivalence of gravity and acceleration; the rest builds the geometry."}, {"title": "Lecture Notes on General Relativity", "url": "https://arxiv.org/abs/gr-qc/9712019", "type": "notes", "by": "Sean Carroll, 1997", "level": 3, "note": "Chapters 1 to 4 go from flat spacetime through curvature to Einstein’s equation; later chapters cover gravitational waves, black holes, and cosmology."}, {"title": "Mercury’s perihelion from the Schwarzschild metric", "url": "https://arxiv.org/abs/gr-qc/9712019", "type": "project", "by": "Built on Sean Carroll’s Lecture Notes on General Relativity, 1997", "level": 2, "build": "A numerical integration of Mercury’s orbit along Schwarzschild geodesics, measuring how far the perihelion turns each orbit, with the same run under Newtonian gravity as a control.", "teaches": "Why relativistic orbits are not closed ellipses, and how to pull a tiny secular effect out of a simulation without mistaking integrator error for physics.", "time": "a weekend", "made": true, "done": "Mercury’s perihelion advances about 43 arcseconds per century, matching the 42.9 Carroll computes in chapter 7 (equations 7.56 and 7.57), while the Newtonian control stays near zero."}]}, {"id": "qc", "title": "Quantum computing and information", "kind": "concept", "track": "physics", "pre": ["linalg"], "frontier": true, "core": "A register of n qubits holds 2^n complex amplitudes, gates are unitary matrices acting on them, and measurement samples one bit string. Algorithms such as Shor’s and Grover’s arrange interference so that wrong answers cancel and right answers add up.", "reach": "Shor’s algorithm breaks RSA and elliptic curves, which is why post-quantum cryptography exists; simulating molecules is the other expected payoff.", "uses": "Simulating molecules and materials in the future, and breaking RSA and elliptic-curve cryptography, which is why systems are moving to post-quantum schemes. Claimed quantum speedups for machine learning remain largely unproven at practical scale.", "worth": "you want to work on quantum hardware, algorithms, or cryptography; the linear algebra entry cost is low, but the near-term ML payoff is small.", "resources": [{"title": "Quantum Country", "url": "https://quantum.country/", "type": "tutorial", "by": "Andy Matuschak, Michael Nielsen, 2019", "level": 1, "note": "Start with Quantum computing for the very curious, then the essay on the search algorithm; review prompts are built into the text."}, {"title": "Introduction to Quantum Information", "url": "https://www.coursera.org/learn/introduction-to-quantum-information", "type": "course", "by": "KAIST, Coursera", "level": 1, "note": "Qubits, measurement, and entanglement as the resource behind quantum computing and communication."}, {"title": "Quantum Computing: Lecture Notes", "url": "https://arxiv.org/abs/1907.09415", "type": "notes", "by": "Ronald de Wolf, 2019", "level": 2, "note": "Written for computer scientists: algorithms first, then complexity, communication, and error correction, with exercises."}, {"title": "Quantum Computation and Quantum Information", "url": "https://www.cambridge.org/highereducation/books/quantum-computation-and-quantum-information/01E10196D0A682A6AEFFEA52D53BE9AE", "type": "book", "by": "Michael Nielsen, Isaac Chuang, 10th anniversary edition, 2010", "level": 2, "note": "The standard reference, from circuits and algorithms to noise, error correction, and quantum information theory.", "paid": true}, {"title": "Physics 219: Quantum Computation (lecture notes)", "url": "https://www.preskill.caltech.edu/ph229/", "type": "notes", "by": "John Preskill, Caltech", "level": 3, "note": "The physicist’s view, with recorded 2020 lectures covering chapters 1 to 6."}, {"title": "Quantum Katas", "url": "https://github.com/microsoft/qdk/tree/main/katas", "type": "project", "by": "Microsoft Quantum", "level": 1, "note": "They run in the Quantum Development Kit extension for VS Code.", "build": "Q# solutions to automatically checked exercises, from single qubit gates and state preparation through oracles, Grover’s search, the quantum Fourier transform, phase estimation, and teleportation.", "teaches": "Thinking in amplitudes and unitaries by writing circuits that must pass tests, which is where intuitions from reading fail first.", "time": "two weeks"}, {"title": "A state vector simulator that runs Grover’s search", "url": "https://arxiv.org/abs/1907.09415", "type": "project", "by": "Built on Ronald de Wolf’s Quantum Computing: Lecture Notes, 2019", "level": 2, "build": "A NumPy simulator that stores 2^n amplitudes and applies Hadamard, phase oracle, and reflection gates in place, then Grover’s search on 10 qubits with one marked item and with many.", "teaches": "Why n qubits cost 2^n numbers to simulate, and how Grover’s two reflections rotate amplitude toward the answer by a fixed angle each step.", "time": "a day", "made": true, "done": "With one marked item among N = 1024, 25 iterations succeed with probability at least 1 - 1/N, and with N/4 marked items one iteration succeeds with certainty, as in section 7.2."}]}, {"id": "astro", "title": "Astrophysics and cosmology", "kind": "concept", "track": "physics", "pre": ["relativity", "thermo"], "frontier": false, "core": "A star is gas whose gravity is held off by pressure that fusion in its core sustains; its mass decides how it lives and dies. On the largest scales space expands, and the cosmic microwave background and the light elements record a hot, dense beginning.", "reach": "Uses relativity for black holes and expansion and thermodynamics for stars and the early universe; orbital mechanics is its engineering cousin.", "uses": "Space telescope and satellite missions, measuring the age of the universe, and explaining where the elements came from. Sky surveys produce data at scale, so ML classifies galaxies and transients and emulates cosmological simulations.", "worth": "you want to apply ML to astronomy or simply love the subject; skip it if your study time needs a career return.", "resources": [{"title": "The Evolving Universe", "url": "https://www.coursera.org/learn/evolvinguniverse", "type": "course", "by": "S. George Djorgovski, Caltech, Coursera", "level": 1, "note": "A survey from planetary systems and stars to galaxies, quasars, and the universe as a whole."}, {"title": "Cosmology", "url": "https://davidtong.org/teaching/cosmology/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapters 1 to 3: the expanding universe, the hot universe, and structure formation."}, {"title": "ASTR 160: Frontiers and Controversies in Astrophysics", "url": "https://oyc.yale.edu/astronomy/astr-160", "type": "lectures", "by": "Charles Bailyn, Open Yale Courses, 2007", "level": 2, "note": "Three fast-moving areas in depth: planets around other stars, black holes, and dark energy."}, {"title": "MIT 8.286: The Early Universe", "url": "https://ocw.mit.edu/courses/8-286-the-early-universe-fall-2013/", "type": "lectures", "by": "Alan Guth, MIT OCW, 2013", "level": 3, "note": "Classical cosmology first, then the particle physics of the early universe."}, {"title": "Fit the expansion history to Pantheon+ supernovae", "url": "https://arxiv.org/abs/2202.04077", "type": "project", "by": "Built on Brout et al., 2022 (Pantheon+)", "level": 2, "note": "The distances and covariance are in the team’s DataRelease repository on GitHub.", "build": "A flat Lambda-CDM fit to the Pantheon+ supernova distances: luminosity distance from the integrated expansion rate, the published covariance matrix, the absolute magnitude marginalized, and supernovae below z = 0.01 dropped.", "teaches": "How standard candles measure the expansion history, and why a full covariance matrix, not independent error bars, sets the size of the error.", "time": "a weekend", "made": true, "done": "Omega_M comes out near 0.334 with an uncertainty near 0.018, the value from supernovae alone in the abstract and section 4.3."}]}, {"id": "lp", "title": "Linear programming", "kind": "concept", "track": "or", "pre": ["linalg"], "frontier": false, "core": "A linear program maximizes a linear objective over a region cut out by linear inequalities, a polyhedron, and an optimum sits at a corner. The simplex method walks from corner to corner; duality pairs every LP with another whose optimum is equal and certifies it.", "reach": "Underlies convex optimization, branch and bound in integer programming, the minimax theorem in game theory, and LP rounding in randomized algorithms.", "uses": "Airline scheduling, supply chains, refinery planning, feed and diet blending, power grid dispatch, and ad budget allocation. Discrete optimal transport, used in some generative models and domain adaptation, is a linear program.", "worth": "you work on optimization, operations, or optimal transport; duality is the part every ML researcher benefits from, the simplex details less so.", "resources": [{"title": "The Art of Linear Programming", "url": "https://www.youtube.com/watch?v=E72DWgKP_1Y", "type": "video", "by": "Tom S, 2023", "level": 1, "note": "Nineteen minutes, mostly pictures: definitions, the simplex method, duality, and integer programs."}, {"title": "CS261: A Second Course in Algorithms", "url": "http://timroughgarden.org/w16/w16.html", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2016", "level": 2, "note": "Lectures 7 to 10: LP from the computer science side, with modeling, two lectures on duality, then minimax and the simplex method."}, {"title": "Operations Research (3): Theory", "url": "https://www.coursera.org/learn/operations-research-theory", "type": "course", "by": "Ling-Chieh Kung, National Taiwan University, Coursera", "level": 2, "note": "Duality, sensitivity analysis and the dual simplex method, network flow, then convex analysis, Lagrangian duality, and KKT conditions as a bridge to convex."}, {"title": "MIT 6.251J: Introduction to Mathematical Programming", "url": "https://ocw.mit.edu/courses/6-251j-introduction-to-mathematical-programming-fall-2009/", "type": "course", "by": "Dimitris Bertsimas, MIT OCW, 2009", "level": 3, "note": "Graduate lecture notes on simplex, duality, sensitivity, network flows, and the ellipsoid and interior point methods that solve LPs in polynomial time."}, {"title": "Simplex from scratch on the Stigler diet", "url": "https://developers.google.com/optimization/lp/stigler_diet", "type": "project", "by": "Built on the Stigler diet data in Google OR-Tools", "level": 2, "build": "A two-phase simplex method written from scratch and run on Stigler’s diet problem: 77 foods at 1939 prices, nine daily nutrient minimums, and the cheapest diet meeting them.", "teaches": "Pivoting, phase one, and degeneracy by hand, and how the dual’s shadow prices certify that a corner is optimal.", "time": "a weekend", "made": true, "done": "Your solver’s annual cost matches the $39.6617 that OR-Tools reports, below the $39.93 Stigler found by hand, and its dual solution reaches the same value."}]}, {"id": "convex", "title": "Convex optimization", "kind": "concept", "track": "or", "pre": ["lp", "calc"], "frontier": false, "core": "In a convex problem, a convex function minimized over a convex set, every local minimum is global, so gradient and Newton methods reliably find the best answer. Duality supplies lower bounds and the KKT optimality conditions; least squares and linear programs are special cases.", "reach": "Model predictive control and portfolio optimization solve convex programs repeatedly; linear programming is the linear special case.", "uses": "Portfolio construction, rocket landing guidance, image reconstruction, circuit sizing, and fitting support vector machines and logistic regression. Deep learning is nonconvex, but its optimizers and theory borrow heavily from convex analysis.", "worth": "you do optimization or ML theory; the first half of Boyd and Vandenberghe is what most ML researchers need.", "resources": [{"title": "Stanford EE364A: Convex Optimization I", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rMJqxxviPa4AmDClvcbHi6h", "type": "lectures", "by": "Stephen Boyd, Stanford Online, 2023", "level": 1, "note": "Recorded lectures from convex sets and functions through duality and the standard problem classes, following the book below."}, {"title": "Convex Optimization", "url": "https://web.stanford.edu/~boyd/cvxbook/", "type": "book", "by": "Stephen Boyd, Lieven Vandenberghe, 2004", "level": 2, "note": "Chapters 2 to 5 for convex sets, functions, problems, and duality; Chapters 9 to 11 for unconstrained, equality constrained, and interior-point methods."}, {"title": "CVXPY", "url": "https://www.cvxpy.org/", "type": "code", "by": "CVXPY developers", "level": 2, "note": "Write a convex problem as it reads on paper and let a solver handle it; the examples include least squares, LPs, minimum-fuel optimal control, and Markowitz portfolios."}, {"title": "Convex Optimization: Algorithms and Complexity", "url": "https://arxiv.org/abs/1405.4980", "type": "paper", "by": "Sébastien Bubeck, 2015", "level": 3, "note": "Convergence rates and lower bounds for gradient, accelerated, and mirror descent methods, proved compactly."}, {"title": "Additional Exercises for Convex Optimization", "url": "https://github.com/cvxgrp/cvxbook_additional_exercises", "type": "project", "by": "Stephen Boyd, Lieven Vandenberghe, updated 2026", "level": 2, "note": "Used as homework in Stanford EE364a; the sections follow the book’s chapters.", "build": "Solutions to the computational exercises, each a convex model in CVXPY: fitting and statistical estimation, then problems from circuits, control, finance, and energy.", "teaches": "Spotting the convex problem inside an applied question, and how modeling choices change the answer the solver returns.", "time": "a term"}]}, {"id": "integer", "title": "Integer and discrete optimization", "kind": "concept", "track": "or", "pre": ["lp", "complexity"], "frontier": false, "core": "Restrict variables to integers and linear programming becomes NP-hard, yet solvers handle large instances by branch and bound: solve the LP relaxation for a bound, split on a fractional variable, and prune any branch whose bound cannot beat the best solution so far.", "reach": "How scheduling, routing, and planning problems are solved in practice; constraint programming and local search are the other tools.", "uses": "Airline crew scheduling, delivery routing, sports league calendars, power plant commitment, and kidney exchange matching, through solvers like Gurobi and CPLEX. Learned branching rules inside these solvers are an active ML research area.", "worth": "you go into operations research, logistics, or ML for combinatorial optimization; skip it if you never face scheduling or routing.", "resources": [{"title": "Basic Modeling for Discrete Optimization", "url": "https://www.coursera.org/learn/basic-modeling", "type": "course", "by": "Jimmy Lee, Peter Stuckey, CUHK, Coursera", "level": 1, "note": "Write models in MiniZinc and let solvers find the answers, starting with sets, functions, and several models of one problem."}, {"title": "Solving Algorithms for Discrete Optimization", "url": "https://www.coursera.org/learn/solving-algorithms-discrete-optimization", "type": "course", "by": "Jimmy Lee, Peter Stuckey, CUHK, Coursera", "level": 2, "note": "How the solvers work: constraint programming, mixed integer programming, and local search."}, {"title": "OR-Tools", "url": "https://developers.google.com/optimization", "type": "code", "by": "Google", "level": 2, "note": "Open-source solvers for integer and linear programming, vehicle routing, flows, and the CP-SAT constraint solver, callable from Python, C++, Java, or C#."}, {"title": "A Course in Combinatorial Optimization", "url": "https://homepages.cwi.nl/~lex/files/dict.pdf", "type": "notes", "by": "Alexander Schrijver, 2017", "level": 3, "note": "Polyhedral combinatorics: Chapter 8 shows when the LP relaxation is already integral (total unimodularity), alongside matchings, flows, and matroids."}, {"title": "Discrete Optimization assignments", "url": "https://github.com/discreteoptimization/assignment", "type": "project", "by": "Pascal Van Hentenryck, Carleton Coffrin, Coursera", "level": 2, "build": "Solvers for knapsack, graph coloring, facility location, and set cover, run on the given instances and scored by the repository’s graders against a low and a high quality bar.", "teaches": "When dynamic programming, branch and bound, a MIP solver, or local search wins, and how far each one scales on real instance sizes.", "time": "a month", "signature": true}]}, {"id": "stochproc", "title": "Stochastic processes and queues", "kind": "concept", "track": "or", "pre": ["prob", "linalg"], "frontier": false, "core": "A stochastic process is a random quantity evolving in time. In a Markov chain the next state depends only on the current one, so long-run behavior settles into a stationary distribution; in queues, Little’s law L = lambda W ties queue length to waiting time.", "reach": "Leads to stochastic calculus, order arrival models in market microstructure, MCMC sampling, and capacity planning for servers.", "uses": "Server and call center capacity planning, inventory, telecom networks, reliability, epidemics, and finance. MCMC and reinforcement learning’s Markov decision processes are Markov chains, and diffusion models are stochastic processes.", "worth": "you work on RL, sampling, diffusion models, or system performance; Markov chains and Little’s law go far without measure theory.", "resources": [{"title": "Introduction to Probability", "url": "https://probabilitybook.net/", "type": "book", "by": "Joe Blitzstein, Jessica Hwang, 2nd edition, 2019", "level": 1, "note": "The Markov Chains, Markov Chain Monte Carlo, and Poisson Processes chapters, in the same story-first style as Stat 110."}, {"title": "Essentials of Stochastic Processes", "url": "https://sites.math.duke.edu/~rtd/EOSP/EOSP2E.pdf", "type": "book", "by": "Rick Durrett, 2nd edition, 2011", "level": 2, "note": "Free from the author. Chapters 1 to 4 cover Markov chains, Poisson processes, renewal theory, and continuous-time chains, with queues in Sections 3.2 and 4.5."}, {"title": "MIT 6.262: Discrete Stochastic Processes", "url": "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/", "type": "course", "by": "Robert Gallager, MIT OCW, 2011", "level": 2, "note": "Lectures 4 to 9 on Poisson processes and finite Markov chains, Lecture 13 on Little’s law and the M/G/1 queue, and Lectures 23 and 24 on martingales."}, {"title": "Performance Modeling and Design of Computer Systems: Queueing Theory in Action", "url": "https://www.cs.cmu.edu/~harchol/PerformanceModeling/book.html", "type": "book", "by": "Mor Harchol-Balter, Cambridge, 2013", "level": 2, "note": "Queueing for computer scientists: Little’s law, Markov chains, M/M/1 and M/M/k server farms, and scheduling under heavy-tailed job sizes.", "paid": true}, {"title": "Stochastic Processes (lecture notes)", "url": "https://adembo.su.domains/math-136/nnotes.pdf", "type": "notes", "by": "Amir Dembo, revised by Kevin Ross, 2021", "level": 3, "note": "The measure-theoretic version from Stanford’s Math 136: Chapters 4 and 5 build martingales, stopping times, and Brownian motion, the road into stochcalc."}, {"title": "Introduction to Probability Models", "url": "https://shop.elsevier.com/books/introduction-to-probability-models/ross/978-0-443-18761-2", "type": "book", "by": "Sheldon Ross, 13th edition, 2023", "level": 2, "note": "The standard applied text: chapters on queueing theory, reliability, renewal theory, simulation, and martingales, with many exercises.", "paid": true}, {"title": "Simulate a queue against its stationary distribution", "url": "https://sites.math.duke.edu/~rtd/EOSP/EOSP2E.pdf", "type": "project", "by": "Built on Durrett, Essentials of Stochastic Processes, 2011", "level": 1, "build": "An event-driven simulator for queues with Poisson arrivals and exponential service, run on Durrett’s barbershop: arrivals at rate 2, service at rate 3, and two waiting chairs.", "teaches": "Checking a stationary distribution solved from detailed balance against long simulated runs, and why Little’s law needs the rate of customers who actually enter.", "time": "a day", "made": true, "done": "The simulated shop is empty 27/65 of the time and a customer who enters stays 0.579 hours on average, as in Example 4.14 and Section 4.5."}, {"title": "Break a substitution cipher with Metropolis", "url": "https://doi.org/10.1090/S0273-0979-08-01238-X", "type": "project", "by": "Built on Diaconis, The Markov Chain Monte Carlo Revolution, 2009", "level": 2, "build": "A Metropolis sampler over substitution keys that scores each key by letter-pair frequencies from a long novel and swaps two letters per step, run on an enciphered passage.", "teaches": "How to design a Markov chain whose stationary distribution favors good answers, and why accepting some worse moves keeps it from getting stuck.", "time": "a weekend", "made": true, "done": "A scrambled passage of Hamlet reads correctly after about 2,000 steps and is still a mess after 100, as in Section 1 of the paper."}]}, {"id": "gametheory", "title": "Game theory", "kind": "concept", "track": "or", "pre": ["prob", "lp"], "frontier": false, "core": "A game lists each player’s strategies and payoffs. In a Nash equilibrium no player gains by deviating alone; players may need to randomize, and in two-player zero-sum games the equilibrium is the minimax solution of a linear program.", "reach": "Mechanism design turns the question around and designs the game itself; market microstructure models trading as a game.", "uses": "Auctions, pricing, negotiation, military strategy, and poker bots like Libratus and Pluribus. GANs are framed as two-player games, multi-agent RL studies equilibria, and Shapley values for feature attribution come from cooperative game theory.", "worth": "you work on multi-agent systems, economics, or adversarial training; Nash equilibria and minimax are enough unless you specialize.", "resources": [{"title": "Yale ECON 159: Game Theory", "url": "https://oyc.yale.edu/economics/econ-159", "type": "lectures", "by": "Ben Polak, Open Yale Courses, 2007", "level": 1, "note": "Twenty-four lectures that build Nash equilibrium, mixed strategies, backward induction, repeated games, and asymmetric information from classroom games."}, {"title": "Multiagent Systems", "url": "http://www.masfoundations.org/", "type": "book", "by": "Yoav Shoham, Kevin Leyton-Brown, Cambridge, 2009", "level": 2, "note": "Free ebook. Chapters 3 to 5: normal-form games, computing their solution concepts, and games with sequential actions."}, {"title": "Algorithmic Game Theory (CS364A)", "url": "http://timroughgarden.org/f13/f13.html", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2013", "level": 3, "note": "Lectures 13 to 20: the hierarchy of equilibrium concepts, no-regret dynamics, minimax, and why computing a mixed Nash equilibrium is PPAD-complete."}, {"title": "Game Theory", "url": "https://www.coursera.org/learn/game-theory-1", "type": "course", "by": "Matthew Jackson, Kevin Leyton-Brown, Yoav Shoham, Stanford, UBC, Coursera", "level": 1, "note": "A shorter, more formal alternative to ECON 159, through Bayesian and repeated games."}, {"title": "An Introduction to Counterfactual Regret Minimization", "url": "https://modelai.gettysburg.edu/2013/cfr/", "type": "project", "by": "Neller, Lanctot, 2013", "level": 2, "build": "Regret matching for rock-paper-scissors, then counterfactual regret minimization for Kuhn poker and the dice game Dudo, converging toward a Nash equilibrium.", "teaches": "How self-play with regret updates finds equilibria in games with hidden information, the idea behind the poker programs that beat professionals.", "time": "a weekend"}]}, {"id": "mechanism", "title": "Mechanism design and auctions", "kind": "concept", "track": "or", "pre": ["gametheory"], "frontier": false, "core": "Mechanism design chooses the rules of a game so that players acting in their own interest produce the outcome the designer wants. In a second-price auction bidding your true value is optimal, and Myerson’s lemma describes every truthful single-item auction and the revenue it earns.", "reach": "Behind sponsored search, spectrum auctions, and kidney exchange; microstructure studies the auctions that run exchanges.", "uses": "Search ad auctions, FCC spectrum auctions, kidney exchange, school choice and medical residency matching, and online marketplaces. In ML research, neural networks have been trained to discover auction rules (automated mechanism design).", "worth": "you work on marketplaces, ads, economics, or multi-agent incentives; skip it otherwise, as little of it carries elsewhere.", "resources": [{"title": "Algorithmic Game Theory (Stanford CS364A, Fall 2013)", "url": "https://www.youtube.com/playlist?list=PLEGCF-WLh2RJBqmxvZ0_ie-mleCFhi2N4", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2013", "level": 1, "note": "Lectures 1 to 10: second-price auctions, Myerson’s lemma, revenue-maximizing auctions, VCG, spectrum auctions, and kidney exchange."}, {"title": "Game Theory II: Advanced Applications", "url": "https://www.coursera.org/learn/game-theory-2", "type": "course", "by": "Matthew Jackson, Kevin Leyton-Brown, Yoav Shoham, Stanford, UBC, Coursera", "level": 2, "note": "The economics side: social choice, mechanism design, efficient mechanisms, and auctions."}, {"title": "Multiagent Systems", "url": "http://www.masfoundations.org/", "type": "book", "by": "Yoav Shoham, Kevin Leyton-Brown, Cambridge, 2009", "level": 2, "note": "Chapters 10 and 11: mechanism design and auctions, with full proofs."}, {"title": "Mechanism Design and Approximation", "url": "http://jasonhartline.com/MDnA/", "type": "book", "by": "Jason Hartline, draft, 2011 to 2025", "level": 3, "note": "The classical theory of Bayesian optimal mechanisms, then when simple mechanisms approximate them, from a Northwestern graduate course."}, {"title": "Find the auction that maximizes revenue", "url": "http://timroughgarden.org/f13/l/l5.pdf", "type": "project", "by": "Built on Roughgarden, CS364A Lecture 5, 2013", "level": 2, "build": "A simulator for sealed-bid auctions with values drawn from known distributions, comparing second-price auctions with and without reserves, and computing Myerson’s virtual values.", "teaches": "Why a reserve price trades lost sales for higher prices, and how virtual values pick the optimal reserve for any regular distribution.", "time": "a day", "made": true, "done": "With two bidders uniform on [0, 1], expected revenue is 1/3 without a reserve and 5/12 with a reserve of 1/2, as in Section 1.4 of the notes."}]}, {"id": "nand", "title": "From Nand to Tetris", "kind": "course", "track": "lowlevel", "pre": [], "frontier": false, "core": "Every part of a computer can be built from one gate. NAND makes the other gates, gates make an adder, memory, and a CPU, and an assembler, virtual machine, compiler, and operating system stack on top, each using only the layer below.", "reach": "Each project is a small version of a later node: digital logic, architecture, assembly, compilers, and operating systems.", "uses": "Understanding a computer end to end, from logic gates to a compiler and operating system, by building each layer yourself. It is a teaching project, not an industrial tool, and makes later systems courses concrete.", "worth": "you have never built a computer from gates and want systems intuition fast; skip it if you already took architecture and compilers.", "resources": [{"title": "From Nand to Tetris", "url": "https://www.nand2tetris.org/", "type": "course", "by": "Noam Nisan, Shimon Schocken, 2025", "level": 1, "note": "Twelve projects with lectures, slides, and free tools: 1 to 6 build gates, an ALU, memory, a CPU, and an assembler; 7 to 12 build a VM, a compiler, and an OS."}, {"title": "The Elements of Computing Systems (2nd edition)", "url": "https://mitpress.mit.edu/9780262539807/the-elements-of-computing-systems/", "type": "book", "by": "Nisan, Schocken, MIT Press, 2021", "level": 2, "note": "The course’s book, one chapter per project, rewritten to separate each abstraction from its implementation.", "paid": true}, {"title": "Build an 8-bit computer", "url": "https://eater.net/8bit", "type": "video", "by": "Ben Eater, 2016", "level": 1, "note": "The same climb on real breadboards: clock, registers, ALU, RAM, program counter, and microcoded control logic, with the timing a simulator hides."}, {"title": "Nand to Tetris projects", "url": "https://www.nand2tetris.org/course", "type": "project", "by": "Nisan, Schocken", "level": 1, "build": "A computer from NAND gates up: logic gates, an ALU, memory, a CPU, an assembler, a virtual machine, a compiler, and an operating system, each tested in the course’s simulators.", "teaches": "How each layer of a computer is built from nothing but the layer below it.", "time": "a term", "signature": true}]}, {"id": "c", "title": "C programming and memory", "kind": "concept", "track": "lowlevel", "pre": [], "frontier": false, "core": "C treats memory as one numbered array of bytes. A pointer is an index into it, array indexing is pointer arithmetic, and you manage the stack, the heap, and static data yourself; most C bugs read or write bytes the program does not own.", "reach": "The language of operating systems and the source of the memory bugs that binary exploitation turns into attacks.", "uses": "Operating systems, databases, embedded firmware, language runtimes like CPython, and the C and C++ kernels under PyTorch and CUDA. Writing a custom GPU kernel or diagnosing a segfault in a training job needs it.", "worth": "you will write performance code, CUDA kernels, or systems software; even pure ML researchers gain from knowing how memory works.", "resources": [{"title": "Beej’s Guide to C Programming", "url": "https://beej.us/guide/bgc/", "type": "book", "by": "Brian Hall (Beej), 2026", "level": 1, "note": "Chapters 5, 6, 7, 11, and 12: pointers, arrays, strings, pointer arithmetic, and manual memory allocation."}, {"title": "CS 61C: Great Ideas in Computer Architecture", "url": "https://cs61c.org/", "type": "course", "by": "UC Berkeley, Fall 2026", "level": 2, "note": "The C lectures, the C and C debugging labs, and the first project; slides and labs are public, recordings are not."}, {"title": "Modern C", "url": "https://gustedt.gitlabpages.inria.fr/modern-c/", "type": "book", "by": "Jens Gustedt, C23 edition, 2025", "level": 3, "note": "Free from the author’s page: the whole language as the C23 standard defines it."}]}, {"id": "arch", "title": "Computer architecture", "kind": "concept", "track": "lowlevel", "pre": ["nand", "c", "digital"], "frontier": false, "core": "A processor repeats fetch, decode, and execute on instructions held in memory. Speed comes from overlapping instructions in a pipeline, predicting branches, and caches that exploit locality, because a trip to main memory costs about a hundred times more than an add.", "reach": "The machine that assembly targets, that the operating system virtualizes, and whose caches decide how fast real code runs.", "uses": "Writing fast code anywhere, designing CPUs and GPUs, and seeing why ML workloads are often limited by memory bandwidth rather than arithmetic. FlashAttention’s speedup comes from respecting the GPU memory hierarchy.", "worth": "you care about training or inference speed, kernels, or hardware; skip deep pipeline details unless you design chips.", "resources": [{"title": "6.004 Computation Structures", "url": "https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/", "type": "course", "by": "MIT OpenCourseWare, Spring 2017", "level": 1, "note": "Units 9 to 16: instruction sets, procedures and stacks, building the Beta processor, caches, pipelining, and virtual memory, with topic videos."}, {"title": "Computer Systems: A Programmer’s Perspective (3rd edition)", "url": "https://csapp.cs.cmu.edu/", "type": "book", "by": "Bryant, O’Hallaron, Pearson, 2015", "level": 2, "note": "Chapter 4 builds a pipelined Y86-64 processor; Chapters 5 and 6 show how the pipeline and the cache hierarchy set the speed of real code.", "paid": true}, {"title": "Computer Architecture", "url": "https://safari.ethz.ch/architecture/fall2025/doku.php?id=start", "type": "lectures", "by": "Onur Mutlu, ETH Zurich, Fall 2025", "level": 3, "note": "Recorded research-level lectures: memory systems and DRAM, prefetching, cache coherence, memory ordering, virtual memory, and GPUs."}]}, {"id": "assembly", "title": "Assembly and how C compiles", "kind": "concept", "track": "lowlevel", "pre": ["arch"], "frontier": false, "core": "A compiler turns each C function into register moves, arithmetic, compares, and jumps. Locals live in registers or a stack frame, a call pushes a return address and jumps, and a calling convention fixes which registers carry arguments and the return value.", "reach": "Reading compiler output is how you check performance, write a compiler backend, and find and exploit memory bugs.", "uses": "Performance tuning, crash debugging, compilers and JITs, malware analysis, and security research. Kernel engineers read generated GPU code (PTX and SASS) to check what the compiler actually did.", "worth": "you write performance-critical or security-sensitive code; most ML researchers only read it occasionally, so a light pass works.", "resources": [{"title": "CS107 Guide to x86-64", "url": "https://web.stanford.edu/class/cs107/guide/x86-64.html", "type": "notes", "by": "Stanford CS107", "level": 1, "note": "Registers, addressing modes, and the common instructions on one page; keep it open while reading compiler output."}, {"title": "Compiler Explorer", "url": "https://godbolt.org/", "type": "code", "by": "Matt Godbolt, since 2012", "level": 1, "note": "Paste a C function and read the assembly the compiler emits, first at -O0 and then at -O2."}, {"title": "15-213: Introduction to Computer Systems", "url": "https://www.cs.cmu.edu/~213/", "type": "course", "by": "CMU, Fall 2026", "level": 2, "note": "The Machine Programming lectures, Parts I to IV, whose slides follow CS:APP Chapter 3."}, {"title": "Computer Systems: A Programmer’s Perspective (3rd edition)", "url": "https://csapp.cs.cmu.edu/", "type": "book", "by": "Bryant, O’Hallaron, Pearson, 2015", "level": 2, "note": "Chapter 3, Machine-Level Representation of Programs: control flow, procedures, arrays, structs, and buffer overflows.", "paid": true}, {"title": "CS:APP Lab Assignments", "url": "https://csapp.cs.cmu.edu/3e/labs.html", "type": "project", "by": "Bryant, O’Hallaron, CMU", "level": 2, "note": "Self-study handouts are free.", "build": "A defused binary bomb, found by reading its x86-64 disassembly in a debugger, then working exploits for buffer overflows and return-oriented programming in the Attack Lab.", "teaches": "Reading machine code fluently, and why memory safety matters.", "time": "a week"}]}, {"id": "compilers", "title": "Compilers and interpreters", "kind": "concept", "track": "lowlevel", "pre": ["assembly", "automata"], "frontier": false, "core": "A compiler is a chain of translations: scan text into tokens, parse tokens into a tree, check the tree, lower it to a simpler intermediate form, optimize that form, and emit machine code. An interpreter stops partway and executes the tree or bytecode directly.", "reach": "Parsing uses the grammars of automata theory; code generation targets the instructions and calling conventions of assembly.", "uses": "Every programming language, the JavaScript engines in browsers, database query engines, and ML compilers like XLA, TVM, Triton, and torch.compile that fuse and lower neural network graphs into GPU and TPU code.", "worth": "you want to work on ML compilers, kernels, or languages; skip it if you never look beneath your framework.", "resources": [{"title": "Crafting Interpreters", "url": "https://craftinginterpreters.com/", "type": "book", "by": "Robert Nystrom, 2021", "level": 1, "note": "Chapter 2 maps the whole pipeline. Part II builds a tree-walking interpreter in Java, Part III a bytecode virtual machine in C."}, {"title": "An Incremental Approach to Compiler Construction", "url": "http://scheme2006.cs.uchicago.edu/11-ghuloum.pdf", "type": "paper", "by": "Abdulaziz Ghuloum, Scheme Workshop, 2006", "level": 2, "note": "Compiles a large subset of Scheme to x86 assembly in small steps, each of which leaves a working compiler."}, {"title": "My First Language Frontend with LLVM (Kaleidoscope)", "url": "https://llvm.org/docs/tutorial/", "type": "tutorial", "by": "LLVM Project", "level": 2, "note": "Chapters 3 and 4: generate LLVM IR, then add the optimizer and a JIT; Chapter 8 emits object code."}, {"title": "CS 6120: Advanced Compilers, The Self-Guided Course", "url": "https://www.cs.cornell.edu/courses/cs6120/2020fa/self-guided/", "type": "course", "by": "Adrian Sampson, Cornell, 2020", "level": 3, "note": "Lessons 3 to 7: local optimization, data flow, SSA, LLVM, and loops, with videos, notes, and implementation tasks."}]}, {"id": "os", "title": "Operating systems", "kind": "concept", "track": "lowlevel", "pre": ["arch", "c"], "frontier": false, "core": "An operating system gives each program the illusion of its own CPU and memory, as processes and virtual address spaces, while sharing the real hardware safely through traps, timers, and page tables. It also turns disks into files and gives threads locks.", "reach": "Processes, sockets, and files are what networking, databases, and binary exploitation build on or attack.", "uses": "Every computer and phone, cloud virtual machines, Docker containers, and cluster schedulers. vLLM’s PagedAttention borrows virtual memory paging to manage the KV cache when serving language models.", "worth": "you build systems or serving infrastructure, or debug performance on real machines; skip kernel internals if you only run training scripts.", "resources": [{"title": "Operating Systems: Three Easy Pieces", "url": "https://pages.cs.wisc.edu/~remzi/OSTEP/", "type": "book", "by": "Remzi and Andrea Arpaci-Dusseau, version 1.10", "level": 1, "note": "Chapters 4 to 6 (processes, direct execution), 13 to 20 (virtual memory), 26 to 31 (threads, locks, condition variables), and 39 to 42 (file systems, journaling)."}, {"title": "CS 162: Operating Systems and System Programming", "url": "https://cs162.org/", "type": "course", "by": "UC Berkeley, Fall 2026", "level": 2, "note": "Lecture videos and slides, plus Pintos projects that add user programs, threads, and a file system to a teaching kernel."}, {"title": "6.1810: Operating System Engineering", "url": "https://pdos.csail.mit.edu/6.1810/", "type": "course", "by": "MIT, Fall 2026", "level": 3, "note": "Labs that change xv6, a small Unix teaching kernel: system calls, page tables, traps, copy-on-write, locks, a network driver, and a file system."}, {"title": "6.1810 Lab: Copy-on-Write Fork for xv6", "url": "https://pdos.csail.mit.edu/6.1810/2025/labs/cow.html", "type": "project", "by": "MIT 6.1810, Fall 2025", "level": 2, "build": "Copy-on-write fork in the xv6 kernel: share pages between parent and child read-only, catch the page fault on the first write, and copy only then.", "teaches": "Page tables, page faults, and reference counts working together inside a real kernel.", "time": "a weekend"}]}, {"id": "networking", "title": "Computer networks", "kind": "concept", "track": "lowlevel", "pre": ["os"], "frontier": false, "core": "The internet is layers. Links move frames between neighbors, IP forwards packets across networks with no guarantees, TCP builds a reliable ordered byte stream on top using acknowledgments, retransmission, and congestion control, and applications like DNS and HTTP speak over it.", "reach": "Distributed systems assume this unreliable network, and network attacks exploit the trust each layer extends.", "uses": "The internet, data centers, video streaming, and online games. Large training runs depend on it: all-reduce of gradients across thousands of GPUs over InfiniBand or RDMA networks can be the bottleneck.", "worth": "you work on distributed training, serving, or infrastructure; a researcher on one machine can stay at the level of TCP and HTTP.", "resources": [{"title": "Introduction to the Internet: Architecture and Protocols (CS 168 Textbook)", "url": "https://textbook.cs168.io/", "type": "book", "by": "Peyrin Kao, UC Berkeley, 2024", "level": 1, "note": "Layers and headers, routing and BGP, TCP and congestion control, DNS and HTTP, then datacenters."}, {"title": "Beej’s Guide to Network Programming", "url": "https://beej.us/guide/bgnet/", "type": "book", "by": "Brian Hall (Beej), 2026", "level": 1, "note": "Sections 2 to 6: sockets, addresses, the system calls, and a simple stream server and client in C."}, {"title": "CS 144: Introduction to Computer Networking", "url": "https://cs144.github.io/", "type": "course", "by": "Stanford", "level": 2, "note": "Checkpoints build a byte stream, a TCP receiver and sender, a network interface, and an IP router."}, {"title": "CS 144 checkpoints: build TCP", "url": "https://cs144.github.io/assignments/check0.pdf", "type": "project", "by": "Stanford CS 144", "level": 2, "note": "Checkpoint 0 is linked; checkpoints 1 to 7 are on the course page.", "build": "A TCP implementation in C++, from a byte stream and a reassembler through the TCP receiver and sender to a network interface and an IP router.", "teaches": "How reliable delivery is built on an unreliable network, one layer at a time.", "time": "a term"}]}, {"id": "genchem", "title": "General chemistry", "kind": "concept", "track": "chem", "pre": [], "frontier": false, "core": "Electrons fill orbitals in a fixed order, and that filling explains the periodic table: how readily an atom gains, loses, or shares electrons decides which bonds it forms. Reactions conserve atoms, and energy and equilibrium decide which way they run and how far.", "reach": "The base for organic chemistry, physical chemistry, and cell biology; batteries, semiconductors, and rocket propellants in propulsion are applied general chemistry.", "uses": "Batteries, fertilizers, semiconductors, pharmaceuticals, water treatment, and fuels. It is the entry point to materials and molecular ML, where models predict the properties of compounds before chemists make them.", "worth": "you plan chemistry, biology, or materials ML; skip it if those fields are not ahead of you, since little transfers back to ML.", "resources": [{"title": "MIT 5.111SC: Principles of Chemical Science", "url": "https://ocw.mit.edu/courses/5-111sc-principles-of-chemical-science-fall-2014/", "type": "course", "by": "Catherine Drennan, MIT OCW, 2014", "level": 1, "note": "Lecture videos on atomic and molecular structure, thermodynamics, equilibria, kinetics, and catalysis."}, {"title": "Chemistry 2e", "url": "https://openstax.org/details/books/chemistry-2e", "type": "book", "by": "OpenStax, 2019", "level": 1, "note": "Chapters 6 and 7: electron configurations, periodic trends, and ionic and covalent bonding."}, {"title": "ChemCollective Virtual Lab problems", "url": "https://chemcollective.org/vlabs", "type": "project", "by": "ChemCollective, Carnegie Mellon University", "level": 1, "note": "The problems are grouped by topic and ranked by difficulty.", "build": "Solutions to problems set in a simulated wet lab: diluting stock solutions, finding the coefficients of unknown reactions, measuring reaction enthalpies, titrating an unknown acid, and measuring solubility products.", "teaches": "Turning a calculation about moles, heat, or equilibrium into a lab procedure, then checking the prediction against what the simulated glassware shows.", "time": "a week"}]}, {"id": "organic", "title": "Organic chemistry", "kind": "concept", "track": "chem", "pre": ["genchem"], "frontier": false, "core": "Carbon makes four stable bonds, so organic molecules are skeletons carrying functional groups whose electron-rich and electron-poor sites predict reactivity. Most reactions are an electron pair from a nucleophile attacking an electrophile, drawn as curved arrows, so a few mechanisms explain thousands of reactions.", "reach": "Biochem is organic chemistry in water; drug design and the molecule generators of machine learning work in its vocabulary.", "uses": "Drug discovery, plastics and polymers, dyes, pesticides, and fragrances. Retrosynthesis and reaction-prediction models are trained on organic reactions, and SMILES strings write molecules as text for language models.", "worth": "you want ML for drug discovery or chemistry; otherwise it is a heavy course you can skip.", "resources": [{"title": "Organic chemistry", "url": "https://www.khanacademy.org/science/organic-chemistry", "type": "course", "by": "Khan Academy", "level": 1, "note": "Starts from structure and bonding (dot structures, hybridization, bond-line drawings) and builds to reactions."}, {"title": "Organic Chemistry: A Tenth Edition", "url": "https://openstax.org/details/books/organic-chemistry", "type": "book", "by": "John McMurry, OpenStax", "level": 2, "note": "A full free textbook, organized by functional group and mechanism."}, {"title": "Master Organic Chemistry", "url": "https://www.masterorganicchemistry.com/", "type": "blog", "by": "James Ashenhurst", "level": 2, "note": "Short articles on each mechanism, such as SN1, SN2, and E2; good for curved arrow practice."}, {"title": "CHEM 125a: Freshman Organic Chemistry I", "url": "https://oyc.yale.edu/chemistry/chem-125a", "type": "lectures", "by": "J. Michael McBride, Open Yale Courses, 2008", "level": 3, "note": "Why structure and mechanism are what they are, traced to their experimental and quantum basis."}, {"title": "MIT 5.12: Organic Chemistry I problem sets", "url": "https://ocw.mit.edu/courses/5-12-organic-chemistry-i-spring-2003/pages/assignments/", "type": "project", "by": "Barbara Imperiali, Sarah Tabacco, MIT OCW, 2003", "level": 2, "build": "Answers to nine problem sets with posted solutions: Lewis structures and acidity, stereochemistry, stepwise mechanisms drawn with curved arrows, and multistep syntheses through aromatic substitution.", "teaches": "Predicting a product by tracing electron pairs from nucleophile to electrophile yourself, which reading worked mechanisms does not train.", "time": "a month"}]}, {"id": "physchem", "title": "Physical chemistry: thermodynamics and kinetics", "kind": "concept", "track": "chem", "pre": ["genchem", "thermo"], "frontier": false, "core": "Free energy, G = H - TS, decides whether a reaction runs: it proceeds while G falls, and equilibrium sits at the minimum. Speed is a separate question, set by the energy barrier Ea: by the Arrhenius law the rate scales as exp(-Ea/RT).", "reach": "The thermodynamic half of quantum chemistry; batteries, combustion in propulsion, and protein folding in biochemistry are free energy calculations.", "uses": "Battery and fuel cell design, combustion, drug binding, catalysis, and industrial reactors. Molecular dynamics and free energy calculations, now sped up by learned interatomic potentials, compute these quantities to screen drugs and materials.", "worth": "you work on molecular ML, materials, or batteries and need to know what the simulators compute; skip it otherwise.", "resources": [{"title": "Chemistry 2e", "url": "https://openstax.org/details/books/chemistry-2e", "type": "book", "by": "OpenStax, 2019", "level": 1, "note": "Chapters 12 (kinetics), 13 (equilibria), and 16 (thermodynamics: entropy and free energy)."}, {"title": "MIT 5.60: Thermodynamics and Kinetics", "url": "https://ocw.mit.edu/courses/5-60-thermodynamics-kinetics-spring-2008/", "type": "lectures", "by": "Moungi Bawendi, Keith Nelson, MIT OCW, 2008", "level": 2, "note": "Video lectures on the laws of thermodynamics, chemical equilibrium in gas and solution, and reaction rates."}, {"title": "Atkins Physical Chemistry, Volume 1", "url": "https://global.oup.com/academic/product/atkins-physical-chemistry-v1-9780198851301", "type": "book", "by": "Atkins, de Paula, Keeler, 12th edition", "level": 2, "note": "The standard textbook, with worked examples and the math each derivation needs.", "paid": true}, {"title": "Ammonia equilibrium by minimizing free energy", "url": "https://openstax.org/books/chemistry-2e/pages/16-4-free-energy", "type": "project", "by": "Built on OpenStax Chemistry 2e, section 16.4", "level": 1, "build": "A script that computes ΔG°(T) for N2 + 3H2 → 2NH3 from tabulated enthalpies and entropies, then finds the equilibrium ammonia fraction by minimizing G over the extent of reaction at several temperatures and pressures.", "teaches": "That equilibrium sits at the bottom of a free energy curve, and why heating gives ammonia yield away while pressure wins it back.", "time": "an afternoon", "made": true, "done": "ΔG° for 2NH3 → N2 + 3H2 comes out near 33.0 kJ at 298 K, as in Example 16.12, and the minimum of G sits where Q equals exp(-ΔG°/RT)."}]}, {"id": "quantchem", "title": "Quantum and computational chemistry", "kind": "concept", "track": "chem", "pre": ["qm", "physchem", "numerics"], "frontier": true, "core": "Electrons in a molecule obey the Schrödinger equation, which cannot be solved exactly beyond hydrogen. Hartree-Fock gives each electron an orbital in the average field of the others; density functional theory replaces the wavefunction with the electron density. The energies predict structures, barriers, and spectra.", "reach": "Generates the training data for learned molecular models and potentials, and is a leading expected application of quantum computing.", "uses": "Drug, catalyst, and battery material discovery through codes like Gaussian, VASP, and Quantum ESPRESSO. DFT calculations produce the datasets, such as QM9 and Open Catalyst, that train molecular ML models.", "worth": "you want to build ML for molecules or materials and understand its training labels; the prerequisites are heavy, so skip it otherwise.", "resources": [{"title": "Psi4NumPy", "url": "https://github.com/psi4/psi4numpy", "type": "code", "by": "Psi4 developers", "level": 2, "note": "Tutorials 03 (Hartree-Fock) and 04 (density functional theory) derive each method, then build it in NumPy."}, {"title": "A bird’s-eye view of density-functional theory", "url": "https://arxiv.org/abs/cond-mat/0211443", "type": "tutorial", "by": "Klaus Capelle, 2002", "level": 2, "note": "An informal primer: the Hohenberg-Kohn theorem, the Kohn-Sham equations, and the approximate functionals used in practice."}, {"title": "Modern Quantum Chemistry", "url": "https://store.doverpublications.com/products/9780486691862", "type": "book", "by": "Attila Szabo, Neil Ostlund, Dover 1996", "level": 2, "note": "Chapters 1 to 3 build up to Hartree-Fock; chapters 4 to 7 improve on it.", "paid": true}, {"title": "Neural Message Passing for Quantum Chemistry", "url": "https://arxiv.org/abs/1704.01212", "type": "paper", "by": "Gilmer et al., 2017", "level": 3, "note": "Graph networks that predict DFT-computed molecular properties at a fraction of the cost."}, {"title": "Crawford Group Programming Projects", "url": "https://github.com/CrawfordGroup/ProgrammingProjects", "type": "project", "by": "T. Daniel Crawford’s group", "level": 2, "build": "A quantum chemistry program from integrals you are given: molecular geometry, vibrational analysis, Hartree-Fock with DIIS, MP2, and coupled cluster CCSD and CCSD(T).", "teaches": "What the methods in every quantum chemistry package compute, as loops over integrals you wrote yourself.", "time": "a month", "signature": true}]}, {"id": "biochem", "title": "Biochemistry", "kind": "concept", "track": "chem", "pre": ["organic"], "frontier": false, "core": "Proteins are chains of amino acids that fold into shapes, and the shape decides what they bind and what they catalyze. Enzymes speed reactions by lowering the energy barrier without moving the equilibrium, and metabolism is chains of such reactions paid for with ATP.", "reach": "Protein structure links to AlphaFold and protein design in the machine learning roadmap; cell biology and genetics build on it.", "uses": "Drug design, enzymes for detergents and biofuels, diagnostics, and food science. AlphaFold, protein language models, and
