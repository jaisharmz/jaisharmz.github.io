aldynamics.epfl.ch/online/", "type": "book", "by": "Gerstner, Kistler, Naud, Paninski, 2014", "level": 2, "note": "Chapter 2 is the Hodgkin-Huxley model; chapter 17 is memory and attractor dynamics."}, {"title": "Theoretical Neuroscience", "url": "https://mitpress.mit.edu/9780262541855/theoretical-neuroscience/", "type": "book", "by": "Peter Dayan, Laurence Abbott, 2001", "level": 2, "note": "The standard text on computational and mathematical models of neural systems.", "paid": true}, {"title": "A quantitative description of membrane current and its application to conduction and excitation in nerve", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC1392413/", "type": "paper", "by": "Alan Hodgkin, Andrew Huxley, 1952", "level": 3, "note": "The original model, fit to measurements on the squid giant axon."}]}, {"id": "websec", "title": "Web security", "kind": "concept", "track": "security", "pre": ["webdev"], "frontier": false, "core": "Web attacks abuse trust in input: injection (SQL, cross-site scripting) runs attacker data as code, request forgery makes a trusted party send the attacker’s request, and broken access control lets one user act as another. Defenses separate code from data and check permissions per request.", "reach": "The web category of capture the flag; pairs with network security.", "resources": [{"title": "Web Security Academy", "url": "https://portswigger.net/web-security", "type": "course", "by": "PortSwigger", "level": 1, "note": "Free reading and live labs for each class of bug: SQL injection, XSS, CSRF, SSRF, access control, and more."}, {"title": "Computer Security (CS 161 Textbook)", "url": "https://textbook.cs161.org/", "type": "notes", "by": "Wagner, Weaver, Kao, and others, UC Berkeley, 2024", "level": 1, "note": "Chapters 17 to 22: SQL injection, the web, the same-origin policy, cookies and sessions, CSRF, and XSS."}, {"title": "OWASP Top 10:2025", "url": "https://owasp.org/Top10/2025/", "type": "notes", "by": "OWASP Foundation, 2025", "level": 2, "note": "The ten most common web risk categories, from broken access control and misconfiguration to supply chain failures."}, {"title": "6.5660: Computer Systems Security", "url": "https://css.csail.mit.edu/6.5660/2024/", "type": "course", "by": "MIT, Spring 2024", "level": 3, "note": "Lecture 9 on the web security model and Lab 4 on browser security; the other lectures and labs cover isolation, side channels, and secure channels."}]}, {"id": "binex", "title": "Binary exploitation and reverse engineering", "kind": "concept", "track": "security", "pre": ["assembly", "os"], "frontier": false, "core": "Overflow a C buffer and you overwrite the return address stored above it, sending execution where you choose. Canaries, non-executable stacks, and ASLR push attackers to chain existing code instead (return-oriented programming), and reverse engineering reads binaries to find such bugs.", "reach": "The pwn and reversing categories of capture the flag; memory-safe languages exist to rule these bugs out.", "resources": [{"title": "Computer Security (CS 161 Textbook)", "url": "https://textbook.cs161.org/", "type": "notes", "by": "Wagner, Weaver, Kao, and others, UC Berkeley, 2024", "level": 1, "note": "Chapters 2 to 4: x86 assembly and the call stack, memory safety vulnerabilities, and the mitigations against them."}, {"title": "pwn.college", "url": "https://pwn.college/", "type": "course", "by": "Arizona State University", "level": 2, "note": "Computing 101 first if assembly is new; then the Program Security dojo: reverse engineering, return-oriented programming, dynamic allocator misuse, and program exploitation."}, {"title": "Smashing The Stack For Fun And Profit", "url": "https://phrack.org/issues/49/14.html", "type": "paper", "by": "Aleph One, Phrack 49, 1996", "level": 2, "note": "The article that taught a generation the stack overflow, step by step in C and assembly."}, {"title": "GHIDRA for Reverse Engineering (PicoCTF 2022 #42 ‘bbbloat’)", "url": "https://www.youtube.com/watch?v=oTD_ki86c9I", "type": "video", "by": "John Hammond, 2022", "level": 1, "note": "Reversing a CTF binary in Ghidra, start to finish."}, {"title": "Binary Exploitation / Memory Corruption by LiveOverflow", "url": "https://www.youtube.com/playlist?list=PLhixgUqwRTjxglIswKp9mpkfPNfHkzyeN", "type": "video", "by": "LiveOverflow, from 2015", "level": 1, "note": "The bin 0x series, each episode reasoning through an exploit out loud."}, {"title": "Hacking: The Art of Exploitation (2nd edition)", "url": "https://nostarch.com/hacking2.htm", "type": "book", "by": "Jon Erickson, No Starch, 2008", "level": 2, "note": "C, assembly, stack overflows, and shellcode, taught by exploiting them.", "paid": true}]}, {"id": "netsec", "title": "Network security and penetration testing", "kind": "concept", "track": "security", "pre": ["networking", "os"], "frontier": false, "core": "A penetration test walks an attacker’s path: map the network and its services, find a vulnerable or misconfigured one, gain a foothold, escalate privileges, and move to other machines. Defenders break each step with segmentation, patching, least privilege, and monitoring that notices the movement.", "reach": "Reconnaissance is the first step of the path; network challenges appear in capture the flag.", "resources": [{"title": "TryHackMe", "url": "https://tryhackme.com/", "type": "course", "by": "Browser-based labs, free and paid tiers", "level": 1, "note": "Guided rooms that attack real machines in the browser; the Pre Security and Jr Penetration Tester paths fit this node."}, {"title": "Computer Security (CS 161 Textbook)", "url": "https://textbook.cs161.org/", "type": "notes", "by": "Wagner, Weaver, Kao, and others, UC Berkeley, 2024", "level": 2, "note": "Chapters 25 to 36: ARP, DHCP, WPA, BGP, TCP, TLS, DNS, denial of service, firewalls, and intrusion detection."}, {"title": "Nmap Network Scanning", "url": "https://nmap.org/book/", "type": "book", "by": "Gordon Lyon (Fyodor), 2009", "level": 2, "note": "The scanner every test starts with; about half the book, including the reference guide, can be read online."}, {"title": "Penetration Testing, Threat Hunting, and Cryptography", "url": "https://www.coursera.org/learn/ibm-penetration-testing-incident-response-forensics", "type": "course", "by": "IBM, Coursera", "level": 1, "note": "Formerly Penetration Testing, Incident Response and Forensics: testing with tools such as OWASP ZAP, threat hunting, cryptography, and writing the report."}, {"title": "Cybersecurity Attack and Defense Fundamentals", "url": "https://www.coursera.org/specializations/cybersecurity-attack-and-defense", "type": "course", "by": "EC-Council, Coursera", "level": 1, "note": "Three courses: Network Defense Essentials, Ethical Hacking Essentials, and Digital Forensics Essentials."}, {"title": "SEED Labs", "url": "https://seedsecuritylabs.org/", "type": "code", "by": "Wenliang Du, SEED Project", "level": 2, "note": "The network security labs: packet sniffing and spoofing, ARP cache poisoning, TCP attacks, firewall evasion, and BGP."}]}, {"id": "osint", "title": "OSINT and reconnaissance", "kind": "concept", "track": "security", "pre": [], "frontier": false, "core": "Much of what an investigator or attacker wants is already public: domains, certificates, leaked credentials, social profiles, and photos that reveal places. OSINT is collecting it systematically, pivoting from one identifier to the next, and confirming each claim against an independent source before trusting it.", "reach": "The first phase of a penetration test and a category in many capture the flag events.", "resources": [{"title": "How to get started in online investigations with open-source information", "url": "https://firstdraftnews.org/how-to-get-started-in-online-investigations-with-open-source-intelligence-osint/", "type": "blog", "by": "Eliot Higgins, First Draft, 2016", "level": 1, "note": "Bellingcat’s founder on where to begin, with geolocation as the core skill."}, {"title": "Verification Handbook for Disinformation and Media Manipulation", "url": "https://datajournalism.com/read/handbook/verification-3", "type": "book", "by": "European Journalism Centre, ed. Craig Silverman, 2020", "level": 2, "note": "Chapters on investigating social media accounts, finding patient zero, spotting bots, and verifying images."}, {"title": "Bellingcat’s Online Investigation Toolkit", "url": "https://bellingcat.gitbook.io/toolkit", "type": "notes", "by": "Bellingcat", "level": 2, "note": "Reviewed tools by task: maps and satellites, geolocation, images and video, social media, people, websites, and companies."}, {"title": "OSINT Framework", "url": "https://osintframework.com/", "type": "notes", "by": "osintframework.com", "level": 1, "note": "A clickable tree of free tools by category, each with notes on its input, output, and operational security."}, {"title": "Certified Ethical Hacker", "url": "https://iclass.eccouncil.org/our-courses/certified-ethical-hacker-ceh/", "type": "course", "by": "EC-Council", "level": 2, "note": "Its Footprinting and Reconnaissance module turns the same methods on an organization before a test.", "paid": true}]}, {"id": "ctf", "title": "Capture the flag", "kind": "concept", "track": "security", "pre": ["websec", "binex", "netsec"], "frontier": false, "core": "A capture the flag hides a secret string behind a deliberately vulnerable website, binary, ciphertext, or file, and you score by extracting it. Jeopardy events split challenges by category (web, pwn, reversing, crypto, forensics), so each attack gets practiced alone under time pressure.", "reach": "The proving ground for every security node, and for the cipher attacks of symmetric and public-key cryptography.", "resources": [{"title": "CTF Field Guide", "url": "https://trailofbits.github.io/ctf/", "type": "tutorial", "by": "Trail of Bits", "level": 1, "note": "How to find a CTF, then vulnerability discovery, exploit creation, and forensics, with the best outside references for each."}, {"title": "CyLab Security Academy (formerly picoCTF)", "url": "https://cylabacademy.org/", "type": "course", "by": "Carnegie Mellon University, 2026", "level": 1, "note": "CMU’s free platform for learning, practice problems, and competitions; picoCTF moved here in May 2026."}, {"title": "OverTheWire Wargames", "url": "https://overthewire.org/wargames/", "type": "tutorial", "by": "OverTheWire", "level": 1, "note": "Bandit for the Linux shell, Natas for server-side web security, and Narnia for basic binary exploitation."}, {"title": "CTFtime", "url": "https://ctftime.org/", "type": "notes", "by": "CTFtime.org", "level": 2, "note": "The calendar of live events, plus writeups of past challenges to read after you try them."}, {"title": "CryptoHack Challenges", "url": "https://cryptohack.org/challenges/", "type": "code", "by": "CryptoHack", "level": 2, "note": "Crypto category practice: symmetric ciphers, RSA, Diffie-Hellman, elliptic curves, and hash functions."}]}, {"id": "numtheory", "title": "Number theory for cryptography", "kind": "concept", "track": "crypto", "pre": ["proofs"], "frontier": false, "core": "Cryptography computes with integers modulo n, where arithmetic wraps around. Euclid’s algorithm finds inverses, Euler’s theorem gives a^phi(n) = 1 mod n for a coprime to n, and the Chinese remainder theorem splits arithmetic mod pq into mod p and mod q.", "reach": "RSA, Diffie-Hellman, and elliptic curves are built from these facts; lattices replace them in post-quantum schemes.", "resources": [{"title": "CS 70: Discrete Mathematics and Probability Theory", "url": "https://www.eecs70.org/", "type": "notes", "by": "UC Berkeley, Fall 2026", "level": 1, "note": "The course notes on modular arithmetic, on Euclid’s algorithm, Fermat’s little theorem, and the Chinese remainder theorem, and on RSA."}, {"title": "CryptoHack Courses", "url": "https://cryptohack.org/courses/", "type": "code", "by": "CryptoHack", "level": 1, "note": "The Modular Arithmetic course: short lessons with puzzles you solve in code."}, {"title": "A Graduate Course in Applied Cryptography", "url": "https://toc.cryptobook.us/", "type": "book", "by": "Dan Boneh, Victor Shoup, version 0.6, 2023", "level": 2, "note": "Appendix A: cyclic groups and arithmetic modulo primes and composites, the exact background the public-key chapters use."}, {"title": "A Computational Introduction to Number Theory and Algebra", "url": "https://www.shoup.net/ntb/", "type": "book", "by": "Victor Shoup, Cambridge University Press, 2nd edition, 2008", "level": 3, "note": "Free PDF from the author: number theory and algebra with the algorithms and running times cryptography needs."}]}, {"id": "symmetric", "title": "Symmetric cryptography", "kind": "concept", "track": "crypto", "pre": ["prob", "proofs"], "frontier": false, "core": "Two parties share a secret key and want secrecy and integrity. AES is modeled as a pseudorandom permutation, a mode such as counter mode turns it into encryption that hides all but length, a MAC detects tampering, and authenticated encryption (AES-GCM) does both.", "reach": "Public-key cryptography only agrees on a key; every message after that is protected by these primitives.", "resources": [{"title": "Cryptography I", "url": "https://www.coursera.org/learn/crypto", "type": "course", "by": "Dan Boneh, Stanford, Coursera", "level": 1, "note": "Weeks 1 to 4: stream ciphers and pseudorandomness, block ciphers, message integrity, and authenticated encryption."}, {"title": "The Joy of Cryptography", "url": "https://joyofcryptography.com/", "type": "book", "by": "Mike Rosulek, MIT Press, 2026", "level": 1, "note": "Free online. The provable security mindset, from the one-time pad through pseudorandom functions and permutations to chosen-ciphertext attacks."}, {"title": "The Cryptopals Crypto Challenges", "url": "https://cryptopals.com/", "type": "code", "by": "Ptacek, Devlin, Balducci, and others, NCC Group", "level": 2, "note": "Sets 1 to 4 (basics, block crypto, stream crypto, and randomness): break real constructions in code."}, {"title": "A Graduate Course in Applied Cryptography", "url": "https://toc.cryptobook.us/", "type": "book", "by": "Dan Boneh, Victor Shoup, version 0.6, 2023", "level": 3, "note": "Part I, Chapters 2 to 9: secret key cryptography with full definitions and proofs."}]}, {"id": "publickey", "title": "Public-key cryptography", "kind": "concept", "track": "crypto", "pre": ["numtheory", "symmetric"], "frontier": false, "core": "Anyone can encrypt to you or check signatures with your public key; only your private key decrypts or signs. Security rests on one-way problems (factoring for RSA, discrete logarithms for Diffie-Hellman and elliptic curves), and TLS uses them to agree on a symmetric key.", "reach": "A quantum computer would break all of these; zero-knowledge proofs and blockchains build on them.", "resources": [{"title": "Computer Security (CS 161 Textbook)", "url": "https://textbook.cs161.org/", "type": "notes", "by": "Wagner, Weaver, Kao, and others, UC Berkeley, 2024", "level": 1, "note": "Chapters 10 to 13: Diffie-Hellman key exchange, public-key encryption, digital signatures, and certificates."}, {"title": "Cryptography I", "url": "https://www.coursera.org/learn/crypto", "type": "course", "by": "Dan Boneh, Stanford, Coursera", "level": 2, "note": "Weeks 5 and 6: key exchange, the number theory it needs, and public-key encryption."}, {"title": "The Illustrated TLS 1.3 Connection", "url": "https://tls13.xargs.org/", "type": "tutorial", "by": "Michael Driscoll", "level": 1, "note": "Every byte of a real handshake: the X25519 key exchange, the certificate, and the signature that binds them."}, {"title": "The Cryptopals Crypto Challenges", "url": "https://cryptopals.com/", "type": "code", "by": "Ptacek, Devlin, Balducci, and others, NCC Group", "level": 2, "note": "Sets 5 and 6 (Diffie-Hellman and friends, RSA and DSA): implement them, then break them."}, {"title": "A Graduate Course in Applied Cryptography", "url": "https://toc.cryptobook.us/", "type": "book", "by": "Dan Boneh, Victor Shoup, version 0.6, 2023", "level": 3, "note": "Part II: Chapters 10 to 13 (public key tools, encryption, chosen-ciphertext security, signatures) and 15 (elliptic curves and pairings)."}]}, {"id": "zk", "title": "Zero-knowledge proofs", "kind": "concept", "track": "crypto", "pre": ["publickey", "complexity"], "frontier": true, "core": "A zero-knowledge proof convinces a verifier that a statement is true while revealing nothing else, like showing a Sudoku is solved without showing the solution. Succinct versions (SNARKs) turn any computation into polynomial identities, so a short proof checks a long computation quickly.", "reach": "Blockchains use SNARKs to prove many transactions valid at once; interactive proofs come from complexity theory.", "resources": [{"title": "I can prove I’ve solved this Sudoku without revealing it", "url": "https://www.youtube.com/watch?v=Otvcbw6k4eo", "type": "video", "by": "Polylog, 2025", "level": 1, "note": "Zero knowledge built up from one concrete puzzle."}, {"title": "Zero Knowledge Proofs: An illustrated primer", "url": "https://blog.cryptographyengineering.com/2014/11/27/zero-knowledge-proofs-illustrated-primer/", "type": "blog", "by": "Matthew Green, 2014", "level": 1, "note": "Graph three-coloring with hats, and the time machine thought experiment that defines what learning nothing means."}, {"title": "Quadratic Arithmetic Programs: from Zero to Hero", "url": "https://vitalik.eth.limo/general/2016/12/10/qap.html", "type": "blog", "by": "Vitalik Buterin, 2016", "level": 2, "note": "How a program is flattened into a rank-1 constraint system and then a QAP, the polynomial form a SNARK proves."}, {"title": "Zero Knowledge Proofs MOOC", "url": "https://rdi.berkeley.edu/zk-learning/", "type": "lectures", "by": "Boneh, Goldwasser, Song, Thaler, Zhang, Berkeley RDI, 2023", "level": 2, "note": "From the history of zero knowledge to modern SNARK constructions, with readings for each lecture."}, {"title": "Proofs, Arguments, and Zero-Knowledge", "url": "https://people.cs.georgetown.edu/jthaler/ProofsArgsAndZK.html", "type": "book", "by": "Justin Thaler, 2022", "level": 3, "note": "Chapters 1 to 5 (interactive proofs and Fiat-Shamir), 11 (zero knowledge), and 19 (a map of practical systems)."}]}, {"id": "blockchain", "title": "Blockchains and smart contracts", "kind": "concept", "track": "crypto", "pre": ["publickey", "distributed"], "frontier": false, "core": "A blockchain is an append-only ledger that distrustful machines agree on without a fixed leader. Each block contains the previous block’s hash, proof of work or stake picks who appends next and makes rewriting history costly, and smart contracts are programs whose state lives there.", "reach": "Uses signatures and consensus; rollups use zero-knowledge proofs to compress many transactions into one.", "resources": [{"title": "Bitcoin: A Peer-to-Peer Electronic Cash System", "url": "https://bitcoin.org/bitcoin.pdf", "type": "paper", "by": "Satoshi Nakamoto, 2008", "level": 1, "note": "Nine pages: coins as chains of signatures, proof of work, and why an attacker’s chance of catching up falls exponentially."}, {"title": "Bitcoin and Cryptocurrency Technologies", "url": "https://bitcoinbook.cs.princeton.edu/", "type": "book", "by": "Narayanan, Bonneau, Felten, Miller, Goldfeder, 2016", "level": 2, "note": "The book site links a free draft: how the protocol works, how secure it is, mining incentives, and anonymity."}, {"title": "Ethereum development documentation", "url": "https://ethereum.org/developers/docs/", "type": "notes", "by": "ethereum.org", "level": 1, "note": "The foundational topics: accounts, transactions, blocks, the EVM, gas, and proof of stake, then smart contracts."}, {"title": "Blockchain Specialization", "url": "https://www.coursera.org/specializations/blockchain", "type": "course", "by": "University at Buffalo, Coursera", "level": 1, "note": "Four courses: Blockchain Basics, Smart Contracts (in Solidity), Decentralized Applications, and Blockchain Platforms."}, {"title": "CS 251: Blockchain Technologies", "url": "https://cs251.stanford.edu/", "type": "lectures", "by": "Stanford, Fall 2026", "level": 3, "note": "Slides and readings on consensus, smart contracts, economics, scalability, and applications, with Bitcoin and Ethereum as case studies."}]}, {"id": "pqc", "title": "Post-quantum cryptography", "kind": "concept", "track": "crypto", "pre": ["publickey", "linalg"], "frontier": true, "core": "Shor’s algorithm on a large quantum computer would break RSA and elliptic curves. The replacements rest mostly on lattices: given a random matrix A and As + e with small noise e, recovering s (learning with errors) has no known efficient quantum attack.", "reach": "NIST published ML-KEM, ML-DSA, and SLH-DSA in 2024; the math is linear algebra modulo q.", "resources": [{"title": "The state of the post-quantum Internet", "url": "https://blog.cloudflare.com/pq-2024/", "type": "blog", "by": "Bas Westerbaan, Cloudflare, 2024", "level": 1, "note": "Why the migration cannot wait, and how far post-quantum key agreement had spread through TLS by March 2024."}, {"title": "The Learning with Errors Problem", "url": "https://cims.nyu.edu/~regev/papers/lwesurvey.pdf", "type": "paper", "by": "Oded Regev, 2010", "level": 2, "note": "A short survey from the problem’s author: its definition, why it is believed hard, and the encryption built on it."}, {"title": "Post-Quantum Cryptography", "url": "https://csrc.nist.gov/projects/post-quantum-cryptography", "type": "notes", "by": "NIST", "level": 1, "note": "The standards: FIPS 203 (ML-KEM), 204 (ML-DSA), and 205 (SLH-DSA), published August 13, 2024, and HQC, selected in March 2025."}, {"title": "FIPS 203: Module-Lattice-Based Key-Encapsulation Mechanism Standard", "url": "https://csrc.nist.gov/pubs/fips/203/final", "type": "paper", "by": "NIST, 2024", "level": 3, "note": "The standard behind ML-KEM, derived from CRYSTALS-Kyber: key generation, encapsulation, and decapsulation in full."}, {"title": "A Decade of Lattice Cryptography", "url": "https://eprint.iacr.org/2015/939", "type": "paper", "by": "Chris Peikert, 2016", "level": 3, "note": "The survey of the field: SIS, LWE, ring-LWE, and the schemes built on them."}]}, {"id": "aerodynamics", "title": "Aerodynamics and flight", "kind": "concept", "track": "aero", "pre": ["fluidmech"], "frontier": false, "core": "A wing makes lift by turning the oncoming air downward, which needs lower pressure above than below. Lift is ½ρV²S·C_L, thin-airfoil theory gives C_L ≈ 2π per radian of angle of attack, and a finite wing pays induced drag from its tip vortices.", "reach": "Sizes wings, fins, and control surfaces for aircraft and rockets, and supplies the force models that flight control acts on.", "resources": [{"title": "Guide to Aerodynamics", "url": "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/learn-about-aerodynamics/", "type": "tutorial", "by": "NASA Glenn Research Center", "level": 1, "note": "Short pages on the four forces, airfoils, the lift and drag equations, and induced drag."}, {"title": "Common Misconceptions in Aerodynamics", "url": "https://www.youtube.com/watch?v=QKCK4lJLQHU", "type": "video", "by": "Doug McLean, Michigan Engineering, 2013", "level": 1, "note": "Why the equal transit and simple Bernoulli stories of lift fail, and what actually holds."}, {"title": "MIT 16.100: Aerodynamics", "url": "https://ocw.mit.edu/courses/16-100-aerodynamics-fall-2005/", "type": "notes", "by": "David Darmofal, MIT OCW, 2005", "level": 2, "note": "Lectures 13 to 19: the Kutta condition, thin airfoil theory, lifting line, and induced drag."}, {"title": "Fundamentals of Aerodynamics", "url": "https://www.mheducation.com/highered/product/fundamentals-of-aerodynamics-anderson.html", "type": "book", "by": "John Anderson, 7th edition, 2024", "level": 2, "note": "The standard undergraduate text, from potential flow to compressible flow.", "paid": true}, {"title": "XFOIL", "url": "https://web.mit.edu/drela/Public/web/xfoil/", "type": "code", "by": "Mark Drela, MIT", "level": 3, "note": "A panel method coupled to a viscous boundary layer that predicts lift and drag for any subsonic airfoil."}]}, {"id": "propulsion", "title": "Rocket propulsion", "kind": "concept", "track": "aero", "pre": ["thermo", "fluidmech"], "frontier": false, "core": "A rocket throws mass backward to push itself forward. Thrust is mass flow times exhaust velocity, a converging-diverging nozzle turns hot, high-pressure gas into supersonic exhaust, and the rocket equation, Δv = v_e ln(m0/mf), says how much velocity a propellant fraction buys.", "reach": "Sets what orbits are reachable and which motors an amateur rocket can fly.", "resources": [{"title": "Guide to Rockets", "url": "https://www1.grc.nasa.gov/beginners-guide-to-aeronautics/guide-to-rockets/", "type": "tutorial", "by": "NASA Glenn Research Center", "level": 1, "note": "Pages on rocket thrust, specific impulse, nozzles, and the ideal rocket equation."}, {"title": "MIT 16.50: Introduction to Propulsion Systems", "url": "https://ocw.mit.edu/courses/16-50-introduction-to-propulsion-systems-spring-2012/", "type": "notes", "by": "Manuel Martinez-Sanchez, MIT OCW, 2012", "level": 2, "note": "Lectures 1, 2, and 6 to 9: the rocket equation, staging, nozzle flow and area ratio, and solid motors."}, {"title": "Rocket Propulsion Elements (10th edition)", "url": "https://www.wiley.com/en-us/Rocket+Propulsion+Elements%2C+10th+Edition-p-9781394187201", "type": "book", "by": "Sutton, Biblarz, Morehart, 2026", "level": 2, "note": "Chapters 2 to 4: definitions, nozzle theory, and flight performance; later chapters cover liquid, solid, and hybrid engines.", "paid": true}, {"title": "CEA (Chemical Equilibrium with Applications)", "url": "https://github.com/nasa/cea", "type": "code", "by": "NASA Glenn, open source release 2025", "level": 3, "note": "Computes equilibrium combustion products and the resulting rocket performance for a propellant mix."}]}, {"id": "orbital", "title": "Orbital mechanics", "kind": "concept", "track": "aero", "pre": ["mechanics"], "frontier": false, "core": "Under inverse-square gravity, two bodies move on conic sections: circles, ellipses, parabolas, or hyperbolas. Speed at any radius follows from energy, v² = μ(2/r - 1/a), and changing orbits means short burns at the right points, as in the two-burn Hohmann transfer.", "reach": "Gives guidance its reference trajectories and propulsion its Δv budget; the same math plans launches and gravity assists.", "resources": [{"title": "Basics of Space Flight", "url": "https://science.nasa.gov/learn/basics-of-space-flight/", "type": "tutorial", "by": "Dave Doody, NASA JPL", "level": 1, "note": "Chapters 3 to 5: gravity and mechanics, trajectories with Hohmann transfers and gravity assists, and planetary orbits."}, {"title": "Orbital Mechanics & Astrodynamics", "url": "https://orbital-mechanics.space/", "type": "book", "by": "Bryan Weber, UConn, 2020", "level": 2, "note": "Free notes on the two-body problem, orbital elements, Kepler’s equation, Hohmann and plane change maneuvers, and interplanetary transfers."}, {"title": "Orbital Mechanics for Engineering Students (4th edition)", "url": "https://shop.elsevier.com/books/orbital-mechanics-for-engineering-students/curtis/978-0-12-824025-0", "type": "book", "by": "Howard Curtis, 2020", "level": 2, "note": "The standard undergraduate text the free notes above follow.", "paid": true}, {"title": "MIT 16.346: Astrodynamics", "url": "https://ocw.mit.edu/courses/16-346-astrodynamics-fall-2008/", "type": "notes", "by": "Richard Battin, MIT OCW, 2008", "level": 3, "note": "Kepler’s and Lambert’s problems, orbit determination, and navigation methods with Apollo examples."}]}, {"id": "attitude", "title": "Spacecraft attitude dynamics", "kind": "concept", "track": "aero", "pre": ["mechanics", "linalg"], "frontier": false, "core": "Orientation is a rotation, stored as a direction cosine matrix, Euler angles (which hit singularities), or a quaternion. Euler’s equations, Iω’ + ω × Iω = τ, govern how it changes, which is why a body spinning about its intermediate principal axis tumbles.", "reach": "Pointing control for satellites and the inner loop of guidance and control; the same rotation math tracks VR headsets and robot grippers.", "resources": [{"title": "The Bizarre Behavior of Rotating Bodies", "url": "https://www.youtube.com/watch?v=1VPfZ_XzisU", "type": "video", "by": "Veritasium, 2019", "level": 1, "note": "The intermediate axis instability, seen in orbit and explained."}, {"title": "Kinematics: Describing the Motions of Spacecraft", "url": "https://www.coursera.org/learn/spacecraft-dynamics-kinematics", "type": "course", "by": "Hanspeter Schaub, CU Boulder, Coursera", "level": 2, "note": "Direction cosines, Euler angles, quaternions, and Rodrigues parameters, then attitude determination from measurements."}, {"title": "Kinetics: Studying Spacecraft Motion", "url": "https://www.coursera.org/learn/spacecraft-dynamics-kinetics", "type": "course", "by": "Hanspeter Schaub, CU Boulder, Coursera", "level": 2, "note": "Euler’s rotational equations, torque-free motion and its stability, spinning components, and gravity gradient torque."}, {"title": "Fundamentals of Spacecraft Attitude Determination and Control", "url": "https://link.springer.com/book/10.1007/978-1-4939-0802-8", "type": "book", "by": "Landis Markley, John Crassidis, 2014", "level": 3, "note": "The reference for attitude kinematics, sensors and actuators, estimation, and control.", "paid": true}]}, {"id": "gnc", "title": "Guidance, navigation and control", "kind": "concept", "track": "aero", "pre": ["orbital", "attitude", "estimation"], "frontier": false, "core": "Navigation estimates where the vehicle is, usually with a Kalman filter fusing inertial sensors and external fixes. Guidance computes the path and acceleration that reach the target from there. Control turns those commands into engine and attitude actions, in a faster inner loop.", "reach": "Combines estimation, orbital mechanics, attitude dynamics, and MPC; Apollo’s lunar descent and today’s reusable booster landings are the standard case studies.", "resources": [{"title": "This is the code that sent Apollo 11 to the moon (and it’s awesome)", "url": "https://www.youtube.com/watch?v=XHN6LV_1dWk", "type": "video", "by": "Coding with Dee, 2024", "level": 1, "note": "A tour of the flight software that ran on the Apollo Guidance Computer."}, {"title": "Basics of Space Flight, Chapter 13: Navigation", "url": "https://science.nasa.gov/learn/basics-of-space-flight/chapter13-1/", "type": "tutorial", "by": "NASA JPL", "level": 1, "note": "Reference trajectories, orbit determination, and the correction maneuvers that keep a deep space probe on course."}, {"title": "Apollo Lunar Descent Guidance", "url": "https://www.ibiblio.org/apollo/Documents/Apollo%20Lunar%20Descent%20Guidance.pdf", "type": "paper", "by": "Allan Klumpp, MIT Draper Laboratory R-695, 1971", "level": 3, "note": "The guidance law that landed the Lunar Module, derived by its principal designer."}, {"title": "Convex Optimization for Trajectory Generation", "url": "https://arxiv.org/abs/2106.09125", "type": "paper", "by": "Malyuta et al., 2021", "level": 3, "note": "Tutorial on lossless convexification and sequential convex programming, the methods behind modern rocket landing guidance."}, {"title": "Virtual AGC", "url": "https://www.ibiblio.org/apollo/", "type": "code", "by": "Virtual AGC project", "level": 2, "note": "Apollo Guidance Computer source code, emulators, and scanned guidance and navigation documents."}]}, {"id": "rocketry", "title": "Building rockets", "kind": "concept", "track": "aero", "pre": ["propulsion", "aerodynamics", "embedded"], "frontier": false, "core": "A rocket flies straight only if its center of pressure sits behind its center of mass, by about one body diameter, so aerodynamic forces turn it back into the wind. Simulate stability and altitude before building, and certify in levels before flying bigger motors.", "reach": "Applies aerodynamics, propulsion, and embedded flight computers; thrust vector control brings in classical control and guidance.", "resources": [{"title": "OpenRocket", "url": "https://openrocket.info/", "type": "code", "by": "OpenRocket team", "level": 1, "note": "A free simulator that checks a design’s stability and flight profile before you build it; its user guide doubles as a design tutorial."}, {"title": "High Power Rocketry Certification", "url": "https://www.nar.org/HPRCertification", "type": "notes", "by": "National Association of Rocketry", "level": 1, "note": "Level 1 allows H and I motors, Level 2 adds J to L after a written exam, and Level 3 covers M to O."}, {"title": "High Power Certification", "url": "https://www.tripoli.org/certification", "type": "notes", "by": "Tripoli Rocketry Association", "level": 1, "note": "The other US certifying body; its levels are reciprocal with NAR’s."}, {"title": "OpenRocket Technical Documentation", "url": "https://github.com/openrocket/openrocket/releases/download/OpenRocket_technical_documentation-v13.05/OpenRocket_technical_documentation-v13.05.pdf", "type": "notes", "by": "Sampo Niskanen, 2013", "level": 3, "note": "Chapter 2 covers motor classes and stability; Chapter 3 computes normal forces and the center of pressure part by part with the Barrowman method."}, {"title": "BPS.space", "url": "https://www.youtube.com/@BPSspace", "type": "video", "by": "Joe Barnard", "level": 2, "note": "Model rockets with thrust vector control and homemade flight computers, built and flown on camera."}]}, {"id": "raster", "title": "The rasterization pipeline", "kind": "concept", "track": "graphics", "pre": ["linalg"], "frontier": false, "core": "Transform each triangle’s vertices into screen space with model, view, and projection matrices, find the pixels the triangle covers, interpolate colors and texture coordinates with barycentric weights, and keep the nearest surface at each pixel with a depth buffer. GPUs run these steps in parallel.", "reach": "Real-time graphics for game engines and VR; ray tracing replaces the coverage step with rays and adds global light transport.", "resources": [{"title": "Introduction to Computer Graphics", "url": "https://www.youtube.com/playlist?list=PLplnkTzzqsZTfYh4UbhLGpI5kGd5oW_Hh", "type": "lectures", "by": "Cem Yuksel, University of Utah, 2021", "level": 1, "note": "Lectures 5 to 7 (2D and 3D transformations, the GPU pipeline) and 13 to 15 (textures and shading)."}, {"title": "Scratchapixel", "url": "https://www.scratchapixel.com/", "type": "tutorial", "by": "Scratchapixel", "level": 1, "note": "In the foundations section: computing a 3D point’s pixel coordinates, rasterization, and the projection matrix."}, {"title": "tinyrenderer", "url": "https://haqr.eu/tinyrenderer/", "type": "tutorial", "by": "Dmitry Sokolov", "level": 2, "note": "Write a software rasterizer in about 500 lines of C++: triangles, barycentric coordinates, the z-buffer, the camera, and shading."}, {"title": "LearnOpenGL", "url": "https://learnopengl.com/", "type": "tutorial", "by": "Joey de Vries", "level": 2, "note": "The same pipeline on a real GPU; the Getting Started section covers shaders, textures, transformations, and coordinate systems."}]}, {"id": "raytrace", "title": "Ray tracing and physically based rendering", "kind": "concept", "track": "graphics", "pre": ["raster", "prob"], "frontier": false, "core": "Follow rays from the camera into the scene. The light reaching a pixel is an integral over every path light can take (the rendering equation); path tracing averages random paths, so noise falls as one over the square root of the sample count.", "reach": "Offline film rendering and real-time GPU ray tracing; the same Monte Carlo estimators reappear in neural rendering.", "resources": [{"title": "Ray Tracing in One Weekend", "url": "https://raytracing.github.io/books/RayTracingInOneWeekend.html", "type": "tutorial", "by": "Peter Shirley, Trevor David Black, Steve Hollasch, 2025", "level": 1, "note": "Build a working ray tracer with spheres, materials, and a camera in a weekend of C++."}, {"title": "Introduction to Computer Graphics", "url": "https://www.youtube.com/playlist?list=PLplnkTzzqsZTfYh4UbhLGpI5kGd5oW_Hh", "type": "lectures", "by": "Cem Yuksel, University of Utah, 2021", "level": 1, "note": "Lectures 17 to 21: the rendering equation, rendering algorithms, ray tracing, shadows and reflections, and sampling."}, {"title": "Ray Tracing: The Rest of Your Life", "url": "https://raytracing.github.io/books/RayTracingTheRestOfYourLife.html", "type": "tutorial", "by": "Peter Shirley, Trevor David Black, Steve Hollasch", "level": 2, "note": "Monte Carlo integration and importance sampling, which turn the first book’s renderer into a proper estimator."}, {"title": "Physically Based Rendering: From Theory to Implementation (4th edition)", "url": "https://pbr-book.org/", "type": "book", "by": "Matt Pharr, Wenzel Jakob, Greg Humphreys, 2023", "level": 3, "note": "Chapter 2 (Monte Carlo integration) and Chapter 13 (the light transport equation and path tracing); the rest is a full renderer explained in code."}]}, {"id": "simulation", "title": "Physics simulation for graphics", "kind": "concept", "track": "graphics", "pre": ["mechanics", "numerics"], "frontier": false, "core": "Write down the forces, then step positions and velocities forward in time. Explicit steps blow up on stiff springs and collisions, so graphics favors implicit or position-based updates that stay stable at large time steps; fluids add a pressure solve that keeps the flow incompressible.", "reach": "Drives cloth, hair, and fluids in film and engines; the same integrators run the robot simulators used to train policies.", "resources": [{"title": "Ten Minute Physics", "url": "https://matthias-research.github.io/pages/tenMinutePhysics/index.html", "type": "video", "by": "Matthias Müller", "level": 1, "note": "Short episodes, each with a small JavaScript demo: position-based dynamics, rigid bodies, collisions, and grid fluids."}, {"title": "Physically Based Modeling: Principles and Practice", "url": "https://www.cs.cmu.edu/~baraff/sigcourse/", "type": "notes", "by": "Andrew Witkin, David Baraff, SIGGRAPH 1997", "level": 2, "note": "Differential equation basics, particle dynamics, implicit methods, constrained dynamics, and rigid bodies."}, {"title": "Coding Adventure: Simulating Fluids", "url": "https://www.youtube.com/watch?v=rSKMYc1CQHE", "type": "video", "by": "Sebastian Lague, 2023", "level": 1, "note": "Builds a particle fluid from scratch, with every wrong turn on screen."}, {"title": "Fluid Simulation for Computer Graphics (course notes)", "url": "https://www.cs.ubc.ca/~rbridson/fluidsimulation/fluids_notes.pdf", "type": "notes", "by": "Robert Bridson, Matthias Müller-Fischer, SIGGRAPH 2007", "level": 2, "note": "Chapters 1 to 4: the fluid equations, splitting, advection, and the pressure projection that makes flow incompressible."}, {"title": "Stable Fluids", "url": "https://www.dgp.toronto.edu/public_user/stam/reality/Research/pdf/ns.pdf", "type": "paper", "by": "Jos Stam, SIGGRAPH 1999", "level": 3, "note": "The unconditionally stable grid solver that made fluids practical in graphics."}]}, {"id": "engines", "title": "Game engines and Unreal", "kind": "concept", "track": "graphics", "pre": ["raster", "swe"], "frontier": false, "core": "A game engine is a loop: read input, advance the simulation in fixed time steps, and render the latest state, every frame within 16 milliseconds. Around it sit subsystems for rendering, physics, and assets, and a world of entities whose behavior comes from components.", "reach": "Packages raster graphics, simulation, and tools into one editor; VR apps and robot simulators are increasingly built on engines like Unreal.", "resources": [{"title": "Game Programming Patterns", "url": "https://gameprogrammingpatterns.com/", "type": "book", "by": "Robert Nystrom, 2014", "level": 1, "note": "Read Game Loop, Update Method, and Component first; the other patterns can wait."}, {"title": "Unreal Engine learning portal", "url": "https://dev.epicgames.com/community/unreal-engine/learning", "type": "course", "by": "Epic Games", "level": 1, "note": "Epic’s own tutorials, courses, and demo projects; build a small game in the editor alongside the other readings."}, {"title": "Fix Your Timestep!", "url": "https://gafferongames.com/post/fix_your_timestep/", "type": "blog", "by": "Glenn Fiedler, 2004", "level": 2, "note": "Why physics should step at a fixed rate apart from rendering, and how to interpolate between steps."}, {"title": "Game Engine Architecture", "url": "https://www.gameenginebook.com/", "type": "book", "by": "Jason Gregory, 4th edition", "level": 3, "note": "How studio engines are built: foundation systems, rendering, collision and physics, animation, and game object models.", "paid": true}]}, {"id": "vr", "title": "Virtual and augmented reality", "kind": "concept", "track": "graphics", "pre": ["raster", "kinematics", "estimation"], "frontier": false, "core": "A headset fuses an IMU with cameras to track head pose hundreds of times a second, predicts the pose at display time, renders one view per eye, and warps it to cancel lens distortion. Lag between felt and seen motion causes sickness.", "reach": "Combines raster rendering, estimation for tracking, and rigid-body kinematics; engines like Unreal handle most of the plumbing.", "resources": [{"title": "Virtual Reality", "url": "http://lavalle.pl/vr/", "type": "book", "by": "Steven LaValle, Cambridge University Press, 2023", "level": 2, "note": "Chapters 2, 7, 9, and 12: the system view, rendering and time warp, tracking and sensor fusion, and VR sickness; free lectures accompany it."}, {"title": "Virtual Reality Specialization", "url": "https://www.coursera.org/specializations/virtual-reality", "type": "course", "by": "Goldsmiths, University of London, Coursera", "level": 1, "note": "Course 1 covers hardware, presence, and perception; later courses build VR scenes and interaction in Unity."}, {"title": "OpenXR Tutorial", "url": "https://openxr-tutorial.com/", "type": "tutorial", "by": "Khronos Group", "level": 2, "note": "Set up a session, render to each eye, and read controller input through the cross-vendor OpenXR API."}]}], "macro": [{"from": "math", "to": "algo", "links": 1}, {"from": "math", "to": "theory", "links": 2}, {"from": "math", "to": "physics", "links": 7}, {"from": "math", "to": "hardware", "links": 4}, {"from": "math", "to": "or", "links": 5}, {"from": "algo", "to": "theory", "links": 1}, {"from": "hardware", "to": "lowlevel", "links": 1}, {"from": "lowlevel", "to": "software", "links": 2}, {"from": "lowlevel", "to": "security", "links": 4}, {"from": "software", "to": "security", "links": 1}, {"from": "theory", "to": "crypto", "links": 1}, {"from": "software", "to": "crypto", "links": 1}, {"from": "physics", "to": "chem", "links": 2}, {"from": "physics", "to": "fluids", "links": 3}, {"from": "fluids", "to": "aero", "links": 2}, {"from": "control", "to": "aero", "links": 1}, {"from": "hardware", "to": "control", "links": 1}, {"from": "physics", "to": "control", "links": 1}, {"from": "or", "to": "control", "links": 1}, {"from": "or", "to": "quant", "links": 3}, {"from": "chem", "to": "biosci", "links": 1}, {"from": "physics", "to": "graphics", "links": 1}, {"from": "software", "to": "graphics", "links": 1}], "trackLinks": [{"from": "algo", "to": "biosci", "links": 2}, {"from": "algo", "to": "control", "links": 1}, {"from": "algo", "to": "software", "links": 1}, {"from": "algo", "to": "theory", "links": 1}, {"from": "chem", "to": "biosci", "links": 1}, {"from": "control", "to": "aero", "links": 1}, {"from": "control", "to   document.getElementById("zout").onclick = () => { const r = map.getBoundingClientRect(); zoomAt(1 / 1.25, r.width / 2, r.height / 2); };

  // selection and the panel

  }
  function chipList(ids, emptyText) {

  }
  function open(id, opts = {}) {

        badgeOf(n) ? el("span", { class: "badge", text: badgeOf(n) }) : null),

    panel.append(el("p", { class: "sec", text: "Resources" }));

        el("div", { class: "rn" }, el("a", { href: r.url, target: "_blank", rel: "noopener", text: r.title }),

          r.note ? el("div", { class: "note", text: r.note }) : null),

      cb.addEventListener("change", () => {

        save(); li.classList.toggle("ok", cb.checked); paintNode(n); renderTotals(); paintTracks();
        const [dd, tt] = prog(n); progBar.style.width = (tt ? 100 * dd / tt : 0) + "%"; progText.textContent = `${dd} / ${tt}`;
        renderList();
      });
      ul.append(li);
    });

    panel.hidden = false; scrim.hidden = innerWidth > 720;
    panel.scrollTop = 0;
    highlight(id);
    if (!opts.keepView && !map.hidden) centerOn(id, opts.minS ?? (s < .55 ? .75 : s));

    if (!opts.noFocus) closeBtn.focus({ preventScroll: true });
  }
  function close() {
    if (panel.hidden) return;

    if (current && nodeEls[current] && !map.hidden) nodeEls[current].btn.focus({ preventScroll: true });
    current = null;
    try { history.replaceState(null, "", location.pathname); } catch (e) {}
  }
  scrim.addEventListener("click", close);
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") { if (!results.hidden) hideResults(); else close(); } });

  // list view, topological inside each track
  const order = [];
  { const seen = new Set(); const visit = id => { if (seen.has(id)) return; seen.add(id); byId[id].pre.forEach(visit); order.push(id); }; DATA.nodes.forEach(n => visit(n.id)); }
  function renderList() {
    const box = document.getElementById("listin"); box.textContent = "";
    for (const t of DATA.tracks) {

  }

  // about view

  // track map: one node per track, the curated edges between tracks
  const TM = L.trackMap;
  const tview = document.getElementById("tracks"), tscroll = document.getElementById("tscroll"), tsize = document.getElementById("tsize");
  const tworld = document.getElementById("tworld"), tsvg = document.getElementById("tedges");
  const tUp = {}, tDown = {};
  for (const e of DATA.macro) { (tUp[e.to] = tUp[e.to] || []).push(e.from); (tDown[e.from] = tDown[e.from] || []).push(e.to); }
  function tAnc(id) { const out = new Set(); const walk = x => (tUp[x] || []).forEach(p => { if (!out.has(p)) { out.add(p); walk(p); } }); walk(id); return out; }

      tworld.style.width = m.width + "px"; tworld.style.height = m.height + "px";

        const b = el("button", { class: "tnode", style: `left:${v.x - m.w / 2}px;top:${v.y - m.h / 2}px;width:${m.w}px;height:${m.h}px;--c:var(--f-${t.family})`,

    const sc = narrow ? Math.max(.72, Math.min(1, availW / m.width)) : Math.max(.5, Math.min(1.05, availW / m.width, availH / m.height));
    tworld.style.transform = `scale(${sc})`;
    tsize.style.width = Math.round(m.width * sc) + "px"; tsize.style.height = Math.round(m.height * sc) + "px";
    if (narrow) tscroll.scrollLeft = (tscroll.scrollWidth - tscroll.clientWidth) / 2;

  }
  function paintTracks() {
    for (const t of DATA.tracks) { if (!tEls[t.id]) continue; const [d, tot] = trackProg(t.id); tEls[t.id].bar.style.width = (tot ? 100 * d / tot : 0) + "%"; }
  }
  function highlightTrack(id) {
    const anc = id ? tAnc(id) : null;

  function trackChips(ids, emptyText) {

      el("h2", { id: "ptitle", text: t.label }),
      el("div", { class: "prog" }, el("span", { class: "bar" }, el("i", { style: `width:${tot ? 100 * d / tot : 0}%` })), el("span", { text: `${d} / ${tot}` })),
      el("p", { class: "core", text: t.core }));

    const inL = DATA.trackLinks.filter(x => x.to === tid).sort((a, b) => b.links - a.links);

      const [dd, tt] = prog(n);
      const b = el("button", {}, el("span", { class: "it" }, n.title, el("span", { class: "ik", text: [tagOf(n), badgeOf(n)].filter(Boolean).join(" · ") })), el("span", { class: "ip", text: `${dd}/${tt}` }));
      b.onclick = () => openOnMap(n.id);

    panel.hidden = false; scrim.hidden = innerWidth > 720; panel.scrollTop = 0;
    highlightTrack(tid); highlight(null);
    try { history.replaceState(null, "", "#track-" + tid); } catch (e) {}
    if (!opts.noFocus) closeBtn.focus({ preventScroll: true });
  }
  addEventListener("resize", () => { if (!tview.hidden) renderTrackMap(); });

  // views
  const views = { tracks: tview, map: document.getElementById("map"), list: document.getElementById("list"), about: document.getElementById("about") };
  let mapReady = false;
  function setView(v) {
    for (const [k, node] of Object.entries(views)) node.hidden = k !== v;

      if (!words.every(w => head.includes(w) || body.includes(w))) continue;
      const res = n.resources.find(r => words.every(w => (r.title + " " + r.by).toLowerCase().includes(w)));
      hits.push({ n, score: words.every(w => head.includes(w)) ? 0 : 1, res });
    }

    results.textContent = ""; hi = 0;
    if (!hits.length) results.append(el("div", { class: "rm", style: "padding:.5rem .6rem", text: "No idea or resource matches." }));

  // first frame: the track map, or the idea or track named in the link

  function start() {
    const h = location.hash.slice(1);

    setView("tracks");
    if (h.startsWith("track-") && trackById[h.slice(6)]) openTrack(h.slice(6), { noFocus: true });
  }
  // the detailed map's first view: the foundations and the row under them, readable
  function initMap() {
    const r = map.getBoundingClientRect();
    const firstTrack = Object.keys(L.tracks).sort((p, q) => L.tracks[p].y - L.tracks[q].y || L.tracks[p].x - L.tracks[q].x)[0], f = L.tracks[firstTrack];
    if (r.width <= 720) {
      const top = DATA.nodes.filter(n => n.track === firstTrack).map(n => L.nodes[n.id]).sort((p, q) => p.y - q.y)[0];

    }

    tx = r.width / 2 - (f.x + f.w / 2) * s; ty = 16 - f.y * s; apply();
  }
  start();
  addEventListener("resize", () => drawMini());
})();
