"qc", "title": "Quantum computing and information", "kind": "concept", "track": "physics", "pre": ["linalg"], "frontier": true, "core": "A register of n qubits holds 2^n complex amplitudes, gates are unitary matrices acting on them, and measurement samples one bit string. Algorithms such as Shor’s and Grover’s arrange interference so that wrong answers cancel and right answers add up.", "reach": "Shor’s algorithm breaks RSA and elliptic curves, which is why post-quantum cryptography exists; simulating molecules is the other expected payoff.", "resources": [{"title": "Quantum Country", "url": "https://quantum.country/", "type": "tutorial", "by": "Andy Matuschak, Michael Nielsen, 2019", "level": 1, "note": "Start with Quantum computing for the very curious, then the essay on the search algorithm; review prompts are built into the text."}, {"title": "Introduction to Quantum Information", "url": "https://www.coursera.org/learn/introduction-to-quantum-information", "type": "course", "by": "KAIST, Coursera", "level": 1, "note": "Qubits, measurement, and entanglement as the resource behind quantum computing and communication."}, {"title": "Quantum Computing: Lecture Notes", "url": "https://arxiv.org/abs/1907.09415", "type": "notes", "by": "Ronald de Wolf, 2019", "level": 2, "note": "Written for computer scientists: algorithms first, then complexity, communication, and error correction, with exercises."}, {"title": "Quantum Computation and Quantum Information", "url": "https://www.cambridge.org/highereducation/books/quantum-computation-and-quantum-information/01E10196D0A682A6AEFFEA52D53BE9AE", "type": "book", "by": "Michael Nielsen, Isaac Chuang, 10th anniversary edition, 2010", "level": 2, "note": "The standard reference, from circuits and algorithms to noise, error correction, and quantum information theory.", "paid": true}, {"title": "Physics 219: Quantum Computation (lecture notes)", "url": "https://www.preskill.caltech.edu/ph229/", "type": "notes", "by": "John Preskill, Caltech", "level": 3, "note": "The physicist’s view, with recorded 2020 lectures covering chapters 1 to 6."}]}, {"id": "astro", "title": "Astrophysics and cosmology", "kind": "concept", "track": "physics", "pre": ["relativity", "thermo"], "frontier": false, "core": "A star is gas whose gravity is held off by pressure that fusion in its core sustains; its mass decides how it lives and dies. On the largest scales space expands, and the cosmic microwave background and the light elements record a hot, dense beginning.", "reach": "Uses relativity for black holes and expansion and thermodynamics for stars and the early universe; orbital mechanics is its engineering cousin.", "resources": [{"title": "The Evolving Universe", "url": "https://www.coursera.org/learn/evolvinguniverse", "type": "course", "by": "S. George Djorgovski, Caltech, Coursera", "level": 1, "note": "A survey from planetary systems and stars to galaxies, quasars, and the universe as a whole."}, {"title": "Cosmology", "url": "https://davidtong.org/teaching/cosmology/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapters 1 to 3: the expanding universe, the hot universe, and structure formation."}, {"title": "ASTR 160: Frontiers and Controversies in Astrophysics", "url": "https://oyc.yale.edu/astronomy/astr-160", "type": "lectures", "by": "Charles Bailyn, Open Yale Courses, 2007", "level": 2, "note": "Three fast-moving areas in depth: planets around other stars, black holes, and dark energy."}, {"title": "MIT 8.286: The Early Universe", "url": "https://ocw.mit.edu/courses/8-286-the-early-universe-fall-2013/", "type": "lectures", "by": "Alan Guth, MIT OCW, 2013", "level": 3, "note": "Classical cosmology first, then the particle physics of the early universe."}]}, {"id": "lp", "title": "Linear programming", "kind": "concept", "track": "or", "pre": ["linalg"], "frontier": false, "core": "A linear program maximizes a linear objective over a region cut out by linear inequalities, a polyhedron, and an optimum sits at a corner. The simplex method walks from corner to corner; duality pairs every LP with another whose optimum is equal and certifies it.", "reach": "Underlies convex optimization, branch and bound in integer programming, the minimax theorem in game theory, and LP rounding in randomized algorithms.", "resources": [{"title": "The Art of Linear Programming", "url": "https://www.youtube.com/watch?v=E72DWgKP_1Y", "type": "video", "by": "Tom S, 2023", "level": 1, "note": "Nineteen minutes, mostly pictures: definitions, the simplex method, duality, and integer programs."}, {"title": "CS261: A Second Course in Algorithms", "url": "http://timroughgarden.org/w16/w16.html", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2016", "level": 2, "note": "Lectures 7 to 10: LP from the computer science side, with modeling, two lectures on duality, then minimax and the simplex method."}, {"title": "Operations Research (3): Theory", "url": "https://www.coursera.org/learn/operations-research-theory", "type": "course", "by": "Ling-Chieh Kung, National Taiwan University, Coursera", "level": 2, "note": "Duality, sensitivity analysis and the dual simplex method, network flow, then convex analysis, Lagrangian duality, and KKT conditions as a bridge to convex."}, {"title": "MIT 6.251J: Introduction to Mathematical Programming", "url": "https://ocw.mit.edu/courses/6-251j-introduction-to-mathematical-programming-fall-2009/", "type": "course", "by": "Dimitris Bertsimas, MIT OCW, 2009", "level": 3, "note": "Graduate lecture notes on simplex, duality, sensitivity, network flows, and the ellipsoid and interior point methods that solve LPs in polynomial time."}]}, {"id": "convex", "title": "Convex optimization", "kind": "concept", "track": "or", "pre": ["lp", "calc"], "frontier": false, "core": "In a convex problem, a convex function minimized over a convex set, every local minimum is global, so gradient and Newton methods reliably find the best answer. Duality supplies lower bounds and the KKT optimality conditions; least squares and linear programs are special cases.", "reach": "Model predictive control and portfolio optimization solve convex programs repeatedly; linear programming is the linear special case.", "resources": [{"title": "Stanford EE364A: Convex Optimization I", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rMJqxxviPa4AmDClvcbHi6h", "type": "lectures", "by": "Stephen Boyd, Stanford Online, 2023", "level": 1, "note": "Recorded lectures from convex sets and functions through duality and the standard problem classes, following the book below."}, {"title": "Convex Optimization", "url": "https://web.stanford.edu/~boyd/cvxbook/", "type": "book", "by": "Stephen Boyd, Lieven Vandenberghe, 2004", "level": 2, "note": "Chapters 2 to 5 for convex sets, functions, problems, and duality; Chapters 9 to 11 for unconstrained, equality constrained, and interior-point methods."}, {"title": "CVXPY", "url": "https://www.cvxpy.org/", "type": "code", "by": "CVXPY developers", "level": 2, "note": "Write a convex problem as it reads on paper and let a solver handle it; the examples include least squares, LPs, minimum-fuel optimal control, and Markowitz portfolios."}, {"title": "Convex Optimization: Algorithms and Complexity", "url": "https://arxiv.org/abs/1405.4980", "type": "paper", "by": "Sébastien Bubeck, 2015", "level": 3, "note": "Convergence rates and lower bounds for gradient, accelerated, and mirror descent methods, proved compactly."}]}, {"id": "integer", "title": "Integer and discrete optimization", "kind": "concept", "track": "or", "pre": ["lp", "complexity"], "frontier": false, "core": "Restrict variables to integers and linear programming becomes NP-hard, yet solvers handle large instances by branch and bound: solve the LP relaxation for a bound, split on a fractional variable, and prune any branch whose bound cannot beat the best solution so far.", "reach": "How scheduling, routing, and planning problems are solved in practice; constraint programming and local search are the other tools.", "resources": [{"title": "Basic Modeling for Discrete Optimization", "url": "https://www.coursera.org/learn/basic-modeling", "type": "course", "by": "Jimmy Lee, Peter Stuckey, CUHK, Coursera", "level": 1, "note": "Write models in MiniZinc and let solvers find the answers, starting with sets, functions, and several models of one problem."}, {"title": "Solving Algorithms for Discrete Optimization", "url": "https://www.coursera.org/learn/solving-algorithms-discrete-optimization", "type": "course", "by": "Jimmy Lee, Peter Stuckey, CUHK, Coursera", "level": 2, "note": "How the solvers work: constraint programming, mixed integer programming, and local search."}, {"title": "OR-Tools", "url": "https://developers.google.com/optimization", "type": "code", "by": "Google", "level": 2, "note": "Open-source solvers for integer and linear programming, vehicle routing, flows, and the CP-SAT constraint solver, callable from Python, C++, Java, or C#."}, {"title": "A Course in Combinatorial Optimization", "url": "https://homepages.cwi.nl/~lex/files/dict.pdf", "type": "notes", "by": "Alexander Schrijver, 2017", "level": 3, "note": "Polyhedral combinatorics: Chapter 8 shows when the LP relaxation is already integral (total unimodularity), alongside matchings, flows, and matroids."}]}, {"id": "stochproc", "title": "Stochastic processes and queues", "kind": "concept", "track": "or", "pre": ["prob", "linalg"], "frontier": false, "core": "A stochastic process is a random quantity evolving in time. In a Markov chain the next state depends only on the current one, so long-run behavior settles into a stationary distribution; in queues, Little’s law L = lambda W ties queue length to waiting time.", "reach": "Leads to stochastic calculus, order arrival models in market microstructure, MCMC sampling, and capacity planning for servers.", "resources": [{"title": "Introduction to Probability", "url": "https://probabilitybook.net/", "type": "book", "by": "Joe Blitzstein, Jessica Hwang, 2nd edition, 2019", "level": 1, "note": "The Markov Chains, Markov Chain Monte Carlo, and Poisson Processes chapters, in the same story-first style as Stat 110."}, {"title": "Essentials of Stochastic Processes", "url": "https://sites.math.duke.edu/~rtd/EOSP/EOSP2E.pdf", "type": "book", "by": "Rick Durrett, 2nd edition, 2011", "level": 2, "note": "Free from the author. Chapters 1 to 4 cover Markov chains, Poisson processes, renewal theory, and continuous-time chains, with queues in Sections 3.2 and 4.5."}, {"title": "MIT 6.262: Discrete Stochastic Processes", "url": "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/", "type": "course", "by": "Robert Gallager, MIT OCW, 2011", "level": 2, "note": "Lectures 4 to 9 on Poisson processes and finite Markov chains, Lecture 13 on Little’s law and the M/G/1 queue, and Lectures 23 and 24 on martingales."}, {"title": "Performance Modeling and Design of Computer Systems: Queueing Theory in Action", "url": "https://www.cs.cmu.edu/~harchol/PerformanceModeling/book.html", "type": "book", "by": "Mor Harchol-Balter, Cambridge, 2013", "level": 2, "note": "Queueing for computer scientists: Little’s law, Markov chains, M/M/1 and M/M/k server farms, and scheduling under heavy-tailed job sizes.", "paid": true}, {"title": "Stochastic Processes (lecture notes)", "url": "https://adembo.su.domains/math-136/nnotes.pdf", "type": "notes", "by": "Amir Dembo, revised by Kevin Ross, 2021", "level": 3, "note": "The measure-theoretic version from Stanford’s Math 136: Chapters 4 and 5 build martingales, stopping times, and Brownian motion, the road into stochcalc."}, {"title": "Introduction to Probability Models", "url": "https://shop.elsevier.com/books/introduction-to-probability-models/ross/978-0-443-18761-2", "type": "book", "by": "Sheldon Ross, 13th edition, 2023", "level": 2, "note": "The standard applied text: chapters on queueing theory, reliability, renewal theory, simulation, and martingales, with many exercises.", "paid": true}]}, {"id": "gametheory", "title": "Game theory", "kind": "concept", "track": "or", "pre": ["prob", "lp"], "frontier": false, "core": "A game lists each player’s strategies and payoffs. In a Nash equilibrium no player gains by deviating alone; players may need to randomize, and in two-player zero-sum games the equilibrium is the minimax solution of a linear program.", "reach": "Mechanism design turns the question around and designs the game itself; market microstructure models trading as a game.", "resources": [{"title": "Yale ECON 159: Game Theory", "url": "https://oyc.yale.edu/economics/econ-159", "type": "lectures", "by": "Ben Polak, Open Yale Courses, 2007", "level": 1, "note": "Twenty-four lectures that build Nash equilibrium, mixed strategies, backward induction, repeated games, and asymmetric information from classroom games."}, {"title": "Multiagent Systems", "url": "http://www.masfoundations.org/", "type": "book", "by": "Yoav Shoham, Kevin Leyton-Brown, Cambridge, 2009", "level": 2, "note": "Free ebook. Chapters 3 to 5: normal-form games, computing their solution concepts, and games with sequential actions."}, {"title": "Algorithmic Game Theory (CS364A)", "url": "http://timroughgarden.org/f13/f13.html", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2013", "level": 3, "note": "Lectures 13 to 20: the hierarchy of equilibrium concepts, no-regret dynamics, minimax, and why computing a mixed Nash equilibrium is PPAD-complete."}, {"title": "Game Theory", "url": "https://www.coursera.org/learn/game-theory-1", "type": "course", "by": "Matthew Jackson, Kevin Leyton-Brown, Yoav Shoham, Stanford, UBC, Coursera", "level": 1, "note": "A shorter, more formal alternative to ECON 159, through Bayesian and repeated games."}]}, {"id": "mechanism", "title": "Mechanism design and auctions", "kind": "concept", "track": "or", "pre": ["gametheory"], "frontier": false, "core": "Mechanism design chooses the rules of a game so that players acting in their own interest produce the outcome the designer wants. In a second-price auction bidding your true value is optimal, and Myerson’s lemma describes every truthful single-item auction and the revenue it earns.", "reach": "Behind sponsored search, spectrum auctions, and kidney exchange; microstructure studies the auctions that run exchanges.", "resources": [{"title": "Algorithmic Game Theory (Stanford CS364A, Fall 2013)", "url": "https://www.youtube.com/playlist?list=PLEGCF-WLh2RJBqmxvZ0_ie-mleCFhi2N4", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2013", "level": 1, "note": "Lectures 1 to 10: second-price auctions, Myerson’s lemma, revenue-maximizing auctions, VCG, spectrum auctions, and kidney exchange."}, {"title": "Game Theory II: Advanced Applications", "url": "https://www.coursera.org/learn/game-theory-2", "type": "course", "by": "Matthew Jackson, Kevin Leyton-Brown, Yoav Shoham, Stanford, UBC, Coursera", "level": 2, "note": "The economics side: social choice, mechanism design, efficient mechanisms, and auctions."}, {"title": "Multiagent Systems", "url": "http://www.masfoundations.org/", "type": "book", "by": "Yoav Shoham, Kevin Leyton-Brown, Cambridge, 2009", "level": 2, "note": "Chapters 10 and 11: mechanism design and auctions, with full proofs."}, {"title": "Mechanism Design and Approximation", "url": "http://jasonhartline.com/MDnA/", "type": "book", "by": "Jason Hartline, draft, 2011 to 2025", "level": 3, "note": "The classical theory of Bayesian optimal mechanisms, then when simple mechanisms approximate them, from a Northwestern graduate course."}]}, {"id": "nand", "title": "From Nand to Tetris", "kind": "course", "track": "lowlevel", "pre": [], "frontier": false, "core": "Every part of a computer can be built from one gate. NAND makes the other gates, gates make an adder, memory, and a CPU, and an assembler, virtual machine, compiler, and operating system stack on top, each using only the layer below.", "reach": "Each project is a small version of a later node: digital logic, architecture, assembly, compilers, and operating systems.", "resources": [{"title": "From Nand to Tetris", "url": "https://www.nand2tetris.org/", "type": "course", "by": "Noam Nisan, Shimon Schocken, 2025", "level": 1, "note": "Twelve projects with lectures, slides, and free tools: 1 to 6 build gates, an ALU, memory, a CPU, and an assembler; 7 to 12 build a VM, a compiler, and an OS."}, {"title": "The Elements of Computing Systems (2nd edition)", "url": "https://mitpress.mit.edu/9780262539807/the-elements-of-computing-systems/", "type": "book", "by": "Nisan, Schocken, MIT Press, 2021", "level": 2, "note": "The course’s book, one chapter per project, rewritten to separate each abstraction from its implementation.", "paid": true}, {"title": "Build an 8-bit computer", "url": "https://eater.net/8bit", "type": "video", "by": "Ben Eater, 2016", "level": 1, "note": "The same climb on real breadboards: clock, registers, ALU, RAM, program counter, and microcoded control logic, with the timing a simulator hides."}]}, {"id": "c", "title": "C programming and memory", "kind": "concept", "track": "lowlevel", "pre": [], "frontier": false, "core": "C treats memory as one numbered array of bytes. A pointer is an index into it, array indexing is pointer arithmetic, and you manage the stack, the heap, and static data yourself; most C bugs read or write bytes the program does not own.", "reach": "The language of operating systems and the source of the memory bugs that binary exploitation turns into attacks.", "resources": [{"title": "Beej’s Guide to C Programming", "url": "https://beej.us/guide/bgc/", "type": "book", "by": "Brian Hall (Beej), 2026", "level": 1, "note": "Chapters 5, 6, 7, 11, and 12: pointers, arrays, strings, pointer arithmetic, and manual memory allocation."}, {"title": "CS 61C: Great Ideas in Computer Architecture", "url": "https://cs61c.org/", "type": "course", "by": "UC Berkeley, Fall 2026", "level": 2, "note": "The C lectures, the C and C debugging labs, and the first project; slides and labs are public, recordings are not."}, {"title": "Modern C", "url": "https://gustedt.gitlabpages.inria.fr/modern-c/", "type": "book", "by": "Jens Gustedt, C23 edition, 2025", "level": 3, "note": "Free from the author’s page: the whole language as the C23 standard defines it."}]}, {"id": "arch", "title": "Computer architecture", "kind": "concept", "track": "lowlevel", "pre": ["nand", "c", "digital"], "frontier": false, "core": "A processor repeats fetch, decode, and execute on instructions held in memory. Speed comes from overlapping instructions in a pipeline, predicting branches, and caches that exploit locality, because a trip to main memory costs about a hundred times more than an add.", "reach": "The machine that assembly targets, that the operating system virtualizes, and whose caches decide how fast real code runs.", "resources": [{"title": "6.004 Computation Structures", "url": "https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/", "type": "course", "by": "MIT OpenCourseWare, Spring 2017", "level": 1, "note": "Units 9 to 16: instruction sets, procedures and stacks, building the Beta processor, caches, pipelining, and virtual memory, with topic videos."}, {"title": "Computer Systems: A Programmer’s Perspective (3rd edition)", "url": "https://csapp.cs.cmu.edu/", "type": "book", "by": "Bryant, O’Hallaron, Pearson, 2015", "level": 2, "note": "Chapter 4 builds a pipelined Y86-64 processor; Chapters 5 and 6 show how the pipeline and the cache hierarchy set the speed of real code.", "paid": true}, {"title": "Computer Architecture", "url": "https://safari.ethz.ch/architecture/fall2025/doku.php?id=start", "type": "lectures", "by": "Onur Mutlu, ETH Zurich, Fall 2025", "level": 3, "note": "Recorded research-level lectures: memory systems and DRAM, prefetching, cache coherence, memory ordering, virtual memory, and GPUs."}]}, {"id": "assembly", "title": "Assembly and how C compiles", "kind": "concept", "track": "lowlevel", "pre": ["arch"], "frontier": false, "core": "A compiler turns each C function into register moves, arithmetic, compares, and jumps. Locals live in registers or a stack frame, a call pushes a return address and jumps, and a calling convention fixes which registers carry arguments and the return value.", "reach": "Reading compiler output is how you check performance, write a compiler backend, and find and exploit memory bugs.", "resources": [{"title": "CS107 Guide to x86-64", "url": "https://web.stanford.edu/class/cs107/guide/x86-64.html", "type": "notes", "by": "Stanford CS107", "level": 1, "note": "Registers, addressing modes, and the common instructions on one page; keep it open while reading compiler output."}, {"title": "Compiler Explorer", "url": "https://godbolt.org/", "type": "code", "by": "Matt Godbolt, since 2012", "level": 1, "note": "Paste a C function and read the assembly the compiler emits, first at -O0 and then at -O2."}, {"title": "15-213: Introduction to Computer Systems", "url": "https://www.cs.cmu.edu/~213/", "type": "course", "by": "CMU, Fall 2026", "level": 2, "note": "The Machine Programming lectures, Parts I to IV, whose slides follow CS:APP Chapter 3."}, {"title": "Computer Systems: A Programmer’s Perspective (3rd edition)", "url": "https://csapp.cs.cmu.edu/", "type": "book", "by": "Bryant, O’Hallaron, Pearson, 2015", "level": 2, "note": "Chapter 3, Machine-Level Representation of Programs: control flow, procedures, arrays, structs, and buffer overflows.", "paid": true}, {"title": "CS:APP Lab Assignments", "url": "https://csapp.cs.cmu.edu/3e/labs.html", "type": "code", "by": "Bryant, O’Hallaron, CMU", "level": 2, "note": "The Bomb Lab: defuse a binary by disassembling it in a debugger. Self-study handouts are free."}]}, {"id": "compilers", "title": "Compilers and interpreters", "kind": "concept", "track": "lowlevel", "pre": ["assembly", "automata"], "frontier": false, "core": "A compiler is a chain of translations: scan text into tokens, parse tokens into a tree, check the tree, lower it to a simpler intermediate form, optimize that form, and emit machine code. An interpreter stops partway and executes the tree or bytecode directly.", "reach": "Parsing uses the grammars of automata theory; code generation targets the instructions and calling conventions of assembly.", "resources": [{"title": "Crafting Interpreters", "url": "https://craftinginterpreters.com/", "type": "book", "by": "Robert Nystrom, 2021", "level": 1, "note": "Chapter 2 maps the whole pipeline. Part II builds a tree-walking interpreter in Java, Part III a bytecode virtual machine in C."}, {"title": "An Incremental Approach to Compiler Construction", "url": "http://scheme2006.cs.uchicago.edu/11-ghuloum.pdf", "type": "paper", "by": "Abdulaziz Ghuloum, Scheme Workshop, 2006", "level": 2, "note": "Compiles a large subset of Scheme to x86 assembly in small steps, each of which leaves a working compiler."}, {"title": "My First Language Frontend with LLVM (Kaleidoscope)", "url": "https://llvm.org/docs/tutorial/", "type": "tutorial", "by": "LLVM Project", "level": 2, "note": "Chapters 3 and 4: generate LLVM IR, then add the optimizer and a JIT; Chapter 8 emits object code."}, {"title": "CS 6120: Advanced Compilers, The Self-Guided Course", "url": "https://www.cs.cornell.edu/courses/cs6120/2020fa/self-guided/", "type": "course", "by": "Adrian Sampson, Cornell, 2020", "level": 3, "note": "Lessons 3 to 7: local optimization, data flow, SSA, LLVM, and loops, with videos, notes, and implementation tasks."}]}, {"id": "os", "title": "Operating systems", "kind": "concept", "track": "lowlevel", "pre": ["arch", "c"], "frontier": false, "core": "An operating system gives each program the illusion of its own CPU and memory, as processes and virtual address spaces, while sharing the real hardware safely through traps, timers, and page tables. It also turns disks into files and gives threads locks.", "reach": "Processes, sockets, and files are what networking, databases, and binary exploitation build on or attack.", "resources": [{"title": "Operating Systems: Three Easy Pieces", "url": "https://pages.cs.wisc.edu/~remzi/OSTEP/", "type": "book", "by": "Remzi and Andrea Arpaci-Dusseau, version 1.10", "level": 1, "note": "Chapters 4 to 6 (processes, direct execution), 13 to 20 (virtual memory), 26 to 31 (threads, locks, condition variables), and 39 to 42 (file systems, journaling)."}, {"title": "CS 162: Operating Systems and System Programming", "url": "https://cs162.org/", "type": "course", "by": "UC Berkeley, Fall 2026", "level": 2, "note": "Lecture videos and slides, plus Pintos projects that add user programs, threads, and a file system to a teaching kernel."}, {"title": "6.1810: Operating System Engineering", "url": "https://pdos.csail.mit.edu/6.1810/", "type": "course", "by": "MIT, Fall 2026", "level": 3, "note": "Labs that change xv6, a small Unix teaching kernel: system calls, page tables, traps, copy-on-write, locks, a network driver, and a file system."}]}, {"id": "networking", "title": "Computer networks", "kind": "concept", "track": "lowlevel", "pre": ["os"], "frontier": false, "core": "The internet is layers. Links move frames between neighbors, IP forwards packets across networks with no guarantees, TCP builds a reliable ordered byte stream on top using acknowledgments, retransmission, and congestion control, and applications like DNS and HTTP speak over it.", "reach": "Distributed systems assume this unreliable network, and network attacks exploit the trust each layer extends.", "resources": [{"title": "Introduction to the Internet: Architecture and Protocols (CS 168 Textbook)", "url": "https://textbook.cs168.io/", "type": "book", "by": "Peyrin Kao, UC Berkeley, 2024", "level": 1, "note": "Layers and headers, routing and BGP, TCP and congestion control, DNS and HTTP, then datacenters."}, {"title": "Beej’s Guide to Network Programming", "url": "https://beej.us/guide/bgnet/", "type": "book", "by": "Brian Hall (Beej), 2026", "level": 1, "note": "Sections 2 to 6: sockets, addresses, the system calls, and a simple stream server and client in C."}, {"title": "CS 144: Introduction to Computer Networking", "url": "https://cs144.github.io/", "type": "course", "by": "Stanford", "level": 2, "note": "Checkpoints build a byte stream, a TCP receiver and sender, a network interface, and an IP router."}]}, {"id": "genchem", "title": "General chemistry", "kind": "concept", "track": "chem", "pre": [], "frontier": false, "core": "Electrons fill orbitals in a fixed order, and that filling explains the periodic table: how readily an atom gains, loses, or shares electrons decides which bonds it forms. Reactions conserve atoms, and energy and equilibrium decide which way they run and how far.", "reach": "The base for organic chemistry, physical chemistry, and cell biology; batteries, semiconductors, and rocket propellants in propulsion are applied general chemistry.", "resources": [{"title": "MIT 5.111SC: Principles of Chemical Science", "url": "https://ocw.mit.edu/courses/5-111sc-principles-of-chemical-science-fall-2014/", "type": "course", "by": "Catherine Drennan, MIT OCW, 2014", "level": 1, "note": "Lecture videos on atomic and molecular structure, thermodynamics, equilibria, kinetics, and catalysis."}, {"title": "Chemistry 2e", "url": "https://openstax.org/details/books/chemistry-2e", "type": "book", "by": "OpenStax, 2019", "level": 1, "note": "Chapters 6 and 7: electron configurations, periodic trends, and ionic and covalent bonding."}]}, {"id": "organic", "title": "Organic chemistry", "kind": "concept", "track": "chem", "pre": ["genchem"], "frontier": false, "core": "Carbon makes four stable bonds, so organic molecules are skeletons carrying functional groups whose electron-rich and electron-poor sites predict reactivity. Most reactions are an electron pair from a nucleophile attacking an electrophile, drawn as curved arrows, so a few mechanisms explain thousands of reactions.", "reach": "Biochem is organic chemistry in water; drug design and the molecule generators of machine learning work in its vocabulary.", "resources": [{"title": "Organic chemistry", "url": "https://www.khanacademy.org/science/organic-chemistry", "type": "course", "by": "Khan Academy", "level": 1, "note": "Starts from structure and bonding (dot structures, hybridization, bond-line drawings) and builds to reactions."}, {"title": "Organic Chemistry: A Tenth Edition", "url": "https://openstax.org/details/books/organic-chemistry", "type": "book", "by": "John McMurry, OpenStax", "level": 2, "note": "A full free textbook, organized by functional group and mechanism."}, {"title": "Master Organic Chemistry", "url": "https://www.masterorganicchemistry.com/", "type": "blog", "by": "James Ashenhurst", "level": 2, "note": "Short articles on each mechanism, such as SN1, SN2, and E2; good for curved arrow practice."}, {"title": "CHEM 125a: Freshman Organic Chemistry I", "url": "https://oyc.yale.edu/chemistry/chem-125a", "type": "lectures", "by": "J. Michael McBride, Open Yale Courses, 2008", "level": 3, "note": "Why structure and mechanism are what they are, traced to their experimental and quantum basis."}]}, {"id": "physchem", "title": "Physical chemistry: thermodynamics and kinetics", "kind": "concept", "track": "chem", "pre": ["genchem", "thermo"], "frontier": false, "core": "Free energy, G = H - TS, decides whether a reaction runs: it proceeds while G falls, and equilibrium sits at the minimum. Speed is a separate question, set by the energy barrier Ea: by the Arrhenius law the rate scales as exp(-Ea/RT).", "reach": "The thermodynamic half of quantum chemistry; batteries, combustion in propulsion, and protein folding in biochemistry are free energy calculations.", "resources": [{"title": "Chemistry 2e", "url": "https://openstax.org/details/books/chemistry-2e", "type": "book", "by": "OpenStax, 2019", "level": 1, "note": "Chapters 12 (kinetics), 13 (equilibria), and 16 (thermodynamics: entropy and free energy)."}, {"title": "MIT 5.60: Thermodynamics and Kinetics", "url": "https://ocw.mit.edu/courses/5-60-thermodynamics-kinetics-spring-2008/", "type": "lectures", "by": "Moungi Bawendi, Keith Nelson, MIT OCW, 2008", "level": 2, "note": "Video lectures on the laws of thermodynamics, chemical equilibrium in gas and solution, and reaction rates."}, {"title": "Atkins Physical Chemistry, Volume 1", "url": "https://global.oup.com/academic/product/atkins-physical-chemistry-v1-9780198851301", "type": "book", "by": "Atkins, de Paula, Keeler, 12th edition", "level": 2, "note": "The standard textbook, with worked examples and the math each derivation needs.", "paid": true}]}, {"id": "quantchem", "title": "Quantum and computational chemistry", "kind": "concept", "track": "chem", "pre": ["qm", "physchem", "numerics"], "frontier": true, "core": "Electrons in a molecule obey the Schrödinger equation, which cannot be solved exactly beyond hydrogen. Hartree-Fock gives each electron an orbital in the average field of the others; density functional theory replaces the wavefunction with the electron density. The energies predict structures, barriers, and spectra.", "reach": "Generates the training data for learned molecular models and potentials, and is a leading expected application of quantum computing.", "resources": [{"title": "Psi4NumPy", "url": "https://github.com/psi4/psi4numpy", "type": "code", "by": "Psi4 developers", "level": 2, "note": "Tutorials 03 (Hartree-Fock) and 04 (density functional theory) derive each method, then build it in NumPy."}, {"title": "A bird’s-eye view of density-functional theory", "url": "https://arxiv.org/abs/cond-mat/0211443", "type": "tutorial", "by": "Klaus Capelle, 2002", "level": 2, "note": "An informal primer: the Hohenberg-Kohn theorem, the Kohn-Sham equations, and the approximate functionals used in practice."}, {"title": "Modern Quantum Chemistry", "url": "https://store.doverpublications.com/products/9780486691862", "type": "book", "by": "Attila Szabo, Neil Ostlund, Dover 1996", "level": 2, "note": "Chapters 1 to 3 build up to Hartree-Fock; chapters 4 to 7 improve on it.", "paid": true}, {"title": "Neural Message Passing for Quantum Chemistry", "url": "https://arxiv.org/abs/1704.01212", "type": "paper", "by": "Gilmer et al., 2017", "level": 3, "note": "Graph networks that predict DFT-computed molecular properties at a fraction of the cost."}]}, {"id": "biochem", "title": "Biochemistry", "kind": "concept", "track": "chem", "pre": ["organic"], "frontier": false, "core": "Proteins are chains of amino acids that fold into shapes, and the shape decides what they bind and what they catalyze. Enzymes speed reactions by lowering the energy barrier without moving the equilibrium, and metabolism is chains of such reactions paid for with ATP.", "reach": "Protein structure links to AlphaFold and protein design in the machine learning roadmap; cell biology and genetics build on it.", "resources": [{"title": "MIT 7.05: General Biochemistry", "url": "https://ocw.mit.edu/courses/7-05-general-biochemistry-spring-2020/", "type": "lectures", "by": "Michael Yaffe, Matthew Vander Heiden, MIT OCW, 2020", "level": 1, "note": "Video lectures on the chemistry of proteins and nucleic acids, enzymes, and metabolism."}, {"title": "Fundamentals of Biochemistry", "url": "https://bio.libretexts.org/Bookshelves/Biochemistry/Fundamentals_of_Biochemistry_(Jakubowski_and_Flatt)", "type": "book", "by": "Henry Jakubowski, Patricia Flatt, LibreTexts", "level": 2, "note": "Unit I (structure and catalysis) and Unit II (bioenergetics and metabolism)."}, {"title": "Highly Accurate Protein Structure Prediction with AlphaFold", "url": "https://www.nature.com/articles/s41586-021-03819-2", "type": "paper", "by": "Jumper et al., Nature, 2021", "level": 3, "note": "How far sequence alone determines structure, learned from the Protein Data Bank."}]}, {"id": "fluidmech", "title": "Fluid mechanics", "kind": "concept", "track": "fluids", "pre": ["mechanics", "pde"], "frontier": false, "core": "A fluid is described by velocity and pressure fields, and the Navier-Stokes equations are F = ma for each small parcel: pressure differences push it and viscosity smooths it. The Reynolds number, inertia over viscosity, predicts whether flow stays smooth or turns turbulent.", "reach": "Leads to CFD, turbulence, and convective heat transfer, and to aerodynamics and propulsion.", "resources": [{"title": "The Feynman Lectures on Physics, Volume II", "url": "https://www.feynmanlectures.caltech.edu/II_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1964", "level": 1, "note": "Chapters 40 and 41, The Flow of Dry Water and The Flow of Wet Water: ideal flow, then viscosity."}, {"title": "Fluid Mechanics", "url": "https://davidtong.org/teaching/fluid-mechanics/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapters 1 and 2: inviscid flow, then the Navier-Stokes equation; later chapters cover waves and instabilities."}, {"title": "MIT 2.25: Advanced Fluid Mechanics", "url": "https://ocw.mit.edu/courses/2-25-advanced-fluid-mechanics-fall-2013/", "type": "course", "by": "Gareth McKinley, MIT OCW, 2013", "level": 3, "note": "Viscous flow, dimensional analysis, lubrication, boundary layers and separation, and vorticity, with problem sets."}]}, {"id": "cfd", "title": "Computational fluid dynamics", "kind": "concept", "track": "fluids", "pre": ["fluidmech", "numerics"], "frontier": false, "core": "Replace derivatives in the flow equations with differences between grid values, then march forward in time. The answer is trustworthy only if the scheme is stable (the CFL condition ties the time step to the grid spacing) and converges as the grid is refined.", "reach": "Applies numerical methods to fluid mechanics and feeds aerodynamics and propulsion; learned simulators from the machine learning roadmap now replace parts of it.", "resources": [{"title": "CFD Python: 12 steps to Navier-Stokes", "url": "https://github.com/barbagroup/CFDPython", "type": "code", "by": "Lorena Barba, Gilbert Forsyth, 2013", "level": 1, "note": "Steps 1 to 4 and the CFL notebook in one dimension, then two dimensions, ending with Navier-Stokes for cavity and channel flow."}, {"title": "Fluid Simulation for Computer Graphics (course notes)", "url": "https://www.cs.ubc.ca/~rbridson/fluidsimulation/fluids_notes.pdf", "type": "notes", "by": "Robert Bridson, Matthias Müller-Fischer, SIGGRAPH 2007", "level": 2, "note": "Chapters 2 to 4: operator splitting, advection, and the pressure projection that keeps the flow incompressible."}, {"title": "Coding Adventure: Simulating Fluids", "url": "https://www.youtube.com/watch?v=rSKMYc1CQHE", "type": "video", "by": "Sebastian Lague", "level": 1, "note": "Builds a particle-based water simulation from scratch, the alternative to grids."}, {"title": "Computational Fluid Mechanics: Airflow Around a Spoiler", "url": "https://www.coursera.org/projects/computational-fluid-mechanics-airflow-around-a-spoiler-uktyf", "type": "course", "by": "Jousef Murad, Coursera guided project", "level": 1, "note": "One hour setting up an incompressible flow simulation in cloud software and reading its results."}, {"title": "Computational Methods for Engineers", "url": "https://empossible.net/academics/emp4301_5301/", "type": "lectures", "by": "Raymond Rumpf, UTEP EMPossible", "level": 2, "note": "Topics 6 and 7: finite differences as sparse matrices, boundary conditions, and collocated versus staggered grids."}, {"title": "Physics-Based Deep Learning", "url": "https://physicsbaseddeeplearning.org/", "type": "book", "by": "Nils Thuerey and others", "level": 3, "note": "Neural surrogates, physical loss terms, and differentiable simulators that train through the solver, with notebooks."}]}, {"id": "turbulence", "title": "Turbulence", "kind": "concept", "track": "fluids", "pre": ["fluidmech", "prob"], "frontier": true, "core": "At high Reynolds number a flow breaks into eddies of every size. Energy enters at the largest, cascades to ever smaller ones, and becomes heat at the smallest, where viscosity wins; from that picture alone Kolmogorov derived that energy at wavenumber k scales as k^(-5/3).", "reach": "Why CFD needs turbulence models and convective heat transfer is hard; an open problem where learned closures from machine learning are being tried.", "resources": [{"title": "Understanding Laminar and Turbulent Flow", "url": "https://www.youtube.com/watch?v=9A-uUG0WR0w", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "Fluid Mechanics", "url": "https://davidtong.org/teaching/fluid-mechanics/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapter 5, Turbulence."}, {"title": "Turbulence: An Introduction for Scientists and Engineers", "url": "https://global.oup.com/academic/product/turbulence-9780198722595", "type": "book", "by": "Peter Davidson, 2nd edition", "level": 2, "note": "Written for newcomers and researchers alike, with physical pictures before the statistics.", "paid": true}, {"title": "Turbulent Flows", "url": "https://www.cambridge.org/highereducation/books/turbulent-flows/C58EFF59AF9B81AE6CFAC9ED16486B3A", "type": "book", "by": "Stephen Pope, 2000", "level": 3, "note": "The standard graduate text, from the statistical description of turbulence to its modeling.", "paid": true}, {"title": "Machine Learning for Fluid Mechanics", "url": "https://arxiv.org/abs/1905.11075", "type": "paper", "by": "Brunton, Noack, Koumoutsakos, 2020", "level": 3, "note": "A survey of learned models for understanding, modeling, and controlling flows."}]}, {"id": "heat", "title": "Heat transfer", "kind": "concept", "track": "fluids", "pre": ["thermo", "pde", "fluidmech"], "frontier": false, "core": "Heat moves by conduction, where flux follows the temperature gradient (Fourier’s law) and yields the heat equation; by convection, where moving fluid carries it; and by radiation, which grows as temperature to the fourth power. Most designs reduce to thermal resistances in series.", "reach": "Sets cooling limits for chips in VLSI and for nozzles in propulsion; the heat equation is the model diffusion PDE.", "resources": [{"title": "Understanding Conduction and the Heat Equation", "url": "https://www.youtube.com/watch?v=6jQsLAqrZGQ", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "A Heat Transfer Textbook", "url": "https://ahtt.mit.edu/", "type": "book", "by": "John H. Lienhard IV, John H. Lienhard V, 6th edition", "level": 2, "note": "The whole subject, conduction, convection, radiation, and mass transfer, free, with more than 560 exercises."}, {"title": "MIT 2.51: Intermediate Heat and Mass Transfer", "url": "https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/", "type": "course", "by": "Bora Mikic, MIT OCW, 2008", "level": 3, "note": "The advanced undergraduate course, assuming thermodynamics and fluid mechanics."}]}, {"id": "structures", "title": "Structural mechanics and vibrations", "kind": "concept", "track": "fluids", "pre": ["mechanics", "linalg"], "frontier": false, "core": "A loaded structure deforms until internal stresses balance the loads; stress is force per area, strain is relative stretch, and for small strains they are proportional (Hooke’s law). In motion the same structure vibrates at natural frequencies, the eigenvalues of its stiffness and mass matrices.", "reach": "Fem solves these equations on real shapes; vibration modes are the same eigenvector idea as modes in signals and control.", "resources": [{"title": "Understanding Stresses in Beams", "url": "https://www.youtube.com/watch?v=f08Y39UiC-o", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "Understanding Vibration and Resonance", "url": "https://www.youtube.com/watch?v=vLaFAKnaRJU", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "MIT 2.001: Mechanics and Materials I", "url": "https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/", "type": "course", "by": "Socrate, Livermore, Schmidt, Williams, MIT OCW, 2006", "level": 2, "note": "The three parts of every analysis: geometry of deformation, forces in the structure, and material behavior."}, {"title": "MIT 2.003SC: Engineering Dynamics", "url": "https://ocw.mit.edu/courses/2-003sc-engineering-dynamics-fall-2011/", "type": "lectures", "by": "J. Kim Vandiver, David Gossard, MIT OCW, 2011", "level": 2, "note": "The last units cover mechanical vibration, systems with many degrees of freedom, and mode superposition."}]}, {"id": "fem", "title": "Finite element method", "kind": "concept", "track": "fluids", "pre": ["structures", "numerics", "pde"], "frontier": false, "core": "Rewrite a differential equation in weak form, an integral statement, then approximate the solution as a sum of simple functions on small elements. The coefficients solve a sparse linear system K u = f, assembled element by element, so it works on any mesh shape.", "reach": "The workhorse for structural mechanics, heat transfer, and electromagnetics on real geometry; CFD mostly uses its finite volume cousin.", "resources": [{"title": "Understanding the Finite Element Method", "url": "https://www.youtube.com/watch?v=GHjopp47vvQ", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "Introduction to Finite Element Methods", "url": "https://open.umich.edu/find/open-educational-resources/engineering/introduction-finite-element-methods", "type": "lectures", "by": "Krishna Garikipati, University of Michigan, 2013", "level": 2, "note": "About 50 hours of lectures, starting from one-dimensional elliptic problems, with coding assignments."}, {"title": "The FEniCSx tutorial", "url": "https://jsdokken.com/dolfinx-tutorial/", "type": "tutorial", "by": "Jørgen Dokken", "level": 2, "note": "Write the weak form in Python and solve Poisson, heat, elasticity, and Navier-Stokes problems."}, {"title": "MIT 2.092: Finite Element Analysis of Solids and Fluids I", "url": "https://ocw.mit.edu/courses/2-092-finite-element-analysis-of-solids-and-fluids-i-fall-2009/", "type": "lectures", "by": "Klaus-Jürgen Bathe, MIT OCW, 2009", "level": 3, "note": "Solids, structures, fluids, and heat transfer, steady and dynamic, linear and nonlinear."}]}, {"id": "options", "title": "Options and derivatives", "kind": "concept", "track": "quant", "pre": ["prob"], "frontier": false, "core": "An option is the right, not the obligation, to buy or sell at a fixed price, so its payoff is a hockey stick. No-arbitrage sets its price: if stock and cash can replicate the payoff, the option costs what the replica costs, whatever anyone expects.", "reach": "Stochastic calculus takes the replication argument to continuous time, fixed income applies it to interest rates, and microstructure covers the market makers who quote options.", "resources": [{"title": "Akuna Options 101", "url": "https://akunacapital.com/options-101", "type": "course", "by": "Akuna Capital, free", "level": 1, "note": "Open outcry, electronic trading, and the option greeks, taught by an options market maker."}, {"title": "Financial Engineering and Risk Management", "url": "https://www.coursera.org/specializations/financialengineering", "type": "course", "by": "Martin Haugh, Garud Iyengar, Columbia, Coursera", "level": 2, "note": "Course 1 prices swaps and options with the binomial model, one period and then many, and ends at Black-Scholes."}, {"title": "Columbia IEOR E4706: Foundations of Financial Engineering", "url": "https://martin-haugh.github.io/teaching/foundations-fe/", "type": "notes", "by": "Martin Haugh, Columbia, 2016", "level": 2, "note": "The notes on forwards, swaps, futures and options, then martingale pricing, the idea underneath all of it."}]}, {"id": "stochcalc", "title": "Stochastic calculus and Black-Scholes", "kind": "concept", "track": "quant", "pre": ["stochproc", "pde", "options"], "frontier": false, "core": "Brownian motion wiggles so finely that its squared increments add up to elapsed time, adding a second-order term to the chain rule (Ito’s lemma). For a hedged option it gives the Black-Scholes equation; the price is the discounted expected payoff under risk-neutral probabilities.", "reach": "The same Ito calculus drives score SDEs and diffusion models in the machine learning roadmap.", "resources": [{"title": "MIT 18.S096: Topics in Mathematics with Applications in Finance", "url": "https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/", "type": "lectures", "by": "Kempthorne, Lee, Strela, Xia, MIT OCW, 2013", "level": 1, "note": "Lectures 5, 17, 18, 19, and 21: stochastic processes, Ito calculus, Black-Scholes and risk-neutral valuation, and SDEs."}, {"title": "Columbia IEOR E4706: Foundations of Financial Engineering", "url": "https://martin-haugh.github.io/teaching/foundations-fe/", "type": "notes", "by": "Martin Haugh, Columbia, 2016", "level": 2, "note": "The notes on stochastic calculus and on Black-Scholes, short and aimed at pricing."}, {"title": "Stochastic Calculus for Finance II: Continuous-Time Models", "url": "https://link.springer.com/book/9780387401010", "type": "book", "by": "Steven Shreve, 2004", "level": 2, "note": "Stochastic calculus, martingales, risk-neutral pricing, exotic options, and term structure models in continuous time.", "paid": true}, {"title": "The Pricing of Options and Corporate Liabilities", "url": "https://www.jstor.org/stable/1831029", "type": "paper", "by": "Fischer Black, Myron Scholes, 1973", "level": 2, "note": "The original derivation.", "paid": true}, {"title": "MIT 6.262: Discrete Stochastic Processes", "url": "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/", "type": "lectures", "by": "Robert Gallager, MIT OCW, 2011", "level": 3, "note": "Lectures 20 to 24: random walks and martingales, the discrete theory under risk-neutral pricing."}]}, {"id": "portfolio", "title": "Portfolio theory and risk", "kind": "concept", "track": "quant", "pre": ["prob", "convex"], "frontier": false, "core": "Assets that do not move together partly cancel each other’s swings, so diversifying cuts risk but not expected return. The best portfolios trade mean against variance along an efficient frontier, a quadratic program; if everyone does this, expected return depends only on market beta (CAPM).", "reach": "An application of convex optimization; microstructure adds trading costs, and the same tradeoff sizes positions in any quant strategy.", "resources": [{"title": "MIT 18.S096: Topics in Mathematics with Applications in Finance", "url": "https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/", "type": "lectures", "by": "Kempthorne, Lee, Strela, Xia, MIT OCW, 2013", "level": 1, "note": "Lecture 14 (portfolio theory) and lecture 7 (value at risk) cover the two halves of this node."}, {"title": "Columbia IEOR E4706: Foundations of Financial Engineering", "url": "https://martin-haugh.github.io/teaching/foundations-fe/", "type": "notes", "by": "Martin Haugh, Columbia, 2016", "level": 2, "note": "The notes on mean-variance analysis and the CAPM."}, {"title": "Portfolio Selection", "url": "https://www.jstor.org/stable/2975974", "type": "paper", "by": "Harry Markowitz, Journal of Finance, 1952", "level": 2, "note": "The original mean-variance paper.", "paid": true}, {"title": "Financial Engineering and Risk Management", "url": "https://www.coursera.org/specializations/financialengineering", "type": "course", "by": "Martin Haugh, Garud Iyengar, Columbia, Coursera", "level": 2, "note": "Course 3, Optimization Methods in Asset Management: where mean-variance breaks in practice, VaR and CVaR, and transaction costs."}, {"title": "Multi-Period Trading via Convex Optimization", "url": "https://arxiv.org/abs/1705.00109", "type": "paper", "by": "Boyd et al., 2017", "level": 3, "note": "Portfolio choice as a convex problem solved every period, with costs, constraints, and risk."}]}, {"id": "fixedincome", "title": "Fixed income and the term structure", "kind": "concept", "track": "quant", "pre": ["options", "stochcalc"], "frontier": false, "core": "A bond’s price is its cash flows discounted along the yield curve, so price falls when rates rise, and duration measures by how much. The curve itself moves randomly; short rate models fit today’s curve on a lattice and price rate options by no-arbitrage.", "reach": "Uses the no-arbitrage pricing of options; the continuous-time models (Vasicek, HJM) need stochastic calculus.", "resources": [{"title": "Columbia IEOR E4706: Foundations of Financial Engineering", "url": "https://martin-haugh.github.io/teaching/foundations-fe/", "type": "notes", "by": "Martin Haugh, Columbia, 2016", "level": 1, "note": "The prerequisite notes on deterministic cash flows (yields and duration), then the notes on term structure lattice models."}, {"title": "Financial Engineering and Risk Management", "url": "https://www.coursera.org/specializations/financialengineering", "type": "course", "by": "Martin Haugh, Garud Iyengar, Columbia, Coursera", "level": 2, "note": "Course 2, Term-Structure and Credit Derivatives: lattice models, calibrating Black-Derman-Toy, swaptions, credit default swaps, and mortgage-backed securities."}, {"title": "MIT 18.S096: Topics in Mathematics with Applications in Finance", "url": "https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/", "type": "lectures", "by": "Kempthorne, Lee, Strela, Xia, MIT OCW, 2013", "level": 3, "note": "Lecture 24: the HJM model for interest rates and credit, taught by a practitioner."}]}, {"id": "microstructure", "title": "Market microstructure and trading", "kind": "concept", "track": "quant", "pre": ["portfolio", "stochproc"], "frontier": true, "core": "Prices form in a limit order book, where market makers post bids and asks and others trade against them. The spread pays makers for inventory risk and adverse selection, the chance the other side knows more; Kyle’s model shows how informed trading leaks into prices.", "reach": "Builds on portfolio theory and stochastic processes; market making is a stochastic control problem, and judging a backtest needs the testing discipline of biostatistics.", "resources": [{"title": "Limit Order Books", "url": "https://arxiv.org/abs/1012.0349", "type": "paper", "by": "Gould, Porter, Williams, et al., 2013", "level": 2, "note": "A survey of what order book data shows and how well the models reproduce it, ending with open questions."}, {"title": "Trading and Exchanges: Market Microstructure for Practitioners", "url": "https://global.oup.com/academic/product/trading-and-exchanges-9780195144703", "type": "book", "by": "Larry Harris, Oxford", "level": 1, "note": "Who trades, why, and how auctions, order types, and brokered markets work.", "paid": true}, {"title": "Continuous Auctions and Insider Trading", "url": "https://www.jstor.org/stable/1913210", "type": "paper", "by": "Albert Kyle, Econometrica, 1985", "level": 2, "note": "How an informed trader hides among noise traders and how prices absorb the information.", "paid": true}, {"title": "Trades, Quotes and Prices", "url": "https://www.cambridge.org/core/books/trades-quotes-and-prices/029A71078EE4C41C0D5D4574211AB1B5", "type": "book", "by": "Bouchaud, Bonart, Donier, Gould, 2018", "level": 3, "note": "Order flow and price impact from the data up, by researchers at a quant fund.", "paid": true}, {"title": "Dealing with the Inventory Risk: A Solution to the Market Making Problem", "url": "https://arxiv.org/abs/1105.3115", "type": "paper", "by": "Guéant, Lehalle, Fernandez-Tapia, 2011", "level": 3, "note": "Solves the Avellaneda-Stoikov market making problem as stochastic control and gives the optimal quotes."}, {"title": "How I Develop Trading Strategies: Permutation Tests", "url": "https://www.youtube.com/watch?v=NLBXgSmRBgU", "type": "video", "by": "neurotrader", "level": 1, "note": "Permutation tests that check whether a backtest beats chance."}]}, {"id": "webdev", "title": "Web development, front end and back end", "kind": "concept", "track": "software", "pre": [], "frontier": false, "core": "A web app is a browser and a server talking HTTP. The browser renders HTML, styles it with CSS, and runs JavaScript that updates the page and calls the server’s API; the server checks the request, queries a database, and returns JSON or HTML.", "reach": "Every web app is an attack surface, and serving one to millions of users is system design.", "resources": [{"title": "Full Stack Open", "url": "https://fullstackopen.com/en/", "type": "course", "by": "University of Helsinki", "level": 1, "note": "Parts 0 to 5: how web apps work, React, a Node and Express server, testing, and user administration; Part 13 adds a relational database."}, {"title": "Learn web development", "url": "https://developer.mozilla.org/en-US/docs/Learn_web_development", "type": "tutorial", "by": "MDN, Mozilla", "level": 1, "note": "The core modules on structuring content with HTML, CSS styling and layout, and dynamic scripting with JavaScript."}, {"title": "High Performance Browser Networking", "url": "https://hpbn.co/", "type": "book", "by": "Ilya Grigorik, O’Reilly, 2013", "level": 3, "note": "Free online: what sits under a page load, from latency and TCP to TLS, HTTP/2, and WebSocket."}]}, {"id": "swe", "title": "Software engineering practice", "kind": "concept", "track": "software", "pre": [], "frontier": false, "core": "Code is read and changed far more often than it is written, so practice aims to make change cheap and safe: version control for every edit, automated tests that catch regressions, code review, modules with simple interfaces that hide complexity, and automated builds and deploys.", "reach": "The habits that system design assumes: many engineers changing one codebase without breaking it.", "resources": [{"title": "The Missing Semester of Your CS Education", "url": "https://missing.csail.mit.edu/", "type": "lectures", "by": "MIT, 2026", "level": 1, "note": "The shell, the development environment, debugging and profiling, Git, packaging and shipping, agentic coding, and code quality."}, {"title": "A Philosophy of Software Design", "url": "https://www.youtube.com/watch?v=bmSAYlu0NcY", "type": "video", "by": "John Ousterhout, Talks at Google, 2018", "level": 1, "note": "Deep modules: a simple interface over a large implementation, as the main tool against complexity."}, {"title": "Software Engineering at Google", "url": "https://abseil.io/resources/swe-book", "type": "book", "by": "Winters, Manshreck, Wright, O’Reilly, 2020", "level": 2, "note": "Free online. Chapters 9 (code review), 11 to 14 (testing), 16 (version control), and 23 (continuous integration)."}, {"title": "Build Your Own X", "url": "https://github.com/codecrafters-io/build-your-own-x", "type": "code", "by": "CodeCrafters, GitHub list", "level": 2, "note": "Tutorials for rebuilding the tools you use, such as Git, a shell, a database, or a web server."}]}, {"id": "databases", "title": "Database systems", "kind": "concept", "track": "software", "pre": ["ds", "os"], "frontier": false, "core": "A database stores rows in fixed-size disk pages, finds them through indexes such as B+ trees, runs SQL as a plan of scans and joins chosen by cost, and keeps concurrent transactions correct through crashes with locks or versions and a write-ahead log.", "reach": "Replicating and partitioning this across machines is distributed systems; SQL injection attacks the query layer.", "resources": [{"title": "CMU 15-445/645: Database Systems", "url": "https://15445.courses.cs.cmu.edu/", "type": "course", "by": "Andy Pavlo, CMU, Fall 2026", "level": 1, "note": "Recorded lectures on storage, buffer pools, hash tables, B+ trees, query execution, concurrency control, logging, and recovery, with C++ projects."}, {"title": "Designing Data-Intensive Applications", "url": "https://dataintensive.net/", "type": "book", "by": "Martin Kleppmann, O’Reilly, 2017", "level": 2, "note": "Chapter 3 (storage and retrieval: log-structured engines versus B-trees) and Chapter 7 (transactions and isolation levels).", "paid": true}, {"title": "Let’s Build a Simple Database", "url": "https://cstack.github.io/db_tutorial/", "type": "tutorial", "by": "cstack", "level": 2, "note": "Write a small SQLite clone in C, from a REPL to an on-disk B-tree."}, {"title": "Readings in Database Systems (the Red Book), 5th edition", "url": "http://www.redbook.io/", "type": "book", "by": "Bailis, Hellerstein, Stonebraker, 2015", "level": 3, "note": "Short opinionated chapters that introduce the classic papers; start with Techniques Everyone Should Know."}]}, {"id": "distributed", "title": "Distributed systems and consensus", "kind": "concept", "track": "software", "pre": ["networking", "databases"], "frontier": false, "core": "Machines with no shared clock, each able to crash or be cut off, must act as one. A node cannot tell a crashed peer from a slow one, so consensus protocols like Raft and Paxos keep a replicated log consistent whenever a majority can communicate.", "reach": "Blockchains run consensus among strangers; system design applies these trade-offs to real services.", "resources": [{"title": "Distributed Systems lecture series", "url": "https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB", "type": "lectures", "by": "Martin Kleppmann, Cambridge, 2020", "level": 1, "note": "Short videos on system models, clocks and causality, broadcast, replication, consensus, and replica consistency; the lecture notes PDF follows the same eight chapters."}, {"title": "6.5840: Distributed Systems", "url": "https://pdos.csail.mit.edu/6.824/", "type": "course", "by": "MIT", "level": 2, "note": "Go labs: MapReduce, a key/value server, Raft, a key/value store on Raft, and a sharded store, tested against crashes and partitions."}, {"title": "In Search of an Understandable Consensus Algorithm (Extended Version)", "url": "https://raft.github.io/raft.pdf", "type": "paper", "by": "Ongaro, Ousterhout, 2014", "level": 2, "note": "Section 5 is the algorithm: leader election, log replication, and safety. Section 7 adds log compaction."}, {"title": "Consistency Models", "url": "https://jepsen.io/consistency", "type": "notes", "by": "Jepsen", "level": 3, "note": "A reference map of consistency models and the anomalies each one allows, with links to the papers that define them."}, {"title": "Time, Clocks, and the Ordering of Events in a Distributed System", "url": "https://lamport.azurewebsites.net/pubs/time-clocks.pdf", "type": "paper", "by": "Leslie Lamport, 1978", "level": 3, "note": "The happens-before relation and logical clocks, the vocabulary every later paper uses."}]}, {"id": "sysdesign", "title": "System design at scale", "kind": "concept", "track": "software", "pre": ["distributed", "swe"], "frontier": false, "core": "Design a large service by estimating its load first, then splitting the work: stateless servers behind load balancers, caches for hot reads, replicated and sharded storage, and queues for slow jobs. Each choice trades latency, consistency, cost, and failure behavior against the others.", "reach": "Where databases, consensus, and engineering practice meet in one design.", "resources": [{"title": "The System Design Primer", "url": "https://github.com/donnemartin/system-design-primer", "type": "notes", "by": "Donne Martin", "level": 1, "note": "Start at System design topics: start here, then work the solved questions such as Pastebin and the Twitter timeline."}, {"title": "Site Reliability Engineering", "url": "https://sre.google/sre-book/table-of-contents/", "type": "book", "by": "Beyer, Jones, Petoff, Murphy, Google, 2016", "level": 2, "note": "Free online. Chapters 4 (service level objectives), 21 (handling overload), and 22 (cascading failures): how large services stay up."}, {"title": "The Tail at Scale", "url": "https://research.google/pubs/the-tail-at-scale/", "type": "paper", "by": "Dean, Barroso, CACM, 2013", "level": 3, "note": "Why fanning a request out to many servers turns rare slow responses into common ones, and the hedged requests that fix it."}, {"title": "System Design in a Hurry", "url": "https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction", "type": "tutorial", "by": "Hello Interview", "level": 1, "note": "A delivery framework, core concepts, key technologies, and common patterns for practicing designs under a time limit."}]}, {"id": "classical", "title": "Classical control and PID", "kind": "concept", "track": "control", "pre": ["diffeq", "signals"], "frontier": false, "core": "Measure the output, compare it with the setpoint, and push the plant with a correction proportional to the error, its integral, and its derivative (PID). Feedback moves the closed-loop poles; the loop is stable when all of them lie in the left half plane.", "reach": "State-space methods extend it to many inputs and outputs; the same loops steer quadrotors, rockets, and disk drives.", "resources": [{"title": "Classical Control Theory", "url": "https://www.youtube.com/playlist?list=PLUMWjy5jgHK1NC52DXXrriwihVrYZKqjk", "type": "lectures", "by": "Brian Douglas, 2012 to 2015", "level": 1, "note": "Hand-drawn lectures on closed-loop control, transfer functions, the Laplace transform, Bode plots, and steady-state error."}, {"title": "Understanding PID Control", "url": "https://www.youtube.com/playlist?list=PLn8PRpmsu08pQBgjxYFXSsODEF3Jqmm-y", "type": "video", "by": "MATLAB (Brian Douglas), 2018", "level": 1, "note": "Short videos on what each term does, integral windup, filtering the derivative, and tuning."}, {"title": "Feedback Systems: An Introduction for Scientists and Engineers (2nd edition)", "url": "http://www.cds.caltech.edu/~murray/books/AM08/pdf/fbs-public_24Jul2020.pdf", "type": "book", "by": "Karl Johan Åström, Richard Murray, 2021", "level": 2, "note": "Chapters 9 to 11: transfer functions and Bode plots, the Nyquist criterion and stability margins, then PID control and tuning."}]}, {"id": "statespace", "title": "State-space control and LQR", "kind": "concept", "track": "control", "pre": ["classical", "linalg"], "frontier": false, "core": "Write the dynamics as dx/dt = Ax + Bu. If the system is controllable, state feedback u = -Kx can place the closed-loop eigenvalues anywhere; LQR picks the K that minimizes a quadratic cost on state error and control effort by solving a Riccati equation.", "reach": "Kalman filtering is its dual, MPC adds constraints, and linearizing around a trajectory extends it to robots and spacecraft.", "resources": [{"title": "Control Bootcamp", "url": "https://www.youtube.com/playlist?list=PLMrJAkhIeNNR20Mz-VpzgfQs5zrYi085m", "type": "lectures", "by": "Steve Brunton, University of Washington, 2017", "level": 1, "note": "Short lectures on controllability, pole placement, and LQR for an inverted pendulum on a cart, with code."}, {"title": "Feedback Systems: An Introduction for Scientists and Engineers (2nd edition)", "url": "http://www.cds.caltech.edu/~murray/books/AM08/pdf/fbs-public_24Jul2020.pdf", "type": "book", "by": "Karl Johan Åström, Richard Murray, 2021", "level": 2, "note": "Chapters 6 and 7: linear systems, reachability, eigenvalue placement, and Section 7.5 on linear quadratic regulators."}, {"title": "Underactuated Robotics", "url": "https://underactuated.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT, 2024", "level": 2, "note": "Chapter 8 derives LQR from dynamic programming and uses it to stabilize nonlinear robots, with notebooks."}, {"title": "EE363: Linear Dynamical Systems", "url": "https://ee363.stanford.edu/lectures.html", "type": "notes", "by": "Sanjay Lall, Stanford, 2026", "level": 3, "note": "Slides on finite and infinite horizon LQR, the Riccati recursion, and the Kalman filter."}]}, {"id": "estimation", "title": "Estimation and Kalman filters", "kind": "concept", "track": "control", "pre": ["statespace", "prob"], "frontier": false, "core": "Track a hidden state by alternating two steps: predict it forward with the model, which spreads the uncertainty, then correct it with a measurement, weighting each by its confidence. For linear models with Gaussian noise this Kalman filter is optimal; the EKF linearizes nonlinear ones.", "reach": "Navigation and headset tracking fuse IMUs with cameras or GPS this way; paired with LQR it gives LQG control.", "resources": [{"title": "How a Kalman filter works, in pictures", "url": "https://www.bzarg.com/p/how-a-kalman-filter-works-in-pictures/", "type": "blog", "by": "Tim Babb, 2015", "level": 1, "note": "The predict and update equations, derived from multiplying two Gaussians."}, {"title": "Kalman and Bayesian Filters in Python", "url": "https://github.com/rlabbe/Kalman-and-Bayesian-Filters-in-Python", "type": "book", "by": "Roger Labbe", "level": 2, "note": "Notebooks 1 to 8 build the linear Kalman filter up from a g-h filter; 9 to 12 cover nonlinear filtering, the UKF, the EKF, and particle filters."}, {"title": "Self-Driving Cars Specialization", "url": "https://www.coursera.org/specializations/self-driving-cars", "type": "course", "by": "University of Toronto, Coursera", "level": 2, "note": "Course 2, State Estimation and Localization: least squares, extended and unscented Kalman filters, and GPS, IMU, and lidar fusion."}, {"title": "State Estimation for Robotics (2nd edition)", "url": "http://asrl.utias.utoronto.ca/~tdb/bib/barfoot_ser24.pdf", "type": "book", "by": "Timothy Barfoot, 2024", "level": 3, "note": "Chapter 3 derives the Kalman filter from batch linear Gaussian estimation; Chapter 4 handles nonlinear, non-Gaussian estimation."}]}, {"id": "kinematics", "title": "Robot kinematics and dynamics", "kind": "concept", "track": "control", "pre": ["mechanics", "linalg"], "frontier": false, "core": "A robot’s pose is a rigid transform, and forward kinematics multiplies one matrix exponential per joint (the product of exponentials). The Jacobian maps joint velocities to end-effector velocity, and the dynamics take the form M(q)q’’ + c(q, q’) + g(q) = τ.", "reach": "Motion planning searches these joint spaces; control and headset tracking reuse the same rigid-body math.", "resources": [{"title": "Modern Robotics: Mechanics, Planning, and Control", "url": "https://www.coursera.org/specializations/modernrobotics", "type": "course", "by": "Kevin Lynch, Northwestern, Coursera", "level": 1, "note": "Courses 1 to 3 (foundations of robot motion, kinematics, dynamics) follow the book with graded exercises."}, {"title": "Modern Robotics", "url": "https://hades.mech.northwestern.edu/index.php/Modern_Robotics", "type": "book", "by": "Kevin Lynch, Frank Park, 2017", "level": 2, "note": "Chapters 3 to 6 and 8: rigid-body motions, forward, velocity, and inverse kinematics, and open-chain dynamics; free preprint and videos."}, {"title": "Robotic Manipulation", "url": "https://manipulation.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT", "level": 2, "note": "Chapter 3 runs spatial algebra, forward kinematics, and Jacobian-based inverse kinematics on a simulated arm in Drake."}]}, {"id": "planning", "title": "Motion planning", "kind": "concept", "track": "control", "pre": ["kinematics", "graphs"], "frontier": false, "core": "Plan in configuration space, where the robot is a single point and obstacles grow into forbidden regions. In low dimensions, search a grid with A*; in high dimensions, sample random configurations and connect collision-free ones into a tree (RRT) or a roadmap (PRM).", "reach": "Trajectory optimization refines these paths under dynamics; game engines use the same graph search for characters.", "resources": [{"title": "Introduction to the A* Algorithm", "url": "https://www.redblobgames.com/pathfinding/a-star/introduction.html", "type": "blog", "by": "Amit Patel, Red Blob Games, 2014", "level": 1, "note": "Interactive diagrams from breadth-first search to Dijkstra’s algorithm to A*."}, {"title": "Planning Algorithms", "url": "http://lavalle.pl/planning/", "type": "book", "by": "Steven LaValle, 2006", "level": 2, "note": "Chapter 4 builds configuration space and its obstacles; Chapter 5 covers sampling-based planning, RRTs, and PRMs."}, {"title": "Robotic Manipulation", "url": "https://manipulation.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT", "level": 2, "note": "Chapter 6: inverse kinematics as optimization, kinematic trajectory optimization, RRT and PRM, and graphs of convex sets for arms."}, {"title": "Sampling-based Algorithms for Optimal Motion Planning", "url": "https://arxiv.org/abs/1105.1186", "type": "paper", "by": "Karaman, Frazzoli, 2011", "level": 3, "note": "Introduces RRT* and PRM*, which converge to optimal paths as the number of samples grows."}]}, {"id": "mpc", "title": "Optimal control and MPC", "kind": "concept", "track": "control", "pre": ["statespace", "convex"], "frontier": false, "core": "At each time step, solve a finite-horizon optimal control problem from the current state, with the model and constraints written in, apply only the first input, then re-solve from the next measurement. Re-solving supplies the feedback.", "reach": "Extends LQR to constraints; powered descent guidance and legged robots solve it in real time.", "resources": [{"title": "Understanding Model Predictive Control", "url": "https://www.youtube.com/playlist?list=PLn8PRpmsu08ozoeoXgxPSBKLyd4YEHww8", "type": "video", "by": "MATLAB (Brian Douglas), 2018", "level": 1, "note": "Parts 1 to 4: why MPC, how the receding horizon works, its design parameters, and adaptive and nonlinear variants."}, {"title": "Underactuated Robotics", "url": "https://underactuated.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT, 2024", "level": 2, "note": "Chapter 7 for dynamic programming; Chapter 10 for trajectory optimization, finite-horizon LQR, and receding-horizon MPC."}, {"title": "Model Predictive Control: Theory, Computation, and Design (2nd edition)", "url": "https://sites.engineering.ucsb.edu/~jbraw/mpc/", "type": "book", "by": "Rawlings, Mayne, Diehl, 2017", "level": 3, "note": "Free PDF. Chapter 1 builds the MPC regulator, state estimation, and offset-free tracking; Chapter 2 proves stability."}]}, {"id": "cellbio", "title": "Cell and molecular biology", "kind": "concept", "track": "biosci", "pre": ["genchem"], "frontier": false, "core": "A cell stores instructions in DNA, copies them into RNA, and translates RNA into proteins that do nearly all the work. A membrane separates inside from outside, and signaling proteins sense the surroundings and switch genes on and off.", "reach": "Genetics, neuroscience, and biochemistry assume it; single-cell and protein models in machine learning are trained on its measurements.", "resources": [{"title": "MIT 7.016: Introductory Biology", "url": "https://ocw.mit.edu/courses/7-016-introductory-biology-fall-2018/", "type": "lectures", "by": "Barbara Imperiali, Adam Martin, MIT OCW, 2018", "level": 1, "note": "Video lectures on the biochemistry, molecular biology, and genetics of living systems."}, {"title": "Molecular Biology of the Cell (4th edition)", "url": "https://www.ncbi.nlm.nih.gov/books/NBK21054/", "type": "book", "by": "Alberts et al., 2002, NCBI Bookshelf", "level": 2, "note": "Chapter 1, Cells and Genomes, is the field in one chapter."}, {"title": "Cell Biology by the Numbers", "url": "http://book.bionumbers.org/", "type": "book", "by": "Ron Milo, Rob Phillips", "level": 2, "note": "Rough estimates of sizes, concentrations, energies, rates, and error rates in the cell; the engineer’s way in."}]}, {"id": "genetics", "title": "Genetics and genomics", "kind": "concept", "track": "biosci", "pre": ["cellbio", "prob"], "frontier": false, "core": "Genes come in pairs, one from each parent, and Mendel’s ratios follow from each parent passing one copy at random; genes close together on a chromosome travel together, which lets you map them. Genomics reads whole genomes and tests which variants track which traits.", "reach": "Bioinformatics supplies the algorithms and biostatistics the testing; genomic language models in machine learning read the same sequences.", "resources": [{"title": "Biology 2e", "url": "https://openstax.org/details/books/biology-2e", "type": "book", "by": "OpenStax, 2018", "level": 1, "note": "Chapters 12 and 13: Mendel’s experiments, the laws of inheritance, and linkage."}, {"title": "MIT 7.03: Genetics", "url": "https://ocw.mit.edu/courses/7-03-genetics-fall-2004/", "type": "course", "by": "Kaiser, Fink, Samson, MIT OCW, 2004", "level": 2, "note": "Lecture notes and problem sets on recombination, mutation, selection, population genetics, and gene regulation."}, {"title": "Population and Quantitative Genetics notes", "url": "https://github.com/cooplab/popgen-notes", "type": "notes", "by": "Graham Coop, UC Davis", "level": 2, "note": "Drift, selection, and heritability as probability models, with R code."}, {"title": "10 Years of GWAS Discovery: Biology, Function, and Translation", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5501872/", "type": "paper", "by": "Visscher et al., 2017", "level": 3, "note": "What a decade of genome-wide association studies found and what it is good for."}]}, {"id": "biostats", "title": "Biostatistics", "kind": "concept", "track": "biosci", "pre": ["prob"], "frontier": false, "core": "Biological measurements are noisy and samples small, so every claim is a comparison with chance: a p-value says how surprising the data would be if nothing were going on. Randomization, enough samples, and correcting for many tests decide whether that comparison means anything.", "reach": "Genetics runs millions of tests per study; the same reasoning judges a trading backtest in microstructure and any benchmark gain in machine learning.", "resources": [{"title": "Statistics for Biologists", "url": "https://www.nature.com/collections/qghhqm", "type": "notes", "by": "Nature collection, 2017", "level": 1, "note": "Short pieces on p-values, statistical power, sample size, multiple testing, and Bayesian statistics, plus the Points of Significance columns."}, {"title": "Data Analysis for the Life Sciences", "url": "https://genomicsclass.github.io/book/", "type": "book", "by": "Rafael Irizarry, Michael Love", "level": 2, "note": "Chapter 1 (inference: t-tests, power, permutation tests) and chapter 6 (inference for high-dimensional data), with R code."}, {"title": "Why Most Published Research Findings Are False", "url": "https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0020124", "type": "paper", "by": "John Ioannidis, PLOS Medicine, 2005", "level": 2, "note": "Low prior odds, small studies, and many tests make most significant findings false."}, {"title": "Statistical Rethinking", "url": "https://github.com/rmcelreath/stat_rethinking_2024", "type": "lectures", "by": "Richard McElreath, 2024", "level": 2, "note": "The Bayesian alternative: state a causal model, then fit it, with lectures and code."}, {"title": "Harvard Stat 110: Probability", "url": "https://stat110.net/", "type": "course", "by": "Joe Blitzstein, Harvard", "level": 1, "note": "The probability under every test: conditional probability, Bayes’ rule, and the central limit theorem."}]}, {"id": "bioinfo", "title": "Bioinformatics algorithms", "kind": "concept", "track": "biosci", "pre": ["genetics", "dp", "graphs"], "frontier": false, "core": "Biological questions become string and graph problems. Aligning two sequences is dynamic programming over a grid of edits, and assembling a genome from millions of short reads is finding a path through a de Bruijn graph that uses every overlap once.", "reach": "Applies dynamic programming and graph algorithms (Eulerian paths); the sequence models of the machine learning roadmap read the same data at scale.", "resources": [{"title": "Finding Hidden Messages in DNA (Bioinformatics I)", "url": "https://www.coursera.org/learn/dna-analysis", "type": "course", "by": "Pavel Pevzner, Phillip Compeau, UC San Diego, Coursera", "level": 1, "note": "Each biological question becomes an algorithm you code yourself."}, {"title": "Bioinformatics Algorithms", "url": "https://www.bioinformaticsalgorithms.org/", "type": "book", "by": "Phillip Compeau, Pavel Pevzner", "level": 2, "note": "Chapter 3 (genome assembly with de Bruijn graphs) and chapter 5 (sequence alignment by dynamic programming)."}, {"title": "Rosalind", "url": "https://rosalind.info/problems/locations/", "type": "code", "by": "Rosalind project", "level": 2, "note": "Short bioinformatics programming problems, checked automatically, arranged as a tree."}, {"title": "MIT 6.047: Computational Biology", "url": "https://ocw.mit.edu/courses/6-047-computational-biology-fall-2015/", "type": "lectures", "by": "Manolis Kellis, MIT OCW, 2015", "level": 3, "note": "The algorithmic and machine learning foundations of computational biology, out to research frontiers."}]}, {"id": "neuro", "title": "Neuroscience", "kind": "concept", "track": "biosci", "pre": ["cellbio", "diffeq"], "frontier": false, "core": "A neuron is an electrical circuit: ion channels in its membrane pass current, and when the voltage crosses a threshold it fires a spike (the Hodgkin-Huxley model). Synapses that strengthen when their neurons fire together let networks of spiking neurons store memories and compute.", "reach": "The origin of artificial neural networks; Hodgkin-Huxley is a nonlinear ODE system, studied with the tools of diffeq and control.", "resources": [{"title": "Neuromatch Academy", "url": "https://neuromatch.io/courses/", "type": "course", "by": "Neuromatch, free materials", "level": 1, "note": "The Computational Neuroscience course: models of neurons and networks in Python notebooks."}, {"title": "Neuronal Dynamics", "url": "https://neuron
