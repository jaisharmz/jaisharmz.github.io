<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science and Engineering Roadmap</title>
<script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<meta name="description" content="A prerequisite graph of science and engineering beyond machine learning, from algorithms, operating systems and cryptography to physics, chemistry, fluids, rocketry, control and finance, with verified resources for every idea.">
<style>
/* Layout: a compact header, then the map fills the viewport; a panel slides in from the right
   (a bottom sheet on phones). Colors: the site's paper and ink, plus six track families. */
:root {
  color-scheme: light;
  --paper: #ffffff; --sunk: #f6f5f2; --card: #ffffff;
  --ink: #1b1b1d; --ink-2: #4a4a50; --muted: #70707a; --rule: #e4e3de; --rule-soft: #efeeea;
  --accent: #1a4f8c; --accent-soft: #e6eef8;
  --edge: #b9b8b2; --edge-x: #d8d7d2;
  --f-0: #8a8983; --f-1: #2a78d6; --f-2: #eb6834; --f-3: #1baf7a;
  --f-4: #eda100; --f-5: #e87ba4; --f-6: #008300; --f-7: #6250d6; --f-8: #e34948;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #16161a; --sunk: #1c1c21; --card: #212127;
    --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
    --accent: #7fb2e3; --accent-soft: #1d2b3b;
    --edge: #5d5d66; --edge-x: #3d3d45;
    --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
    --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #16161a; --sunk: #1c1c21; --card: #212127;
  --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
  --accent: #7fb2e3; --accent-soft: #1d2b3b;
  --edge: #5d5d66; --edge-x: #3d3d45;
  --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
  --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }

/* header */
header { flex: none; border-bottom: 1px solid var(--rule); padding-block: .7rem .6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.2rem; align-items: end; }
.crumb { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .25rem; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.25rem, 2.6vw, 1.7rem); line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.lede { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; margin: .3rem 0 0; max-width: 62rem; }
.tools { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.search { position: relative; }
.search input { width: 15rem; max-width: 100%; font: .9rem var(--sans); color: var(--ink); background: var(--sunk); border: 1px solid var(--rule);
  border-radius: 8px; padding: .45rem .7rem; }
.results { position: absolute; right: 0; top: calc(100% + 4px); width: min(24rem, 86vw); max-height: 60vh; overflow: auto; z-index: 40;
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); padding: .3rem; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: .45rem .55rem; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--sunk); }
.results .rt { font-weight: 600; font-size: .88rem; }
.results .rm { font-size: .76rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: .42rem .75rem; font-size: .85rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.totals { font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem .35rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; color: var(--ink-2); background: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: .18rem .55rem; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* map */
main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sunk); touch-action: none; cursor: grab; }
main.dragging { cursor: grabbing; }
main[hidden] { display: none !important; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }
.e { fill: none; stroke: var(--edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.e.x { stroke: var(--edge-x); stroke-width: 1.2; display: none; }
main.all-links .e.x, .e.x.hot { display: inline; }
.e.hot { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.e.dim { opacity: .18; }
.track { position: absolute; z-index: 0; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper); }
.track .tl { position: absolute; left: 14px; top: 9px; display: flex; gap: .45rem; align-items: center;
  font-family: var(--mono); font-size: clamp(11px, calc(9px * var(--inv, 1)), 17px); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
.track .tl .dot { width: 8px; height: 8px; }
.node { position: absolute; z-index: 2; display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--rule);
  border-top: 3px solid var(--c); border-radius: 8px; padding: 5px 8px 6px; cursor: pointer; overflow: hidden;
  box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.node:hover { box-shadow: 0 3px 10px rgb(0 0 0 / .12); border-color: var(--muted); border-top-color: var(--c); }
.node .k { display: flex; justify-content: space-between; gap: 4px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.node .k .fr { color: var(--ink-2); }
.node .t { font-size: 12.5px; font-weight: 600; line-height: 1.22; color: var(--ink); margin-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .p { margin-top: auto; height: 3px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.node .p i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 2px; }
.node.done { background: color-mix(in srgb, var(--c) 9%, var(--card)); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); border-top-color: var(--c); }
.node.anc { border-color: var(--accent); }
.node.dim { opacity: .3; }
.node.hit { box-shadow: 0 0 0 3px var(--accent); }
.zoom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-size: 1.05rem; line-height: 1; }
.zoom button.w { width: auto; padding: 0 .55rem; font-size: .75rem; }
.zoom button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 180px; z-index: 5;
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 6px; cursor: pointer; }
.mini svg { display: block; width: 100%; height: auto; }
.mini .vp { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 18; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 4; font-size: .76rem; color: var(--muted);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .75rem; white-space: nowrap; }

/* track map */
.tview { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--sunk); }
.tview[hidden] { display: none !important; }
.tscroll { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 12px; }
.tsize { margin: auto; position: relative; flex: none; }
.tworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tworld svg.edges { z-index: 1; }
.te { fill: none; stroke: var(--edge); vector-effect: non-scaling-stroke; }
.te.hot { stroke: var(--accent); }
.te.dim { opacity: .2; }
.tnode { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--card);
  border: 1px solid var(--rule); border-top: 4px solid var(--c); border-radius: 10px; padding: 9px 12px 10px; cursor: pointer;
  box-shadow: 0 1px 3px rgb(0 0 0 / .06); transition: opacity .15s, box-shadow .15s; overflow: hidden; }
.tnode:hover { box-shadow: 0 4px 14px rgb(0 0 0 / .13); border-color: var(--muted); border-top-color: var(--c); }
.tnode .tk { display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tnode .tt { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.15; color: var(--ink); }
.tnode .tc { font-family: var(--serif); font-size: 12.5px; line-height: 1.32; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tnode .p { margin-top: auto; height: 4px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; flex: none; }
.tnode .p i { display: block; height: 100%; width: 0; background: var(--c); }
.tnode.sel { box-shadow: 0 0 0 2px var(--accent); }
.tnode.anc { border-color: var(--accent); border-top-color: var(--c); }
.tnode.dim { opacity: .32; }
.thint { flex: none; margin: 0; padding: .5rem 16px .7rem; text-align: center; font-size: .8rem; color: var(--muted); }
.narrow .tnode { padding: 7px 9px 8px; }
.narrow .tnode .tt { font-size: 14.5px; }
.narrow .tnode .tc { font-size: 11.5px; -webkit-line-clamp: 2; }
.primary { display: inline-flex; align-items: center; gap: .4rem; margin: .2rem 0 .2rem; font-size: .86rem; font-weight: 600; color: var(--paper);
  background: var(--ink); border: 0; border-radius: 8px; padding: .5rem .85rem; cursor: pointer; }
.tlinks { font-size: .86rem; color: var(--ink-2); line-height: 1.5; margin: 0; }
.ideas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.ideas li button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .8rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .55rem .1rem; cursor: pointer; }
.ideas li button:hover { background: var(--sunk); }
.ideas .it { font-weight: 600; font-size: .9rem; }
.ideas .ik { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .35rem; font-weight: 400; }
.ideas .ip { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* list */
.list { flex: 1; min-height: 0; overflow: auto; background: var(--paper); }
.list[hidden] { display: none !important; }
.list .in { max-width: 54rem; margin: 0 auto; padding-block: 1.2rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list h2 { display: flex; gap: .5rem; align-items: center; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; margin: 2rem 0 .4rem; padding-bottom: .45rem; border-bottom: 1px solid var(--rule); }
.list h2:first-child { margin-top: .4rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .75rem .2rem; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row .rt { font-weight: 600; font-size: .98rem; }
.row .rk { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .4rem; font-weight: 400; }
.row .rc { grid-column: 1; font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.row .rp { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* panel */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .25); z-index: 49; }
.scrim[hidden] { display: none !important; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(31rem, 100%); z-index: 50; background: var(--card);
  border-left: 1px solid var(--rule); box-shadow: -12px 0 40px rgb(0 0 0 / .12); overflow: auto; overscroll-behavior: contain;
  padding-block: calc(1.1rem + env(safe-area-inset-top, 0px)) calc(2.5rem + env(safe-area-inset-bottom, 0px));
  padding-left: 1.4rem; padding-right: max(1.4rem, env(safe-area-inset-right, 0px)); }
aside[hidden] { display: none !important; }
.close { position: sticky; top: 0; float: right; width: 32px; height: 32px; margin: -.2rem -.4rem 0 0; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--card); cursor: pointer; font-size: 1.1rem; line-height: 1; z-index: 2; }
.pk { display: flex; flex-wrap: wrap; gap: .35rem .6rem; align-items: center; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.badge { border: 1px solid var(--rule); border-radius: 4px; padding: .05rem .35rem; color: var(--ink-2); }
aside h2 { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1.15; margin: 0 2.2rem .7rem 0; text-wrap: balance; }
.prog { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--c); }
.core { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; margin: 0 0 .6rem; }
.reach { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: 0 0 1.1rem; }
.sec { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.3rem 0 .5rem; }
.links { display: flex; flex-wrap: wrap; gap: .35rem; }
.links button { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: .25rem .5rem; cursor: pointer; text-align: left; }
.links button:hover { border-color: var(--muted); }
.links .none { font-size: .85rem; color: var(--muted); }
.path { font-size: .8rem; color: var(--muted); margin: .45rem 0 0; }
.res { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.res li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .1rem .65rem; padding: .7rem 0; border-bottom: 1px solid var(--rule-soft); }
.res input { width: 1.05rem; height: 1.05rem; margin: .2rem 0 0; accent-color: var(--accent); cursor: pointer; }
.res .rn a { font-weight: 600; font-size: .93rem; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.res .rn a:hover { border-bottom-color: var(--accent); }
.res .rb { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
.res .note { font-family: var(--serif); font-size: .9rem; color: var(--ink-2); margin-top: .2rem; line-height: 1.4; }
.res li.ok .rn a { color: var(--muted); }
.lv { align-self: start; font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: .12rem .4rem; white-space: nowrap; }
.lv1 { color: var(--accent); background: var(--accent-soft); }
.lv2 { color: var(--ink-2); background: var(--rule-soft); }
.lv3 { color: var(--paper); background: var(--ink-2); }
.foot { font-size: .8rem; color: var(--muted); margin-top: 1.4rem; line-height: 1.5; }
.about { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.55; }
.about p { margin: 0 0 .7rem; }

@media (max-width: 720px) {
  header { grid-template-columns: minmax(0, 1fr); }
  .tools { justify-content: flex-start; }
  .search { flex: 1 1 10rem; }
  .search input { width: 100%; }
  .lede { display: none; }
  .legend { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .mini { display: none; }
  .hint { display: none; }
  aside { top: auto; left: 0; width: 100%; height: 86%; border-left: 0; border-top: 1px solid var(--rule); border-radius: 16px 16px 0 0;
    padding-left: max(1.1rem, env(safe-area-inset-left, 0px)); padding-right: max(1.1rem, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <p class="crumb"><a href="../../">Jai Sharma</a> · <a href="../../#ai-writing">AI writing</a> · <a href="../ml-research-roadmap/">Machine learning</a> · <a href="../mathematics-roadmap/">Mathematics</a></p>
      <h1>Science and Engineering Roadmap</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Find an idea, paper or course" aria-label="Find an idea, paper or course" autocomplete="off" aria-controls="results" aria-expanded="false">
        <div class="results" id="results" role="listbox" hidden></div>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="v-tracks" aria-pressed="true">Tracks</button><button id="v-map" aria-pressed="false">Map</button><button id="v-list" aria-pressed="false">List</button><button id="v-about" aria-pressed="false">About</button>
      </div>
      <span class="totals" id="totals"></span>
    </div>
    <nav class="legend" id="legend" aria-label="Jump to a track"></nav>
  </header>
  <section class="tview" id="tracks" aria-label="Track map">
    <div class="tscroll" id="tscroll"><div class="tsize" id="tsize"><div class="tworld" id="tworld"><svg class="edges" id="tedges" aria-hidden="true"></svg></div></div></div>
    <p class="thint" id="thint"></p>
  </section>
  <main id="map" aria-label="Prerequisite map" hidden>
    <div class="world" id="world"><svg class="edges" id="edges" aria-hidden="true"></svg></div>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" class="w" aria-label="Show the whole map">All</button>
      <button id="zlinks" class="w" aria-pressed="false" title="Show the arrows between tracks">Links</button>
    </div>
    <div class="mini" id="mini" aria-label="Overview; click to move there" role="img"></div>
    <div class="hint" id="hint">Drag to move · pinch or ctrl+scroll to zoom · click an idea</div>
  </main>
  <section class="list" id="list" hidden><div class="in" id="listin"></div></section>

<script>
const DATA = {"tracks": [{"id": "math", "label": "Math foundations", "family": 0, "core": "Calculus, linear algebra, proofs, differential equations, probability, and the numerical methods that compute them."}, {"id": "algo", "label": "Algorithms", "family": 1, "core": "Data structures and the algorithm design patterns behind interviews and competitive programming."}, {"id": "theory", "label": "Theory of computation", "family": 1, "core": "What computers can and cannot do, and how hard problems are: automata, computability, and complexity."}, {"id": "hardware", "label": "Circuits and hardware", "family": 3, "core": "From circuits and logic gates to chips, embedded systems, PCBs, signals, and radio."}, {"id": "physics", "label": "Physics", "family": 5, "core": "Mechanics, electromagnetism, thermodynamics, quantum mechanics, and relativity, the laws under every engineering track."}, {"id": "or", "label": "Optimization and game theory", "family": 7, "core": "Choose the best action under constraints, alone or against others: linear, convex and integer programs, stochastic processes, and games."}, {"id": "lowlevel", "label": "Computer systems", "family": 2, "core": "How a program becomes electrons: architecture, C and assembly, compilers, operating systems, and networks."}, {"id": "chem", "label": "Chemistry", "family": 5, "core": "Atoms, bonds and reactions, from general and organic chemistry to physical and computational chemistry."}, {"id": "fluids", "label": "Fluids and structures", "family": 6, "core": "How fluids flow and structures bend and vibrate, and how to simulate both."}, {"id": "quant", "label": "Quantitative finance", "family": 7, "core": "Price risk with probability: options, stochastic calculus, portfolios, and how markets trade."}, {"id": "software", "label": "Software and distributed systems", "family": 2, "core": "Build software that many people use: web apps, engineering practice, databases, and systems that span many machines."}, {"id": "control", "label": "Control and robotics", "family": 6, "core": "Make a system do what you want despite noise: feedback, state space, estimation, and robot motion."}, {"id": "biosci", "label": "Biology and neuroscience", "family": 8, "core": "Cells, genes and brains, with the statistics and algorithms used to study them."}, {"id": "security", "label": "Security and hacking", "family": 4, "core": "Break systems to learn how to defend them: the web, binaries, networks, reconnaissance, and capture the flag."}, {"id": "crypto", "label": "Cryptography and blockchain", "family": 4, "core": "Keep secrets and prove things with math: ciphers, public keys, zero knowledge, blockchains, and post-quantum schemes."}, {"id": "aero", "label": "Aerospace and rocketry", "family": 6, "core": "Fly and go to space: aerodynamics, propulsion, orbits, attitude, and guidance."}, {"id": "graphics", "label": "Graphics, games and VR", "family": 1, "core": "Draw worlds on a screen: rasterization, ray tracing, simulation, game engines, and virtual reality."}], "nodes": [{"id": "calc", "title": "Single and multivariable calculus", "kind": "concept", "track": "math", "pre": [], "frontier": false, "core": "A derivative is the best linear approximation to a function near a point, and an integral adds up many small pieces; the fundamental theorem says each undoes the other. In several variables the derivative becomes a gradient or a Jacobian matrix.", "reach": "Under every other node: differential equations and PDEs, gradients in convex optimization, and the divergence and Stokes theorems that electromagnetism and fluid mechanics rest on.", "resources": [{"title": "Essence of calculus", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDMsr9K-rj53DwVRMYO3t5Yr", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2017", "level": 1, "note": "Derivatives, the chain rule, integrals, and Taylor series rebuilt from pictures before formulas."}, {"title": "MIT 18.01SC: Single Variable Calculus", "url": "https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/", "type": "course", "by": "David Jerison, MIT OCW, 2010", "level": 2, "note": "Built for self-study: lecture and recitation videos with problem sets in five units, from derivatives to Taylor series."}, {"title": "MIT 18.02SC: Multivariable Calculus", "url": "https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/", "type": "course", "by": "Denis Auroux, MIT OCW, 2010", "level": 2, "note": "Units 2 to 4: partial derivatives and Lagrange multipliers, double and line integrals with Green’s theorem, then flux, divergence, and Stokes’ theorems."}, {"title": "MIT 18.S096: Matrix Calculus for Machine Learning and Beyond", "url": "https://ocw.mit.edu/courses/18-s096-matrix-calculus-for-machine-learning-and-beyond-january-iap-2023/", "type": "course", "by": "Alan Edelman, Steven G. Johnson, MIT OCW, 2023", "level": 3, "note": "Derivatives as linear maps on any vector space, including derivatives of matrix functions and factorizations, and how to compute them at scale."}, {"title": "Vector Calculus for Engineers", "url": "https://www.coursera.org/learn/vector-calculus-engineers", "type": "course", "by": "Jeffrey Chasnov, HKUST, Coursera", "level": 2, "note": "A shorter alternative to 18.02SC aimed at physics and engineering: vectors, differentiation, curvilinear coordinates, line and surface integrals, and the fundamental theorems."}]}, {"id": "linalg", "title": "Linear algebra", "kind": "concept", "track": "math", "pre": [], "frontier": false, "core": "A matrix is a linear map that keeps lines straight and the origin fixed. Elimination solves Ax = b, eigenvectors are the directions the map only stretches, and the SVD writes any matrix as a rotation, a stretch along axes, and another rotation.", "reach": "The language of differential equations, numerical methods, linear programming, quantum mechanics, state-space control, and the transforms in raster graphics.", "resources": [{"title": "Essence of linear algebra", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2016", "level": 1, "note": "Matrices as transformations of space, determinants as area scaling, change of basis, and eigenvectors, all drawn."}, {"title": "MIT 18.06: Linear Algebra", "url": "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", "type": "course", "by": "Gilbert Strang, MIT OCW, 2010", "level": 2, "note": "From elimination through the four fundamental subspaces to least squares, eigenvalues, and the SVD, with problem sets and exams."}, {"title": "MIT 18.065: Matrix Methods in Data Analysis, Signal Processing, and Machine Learning", "url": "https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/", "type": "course", "by": "Gilbert Strang, MIT OCW, 2018", "level": 2, "note": "Strang’s follow-on course built around the SVD: low-rank approximation, least squares, and the matrix methods of data analysis."}, {"title": "Linear Algebra Done Right", "url": "https://linear.axler.net/", "type": "book", "by": "Sheldon Axler, 4th edition, 2024", "level": 3, "note": "The proof-based course, free from the author. Chapters 5 to 7 build eigenvalues, inner product spaces, the spectral theorem, and the SVD from linear operators."}]}, {"id": "proofs", "title": "Proofs and discrete math", "kind": "concept", "track": "math", "pre": [], "frontier": false, "core": "A proof is a chain of steps, each forced by definitions or earlier steps, that leads from assumptions to a claim. A few templates (direct, contrapositive, contradiction, and induction) carry most of discrete math: counting, graphs, modular arithmetic, and algorithm correctness.", "reach": "The way into analysis, automata, and data structures, and into the number theory under cryptography.", "resources": [{"title": "Book of Proof", "url": "https://richardhammack.github.io/BookOfProof/", "type": "book", "by": "Richard Hammack, 3rd edition, 2018", "level": 1, "note": "Chapters 4 to 10 cover direct proof, contrapositive, contradiction, disproof, and induction, one method at a time."}, {"title": "Mathematics for Computer Science", "url": "https://courses.csail.mit.edu/6.042/spring18/mcs.pdf", "type": "book", "by": "Eric Lehman, Tom Leighton, Albert Meyer, 2018", "level": 2, "note": "The free text of MIT 6.042: Part I on proofs and induction, Part II on graphs, Part III on counting, and Part IV on probability."}, {"title": "Berkeley CS 70: Discrete Mathematics and Probability Theory", "url": "https://www.eecs70.org/", "type": "course", "by": "UC Berkeley, current offering", "level": 2, "note": "Course notes from proof techniques and induction through modular arithmetic, RSA, polynomials, graphs, stable matching, and countability, then counting and probability."}]}, {"id": "diffeq", "title": "Ordinary differential equations", "kind": "concept", "track": "math", "pre": ["calc", "linalg"], "frontier": false, "core": "An ordinary differential equation gives a rate of change, dx/dt = f(x), and asks for the trajectory. Linear systems are solved through eigenvalues, each mode growing or decaying like e^(lambda t); nonlinear ones are read from phase portraits of fixed points, stability, and limit cycles.", "reach": "The model behind mechanics, circuits, classical control, and neuron models; numerics steps it forward in time.", "resources": [{"title": "Differential equations", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDNPOjrT6KVlfJuKtYTftqH6", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2019 to 2025", "level": 1, "note": "DE1 reads a pendulum’s motion from its phase space; DE6 and the Laplace transform videos cover linear equations. DE2 to DE4 belong to pde."}, {"title": "MIT 18.03: Differential Equations", "url": "https://ocw.mit.edu/courses/18-03-differential-equations-spring-2010/", "type": "course", "by": "Arthur Mattuck, Haynes Miller, MIT OCW, 2010", "level": 2, "note": "Lectures 1 to 14 cover first and second order linear equations up to resonance; Lectures 24 to 33 cover linear systems, matrix exponentials, and nonlinear phase portraits."}, {"title": "Nonlinear Dynamics and Chaos", "url": "https://www.youtube.com/playlist?list=PLbN57C5Zdl6j_qJA-pARJnKsmROzPnO9V", "type": "lectures", "by": "Steven Strogatz, Cornell, 2014", "level": 2, "note": "Flows on the line and the plane, fixed points, limit cycles, the van der Pol oscillator, bifurcations, and the chaotic waterwheel."}, {"title": "Learn Differential Equations: Up Close with Gilbert Strang and Cleve Moler", "url": "https://ocw.mit.edu/courses/res-18-009-learn-differential-equations-up-close-with-gilbert-strang-and-cleve-moler-fall-2015/", "type": "video", "by": "Gilbert Strang, Cleve Moler, MIT OCW, 2015", "level": 1, "note": "Short videos in two strands: differential equations with their linear algebra, and solving ODEs in MATLAB."}]}, {"id": "prob", "title": "Probability and statistics", "kind": "concept", "track": "math", "pre": ["calc"], "frontier": false, "core": "Probability assigns numbers to uncertain events that add up correctly; conditioning updates them on evidence through Bayes’ rule. Expectation and the limit theorems explain why averages settle down, and statistics runs the logic backward, from observed data to the process behind it.", "reach": "Needed by stochastic processes, randomized algorithms, estimation, thermodynamics, options, and the Monte Carlo integration in ray tracing.", "resources": [{"title": "Harvard Stat 110: Probability", "url": "https://stat110.net/", "type": "lectures", "by": "Joe Blitzstein, Harvard, 2013", "level": 1, "note": "Lecture videos, practice problems with solutions, and handouts, built on the free Blitzstein and Hwang textbook."}, {"title": "MIT 18.650: Statistics for Applications", "url": "https://ocw.mit.edu/courses/18-650-statistics-for-applications-fall-2016/", "type": "course", "by": "Philippe Rigollet, MIT OCW, 2016", "level": 2, "note": "The statistics half: maximum likelihood, hypothesis tests, regression, Bayesian statistics, PCA, and generalized linear models, with lecture videos."}, {"title": "Statistical Rethinking 2024", "url": "https://github.com/rmcelreath/stat_rethinking_2024", "type": "lectures", "by": "Richard McElreath, 2024", "level": 2, "note": "Bayesian data analysis organized around causal models, through multilevel models and MCMC, with a full lecture playlist."}, {"title": "High-Dimensional Probability", "url": "https://www.math.uci.edu/~rvershyn/papers/HDP-book/HDP-book.html", "type": "book", "by": "Roman Vershynin, 2nd edition, 2026", "level": 3, "note": "Chapters 2 and 3: concentration of sums and random vectors in high dimensions, the tools that randomized algorithms rely on."}]}, {"id": "analysis", "title": "Real analysis", "kind": "concept", "track": "math", "pre": ["proofs", "calc"], "frontier": false, "core": "Real analysis rebuilds calculus on proof. A limit means that for every tolerance epsilon some delta works, and the real numbers have no gaps; from those two facts follow continuity, the mean value theorem, the integral, and the rules for when limits can be swapped.", "reach": "The rigor under PDEs and Fourier series, the measure theory behind stochastic calculus, and convergence proofs in numerical methods and convex optimization.", "resources": [{"title": "MIT 18.100A: Real Analysis", "url": "https://ocw.mit.edu/courses/18-100a-real-analysis-fall-2020/", "type": "course", "by": "Casey Rodriguez, MIT OCW, 2020", "level": 1, "note": "Lectures 1 to 12 build the real numbers, sequences, and series; Lectures 13 to 25 cover continuity, derivatives, the Riemann integral, and uniform convergence."}, {"title": "Basic Analysis: Introduction to Real Analysis", "url": "https://www.jirka.org/ra/", "type": "book", "by": "Jiří Lebl, version 6.3, 2026", "level": 2, "note": "Free text from the real line through continuity, the derivative, and the Riemann integral, then metric spaces in Chapter 7; Volume II goes to several variables."}, {"title": "Understanding Analysis", "url": "https://link.springer.com/book/10.1007/978-1-4939-2712-8", "type": "book", "by": "Stephen Abbott, 2nd edition, 2015", "level": 2, "note": "Slower and more motivated than the standard texts; Section 1.1 opens with why the square root of 2 is irrational.", "paid": true}]}, {"id": "pde", "title": "Partial differential equations and Fourier analysis", "kind": "concept", "track": "math", "pre": ["diffeq"], "frontier": false, "core": "A partial differential equation links rates of change in space and time, like the heat equation u_t = u_xx. Fourier’s idea solves the linear ones: split the starting state into sine waves, let each evolve on its own, and add them back up.", "reach": "Fourier modes return in quantum mechanics, fluid mechanics, heat transfer, signals, and Black-Scholes; finite elements and CFD discretize these equations.", "resources": [{"title": "But what is a Fourier series? From heat flow to drawing with circles | DE4", "url": "https://www.youtube.com/watch?v=r6sGWTCMz2k", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2019", "level": 1, "note": "Twenty-five minutes from the heat equation to Fourier series; DE2 and DE3 in the same series set up the equation itself."}, {"title": "MIT 18.303: Linear Partial Differential Equations: Analysis and Numerics", "url": "https://ocw.mit.edu/courses/18-303-linear-partial-differential-equations-analysis-and-numerics-fall-2014/", "type": "course", "by": "Steven G. Johnson, MIT OCW, 2014", "level": 2, "note": "Heat, wave, and Poisson equations treated like matrix problems: eigenfunctions, separation of variables, and Green’s functions, then finite differences and finite elements in Julia."}, {"title": "Fourier Analysis [Data-Driven Science and Engineering]", "url": "https://www.youtube.com/playlist?list=PLMrJAkhIeNNT_Xh3Oy0Y4LTj0Oxo8GqsC", "type": "video", "by": "Steve Brunton, 2020", "level": 2, "note": "Fourier series as projection onto an orthogonal basis, the Fourier transform, solving the heat equation with it, and the discrete transform, with MATLAB and Python code."}, {"title": "Partial Differential Equations: An Introduction", "url": "https://www.wiley.com/en-us/Partial+Differential+Equations%3A+An+Introduction%2C+2nd+Edition-p-9780470054567", "type": "book", "by": "Walter Strauss, 2nd edition, 2007", "level": 2, "note": "The standard undergraduate text, centered on the wave, heat, and Laplace equations with little jargon.", "paid": true}]}, {"id": "numerics", "title": "Numerical methods", "kind": "concept", "track": "math", "pre": ["diffeq", "linalg"], "frontier": false, "core": "Numerical methods replace continuous math with finite arithmetic: derivatives become differences, integrals become sums, and equations become linear systems solved by factorization or iteration. Each method trades accuracy for cost, and analysis asks how fast its error shrinks and whether rounding errors grow.", "reach": "The engine inside finite element, CFD and quantum chemistry codes, and physics simulation for graphics.", "resources": [{"title": "Fundamentals of Numerical Computation", "url": "https://fncbook.com/", "type": "book", "by": "Tobin Driscoll, Richard Braun, SIAM 2017, free online edition", "level": 1, "note": "Chapters 2 to 6: linear systems, least squares, root finding, interpolation, and ODE initial value problems; Chapters 10 to 13 move to boundary value problems and PDEs. Code in Julia, MATLAB, or Python."}, {"title": "Computational Methods for Engineers", "url": "https://empossible.net/academics/emp4301_5301/", "type": "lectures", "by": "Raymond Rumpf, UTEP, 2023", "level": 1, "note": "Lecture videos and notes from errors in computation through linear solvers, root finding, curve fitting, numerical integration, and the finite-difference method."}, {"title": "What Every Computer Scientist Should Know About Floating-Point Arithmetic", "url": "https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html", "type": "paper", "by": "David Goldberg, 1991", "level": 2, "note": "Rounding, relative error, and catastrophic cancellation: the failure modes every numerical code inherits."}, {"title": "MIT 18.335J: Introduction to Numerical Methods", "url": "https://ocw.mit.edu/courses/18-335j-introduction-to-numerical-methods-spring-2019/", "type": "course", "by": "Steven G. Johnson, MIT OCW, 2019", "level": 3, "note": "Graduate numerical linear algebra: floating point, conditioning, backward stability, and dense and iterative solvers for linear systems and eigenproblems."}]}, {"id": "ds", "title": "Data structures and complexity analysis", "kind": "concept", "track": "algo", "pre": ["proofs"], "frontier": false, "core": "A data structure arranges data so a program’s frequent operations are fast; asymptotic analysis counts how running time grows with input size. Arrays, hash tables, heaps, and balanced search trees each make some operations cheap, such as lookup, minimum, or ordered search, and others costly.", "reach": "Every other algorithms node builds on it, and so do the indexes inside databases.", "resources": [{"title": "MIT 6.006: Introduction to Algorithms", "url": "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/", "type": "course", "by": "Erik Demaine, Jason Ku, Justin Solomon, MIT OCW, 2020", "level": 1, "note": "Lectures 1 to 8: asymptotic analysis, dynamic arrays, sorting, hashing, binary trees with AVL balancing, and binary heaps."}, {"title": "Algorithms, Part I", "url": "https://www.coursera.org/learn/algorithms-part1", "type": "course", "by": "Robert Sedgewick, Kevin Wayne, Princeton, Coursera", "level": 2, "note": "Java implementations of union-find, sorting, priority queues, balanced search trees, and hash tables, backed by the algs4 booksite."}, {"title": "Introduction to Algorithms, 4th edition", "url": "https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/", "type": "book", "by": "Cormen, Leiserson, Rivest, Stein, MIT Press, 2022", "level": 3, "note": "The reference: look up a structure, its analysis, or its proof here rather than reading straight through.", "paid": true}]}, {"id": "graphs", "title": "Graph algorithms", "kind": "concept", "track": "algo", "pre": ["ds"], "frontier": false, "core": "Model a problem as vertices and edges, and a few algorithms answer it: breadth-first and depth-first search for reachability and ordering, Dijkstra and Bellman-Ford for shortest paths, greedy rules for spanning trees, and augmenting paths for maximum flow.", "reach": "Behind motion planning, network routing, dependency ordering in compilers, advanced data structures, and the reductions in complexity theory.", "resources": [{"title": "MIT 6.006: Introduction to Algorithms", "url": "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/", "type": "course", "by": "Erik Demaine, Jason Ku, Justin Solomon, MIT OCW, 2020", "level": 1, "note": "Lectures 9 to 14: breadth-first and depth-first search, then Bellman-Ford, Dijkstra, and all-pairs shortest paths with Johnson’s algorithm."}, {"title": "Algorithms", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/", "type": "book", "by": "Jeff Erickson, 2019", "level": 2, "note": "Chapters 5 to 11: graph search, depth-first search, minimum spanning trees, shortest paths, all-pairs shortest paths, and maximum flow with its applications."}, {"title": "Algorithms, Part II", "url": "https://www.coursera.org/learn/algorithms-part2", "type": "course", "by": "Robert Sedgewick, Kevin Wayne, Princeton, Coursera", "level": 2, "note": "Working Java code for undirected and directed graphs, minimum spanning trees, shortest paths, and max flow."}, {"title": "CS261: A Second Course in Algorithms", "url": "http://timroughgarden.org/w16/w16.html", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2016", "level": 3, "note": "Lectures 1 to 6 go deep on flows: Edmonds-Karp, Dinic, push-relabel, applications, and min-cost matching, with a video and notes for each."}]}, {"id": "dp", "title": "Dynamic programming", "kind": "concept", "track": "algo", "pre": ["ds"], "frontier": false, "core": "Dynamic programming solves a problem from the answers to its smaller subproblems, storing each answer so it is computed once. The hard part is choosing the subproblems and the recurrence linking them; filling a table in the right order, or memoized recursion, does the rest.", "reach": "The same recurrences align sequences, drive Bellman equations in optimal control, and parse grammars in compilers.", "resources": [{"title": "MIT 6.006: Introduction to Algorithms", "url": "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/", "type": "course", "by": "Erik Demaine, Jason Ku, Justin Solomon, MIT OCW, 2020", "level": 1, "note": "Lectures 15 to 18 teach SRTBOT, a recipe for any DP (subproblems, relate, topological order, base cases, original problem, time), on LCS, LIS, coins, and subset sum."}, {"title": "Dynamic Programming (Chapter 3 of Algorithms)", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/book/03-dynprog.pdf", "type": "book", "by": "Jeff Erickson, 2019", "level": 2, "note": "From memoization to longest increasing subsequence, edit distance, subset sum, optimal binary search trees, and DP on trees, with exercises."}, {"title": "Educational DP Contest", "url": "https://atcoder.jp/contests/dp", "type": "tutorial", "by": "AtCoder, 2019", "level": 2, "note": "Twenty-six judged problems, Frog 1 to Frog 3: knapsack, LCS, DAG paths, intervals, bitmasks, trees, digits, and matrix powers."}, {"title": "Divide and Conquer DP", "url": "https://cp-algorithms.com/dynamic_programming/divide-and-conquer-dp.html", "type": "notes", "by": "cp-algorithms", "level": 3, "note": "Speeds up recurrences whose best split point moves monotonically; the Knuth optimization article beside it is the companion."}]}, {"id": "greedy", "title": "Greedy and divide and conquer", "kind": "concept", "track": "algo", "pre": ["ds"], "frontier": false, "core": "A greedy algorithm commits to the choice that looks best now and never revisits it; an exchange argument shows this is safe. Divide and conquer splits a problem into smaller copies, solves them recursively, and combines the results; the master theorem gives its running time.", "reach": "Greedy rules give minimum spanning trees and Huffman codes; divide and conquer gives mergesort, fast multiplication, and the FFT behind signals.", "resources": [{"title": "Divide and Conquer, Sorting and Searching, and Randomized Algorithms", "url": "https://www.coursera.org/learn/algorithms-divide-conquer", "type": "course", "by": "Tim Roughgarden, Stanford, Coursera", "level": 1, "note": "Merge sort, Karatsuba multiplication, the master method, closest pair, and the randomized analysis of QuickSort."}, {"title": "Greedy Algorithms, Minimum Spanning Trees, and Dynamic Programming", "url": "https://www.coursera.org/learn/algorithms-greedy", "type": "course", "by": "Tim Roughgarden, Stanford, Coursera", "level": 1, "note": "Greedy scheduling, Prim and Kruskal, clustering, and Huffman codes, then a first look at DP with knapsack and sequence alignment."}, {"title": "Algorithms", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/", "type": "book", "by": "Jeff Erickson, 2019", "level": 2, "note": "Chapter 1 (Recursion) covers divide and conquer and solving recurrences; Chapter 4 (Greedy Algorithms) proves greedy choices correct with exchange arguments."}, {"title": "MIT 6.046J: Design and Analysis of Algorithms", "url": "https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/", "type": "course", "by": "Erik Demaine, Srini Devadas, Nancy Lynch, MIT OCW, 2015", "level": 2, "note": "Lectures 1 to 3 and 12: interval scheduling, convex hull, median finding, the FFT, and minimum spanning trees."}]}, {"id": "advds", "title": "Advanced data structures", "kind": "concept", "track": "algo", "pre": ["graphs"], "frontier": false, "core": "Precompute structure so each query is cheap. A segment tree or Fenwick tree answers range sums under updates in logarithmic time, union-find merges sets in nearly constant time, and augmented balanced trees answer order statistics; the mix of queries picks the structure.", "reach": "The toolkit competitive programming leans on; union-find drives Kruskal’s algorithm, and range trees and kd-trees serve graphics and motion planning.", "resources": [{"title": "Competitive Programmer’s Handbook", "url": "https://cses.fi/book/book.pdf", "type": "book", "by": "Antti Laaksonen, 2018", "level": 1, "note": "Chapter 9 (static queries, binary indexed trees, segment trees), Section 15.2 (union-find), and Chapter 28 (lazy propagation and dynamic trees)."}, {"title": "Point Update Range Sum (USACO Guide, Gold)", "url": "https://usaco.guide/gold/PURS", "type": "tutorial", "by": "USACO Guide", "level": 2, "note": "Segment trees and binary indexed trees with code and graded practice problems."}, {"title": "Segment Tree", "url": "https://cp-algorithms.com/data_structures/segment_tree.html", "type": "notes", "by": "cp-algorithms", "level": 2, "note": "Past the basics: lazy propagation for range updates, persistent and dynamic segment trees, and higher dimensions."}, {"title": "Computational Geometry: Algorithms and Applications", "url": "https://link.springer.com/book/10.1007/978-3-540-77974-2", "type": "book", "by": "de Berg, Cheong, van Kreveld, Overmars, 3rd edition, 2008", "level": 3, "note": "Chapters 5 (Orthogonal Range Searching) and 10 (More Geometric Data Structures): kd-trees, range trees, interval trees, and segment trees over points and intervals.", "paid": true}, {"title": "MIT 6.851: Advanced Data Structures", "url": "https://ocw.mit.edu/courses/6-851-advanced-data-structures-spring-2012/", "type": "course", "by": "Erik Demaine, MIT OCW, 2012", "level": 3, "note": "Research-level sessions on persistence, retroactivity, dynamic optimality, cache-oblivious and integer structures, succinct structures, and dynamic graphs."}]}, {"id": "cp", "title": "Competitive programming", "kind": "concept", "track": "algo", "pre": ["dp", "advds", "greedy"], "frontier": false, "core": "Contest problems are solved under a time limit by recognizing a known pattern, such as greedy, DP, graph search, or range queries, and checking that its complexity fits the input bounds at about 10^8 operations per second. Fluency comes from many graded problems and editorials.", "reach": "The pattern recognition technical interviews test, and practice for every algo node.", "resources": [{"title": "Competitive Programmer’s Handbook", "url": "https://cses.fi/book/book.pdf", "type": "book", "by": "Antti Laaksonen, 2018", "level": 1, "note": "A free, compact map of contest techniques by the main developer of CSES."}, {"title": "CSES Problem Set", "url": "https://cses.fi/problemset/", "type": "tutorial", "by": "Antti Laaksonen and others, CSES", "level": 2, "note": "400 problems grouped by technique, from introductory problems through sorting and searching, DP, graphs, range queries, trees, math, strings, and geometry."}, {"title": "Competitive Programming 4", "url": "https://cpbook.net/", "type": "book", "by": "Steven Halim, Felix Halim, Suhendry Effendy, 2020", "level": 2, "note": "Book 1 (Chapters 1 to 4) covers most of the IOI syllabus; Book 2 (Chapters 5 to 9) adds the wider topics seen at ICPC regionals and finals.", "paid": true}, {"title": "Solving CSES Problemset [12 Hour Livestream] [150 coding problems]", "url": "https://www.youtube.com/watch?v=dZ_6MS14Mg4", "type": "video", "by": "William Lin, 2020", "level": 2, "note": "Watch a top competitor solve 150 CSES problems while explaining his choices."}, {"title": "USACO Guide", "url": "https://usaco.guide/", "type": "tutorial", "by": "USACO Guide", "level": 1, "note": "A free curriculum from Bronze to Platinum; each module pairs an explanation with graded problems."}, {"title": "Algorithms for Competitive Programming", "url": "https://cp-algorithms.com/", "type": "notes", "by": "cp-algorithms", "level": 3, "note": "Reference articles for the algorithms contests use, from number theory and flows to string algorithms."}]}, {"id": "automata", "title": "Automata and formal languages", "kind": "concept", "track": "theory", "pre": ["proofs"], "frontier": false, "core": "A finite automaton has fixed memory, reads a string once, and accepts or rejects it; the languages it accepts are exactly those that regular expressions describe. Adding a stack gives context-free grammars, and the pumping lemmas prove what each model cannot recognize.", "reach": "Regular expressions and grammars are the front end of compilers; adding unbounded memory leads to computability.", "resources": [{"title": "MIT 18.404J: Theory of Computation", "url": "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/", "type": "course", "by": "Michael Sipser, MIT OCW, 2020", "level": 1, "note": "Lectures 1 to 5: finite automata, nondeterminism, regular expressions, the pumping lemma, context-free grammars, and pushdown automata."}, {"title": "Introduction to the Theory of Computation", "url": "https://www.cengage.com/c/introduction-to-the-theory-of-computation-3e-sipser/9781133187790/", "type": "book", "by": "Michael Sipser, 3rd edition, 2012", "level": 2, "note": "Part 1, Automata and Languages; the lectures above follow the book.", "paid": true}, {"title": "Models of Computation", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/models/all-models.pdf", "type": "notes", "by": "Jeff Erickson, 2018", "level": 2, "note": "Free notes on strings, regular languages, DFAs, NFAs, and context-free languages, each ending with exercises."}]}, {"id": "computability", "title": "Computability and Turing machines", "kind": "concept", "track": "theory", "pre": ["automata"], "frontier": false, "core": "A Turing machine, a finite control with an unbounded tape, can compute anything any computer can (the Church-Turing thesis). Diagonalization then shows that some problems have no algorithm at all: no program decides whether an arbitrary program halts, and reductions spread that impossibility.", "reach": "Complexity theory asks the same questions under a time budget; Rice’s theorem limits what program analyzers in compilers can decide.", "resources": [{"title": "Math’s Fundamental Flaw", "url": "https://www.youtube.com/watch?v=HeQX2HjkcNo", "type": "video", "by": "Veritasium, 2021", "level": 1, "note": "A 34-minute story of Hilbert’s program, Gödel’s incompleteness, and Turing’s halting problem."}, {"title": "MIT 18.404J: Theory of Computation", "url": "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/", "type": "course", "by": "Michael Sipser, MIT OCW, 2020", "level": 2, "note": "Lectures 5 to 11: Turing machines and their variants, decidability, undecidability, reducibility, the computation history method, and the recursion theorem."}, {"title": "Introduction to the Theory of Computation", "url": "https://www.cengage.com/c/introduction-to-the-theory-of-computation-3e-sipser/9781133187790/", "type": "book", "by": "Michael Sipser, 3rd edition, 2012", "level": 2, "note": "Part 2, Computability Theory.", "paid": true}, {"title": "The Busy Beaver Frontier", "url": "https://www.scottaaronson.com/papers/bb.pdf", "type": "paper", "by": "Scott Aaronson, 2020", "level": 3, "note": "Busy beaver numbers, which outgrow every computable function, and the open problems around them."}]}, {"id": "complexity", "title": "Complexity: P, NP and reductions", "kind": "concept", "track": "theory", "pre": ["computability", "graphs"], "frontier": false, "core": "P holds the problems solvable in polynomial time; NP holds those whose solutions can be checked in polynomial time. A reduction turns one problem into another, so a fast algorithm for any NP-complete problem, such as SAT, would give one for all of NP.", "reach": "Tells you when to stop seeking an exact algorithm and reach for randomized algorithms or integer solvers; zero-knowledge proofs are built on NP.", "resources": [{"title": "What P vs NP is actually about", "url": "https://www.youtube.com/watch?v=6OPsH8PK7xM", "type": "video", "by": "Polylog, 2024", "level": 1, "note": "An 18-minute explanation of NP through the programs that check solutions, and what a fast SAT solver would imply."}, {"title": "MIT 18.404J: Theory of Computation", "url": "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/", "type": "course", "by": "Michael Sipser, MIT OCW, 2020", "level": 2, "note": "Lectures 12 to 18: time complexity, P and NP, polynomial-time reductions, NP-completeness and the Cook-Levin theorem, then space complexity and PSPACE."}, {"title": "NP-Hardness (Chapter 12 of Algorithms)", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/book/12-nphard.pdf", "type": "book", "by": "Jeff Erickson, 2019", "level": 2, "note": "Fifty pages of reductions from the algorithm designer’s side, with worked NP-hardness proofs and exercises."}, {"title": "Computational Complexity: A Modern Approach", "url": "https://theory.cs.princeton.edu/complexity/", "type": "book", "by": "Sanjeev Arora, Boaz Barak, Cambridge, 2009", "level": 3, "note": "Graduate text with a free draft: Chapters 1 to 7 cover models, NP, diagonalization, space, the polynomial hierarchy, circuits, and randomized computation."}, {"title": "Astonishing discovery by computer scientist: how to squeeze space into time", "url": "https://www.youtube.com/watch?v=8JuWdXrCmWg", "type": "video", "by": "Chalk Talk, 2025", "level": 3, "note": "Ryan Williams’s 2025 result that any computation running in time t can be simulated in roughly the square root of t space."}]}, {"id": "randalg", "title": "Randomized and approximation algorithms", "kind": "concept", "track": "theory", "pre": ["complexity", "prob", "lp"], "frontier": false, "core": "When exact answers are too slow or NP-hard, trade certainty for speed. Randomized algorithms flip coins to run fast on every input with high probability; approximation algorithms return answers provably within a factor of optimal, often by rounding a linear program.", "reach": "Hashing and sketches in databases, LP rounding for integer problems, and the Monte Carlo methods used across simulation.", "resources": [{"title": "MIT 6.046J: Design and Analysis of Algorithms", "url": "https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/", "type": "course", "by": "Erik Demaine, Srini Devadas, Nancy Lynch, MIT OCW, 2015", "level": 1, "note": "Lectures 6 to 8 and 17: randomized matrix product checking and quicksort, skip lists, universal and perfect hashing, then approximation algorithms."}, {"title": "More Algorithms Lecture Notes", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/", "type": "notes", "by": "Jeff Erickson, UIUC", "level": 2, "note": "The Director’s Cut notes on discrete probability, treaps and skip lists, tail inequalities, hashing, and randomized minimum cut."}, {"title": "CS261: A Second Course in Algorithms", "url": "http://timroughgarden.org/w16/w16.html", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2016", "level": 2, "note": "Lectures 15 to 18: approximation algorithms, the traveling salesman problem, LP rounding, and randomized approximation, with a video and notes for each."}, {"title": "The Design of Approximation Algorithms", "url": "https://www.designofapproxalgs.com/", "type": "book", "by": "David Williamson, David Shmoys, Cambridge, 2011", "level": 3, "note": "Free electronic edition, organized by technique: greedy and local search, dynamic programming, LP and SDP rounding, randomization, and hardness of approximation."}]}, {"id": "circuits", "title": "Circuit analysis", "kind": "concept", "track": "hardware", "pre": ["calc"], "frontier": false, "core": "A circuit is a graph of elements, each obeying one law (V = IR, i = C dv/dt), joined by Kirchhoff’s laws: currents into a node sum to zero, as do voltages around a loop. Solving them gives every voltage and current.", "reach": "Capacitors and inductors turn these equations into ODEs, where signals and classical control begin; transistors make circuits the substrate of digital logic and VLSI.", "resources": [{"title": "MIT 6.002: Circuits and Electronics", "url": "https://ocw.mit.edu/courses/6-002-circuits-and-electronics-spring-2007/", "type": "lectures", "by": "Anant Agarwal, MIT OCW, 2007", "level": 1, "note": "Lectures 1 to 3 (lumped abstraction, node analysis, Thévenin), then 12 and 15 to 17 (first and second order circuits, impedance)."}, {"title": "EECS 16B: Designing Information Devices and Systems II", "url": "https://eecs16b.org/", "type": "notes", "by": "UC Berkeley, Spring 2024", "level": 2, "note": "Notes 1 to 7: RC and RLC circuits as differential equations, phasors, transfer functions, and Bode plots."}, {"title": "Circuit Simulator", "url": "https://www.falstad.com/circuit/", "type": "code", "by": "Paul Falstad", "level": 1, "note": "Runs in the browser and animates current flow; rebuild each lecture circuit and watch it settle."}, {"title": "The Art of Electronics (3rd edition)", "url": "https://artofelectronics.net/", "type": "book", "by": "Paul Horowitz, Winfield Hill, 2015", "level": 3, "note": "The practitioner’s reference for how real analog and digital circuits are designed.", "paid": true}]}, {"id": "digital", "title": "Digital logic and design", "kind": "concept", "track": "hardware", "pre": ["proofs"], "frontier": false, "core": "Any Boolean function can be built from a single gate type such as NAND. Add a clock and flip-flops that hold bits between ticks, and logic gains memory: a synchronous design is combinational logic between registers, and the clock period must exceed the slowest path.", "reach": "Registers, an ALU, and control logic make a CPU; VLSI turns the same logic into silicon, and embedded systems program it.", "resources": [{"title": "Build an 8-bit computer", "url": "https://eater.net/8bit/", "type": "video", "by": "Ben Eater", "level": 1, "note": "Breadboard videos from transistors, latches, and flip-flops to registers, an ALU, RAM, and the CPU control logic."}, {"title": "From Nand to Tetris", "url": "https://www.nand2tetris.org/", "type": "course", "by": "Noam Nisan, Shimon Schocken", "level": 1, "note": "Projects 1 to 5 build gates, an adder and ALU, memory, and a working CPU in a simple HDL."}, {"title": "MIT 6.004: Computation Structures", "url": "https://ocw.mit.edu/courses/6-004-computation-structures-spring-2017/", "type": "lectures", "by": "MIT OCW, 2017", "level": 2, "note": "The same climb with engineering rigor: timing, sequential logic, pipelining, and instruction set design."}, {"title": "HDLBits", "url": "https://hdlbits.01xz.net/", "type": "tutorial", "by": "Henry Wong, 01xz.net", "level": 2, "note": "Small Verilog exercises checked by simulation, from single gates to state machines."}]}, {"id": "signals", "title": "Signals and systems", "kind": "concept", "track": "hardware", "pre": ["diffeq", "linalg"], "frontier": false, "core": "A linear time-invariant system is fully described by its response to a single impulse: the output is the input convolved with that response. Sinusoids pass through it changed only in gain and phase, so in the frequency domain convolution becomes multiplication.", "reach": "Transfer functions, poles, and Bode plots carry straight into classical control; sampling and the DFT underlie RF and every digital measurement.", "resources": [{"title": "But what is the Fourier Transform? A visual introduction.", "url": "https://www.youtube.com/watch?v=spUNpyF58BY", "type": "video", "by": "3Blue1Brown, 2018", "level": 1, "note": "What a Fourier transform measures, drawn as winding a signal around a circle."}, {"title": "MIT 6.003: Signals and Systems", "url": "https://ocw.mit.edu/courses/6-003-signals-and-systems-fall-2011/", "type": "lectures", "by": "Dennis Freeman, MIT OCW, 2011", "level": 2, "note": "Lectures 8, 9, and 16 cover convolution, frequency response, and the Fourier transform; Lecture 21 covers sampling."}, {"title": "Digital Signals Theory", "url": "https://brianmcfee.net/dstbook-site/content/intro.html", "type": "book", "by": "Brian McFee", "level": 2, "note": "Chapters 2, 3, 5, and 10: sampling and aliasing, convolution, the DFT, and the convolution theorem, with code."}]}, {"id": "vlsi", "title": "VLSI and ASIC design", "kind": "concept", "track": "hardware", "pre": ["digital", "circuits"], "frontier": false, "core": "Describe hardware as registers and the logic between them (RTL). Synthesis maps that onto a library of standard cells, place and route lays the cells out on silicon, and static timing analysis checks that every path settles within the clock period before tapeout.", "reach": "Ties digital logic to the physical limits of power, area, and timing; the same flow builds the accelerators ML runs on.", "resources": [{"title": "EECS 151/251A: Introduction to Digital Design and Integrated Circuits", "url": "https://eecs151.org/", "type": "course", "by": "UC Berkeley EECS", "level": 2, "note": "The ASIC labs take RTL through synthesis, place and route, clock tree synthesis, and signoff in SkyWater 130nm."}, {"title": "Tiny Tapeout", "url": "https://tinytapeout.com/", "type": "course", "by": "Matt Venn and contributors", "level": 1, "note": "Design a small digital block from gates or Verilog and have it fabricated on a shared chip."}, {"title": "Zero to ASIC Course", "url": "https://www.zerotoasiccourse.com/", "type": "course", "by": "Matt Venn", "level": 2, "note": "A guided digital or analog course through the open source chip design flow.", "paid": true}, {"title": "EE 194/290C Tutorials", "url": "https://ucb-ee290c.github.io/tutorials/", "type": "tutorial", "by": "UC Berkeley tapeout class", "level": 3, "note": "Chipyard SoC generation and baremetal bringup, as used for Berkeley’s student tapeouts."}]}, {"id": "embedded", "title": "Embedded systems and microcontrollers", "kind": "concept", "track": "hardware", "pre": ["digital", "c"], "frontier": false, "core": "A microcontroller is a CPU whose peripherals (pins, timers, serial ports, ADCs) appear as memory addresses. Firmware drives hardware by reading and writing those registers and reacts to events through interrupts, within fixed timing and memory budgets, usually without an operating system.", "reach": "The layer between digital logic and the physical world; rocketry flight computers, drones, and robots all run on it.", "resources": [{"title": "Build a 6502 computer", "url": "https://eater.net/6502", "type": "video", "by": "Ben Eater", "level": 1, "note": "A breadboard computer built around a 6502 CPU; later videos add peripherals and hardware interrupts."}, {"title": "Embedded Systems: Shape the World", "url": "https://users.ece.utexas.edu/~valvano/Volume1/E-Book/", "type": "book", "by": "Jonathan Valvano, Ramesh Yerraballi, UT Austin", "level": 2, "note": "Chapters 6, 10, 11, and 12: microcontroller ports, finite state machines, the UART, and interrupts on an ARM Cortex-M."}, {"title": "Introduction to the Internet of Things and Embedded Systems", "url": "https://www.coursera.org/learn/iot", "type": "course", "by": "Ian Harris, UC Irvine, Coursera", "level": 1, "note": "A gentle survey of embedded hardware, sensors, and networked devices."}, {"title": "Interrupt", "url": "https://interrupt.memfault.com/", "type": "blog", "by": "Memfault", "level": 3, "note": "Working firmware engineers on debugging, logging, RTOS tooling, and device reliability."}]}, {"id": "pcb", "title": "PCB design", "kind": "concept", "track": "hardware", "pre": ["circuits"], "frontier": false, "core": "A PCB turns a schematic into copper: assign each part a footprint, place the parts, route traces within the fab’s design rules, and export Gerber files. Every signal needs a short return path, usually a ground plane, or the board radiates and picks up noise.", "reach": "Where circuits meet manufacturing; embedded boards, RF front ends, and rocket flight computers all start here.", "resources": [{"title": "Getting Started in KiCad", "url": "https://docs.kicad.org/10.0/en/getting_started_in_kicad/getting_started_in_kicad.html", "type": "tutorial", "by": "KiCad project, version 10.0", "level": 1, "note": "The official tutorial: one small board from schematic through layout to fabrication files."}, {"title": "Keyboard PCB Guide", "url": "https://github.com/ruiqimao/keyboard-pcb-guide", "type": "tutorial", "by": "Ruiqi Mao, 2017", "level": 1, "note": "A complete keyboard PCB in KiCad; written for an older version, so menus differ, but the flow is the same."}, {"title": "KiCad 6 STM32 PCB Design Full Tutorial - Phil’s Lab #65", "url": "https://www.youtube.com/watch?v=aVUqaB0IMh4", "type": "video", "by": "Phil’s Lab, 2022", "level": 2, "note": "A microcontroller board with USB, designed from schematic through layout and routing."}, {"title": "How to Achieve Proper Grounding", "url": "https://www.youtube.com/watch?v=ySuUZEjARPY", "type": "video", "by": "Rick Hartley, Altium, 2019", "level": 3, "note": "A long talk on return currents, ground planes, and EMI, the physics behind most layout rules."}]}, {"id": "rf", "title": "RF, antennas and ham radio", "kind": "concept", "track": "hardware", "pre": ["signals", "circuits", "em"], "frontier": false, "core": "At radio frequencies a wire can be a sizable fraction of a wavelength (λ = c/f), so circuits radiate. An antenna is a conductor sized to that wavelength, feed lines must match its impedance or power reflects, and radios carry information by modulating a carrier.", "reach": "Joins signals and electromagnetism; telemetry for rocketry and guidance, and every wireless link, depend on it.", "resources": [{"title": "No-Nonsense Technician Class License Study Guide", "url": "https://www.kb6nu.com/study-guides/", "type": "book", "by": "Dan Romanchik (KB6NU), 2026 to 2030 question pool", "level": 1, "note": "The free PDF covers the US entry license: rules, frequencies, antennas, and basic electronics."}, {"title": "PySDR: A Guide to SDR and DSP using Python", "url": "https://pysdr.org/", "type": "book", "by": "Marc Lichtman", "level": 2, "note": "Chapters 2 to 4 and 12: the frequency domain, IQ sampling, digital modulation, and link budgets, with a cheap SDR to try them on."}, {"title": "MIT 6.013: Electromagnetics and Applications", "url": "https://ocw.mit.edu/courses/6-013-electromagnetics-and-applications-spring-2009/", "type": "lectures", "by": "David Staelin, MIT OCW, 2009", "level": 3, "note": "Waves, radiation, guided waves, and antennas derived from Maxwell’s equations."}]}, {"id": "mechanics", "title": "Classical mechanics", "kind": "concept", "track": "physics", "pre": ["calc", "diffeq"], "frontier": false, "core": "Newton’s F = ma turns forces into a differential equation whose solution is the motion. The Lagrangian view reaches the same equations in any coordinates by making the action (kinetic minus potential energy, summed over time) stationary, and each symmetry then gives a conserved quantity.", "reach": "The language of every later physics node: electromagnetism adds fields, quantum mechanics quantizes the Hamiltonian, and structural and fluid mechanics apply F = ma to continua.", "resources": [{"title": "MIT 8.01SC: Classical Mechanics", "url": "https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/", "type": "course", "by": "Chakrabarty, Dourmashkin, Tomasik, et al., MIT OCW, 2016", "level": 1, "note": "Lecture videos and problem sets on force, momentum, energy, torque, and angular momentum."}, {"title": "Classical Mechanics (The Theoretical Minimum)", "url": "https://theoreticalminimum.com/courses/classical-mechanics/2011/fall", "type": "lectures", "by": "Leonard Susskind, Stanford, 2011", "level": 1, "note": "Lectures 3 to 6: least action, symmetry and conservation laws, and Hamilton’s equations."}, {"title": "The Feynman Lectures on Physics, Volume II", "url": "https://www.feynmanlectures.caltech.edu/II_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1964", "level": 1, "note": "Chapter 19, The Principle of Least Action, explains why nature picks the stationary path."}, {"title": "Classical Dynamics", "url": "https://davidtong.org/teaching/classical-dynamics/", "type": "notes", "by": "David Tong, Cambridge", "level": 3, "note": "Chapters 2 to 4: the Lagrangian formulation, rigid bodies, and the Hamiltonian formulation."}]}, {"id": "em", "title": "Electricity and magnetism", "kind": "concept", "track": "physics", "pre": ["calc"], "frontier": false, "core": "Charges make electric fields, currents make magnetic fields, and a changing field of either kind makes the other; Maxwell’s four equations say exactly how. Solving them in empty space gives waves that travel at the speed of light, so light is an electromagnetic wave.", "reach": "Circuits, signals, and RF rest on it; relativity began as the puzzle of why every observer measures the same speed of light.", "resources": [{"title": "MIT 8.02: Physics II, Electricity and Magnetism", "url": "https://ocw.mit.edu/courses/8-02-physics-ii-electricity-and-magnetism-spring-2019/", "type": "course", "by": "Dourmashkin, Tomasik, et al., MIT OCW, 2019", "level": 1, "note": "Lecture videos and problem sets that build up to Maxwell’s equations."}, {"title": "Vector Calculus for Engineers", "url": "https://www.coursera.org/learn/vector-calculus-engineers", "type": "course", "by": "Jeffrey Chasnov, HKUST, Coursera", "level": 1, "note": "Weeks 2 and 5: divergence and curl, then the divergence and Stokes’ theorems that Maxwell’s equations are written in."}, {"title": "The Feynman Lectures on Physics, Volume II", "url": "https://www.feynmanlectures.caltech.edu/II_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1964", "level": 2, "note": "Chapter 1 for the big picture, chapter 18 for the Maxwell equations, and chapter 20 for their wave solutions."}, {"title": "Electromagnetism", "url": "https://davidtong.org/teaching/electromagnetism/", "type": "notes", "by": "David Tong, Cambridge", "level": 3, "note": "Chapters 4 and 5 rewrite Maxwell’s equations relativistically and derive radiation."}]}, {"id": "thermo", "title": "Thermodynamics and statistical mechanics", "kind": "concept", "track": "physics", "pre": ["prob", "mechanics"], "frontier": false, "core": "Entropy is the logarithm of the number of microscopic states consistent with what you measure. At temperature T a system occupies each state with probability proportional to exp(-E/kT), and the sum of those weights, the partition function, yields energy, pressure, and every other bulk quantity.", "reach": "Feeds the free energy of physical chemistry, heat transfer, and astrophysics; the Boltzmann distribution returns as softmax and energy models in machine learning.", "resources": [{"title": "Statistical Mechanics (The Theoretical Minimum)", "url": "https://theoreticalminimum.com/courses/statistical-mechanics/2013/spring", "type": "lectures", "by": "Leonard Susskind, Stanford, 2013", "level": 1, "note": "Lectures 1 to 4 derive entropy, temperature, and the Boltzmann distribution from counting states."}, {"title": "Statistical Physics", "url": "https://davidtong.org/teaching/statistical-physics/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapter 1 builds the ensembles and the partition function, chapter 4 recovers classical thermodynamics, and chapter 5 covers phase transitions."}, {"title": "Fundamentals of Statistical and Thermal Physics", "url": "https://www.waveland.com/browse.php?t=520", "type": "book", "by": "F. Reif, 1965, reissued by Waveland Press", "level": 2, "note": "Probability first, then statistical mechanics, thermodynamics, quantum gases, and transport, with 230 problems.", "paid": true}, {"title": "MIT 8.333: Statistical Mechanics I", "url": "https://ocw.mit.edu/courses/8-333-statistical-mechanics-i-statistical-mechanics-of-particles-fall-2013/", "type": "lectures", "by": "Mehran Kardar, MIT OCW, 2013", "level": 3, "note": "Graduate video lectures: thermodynamics, probability, kinetic theory, and interacting systems."}]}, {"id": "qm", "title": "Quantum mechanics", "kind": "concept", "track": "physics", "pre": ["linalg", "pde", "mechanics"], "frontier": false, "core": "A system’s state is a vector of complex amplitudes, and the squared size of each amplitude is the probability of that measurement outcome. The Schrödinger equation rotates the vector in time; the allowed energies are the Hamiltonian’s eigenvalues, which is why atoms have discrete spectra.", "reach": "Underlies quantum computing, quantum chemistry, and the semiconductors in circuits and VLSI; the same linear algebra runs every quantum algorithm.", "resources": [{"title": "MIT 8.04: Quantum Physics I", "url": "https://ocw.mit.edu/courses/8-04-quantum-physics-i-spring-2016/pages/video-lectures/part-1/", "type": "lectures", "by": "Barton Zwiebach, MIT OCW, 2016", "level": 1, "note": "Part 1, Basic Concepts, then part 2 on one-dimensional potentials and part 3 on angular momentum and central potentials."}, {"title": "The Feynman Lectures on Physics, Volume III", "url": "https://www.feynmanlectures.caltech.edu/III_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1965", "level": 1, "note": "Chapters 1 to 3 build quantum mechanics from amplitudes; chapters 8 to 11 treat two-state systems, the qubit before it had a name."}, {"title": "Quantum Mechanics", "url": "https://davidtong.org/teaching/quantum-mechanics/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapter 3, The Formalism of Quantum Mechanics, states the rules as linear algebra."}, {"title": "MIT 8.05: Quantum Physics II", "url": "https://ocw.mit.edu/courses/8-05-quantum-physics-ii-fall-2013/", "type": "lectures", "by": "Barton Zwiebach, MIT OCW, 2013", "level": 3, "note": "The general formalism, the harmonic oscillator, spin, and addition of angular momentum."}]}, {"id": "relativity", "title": "Special and general relativity", "kind": "concept", "track": "physics", "pre": ["mechanics", "em"], "frontier": false, "core": "Every observer measures the same speed of light, so space and time must mix: moving clocks run slow, and simultaneity depends on the observer. General relativity makes gravity the curvature of spacetime; matter sets the curvature, and free objects follow its straightest paths.", "reach": "Needed for black holes and cosmology in astrophysics, and for the satellite clocks behind GPS navigation, which correct for both effects.", "resources": [{"title": "The Feynman Lectures on Physics, Volume I", "url": "https://www.feynmanlectures.caltech.edu/I_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1963", "level": 1, "note": "Chapters 15 to 17: special relativity, relativistic energy and momentum, and space-time."}, {"title": "General relativity from first principles", "url": "https://www.youtube.com/watch?v=QbdbAhaJoCQ", "type": "video", "by": "Adam Brown with Dwarkesh Patel", "level": 1, "note": "Starts from the coincidence that inertial and gravitational mass are equal and follows Einstein from there."}, {"title": "General Relativity (The Theoretical Minimum)", "url": "https://theoreticalminimum.com/courses/general-relativity/2012/fall", "type": "lectures", "by": "Leonard Susskind, Stanford, 2012", "level": 2, "note": "Lecture 1 starts from the equivalence of gravity and acceleration; the rest builds the geometry."}, {"title": "Lecture Notes on General Relativity", "url": "https://arxiv.org/abs/gr-qc/9712019", "type": "notes", "by": "Sean Carroll, 1997", "level": 3, "note": "Chapters 1 to 4 go from flat spacetime through curvature to Einstein’s equation; later chapters cover gravitational waves, black holes, and cosmology."}]}, {"id":
