 design tools like RFdiffusion predict or design the structures biochemistry explains.", "worth": "you want to work on protein ML or drug discovery; skip it if biology is not in your plans.", "resources": [{"title": "MIT 7.05: General Biochemistry", "url": "https://ocw.mit.edu/courses/7-05-general-biochemistry-spring-2020/", "type": "lectures", "by": "Michael Yaffe, Matthew Vander Heiden, MIT OCW, 2020", "level": 1, "note": "Video lectures on the chemistry of proteins and nucleic acids, enzymes, and metabolism."}, {"title": "Fundamentals of Biochemistry", "url": "https://bio.libretexts.org/Bookshelves/Biochemistry/Fundamentals_of_Biochemistry_(Jakubowski_and_Flatt)", "type": "book", "by": "Henry Jakubowski, Patricia Flatt, LibreTexts", "level": 2, "note": "Unit I (structure and catalysis) and Unit II (bioenergetics and metabolism)."}, {"title": "Highly Accurate Protein Structure Prediction with AlphaFold", "url": "https://www.nature.com/articles/s41586-021-03819-2", "type": "paper", "by": "Jumper et al., Nature, 2021", "level": 3, "note": "How far sequence alone determines structure, learned from the Protein Data Bank."}, {"title": "Flux balance analysis of E. coli’s core metabolism", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC3108565/", "type": "project", "by": "Built on Orth, Thiele, Palsson, 2010", "level": 2, "build": "The E. coli core model’s stoichiometric matrix loaded from BiGG, a steady state linear program written with SciPy that maximizes the biomass reaction, then runs without oxygen and with single reactions knocked out.", "teaches": "Metabolism as a network of mass balances, and how much growth follows from stoichiometry and uptake limits alone, with no rate constants.", "time": "a day", "made": true, "done": "With glucose uptake capped at 18.5 mmol per gram dry weight per hour, growth comes out 1.65 per hour with oxygen and 0.47 without, as in the paper."}]}, {"id": "fluidmech", "title": "Fluid mechanics", "kind": "concept", "track": "fluids", "pre": ["mechanics", "pde"], "frontier": false, "core": "A fluid is described by velocity and pressure fields, and the Navier-Stokes equations are F = ma for each small parcel: pressure differences push it and viscosity smooths it. The Reynolds number, inertia over viscosity, predicts whether flow stays smooth or turns turbulent.", "reach": "Leads to CFD, turbulence, and convective heat transfer, and to aerodynamics and propulsion.", "uses": "Aircraft, cars, ships, pipelines, weather and ocean models, blood flow, and data center cooling. Flow matching borrows its picture of velocity fields carrying a density, a shared equation rather than shared practice.", "worth": "you plan CFD, aerospace, or ML for physical simulation; skip it if your interest in flows is only the generative-model kind.", "resources": [{"title": "The Feynman Lectures on Physics, Volume II", "url": "https://www.feynmanlectures.caltech.edu/II_toc.html", "type": "book", "by": "Feynman, Leighton, Sands, 1964", "level": 1, "note": "Chapters 40 and 41, The Flow of Dry Water and The Flow of Wet Water: ideal flow, then viscosity."}, {"title": "Fluid Mechanics", "url": "https://davidtong.org/teaching/fluid-mechanics/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapters 1 and 2: inviscid flow, then the Navier-Stokes equation; later chapters cover waves and instabilities."}, {"title": "MIT 2.25: Advanced Fluid Mechanics", "url": "https://ocw.mit.edu/courses/2-25-advanced-fluid-mechanics-fall-2013/", "type": "course", "by": "Gareth McKinley, MIT OCW, 2013", "level": 3, "note": "Viscous flow, dimensional analysis, lubrication, boundary layers and separation, and vorticity, with problem sets."}, {"title": "The Blasius boundary layer by shooting", "url": "https://davidtong.org/teaching/fluid-mechanics/", "type": "project", "by": "Built on David Tong’s Fluid Mechanics notes, Cambridge", "level": 2, "build": "A shooting solver for the Blasius equation f’’’ + f f’’/2 = 0 with no slip at the plate, giving the boundary layer’s velocity profile, its thickness, and the drag on a flat plate.", "teaches": "How viscosity confines itself to a thin layer at high Reynolds number, and why drag grows as the square root of the plate’s length.", "time": "an afternoon", "made": true, "done": "The wall shear f’’(0) comes out 0.33 and f minus η tends to -1.72 far from the plate, the values in section 3.5.2 of the notes."}]}, {"id": "cfd", "title": "Computational fluid dynamics", "kind": "concept", "track": "fluids", "pre": ["fluidmech", "numerics"], "frontier": false, "core": "Replace derivatives in the flow equations with differences between grid values, then march forward in time. The answer is trustworthy only if the scheme is stable (the CFL condition ties the time step to the grid spacing) and converges as the grid is refined.", "reach": "Applies numerical methods to fluid mechanics and feeds aerodynamics and propulsion; learned simulators from the machine learning roadmap now replace parts of it.", "uses": "Aircraft and car design, Formula 1 aerodynamics, weather prediction, and data center cooling. Learned weather models like GraphCast and GenCast, a diffusion model, now rival physics forecasts, though classic CFD solvers contain no ML.", "worth": "you want ML for simulation, weather, or engineering design; it needs fluids and numerics first, so skip it otherwise.", "resources": [{"title": "CFD Python: 12 steps to Navier-Stokes", "url": "https://github.com/barbagroup/CFDPython", "type": "project", "by": "Lorena Barba, Gilbert Forsyth, 2013", "level": 1, "build": "Finite difference solvers in Python, from 1D linear convection through diffusion and Burgers’ equation to 2D cavity and channel flow under the Navier-Stokes equations.", "teaches": "That discretization, stability limits such as the CFL condition, and pressure coupling decide whether a flow simulation works.", "time": "a week", "signature": true}, {"title": "Fluid Simulation for Computer Graphics (course notes)", "url": "https://www.cs.ubc.ca/~rbridson/fluidsimulation/fluids_notes.pdf", "type": "notes", "by": "Robert Bridson, Matthias Müller-Fischer, SIGGRAPH 2007", "level": 2, "note": "Chapters 2 to 4: operator splitting, advection, and the pressure projection that keeps the flow incompressible."}, {"title": "Coding Adventure: Simulating Fluids", "url": "https://www.youtube.com/watch?v=rSKMYc1CQHE", "type": "video", "by": "Sebastian Lague", "level": 1, "note": "Builds a particle-based water simulation from scratch, the alternative to grids."}, {"title": "Computational Fluid Mechanics: Airflow Around a Spoiler", "url": "https://www.coursera.org/projects/computational-fluid-mechanics-airflow-around-a-spoiler-uktyf", "type": "course", "by": "Jousef Murad, Coursera guided project", "level": 1, "note": "One hour setting up an incompressible flow simulation in cloud software and reading its results."}, {"title": "Computational Methods for Engineers", "url": "https://empossible.net/academics/emp4301_5301/", "type": "lectures", "by": "Raymond Rumpf, UTEP EMPossible", "level": 2, "note": "Topics 6 and 7: finite differences as sparse matrices, boundary conditions, and collocated versus staggered grids."}, {"title": "Physics-Based Deep Learning", "url": "https://physicsbaseddeeplearning.org/", "type": "book", "by": "Nils Thuerey and others", "level": 3, "note": "Neural surrogates, physical loss terms, and differentiable simulators that train through the solver, with notebooks."}, {"title": "Lattice Boltzmann flow past a cylinder", "url": "https://wwwold.mathematik.tu-dortmund.de/~featflow/en/benchmarks/cfdbenchmarking/flow/dfg_benchmark2_re100.html", "type": "project", "by": "Built on the DFG flow around a cylinder benchmark 2D-2, FEATFLOW, TU Dortmund", "level": 3, "build": "A D2Q9 lattice Boltzmann solver in NumPy for the benchmark’s channel and cylinder at Re = 100: parabolic inflow, bounce-back walls, and drag, lift, and shedding frequency measured over one cycle.", "teaches": "A second route to the same flow, through particle distributions instead of a pressure solve, and how to validate a solver against a published benchmark rather than by eye.", "time": "a week", "made": true, "done": "The Strouhal number lands near 0.30 and the maximum drag coefficient near 3.22, the benchmark’s reference values for this time periodic case."}]}, {"id": "turbulence", "title": "Turbulence", "kind": "concept", "track": "fluids", "pre": ["fluidmech", "prob"], "frontier": true, "core": "At high Reynolds number a flow breaks into eddies of every size. Energy enters at the largest, cascades to ever smaller ones, and becomes heat at the smallest, where viscosity wins; from that picture alone Kolmogorov derived that energy at wavenumber k scales as k^(-5/3).", "reach": "Why CFD needs turbulence models and convective heat transfer is hard; an open problem where learned closures from machine learning are being tried.", "uses": "Predicting drag on aircraft, cars, and ships, mixing in engines and combustors, and weather and climate. ML researchers are testing learned closure models and super-resolution of turbulent flows, with mixed results so far.", "worth": "you aim for research in fluids or ML for physics; it is an open, math-heavy problem, so skip it unless that is your direction.", "resources": [{"title": "Understanding Laminar and Turbulent Flow", "url": "https://www.youtube.com/watch?v=9A-uUG0WR0w", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "Fluid Mechanics", "url": "https://davidtong.org/teaching/fluid-mechanics/", "type": "notes", "by": "David Tong, Cambridge", "level": 2, "note": "Chapter 5, Turbulence."}, {"title": "Turbulence: An Introduction for Scientists and Engineers", "url": "https://global.oup.com/academic/product/turbulence-9780198722595", "type": "book", "by": "Peter Davidson, 2nd edition", "level": 2, "note": "Written for newcomers and researchers alike, with physical pictures before the statistics.", "paid": true}, {"title": "Turbulent Flows", "url": "https://www.cambridge.org/highereducation/books/turbulent-flows/C58EFF59AF9B81AE6CFAC9ED16486B3A", "type": "book", "by": "Stephen Pope, 2000", "level": 3, "note": "The standard graduate text, from the statistical description of turbulence to its modeling.", "paid": true}, {"title": "Machine Learning for Fluid Mechanics", "url": "https://arxiv.org/abs/1905.11075", "type": "paper", "by": "Brunton, Noack, Koumoutsakos, 2020", "level": 3, "note": "A survey of learned models for understanding, modeling, and controlling flows."}, {"title": "Kolmogorov’s spectrum in a turbulence simulation", "url": "https://turbulence.pha.jhu.edu/", "type": "project", "by": "Built on the Johns Hopkins Turbulence Database", "level": 3, "note": "The forced isotropic dataset’s README gives its grid, viscosity, and time averaged statistics.", "build": "Velocity sampled along long lines through the database’s forced isotropic turbulence simulation, its energy spectrum computed by FFT, and the dissipation rate estimated from velocity gradients queried at random points.", "teaches": "What the energy cascade looks like in real data: where the inertial range starts and ends, and how dissipation sets the smallest scale.", "time": "a weekend", "made": true, "done": "The spectrum falls as k^(-5/3) over about a decade, and your dissipation estimate lands near the ε = 0.103 that the dataset’s README lists (Rλ = 418)."}]}, {"id": "heat", "title": "Heat transfer", "kind": "concept", "track": "fluids", "pre": ["thermo", "pde", "fluidmech"], "frontier": false, "core": "Heat moves by conduction, where flux follows the temperature gradient (Fourier’s law) and yields the heat equation; by convection, where moving fluid carries it; and by radiation, which grows as temperature to the fourth power. Most designs reduce to thermal resistances in series.", "reach": "Sets cooling limits for chips in VLSI and for nozzles in propulsion; the heat equation is the model diffusion PDE.", "uses": "Cooling chips, batteries, and data centers, and designing engines, buildings, and spacecraft heat shields; dense GPU racks now need liquid cooling. Diffusion models share the heat equation’s math, though thermal engineering doesn’t use them.", "worth": "you design hardware, data centers, or spacecraft; for ML, the heat equation itself is enough, so skip the engineering correlations.", "resources": [{"title": "Understanding Conduction and the Heat Equation", "url": "https://www.youtube.com/watch?v=6jQsLAqrZGQ", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "A Heat Transfer Textbook", "url": "https://ahtt.mit.edu/", "type": "book", "by": "John H. Lienhard IV, John H. Lienhard V, 6th edition", "level": 2, "note": "The whole subject, conduction, convection, radiation, and mass transfer, free, with more than 560 exercises."}, {"title": "MIT 2.51: Intermediate Heat and Mass Transfer", "url": "https://ocw.mit.edu/courses/2-51-intermediate-heat-and-mass-transfer-fall-2008/", "type": "course", "by": "Bora Mikic, MIT OCW, 2008", "level": 3, "note": "The advanced undergraduate course, assuming thermodynamics and fluid mechanics."}, {"title": "Cooling an apple: transient conduction in a sphere", "url": "https://ahtt.mit.edu/", "type": "project", "by": "Built on Lienhard and Lienhard, A Heat Transfer Textbook, 6th edition", "level": 2, "build": "A finite difference solver for the heat equation inside a sphere with a convective surface, checked against the series solution, then applied to the textbook’s apples cooling in a refrigerator.", "teaches": "How the Biot number decides whether a body cools evenly or from the outside in, and how to trust a transient solver by testing it against an exact one.", "time": "a day", "made": true, "done": "The apple’s center reads about 26 °C after one hour and reaches 10 °C after about 6 hours 15 minutes, as Example 5.2 reads them from Figure 5.9."}]}, {"id": "structures", "title": "Structural mechanics and vibrations", "kind": "concept", "track": "fluids", "pre": ["mechanics", "linalg"], "frontier": false, "core": "A loaded structure deforms until internal stresses balance the loads; stress is force per area, strain is relative stretch, and for small strains they are proportional (Hooke’s law). In motion the same structure vibrates at natural frequencies, the eigenvalues of its stiffness and mass matrices.", "reach": "Fem solves these equations on real shapes; vibration modes are the same eigenvector idea as modes in signals and control.", "uses": "Bridges, buildings, aircraft wings, car crash structures, earthquake engineering, and vibration in engines and machinery. Its link to ML is mostly through surrogate models that speed up design, not through shared ideas.", "worth": "you head into mechanical, civil, or aerospace engineering or robot hardware; skip it for ML research unless you build physical systems.", "resources": [{"title": "Understanding Stresses in Beams", "url": "https://www.youtube.com/watch?v=f08Y39UiC-o", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "Understanding Vibration and Resonance", "url": "https://www.youtube.com/watch?v=vLaFAKnaRJU", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "MIT 2.001: Mechanics and Materials I", "url": "https://ocw.mit.edu/courses/2-001-mechanics-materials-i-fall-2006/", "type": "course", "by": "Socrate, Livermore, Schmidt, Williams, MIT OCW, 2006", "level": 2, "note": "The three parts of every analysis: geometry of deformation, forces in the structure, and material behavior."}, {"title": "MIT 2.003SC: Engineering Dynamics", "url": "https://ocw.mit.edu/courses/2-003sc-engineering-dynamics-fall-2011/", "type": "lectures", "by": "J. Kim Vandiver, David Gossard, MIT OCW, 2011", "level": 2, "note": "The last units cover mechanical vibration, systems with many degrees of freedom, and mode superposition."}, {"title": "Vibration modes of a cantilever beam", "url": "https://pages.hmc.edu/spjut/RocketE80/PDFs/DynamBeamAnalyticalModes.pdf", "type": "project", "by": "Built on Harvey Mudd College’s E80 beam vibration handout", "level": 2, "build": "A cantilever beam split into N segments, its stiffness and mass matrices assembled, and the eigenproblem K v = ω² M v solved for natural frequencies and mode shapes as N grows.", "teaches": "That vibration modes are eigenvectors of a structure’s matrices, and that a coarse model gets the lowest modes right long before the higher ones.", "time": "a day", "made": true, "done": "The first three frequencies converge to the fixed-free values βL = 1.875, 4.694, and 7.855 in the handout’s Table 1, frequency ratios of about 1 to 6.27 to 17.5."}]}, {"id": "fem", "title": "Finite element method", "kind": "concept", "track": "fluids", "pre": ["structures", "numerics", "pde"], "frontier": false, "core": "Rewrite a differential equation in weak form, an integral statement, then approximate the solution as a sum of simple functions on small elements. The coefficients solve a sparse linear system K u = f, assembled element by element, so it works on any mesh shape.", "reach": "The workhorse for structural mechanics, heat transfer, and electromagnetics on real geometry; CFD mostly uses its finite volume cousin.", "uses": "Car crash simulation, stress analysis of aircraft and bridges, implants and biomechanics, and electromagnetic design, in tools like ANSYS and Abaqus. Learned mesh simulators such as MeshGraphNets train on simulation results like these.", "worth": "you want engineering simulation or ML surrogates for it; it needs PDEs and numerics first, so skip it otherwise.", "resources": [{"title": "Understanding the Finite Element Method", "url": "https://www.youtube.com/watch?v=GHjopp47vvQ", "type": "video", "by": "The Efficient Engineer", "level": 1}, {"title": "Introduction to Finite Element Methods", "url": "https://open.umich.edu/find/open-educational-resources/engineering/introduction-finite-element-methods", "type": "lectures", "by": "Krishna Garikipati, University of Michigan, 2013", "level": 2, "note": "About 50 hours of lectures, starting from one-dimensional elliptic problems, with coding assignments."}, {"title": "The FEniCSx tutorial", "url": "https://jsdokken.com/dolfinx-tutorial/", "type": "tutorial", "by": "Jørgen Dokken", "level": 2, "note": "Write the weak form in Python and solve Poisson, heat, elasticity, and Navier-Stokes problems."}, {"title": "MIT 2.092: Finite Element Analysis of Solids and Fluids I", "url": "https://ocw.mit.edu/courses/2-092-finite-element-analysis-of-solids-and-fluids-i-fall-2009/", "type": "lectures", "by": "Klaus-Jürgen Bathe, MIT OCW, 2009", "level": 3, "note": "Solids, structures, fluids, and heat transfer, steady and dynamic, linear and nonlinear."}, {"title": "A finite element Poisson solver from scratch", "url": "https://jsdokken.com/dolfinx-tutorial/chapter4/convergence.html", "type": "project", "by": "Built on the FEniCSx tutorial by Dokken, Langtangen, and Logg", "level": 2, "build": "A NumPy finite element solver on a triangulated unit square: linear element stiffness matrices assembled into a sparse system, Dirichlet conditions, and the L2 error against the exact solution cos(2πx)cos(2πy).", "teaches": "What a library like FEniCS does under the hood, and how a measured convergence rate catches assembly bugs that a plausible picture hides.", "time": "a weekend", "made": true, "done": "Halving the mesh size cuts the L2 error about fourfold, a rate near 2 like the tutorial’s run for degree 1 elements (1.61, 1.89, 1.97, 1.99)."}]}, {"id": "options", "title": "Options and derivatives", "kind": "concept", "track": "quant", "pre": ["prob"], "frontier": false, "core": "An option is the right, not the obligation, to buy or sell at a fixed price, so its payoff is a hockey stick. No-arbitrage sets its price: if stock and cash can replicate the payoff, the option costs what the replica costs, whatever anyone expects.", "reach": "Stochastic calculus takes the replication argument to continuous time, fixed income applies it to interest rates, and microstructure covers the market makers who quote options.", "uses": "Hedging by airlines, farmers, and investors, employee stock options, market making at trading firms, and valuing projects as real options. ML research here includes deep hedging, training networks to hedge directly.", "worth": "you are aiming at quant trading or want to understand the options in a compensation package; skip it otherwise.", "resources": [{"title": "Akuna Options 101", "url": "https://akunacapital.com/options-101", "type": "course", "by": "Akuna Capital, free", "level": 1, "note": "Open outcry, electronic trading, and the option greeks, taught by an options market maker."}, {"title": "Financial Engineering and Risk Management", "url": "https://www.coursera.org/specializations/financialengineering", "type": "course", "by": "Martin Haugh, Garud Iyengar, Columbia, Coursera", "level": 2, "note": "Course 1 prices swaps and options with the binomial model, one period and then many, and ends at Black-Scholes."}, {"title": "Columbia IEOR E4706: Foundations of Financial Engineering", "url": "https://martin-haugh.github.io/teaching/foundations-fe/", "type": "notes", "by": "Martin Haugh, Columbia, 2016", "level": 2, "note": "The notes on forwards, swaps, futures and options, then martingale pricing, the idea underneath all of it."}, {"title": "IEOR E4706 Assignment 2: binomial models and state prices", "url": "https://martin-haugh.github.io/files/FoundationsFE/Assign2.pdf", "type": "project", "by": "Martin Haugh, Columbia, 2016", "level": 2, "note": "The questions cite examples from the course’s notes on martingale pricing.", "build": "A 15 period binomial model calibrated to Black-Scholes that prices American calls and puts and checks put-call parity, plus state prices and replicating portfolios in small markets.", "teaches": "Pricing by backward induction on a tree, when early exercise pays, and how state prices and risk-neutral probabilities encode no-arbitrage.", "time": "a day"}]}, {"id": "stochcalc", "title": "Stochastic calculus and Black-Scholes", "kind": "concept", "track": "quant", "pre": ["stochproc", "pde", "options"], "frontier": false, "core": "Brownian motion wiggles so finely that its squared increments add up to elapsed time, adding a second-order term to the chain rule (Ito’s lemma). For a hedged option it gives the Black-Scholes equation; the price is the discounted expected payoff under risk-neutral probabilities.", "reach": "The same Ito calculus drives score SDEs and diffusion models in the machine learning roadmap.", "uses": "Pricing and hedging derivatives at banks and trading firms, and modeling interest rates. Score-based diffusion models are stochastic differential equations, so Ito calculus is the actual math of their training and sampling, not an analogy.", "worth": "you want quant finance or a rigorous grasp of diffusion models; heavy prerequisites, so skip it if the discrete-time picture is enough.", "resources": [{"title": "MIT 18.S096: Topics in Mathematics with Applications in Finance", "url": "https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/", "type": "lectures", "by": "Kempthorne, Lee, Strela, Xia, MIT OCW, 2013", "level": 1, "note": "Lectures 5, 17, 18, 19, and 21: stochastic processes, Ito calculus, Black-Scholes and risk-neutral valuation, and SDEs."}, {"title": "Columbia IEOR E4706: Foundations of Financial Engineering", "url": "https://martin-haugh.github.io/teaching/foundations-fe/", "type": "notes", "by": "Martin Haugh, Columbia, 2016", "level": 2, "note": "The notes on stochastic calculus and on Black-Scholes, short and aimed at pricing."}, {"title": "Stochastic Calculus for Finance II: Continuous-Time Models", "url": "https://link.springer.com/book/9780387401010", "type": "book", "by": "Steven Shreve, 2004", "level": 2, "note": "Stochastic calculus, martingales, risk-neutral pricing, exotic options, and term structure models in continuous time.", "paid": true}, {"title": "The Pricing of Options and Corporate Liabilities", "url": "https://www.jstor.org/stable/1831029", "type": "paper", "by": "Fischer Black, Myron Scholes, 1973", "level": 2, "note": "The original derivation.", "paid": true}, {"title": "MIT 6.262: Discrete Stochastic Processes", "url": "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/", "type": "lectures", "by": "Robert Gallager, MIT OCW, 2011", "level": 3, "note": "Lectures 20 to 24: random walks and martingales, the discrete theory under risk-neutral pricing."}, {"title": "IEOR E4706 Assignment 7: delta hedging and Black-Scholes", "url": "https://martin-haugh.github.io/files/FoundationsFE/Assign7.pdf", "type": "project", "by": "Martin Haugh, Columbia, 2016", "level": 2, "build": "A simulator that delta hedges a European option along random stock paths, derivations of the Black-Scholes equation with dividends and of options on futures, and an optional implied volatility surface.", "teaches": "That the Black-Scholes price is the cost of a hedge: how the hedging error shrinks with rebalancing and goes wrong when implied and realized volatility differ.", "time": "a weekend"}]}, {"id": "portfolio", "title": "Portfolio theory and risk", "kind": "concept", "track": "quant", "pre": ["prob", "convex"], "frontier": false, "core": "Assets that do not move together partly cancel each other’s swings, so diversifying cuts risk but not expected return. The best portfolios trade mean against variance along an efficient frontier, a quadratic program; if everyone does this, expected return depends only on market beta (CAPM).", "reach": "An application of convex optimization; microstructure adds trading costs, and the same tradeoff sizes positions in any quant strategy.", "uses": "Asset management, pension funds, robo-advisers, bank risk limits, and position sizing at quant funds. ML enters as the return and risk forecasts this optimization consumes.", "worth": "you are heading into quant finance or asset management; skip it otherwise, since it adds little to ML research.", "resources": [{"title": "MIT 18.S096: Topics in Mathematics with Applications in Finance", "url": "https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/", "type": "lectures", "by": "Kempthorne, Lee, Strela, Xia, MIT OCW, 2013", "level": 1, "note": "Lecture 14 (portfolio theory) and lecture 7 (value at risk) cover the two halves of this node."}, {"title": "Columbia IEOR E4706: Foundations of Financial Engineering", "url": "https://martin-haugh.github.io/teaching/foundations-fe/", "type": "notes", "by": "Martin Haugh, Columbia, 2016", "level": 2, "note": "The notes on mean-variance analysis and the CAPM."}, {"title": "Portfolio Selection", "url": "https://www.jstor.org/stable/2975974", "type": "paper", "by": "Harry Markowitz, Journal of Finance, 1952", "level": 2, "note": "The original mean-variance paper.", "paid": true}, {"title": "Financial Engineering and Risk Management", "url": "https://www.coursera.org/specializations/financialengineering", "type": "course", "by": "Martin Haugh, Garud Iyengar, Columbia, Coursera", "level": 2, "note": "Course 3, Optimization Methods in Asset Management: where mean-variance breaks in practice, VaR and CVaR, and transaction costs."}, {"title": "Multi-Period Trading via Convex Optimization", "url": "https://arxiv.org/abs/1705.00109", "type": "paper", "by": "Boyd et al., 2017", "level": 3, "note": "Portfolio choice as a convex problem solved every period, with costs, constraints, and risk."}, {"title": "IEOR E4706 Assignment 5: mean-variance and the CAPM", "url": "https://martin-haugh.github.io/files/FoundationsFE/Assign5.pdf", "type": "project", "by": "Martin Haugh, Columbia, 2016", "level": 2, "build": "Proofs and calculations on the efficient frontier: the two fund theorem, the portfolio that tracks a benchmark with least variance, project evaluation by CAPM beta, and how leverage changes beta.", "teaches": "The algebra behind the efficient frontier and the CAPM, so that the formulas used in practice stop being black boxes.", "time": "a day"}, {"title": "Mean-variance against 1/N, out of sample", "url": "https://academic.oup.com/rfs/article/22/5/1915/1592901", "type": "project", "by": "Built on DeMiguel, Garlappi, Uppal, 2009", "level": 3, "build": "Rolling window mean-variance portfolios on the 25 size and book-to-market portfolios from Ken French’s data library, compared with equal weights by out of sample Sharpe ratio, then a simulation that lengthens the estimation window.", "teaches": "That estimation error in expected returns can wipe out the gain from optimizing, and how much data the optimizer needs before it pays.", "time": "a weekend", "made": true, "done": "Sample mean-variance trails 1/N out of sample, and in simulation needs an estimation window on the order of 3000 months for 25 assets to win, as the abstract reports."}]}, {"id": "fixedincome", "title": "Fixed income and the term structure", "kind": "concept", "track": "quant", "pre": ["options", "stochcalc"], "frontier": false, "core": "A bond’s price is its cash flows discounted along the yield curve, so price falls when rates rise, and duration measures by how much. The curve itself moves randomly; short rate models fit today’s curve on a lattice and price rate options by no-arbitrage.", "reach": "Uses the no-arbitrage pricing of options; the continuous-time models (Vasicek, HJM) need stochastic calculus.", "uses": "Bond trading, central bank policy analysis, mortgages, pension liability matching, and interest-rate risk at banks. Ties to ML research are slim beyond forecasting.", "worth": "you are heading to a rates desk, bank, or macro fund; skip it otherwise, since it is specialized.", "resources": [{"title": "Columbia IEOR E4706: Foundations of Financial Engineering", "url": "https://martin-haugh.github.io/teaching/foundations-fe/", "type": "notes", "by": "Martin Haugh, Columbia, 2016", "level": 1, "note": "The prerequisite notes on deterministic cash flows (yields and duration), then the notes on term structure lattice models."}, {"title": "Financial Engineering and Risk Management", "url": "https://www.coursera.org/specializations/financialengineering", "type": "course", "by": "Martin Haugh, Garud Iyengar, Columbia, Coursera", "level": 2, "note": "Course 2, Term-Structure and Credit Derivatives: lattice models, calibrating Black-Derman-Toy, swaptions, credit default swaps, and mortgage-backed securities."}, {"title": "MIT 18.S096: Topics in Mathematics with Applications in Finance", "url": "https://ocw.mit.edu/courses/18-s096-topics-in-mathematics-with-applications-in-finance-fall-2013/", "type": "lectures", "by": "Kempthorne, Lee, Strela, Xia, MIT OCW, 2013", "level": 3, "note": "Lecture 24: the HJM model for interest rates and credit, taught by a practitioner."}, {"title": "IEOR E4706 Assignment 4: term structure lattices", "url": "https://martin-haugh.github.io/files/FoundationsFE/Assign4.pdf", "type": "project", "by": "Martin Haugh, Columbia, 2016", "level": 2, "note": "Questions 3 to 5, which reproduce examples from the course’s term structure notes.", "build": "State prices on a short rate lattice that price a zero coupon bond, an option, a forward, and a caplet, then a calibrated Black-Derman-Toy lattice for European and Bermudan payer swaptions.", "teaches": "How a lattice fitted to today’s yield curve prices rate derivatives, and how far a swaption price moves with the volatility parameter you calibrate.", "time": "a weekend"}]}, {"id": "microstructure", "title": "Market microstructure and trading", "kind": "concept", "track": "quant", "pre": ["portfolio", "stochproc"], "frontier": true, "core": "Prices form in a limit order book, where market makers post bids and asks and others trade against them. The spread pays makers for inventory risk and adverse selection, the chance the other side knows more; Kyle’s model shows how informed trading leaks into prices.", "reach": "Builds on portfolio theory and stochastic processes; market making is a stochastic control problem, and judging a backtest needs the testing discipline of biostatistics.", "uses": "Market making, high-frequency trading, exchange design, execution algorithms, and trading cost analysis at funds. ML predicts short-horizon price moves here, and reinforcement learning for market making and execution is studied actively.", "worth": "you are aiming at a quant trading firm; skip it otherwise, because the material is specialized and much practice is proprietary.", "resources": [{"title": "Limit Order Books", "url": "https://arxiv.org/abs/1012.0349", "type": "paper", "by": "Gould, Porter, Williams, et al., 2013", "level": 2, "note": "A survey of what order book data shows and how well the models reproduce it, ending with open questions."}, {"title": "Trading and Exchanges: Market Microstructure for Practitioners", "url": "https://global.oup.com/academic/product/trading-and-exchanges-9780195144703", "type": "book", "by": "Larry Harris, Oxford", "level": 1, "note": "Who trades, why, and how auctions, order types, and brokered markets work.", "paid": true}, {"title": "Continuous Auctions and Insider Trading", "url": "https://www.jstor.org/stable/1913210", "type": "paper", "by": "Albert Kyle, Econometrica, 1985", "level": 2, "note": "How an informed trader hides among noise traders and how prices absorb the information.", "paid": true}, {"title": "Trades, Quotes and Prices", "url": "https://www.cambridge.org/core/books/trades-quotes-and-prices/029A71078EE4C41C0D5D4574211AB1B5", "type": "book", "by": "Bouchaud, Bonart, Donier, Gould, 2018", "level": 3, "note": "Order flow and price impact from the data up, by researchers at a quant fund.", "paid": true}, {"title": "Dealing with the Inventory Risk: A Solution to the Market Making Problem", "url": "https://arxiv.org/abs/1105.3115", "type": "paper", "by": "Guéant, Lehalle, Fernandez-Tapia, 2011", "level": 3, "note": "Solves the Avellaneda-Stoikov market making problem as stochastic control and gives the optimal quotes."}, {"title": "How I Develop Trading Strategies: Permutation Tests", "url": "https://www.youtube.com/watch?v=NLBXgSmRBgU", "type": "video", "by": "neurotrader", "level": 1, "note": "Permutation tests that check whether a backtest beats chance."}, {"title": "IMC Prosperity", "url": "https://prosperity.imc.com/", "type": "project", "by": "IMC Trading, yearly since 2023", "level": 1, "note": "Runs each April, with a tutorial round from mid-March.", "build": "Trading bots in Python for five rounds of a simulated market, plus manual trading puzzles, scored on profit against other teams of students.", "teaches": "Market making, fair value estimates, and position limits under competition, with a leaderboard as the judge.", "time": "two weeks", "signature": true}, {"title": "Simulate the Avellaneda-Stoikov market maker", "url": "https://math.nyu.edu/~avellane/HighFrequencyTrading.pdf", "type": "project", "by": "Built on Avellaneda, Stoikov, 2008", "level": 2, "build": "A simulated market where a Brownian mid-price moves and market orders hit your quotes at rates that fall with distance, comparing the paper’s inventory strategy with a symmetric one of the same spread.", "teaches": "What inventory risk costs a market maker, and how skewing quotes against the position trades a little average profit for much less variance.", "time": "a day", "made": true, "done": "Over 1000 runs with γ = 0.1, profit standard deviation comes out near 6.6 for the inventory strategy and 12.7 for the symmetric one, as in Table 1."}]}, {"id": "webdev", "title": "Web development, front end and back end", "kind": "concept", "track": "software", "pre": [], "frontier": false, "core": "A web app is a browser and a server talking HTTP. The browser renders HTML, styles it with CSS, and runs JavaScript that updates the page and calls the server’s API; the server checks the request, queries a database, and returns JSON or HTML.", "reach": "Every web app is an attack surface, and serving one to millions of users is system design.", "uses": "Every website and web app, internal tools, dashboards, and the demos people use to try ML models. Shipping a model to users usually means a web front end and an API around it.", "worth": "you want to ship your own tools, demos, or products; the basics and one framework go far.", "resources": [{"title": "Full Stack Open", "url": "https://fullstackopen.com/en/", "type": "course", "by": "University of Helsinki", "level": 1, "note": "Parts 0 to 5: how web apps work, React, a Node and Express server, testing, and user administration; Part 13 adds a relational database."}, {"title": "Learn web development", "url": "https://developer.mozilla.org/en-US/docs/Learn_web_development", "type": "tutorial", "by": "MDN, Mozilla", "level": 1, "note": "The core modules on structuring content with HTML, CSS styling and layout, and dynamic scripting with JavaScript."}, {"title": "High Performance Browser Networking", "url": "https://hpbn.co/", "type": "book", "by": "Ilya Grigorik, O’Reilly, 2013", "level": 3, "note": "Free online: what sits under a page load, from latency and TCP to TLS, HTTP/2, and WebSocket."}]}, {"id": "swe", "title": "Software engineering practice", "kind": "concept", "track": "software", "pre": [], "frontier": false, "core": "Code is read and changed far more often than it is written, so practice aims to make change cheap and safe: version control for every edit, automated tests that catch regressions, code review, modules with simple interfaces that hide complexity, and automated builds and deploys.", "reach": "The habits that system design assumes: many engineers changing one codebase without breaking it.", "uses": "Every codebase more than one person maintains, and research code others must rerun. Reproducible ML experiments depend on version control, tests, and clean interfaces as much as on the model.", "worth": "you write code anyone else will read, your future self included; nobody should skip it, but it is learned mostly by doing.", "resources": [{"title": "The Missing Semester of Your CS Education", "url": "https://missing.csail.mit.edu/", "type": "lectures", "by": "MIT, 2026", "level": 1, "note": "The shell, the development environment, debugging and profiling, Git, packaging and shipping, agentic coding, and code quality."}, {"title": "A Philosophy of Software Design", "url": "https://www.youtube.com/watch?v=bmSAYlu0NcY", "type": "video", "by": "John Ousterhout, Talks at Google, 2018", "level": 1, "note": "Deep modules: a simple interface over a large implementation, as the main tool against complexity."}, {"title": "Software Engineering at Google", "url": "https://abseil.io/resources/swe-book", "type": "book", "by": "Winters, Manshreck, Wright, O’Reilly, 2020", "level": 2, "note": "Free online. Chapters 9 (code review), 11 to 14 (testing), 16 (version control), and 23 (continuous integration)."}, {"title": "Build Your Own X", "url": "https://github.com/codecrafters-io/build-your-own-x", "type": "code", "by": "CodeCrafters, GitHub list", "level": 2, "note": "Tutorials for rebuilding the tools you use, such as Git, a shell, a database, or a web server."}]}, {"id": "databases", "title": "Database systems", "kind": "concept", "track": "software", "pre": ["ds", "os"], "frontier": false, "core": "A database stores rows in fixed-size disk pages, finds them through indexes such as B+ trees, runs SQL as a plan of scans and joins chosen by cost, and keeps concurrent transactions correct through crashes with locks or versions and a write-ahead log.", "reach": "Replicating and partitioning this across machines is distributed systems; SQL injection attacks the query layer.", "uses": "Banking, e-commerce, every app backend, and analytics warehouses like Snowflake and BigQuery. Vector databases for retrieval-augmented generation add nearest-neighbor indexes over embeddings to the same ideas.", "worth": "you build data pipelines, products, or retrieval systems; an ML researcher needs SQL and indexes, not storage engine internals.", "resources": [{"title": "CMU 15-445/645: Database Systems", "url": "https://15445.courses.cs.cmu.edu/", "type": "course", "by": "Andy Pavlo, CMU, Fall 2026", "level": 1, "note": "Recorded lectures on storage, buffer pools, hash tables, B+ trees, query execution, concurrency control, logging, and recovery, with C++ projects."}, {"title": "Designing Data-Intensive Applications", "url": "https://dataintensive.net/", "type": "book", "by": "Martin Kleppmann, O’Reilly, 2017", "level": 2, "note": "Chapter 3 (storage and retrieval: log-structured engines versus B-trees) and Chapter 7 (transactions and isolation levels).", "paid": true}, {"title": "Let’s Build a Simple Database", "url": "https://cstack.github.io/db_tutorial/", "type": "project", "by": "cstack", "level": 2, "build": "A small SQLite clone in C: a REPL, a compiler and virtual machine for statements, and rows stored on disk in a B-tree.", "teaches": "How a database lays rows out in pages and finds them with a B-tree.", "time": "a weekend"}, {"title": "Readings in Database Systems (the Red Book), 5th edition", "url": "http://www.redbook.io/", "type": "book", "by": "Bailis, Hellerstein, Stonebraker, 2015", "level": 3, "note": "Short opinionated chapters that introduce the classic papers; start with Techniques Everyone Should Know."}]}, {"id": "distributed", "title": "Distributed systems and consensus", "kind": "concept", "track": "software", "pre": ["networking", "databases"], "frontier": false, "core": "Machines with no shared clock, each able to crash or be cut off, must act as one. A node cannot tell a crashed peer from a slow one, so consensus protocols like Raft and Paxos keep a replicated log consistent whenever a majority can communicate.", "reach": "Blockchains run consensus among strangers; system design applies these trade-offs to real services.", "uses": "Cloud services, replicated databases like Spanner, the etcd store behind Kubernetes, and payment systems. Large-model training is itself a distributed system, where GPU failures are routine and checkpointing and parallelism must survive them.", "worth": "you work on training infrastructure, serving, or backends; consensus proofs can wait unless you build databases.", "resources": [{"title": "Distributed Systems lecture series", "url": "https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB", "type": "lectures", "by": "Martin Kleppmann, Cambridge, 2020", "level": 1, "note": "Short videos on system models, clocks and causality, broadcast, replication, consensus, and replica consistency; the lecture notes PDF follows the same eight chapters."}, {"title": "6.5840: Distributed Systems", "url": "https://pdos.csail.mit.edu/6.824/", "type": "course", "by": "MIT", "level": 2, "note": "Go labs: MapReduce, a key/value server, Raft, a key/value store on Raft, and a sharded store, tested against crashes and partitions."}, {"title": "In Search of an Understandable Consensus Algorithm (Extended Version)", "url": "https://raft.github.io/raft.pdf", "type": "paper", "by": "Ongaro, Ousterhout, 2014", "level": 2, "note": "Section 5 is the algorithm: leader election, log replication, and safety. Section 7 adds log compaction."}, {"title": "Consistency Models", "url": "https://jepsen.io/consistency", "type": "notes", "by": "Jepsen", "level": 3, "note": "A reference map of consistency models and the anomalies each one allows, with links to the papers that define them."}, {"title": "Time, Clocks, and the Ordering of Events in a Distributed System", "url": "https://lamport.azurewebsites.net/pubs/time-clocks.pdf", "type": "paper", "by": "Leslie Lamport, 1978", "level": 3, "note": "The happens-before relation and logical clocks, the vocabulary every later paper uses."}, {"title": "6.5840 Lab 3: Raft", "url": "https://pdos.csail.mit.edu/6.824/labs/lab-raft1.html", "type": "project", "by": "MIT 6.5840", "level": 2, "build": "The Raft consensus protocol in Go: leader election, log replication, persistence, and log compaction with snapshots, tested against a network that drops, delays, and reorders messages.", "teaches": "Why consensus is hard, through the failures the test harness creates on purpose.", "time": "two weeks", "signature": true}]}, {"id": "sysdesign", "title": "System design at scale", "kind": "concept", "track": "software", "pre": ["distributed", "swe"], "frontier": false, "core": "Design a large service by estimating its load first, then splitting the work: stateless servers behind load balancers, caches for hot reads, replicated and sharded storage, and queues for slow jobs. Each choice trades latency, consistency, cost, and failure behavior against the others.", "reach": "Where databases, consensus, and engineering practice meet in one design.", "uses": "Building services like search, chat, video streaming, and ride hailing for millions of users, and LLM serving stacks with load balancing, batching, and caching. It is also the standard senior engineering interview.", "worth": "you will build or run production services or face senior interviews; skip it if your work stays in notebooks and papers.", "resources": [{"title": "The System Design Primer", "url": "https://github.com/donnemartin/system-design-primer", "type": "notes", "by": "Donne Martin", "level": 1, "note": "Start at System design topics: start here, then work the solved questions such as Pastebin and the Twitter timeline."}, {"title": "Site Reliability Engineering", "url": "https://sre.google/sre-book/table-of-contents/", "type": "book", "by": "Beyer, Jones, Petoff, Murphy, Google, 2016", "level": 2, "note": "Free online. Chapters 4 (service level objectives), 21 (handling overload), and 22 (cascading failures): how large services stay up."}, {"title": "The Tail at Scale", "url": "https://research.google/pubs/the-tail-at-scale/", "type": "paper", "by": "Dean, Barroso, CACM, 2013", "level": 3, "note": "Why fanning a request out to many servers turns rare slow responses into common ones, and the hedged requests that fix it."}, {"title": "System Design in a Hurry", "url": "https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction", "type": "tutorial", "by": "Hello Interview", "level": 1, "note": "A delivery framework, core concepts, key technologies, and common patterns for practicing designs under a time limit."}]}, {"id": "classical", "title": "Classical control and PID", "kind": "concept", "track": "control", "pre": ["diffeq", "signals"], "frontier": false, "core": "Measure the output, compare it with the setpoint, and push the plant with a correction proportional to the error, its integral, and its derivative (PID). Feedback moves the closed-loop poles; the loop is stable when all of them lie in the left half plane.", "reach": "State-space methods extend it to many inputs and outputs; the same loops steer quadrotors, rockets, and disk drives.", "uses": "Thermostats, cruise control, drones, hard drive heads, chemical plants, and power grids; most industrial control loops are PID. Momentum optimizers have been analyzed as PID controllers, a conceptual link to training.", "worth": "you build robots, drones, or anything physical that must hold a setpoint; skip it if you never touch hardware or dynamics.", "resources": [{"title": "Classical Control Theory", "url": "https://www.youtube.com/playlist?list=PLUMWjy5jgHK1NC52DXXrriwihVrYZKqjk", "type": "lectures", "by": "Brian Douglas, 2012 to 2015", "level": 1, "note": "Hand-drawn lectures on closed-loop control, transfer functions, the Laplace transform, Bode plots, and steady-state error."}, {"title": "Understanding PID Control", "url": "https://www.youtube.com/playlist?list=PLn8PRpmsu08pQBgjxYFXSsODEF3Jqmm-y", "type": "video", "by": "MATLAB (Brian Douglas), 2018", "level": 1, "note": "Short videos on what each term does, integral windup, filtering the derivative, and tuning."}, {"title": "Feedback Systems: An Introduction for Scientists and Engineers (2nd edition)", "url": "http://www.cds.caltech.edu/~murray/books/AM08/pdf/fbs-public_24Jul2020.pdf", "type": "book", "by": "Karl Johan Åström, Richard Murray, 2021", "level": 2, "note": "Chapters 9 to 11: transfer functions and Bode plots, the Nyquist criterion and stability margins, then PID control and tuning."}]}, {"id": "statespace", "title": "State-space control and LQR", "kind": "concept", "track": "control", "pre": ["classical", "linalg"], "frontier": false, "core": "Write the dynamics as dx/dt = Ax + Bu. If the system is controllable, state feedback u = -Kx can place the closed-loop eigenvalues anywhere; LQR picks the K that minimizes a quadratic cost on state error and control effort by solving a Riccati equation.", "reach": "Kalman filtering is its dual, MPC adds constraints, and linearizing around a trajectory extends it to robots and spacecraft.", "uses": "Aircraft autopilots, satellite pointing, balancing robots, and power electronics. State-space sequence models such as S4 and Mamba take the x’ = Ax + Bu form from control theory and learn its matrices as network layers.", "worth": "you work on robotics or control, or want to see where S4 and Mamba come from; LQR plus controllability covers most needs.", "resources": [{"title": "Control Bootcamp", "url": "https://www.youtube.com/playlist?list=PLMrJAkhIeNNR20Mz-VpzgfQs5zrYi085m", "type": "lectures", "by": "Steve Brunton, University of Washington, 2017", "level": 1, "note": "Short lectures on controllability, pole placement, and LQR for an inverted pendulum on a cart, with code."}, {"title": "Feedback Systems: An Introduction for Scientists and Engineers (2nd edition)", "url": "http://www.cds.caltech.edu/~murray/books/AM08/pdf/fbs-public_24Jul2020.pdf", "type": "book", "by": "Karl Johan Åström, Richard Murray, 2021", "level": 2, "note": "Chapters 6 and 7: linear systems, reachability, eigenvalue placement, and Section 7.5 on linear quadratic regulators."}, {"title": "Underactuated Robotics", "url": "https://underactuated.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT, 2024", "level": 2, "note": "Chapter 8 derives LQR from dynamic programming and uses it to stabilize nonlinear robots, with notebooks."}, {"title": "EE363: Linear Dynamical Systems", "url": "https://ee363.stanford.edu/lectures.html", "type": "notes", "by": "Sanjay Lall, Stanford, 2026", "level": 3, "note": "Slides on finite and infinite horizon LQR, the Riccati recursion, and the Kalman filter."}]}, {"id": "estimation", "title": "Estimation and Kalman filters", "kind": "concept", "track": "control", "pre": ["statespace", "prob"], "frontier": false, "core": "Track a hidden state by alternating two steps: predict it forward with the model, which spreads the uncertainty, then correct it with a measurement, weighting each by its confidence. For linear models with Gaussian noise this Kalman filter is optimal; the EKF linearizes nonlinear ones.", "reach": "Navigation and headset tracking fuse IMUs with cameras or GPS this way; paired with LQR it gives LQG control.", "uses": "GPS and inertial navigation in phones, aircraft, and spacecraft, robot localization, radar tracking, and sensor fusion in self-driving cars. The Kalman filter is exact Bayesian inference for a linear Gaussian latent-variable model.", "worth": "you work on robotics, tracking, or sequential Bayesian models; skip it if your data never arrives over time from noisy sensors.", "resources": [{"title": "How a Kalman filter works, in pictures", "url": "https://www.bzarg.com/p/how-a-kalman-filter-works-in-pictures/", "type": "blog", "by": "Tim Babb, 2015", "level": 1, "note": "The predict and update equations, derived from multiplying two Gaussians."}, {"title": "Kalman and Bayesian Filters in Python", "url": "https://github.com/rlabbe/Kalman-and-Bayesian-Filters-in-Python", "type": "book", "by": "Roger Labbe", "level": 2, "note": "Notebooks 1 to 8 build the linear Kalman filter up from a g-h filter; 9 to 12 cover nonlinear filtering, the UKF, the EKF, and particle filters."}, {"title": "Self-Driving Cars Specialization", "url": "https://www.coursera.org/specializations/self-driving-cars", "type": "course", "by": "University of Toronto, Coursera", "level": 2, "note": "Course 2, State Estimation and Localization: least squares, extended and unscented Kalman filters, and GPS, IMU, and lidar fusion."}, {"title": "State Estimation for Robotics (2nd edition)", "url": "http://asrl.utias.utoronto.ca/~tdb/bib/barfoot_ser24.pdf", "type": "book", "by": "Timothy Barfoot, 2024", "level": 3, "note": "Chapter 3 derives the Kalman filter from batch linear Gaussian estimation; Chapter 4 handles nonlinear, non-Gaussian estimation."}]}, {"id": "kinematics", "title": "Robot kinematics and dynamics", "kind": "concept", "track": "control", "pre": ["mechanics", "linalg"], "frontier": false, "core": "A robot’s pose is a rigid transform, and forward kinematics multiplies one matrix exponential per joint (the product of exponentials). The Jacobian maps joint velocities to end-effector velocity, and the dynamics take the form M(q)q’’ + c(q, q’) + g(q) = τ.", "reach": "Motion planning searches these joint spaces; control and headset tracking reuse the same rigid-body math.", "uses": "Industrial and surgical robot arms, animation rigs, motion capture, and humanoids. Robot learning policies output joint commands or end-effector poses, so learned controllers still pass through this math.", "worth": "you want to do robot learning or embodied AI; skip it if your models never control a physical or simulated body.", "resources": [{"title": "Modern Robotics: Mechanics, Planning, and Control", "url": "https://www.coursera.org/specializations/modernrobotics", "type": "course", "by": "Kevin Lynch, Northwestern, Coursera", "level": 1, "note": "Courses 1 to 3 (foundations of robot motion, kinematics, dynamics) follow the book with graded exercises."}, {"title": "Modern Robotics", "url": "https://hades.mech.northwestern.edu/index.php/Modern_Robotics", "type": "book", "by": "Kevin Lynch, Frank Park, 2017", "level": 2, "note": "Chapters 3 to 6 and 8: rigid-body motions, forward, velocity, and inverse kinematics, and open-chain dynamics; free preprint and videos."}, {"title": "Robotic Manipulation", "url": "https://manipulation.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT", "level": 2, "note": "Chapter 3 runs spatial algebra, forward kinematics, and Jacobian-based inverse kinematics on a simulated arm in Drake."}, {"title": "Modern Robotics capstone: mobile manipulation", "url": "https://hades.mech.northwestern.edu/index.php/Mobile_Manipulation_Capstone", "type": "project", "by": "Lynch, Park, Northwestern", "level": 2, "build": "Software that plans a trajectory for a KUKA youBot, simulates its kinematics, and uses feedback control to pick up a cube and place it, checked in the CoppeliaSim simulator.", "teaches": "Kinematics, Jacobians, trajectory generation, and feedback control used together on one robot.", "time": "two weeks"}]}, {"id": "planning", "title": "Motion planning", "kind": "concept", "track": "control", "pre": ["kinematics", "graphs"], "frontier": false, "core": "Plan in configuration space, where the robot is a single point and obstacles grow into forbidden regions. In low dimensions, search a grid with A*; in high dimensions, sample random configurations and connect collision-free ones into a tree (RRT) or a roadmap (PRM).", "reach": "Trajectory optimization refines these paths under dynamics; game engines use the same graph search for characters.", "uses": "Robot arms, self-driving cars, warehouse robots, drones, video game characters, and even protein folding pathways. Diffusion models now generate candidate trajectories in planning research, with classical checks for collisions.", "worth": "you work on robotics or autonomous vehicles; skip it if your ML never moves anything through space.", "resources": [{"title": "Introduction to the A* Algorithm", "url": "https://www.redblobgames.com/pathfinding/a-star/introduction.html", "type": "blog", "by": "Amit Patel, Red Blob Games, 2014", "level": 1, "note": "Interactive diagrams from breadth-first search to Dijkstra’s algorithm to A*."}, {"title": "Planning Algorithms", "url": "http://lavalle.pl/planning/", "type": "book", "by": "Steven LaValle, 2006", "level": 2, "note": "Chapter 4 builds configuration space and its obstacles; Chapter 5 covers sampling-based planning, RRTs, and PRMs."}, {"title": "Robotic Manipulation", "url": "https://manipulation.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT", "level": 2, "note": "Chapter 6: inverse kinematics as optimization, kinematic trajectory optimization, RRT and PRM, and graphs of convex sets for arms."}, {"title": "Sampling-based Algorithms for Optimal Motion Planning", "url": "https://arxiv.org/abs/1105.1186", "type": "paper", "by": "Karaman, Frazzoli, 2011", "level": 3, "note": "Introduces RRT* and PRM*, which converge to optimal paths as the number of samples grows."}]}, {"id": "mpc", "title": "Optimal control and MPC", "kind": "concept", "track": "control", "pre": ["statespace", "convex"], "frontier": false, "core": "At each time step, solve a finite-horizon optimal control problem from the current state, with the model and constraints written in, apply only the first input, then re-solve from the next measurement. Re-solving supplies the feedback.", "reach": "Extends LQR to constraints; powered descent guidance and legged robots solve it in real time.", "uses": "Refineries and chemical plants, where it started, plus autonomous cars, legged robots, rocket landing guidance, and building climate control. Model-based reinforcement learning plans through learned models in the same receding-horizon way.", "worth": "you work on robotics, autonomy, or model-based RL; it needs convex optimization and state-space control first, so skip it otherwise.", "resources": [{"title": "Understanding Model Predictive Control", "url": "https://www.youtube.com/playlist?list=PLn8PRpmsu08ozoeoXgxPSBKLyd4YEHww8", "type": "video", "by": "MATLAB (Brian Douglas), 2018", "level": 1, "note": "Parts 1 to 4: why MPC, how the receding horizon works, its design parameters, and adaptive and nonlinear variants."}, {"title": "Underactuated Robotics", "url": "https://underactuated.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT, 2024", "level": 2, "note": "Chapter 7 for dynamic programming; Chapter 10 for trajectory optimization, finite-horizon LQR, and receding-horizon MPC."}, {"title": "Model Predictive Control: Theory, Computation, and Design (2nd edition)", "url": "https://sites.engineering.ucsb.edu/~jbraw/mpc/", "type": "book", "by": "Rawlings, Mayne, Diehl, 2017", "level": 3, "note": "Free PDF. Chapter 1 builds the MPC regulator, state estimation, and offset-free tracking; Chapter 2 proves stability."}, {"title": "RoboRacer (F1TENTH) labs", "url": "https://f1tenth-coursekit.readthedocs.io/en/latest/assignments/labs/index.html", "type": "project", "by": "RoboRacer, University of Pennsylvania", "level": 2, "build": "Autonomy for a 1/10 scale race car in simulation and on the car: emergency braking, PID wall following, follow the gap, SLAM and pure pursuit, RRT planning, and model predictive control.", "teaches": "A full robotics stack on one vehicle, and how controllers tuned in simulation behave at speed on a real car.", "time": "a term", "signature": true}]}, {"id": "cellbio", "title": "Cell and molecular biology", "kind": "concept", "track": "biosci", "pre": ["genchem"], "frontier": false, "core": "A cell stores instructions in DNA, copies them into RNA, and translates RNA into proteins that do nearly all the work. A membrane separates inside from outside, and signaling proteins sense the surroundings and switch genes on and off.", "reach": "Genetics, neuroscience, and biochemistry assume it; single-cell and protein models in machine learning are trained on its measurements.", "uses": "Medicine, drug development, cancer research, and vaccines, including mRNA vaccines that use the cell’s own protein-making machinery. Single-cell foundation models and virtual cell projects train on measurements this field defines.", "worth": "you want to do ML for biology; skip it otherwise, but it is a modest investment that makes biology papers readable.", "resources": [{"title": "MIT 7.016: Introductory Biology", "url": "https://ocw.mit.edu/courses/7-016-introductory-biology-fall-2018/", "type": "lectures", "by": "Barbara Imperiali, Adam Martin, MIT OCW, 2018", "level": 1, "note": "Video lectures on the biochemistry, molecular biology, and genetics of living systems."}, {"title": "Molecular Biology of the Cell (4th edition)", "url": "https://www.ncbi.nlm.nih.gov/books/NBK21054/", "type": "book", "by": "Alberts et al., 2002, NCBI Bookshelf", "level": 2, "note": "Chapter 1, Cells and Genomes, is the field in one chapter."}, {"title": "Cell Biology by the Numbers", "url": "http://book.bionumbers.org/", "type": "book", "by": "Ron Milo, Rob Phillips", "level": 2, "note": "Rough estimates of sizes, concentrations, energies, rates, and error rates in the cell; the engineer’s way in."}, {"title": "Biological Circuit Design exercises", "url": "https://biocircuits.github.io/", "type": "project", "by": "Michael Elowitz, Justin Bois, 2026", "level": 2, "build": "Python models of gene circuits from the book’s exercises: autoregulation, toggle switches, feedforward loops, kinetic proofreading, coupled repressilators, and Gillespie simulations of noisy and bursty expression.", "teaches": "Memory, timing, and oscillation built from a few proteins that switch genes on and off, read from the equations instead of from diagrams.", "time": "a month"}]}, {"id": "genetics", "title": "Genetics and genomics", "kind": "concept", "track": "biosci", "pre": ["cellbio", "prob"], "frontier": false, "core": "Genes come in pairs, one from each parent, and Mendel’s ratios follow from each parent passing one copy at random; genes close together on a chromosome travel together, which lets you map them. Genomics reads whole genomes and tests which variants track which traits.", "reach": "Bioinformatics supplies the algorithms and biostatistics the testing; genomic language models in machine learning read the same sequences.", "uses": "Disease risk testing, ancestry services, crop and livestock breeding, forensic DNA, and finding drug targets. Genomic models such as DeepMind’s AlphaGenome and the Arc Institute’s Evo read DNA sequence to predict its function.", "worth": "you want to work on genomics ML or biotech; skip it otherwise, though population genetics also sharpens statistical thinking.", "resources": [{"title": "Biology 2e", "url": "https://openstax.org/details/books/biology-2e", "type": "book", "by": "OpenStax, 2018", "level": 1, "note": "Chapters 12 and 13: Mendel’s experiments, the laws of inheritance, and linkage."}, {"title": "MIT 7.03: Genetics", "url": "https://ocw.mit.edu/courses/7-03-genetics-fall-2004/", "type": "course", "by": "Kaiser, Fink, Samson, MIT OCW, 2004", "level": 2, "note": "Lecture notes and problem sets on recombination, mutation, selection, population genetics, and gene regulation."}, {"title": "Population and Quantitative Genetics notes", "url": "https://github.com/cooplab/popgen-notes", "type": "notes", "by": "Graham Coop, UC Davis", "level": 2, "note": "Drift, selection, and heritability as probability models, with R code."}, {"title": "10 Years of GWAS Discovery: Biology, Function, and Translation", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC5501872/", "type": "paper", "by": "Visscher et al., 2017", "level": 3, "note": "What a decade of genome-wide association studies found and what it is good for."}, {"title": "GWA tutorial", "url": "https://github.com/MareesAT/GWA_tutorial", "type": "project", "by": "Marees et al., 2018", "level": 2, "build": "A genome-wide association study in PLINK on European HapMap genotypes with a simulated trait: quality control, ancestry checked against 1000 Genomes, logistic tests, Bonferroni, FDR, and permutation corrections, and Manhattan plots.", "teaches": "Why a GWAS is mostly quality control and correction for ancestry and multiple testing, and what a real hit looks like among a million tests.", "time": "a week"}]}, {"id": "biostats", "title": "Biostatistics", "kind": "concept", "track": "biosci", "pre": ["prob"], "frontier": false, "core": "Biological measurements are noisy and samples small, so every claim is a comparison with chance: a p-value says how surprising the data would be if nothing were going on. Randomization, enough samples, and correcting for many tests decide whether that comparison means anything.", "reach": "Genetics runs millions of tests per study; the same reasoning judges a trading backtest in microstructure and any benchmark gain in machine learning.", "uses": "Clinical trials, FDA drug approvals, epidemiology, and public health. The same habits catch false benchmark wins in ML: multiple comparisons, variance across random seeds, and small test sets.", "worth": "you run experiments of any kind, ML included; a short course on testing and multiple comparisons pays off for almost everyone.", "resources": [{"title": "Statistics for Biologists", "url": "https://www.nature.com/collections/qghhqm", "type": "notes", "by": "Nature collection, 2017", "level": 1, "note": "Short pieces on p-values, statistical power, sample size, multiple testing, and Bayesian statistics, plus the Points of Significance columns."}, {"title": "Data Analysis for the Life Sciences", "url": "https://genomicsclass.github.io/book/", "type": "book", "by": "Rafael Irizarry, Michael Love", "level": 2, "note": "Chapter 1 (inference: t-tests, power, permutation tests) and chapter 6 (inference for high-dimensional data), with R code."}, {"title": "Why Most Published Research Findings Are False", "url": "https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0020124", "type": "paper", "by": "John Ioannidis, PLOS Medicine, 2005", "level": 2, "note": "Low prior odds, small studies, and many tests make most significant findings false."}, {"title": "Statistical Rethinking", "url": "https://github.com/rmcelreath/stat_rethinking_2024", "type": "lectures", "by": "Richard McElreath, 2024", "level": 2, "note": "The Bayesian alternative: state a causal model, then fit it, with lectures and code."}, {"title": "Harvard Stat 110: Probability", "url": "https://stat110.net/", "type": "course", "by": "Joe Blitzstein, Harvard", "level": 1, "note": "The probability under every test: conditional probability, Bayes’ rule, and the central limit theorem."}, {"title": "Simulate why most published findings are false", "url": "https://journals.plos.org/plosmedicine/article?id=10.1371/journal.pmed.0020124", "type": "project", "by": "Built on Ioannidis, 2005", "level": 1, "build": "A simulated research field of thousands of studies with set prior odds, power, significance level, and bias, counting the share of significant findings that are true, then real t-tests in place of fixed power.", "teaches": "Why a p-value below 0.05 says little without the prior odds and the power, and how bias and many teams drive the true share down.", "time": "an afternoon", "made": true, "done": "Simulated PPV comes out 0.85 for power 0.80, odds 1:1, and bias 0.10, and 0.0010 for power 0.20, odds 1:1,000, and bias 0.80, as in Table 4."}]}, {"id": "bioinfo", "title": "Bioinformatics algorithms", "kind": "concept", "track": "biosci", "pre": ["genetics", "dp", "graphs"], "frontier": false, "core": "Biological questions become string and graph problems. Aligning two sequences is dynamic programming over a grid of edits, and assembling a genome from millions of short reads is finding a path through a de Bruijn graph that uses every overlap once.", "reach": "Applies dynamic programming and graph algorithms (Eulerian paths); the sequence models of the machine learning roadmap read the same data at scale.", "uses": "Genome sequencing pipelines, cancer mutation calling, tracking pathogen variants such as COVID’s, and ancestry analysis, through tools like BLAST and BWA. AlphaFold’s input includes multiple sequence alignments built by these methods.", "worth": "you want ML for genomics or proteins; skip it otherwise, though it is a pleasant applied tour of dynamic programming and graphs.", "resources": [{"title": "Finding Hidden Messages in DNA (Bioinformatics I)", "url": "https://www.coursera.org/learn/dna-analysis", "type": "course", "by": "Pavel Pevzner, Phillip Compeau, UC San Diego, Coursera", "level": 1, "note": "Each biological question becomes an algorithm you code yourself."}, {"title": "Bioinformatics Algorithms", "url": "https://www.bioinformaticsalgorithms.org/", "type": "book", "by": "Phillip Compeau, Pavel Pevzner", "level": 2, "note": "Chapter 3 (genome assembly with de Bruijn graphs) and chapter 5 (sequence alignment by dynamic programming)."}, {"title": "Rosalind", "url": "https://rosalind.info/problems/locations/", "type": "project", "by": "Rosalind project", "level": 2, "build": "Programs for bioinformatics problems, each checked against a fresh dataset: from counting nucleotides to alignment, genome assembly, and phylogeny.", "teaches": "The algorithms inside sequencing tools, written yourself in short exercises.", "time": "a term", "signature": true}, {"title": "MIT 6.047: Computational Biology", "url": "https://ocw.mit.edu/courses/6-047-computational-biology-fall-2015/", "type": "lectures", "by": "Manolis Kellis, MIT OCW, 2015", "level": 3, "note": "The algorithmic and machine learning foundations of computational biology, out to research frontiers."}]}, {"id": "neuro", "title": "Neuroscience", "kind": "concept", "track": "biosci", "pre": ["cellbio", "diffeq"], "frontier": false, "core": "A neuron is an electrical circuit: ion channels in its membrane pass current, and when the voltage crosses a threshold it fires a spike (the Hodgkin-Huxley model). Synapses that strengthen when their neurons fire together let networks of spiking neurons store memories and compute.", "reach": "The origin of artificial neural networks; Hodgkin-Huxley is a nonlinear ODE system, studied with the tools of diffeq and control.", "uses": "Treating neurological disease, brain-computer interfaces, prosthetics, and psychiatry research. Neural networks began here, and dopamine signals match reinforcement learning’s reward prediction error, though modern architectures owe little to biology.", "worth": "you care about brain-inspired AI or neurotech; skip it if you only want the history, which a few papers cover.", "resources": [{"title": "Neuromatch Academy", "url": "https://neuromatch.io/courses/", "type": "course", "by": "Neuromatch, free materials", "level": 1, "note": "The Computational Neuroscience course: models of neurons and networks in Python notebooks."}, {"title": "Neuronal Dynamics", "url": "https://neuronaldynamics.epfl.ch/online/", "type": "book", "by": "Gerstner, Kistler, Naud, Paninski, 2014", "level": 2, "note": "Chapter 2 is the Hodgkin-Huxley model; chapter 17 is memory and attractor dynamics."}, {"title": "Theoretical Neuroscience", "url": "https://mitpress.mit.edu/9780262541855/theoretical-neuroscience/", "type": "book", "by": "Peter Dayan, Laurence Abbott, 2001", "level": 2, "note": "The standard text on computational and mathematical models of neural systems.", "paid": true}, {"title": "A quantitative description of membrane current and its application to conduction and excitation in nerve", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC1392413/", "type": "paper", "by": "Alan Hodgkin, Andrew Huxley, 1952", "level": 3, "note": "The original model, fit to measurements on the squid giant axon."}, {"title": "Neuromatch Academy projects", "url": "https://compneuro.neuromatch.io/projects/README.html", "type": "project", "by": "Neuromatch Academy", "level": 2, "build": "A small research project in a team on a public neuroscience dataset, taken from a question to a model and an answer with the course’s guided steps.", "teaches": "The practice of computational neuroscience research, from a vague question to a testable model.", "time": "two weeks"}, {"title": "Neuronal Dynamics Python exercises", "url": "https://neuronaldynamics-exercises.readthedocs.io/en/latest/", "type": "project", "by": "EPFL LCN, 2016", "level": 2, "build": "Brian2 simulations for the book’s twelve exercises: leaky and adaptive integrate-and-fire neurons, the Hodgkin-Huxley squid axon, FitzHugh-Nagumo phase planes, a Hopfield memory, and spiking network models.", "teaches": "How thresholds, spikes, and memories come out of the equations, learned by changing currents and parameters and watching the voltage respond.", "time": "two weeks"}]}, {"id": "websec", "title": "Web security", "kind": "concept", "track": "security", "pre": ["webdev"], "frontier": false, "core": "Web attacks abuse trust in input: injection (SQL, cross-site scripting) runs attacker data as code, request forgery makes a trusted party send the attacker’s request, and broken access control lets one user act as another. Defenses separate code from data and check permissions per request.", "reach": "The web category of capture the flag; pairs with network security.", "uses": "Protecting banks, shops, and every online service, plus bug bounties and penetration tests. LLM apps add prompt injection, the same trust-in-input failure as SQL injection, now an active research problem.", "worth": "you build web apps or LLM tools that touch untrusted input; skip the deep exploitation side unless security is your field.", "resources": [{"title": "Web Security Academy", "url": "https://portswigger.net/web-security", "type": "project", "by": "PortSwigger", "level": 1, "build": "Working exploits in live labs for each class of web bug: SQL injection, cross-site scripting, CSRF, SSRF, and access control flaws, each against a deliberately vulnerable site.", "teaches": "Web vulnerabilities as failures to distrust input, and the defense that closes each one.", "time": "a month"}, {"title": "Computer Security (CS 161 Textbook)", "url": "https://textbook.cs161.org/", "type": "notes", "by": "Wagner, Weaver, Kao, and others, UC Berkeley, 2024", "level": 1, "note": "Chapters 17 to 22: SQL injection, the web, the same-origin policy, cookies and sessions, CSRF, and XSS."}, {"title": "OWASP Top 10:2025", "url": "https://owasp.org/Top10/2025/", "type": "notes", "by": "OWASP Foundation, 2025", "level": 2, "note": "The ten most common web risk categories, from broken access control and misconfiguration to supply chain failures."}, {"title": "6.5660: Computer Systems Security", "url": "https://css.csail.mit.edu/6.5660/2024/", "type": "course", "by": "MIT, Spring 2024", "level": 3, "note": "Lecture 9 on the web security model and Lab 4 on browser security; the other lectures and labs cover isolation, side channels, and secure channels."}]}, {"id": "binex", "title": "Binary exploitation and reverse engineering", "kind": "concept", "track": "security", "pre": ["assembly", "os"], "frontier": false, "core": "Overflow a C buffer and you overwrite the return address stored above it, sending execution where you choose. Canaries, non-executable stacks, and ASLR push attackers to chain existing code instead (return-oriented programming), and reverse engineering reads binaries to find such bugs.", "reach": "The pwn and reversing categories of capture the flag; memory-safe languages exist to rule these bugs out.", "uses": "Finding vulnerabilities in browsers, phones, and servers, malware analysis, game modding, and firmware audits. DARPA’s AI Cyber Challenge had AI systems find and patch such bugs, and labs test models on these tasks.", "worth": "you want security research or to evaluate AI on offensive security; skip it otherwise, as it takes months of hands-on practice.", "resources": [{"title": "Computer Security (CS 161 Textbook)", "url": "https://textbook.cs161.org/", "type": "notes", "by": "Wagner, Weaver, Kao, and others, UC Berkeley, 2024", "level": 1, "note": "Chapters 2 to 4: x86 assembly and the call stack, memory safety vulnerabilities, and the mitigations against them."}, {"title": "pwn.college", "url": "https://pwn.college/", "type": "course", "by": "Arizona State University", "level": 2, "note": "Computing 101 first if assembly is new; then the Program Security dojo: reverse engineering, return-oriented programming, dynamic allocator misuse, and program exploitation."}, {"title": "Smashing The Stack For Fun And Profit", "url": "https://phrack.org/issues/49/14.html", "type": "paper", "by": "Aleph One, Phrack 49, 1996", "level": 2, "note": "The article that taught a generation the stack overflow, step by step in C and assembly."}, {"title": "GHIDRA for Reverse Engineering (PicoCTF 2022 #42 ‘bbbloat’)", "url": "https://www.youtube.com/watch?v=oTD_ki86c9I", "type": "video", "by": "John Hammond, 2022", "level": 1, "note": "Reversing a CTF binary in Ghidra, start to finish."}, {"title": "Binary Exploitation / Memory Corruption by LiveOverflow", "url": "https://www.youtube.com/playlist?list=PLhixgUqwRTjxglIswKp9mpkfPNfHkzyeN", "type": "video", "by": "LiveOverflow, from 2015", "level": 1, "note": "The bin 0x series, each episode reasoning through an exploit out loud."}, {"title": "Hacking: The Art of Exploitation (2nd edition)", "url": "https://nostarch.com/hacking2.htm", "type": "book", "by": "Jon Erickson, No Starch, 2008", "level": 2, "note": "C, assembly, stack overflows, and shellcode, taught by exploiting them.", "paid": true}]}, {"id": "netsec", "title": "Network security and penetration testing", "kind": "concept", "track": "security", "pre": ["networking", "os"], "frontier": false, "core": "A penetration test walks an attacker’s path: map the network and its services, find a vulnerable or misconfigured one, gain a foothold, escalate privileges, and move to other machines. Defenders break each step with segmentation, patching, least privilege, and monitoring that notices the movement.", "reach": "Reconnaissance is the first step of the path; network challenges appear in capture the flag.", "uses": "Corporate security teams, red teams, compliance audits, and incident response. AI labs run evaluations that check whether models can carry out the steps of a network intrusion.", "worth": "you head into security or AI safety evaluations of cyber capabilities; skip it otherwise.", "resources": [{"title": "TryHackMe", "url": "https://tryhackme.com/", "type": "course", "by": "Browser-based labs, free and paid tiers", "level": 1, "note": "Guided rooms that attack real machines in the browser; the Pre Security and Jr Penetration Tester paths fit this node."}, {"title": "Computer Security (CS 161 Textbook)", "url": "https://textbook.cs161.org/", "type": "notes", "by": "Wagner, Weaver, Kao, and others, UC Berkeley, 2024", "level": 2, "note": "Chapters 25 to 36: ARP, DHCP, WPA, BGP, TCP, TLS, DNS, denial of service, firewalls, and intrusion detection."}, {"title": "Nmap Network Scanning", "url": "https://nmap.org/book/", "type": "book", "by": "Gordon Lyon (Fyodor), 2009", "level": 2, "note": "The scanner every test starts with; about half the book, including the reference guide, can be read online."}, {"title": "Penetration Testing, Threat Hunting, and Cryptography", "url": "https://www.coursera.org/learn/ibm-penetration-testing-incident-response-forensics", "type": "course", "by": "IBM, Coursera", "level": 1, "note": "Formerly Penetration Testing, Incident Response and Forensics: testing with tools such as OWASP ZAP, threat hunting, cryptography, and writing the report."}, {"title": "Cybersecurity Attack and Defense Fundamentals", "url": "https://www.coursera.
