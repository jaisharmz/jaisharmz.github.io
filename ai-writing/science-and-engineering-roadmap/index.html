<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science and Engineering Roadmap</title>
<script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<meta name="description" content="A prerequisite graph of science and engineering beyond machine learning, from algorithms, operating systems and cryptography to physics, chemistry, fluids, rocketry, control and finance, with verified resources for every idea.">
<style>
/* Layout: a compact header, then the map fills the viewport; a panel slides in from the right
   (a bottom sheet on phones). Colors: the site's paper and ink, plus six track families. */
:root {
  color-scheme: light;
  --paper: #ffffff; --sunk: #f6f5f2; --card: #ffffff;
  --ink: #1b1b1d; --ink-2: #4a4a50; --muted: #70707a; --rule: #e4e3de; --rule-soft: #efeeea;
  --accent: #1a4f8c; --accent-soft: #e6eef8;
  --edge: #b9b8b2; --edge-x: #d8d7d2;
  --f-0: #8a8983; --f-1: #2a78d6; --f-2: #eb6834; --f-3: #1baf7a;
  --f-4: #eda100; --f-5: #e87ba4; --f-6: #008300; --f-7: #6250d6; --f-8: #e34948;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #16161a; --sunk: #1c1c21; --card: #212127;
    --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
    --accent: #7fb2e3; --accent-soft: #1d2b3b;
    --edge: #5d5d66; --edge-x: #3d3d45;
    --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
    --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #16161a; --sunk: #1c1c21; --card: #212127;
  --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
  --accent: #7fb2e3; --accent-soft: #1d2b3b;
  --edge: #5d5d66; --edge-x: #3d3d45;
  --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
  --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }

/* header */
header { flex: none; border-bottom: 1px solid var(--rule); padding-block: .7rem .6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.2rem; align-items: end; }
.crumb { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .25rem; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.25rem, 2.6vw, 1.7rem); line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.lede { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; margin: .3rem 0 0; max-width: 62rem; }
.tools { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.search { position: relative; }
.search input { width: 15rem; max-width: 100%; font: .9rem var(--sans); color: var(--ink); background: var(--sunk); border: 1px solid var(--rule);
  border-radius: 8px; padding: .45rem .7rem; }
.results { position: absolute; right: 0; top: calc(100% + 4px); width: min(24rem, 86vw); max-height: 60vh; overflow: auto; z-index: 40;
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); padding: .3rem; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: .45rem .55rem; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--sunk); }
.results .rt { font-weight: 600; font-size: .88rem; }
.results .rm { font-size: .76rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: .42rem .75rem; font-size: .85rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.totals { font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem .35rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; color: var(--ink-2); background: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: .18rem .55rem; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* map */
main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sunk); touch-action: none; cursor: grab; }
main.dragging { cursor: grabbing; }
main[hidden] { display: none !important; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }
.e { fill: none; stroke: var(--edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.e.x { stroke: var(--edge-x); stroke-width: 1.2; display: none; }
main.all-links .e.x, .e.x.hot { display: inline; }
.e.hot { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.e.dim { opacity: .18; }
.track { position: absolute; z-index: 0; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper); }
.track .tl { position: absolute; left: 14px; top: 9px; display: flex; gap: .45rem; align-items: center;
  font-family: var(--mono); font-size: clamp(11px, calc(9px * var(--inv, 1)), 17px); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
.track .tl .dot { width: 8px; height: 8px; }
.node { position: absolute; z-index: 2; display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--rule);
  border-top: 3px solid var(--c); border-radius: 8px; padding: 5px 8px 6px; cursor: pointer; overflow: hidden;
  box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.node:hover { box-shadow: 0 3px 10px rgb(0 0 0 / .12); border-color: var(--muted); border-top-color: var(--c); }
.node .k { display: flex; justify-content: space-between; gap: 4px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.node .k .fr { color: var(--ink-2); }
.node .t { font-size: 12.5px; font-weight: 600; line-height: 1.22; color: var(--ink); margin-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .p { margin-top: auto; height: 3px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.node .p i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 2px; }
.node.done { background: color-mix(in srgb, var(--c) 9%, var(--card)); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); border-top-color: var(--c); }
.node.anc { border-color: var(--accent); }
.node.dim { opacity: .3; }
.node.hit { box-shadow: 0 0 0 3px var(--accent); }
.zoom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-size: 1.05rem; line-height: 1; }
.zoom button.w { width: auto; padding: 0 .55rem; font-size: .75rem; }
.zoom button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 180px; z-index: 5;
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 6px; cursor: pointer; }
.mini svg { display: block; width: 100%; height: auto; }
.mini .vp { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 18; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 4; font-size: .76rem; color: var(--muted);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .75rem; white-space: nowrap; }

/* track map */
.tview { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--sunk); }
.tview[hidden] { display: none !important; }
.tscroll { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 12px; }
.tsize { margin: auto; position: relative; flex: none; }
.tworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tworld svg.edges { z-index: 1; }
.te { fill: none; stroke: var(--edge); vector-effect: non-scaling-stroke; }
.te.hot { stroke: var(--accent); }
.te.dim { opacity: .2; }
.tnode { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--card);
  border: 1px solid var(--rule); border-top: 4px solid var(--c); border-radius: 10px; padding: 9px 12px 7px; cursor: pointer;
  box-shadow: 0 1px 3px rgb(0 0 0 / .06); transition: opacity .15s, box-shadow .15s; overflow: hidden; }
.tnode:hover { box-shadow: 0 4px 14px rgb(0 0 0 / .13); border-color: var(--muted); border-top-color: var(--c); }
.tnode .tk { display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tnode .tt { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.15; color: var(--ink); }
.tnode .tc { font-family: var(--serif); font-size: 12.5px; line-height: 1.32; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tnode .tf { margin-top: auto; display: flex; align-items: center; gap: .5rem; flex: none; }
.tnode .p { flex: 1; height: 4px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.tnode .tpj { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; line-height: 1; }
.tnode .p i { display: block; height: 100%; width: 0; background: var(--c); }
.tnode.sel { box-shadow: 0 0 0 2px var(--accent); }
.tnode.anc { border-color: var(--accent); border-top-color: var(--c); }
.tnode.dim { opacity: .32; }
.thint { flex: none; margin: 0; padding: .5rem 16px .7rem; text-align: center; font-size: .8rem; color: var(--muted); }
.narrow .tnode { padding: 7px 9px 8px; }
.narrow .tnode .tt { font-size: 14.5px; }
.narrow .tnode .tc { font-size: 11.5px; -webkit-line-clamp: 2; }
.primary { display: inline-flex; align-items: center; gap: .4rem; margin: .2rem 0 .2rem; font-size: .86rem; font-weight: 600; color: var(--paper);
  background: var(--ink); border: 0; border-radius: 8px; padding: .5rem .85rem; cursor: pointer; }
.tlinks { font-size: .86rem; color: var(--ink-2); line-height: 1.5; margin: 0; }
.ideas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.ideas li button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .8rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .55rem .1rem; cursor: pointer; }
.ideas li button:hover { background: var(--sunk); }
.ideas .it { font-weight: 600; font-size: .9rem; }
.ideas .ik { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .35rem; font-weight: 400; }
.ideas .ip { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* list */
.list { flex: 1; min-height: 0; overflow: auto; background: var(--paper); }
.list[hidden] { display: none !important; }
.list .in { max-width: 54rem; margin: 0 auto; padding-block: 1.2rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list h2 { display: flex; gap: .5rem; align-items: center; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; margin: 2rem 0 .4rem; padding-bottom: .45rem; border-bottom: 1px solid var(--rule); }
.list h2:first-child { margin-top: .4rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .75rem .2rem; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row .rt { font-weight: 600; font-size: .98rem; }
.row .rk { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .4rem; font-weight: 400; }
.row .rc { grid-column: 1; font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.row .rp { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* panel */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .25); z-index: 49; }
.scrim[hidden] { display: none !important; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(31rem, 100%); z-index: 50; background: var(--card);
  border-left: 1px solid var(--rule); box-shadow: -12px 0 40px rgb(0 0 0 / .12); overflow: auto; overscroll-behavior: contain;
  padding-block: calc(1.1rem + env(safe-area-inset-top, 0px)) calc(2.5rem + env(safe-area-inset-bottom, 0px));
  padding-left: 1.4rem; padding-right: max(1.4rem, env(safe-area-inset-right, 0px)); }
aside[hidden] { display: none !important; }
.close { position: sticky; top: 0; float: right; width: 32px; height: 32px; margin: -.2rem -.4rem 0 0; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--card); cursor: pointer; font-size: 1.1rem; line-height: 1; z-index: 2; }
.pk { display: flex; flex-wrap: wrap; gap: .35rem .6rem; align-items: center; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.badge { border: 1px solid var(--rule); border-radius: 4px; padding: .05rem .35rem; color: var(--ink-2); }
aside h2 { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1.15; margin: 0 2.2rem .7rem 0; text-wrap: balance; }
.prog { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--c); }
.core { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; margin: 0 0 .6rem; }
.reach { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: 0 0 1.1rem; }
.uses, .worth { font-family: var(--serif); font-size: 1rem; line-height: 1.5; margin: 0 0 .45rem; }
.uses b, .worth b { font-family: var(--mono); font-weight: 500; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: .35rem; }
.worth { margin-bottom: 1rem; }
.row .ru { grid-column: 1 / -1; font-family: var(--serif); font-size: .9rem; color: var(--ink-2); line-height: 1.4; }
.sec { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.3rem 0 .5rem; }
.links { display: flex; flex-wrap: wrap; gap: .35rem; }
.links button { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: .25rem .5rem; cursor: pointer; text-align: left; }
.links button:hover { border-color: var(--muted); }
.links .none { font-size: .85rem; color: var(--muted); }
.path { font-size: .8rem; color: var(--muted); margin: .45rem 0 0; }
.res { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.res li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .1rem .65rem; padding: .7rem 0; border-bottom: 1px solid var(--rule-soft); }
.res input { width: 1.05rem; height: 1.05rem; margin: .2rem 0 0; accent-color: var(--accent); cursor: pointer; }
.res .rn a { font-weight: 600; font-size: .93rem; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.res .rn a:hover { border-bottom-color: var(--accent); }
.res .rb { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
.res .note { font-family: var(--serif); font-size: .9rem; color: var(--ink-2); margin-top: .2rem; line-height: 1.4; }
.res li.ok .rn a { color: var(--muted); }
.lv { align-self: start; font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: .12rem .4rem; white-space: nowrap; }
.lv1 { color: var(--accent); background: var(--accent-soft); }
.lv2 { color: var(--ink-2); background: var(--rule-soft); }
.lv3 { color: var(--paper); background: var(--ink-2); }
.foot { font-size: .8rem; color: var(--muted); margin-top: 1.4rem; line-height: 1.5; }
/* projects: a resource row with a label line and what you build and learn */
.res .pt { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: .2rem; }
.res .pb { font-family: var(--serif); font-size: .92rem; color: var(--ink-2); line-height: 1.42; margin: .25rem 0 0; }
.res .pb b { font-family: var(--mono); font-weight: 500; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: .4rem; }
.res li.proj { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); border-radius: 6px; padding-left: .45rem; padding-right: .2rem; }
.res .ichip { margin-top: .45rem; }
.row .rk.pj { color: var(--accent); }
.pintro { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: .4rem 0 0; max-width: 46rem; }
.about { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.55; }
.about p { margin: 0 0 .7rem; }

@media (max-width: 720px) {
  header { grid-template-columns: minmax(0, 1fr); }
  .tools { justify-content: flex-start; }
  .search { flex: 1 1 10rem; }
  .search input { width: 100%; }
  .lede { display: none; }
  .legend { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .mini { display: none; }
  .hint { display: none; }
  aside { top: auto; left: 0; width: 100%; height: 86%; border-left: 0; border-top: 1px solid var(--rule); border-radius: 16px 16px 0 0;
    padding-left: max(1.1rem, env(safe-area-inset-left, 0px)); padding-right: max(1.1rem, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
const DATA = {"tracks": [{"id": "math", "label": "Math foundations", "family": 0, "core": "Calculus, linear algebra, proofs, differential equations, probability, and the numerical methods that compute them."}, {"id": "algo", "label": "Algorithms", "family": 1, "core": "Data structures and the algorithm design patterns behind interviews and competitive programming."}, {"id": "theory", "label": "Theory of computation", "family": 1, "core": "What computers can and cannot do, and how hard problems are: automata, computability, and complexity."}, {"id": "hardware", "label": "Circuits and hardware", "family": 3, "core": "From circuits and logic gates to chips, embedded systems, PCBs, signals, and radio."}, {"id": "physics", "label": "Physics", "family": 5, "core": "Mechanics, electromagnetism, thermodynamics, quantum mechanics, and relativity, the laws under every engineering track."}, {"id": "or", "label": "Optimization and game theory", "family": 7, "core": "Choose the best action under constraints, alone or against others: linear, convex and integer programs, stochastic processes, and games."}, {"id": "lowlevel", "label": "Computer systems", "family": 2, "core": "How a program becomes electrons: architecture, C and assembly, compilers, operating systems, and networks."}, {"id": "chem", "label": "Chemistry", "family": 5, "core": "Atoms, bonds and reactions, from general and organic chemistry to physical and computational chemistry."}, {"id": "fluids", "label": "Fluids and structures", "family": 6, "core": "How fluids flow and structures bend and vibrate, and how to simulate both."}, {"id": "quant", "label": "Quantitative finance", "family": 7, "core": "Price risk with probability: options, stochastic calculus, portfolios, and how markets trade."}, {"id": "software", "label": "Software and distributed systems", "family": 2, "core": "Build software that many people use: web apps, engineering practice, databases, and systems that span many machines."}, {"id": "control", "label": "Control and robotics", "family": 6, "core": "Make a system do what you want despite noise: feedback, state space, estimation, and robot motion."}, {"id": "biosci", "label": "Biology and neuroscience", "family": 8, "core": "Cells, genes and brains, with the statistics and algorithms used to study them."}, {"id": "security", "label": "Security and hacking", "family": 4, "core": "Break systems to learn how to defend them: the web, binaries, networks, reconnaissance, and capture the flag."}, {"id": "crypto", "label": "Cryptography and blockchain", "family": 4, "core": "Keep secrets and prove things with math: ciphers, public keys, zero knowledge, blockchains, and post-quantum schemes."}, {"id": "aero", "label": "Aerospace and rocketry", "family": 6, "core": "Fly and go to space: aerodynamics, propulsion, orbits, attitude, and guidance."}, {"id": "graphics", "label": "Graphics, games and VR", "family": 1, "core": "Draw worlds on a screen: rasterization, ray tracing, simulation, game engines, and virtual reality."}], "nodes": [{"id": "calc", "title": "Single and multivariable calculus", "kind": "concept", "track": "math", "pre": [], "frontier": false, "core": "A derivative is the best linear approximation to a function near a point, and an integral adds up many small pieces; the fundamental theorem says each undoes the other. In several variables the derivative becomes a gradient or a Jacobian matrix.", "reach": "Under every other node: differential equations and PDEs, gradients in convex optimization, and the divergence and Stokes theorems that electromagnetism and fluid mechanics rest on.", "uses": "Every quantitative field: physics and engineering models, economics, and medicine dosing curves. Backpropagation, which trains every neural network, is the multivariable chain rule applied layer by layer.", "worth": "you plan to study anything else on this map; nobody in ML research skips it, though a refresher is often enough.", "resources": [{"title": "Essence of calculus", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDMsr9K-rj53DwVRMYO3t5Yr", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2017", "level": 1, "note": "Derivatives, the chain rule, integrals, and Taylor series rebuilt from pictures before formulas."}, {"title": "MIT 18.01SC: Single Variable Calculus", "url": "https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/", "type": "course", "by": "David Jerison, MIT OCW, 2010", "level": 2, "note": "Built for self-study: lecture and recitation videos with problem sets in five units, from derivatives to Taylor series."}, {"title": "MIT 18.02SC: Multivariable Calculus", "url": "https://ocw.mit.edu/courses/18-02sc-multivariable-calculus-fall-2010/", "type": "course", "by": "Denis Auroux, MIT OCW, 2010", "level": 2, "note": "Units 2 to 4: partial derivatives and Lagrange multipliers, double and line integrals with Green’s theorem, then flux, divergence, and Stokes’ theorems."}, {"title": "MIT 18.S096: Matrix Calculus for Machine Learning and Beyond", "url": "https://ocw.mit.edu/courses/18-s096-matrix-calculus-for-machine-learning-and-beyond-january-iap-2023/", "type": "course", "by": "Alan Edelman, Steven G. Johnson, MIT OCW, 2023", "level": 3, "note": "Derivatives as linear maps on any vector space, including derivatives of matrix functions and factorizations, and how to compute them at scale."}, {"title": "Vector Calculus for Engineers", "url": "https://www.coursera.org/learn/vector-calculus-engineers", "type": "course", "by": "Jeffrey Chasnov, HKUST, Coursera", "level": 2, "note": "A shorter alternative to 18.02SC aimed at physics and engineering: vectors, differentiation, curvilinear coordinates, line and surface integrals, and the fundamental theorems."}, {"title": "micrograd", "url": "https://github.com/karpathy/micrograd", "type": "project", "by": "Andrej Karpathy, 2020", "level": 1, "build": "A scalar automatic differentiation engine of about 100 lines that returns the gradient of any expression built from sums, products, and powers, tested against PyTorch.", "teaches": "The multivariable chain rule as an algorithm: each operation passes its local derivative backward, and the whole gradient falls out.", "time": "an afternoon"}]}, {"id": "linalg", "title": "Linear algebra", "kind": "concept", "track": "math", "pre": [], "frontier": false, "core": "A matrix is a linear map that keeps lines straight and the origin fixed. Elimination solves Ax = b, eigenvectors are the directions the map only stretches, and the SVD writes any matrix as a rotation, a stretch along axes, and another rotation.", "reach": "The language of differential equations, numerical methods, linear programming, quantum mechanics, state-space control, and the transforms in raster graphics.", "uses": "Neural network layers, PCA and embeddings, Google’s original PageRank, recommender systems, 3D graphics, structural simulation, and quantum mechanics. In ML it is the daily working language, not a background topic.", "worth": "you do any ML or scientific computing at all; nobody skips it, but most people can stop before abstract algebra.", "resources": [{"title": "Essence of linear algebra", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2016", "level": 1, "note": "Matrices as transformations of space, determinants as area scaling, change of basis, and eigenvectors, all drawn."}, {"title": "MIT 18.06: Linear Algebra", "url": "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", "type": "course", "by": "Gilbert Strang, MIT OCW, 2010", "level": 2, "note": "From elimination through the four fundamental subspaces to least squares, eigenvalues, and the SVD, with problem sets and exams."}, {"title": "MIT 18.065: Matrix Methods in Data Analysis, Signal Processing, and Machine Learning", "url": "https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/", "type": "course", "by": "Gilbert Strang, MIT OCW, 2018", "level": 2, "note": "Strang’s follow-on course built around the SVD: low-rank approximation, least squares, and the matrix methods of data analysis."}, {"title": "Linear Algebra Done Right", "url": "https://linear.axler.net/", "type": "book", "by": "Sheldon Axler, 4th edition, 2024", "level": 3, "note": "The proof-based course, free from the author. Chapters 5 to 7 build eigenvalues, inner product spaces, the spectral theorem, and the SVD from linear operators."}, {"title": "The $25,000,000,000 Eigenvector: The Linear Algebra Behind Google", "url": "https://www.rose-hulman.edu/~bryan/googleFinalVersionFixed.pdf", "type": "project", "by": "Kurt Bryan, Tanya Leise, SIAM Review, 2006", "level": 2, "note": "Written to be assigned as a project; check your scores against Example 1.", "build": "Answers to the article’s 17 exercises: link matrices for small webs, the damped matrix with m = 0.15, and power iteration that finds the ranking eigenvector.", "teaches": "That ranking pages is an eigenvector problem, why damping makes the answer unique, and why the second eigenvalue sets how fast power iteration converges.", "time": "a weekend"}]}, {"id": "proofs", "title": "Proofs and discrete math", "kind": "concept", "track": "math", "pre": [], "frontier": false, "core": "A proof is a chain of steps, each forced by definitions or earlier steps, that leads from assumptions to a claim. A few templates (direct, contrapositive, contradiction, and induction) carry most of discrete math: counting, graphs, modular arithmetic, and algorithm correctness.", "reach": "The way into analysis, automata, and data structures, and into the number theory under cryptography.", "uses": "Checking that algorithms are correct, reading theory papers, and the counting and modular arithmetic behind hashing and cryptography. ML theory results on generalization and convergence are written as proofs.", "worth": "you want to read or write theory papers or go on to analysis, algorithms, or cryptography; practitioners can get by with a short course.", "resources": [{"title": "Book of Proof", "url": "https://richardhammack.github.io/BookOfProof/", "type": "book", "by": "Richard Hammack, 3rd edition, 2018", "level": 1, "note": "Chapters 4 to 10 cover direct proof, contrapositive, contradiction, disproof, and induction, one method at a time."}, {"title": "Mathematics for Computer Science", "url": "https://courses.csail.mit.edu/6.042/spring18/mcs.pdf", "type": "book", "by": "Eric Lehman, Tom Leighton, Albert Meyer, 2018", "level": 2, "note": "The free text of MIT 6.042: Part I on proofs and induction, Part II on graphs, Part III on counting, and Part IV on probability."}, {"title": "Berkeley CS 70: Discrete Mathematics and Probability Theory", "url": "https://www.eecs70.org/", "type": "course", "by": "UC Berkeley, current offering", "level": 2, "note": "Course notes from proof techniques and induction through modular arithmetic, RSA, polynomials, graphs, stable matching, and countability, then counting and probability."}, {"title": "Project Euler", "url": "https://projecteuler.net/archives", "type": "project", "by": "Colin Hughes and contributors, since 2001", "level": 1, "note": "The first 50 or so need only high school math.", "build": "Programs for a ladder of math problems, each needing an insight before a computer can answer it within a minute: primes, divisors, combinatorics, recurrences, and number theory.", "teaches": "Turning a counting or number theory argument into an algorithm, and convincing yourself the shortcut is correct.", "time": "a term", "signature": true}, {"title": "Natural Number Game", "url": "https://adam.math.hhu.de/#/g/leanprover-community/nng4", "type": "project", "by": "Kevin Buzzard, Jon Eugster, Lean 4 edition", "level": 1, "build": "Lean proofs of the laws of addition, multiplication, powers, and order on the natural numbers, built level by level from Peano’s axioms and induction.", "teaches": "Induction and rewriting at the level a computer checks them, where no step can be waved through.", "time": "a weekend"}]}, {"id": "diffeq", "title": "Ordinary differential equations", "kind": "concept", "track": "math", "pre": ["calc", "linalg"], "frontier": false, "core": "An ordinary differential equation gives a rate of change, dx/dt = f(x), and asks for the trajectory. Linear systems are solved through eigenvalues, each mode growing or decaying like e^(lambda t); nonlinear ones are read from phase portraits of fixed points, stability, and limit cycles.", "reach": "The model behind mechanics, circuits, classical control, and neuron models; numerics steps it forward in time.", "uses": "Epidemic and population models, circuits, drug dosing, climate models, and control systems. In ML, neural ODEs, diffusion model samplers, and gradient flow analyses of training are written as differential equations.", "worth": "you want physics, control, or engineering, or a real grasp of diffusion samplers; linear systems and stability cover most needs.", "resources": [{"title": "Differential equations", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDNPOjrT6KVlfJuKtYTftqH6", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2019 to 2025", "level": 1, "note": "DE1 reads a pendulum’s motion from its phase space; DE6 and the Laplace transform videos cover linear equations. DE2 to DE4 belong to pde."}, {"title": "MIT 18.03: Differential Equations", "url": "https://ocw.mit.edu/courses/18-03-differential-equations-spring-2010/", "type": "course", "by": "Arthur Mattuck, Haynes Miller, MIT OCW, 2010", "level": 2, "note": "Lectures 1 to 14 cover first and second order linear equations up to resonance; Lectures 24 to 33 cover linear systems, matrix exponentials, and nonlinear phase portraits."}, {"title": "Nonlinear Dynamics and Chaos", "url": "https://www.youtube.com/playlist?list=PLbN57C5Zdl6j_qJA-pARJnKsmROzPnO9V", "type": "lectures", "by": "Steven Strogatz, Cornell, 2014", "level": 2, "note": "Flows on the line and the plane, fixed points, limit cycles, the van der Pol oscillator, bifurcations, and the chaotic waterwheel."}, {"title": "Learn Differential Equations: Up Close with Gilbert Strang and Cleve Moler", "url": "https://ocw.mit.edu/courses/res-18-009-learn-differential-equations-up-close-with-gilbert-strang-and-cleve-moler-fall-2015/", "type": "video", "by": "Gilbert Strang, Cleve Moler, MIT OCW, 2015", "level": 1, "note": "Short videos in two strands: differential equations with their linear algebra, and solving ODEs in MATLAB."}, {"title": "Lorenz’s convection model, from steady flow to chaos", "url": "https://doi.org/10.1175/1520-0469(1963)020%3C0130:DNF%3E2.0.CO;2", "type": "project", "by": "Built on Lorenz, Deterministic Nonperiodic Flow, 1963", "level": 2, "build": "The Lorenz equations at sigma = 10 and b = 8/3, integrated with a Runge-Kutta solver, plus the Jacobian eigenvalues at the convection fixed points as r sweeps from 1 to 30.", "teaches": "How the eigenvalues of a linearization predict where steady motion turns unstable, and what a nonlinear system does once linear theory stops answering.", "time": "a weekend", "made": true, "done": "The complex eigenvalue pair crosses the imaginary axis at r = 470/19, about 24.74, as in Section 7, and at r = 28 successive maxima of Z fall on the single curve of Figure 4."}]}, {"id": "prob", "title": "Probability and statistics", "kind": "concept", "track": "math", "pre": ["calc"], "frontier": false, "core": "Probability assigns numbers to uncertain events that add up correctly; conditioning updates them on evidence through Bayes’ rule. Expectation and the limit theorems explain why averages settle down, and statistics runs the logic backward, from observed data to the process behind it.", "reach": "Needed by stochastic processes, randomized algorithms, estimation, thermodynamics, options, and the Monte Carlo integration in ray tracing.", "uses": "Insurance pricing, clinical trials, A/B tests at tech companies, weather forecasts, quality control, and trading. Much of ML is probabilistic modeling: cross-entropy loss is a negative log-likelihood, and evaluation is statistics.", "worth": "you do research of any kind; nobody in ML skips it, and the measure-theoretic version can wait until you need rigorous proofs.", "resources": [{"title": "Harvard Stat 110: Probability", "url": "https://stat110.net/", "type": "lectures", "by": "Joe Blitzstein, Harvard, 2013", "level": 1, "note": "Lecture videos, practice problems with solutions, and handouts, built on the free Blitzstein and Hwang textbook."}, {"title": "MIT 18.650: Statistics for Applications", "url": "https://ocw.mit.edu/courses/18-650-statistics-for-applications-fall-2016/", "type": "course", "by": "Philippe Rigollet, MIT OCW, 2016", "level": 2, "note": "The statistics half: maximum likelihood, hypothesis tests, regression, Bayesian statistics, PCA, and generalized linear models, with lecture videos."}, {"title": "Statistical Rethinking 2024", "url": "https://github.com/rmcelreath/stat_rethinking_2024", "type": "lectures", "by": "Richard McElreath, 2024", "level": 2, "note": "Bayesian data analysis organized around causal models, through multilevel models and MCMC, with a full lecture playlist."}, {"title": "High-Dimensional Probability", "url": "https://www.math.uci.edu/~rvershyn/papers/HDP-book/HDP-book.html", "type": "book", "by": "Roman Vershynin, 2nd edition, 2026", "level": 3, "note": "Chapters 2 and 3: concentration of sums and random vectors in high dimensions, the tools that randomized algorithms rely on."}, {"title": "Statistical Rethinking 2024 homework", "url": "https://github.com/rmcelreath/stat_rethinking_2024/tree/main/homework", "type": "project", "by": "Richard McElreath, 2024", "level": 2, "note": "Solutions sit beside each week’s problems.", "build": "Nine weeks of Bayesian analyses written as code, from a globe-tossing posterior through causal graphs and binomial models to multilevel models of tadpoles and hunters.", "teaches": "Turning a scientific question into a generative model, then into a posterior you can simulate from, check, and argue about.", "time": "a term"}]}, {"id": "analysis", "title": "Real analysis", "kind": "concept", "track": "math", "pre": ["proofs", "calc"], "frontier": false, "core": "Real analysis rebuilds calculus on proof. A limit means that for every tolerance epsilon some delta works, and the real numbers have no gaps; from those two facts follow continuity, the mean value theorem, the integral, and the rules for when limits can be swapped.", "reach": "The rigor under PDEs and Fourier series, the measure theory behind stochastic calculus, and convergence proofs in numerical methods and convex optimization.", "uses": "Proving that numerical methods, optimizers, and series converge, and the base for measure theory and PDE theory. In ML it shows up in convergence proofs, approximation theorems for networks, and optimal transport.", "worth": "you want to prove theorems in ML theory, optimization, or probability; skip it if you apply methods and read papers for their ideas.", "resources": [{"title": "MIT 18.100A: Real Analysis", "url": "https://ocw.mit.edu/courses/18-100a-real-analysis-fall-2020/", "type": "course", "by": "Casey Rodriguez, MIT OCW, 2020", "level": 1, "note": "Lectures 1 to 12 build the real numbers, sequences, and series; Lectures 13 to 25 cover continuity, derivatives, the Riemann integral, and uniform convergence."}, {"title": "Basic Analysis: Introduction to Real Analysis", "url": "https://www.jirka.org/ra/", "type": "book", "by": "Jiří Lebl, version 6.3, 2026", "level": 2, "note": "Free text from the real line through continuity, the derivative, and the Riemann integral, then metric spaces in Chapter 7; Volume II goes to several variables."}, {"title": "Understanding Analysis", "url": "https://link.springer.com/book/10.1007/978-1-4939-2712-8", "type": "book", "by": "Stephen Abbott, 2nd edition, 2015", "level": 2, "note": "Slower and more motivated than the standard texts; Section 1.1 opens with why the square root of 2 is irrational.", "paid": true}, {"title": "A Lean companion to Analysis I", "url": "https://github.com/teorth/analysis", "type": "project", "by": "Terence Tao, 2025", "level": 2, "build": "Lean proofs of the exercises Tao leaves open in Analysis I, from the construction of the reals through limits, series, continuity, derivatives, and the Riemann integral.", "teaches": "Epsilon-delta arguments with every quantifier written out, so a proof is finished only when Lean accepts it.", "time": "a term"}]}, {"id": "pde", "title": "Partial differential equations and Fourier analysis", "kind": "concept", "track": "math", "pre": ["diffeq"], "frontier": false, "core": "A partial differential equation links rates of change in space and time, like the heat equation u_t = u_xx. Fourier’s idea solves the linear ones: split the starting state into sine waves, let each evolve on its own, and add them back up.", "reach": "Fourier modes return in quantum mechanics, fluid mechanics, heat transfer, signals, and Black-Scholes; finite elements and CFD discretize these equations.", "uses": "Weather and climate models, heat and stress analysis, acoustics, MRI reconstruction, option pricing, and JPEG and MP3 compression, which rest on Fourier-type transforms. The forward process of diffusion models obeys a heat-type equation.", "worth": "you want physics, engineering simulation, or a deep grasp of diffusion models and Fourier features; most ML researchers can stop after the heat equation.", "resources": [{"title": "But what is a Fourier series? From heat flow to drawing with circles | DE4", "url": "https://www.youtube.com/watch?v=r6sGWTCMz2k", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2019", "level": 1, "note": "Twenty-five minutes from the heat equation to Fourier series; DE2 and DE3 in the same series set up the equation itself."}, {"title": "MIT 18.303: Linear Partial Differential Equations: Analysis and Numerics", "url": "https://ocw.mit.edu/courses/18-303-linear-partial-differential-equations-analysis-and-numerics-fall-2014/", "type": "course", "by": "Steven G. Johnson, MIT OCW, 2014", "level": 2, "note": "Heat, wave, and Poisson equations treated like matrix problems: eigenfunctions, separation of variables, and Green’s functions, then finite differences and finite elements in Julia."}, {"title": "Fourier Analysis [Data-Driven Science and Engineering]", "url": "https://www.youtube.com/playlist?list=PLMrJAkhIeNNT_Xh3Oy0Y4LTj0Oxo8GqsC", "type": "video", "by": "Steve Brunton, 2020", "level": 2, "note": "Fourier series as projection onto an orthogonal basis, the Fourier transform, solving the heat equation with it, and the discrete transform, with MATLAB and Python code."}, {"title": "Partial Differential Equations: An Introduction", "url": "https://www.wiley.com/en-us/Partial+Differential+Equations%3A+An+Introduction%2C+2nd+Edition-p-9780470054567", "type": "book", "by": "Walter Strauss, 2nd edition, 2007", "level": 2, "note": "The standard undergraduate text, centered on the wave, heat, and Laplace equations with little jargon.", "paid": true}, {"title": "Practical Numerical Methods with Python, Module 4: Spreading out", "url": "https://github.com/numerical-mooc/numerical-mooc/tree/master/lessons/04_spreadout", "type": "project", "by": "Barba, Cooper, Forsyth, George Washington University, 2014", "level": 2, "build": "Explicit, implicit, and Crank-Nicolson solvers for the heat equation in one and two dimensions, then the Gray-Scott reaction-diffusion model on a 192 by 192 grid.", "teaches": "Why explicit schemes need tiny time steps, how boundary conditions enter the linear system, and how diffusion plus a reaction makes spots and stripes.", "time": "a week"}]}, {"id": "numerics", "title": "Numerical methods", "kind": "concept", "track": "math", "pre": ["diffeq", "linalg"], "frontier": false, "core": "Numerical methods replace continuous math with finite arithmetic: derivatives become differences, integrals become sums, and equations become linear systems solved by factorization or iteration. Each method trades accuracy for cost, and analysis asks how fast its error shrinks and whether rounding errors grow.", "reach": "The engine inside finite element, CFD and quantum chemistry codes, and physics simulation for graphics.", "uses": "Every simulation code, from weather prediction and crash testing to aircraft design, plus the BLAS and LAPACK libraries under NumPy and PyTorch. Low-precision training and the stable softmax are numerical analysis problems.", "worth": "you build simulators or scientific ML, or want to know why training diverges in low precision; skip convergence proofs if you only call solvers.", "resources": [{"title": "Fundamentals of Numerical Computation", "url": "https://fncbook.com/", "type": "book", "by": "Tobin Driscoll, Richard Braun, SIAM 2017, free online edition", "level": 1, "note": "Chapters 2 to 6: linear systems, least squares, root finding, interpolation, and ODE initial value problems; Chapters 10 to 13 move to boundary value problems and PDEs. Code in Julia, MATLAB, or Python."}, {"title": "Computational Methods for Engineers", "url": "https://empossible.net/academics/emp4301_5301/", "type": "lectures", "by": "Raymond Rumpf, UTEP, 2023", "level": 1, "note": "Lecture videos and notes from errors in computation through linear solvers, root finding, curve fitting, numerical integration, and the finite-difference method."}, {"title": "What Every Computer Scientist Should Know About Floating-Point Arithmetic", "url": "https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html", "type": "paper", "by": "David Goldberg, 1991", "level": 2, "note": "Rounding, relative error, and catastrophic cancellation: the failure modes every numerical code inherits."}, {"title": "MIT 18.335J: Introduction to Numerical Methods", "url": "https://ocw.mit.edu/courses/18-335j-introduction-to-numerical-methods-spring-2019/", "type": "course", "by": "Steven G. Johnson, MIT OCW, 2019", "level": 3, "note": "Graduate numerical linear algebra: floating point, conditioning, backward stability, and dense and iterative solvers for linear systems and eigenproblems."}, {"title": "The SIAM 100-Dollar, 100-Digit Challenge", "url": "https://people.maths.ox.ac.uk/trefethen/hundred.html", "type": "project", "by": "Nick Trefethen, SIAM News, 2002", "level": 3, "note": "The page gives every answer to forty digits for checking.", "build": "Ten numbers, each the answer to a hard numerical problem such as an oscillating integral, a photon bouncing among mirrors, or the norm of an infinite matrix, computed to ten digits.", "teaches": "Matching a method to each problem, then defending every digit with error estimates, extrapolation, and a check by a second method.", "time": "a month"}]}, {"id": "ds", "title": "Data structures and complexity analysis", "kind": "concept", "track": "algo", "pre": ["proofs"], "frontier": false, "core": "A data structure arranges data so a program’s frequent operations are fast; asymptotic analysis counts how running time grows with input size. Arrays, hash tables, heaps, and balanced search trees each make some operations cheap, such as lookup, minimum, or ordered search, and others costly.", "reach": "Every other algorithms node builds on it, and so do the indexes inside databases.", "uses": "Every piece of software: database indexes, caches, compilers, operating system schedulers, and search engines. In ML systems it decides how a KV cache is laid out and how nearest-neighbor search over embeddings scales.", "worth": "you write code that must be fast or face technical interviews; everyone in ML engineering needs the basics, few need exotic structures.", "resources": [{"title": "MIT 6.006: Introduction to Algorithms", "url": "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/", "type": "course", "by": "Erik Demaine, Jason Ku, Justin Solomon, MIT OCW, 2020", "level": 1, "note": "Lectures 1 to 8: asymptotic analysis, dynamic arrays, sorting, hashing, binary trees with AVL balancing, and binary heaps."}, {"title": "Algorithms, Part I", "url": "https://www.coursera.org/learn/algorithms-part1", "type": "course", "by": "Robert Sedgewick, Kevin Wayne, Princeton, Coursera", "level": 2, "note": "Java implementations of union-find, sorting, priority queues, balanced search trees, and hash tables, backed by the algs4 booksite."}, {"title": "Introduction to Algorithms, 4th edition", "url": "https://mitpress.mit.edu/9780262046305/introduction-to-algorithms/", "type": "book", "by": "Cormen, Leiserson, Rivest, Stein, MIT Press, 2022", "level": 3, "note": "The reference: look up a structure, its analysis, or its proof here rather than reading straight through.", "paid": true}, {"title": "Algorithms, Part I: Percolation", "url": "https://coursera.cs.princeton.edu/algs4/assignments/percolation/specification.php", "type": "project", "by": "Sedgewick, Wayne, Princeton", "level": 1, "build": "A Monte Carlo estimate of the percolation threshold of a random grid, using a weighted quick-union structure to test whether the top connects to the bottom as sites open.", "teaches": "That the right data structure can make a slow simulation fast, and how to measure that it did.", "time": "a weekend", "signature": true}]}, {"id": "graphs", "title": "Graph algorithms", "kind": "concept", "track": "algo", "pre": ["ds"], "frontier": false, "core": "Model a problem as vertices and edges, and a few algorithms answer it: breadth-first and depth-first search for reachability and ordering, Dijkstra and Bellman-Ford for shortest paths, greedy rules for spanning trees, and augmenting paths for maximum flow.", "reach": "Behind motion planning, network routing, dependency ordering in compilers, advanced data structures, and the reductions in complexity theory.", "uses": "Map and GPS routing, internet routing protocols, social network analysis, package managers resolving dependencies, and airline scheduling. Autograd runs backpropagation by walking a model’s computation graph in reverse topological order.", "worth": "you write software, interview, or work on planning or graph neural networks; BFS, DFS, Dijkstra, and topological sort cover daily needs.", "resources": [{"title": "MIT 6.006: Introduction to Algorithms", "url": "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/", "type": "course", "by": "Erik Demaine, Jason Ku, Justin Solomon, MIT OCW, 2020", "level": 1, "note": "Lectures 9 to 14: breadth-first and depth-first search, then Bellman-Ford, Dijkstra, and all-pairs shortest paths with Johnson’s algorithm."}, {"title": "Algorithms", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/", "type": "book", "by": "Jeff Erickson, 2019", "level": 2, "note": "Chapters 5 to 11: graph search, depth-first search, minimum spanning trees, shortest paths, all-pairs shortest paths, and maximum flow with its applications."}, {"title": "Algorithms, Part II", "url": "https://www.coursera.org/learn/algorithms-part2", "type": "course", "by": "Robert Sedgewick, Kevin Wayne, Princeton, Coursera", "level": 2, "note": "Working Java code for undirected and directed graphs, minimum spanning trees, shortest paths, and max flow."}, {"title": "CS261: A Second Course in Algorithms", "url": "http://timroughgarden.org/w16/w16.html", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2016", "level": 3, "note": "Lectures 1 to 6 go deep on flows: Edmonds-Karp, Dinic, push-relabel, applications, and min-cost matching, with a video and notes for each."}, {"title": "Algorithms, Part II: WordNet", "url": "https://coursera.cs.princeton.edu/algs4/assignments/wordnet/specification.php", "type": "project", "by": "Sedgewick, Wayne, Princeton", "level": 2, "build": "A shortest ancestral path structure over the WordNet hypernym graph, used to measure how related two nouns are and to find the outcast in a list.", "teaches": "Breadth-first search on a large real digraph, and designing an API around a graph algorithm.", "time": "a week"}, {"title": "Algorithms, Part II: Baseball Elimination", "url": "https://coursera.cs.princeton.edu/algs4/assignments/baseball/specification.php", "type": "project", "by": "Sedgewick, Wayne, Princeton", "level": 2, "build": "A program that decides which teams in a division are mathematically eliminated by solving a maximum flow problem for each team, and reads the minimum cut as proof.", "teaches": "Reducing a question that is not about graphs to maximum flow, and using the minimum cut as a certificate a person can check.", "time": "a weekend"}]}, {"id": "dp", "title": "Dynamic programming", "kind": "concept", "track": "algo", "pre": ["ds"], "frontier": false, "core": "Dynamic programming solves a problem from the answers to its smaller subproblems, storing each answer so it is computed once. The hard part is choosing the subproblems and the recurrence linking them; filling a table in the right order, or memoized recursion, does the rest.", "reach": "The same recurrences align sequences, drive Bellman equations in optimal control, and parse grammars in compilers.", "uses": "DNA and protein sequence alignment, Viterbi decoding in speech recognition, spell-checker edit distance, TeX’s line breaking, and inventory planning. Reinforcement learning’s value functions satisfy the same Bellman equations.", "worth": "you face interviews, sequence problems, or reinforcement learning; skip contest-level tricks unless you compete.", "resources": [{"title": "MIT 6.006: Introduction to Algorithms", "url": "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/", "type": "course", "by": "Erik Demaine, Jason Ku, Justin Solomon, MIT OCW, 2020", "level": 1, "note": "Lectures 15 to 18 teach SRTBOT, a recipe for any DP (subproblems, relate, topological order, base cases, original problem, time), on LCS, LIS, coins, and subset sum."}, {"title": "Dynamic Programming (Chapter 3 of Algorithms)", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/book/03-dynprog.pdf", "type": "book", "by": "Jeff Erickson, 2019", "level": 2, "note": "From memoization to longest increasing subsequence, edit distance, subset sum, optimal binary search trees, and DP on trees, with exercises."}, {"title": "Educational DP Contest", "url": "https://atcoder.jp/contests/dp", "type": "tutorial", "by": "AtCoder, 2019", "level": 2, "note": "Twenty-six judged problems, Frog 1 to Frog 3: knapsack, LCS, DAG paths, intervals, bitmasks, trees, digits, and matrix powers."}, {"title": "Divide and Conquer DP", "url": "https://cp-algorithms.com/dynamic_programming/divide-and-conquer-dp.html", "type": "notes", "by": "cp-algorithms", "level": 3, "note": "Speeds up recurrences whose best split point moves monotonically; the Knuth optimization article beside it is the companion."}, {"title": "Algorithms, Part II: Seam Carving", "url": "https://coursera.cs.princeton.edu/algs4/assignments/seam/specification.php", "type": "project", "by": "Sedgewick, Wayne, Princeton", "level": 2, "build": "Content-aware image resizing that removes the lowest-energy seam of pixels again and again, each found as a shortest path in a directed acyclic graph.", "teaches": "Dynamic programming as shortest paths in a DAG, on a problem whose answer you can see.", "time": "a weekend"}]}, {"id": "greedy", "title": "Greedy and divide and conquer", "kind": "concept", "track": "algo", "pre": ["ds"], "frontier": false, "core": "A greedy algorithm commits to the choice that looks best now and never revisits it; an exchange argument shows this is safe. Divide and conquer splits a problem into smaller copies, solves them recursively, and combines the results; the master theorem gives its running time.", "reach": "Greedy rules give minimum spanning trees and Huffman codes; divide and conquer gives mergesort, fast multiplication, and the FFT behind signals.", "uses": "File compression (Huffman coding inside ZIP and JPEG), standard library sorting, and the FFT in audio, radar, and wireless. Greedy decoding in language models makes the same commit-now choice, without the guarantees.", "worth": "you design algorithms or interview; for most ML researchers one pass through exchange arguments and the master theorem is plenty.", "resources": [{"title": "Divide and Conquer, Sorting and Searching, and Randomized Algorithms", "url": "https://www.coursera.org/learn/algorithms-divide-conquer", "type": "course", "by": "Tim Roughgarden, Stanford, Coursera", "level": 1, "note": "Merge sort, Karatsuba multiplication, the master method, closest pair, and the randomized analysis of QuickSort."}, {"title": "Greedy Algorithms, Minimum Spanning Trees, and Dynamic Programming", "url": "https://www.coursera.org/learn/algorithms-greedy", "type": "course", "by": "Tim Roughgarden, Stanford, Coursera", "level": 1, "note": "Greedy scheduling, Prim and Kruskal, clustering, and Huffman codes, then a first look at DP with knapsack and sequence alignment."}, {"title": "Algorithms", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/", "type": "book", "by": "Jeff Erickson, 2019", "level": 2, "note": "Chapter 1 (Recursion) covers divide and conquer and solving recurrences; Chapter 4 (Greedy Algorithms) proves greedy choices correct with exchange arguments."}, {"title": "MIT 6.046J: Design and Analysis of Algorithms", "url": "https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/", "type": "course", "by": "Erik Demaine, Srini Devadas, Nancy Lynch, MIT OCW, 2015", "level": 2, "note": "Lectures 1 to 3 and 12: interval scheduling, convex hull, median finding, the FFT, and minimum spanning trees."}, {"title": "CS106B Assignment 7: Huffman Coding", "url": "https://web.stanford.edu/class/archive/cs/cs106b/cs106b.1266/assignments/7-huffman/", "type": "project", "by": "Julie Zelenski, Stanford CS106B, 2026", "level": 1, "build": "A file compressor and decompressor that builds a Huffman tree by repeatedly merging the two rarest subtrees from a priority queue, then flattens the tree into the file header.", "teaches": "How a greedy merge produces an optimal prefix code, and the tree and bit plumbing a working compressor needs.", "time": "a week"}, {"title": "Karatsuba against schoolbook multiplication", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/book/01-recursion.pdf", "type": "project", "by": "Built on Erickson, Algorithms, Chapter 1, 2019", "level": 2, "build": "Schoolbook and Karatsuba multiplication of n-digit integers stored as digit arrays, timed from 64 to 8,192 digits, with a cutoff where Karatsuba hands small cases to schoolbook.", "teaches": "How saving one recursive multiplication lowers the exponent, as the master theorem predicts, and why constant factors decide where the faster algorithm starts winning.", "time": "a day", "made": true, "done": "On a log-log plot the schoolbook times have slope near 2 and Karatsuba’s near 1.58, the O(n^1.58496) bound in the chapter’s Fast Multiplication section."}]}, {"id": "advds", "title": "Advanced data structures", "kind": "concept", "track": "algo", "pre": ["graphs"], "frontier": false, "core": "Precompute structure so each query is cheap. A segment tree or Fenwick tree answers range sums under updates in logarithmic time, union-find merges sets in nearly constant time, and augmented balanced trees answer order statistics; the mix of queries picks the structure.", "reach": "The toolkit competitive programming leans on; union-find drives Kruskal’s algorithm, and range trees and kd-trees serve graphics and motion planning.", "uses": "Range queries in databases and game servers, network connectivity checks, image segmentation by union-find, collision detection, and kd-tree nearest-neighbor search over point clouds in robotics.", "worth": "you compete, interview at trading or top tech firms, or build query-heavy systems; most ML researchers can skip it.", "resources": [{"title": "Competitive Programmer’s Handbook", "url": "https://cses.fi/book/book.pdf", "type": "book", "by": "Antti Laaksonen, 2018", "level": 1, "note": "Chapter 9 (static queries, binary indexed trees, segment trees), Section 15.2 (union-find), and Chapter 28 (lazy propagation and dynamic trees)."}, {"title": "Point Update Range Sum (USACO Guide, Gold)", "url": "https://usaco.guide/gold/PURS", "type": "tutorial", "by": "USACO Guide", "level": 2, "note": "Segment trees and binary indexed trees with code and graded practice problems."}, {"title": "Segment Tree", "url": "https://cp-algorithms.com/data_structures/segment_tree.html", "type": "notes", "by": "cp-algorithms", "level": 2, "note": "Past the basics: lazy propagation for range updates, persistent and dynamic segment trees, and higher dimensions."}, {"title": "Computational Geometry: Algorithms and Applications", "url": "https://link.springer.com/book/10.1007/978-3-540-77974-2", "type": "book", "by": "de Berg, Cheong, van Kreveld, Overmars, 3rd edition, 2008", "level": 3, "note": "Chapters 5 (Orthogonal Range Searching) and 10 (More Geometric Data Structures): kd-trees, range trees, interval trees, and segment trees over points and intervals.", "paid": true}, {"title": "MIT 6.851: Advanced Data Structures", "url": "https://ocw.mit.edu/courses/6-851-advanced-data-structures-spring-2012/", "type": "course", "by": "Erik Demaine, MIT OCW, 2012", "level": 3, "note": "Research-level sessions on persistence, retroactivity, dynamic optimality, cache-oblivious and integer structures, succinct structures, and dynamic graphs."}, {"title": "Algorithms, Part I: Kd-Trees", "url": "https://coursera.cs.princeton.edu/algs4/assignments/kdtree/specification.php", "type": "project", "by": "Sedgewick, Wayne, Princeton", "level": 2, "build": "A 2d-tree over points in the unit square that answers range search and nearest neighbor queries, raced against a brute-force set on a million points.", "teaches": "How partitioning space prunes most of a search, and how to measure the speedup instead of assuming it.", "time": "a week"}]}, {"id": "cp", "title": "Competitive programming", "kind": "concept", "track": "algo", "pre": ["dp", "advds", "greedy"], "frontier": false, "core": "Contest problems are solved under a time limit by recognizing a known pattern, such as greedy, DP, graph search, or range queries, and checking that its complexity fits the input bounds at about 10^8 operations per second. Fluency comes from many graded problems and editorials.", "reach": "The pattern recognition technical interviews test, and practice for every algo node.", "uses": "Coding interviews at tech and trading firms and contests like ICPC and Codeforces. It is also an AI benchmark: AlphaCode and later reasoning models are scored on contest problems.", "worth": "you face algorithm interviews or evaluate code-generating models; skip it if neither applies, since the returns fall off quickly.", "resources": [{"title": "Competitive Programmer’s Handbook", "url": "https://cses.fi/book/book.pdf", "type": "book", "by": "Antti Laaksonen, 2018", "level": 1, "note": "A free, compact map of contest techniques by the main developer of CSES."}, {"title": "CSES Problem Set", "url": "https://cses.fi/problemset/", "type": "tutorial", "by": "Antti Laaksonen and others, CSES", "level": 2, "note": "400 problems grouped by technique, from introductory problems through sorting and searching, DP, graphs, range queries, trees, math, strings, and geometry."}, {"title": "Competitive Programming 4", "url": "https://cpbook.net/", "type": "book", "by": "Steven Halim, Felix Halim, Suhendry Effendy, 2020", "level": 2, "note": "Book 1 (Chapters 1 to 4) covers most of the IOI syllabus; Book 2 (Chapters 5 to 9) adds the wider topics seen at ICPC regionals and finals.", "paid": true}, {"title": "Solving CSES Problemset [12 Hour Livestream] [150 coding problems]", "url": "https://www.youtube.com/watch?v=dZ_6MS14Mg4", "type": "video", "by": "William Lin, 2020", "level": 2, "note": "Watch a top competitor solve 150 CSES problems while explaining his choices."}, {"title": "USACO Guide", "url": "https://usaco.guide/", "type": "tutorial", "by": "USACO Guide", "level": 1, "note": "A free curriculum from Bronze to Platinum; each module pairs an explanation with graded problems."}, {"title": "Algorithms for Competitive Programming", "url": "https://cp-algorithms.com/", "type": "notes", "by": "cp-algorithms", "level": 3, "note": "Reference articles for the algorithms contests use, from number theory and flows to string algorithms."}, {"title": "AtCoder Beginner Contest archive", "url": "https://atcoder.jp/contests/archive?ratedType=1&lang=en", "type": "project", "by": "AtCoder", "level": 2, "build": "Past Beginner Contests taken as virtual contests, seven tasks in 100 minutes for recent rounds, with the unsolved tasks finished afterward from the official editorial.", "teaches": "Reading the constraints to pick an algorithm against the clock, and the gap between knowing a technique and getting it accepted in time.", "time": "a term"}]}, {"id": "automata", "title": "Automata and formal languages", "kind": "concept", "track": "theory", "pre": ["proofs"], "frontier": false, "core": "A finite automaton has fixed memory, reads a string once, and accepts or rejects it; the languages it accepts are exactly those that regular expressions describe. Adding a stack gives context-free grammars, and the pumping lemmas prove what each model cannot recognize.", "reach": "Regular expressions and grammars are the front end of compilers; adding unbounded memory leads to computability.", "uses": "Regular expression engines, the lexers in every compiler, grep and other text search, packet inspection, and hardware protocol verification. Constrained LLM decoding compiles a regex or grammar into an automaton that masks invalid tokens.", "worth": "you build compilers, parsers, verification tools, or structured LLM output; otherwise a week on regular languages is enough.", "resources": [{"title": "MIT 18.404J: Theory of Computation", "url": "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/", "type": "course", "by": "Michael Sipser, MIT OCW, 2020", "level": 1, "note": "Lectures 1 to 5: finite automata, nondeterminism, regular expressions, the pumping lemma, context-free grammars, and pushdown automata."}, {"title": "Introduction to the Theory of Computation", "url": "https://www.cengage.com/c/introduction-to-the-theory-of-computation-3e-sipser/9781133187790/", "type": "book", "by": "Michael Sipser, 3rd edition, 2012", "level": 2, "note": "Part 1, Automata and Languages; the lectures above follow the book.", "paid": true}, {"title": "Models of Computation", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/models/all-models.pdf", "type": "notes", "by": "Jeff Erickson, 2018", "level": 2, "note": "Free notes on strings, regular languages, DFAs, NFAs, and context-free languages, each ending with exercises."}, {"title": "Regular Expression Matching Can Be Simple And Fast", "url": "https://swtch.com/~rsc/regexp/regexp1.html", "type": "project", "by": "Russ Cox, 2007", "level": 1, "note": "The article includes C code to check yours against.", "build": "A regular expression matcher that compiles a pattern into an NFA with Thompson’s construction and simulates all its states at once, raced against a backtracking matcher.", "teaches": "Why the automata from theory class run in linear time, and why backtracking engines in Perl and Python can take exponential time.", "time": "a weekend", "signature": true}]}, {"id": "computability", "title": "Computability and Turing machines", "kind": "concept", "track": "theory", "pre": ["automata"], "frontier": false, "core": "A Turing machine, a finite control with an unbounded tape, can compute anything any computer can (the Church-Turing thesis). Diagonalization then shows that some problems have no algorithm at all: no program decides whether an arbitrary program halts, and reductions spread that impossibility.", "reach": "Complexity theory asks the same questions under a time budget; Rice’s theorem limits what program analyzers in compilers can decide.", "uses": "Knowing what software can never do: no tool can decide in general whether programs halt or contain a given bug, which limits static analyzers and malware scanners. It also frames claims about transformer expressivity.", "worth": "you work on theory, programming languages, or model expressivity; skip it if the intuition that some questions are undecidable is enough.", "resources": [{"title": "Math’s Fundamental Flaw", "url": "https://www.youtube.com/watch?v=HeQX2HjkcNo", "type": "video", "by": "Veritasium, 2021", "level": 1, "note": "A 34-minute story of Hilbert’s program, Gödel’s incompleteness, and Turing’s halting problem."}, {"title": "MIT 18.404J: Theory of Computation", "url": "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/", "type": "course", "by": "Michael Sipser, MIT OCW, 2020", "level": 2, "note": "Lectures 5 to 11: Turing machines and their variants, decidability, undecidability, reducibility, the computation history method, and the recursion theorem."}, {"title": "Introduction to the Theory of Computation", "url": "https://www.cengage.com/c/introduction-to-the-theory-of-computation-3e-sipser/9781133187790/", "type": "book", "by": "Michael Sipser, 3rd edition, 2012", "level": 2, "note": "Part 2, Computability Theory.", "paid": true}, {"title": "The Busy Beaver Frontier", "url": "https://www.scottaaronson.com/papers/bb.pdf", "type": "paper", "by": "Scott Aaronson, 2020", "level": 3, "note": "Busy beaver numbers, which outgrow every computable function, and the open problems around them."}, {"title": "Run the five-state busy beaver, then prove a machine never halts", "url": "https://bbchallenge.org/method", "type": "project", "by": "Built on the Busy Beaver Challenge, 2024", "level": 2, "note": "The champion’s transition table is on the site’s Story page.", "build": "A Turing machine simulator run on the Marxen and Buntrock champion, then a decider that proves cycling machines from the bbchallenge seed database never halt.", "teaches": "Why no program decides halting for every machine, yet single machines can be settled with a certificate that a checker trusts.", "time": "a weekend", "made": true, "done": "The champion halts after exactly 47,176,870 steps, and your cycler decider proves Machine #123, one of the site’s 11,229,238 Cyclers, never halts."}]}, {"id": "complexity", "title": "Complexity: P, NP and reductions", "kind": "concept", "track": "theory", "pre": ["computability", "graphs"], "frontier": false, "core": "P holds the problems solvable in polynomial time; NP holds those whose solutions can be checked in polynomial time. A reduction turns one problem into another, so a fast algorithm for any NP-complete problem, such as SAT, would give one for all of NP.", "reach": "Tells you when to stop seeking an exact algorithm and reach for randomized algorithms or integer solvers; zero-knowledge proofs are built on NP.", "uses": "Deciding when to stop hunting for an exact algorithm in scheduling, chip layout, and logistics. Cryptography’s security rests on complexity assumptions, and SAT solvers verify hardware and software designs every day.", "worth": "you design algorithms, work in cryptography, or study which learning problems are hard; NP-completeness and reductions are enough for most.", "resources": [{"title": "What P vs NP is actually about", "url": "https://www.youtube.com/watch?v=6OPsH8PK7xM", "type": "video", "by": "Polylog, 2024", "level": 1, "note": "An 18-minute explanation of NP through the programs that check solutions, and what a fast SAT solver would imply."}, {"title": "MIT 18.404J: Theory of Computation", "url": "https://ocw.mit.edu/courses/18-404j-theory-of-computation-fall-2020/", "type": "course", "by": "Michael Sipser, MIT OCW, 2020", "level": 2, "note": "Lectures 12 to 18: time complexity, P and NP, polynomial-time reductions, NP-completeness and the Cook-Levin theorem, then space complexity and PSPACE."}, {"title": "NP-Hardness (Chapter 12 of Algorithms)", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/book/12-nphard.pdf", "type": "book", "by": "Jeff Erickson, 2019", "level": 2, "note": "Fifty pages of reductions from the algorithm designer’s side, with worked NP-hardness proofs and exercises."}, {"title": "Computational Complexity: A Modern Approach", "url": "https://theory.cs.princeton.edu/complexity/", "type": "book", "by": "Sanjeev Arora, Boaz Barak, Cambridge, 2009", "level": 3, "note": "Graduate text with a free draft: Chapters 1 to 7 cover models, NP, diagonalization, space, the polynomial hierarchy, circuits, and randomized computation."}, {"title": "Astonishing discovery by computer scientist: how to squeeze space into time", "url": "https://www.youtube.com/watch?v=8JuWdXrCmWg", "type": "video", "by": "Chalk Talk, 2025", "level": 3, "note": "Ryan Williams’s 2025 result that any computation running in time t can be simulated in roughly the square root of t space."}, {"title": "Find where random 3-SAT gets hard", "url": "https://cdn.aaai.org/AAAI/1992/AAAI92-071.pdf", "type": "project", "by": "Built on Mitchell, Selman, Levesque, 1992", "level": 2, "build": "A Davis-Putnam solver with unit propagation, run on random 3-SAT formulas over 50 variables as the ratio of clauses to variables sweeps from 2 to 8.", "teaches": "That NP-completeness is about the worst case: random formulas are easy on either side of a sharp threshold and hardest right at it.", "time": "a weekend", "made": true, "done": "Half the formulas are satisfiable near 4.3 clauses per variable, and median solver calls peak there, as in Figures 3 and 4 of the paper."}]}, {"id": "randalg", "title": "Randomized and approximation algorithms", "kind": "concept", "track": "theory", "pre": ["complexity", "prob", "lp"], "frontier": false, "core": "When exact answers are too slow or NP-hard, trade certainty for speed. Randomized algorithms flip coins to run fast on every input with high probability; approximation algorithms return answers provably within a factor of optimal, often by rounding a linear program.", "reach": "Hashing and sketches in databases, LP rounding for integer problems, and the Monte Carlo methods used across simulation.", "uses": "Hash tables, load balancing, streaming sketches like HyperLogLog that count distinct users, primality tests for generating cryptographic keys, and approximate routing and scheduling. Random projections and sketching speed up large-scale ML.", "worth": "you work on large data systems, theory, or efficient ML methods; skip it if you never meet NP-hard problems or huge streams.", "resources": [{"title": "MIT 6.046J: Design and Analysis of Algorithms", "url": "https://ocw.mit.edu/courses/6-046j-design-and-analysis-of-algorithms-spring-2015/", "type": "course", "by": "Erik Demaine, Srini Devadas, Nancy Lynch, MIT OCW, 2015", "level": 1, "note": "Lectures 6 to 8 and 17: randomized matrix product checking and quicksort, skip lists, universal and perfect hashing, then approximation algorithms."}, {"title": "More Algorithms Lecture Notes", "url": "https://jeffe.cs.illinois.edu/teaching/algorithms/", "type": "notes", "by": "Jeff Erickson, UIUC", "level": 2, "note": "The Director’s Cut notes on discrete probability, treaps and skip lists, tail inequalities, hashing, and randomized minimum cut."}, {"title": "CS261: A Second Course in Algorithms", "url": "http://timroughgarden.org/w16/w16.html", "type": "lectures", "by": "Tim Roughgarden, Stanford, 2016", "level": 2, "note": "Lectures 15 to 18: approximation algorithms, the traveling salesman problem, LP rounding, and randomized approximation, with a video and notes for each."}, {"title": "The Design of Approximation Algorithms", "url": "https://www.designofapproxalgs.com/", "type": "book", "by": "David Williamson, David Shmoys, Cambridge, 2011", "level": 3, "note": "Free electronic edition, organized by technique: greedy and local search, dynamic programming, LP and SDP rounding, randomization, and hardness of approximation."}, {"title": "HyperLogLog from the paper", "url": "https://dmtcs.episciences.org/3545", "type": "project", "by": "Built on Flajolet, Fusy, Gandouet, Meunier, 2007", "level": 2, "build": "HyperLogLog as in the paper’s Figure 2: hash each item, keep the longest run of leading zeros seen in each of m registers, and combine them with a harmonic mean.", "teaches": "That a few kilobytes of hashed randomness can count millions of distinct items, and where small counts need the paper’s correction.", "time": "a day", "made": true, "done": "Over 100 random streams with m = 1024 registers, the relative standard error lands near 1.04/sqrt(m), about 3.3 percent, as Theorem 1 states."}, {"title": "Goemans-Williamson max cut", "url": "https://math.mit.edu/~goemans/PAPERS/maxcut-jacm.pdf", "type": "project", "by": "Built on Goemans, Williamson, 1995", "level": 3, "build": "The max cut semidefinite relaxation solved with CVXPY on random graphs, then random hyperplane rounding of its vectors, keeping the best of 50 cuts as the paper did.", "teaches": "The template behind most approximation algorithms: relax a hard problem to a convex one, round at random, and bound the expected loss.", "time": "a day", "made": true, "done": "On 50-vertex graphs with edge probability 1/2, the best cut averages about 0.97 of the semidefinite bound, as in Table I, and never falls below the proved 0.87856."}]}, {"id": "circuits", "title": "Circuit analysis", "kind": "concept", "track": "hardware", "pre": ["calc"], "frontier": false, "core": "A circuit is a graph of elements, each obeying one law (V = IR, i = C dv/dt), joined by Kirchhoff’s laws: currents into a node sum to zero, as do voltages aroun
