<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machine Learning Research Roadmap</title>
<script>try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
<meta name="description" content="A prerequisite graph of machine learning research, from linear algebra to flow maps, diffusion language models, RL, graphics, biology and safety, with verified resources for every idea.">
<style>
/* Layout: a compact header, then the map fills the viewport; a panel slides in from the right
   (a bottom sheet on phones). Colors: the site's paper and ink, plus six track families. */
:root {
  color-scheme: light;
  --paper: #ffffff; --sunk: #f6f5f2; --card: #ffffff;
  --ink: #1b1b1d; --ink-2: #4a4a50; --muted: #70707a; --rule: #e4e3de; --rule-soft: #efeeea;
  --accent: #1a4f8c; --accent-soft: #e6eef8;
  --edge: #b9b8b2; --edge-x: #d8d7d2;
  --f-0: #8a8983; --f-1: #2a78d6; --f-2: #eb6834; --f-3: #1baf7a;
  --f-4: #eda100; --f-5: #e87ba4; --f-6: #008300; --f-7: #6250d6; --f-8: #e34948;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #16161a; --sunk: #1c1c21; --card: #212127;
    --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
    --accent: #7fb2e3; --accent-soft: #1d2b3b;
    --edge: #5d5d66; --edge-x: #3d3d45;
    --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
    --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #16161a; --sunk: #1c1c21; --card: #212127;
  --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
  --accent: #7fb2e3; --accent-soft: #1d2b3b;
  --edge: #5d5d66; --edge-x: #3d3d45;
  --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
  --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }

/* header */
header { flex: none; border-bottom: 1px solid var(--rule); padding-block: .7rem .6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.2rem; align-items: end; }
.crumb { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .25rem; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.25rem, 2.6vw, 1.7rem); line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.lede { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; margin: .3rem 0 0; max-width: 62rem; }
.tools { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.search { position: relative; }
.search input { width: 15rem; max-width: 100%; font: .9rem var(--sans); color: var(--ink); background: var(--sunk); border: 1px solid var(--rule);
  border-radius: 8px; padding: .45rem .7rem; }
.results { position: absolute; right: 0; top: calc(100% + 4px); width: min(24rem, 86vw); max-height: 60vh; overflow: auto; z-index: 40;
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); padding: .3rem; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: .45rem .55rem; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--sunk); }
.results .rt { font-weight: 600; font-size: .88rem; }
.results .rm { font-size: .76rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: .42rem .75rem; font-size: .85rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.totals { font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem .35rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; color: var(--ink-2); background: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: .18rem .55rem; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* map */
main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sunk); touch-action: none; cursor: grab; }
main.dragging { cursor: grabbing; }
main[hidden] { display: none !important; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }
.e { fill: none; stroke: var(--edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.e.x { stroke: var(--edge-x); stroke-width: 1.2; display: none; }
main.all-links .e.x, .e.x.hot { display: inline; }
.e.hot { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.e.dim { opacity: .18; }
.track { position: absolute; z-index: 0; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper); }
.track .tl { position: absolute; left: 14px; top: 9px; display: flex; gap: .45rem; align-items: center;
  font-family: var(--mono); font-size: clamp(11px, calc(9px * var(--inv, 1)), 17px); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
.track .tl .dot { width: 8px; height: 8px; }
.node { position: absolute; z-index: 2; display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--rule);
  border-top: 3px solid var(--c); border-radius: 8px; padding: 5px 8px 6px; cursor: pointer; overflow: hidden;
  box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.node:hover { box-shadow: 0 3px 10px rgb(0 0 0 / .12); border-color: var(--muted); border-top-color: var(--c); }
.node .k { display: flex; justify-content: space-between; gap: 4px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.node .k .fr { color: var(--ink-2); }
.node .t { font-size: 12.5px; font-weight: 600; line-height: 1.22; color: var(--ink); margin-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .p { margin-top: auto; height: 3px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.node .p i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 2px; }
.node.done { background: color-mix(in srgb, var(--c) 9%, var(--card)); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); border-top-color: var(--c); }
.node.anc { border-color: var(--accent); }
.node.dim { opacity: .3; }
.node.hit { box-shadow: 0 0 0 3px var(--accent); }
.zoom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-size: 1.05rem; line-height: 1; }
.zoom button.w { width: auto; padding: 0 .55rem; font-size: .75rem; }
.zoom button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 180px; z-index: 5;
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 6px; cursor: pointer; }
.mini svg { display: block; width: 100%; height: auto; }
.mini .vp { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 18; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 4; font-size: .76rem; color: var(--muted);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .75rem; white-space: nowrap; }

/* track map */
.tview { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--sunk); }
.tview[hidden] { display: none !important; }
.tscroll { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 12px; }
.tsize { margin: auto; position: relative; flex: none; }
.tworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tworld svg.edges { z-index: 1; }
.te { fill: none; stroke: var(--edge); vector-effect: non-scaling-stroke; }
.te.hot { stroke: var(--accent); }
.te.dim { opacity: .2; }
.tnode { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 4px; text-align: left; background: var(--card);
  border: 1px solid var(--rule); border-top: 4px solid var(--c); border-radius: 10px; padding: 9px 12px 10px; cursor: pointer;
  box-shadow: 0 1px 3px rgb(0 0 0 / .06); transition: opacity .15s, box-shadow .15s; overflow: hidden; }
.tnode:hover { box-shadow: 0 4px 14px rgb(0 0 0 / .13); border-color: var(--muted); border-top-color: var(--c); }
.tnode .tk { display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tnode .tt { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.15; color: var(--ink); }
.tnode .tc { font-family: var(--serif); font-size: 12.5px; line-height: 1.32; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tnode .p { margin-top: auto; height: 4px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; flex: none; }
.tnode .p i { display: block; height: 100%; width: 0; background: var(--c); }
.tnode.sel { box-shadow: 0 0 0 2px var(--accent); }
.tnode.anc { border-color: var(--accent); border-top-color: var(--c); }
.tnode.dim { opacity: .32; }
.thint { flex: none; margin: 0; padding: .5rem 16px .7rem; text-align: center; font-size: .8rem; color: var(--muted); }
.narrow .tnode { padding: 7px 9px 8px; }
.narrow .tnode .tt { font-size: 14.5px; }
.narrow .tnode .tc { font-size: 11.5px; -webkit-line-clamp: 2; }
.primary { display: inline-flex; align-items: center; gap: .4rem; margin: .2rem 0 .2rem; font-size: .86rem; font-weight: 600; color: var(--paper);
  background: var(--ink); border: 0; border-radius: 8px; padding: .5rem .85rem; cursor: pointer; }
.tlinks { font-size: .86rem; color: var(--ink-2); line-height: 1.5; margin: 0; }
.ideas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.ideas li button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .8rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .55rem .1rem; cursor: pointer; }
.ideas li button:hover { background: var(--sunk); }
.ideas .it { font-weight: 600; font-size: .9rem; }
.ideas .ik { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .35rem; font-weight: 400; }
.ideas .ip { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* list */
.list { flex: 1; min-height: 0; overflow: auto; background: var(--paper); }
.list[hidden] { display: none !important; }
.list .in { max-width: 54rem; margin: 0 auto; padding-block: 1.2rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list h2 { display: flex; gap: .5rem; align-items: center; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; margin: 2rem 0 .4rem; padding-bottom: .45rem; border-bottom: 1px solid var(--rule); }
.list h2:first-child { margin-top: .4rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .75rem .2rem; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row .rt { font-weight: 600; font-size: .98rem; }
.row .rk { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .4rem; font-weight: 400; }
.row .rc { grid-column: 1; font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.row .rp { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* panel */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .25); z-index: 49; }
.scrim[hidden] { display: none !important; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(31rem, 100%); z-index: 50; background: var(--card);
  border-left: 1px solid var(--rule); box-shadow: -12px 0 40px rgb(0 0 0 / .12); overflow: auto; overscroll-behavior: contain;
  padding-block: calc(1.1rem + env(safe-area-inset-top, 0px)) calc(2.5rem + env(safe-area-inset-bottom, 0px));
  padding-left: 1.4rem; padding-right: max(1.4rem, env(safe-area-inset-right, 0px)); }
aside[hidden] { display: none !important; }
.close { position: sticky; top: 0; float: right; width: 32px; height: 32px; margin: -.2rem -.4rem 0 0; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--card); cursor: pointer; font-size: 1.1rem; line-height: 1; z-index: 2; }
.pk { display: flex; flex-wrap: wrap; gap: .35rem .6rem; align-items: center; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.badge { border: 1px solid var(--rule); border-radius: 4px; padding: .05rem .35rem; color: var(--ink-2); }
aside h2 { font-family: var(--serif); font-size: 1.55rem; font-weight: 600; line-height: 1.15; margin: 0 2.2rem .7rem 0; text-wrap: balance; }
.prog { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-bottom: 1rem; font-variant-numeric: tabular-nums; }
.prog .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--rule-soft); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--c); }
.core { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; margin: 0 0 .6rem; }
.reach { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: 0 0 1.1rem; }
.sec { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.3rem 0 .5rem; }
.links { display: flex; flex-wrap: wrap; gap: .35rem; }
.links button { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: .25rem .5rem; cursor: pointer; text-align: left; }
.links button:hover { border-color: var(--muted); }
.links .none { font-size: .85rem; color: var(--muted); }
.path { font-size: .8rem; color: var(--muted); margin: .45rem 0 0; }
.res { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.res li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .1rem .65rem; padding: .7rem 0; border-bottom: 1px solid var(--rule-soft); }
.res input { width: 1.05rem; height: 1.05rem; margin: .2rem 0 0; accent-color: var(--accent); cursor: pointer; }
.res .rn a { font-weight: 600; font-size: .93rem; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
.res .rn a:hover { border-bottom-color: var(--accent); }
.res .rb { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
.res .note { font-family: var(--serif); font-size: .9rem; color: var(--ink-2); margin-top: .2rem; line-height: 1.4; }
.res li.ok .rn a { color: var(--muted); }
.lv { align-self: start; font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: .12rem .4rem; white-space: nowrap; }
.lv1 { color: var(--accent); background: var(--accent-soft); }
.lv2 { color: var(--ink-2); background: var(--rule-soft); }
.lv3 { color: var(--paper); background: var(--ink-2); }
.foot { font-size: .8rem; color: var(--muted); margin-top: 1.4rem; line-height: 1.5; }
.about { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.55; }
.about p { margin: 0 0 .7rem; }

@media (max-width: 720px) {
  header { grid-template-columns: minmax(0, 1fr); }
  .tools { justify-content: flex-start; }
  .search { flex: 1 1 10rem; }
  .search input { width: 100%; }
  .lede { display: none; }
  .legend { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .mini { display: none; }
  .hint { display: none; }
  aside { top: auto; left: 0; width: 100%; height: 86%; border-left: 0; border-top: 1px solid var(--rule); border-radius: 16px 16px 0 0;
    padding-left: max(1.1rem, env(safe-area-inset-left, 0px)); padding-right: max(1.1rem, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <p class="crumb"><a href="../../">Jai Sharma</a> · <a href="../../#ai-writing">AI writing</a> · <a href="../science-and-engineering-roadmap/">Science and engineering</a> · <a href="../mathematics-roadmap/">Mathematics</a></p>
      <h1>Machine Learning Research Roadmap</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Find an idea, paper or course" aria-label="Find an idea, paper or course" autocomplete="off" aria-controls="results" aria-expanded="false">
        <div class="results" id="results" role="listbox" hidden></div>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button id="v-tracks" aria-pressed="true">Tracks</button><button id="v-map" aria-pressed="false">Map</button><button id="v-list" aria-pressed="false">List</button><button id="v-about" aria-pressed="false">About</button>
      </div>
      <span class="totals" id="totals"></span>
    </div>
    <nav class="legend" id="legend" aria-label="Jump to a track"></nav>
  </header>
  <section class="tview" id="tracks" aria-label="Track map">
    <div class="tscroll" id="tscroll"><div class="tsize" id="tsize"><div class="tworld" id="tworld"><svg class="edges" id="tedges" aria-hidden="true"></svg></div></div></div>
    <p class="thint" id="thint"></p>
  </section>
  <main id="map" aria-label="Prerequisite map" hidden>
    <div class="world" id="world"><svg class="edges" id="edges" aria-hidden="true"></svg></div>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" class="w" aria-label="Show the whole map">All</button>
      <button id="zlinks" class="w" aria-pressed="false" title="Show the arrows between tracks">Links</button>
    </div>
    <div class="mini" id="mini" aria-label="Overview; click to move there" role="img"></div>
    <div class="hint" id="hint">Drag to move · pinch or ctrl+scroll to zoom · click an idea</div>
  </main>
  <section class="list" id="list" hidden><div class="in" id="listin"></div></section>

<script>
const DATA = {"tracks": [{"id": "found", "label": "Math foundations", "family": 0, "core": "The math every other track borrows: linear algebra, probability, optimization, stochastic processes, and control."}, {"id": "dl", "label": "Deep learning", "family": 1, "core": "Train neural networks by gradient descent, and understand what they learn and why they generalize."}, {"id": "llm", "label": "Transformers and LLMs", "family": 1, "core": "The transformer, next-token prediction, and what scale, in-context learning, and test-time compute add."}, {"id": "sys", "label": "Systems and scale", "family": 1, "core": "Make models fast on real hardware: GPU kernels, parallelism across chips, and serving."}, {"id": "gen", "label": "Diffusion and flows", "family": 2, "core": "Turn noise into data by learning to undo a corruption process: diffusion, flow matching, and flow maps."}, {"id": "disc", "label": "Discrete and language diffusion", "family": 2, "core": "Diffusion for tokens instead of pixels, up to diffusion language models and the RL that tunes them."}, {"id": "ctrl", "label": "Diffusion meets control", "family": 2, "core": "Steer a trained diffusion model toward a reward, by fine-tuning or at sampling time, with optimal control."}, {"id": "rl", "label": "Reinforcement learning", "family": 3, "core": "Learn to act from reward: values, policy gradients, off-policy and offline learning, and world models."}, {"id": "post", "label": "Post-training", "family": 3, "core": "Turn a pretrained model into an assistant or a reasoner with human preferences and verifiable rewards."}, {"id": "interp", "label": "Interpretability", "family": 4, "core": "Reverse-engineer what a trained network computes: features, circuits, and the directions that steer it."}, {"id": "cl", "label": "Continual learning", "family": 5, "core": "Keep learning after training without forgetting old skills or losing the ability to learn new ones."}, {"id": "embod", "label": "Robotics and world models", "family": 6, "core": "Carry generative models and RL into the physical world: robot policies, VLAs, and world models."}, {"id": "vision", "label": "Computer vision", "family": 7, "core": "See with neural networks: vision transformers, detection and segmentation, 3D geometry, and models that read images and text together."}, {"id": "graphics", "label": "Graphics, 3D and video", "family": 7, "core": "Represent and render scenes with networks: neural fields, NeRF, Gaussian splats, text-to-3D, and video generation."}, {"id": "bio", "label": "Biology", "family": 8, "core": "Models of molecules and cells: structure prediction, protein and DNA language models, design, and single-cell foundation models."}, {"id": "science", "label": "ML for science", "family": 8, "core": "Networks inside simulation: physics-informed training, neural operators, ML weather models, interatomic potentials, and simulation-based inference."}, {"id": "safety", "label": "Safety and robustness", "family": 4, "core": "Make models robust and safe: adversarial examples, jailbreaks, evaluations, oversight, and model organisms of misalignment."}], "nodes": [{"id": "linalg", "title": "Linear algebra", "kind": "concept", "track": "found", "pre": [], "frontier": false, "core": "A matrix is a linear map, and the singular value decomposition says every such map is a rotation, a stretch along perpendicular axes, and another rotation. Most linear algebra in ML is finding those axes and how much each one stretches.", "reach": "Gradients, PCA, attention, low-rank adapters, and the directions behind probing and activation steering are all statements about vectors and matrices.", "resources": [{"title": "Essence of linear algebra", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2016", "level": 1, "note": "The geometric picture first: matrices as transformations, determinants as volume, eigenvectors as directions that only stretch."}, {"title": "MIT 18.06: Linear Algebra", "url": "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", "type": "course", "by": "Gilbert Strang, MIT OCW, 2010", "level": 2, "note": "Full lecture videos and problem sets; the standard first course."}, {"title": "MIT 18.065: Matrix Methods in Data Analysis, Signal Processing, and Machine Learning", "url": "https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/", "type": "course", "by": "Gilbert Strang, MIT OCW, 2018", "level": 2, "note": "Strang’s follow-on course, built around the SVD and its uses in data analysis and learning."}, {"title": "Linear Algebra Done Right", "url": "https://linear.axler.net/", "type": "book", "by": "Sheldon Axler, 4th edition, 2024", "level": 3, "note": "Open access. Proof-based and determinant-free; read it once the computations feel routine."}]}, {"id": "calculus", "title": "Multivariable and matrix calculus", "kind": "concept", "track": "found", "pre": ["linalg"], "frontier": false, "core": "The derivative of a function of vectors or matrices is the linear map that best approximates it near a point. The chain rule composes those linear maps, and backpropagation is that chain rule evaluated from the output backward.", "reach": "Needed for backprop, optimization, the change of variables in normalizing flows, and every gradient in diffusion and policy gradient training.", "resources": [{"title": "The Matrix Calculus You Need For Deep Learning", "url": "https://explained.ai/matrix-calculus/", "type": "tutorial", "by": "Terence Parr, Jeremy Howard, 2018", "level": 1, "note": "Jacobians and the vector chain rule, worked through neural network examples."}, {"title": "MIT 18.S096: Matrix Calculus for Machine Learning and Beyond", "url": "https://ocw.mit.edu/courses/18-s096-matrix-calculus-for-machine-learning-and-beyond-january-iap-2023/", "type": "course", "by": "Alan Edelman, Steven G. Johnson, MIT OCW, 2023", "level": 2, "note": "Derivatives as linear operators, including derivatives with respect to matrices; lectures and notes."}, {"title": "Mathematics for Machine Learning", "url": "https://mml-book.github.io/", "type": "book", "by": "Deisenroth, Faisal, Ong, Cambridge, 2020", "level": 2, "note": "Chapter 5, Vector Calculus, connects gradients and Jacobians to backpropagation."}, {"title": "The Matrix Cookbook", "url": "https://www.math.uwaterloo.ca/~hwolkowi/matrixcookbook.pdf", "type": "notes", "by": "Kaare Brandt Petersen, Michael Syskind Pedersen, 2012", "level": 2, "note": "A reference table of matrix identities and derivatives; look things up, don’t read it."}]}, {"id": "prob", "title": "Probability", "kind": "concept", "track": "found", "pre": [], "frontier": false, "core": "Probability assigns each event a number that adds up like area. Conditioning on what you know shrinks the space and renormalizes, Bayes’ rule turns P(data given cause) into P(cause given data), and expectation averages a quantity under those weights.", "reach": "The language of every generative model, from VAEs to diffusion, and of RL, where returns are expectations over random trajectories.", "resources": [{"title": "Harvard Stat 110: Probability", "url": "https://stat110.net/", "type": "lectures", "by": "Joe Blitzstein, Harvard, 2013", "level": 1, "note": "Lectures, the Blitzstein and Hwang book, and practice problems; the best first course."}, {"title": "Probability in Electrical Engineering and Computer Science", "url": "https://link.springer.com/book/10.1007/978-3-030-49995-2", "type": "book", "by": "Jean Walrand, Springer 2021, open access", "level": 2, "note": "The text of Berkeley’s EECS 126, built around applications such as PageRank, queues and digital links."}, {"title": "High-Dimensional Probability", "url": "https://www.math.uci.edu/~rvershyn/papers/HDP-book/HDP-book.html", "type": "book", "by": "Roman Vershynin, 2nd edition, 2026", "level": 3, "note": "Chapters 2 and 3: concentration of sums and random vectors in high dimensions, where intuition from 2D fails."}]}, {"id": "stats", "title": "Statistical inference", "kind": "concept", "track": "found", "pre": ["prob"], "frontier": false, "core": "Inference runs probability backward, from data to the parameters that could have produced it. Maximum likelihood picks the parameters that make the data most probable, Bayesian inference keeps a whole distribution over them, and a prior or regularizer keeps either from overfitting.", "reach": "Underlies likelihood training of language and diffusion models, Monte Carlo estimation, and the question of why deep networks generalize.", "resources": [{"title": "Statistical Rethinking", "url": "https://github.com/rmcelreath/stat_rethinking_2024", "type": "lectures", "by": "Richard McElreath, 2024", "level": 1, "note": "Bayesian inference taught through simulation and code, with lectures on YouTube."}, {"title": "MIT 18.650: Statistics for Applications", "url": "https://ocw.mit.edu/courses/18-650-statistics-for-applications-fall-2016/", "type": "course", "by": "Philippe Rigollet, MIT OCW, 2016", "level": 2, "note": "The frequentist side: estimators, confidence intervals, tests, and regression, with lecture videos."}, {"title": "Probabilistic Machine Learning: An Introduction", "url": "https://probml.github.io/pml-book/", "type": "book", "by": "Kevin Murphy, MIT Press, 2022", "level": 2, "note": "Book 1, Chapter 4: maximum likelihood, empirical risk, regularization, and Bayesian and frequentist statistics."}]}, {"id": "optim", "title": "Optimization", "kind": "concept", "track": "found", "pre": ["calculus"], "frontier": false, "core": "To minimize a function, step against its gradient. For convex functions every local minimum is global, so gradient descent provably finds the answer, and duality gives a lower bound that certifies how close you are. Deep learning keeps the steps but loses the guarantees.", "reach": "Backprop training, Adam, PPO’s trust regions, and the entropic solvers of optimal transport all start here.", "resources": [{"title": "Why Momentum Really Works", "url": "https://distill.pub/2017/momentum/", "type": "blog", "by": "Gabriel Goh, Distill, 2017", "level": 1, "note": "Gradient descent and momentum on a quadratic, with interactive plots of why they converge or oscillate."}, {"title": "Stanford EE364A: Convex Optimization I", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rMJqxxviPa4AmDClvcbHi6h", "type": "lectures", "by": "Stephen Boyd, Stanford Online, 2023", "level": 2, "note": "Recorded lectures that follow the book below."}, {"title": "Convex Optimization", "url": "https://web.stanford.edu/~boyd/cvxbook/", "type": "book", "by": "Stephen Boyd, Lieven Vandenberghe, 2004", "level": 2, "note": "Chapters 2 to 5 for convexity and duality, Chapter 9 for gradient and Newton methods."}, {"title": "Convex Optimization: Algorithms and Complexity", "url": "https://arxiv.org/abs/1405.4980", "type": "book", "by": "Sébastien Bubeck, 2015", "level": 3, "note": "Convergence rates with short proofs for gradient, mirror, accelerated, and stochastic methods."}]}, {"id": "info", "title": "Information theory", "kind": "concept", "track": "found", "pre": ["prob"], "frontier": false, "core": "An outcome of probability p carries log(1/p) bits of surprise. Entropy is the average surprise, KL divergence is the extra bits paid for coding with the wrong distribution, and mutual information is how much one variable shortens the code for another.", "reach": "Cross-entropy losses, the ELBO in VAEs and diffusion, InfoNCE in contrastive learning, and KL penalties in PPO and RLHF all come from here.", "resources": [{"title": "Visual Information Theory", "url": "https://colah.github.io/posts/2015-09-Visual-Information/", "type": "blog", "by": "Christopher Olah, 2015", "level": 1, "note": "Entropy, cross-entropy, KL divergence, and mutual information drawn as code lengths."}, {"title": "Information Theory, Pattern Recognition, and Neural Networks", "url": "https://www.youtube.com/playlist?list=PLruBu5BI5n4aFpG32iMbdWoRVAA-Vcso6", "type": "lectures", "by": "David MacKay, Cambridge, 2012", "level": 1, "note": "MacKay’s own lectures on the book below."}, {"title": "Information Theory, Inference, and Learning Algorithms", "url": "https://www.inference.org.uk/itprnn/book.pdf", "type": "book", "by": "David MacKay, 2003", "level": 2, "note": "Chapters 2 and 4 to 6: entropy, the source coding theorem, and symbol and stream codes."}, {"title": "Information Theory: From Coding to Learning", "url": "https://people.lids.mit.edu/yp/homepage/data/itbook-export.pdf", "type": "book", "by": "Yury Polyanskiy, Yihong Wu, Cambridge, 2025", "level": 3, "note": "Chapters 1 to 3 define entropy, divergence, and mutual information rigorously; Chapter 4 gives their variational forms."}]}, {"id": "stochastic", "title": "Markov chains and stochastic processes", "kind": "concept", "track": "found", "pre": ["prob", "linalg"], "frontier": false, "core": "A Markov chain forgets its past: the next state depends only on the current one, through a transition matrix. Run it long enough and most chains settle into a stationary distribution, the fixed point MCMC samples from and diffusion’s forward process heads toward.", "reach": "Leads to MCMC, MDPs in reinforcement learning, Brownian motion and SDEs, and the discrete diffusion of D3PM.", "resources": [{"title": "Markov Chains explained visually", "url": "https://setosa.io/ev/markov-chains/", "type": "tutorial", "by": "Victor Powell, Lewis Lehe, Setosa, 2014", "level": 1, "note": "Interactive transition diagrams and matrices; ten minutes."}, {"title": "MIT 6.262: Discrete Stochastic Processes", "url": "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/", "type": "course", "by": "Robert Gallager, MIT OCW, 2011", "level": 2, "note": "Graduate lectures on Poisson processes, Markov chains, renewal processes, and random walks."}, {"title": "Markov Chains and Mixing Times", "url": "https://pages.uoregon.edu/dlevin/MARKOV/mcmt2e.pdf", "type": "book", "by": "David Levin, Yuval Peres, with Elizabeth Wilmer, 2nd edition, 2017", "level": 3, "note": "How fast a chain reaches its stationary distribution, which decides whether MCMC is practical."}, {"title": "Stochastic Processes (Stanford lecture notes)", "url": "https://adembo.su.domains/math-136/nnotes.pdf", "type": "notes", "by": "Amir Dembo, revised by Kevin Ross, 2021", "level": 3, "note": "Chapters 5 and 6: Brownian motion and Markov processes, the bridge to SDEs."}]}, {"id": "odes", "title": "ODEs and numerical integration", "kind": "concept", "track": "found", "pre": ["calculus"], "frontier": false, "core": "An ODE gives a velocity at every point, dx/dt = f(x, t), and its solution is the path that follows those velocities. Numerical solvers take small steps: Euler uses one slope per step, and Runge-Kutta methods average several slopes to cut the error.", "reach": "Flow matching, neural ODEs, DDIM and other fast samplers, and state-space models are all ODEs integrated numerically.", "resources": [{"title": "Differential equations", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDNPOjrT6KVlfJuKtYTftqH6", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2019", "level": 1, "note": "Phase spaces and vector fields before formulas."}, {"title": "MIT 18.03: Differential Equations", "url": "https://ocw.mit.edu/courses/18-03-differential-equations-spring-2010/", "type": "course", "by": "Arthur Mattuck, Haynes Miller, MIT OCW, 2010", "level": 2, "note": "Lecture videos on linear ODEs, systems, and numerical methods."}, {"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "note": "Chapter 2 is a compact ODE refresher, with numerical solvers in Section 2.6; the rest of the book is the next node."}, {"title": "On Neural Differential Equations", "url": "https://arxiv.org/abs/2202.02435", "type": "book", "by": "Patrick Kidger, 2022", "level": 3, "note": "Section 5.3 covers numerical solvers and Section 5.1 backpropagation through them."}]}, {"id": "sdes", "title": "Stochastic differential equations", "kind": "concept", "track": "found", "pre": ["stochastic", "odes"], "frontier": false, "core": "An SDE is an ODE plus noise: dx = f(x, t) dt + g(t) dW, where Brownian increments dW have variance dt. Because dW is of size square root of dt, Itô’s formula replaces the chain rule and gains a second-derivative term.", "reach": "The forward and reverse processes of score-based diffusion, Langevin sampling, and stochastic optimal control are SDEs.", "resources": [{"title": "An Introduction to Flow Matching and Diffusion Models", "url": "https://arxiv.org/abs/2506.02070", "type": "notes", "by": "Peter Holderrieth, Ezra Erives, MIT 6.S184, 2025", "level": 1, "note": "Section 2 builds ODEs, then SDEs, as generative models, aimed at the reader headed into diffusion."}, {"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "note": "Chapters 3 and 4 build SDEs and the Itô formula; Chapter 8 simulates them."}, {"title": "Stochastic Calculus, Filtering, and Stochastic Control", "url": "https://web.math.princeton.edu/~rvan/acm217/ACM217.pdf", "type": "notes", "by": "Ramon van Handel, Caltech ACM 217, 2007", "level": 3, "note": "Chapters 3 to 5: the Wiener process, the Itô integral, and SDEs, with proofs."}]}, {"id": "fokker", "title": "Fokker-Planck and the continuity equation", "kind": "concept", "track": "found", "pre": ["sdes"], "frontier": false, "core": "Move many particles along a velocity field and their density obeys the continuity equation: density drops where the flow spreads out. Add Brownian noise and you get the Fokker-Planck equation, a deterministic PDE for how an SDE’s whole distribution evolves.", "reach": "It is why a diffusion SDE has a probability flow ODE with the same marginals, and why flow matching can regress velocities.", "resources": [{"title": "An Introduction to Flow Matching and Diffusion Models", "url": "https://arxiv.org/abs/2506.02070", "type": "notes", "by": "Peter Holderrieth, Ezra Erives, MIT 6.S184, 2025", "level": 1, "note": "Section 3.2 derives the continuity equation and Section 4.2 the Fokker-Planck equation, with proofs in Appendix B."}, {"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "note": "Section 5.2 derives the Fokker-Planck-Kolmogorov equation from the Itô formula."}, {"title": "{Euclidean, metric, and Wasserstein} gradient flows: an overview", "url": "https://arxiv.org/abs/1609.03890", "type": "paper", "by": "Filippo Santambrogio, 2017", "level": 3, "note": "Reads the Fokker-Planck equation as gradient descent on free energy in Wasserstein space, the JKO scheme."}]}, {"id": "ot", "title": "Optimal transport", "kind": "concept", "track": "found", "pre": ["optim", "prob"], "frontier": false, "core": "Optimal transport asks for the cheapest way to move one distribution of mass onto another, given a cost per unit moved. The minimal cost defines the Wasserstein distance, and adding an entropy penalty makes the problem solvable at scale by Sinkhorn’s matrix scaling.", "reach": "Rectified flow straightens paths with it, minibatch couplings speed up flow matching, and Schrödinger bridges are its entropic, dynamic form.", "resources": [{"title": "Optimal Transport for Machine Learners", "url": "https://arxiv.org/abs/2505.06589", "type": "notes", "by": "Gabriel Peyré, 2025", "level": 1, "note": "Chapters 1 to 3 go from matching point clouds to the Kantorovich relaxation; Chapter 8 is Sinkhorn; Chapter 14 is dynamic OT."}, {"title": "Computational Optimal Transport", "url": "https://arxiv.org/abs/1803.00567", "type": "book", "by": "Gabriel Peyré, Marco Cuturi, 2019", "level": 2, "note": "Chapters 2 to 4: theory, algorithms, and entropic regularization; Chapter 7: dynamic formulations."}, {"title": "Sinkhorn Distances: Lightspeed Computation of Optimal Transportation Distances", "url": "https://arxiv.org/abs/1306.0895", "type": "paper", "by": "Marco Cuturi, 2013", "level": 2, "note": "The paper that made entropic OT the default in machine learning."}, {"title": "POT: Python Optimal Transport", "url": "https://pythonot.github.io/", "type": "code", "by": "Rémi Flamary, Nicolas Courty, and contributors, 2016 onward", "level": 2, "note": "Exact and entropic solvers with example notebooks; run them on 2D point clouds."}]}, {"id": "montecarlo", "title": "Monte Carlo, importance sampling and MCMC", "kind": "concept", "track": "found", "pre": ["stochastic", "stats"], "frontier": false, "core": "Average a function over samples to estimate its expectation; the error shrinks like one over the square root of the sample count in any dimension. Importance sampling reweights samples from an easier distribution, and MCMC runs a Markov chain that converges to the target.", "reach": "Energy-based models, policy gradient estimators, off-policy correction, and sequential Monte Carlo steering of diffusion models all rest on these estimators.", "resources": [{"title": "The Markov-chain Monte Carlo Interactive Gallery", "url": "https://chi-feng.github.io/mcmc-demo/", "type": "code", "by": "Chi Feng, 2016", "level": 1, "note": "Watch random-walk Metropolis, HMC, and others explore the same targets side by side."}, {"title": "Information Theory, Inference, and Learning Algorithms", "url": "https://www.inference.org.uk/itprnn/book.pdf", "type": "book", "by": "David MacKay, 2003", "level": 2, "note": "Chapters 29 and 30: importance sampling, rejection sampling, Metropolis, Gibbs, and Hamiltonian Monte Carlo."}, {"title": "Monte Carlo theory, methods and examples", "url": "https://artowen.su.domains/mc/", "type": "book", "by": "Art Owen, 2013", "level": 2, "note": "Chapter 2 for simple Monte Carlo, Chapter 9 for importance sampling, Chapter 11 for MCMC."}, {"title": "A Conceptual Introduction to Hamiltonian Monte Carlo", "url": "https://arxiv.org/abs/1701.02434", "type": "paper", "by": "Michael Betancourt, 2017", "level": 3, "note": "Why random-walk proposals fail in high dimensions and how Hamiltonian dynamics fixes it."}, {"title": "A Tutorial on Particle Filtering and Smoothing: Fifteen years later", "url": "https://www.stats.ox.ac.uk/~doucet/doucet_johansen_tutorialPF2011.pdf", "type": "paper", "by": "Arnaud Doucet, Adam Johansen, 2011", "level": 3, "note": "Sequential Monte Carlo, the basis of twisted SMC steering for diffusion models."}]}, {"id": "control", "title": "Optimal control and dynamic programming", "kind": "concept", "track": "found", "pre": ["optim", "odes"], "frontier": false, "core": "Choose inputs that steer a system to minimize total cost. Dynamic programming works backward from the end: the best cost-to-go satisfies Bellman’s equation, or in continuous time the Hamilton-Jacobi-Bellman equation, and for linear dynamics with quadratic cost the answer is LQR.", "reach": "Bellman’s equation becomes the MDP of RL, and Pontryagin’s costate is the adjoint behind adjoint matching.", "resources": [{"title": "Control Bootcamp", "url": "https://www.youtube.com/playlist?list=PLMrJAkhIeNNR20Mz-VpzgfQs5zrYi085m", "type": "lectures", "by": "Steve Brunton, University of Washington, 2017", "level": 1, "note": "Short lectures from state space to LQR and the Kalman filter, with code."}, {"title": "Underactuated Robotics", "url": "https://underactuated.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT, 2024", "level": 2, "note": "Chapter 7 is dynamic programming, Chapter 8 LQR, Chapter 10 trajectory optimization; online text with notebooks."}, {"title": "A Course in Reinforcement Learning", "url": "https://web.mit.edu/dimitrib/www/RLbook.html", "type": "book", "by": "Dimitri Bertsekas, 2nd edition, 2025", "level": 2, "note": "Free PDF. Chapter 1 covers exact and approximate dynamic programming, including linear quadratic problems."}, {"title": "Calculus of Variations and Optimal Control Theory: A Concise Introduction", "url": "https://liberzon.csl.illinois.edu/teaching/cvoc.pdf", "type": "book", "by": "Daniel Liberzon, 2012", "level": 3, "note": "Chapter 4 is the maximum principle, Chapter 5 the HJB equation, Chapter 6 LQR."}]}, {"id": "soc", "title": "Stochastic optimal control", "kind": "concept", "track": "found", "pre": ["control", "sdes", "info"], "frontier": false, "core": "Steer a noisy system, an SDE, to minimize expected cost. When the control is charged by its KL divergence from the uncontrolled process, a log transform makes the HJB equation linear, and the optimal path distribution is the uncontrolled one reweighted by exp(-cost).", "reach": "Adjoint matching, reward fine-tuning of diffusion models, Schrödinger bridges, and maximum-entropy RL are this problem in different clothes.", "resources": [{"title": "Reinforcement Learning and Control as Probabilistic Inference: Tutorial and Review", "url": "https://arxiv.org/abs/1805.00909", "type": "paper", "by": "Sergey Levine, 2018", "level": 1, "note": "The discrete-time version: the optimal policy is the prior reweighted by exponentiated reward."}, {"title": "Path integrals and symmetry breaking for optimal control theory", "url": "https://arxiv.org/abs/physics/0505066", "type": "paper", "by": "Hilbert Kappen, 2005", "level": 2, "note": "The log transform that linearizes the HJB equation, and the path integral that solves it."}, {"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "note": "Sections 7.3 to 7.7: Girsanov, Doob’s h-transform, path integrals, and Feynman-Kac, the tools behind the reweighting."}, {"title": "Stochastic Calculus, Filtering, and Stochastic Control", "url": "https://web.math.princeton.edu/~rvan/acm217/ACM217.pdf", "type": "notes", "by": "Ramon van Handel, Caltech ACM 217, 2007", "level": 3, "note": "Chapter 6: dynamic programming for SDEs, verification theorems, and the stochastic linear regulator."}, {"title": "An optimal control perspective on diffusion-based generative modeling", "url": "https://arxiv.org/abs/2211.01364", "type": "paper", "by": "Julius Berner, Lorenz Richter, Karen Ullrich, 2022", "level": 3, "note": "Casts the reverse diffusion as the solution of a stochastic control problem."}]}, {"id": "backprop", "title": "Neural networks and backpropagation", "kind": "concept", "track": "dl", "pre": ["calculus", "optim"], "frontier": false, "core": "A neural network is a composition of differentiable layers. Backpropagation gets the loss gradient for every weight in one backward pass, applying the chain rule from the output inward and reusing each intermediate result, for a few times the cost of a forward pass.", "reach": "Every trained model in the graph uses it; reverse-mode differentiation through an ODE solver becomes the adjoint method.", "resources": [{"title": "Neural networks", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDNU6R1_67000Dx_ZCJB-3pi", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2017", "level": 1, "note": "Chapters 1 to 4 build a network, gradient descent, and backpropagation visually."}, {"title": "The spelled-out intro to neural networks and backpropagation: building micrograd", "url": "https://www.youtube.com/watch?v=VMj-3S1tku0", "type": "video", "by": "Andrej Karpathy, 2022", "level": 1, "note": "Builds a tiny autograd engine by hand, then trains a network with it."}, {"title": "Understanding Deep Learning", "url": "https://udlbook.github.io/udlbook/", "type": "book", "by": "Simon Prince, MIT Press, 2023", "level": 2, "note": "Chapters 3, 4, and 7: shallow and deep networks, then gradients and initialization."}, {"title": "The Elements of Differentiable Programming", "url": "https://arxiv.org/abs/2403.14606", "type": "book", "by": "Mathieu Blondel, Vincent Roulet, 2024", "level": 3, "note": "Automatic differentiation in general, including the adjoint method for ODEs."}]}, {"id": "training", "title": "Training deep networks", "kind": "concept", "track": "dl", "pre": ["backprop"], "frontier": false, "core": "Training is stochastic gradient descent made reliable: initialize so signals neither explode nor vanish, normalize activations, use an adaptive optimizer like Adam with warmup and a decaying learning rate, and regularize so the network fits signal rather than noise.", "reach": "The practical layer under scaling laws, pretraining, quantization, and every experiment in continual learning and RL.", "resources": [{"title": "A Recipe for Training Neural Networks", "url": "http://karpathy.github.io/2019/04/25/recipe/", "type": "blog", "by": "Andrej Karpathy, 2019", "level": 1, "note": "A debugging order for training runs: overfit one batch first, then scale up."}, {"title": "Building makemore Part 3: Activations & Gradients, BatchNorm", "url": "https://www.youtube.com/watch?v=P6sfmUTpUmc", "type": "video", "by": "Andrej Karpathy, 2022", "level": 1, "note": "Watches activations and gradients at initialization, then adds batch normalization."}, {"title": "Understanding Deep Learning", "url": "https://udlbook.github.io/udlbook/", "type": "book", "by": "Simon Prince, MIT Press, 2023", "level": 2, "note": "Chapters 6 to 9: fitting, gradients and initialization, measuring performance, and regularization."}, {"title": "Adam: A Method for Stochastic Optimization", "url": "https://arxiv.org/abs/1412.6980", "type": "paper", "by": "Diederik Kingma, Jimmy Ba, 2014", "level": 2, "note": "The default optimizer; Algorithm 1 is the whole method."}, {"title": "Deep Learning Tuning Playbook", "url": "https://github.com/google-research/tuning_playbook", "type": "notes", "by": "Godbole, Dahl, Gilmer, Shallue, Nado, Google, 2023", "level": 2, "note": "A systematic procedure for choosing hyperparameters."}]}, {"id": "resnets", "title": "Convolutional networks and ResNets", "kind": "concept", "track": "dl", "pre": ["backprop"], "frontier": false, "core": "A convolution slides a small filter across an image, detecting a pattern wherever it appears with few parameters. A residual block outputs its input plus a learned correction, x + f(x), which keeps gradients flowing and lets networks with hundreds of layers train.", "reach": "The residual stream of transformers, the U-Nets of diffusion models, and contrastive image encoders all come from this design.", "resources": [{"title": "CS231n: Convolutional Neural Networks", "url": "https://cs231n.github.io/convolutional-networks/", "type": "notes", "by": "Stanford CS231n, Andrej Karpathy and others, 2015", "level": 1, "note": "Convolution, pooling, and how layer shapes work out."}, {"title": "ImageNet Classification with Deep Convolutional Neural Networks", "url": "https://papers.nips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html", "type": "paper", "by": "Krizhevsky, Sutskever, Hinton, NeurIPS 2012", "level": 2, "note": "AlexNet, the result that started the deep learning era."}, {"title": "Deep Residual Learning for Image Recognition", "url": "https://arxiv.org/abs/1512.03385", "type": "paper", "by": "He, Zhang, Ren, Sun, 2015", "level": 2}, {"title": "Identity Mappings in Deep Residual Networks", "url": "https://arxiv.org/abs/1603.05027", "type": "paper", "by": "He, Zhang, Ren, Sun, 2016", "level": 3, "note": "Why a clean identity path matters, and the pre-activation block that gives one."}, {"title": "A ConvNet for the 2020s", "url": "https://arxiv.org/abs/2201.03545", "type": "paper", "by": "Liu et al., 2022", "level": 3, "note": "Modernizes a ResNet step by step until it matches vision transformers."}]}, {"id": "dltheory", "title": "Why deep networks generalize", "kind": "concept", "track": "dl", "pre": ["training", "stats"], "frontier": true, "core": "Deep networks can fit random labels, yet they generalize on real data, so counting parameters cannot explain them. What matters is which of the many zero-loss solutions training finds: gradient descent prefers simple ones, and test error falls again past the interpolation threshold.", "reach": "Bears on scaling laws, grokking, why large models fine-tune well, and what forgetting and plasticity loss in continual learning mean.", "resources": [{"title": "Understanding Deep Learning", "url": "https://udlbook.github.io/udlbook/", "type": "book", "by": "Simon Prince, MIT Press, 2023", "level": 1, "note": "Chapter 20, Why does deep learning work?, surveys the open questions."}, {"title": "Understanding deep learning requires rethinking generalization", "url": "https://arxiv.org/abs/1611.03530", "type": "paper", "by": "Zhang, Bengio, Hardt, Recht, Vinyals, 2016", "level": 2, "note": "Networks memorize random labels, so capacity alone cannot explain generalization."}, {"title": "Deep Double Descent: Where Bigger Models and More Data Hurt", "url": "https://arxiv.org/abs/1912.02292", "type": "paper", "by": "Nakkiran et al., 2019", "level": 2, "note": "Test error rises and falls again as models grow past the point of fitting the data."}, {"title": "Deep Learning is Not So Mysterious or Different", "url": "https://arxiv.org/abs/2503.02113", "type": "paper", "by": "Andrew Gordon Wilson, 2025", "level": 2, "note": "Argues that soft inductive biases and existing bounds already explain benign overfitting and double descent."}, {"title": "Deep learning: a statistical viewpoint", "url": "https://arxiv.org/abs/2103.09177", "type": "paper", "by": "Bartlett, Montanari, Rakhlin, 2021", "level": 3, "note": "Benign overfitting and implicit regularization, with proofs."}, {"title": "Neural Tangent Kernel: Convergence and Generalization in Neural Networks", "url": "https://arxiv.org/abs/1806.07572", "type": "paper", "by": "Jacot, Gabriel, Hongler, 2018", "level": 3, "note": "In the infinite-width limit, training is kernel regression with a fixed kernel."}]}, {"id": "contrastive", "title": "Contrastive and self-supervised learning", "kind": "concept", "track": "dl", "pre": ["resnets", "info"], "frontier": false, "core": "Learn representations without labels by pulling together embeddings of two views of the same example and pushing apart views of different examples. The InfoNCE loss is a classification over the batch, picking the true partner, and it lower-bounds the mutual information between views.", "reach": "Leads to CLIP, the encoders behind latent diffusion and robot policies, and the predictive alternative of JEPA.", "resources": [{"title": "Contrastive Representation Learning", "url": "https://lilianweng.github.io/posts/2021-05-31-contrastive/", "type": "blog", "by": "Lilian Weng, 2021", "level": 1, "note": "The losses, augmentations, and methods in one place."}, {"title": "A Simple Framework for Contrastive Learning of Visual Representations", "url": "https://arxiv.org/abs/2002.05709", "type": "paper", "by": "Chen, Kornblith, Norouzi, Hinton, 2020", "level": 2, "note": "SimCLR: augmentations, a projection head, and large batches."}, {"title": "Representation Learning with Contrastive Predictive Coding", "url": "https://arxiv.org/abs/1807.03748", "type": "paper", "by": "van den Oord, Li, Vinyals, 2018", "level": 2, "note": "Introduces InfoNCE and its mutual information bound."}, {"title": "Learning Transferable Visual Models From Natural Language Supervision", "url": "https://arxiv.org/abs/2103.00020", "type": "paper", "by": "Radford et al., 2021", "level": 2, "note": "CLIP: the same loss across images and captions."}, {"title": "Understanding Contrastive Representation Learning through Alignment and Uniformity on the Hypersphere", "url": "https://arxiv.org/abs/2005.10242", "type": "paper", "by": "Tongzhou Wang, Phillip Isola, 2020", "level": 3, "note": "Splits the loss into pulling positives together and spreading all embeddings evenly over the sphere."}]}, {"id": "jepa", "title": "Joint-embedding predictive architectures", "kind": "concept", "track": "dl", "pre": ["contrastive"], "frontier": true, "core": "Predict the embedding of a hidden part of the input from the embedding of the visible part, instead of reconstructing pixels. Predicting in representation space lets the model ignore unpredictable detail; a slowly updated target encoder or a regularizer keeps embeddings from collapsing.", "reach": "The representation learner behind V-JEPA 2’s robot planning, and one of the main proposals for world models.", "resources": [{"title": "Self-Supervised Learning from Images with a Joint-Embedding Predictive Architecture", "url": "https://arxiv.org/abs/2301.08243", "type": "paper", "by": "Assran et al., 2023", "level": 2, "note": "I-JEPA: predict the embeddings of large masked blocks from a context block, with no hand-made augmentations."}, {"title": "A Path Towards Autonomous Machine Intelligence", "url": "https://openreview.net/forum?id=BZ5a1r-kVsf", "type": "paper", "by": "Yann LeCun, 2022", "level": 2, "note": "The position paper that argues for predicting in representation space and for JEPAs as world models."}, {"title": "Revisiting Feature Prediction for Learning Visual Representations from Video", "url": "https://arxiv.org/abs/2404.08471", "type": "paper", "by": "Bardes et al., 2024", "level": 2, "note": "V-JEPA: the same objective on video."}, {"title": "V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning", "url": "https://arxiv.org/abs/2506.09985", "type": "paper", "by": "Assran et al., 2025", "level": 3, "note": "Adds a small amount of robot data and plans with the learned predictor."}, {"title": "LeJEPA: Provable and Scalable Self-Supervised Learning Without the Heuristics", "url": "https://arxiv.org/abs/2511.08544", "type": "paper", "by": "Randall Balestriero, Yann LeCun, 2025", "level": 3, "note": "Replaces the stop-gradient and teacher heuristics with a regularizer that pushes embeddings toward an isotropic Gaussian."}]}, {"id": "gnns", "title": "Graph neural networks", "kind": "concept", "track": "dl", "pre": ["backprop"], "frontier": false, "core": "A graph neural network updates each node by combining its own vector with an order-independent aggregate, such as a sum, of messages from its neighbors. After k rounds a node summarizes its k-hop neighborhood, and relabeling the nodes just relabels the output.", "reach": "Leads to equivariant networks for molecules and proteins; attention is a GNN on a fully connected graph.", "resources": [{"title": "A Gentle Introduction to Graph Neural Networks", "url": "https://distill.pub/2021/gnn-intro/", "type": "blog", "by": "Sanchez-Lengeling, Reif, Pearce, Wiltschko, Distill, 2021", "level": 1, "note": "Interactive diagrams of message passing on real graphs."}, {"title": "Stanford CS224W: Machine Learning with Graphs", "url": "https://web.stanford.edu/class/cs224w/", "type": "course", "by": "Jure Leskovec, Stanford, current offering", "level": 2, "note": "Slides and Colab notebooks from the standard course on learning with graphs."}, {"title": "Graph Representation Learning", "url": "https://www.cs.mcgill.ca/~wlh/grl_book/", "type": "book", "by": "William Hamilton, 2020", "level": 2, "note": "Chapters 5 to 7: the GNN model, GNNs in practice, and their theoretical motivations."}, {"title": "Neural Message Passing for Quantum Chemistry", "url": "https://arxiv.org/abs/1704.01212", "type": "paper", "by": "Gilmer et al., 2017", "level": 2, "note": "Unifies earlier GNNs as message passing."}, {"title": "How Powerful are Graph Neural Networks?", "url": "https://arxiv.org/abs/1810.00826", "type": "paper", "by": "Xu, Hu, Leskovec, Jegelka, 2018", "level": 3, "note": "Message passing is at most as strong as the Weisfeiler-Lehman test, and sum aggregation reaches that bound."}]}, {"id": "geometric", "title": "Geometric deep learning and equivariance", "kind": "concept", "track": "dl", "pre": ["gnns", "resnets", "linalg"], "frontier": false, "core": "If the answer should not change when the input is rotated, shifted, or permuted, build that symmetry into the network: make every layer equivariant, so transforming the input transforms the features the same way. Convolutions, GNNs, and transformers follow from a choice of symmetry.", "reach": "Underlies the equivariant networks used in generative models of molecules and proteins.", "resources": [{"title": "Geometric Deep Learning course (AMMI)", "url": "https://geometricdeeplearning.com/lectures/", "type": "lectures", "by": "Bronstein, Bruna, Cohen, Veličković, 2022", "level": 1, "note": "Lectures 1 to 4 build the symmetry argument before the architectures; recordings and slides."}, {"title": "Geometric Deep Learning: Grids, Groups, Graphs, Geodesics, and Gauges", "url": "https://arxiv.org/abs/2104.13478", "type": "book", "by": "Bronstein, Bruna, Cohen, Veličković, 2021", "level": 2, "note": "The proto-book the course follows."}, {"title": "Group Equivariant Convolutional Networks", "url": "https://arxiv.org/abs/1602.07576", "type": "paper", "by": "Taco Cohen, Max Welling, 2016", "level": 2, "note": "Extends convolution from translations to rotations and reflections."}, {"title": "E(n) Equivariant Graph Neural Networks", "url": "https://arxiv.org/abs/2102.09844", "type": "paper", "by": "Satorras, Hoogeboom, Welling, 2021", "level": 2, "note": "A simple equivariant message passing layer, widely used for molecules."}, {"title": "Theoretical Aspects of Group Equivariant Neural Networks", "url": "https://arxiv.org/abs/2004.05154", "type": "notes", "by": "Carlos Esteves, 2020", "level": 3, "note": "Group representations and Fourier analysis behind equivariant layers."}]}, {"id": "attention", "title": "Attention and the transformer", "kind": "concept", "track": "llm", "pre": ["backprop"], "frontier": false, "core": "Each token updates its representation with a weighted average of the value vectors of the tokens it can see, with weights from a softmax over query-key dot products. Stacking attention with per-token MLPs and residual connections gives the transformer.", "reach": "The block this whole track builds on, from language models and mixture of experts to FlashAttention, transformer circuits, and diffusion transformers.", "resources": [{"title": "Attention in transformers, step-by-step", "url": "https://www.youtube.com/watch?v=eMlx5fFNoYc", "type": "video", "by": "3Blue1Brown, 2024", "level": 1}, {"title": "Let’s build GPT: from scratch, in code, spelled out", "url": "https://www.youtube.com/watch?v=kCc8FmEb1nY", "type": "video", "by": "Andrej Karpathy, 2023", "level": 1, "note": "Builds a small transformer in PyTorch one piece at a time."}, {"title": "Attention Is All You Need", "url": "https://arxiv.org/abs/1706.03762", "type": "paper", "by": "Vaswani et al., 2017", "level": 2, "note": "Section 3 holds the whole architecture."}, {"title": "Formal Algorithms for Transformers", "url": "https://arxiv.org/abs/2207.09238", "type": "paper", "by": "Phuong, Hutter, 2022", "level": 3, "note": "Exact pseudocode for every part, for when the diagrams are too loose."}]}, {"id": "lm", "title": "Language modeling and tokenization", "kind": "concept", "track": "llm", "pre": ["attention", "info"], "frontier": false, "core": "A language model assigns a probability to text by predicting each next token from the ones before it, trained to minimize cross-entropy, the average bits per token. A tokenizer, usually byte-pair encoding, first decides what a token is by repeatedly merging frequent pairs.", "reach": "Next-token cross-entropy is the loss that scaling laws measure and that pretraining, instruction tuning, and masked diffusion language models all build on.", "resources": [{"title": "The spelled-out intro to language modeling: building makemore", "url": "https://www.youtube.com/watch?v=PaCmpygFfXo", "type": "video", "by": "Andrej Karpathy, 2022", "level": 1, "note": "A bigram character model, its likelihood, and the cross-entropy loss."}, {"title": "Let’s build the GPT Tokenizer", "url": "https://www.youtube.com/watch?v=zduSFxRajkE", "type": "video", "by": "Andrej Karpathy, 2024", "level": 1}, {"title": "Speech and Language Processing", "url": "https://web.stanford.edu/~jurafsky/slp3/", "type": "book", "by": "Jurafsky, Martin, 3rd edition draft", "level": 2, "note": "Chapter 3, N-gram Language Models; Sections 3.3 and 3.7 tie perplexity to cross-entropy."}, {"title": "Neural Machine Translation of Rare Words with Subword Units", "url": "https://arxiv.org/abs/1508.07909", "type": "paper", "by": "Sennrich, Haddow, Birch, 2016", "level": 2, "note": "Section 3.2 gives the BPE merge algorithm in a few lines of Python."}]}, {"id": "scaling", "title": "Scaling laws", "kind": "concept", "track": "llm", "pre": ["lm", "training"], "frontier": false, "core": "Test loss falls as a smooth power law in parameters, data, and compute, so small runs predict large ones. For a fixed compute budget, parameters and training tokens should grow together, roughly 20 tokens per parameter.", "reach": "Sets the budgets for pretraining and mixture of experts, and the same curve fitting now describes test-time compute in chain of thought.", "resources": [{"title": "Scaling Laws for LLMs: From GPT-3 to o3", "url": "https://cameronrwolfe.substack.com/p/llm-scaling-laws", "type": "blog", "by": "Cameron Wolfe, 2025", "level": 1}, {"title": "Training Compute-Optimal Large Language Models", "url": "https://arxiv.org/abs/2203.15556", "type": "paper", "by": "Hoffmann et al., DeepMind, 2022", "level": 2, "note": "Section 3 estimates the compute-optimal model size three different ways."}, {"title": "Scaling Laws for Neural Language Models", "url": "https://arxiv.org/abs/2001.08361", "type": "paper", "by": "Kaplan et al., OpenAI, 2020", "level": 2}, {"title": "Stanford CS336: Language Modeling from Scratch", "url": "https://cs336.stanford.edu/", "type": "course", "by": "Hashimoto, Liang, Stanford, 2026", "level": 2, "note": "Lectures 9 and 11 cover scaling laws; Assignment 3 has you fit one."}, {"title": "Chinchilla Scaling: A replication attempt", "url": "https://arxiv.org/abs/2404.10102", "type": "paper", "by": "Besiroglu et al., Epoch AI, 2024", "level": 3}]}, {"id": "pretrain", "title": "Pretraining an LLM end to end", "kind": "concept", "track": "llm", "pre": ["scaling", "parallel"], "frontier": false, "core": "Pretraining is one long next-token run over trillions of filtered, deduplicated tokens on thousands of accelerators. Most of the outcome is fixed before launch: the data mix, the architecture and its hyperparameters, the learning-rate schedule, and the parallel layout.", "reach": "Produces the base model that instruction tuning, RLHF, RLVR, LoRA, and vision-language-action models all start from.", "resources": [{"title": "Let’s reproduce GPT-2 (124M)", "url": "https://www.youtube.com/watch?v=l8pRSuU81PU", "type": "video", "by": "Andrej Karpathy, 2024", "level": 1, "note": "One full pretraining run, from an empty file to a trained model."}, {"title": "The Smol Training Playbook", "url": "https://huggingface.co/spaces/HuggingFaceTB/smol-training-playbook", "type": "book", "by": "Hugging Face, 2025", "level": 2, "note": "The decisions behind SmolLM3, a 3B model trained on 11T tokens: ablations, architecture, data, and the run itself."}, {"title": "nanochat", "url": "https://github.com/karpathy/nanochat", "type": "code", "by": "Andrej Karpathy, 2025", "level": 2, "note": "Tokenization, pretraining, finetuning, evaluation, and inference in one small codebase that trains a GPT-2 grade model on one 8-GPU node."}, {"title": "The FineWeb Datasets: Decanting the Web for the Finest Text Data at Scale", "url": "https://arxiv.org/abs/2406.17557", "type": "paper", "by": "Penedo et al., Hugging Face, 2024", "level": 3}, {"title": "The Llama 3 Herd of Models", "url": "https://arxiv.org/abs/2407.21783", "type": "paper", "by": "Llama Team, Meta, 2024", "level": 3, "note": "Section 3 covers data, scaling, infrastructure, and the training recipe."}]}, {"id": "icl", "title": "In-context learning", "kind": "concept", "track": "llm", "pre": ["scaling"], "frontier": false, "core": "A large pretrained model can do a new task from a few examples placed in its prompt, with no weight update: the forward pass itself acts as a learning algorithm. Induction heads, which find an earlier match and copy what followed it, are one mechanism.", "reach": "Leads to chain of thought and agents; test-time training makes the in-context learning literal by updating weights during the forward pass.", "resources": [{"title": "Language Models are Few-Shot Learners", "url": "https://arxiv.org/abs/2005.14165", "type": "paper", "by": "Brown et al., OpenAI, 2020", "level": 1, "note": "Figure 2.1 contrasts zero-, one-, and few-shot prompting with fine-tuning."}, {"title": "In-context Learning and Induction Heads", "url": "https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html", "type": "paper", "by": "Olsson et al., Anthropic, 2022", "level": 2}, {"title": "What Can Transformers Learn In-Context? A Case Study of Simple Function Classes", "url": "https://arxiv.org/abs/2208.01066", "type": "paper", "by": "Garg, Tsipras, Liang, Valiant, 2022", "level": 2}, {"title": "Transformers learn in-context by gradient descent", "url": "https://arxiv.org/abs/2212.07677", "type": "paper", "by": "von Oswald et al., 2023", "level": 3}, {"title": "An Explanation of In-context Learning as Implicit Bayesian Inference", "url": "https://arxiv.org/abs/2111.02080", "type": "paper", "by": "Xie, Raghunathan, Liang, Ma, 2022", "level": 3}]}, {"id": "cot", "title": "Chain of thought and test-time compute", "kind": "concept", "track": "llm", "pre": ["icl"], "frontier": true, "core": "Letting a model write intermediate steps before its answer turns one hard prediction into many easy ones. Spending more compute at inference, through longer reasoning or more samples with a vote or a verifier, then buys accuracy the way training compute does.", "reach": "Becomes a training target in RL with verifiable rewards, and the reasoning step inside every agent loop.", "resources": [{"title": "Why We Think", "url": "https://lilianweng.github.io/posts/2025-05-01-thinking/", "type": "blog", "by": "Lilian Weng, 2025", "level": 1}, {"title": "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", "url": "https://arxiv.org/abs/2201.11903", "type": "paper", "by": "Wei et al., Google, 2022", "level": 2}, {"title": "Self-Consistency Improves Chain of Thought Reasoning in Language Models", "url": "https://arxiv.org/abs/2203.11171", "type": "paper", "by": "Wang et al., Google, 2023", "level": 2}, {"title": "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters", "url": "https://arxiv.org/abs/2408.03314", "type": "paper", "by": "Snell, Lee, Xu, Kumar, 2024", "level": 3}, {"title": "s1: Simple test-time scaling", "url": "https://arxiv.org/abs/2501.19393", "type": "paper", "by": "Muennighoff et al., 2025", "level": 3}]}, {"id": "agents", "title": "LLM agents and tool use", "kind": "concept", "track": "llm", "pre": ["cot"], "frontier": true, "core": "An agent is a model in a loop: it reads the state, reasons, picks an action such as a tool call or shell command, sees the result, and repeats until done. Most of the engineering lies in the tools, the context, and when to stop.", "reach": "Agentic RL trains these loops end to end, extending RL with verifiable rewards to multistep tool use.", "resources": [{"title": "Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents", "type": "blog", "by": "Anthropic, 2024", "level": 1}, {"title": "ReAct: Synergizing Reasoning and Acting in Language Models", "url": "https://arxiv.org/abs/2210.03629", "type": "paper", "by": "Yao et al., 2023", "level": 2}, {"title": "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering", "url": "https://arxiv.org/abs/2405.15793", "type": "paper", "by": "Yang et al., Princeton, 2024", "level": 2}, {"title": "Toolformer: Language Models Can Teach Themselves to Use Tools", "url": "https://arxiv.org/abs/2302.04761", "type": "paper", "by": "Schick et al., Meta, 2023", "level": 2}, {"title": "Berkeley LLM Agents MOOC", "url": "https://llmagents-learning.org/", "type": "lectures", "by": "Dawn Song et al., Berkeley, 2024 and 2025", "level": 2}]}, {"id": "moe", "title": "Mixture of experts", "kind": "concept", "track": "llm", "pre": ["attention", "parallel"], "frontier": false, "core": "Replace each dense MLP with many expert MLPs and a learned router that sends each token to only one or a few of them. Parameters grow while compute per token stays fixed; the hard parts are balancing load across experts and moving tokens between devices.", "reach": "Many of the largest open models are mixtures of experts, and expert parallelism joins data, tensor, and pipeline parallelism.", "resources": [{"title": "Mixture of Experts Explained", "url": "https://huggingface.co/blog/moe", "type": "blog", "by": "Sanseviero et al., Hugging Face, 2023", "level": 1}, {"title": "Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity", "url": "https://arxiv.org/abs/2101.03961", "type": "paper", "by": "Fedus, Zoph, Shazeer, 2021", "level": 2}, {"title": "DeepSeekMoE: Towards Ultimate Expert Specialization in Mixture-of-Experts Language Models", "url": "https://arxiv.org/abs/2401.06066", "type": "paper", "by": "Dai et al., DeepSeek, 2024", "level": 2}, {"title": "DeepSeek-V3 Technical Report", "url": "https://arxiv.org/abs/2412.19437", "type": "paper", "by": "DeepSeek-AI, 2024", "level": 3, "note": "Section 2.1.2 balances expert load without an auxiliary loss."}]}, {"id": "ssm", "title": "State-space models and Mamba", "kind": "concept", "track": "llm", "pre": ["linearattn", "odes"], "frontier": true, "core": "Replace attention’s growing cache with a fixed-size state updated by a linear recurrence, so each new token costs the same time and memory. Training still runs in parallel as a scan, and making the update depend on the input (Mamba) restores much of attention’s selectivity.", "reach": "Test-time training turns the state update into a gradient step; hybrids interleave these layers with attention for long contexts.", "resources": [{"title": "A Visual Guide to Mamba and State Space Models", "url": "https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-mamba-and-state", "type": "blog", "by": "Maarten Grootendorst, 2024", "level": 1}, {"title": "Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention", "url": "https://arxiv.org/abs/2006.16236", "type": "paper", "by": "Katharopoulos et al., 2020", "level": 2}, {"title": "Mamba: Linear-Time Sequence Modeling with Selective State Spaces", "url": "https://arxiv.org/abs/2312.00752", "type": "paper", "by": "Gu, Dao, 2023", "level": 2}, {"title": "State Space Duality (Mamba-2) Part I - The Model", "url": "https://tridao.me/blog/2024/mamba2-part1-model/", "type": "blog", "by": "Dao, Gu, 2024", "level": 3, "note": "Shows a selective SSM and causal linear attention computing the same structured matrix."}, {"title": "DeltaNet Explained (Part I)", "url": "https://sustcsonglin.github.io/blog/2024/deltanet-1/", "type": "blog", "by": "Songlin Yang, 2024", "level": 3}, {"title": "The Annotated S4", "url": "https://srush.github.io/annotated-s4/", "type": "code", "by": "Rush, Karamcheti, 2022", "level": 3}]}, {"id": "posenc", "title": "Positional encodings: sinusoidal, RoPE and ALiBi", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": false, "core": "Attention is blind to order, so position is injected. Sinusoidal and learned schemes add a position vector to each token; RoPE rotates queries and keys so scores depend only on relative distance; ALiBi subtracts a distance penalty, which degrades least past the training length.", "reach": "RoPE’s frequencies are what position interpolation and YaRN rescale for long context; NoPE asks whether an explicit encoding is needed at all.", "resources": [{"title": "You could have designed state of the art positional encoding", "url": "https://huggingface.co/blog/designing-positional-encoding", "type": "blog", "by": "Christopher Fleetwood, Hugging Face, 2024", "level": 1, "note": "Builds from integer and binary encodings to sinusoids, then to RoPE."}, {"title": "Train Short, Test Long: Attention with Linear Biases Enables Input Length Extrapolation", "url": "https://arxiv.org/abs/2108.12409", "type": "paper", "by": "Press, Smith, Lewis, 2021", "level": 2, "note": "No position vectors at all, only a penalty on each score proportional to distance."}, {"title": "RoFormer: Enhanced Transformer with Rotary Position Embedding", "url": "https://arxiv.org/abs/2104.09864", "type": "paper", "by": "Su et al., 2021", "level": 2, "note": "Section 3.2 derives the rotation from the 2D case; Section 3.3 shows scores decay with distance."}, {"title": "The Impact of Positional Encoding on Length Generalization in Transformers", "url": "https://arxiv.org/abs/2305.19466", "type": "paper", "by": "Kazemnejad et al., 2023", "level": 3, "note": "On reasoning and math tasks, a decoder with no position encoding generalizes to longer inputs better than RoPE or ALiBi."}]}, {"id": "kvattn", "title": "Multi-query, grouped-query and latent attention", "kind": "concept", "track": "llm", "pre": ["attention", "serving"], "frontier": false, "core": "Decoding rereads every cached key and value at each step, so cache size sets decode speed. Multi-query attention shares one key-value head across all query heads at some cost in quality, grouped-query shares one per group, and latent attention caches one compressed vector per
