aselines, with a short PyTorch implementation."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The policy gradients lecture."}, {"title": "Policy Gradient Methods for Reinforcement Learning with Function Approximation", "url": "https://papers.nips.cc/paper/1999/hash/464d828b85b0bed98e80ade0a5c43b0f-Abstract.html", "type": "paper", "by": "Sutton, McAllester, Singh, Mansour, NeurIPS 1999", "level": 3, "note": "The policy gradient theorem, and when a learned critic leaves the gradient unbiased."}]}, {"id": "dqn", "title": "Deep Q-networks", "kind": "paper", "track": "rl", "pre": ["td", "backprop"], "frontier": false, "core": "Run Q-learning with a convolutional network that reads raw Atari frames, and keep it stable with two tricks: a replay buffer sampled at random to break correlations between consecutive steps, and a target network updated only occasionally, so the regression target stops chasing itself.", "reach": "Its replay buffer and target network carry over to DDPG, TD3 and SAC and to offline Q-learning.", "resources": [{"title": "Human-level control through deep reinforcement learning", "url": "https://storage.googleapis.com/deepmind-media/dqn/DQNNaturePaper.pdf", "type": "paper", "by": "Mnih et al., DeepMind, Nature 2015", "level": 2, "note": "DeepMind’s copy of the Nature paper; the Methods section has the full algorithm."}, {"title": "Deep Q-Learning (DQN)", "url": "https://docs.cleanrl.dev/rl-algorithms/dqn/", "type": "code", "by": "Huang et al., CleanRL, 2022", "level": 2, "note": "Single-file implementations with the paper’s hyperparameters and logged results."}, {"title": "Rainbow: Combining Improvements in Deep Reinforcement Learning", "url": "https://arxiv.org/abs/1710.02298", "type": "paper", "by": "Hessel et al., DeepMind, 2017", "level": 3, "note": "Ablates six later fixes, including double Q-learning and prioritized replay, to show which ones matter."}]}, {"id": "actorcritic", "title": "Actor-critic and advantage estimation", "kind": "concept", "track": "rl", "pre": ["pg", "td"], "frontier": false, "core": "Replace the noisy sampled return in the policy gradient with a learned critic’s estimate of the advantage: how much better an action was than the policy’s average. Generalized advantage estimation averages multi-step TD errors with weight lambda, trading the critic’s bias against the return’s variance.", "reach": "PPO, SAC and RLHF train an actor against a critic; GRPO replaces the critic with a group average.", "resources": [{"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 1, "note": "The actor-critic lecture: from Monte Carlo returns to fitted value functions, n-step returns and GAE."}, {"title": "High-Dimensional Continuous Control Using Generalized Advantage Estimation", "url": "https://arxiv.org/abs/1506.02438", "type": "paper", "by": "Schulman, Moritz, Levine, Jordan, Abbeel, 2015", "level": 2, "note": "Defines GAE as an exponentially weighted sum of TD errors and studies the lambda trade-off."}, {"title": "Policy Gradient Algorithms", "url": "https://lilianweng.github.io/posts/2018-04-08-policy-gradient/", "type": "blog", "by": "Lilian Weng, 2018", "level": 2, "note": "A map of the family, from A2C and A3C to DDPG, TD3 and SAC, in one notation."}]}, {"id": "ppo", "title": "On-policy trust regions: TRPO and PPO", "kind": "concept", "track": "rl", "pre": ["actorcritic", "info"], "frontier": false, "core": "A policy gradient step is only reliable near the policy that collected the data. TRPO enforces this with a KL divergence limit on each update; PPO clips the probability ratio between new and old policies instead, so one batch supports several epochs of minibatch steps.", "reach": "The optimizer of RLHF and the template that GRPO modifies; the KL limit makes each step a natural gradient step.", "resources": [{"title": "Proximal Policy Optimization", "url": "https://spinningup.openai.com/en/latest/algorithms/ppo.html", "type": "tutorial", "by": "Joshua Achiam, OpenAI Spinning Up, 2018", "level": 1, "note": "The clipped objective with pseudocode and a reference implementation."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The advanced policy gradients lectures: bounding the distribution change, natural gradients, TRPO and PPO."}, {"title": "Proximal Policy Optimization Algorithms", "url": "https://arxiv.org/abs/1707.06347", "type": "paper", "by": "Schulman et al., OpenAI, 2017", "level": 2, "note": "Section 3 states the clipped surrogate objective."}, {"title": "Trust Region Policy Optimization", "url": "https://arxiv.org/abs/1502.05477", "type": "paper", "by": "Schulman, Levine, Moritz, Jordan, Abbeel, 2015", "level": 3, "note": "The monotonic improvement bound that motivates the trust region."}, {"title": "The 37 Implementation Details of Proximal Policy Optimization", "url": "https://iclr-blog-track.github.io/2022/03/25/ppo-implementation-details/", "type": "blog", "by": "Huang et al., ICLR Blog Track, 2022", "level": 3, "note": "What separates a working PPO from the paper’s pseudocode."}]}, {"id": "offpolicy", "title": "Off-policy actor-critic: DDPG, TD3 and SAC", "kind": "concept", "track": "rl", "pre": ["actorcritic", "dqn"], "frontier": false, "core": "Learn a Q-function from a replay buffer as DQN does, and train a continuous-action actor to climb its gradient. DDPG uses a deterministic actor; TD3 curbs Q overestimation with twin critics and delayed updates; SAC adds an entropy bonus and a stochastic actor.", "reach": "SAC is the standard continuous-control baseline, the entry to maximum-entropy RL, and the base of many offline methods.", "resources": [{"title": "Deep Deterministic Policy Gradient", "url": "https://spinningup.openai.com/en/latest/algorithms/ddpg.html", "type": "tutorial", "by": "Joshua Achiam, OpenAI Spinning Up, 2018", "level": 1, "note": "Then the TD3 and SAC pages, which build on it in the same notation."}, {"title": "Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic Actor", "url": "https://arxiv.org/abs/1801.01290", "type": "paper", "by": "Haarnoja, Zhou, Abbeel, Levine, 2018", "level": 2}, {"title": "Addressing Function Approximation Error in Actor-Critic Methods", "url": "https://arxiv.org/abs/1802.09477", "type": "paper", "by": "Fujimoto, van Hoof, Meger, 2018", "level": 2, "note": "The TD3 paper: why Q overestimation carries over from DQN to actor-critic, and three fixes."}, {"title": "Soft Actor-Critic Algorithms and Applications", "url": "https://arxiv.org/abs/1812.05905", "type": "paper", "by": "Haarnoja et al., 2018", "level": 3, "note": "Adds automatic tuning of the entropy temperature."}]}, {"id": "maxent", "title": "Maximum-entropy RL and control as inference", "kind": "concept", "track": "rl", "pre": ["offpolicy", "info", "vae"], "frontier": false, "core": "Add the policy’s entropy to the reward. The optimal policy becomes a Boltzmann distribution over soft Q-values, pi(a|s) proportional to exp(Q(s,a)/alpha), the same answer that inference gives in a graphical model where each step is optimal with probability exp(reward).", "reach": "Explains SAC, gives inverse RL its likelihood, and links RL to KL-regularized fine-tuning and stochastic optimal control.", "resources": [{"title": "Learning Diverse Skills via Maximum Entropy Deep Reinforcement Learning", "url": "https://bair.berkeley.edu/blog/2017/10/06/soft-q-learning/", "type": "blog", "by": "Tang, Haarnoja, BAIR, 2017", "level": 1, "note": "Why a stochastic optimal policy keeps every good way of solving a task."}, {"title": "Reinforcement Learning and Control as Probabilistic Inference: Tutorial and Review", "url": "https://arxiv.org/abs/1805.00909", "type": "tutorial", "by": "Sergey Levine, 2018", "level": 2, "note": "Sections 2 and 3: the graphical model, then maximum-entropy RL as variational inference."}, {"title": "Reinforcement Learning with Deep Energy-Based Policies", "url": "https://arxiv.org/abs/1702.08165", "type": "paper", "by": "Haarnoja, Tang, Abbeel, Levine, 2017", "level": 3, "note": "Soft Q-learning: soft Bellman backups and sampling from energy-based policies over continuous actions."}]}, {"id": "imitation", "title": "Imitation learning", "kind": "concept", "track": "rl", "pre": ["mdp", "backprop"], "frontier": false, "core": "Train a policy by supervised learning on expert state-action pairs (behavior cloning). Small mistakes carry the learner into states the expert never visited, so errors compound over the horizon; DAgger fixes this by having the expert label the states the learner actually reaches.", "reach": "The training recipe of Diffusion Policy and VLAs; offline RL and inverse RL relax its need for optimal demonstrations.", "resources": [{"title": "Learning from demonstrations", "url": "https://manipulation.csail.mit.edu/Fall2026/lec/bc_notes.pdf", "type": "notes", "by": "MIT 6.4210 course notes, Fall 2026", "level": 1, "note": "Section 1 shows why averaging multimodal actions fails; Section 3 covers DAgger."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The behavioral cloning lectures: distributional shift, DAgger and multimodal behavior."}, {"title": "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning", "url": "https://arxiv.org/abs/1011.0686", "type": "paper", "by": "Ross, Gordon, Bagnell, 2011", "level": 2, "note": "The DAgger paper, with the compounding error analysis."}, {"title": "An Algorithmic Perspective on Imitation Learning", "url": "https://arxiv.org/abs/1811.06711", "type": "paper", "by": "Osa et al., 2018", "level": 3, "note": "A survey that sorts behavior cloning and inverse RL methods by what they assume."}]}, {"id": "irl", "title": "Inverse RL and adversarial imitation", "kind": "concept", "track": "rl", "pre": ["imitation", "maxent", "gan"], "frontier": false, "core": "Instead of copying actions, infer the reward the expert seems to optimize. Maximum-entropy IRL fits a reward under which expert trajectories are exponentially more likely; GAIL skips the reward and trains the policy to fool a discriminator that separates its behavior from the expert’s.", "reach": "RLHF reward models are preference-based inverse RL; AIRL recovers rewards that still work when the dynamics change.", "resources": [{"title": "Section 7: Inverse Reinforcement Learning and LLM RL", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/static/sections/section-7.pdf", "type": "notes", "by": "Kevin Black, Berkeley CS285, 2026", "level": 1, "note": "Four pages deriving maximum-entropy IRL from the control as inference model."}, {"title": "Maximum Entropy Inverse Reinforcement Learning", "url": "https://cdn.aaai.org/AAAI/2008/AAAI08-227.pdf", "type": "paper", "by": "Ziebart, Maas, Bagnell, Dey, AAAI 2008", "level": 2}, {"title": "Generative Adversarial Imitation Learning", "url": "https://arxiv.org/abs/1606.03476", "type": "paper", "by": "Ho, Ermon, 2016", "level": 2, "note": "Imitation as matching occupancy measures with a discriminator, no reward recovered."}, {"title": "Learning Robust Rewards with Adversarial Inverse Reinforcement Learning", "url": "https://arxiv.org/abs/1710.11248", "type": "paper", "by": "Fu, Luo, Levine, 2017", "level": 3, "note": "AIRL: a discriminator structure that separates a transferable reward from the policy."}, {"title": "Inverse Reinforcement Learning Meets Large Language Model Post-Training: Basics, Advances, and Opportunities", "url": "https://arxiv.org/abs/2507.13158", "type": "paper", "by": "Sun, van der Schaar, 2025", "level": 3, "note": "Recasts reward modeling and RLHF for LLMs as inverse RL."}]}, {"id": "offline", "title": "Offline RL", "kind": "concept", "track": "rl", "pre": ["offpolicy", "imitation"], "frontier": false, "core": "Learn a policy from a fixed dataset with no further interaction. A Q-function trained on that data overrates actions the data never tried, and the policy exploits those errors; offline methods stay pessimistic, pushing down Q on unseen actions (CQL) or never querying them (IQL).", "reach": "Decision Transformer recasts it as sequence modeling; RLHF on a fixed preference set faces the same distribution shift.", "resources": [{"title": "Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems", "url": "https://arxiv.org/abs/2005.01643", "type": "tutorial", "by": "Levine, Kumar, Tucker, Fu, 2020", "level": 2, "note": "Section 2.4 explains why it is hard; Section 4 covers policy constraints and conservative value functions."}, {"title": "Conservative Q-Learning for Offline Reinforcement Learning", "url": "https://arxiv.org/abs/2006.04779", "type": "paper", "by": "Kumar, Zhou, Tucker, Levine, 2020", "level": 2, "note": "Learns a Q-function that lower-bounds the true value by penalizing actions outside the data."}, {"title": "Offline Reinforcement Learning with Implicit Q-Learning", "url": "https://arxiv.org/abs/2110.06169", "type": "paper", "by": "Kostrikov, Nair, Levine, 2021", "level": 2, "note": "Expectile regression on values, so the critic never evaluates actions outside the data."}, {"title": "A Minimalist Approach to Offline Reinforcement Learning", "url": "https://arxiv.org/abs/2106.06860", "type": "paper", "by": "Fujimoto, Gu, 2021", "level": 3, "note": "TD3 plus a behavior cloning term: the baseline any new method has to beat."}]}, {"id": "dt", "title": "Decision Transformer", "kind": "paper", "track": "rl", "pre": ["offline", "attention"], "frontier": false, "core": "Write each trajectory as a sequence of return to go, state and action tokens, and train a GPT-style transformer to predict actions. At test time, prompt it with the return you want; it acts to reach it, with no value function or Bellman backup.", "reach": "Ties offline RL to language modeling; its limits in stochastic environments show what learned values still provide.", "resources": [{"title": "Introducing Decision Transformers on Hugging Face", "url": "https://huggingface.co/blog/decision-transformers", "type": "blog", "by": "Beeching, Simonini, Hugging Face, 2022", "level": 1, "note": "The idea and a working model in a few cells."}, {"title": "Decision Transformer: Reinforcement Learning via Sequence Modeling", "url": "https://arxiv.org/abs/2106.01345", "type": "paper", "by": "Chen et al., 2021", "level": 2}, {"title": "Offline Reinforcement Learning as One Big Sequence Modeling Problem", "url": "https://arxiv.org/abs/2106.02039", "type": "paper", "by": "Janner, Li, Levine, 2021", "level": 2, "note": "The Trajectory Transformer: models states, actions and rewards jointly and plans with beam search."}, {"title": "When does return-conditioned supervised learning work for offline reinforcement learning?", "url": "https://arxiv.org/abs/2206.01079", "type": "paper", "by": "Brandfonbrener et al., 2022", "level": 3, "note": "Shows return conditioning needs stronger assumptions than dynamic programming, with examples where it fails."}]}, {"id": "mbrl", "title": "Model-based RL and planning", "kind": "concept", "track": "rl", "pre": ["mdp", "control"], "frontier": false, "core": "Learn the environment’s dynamics from data, then plan with the model: search over action sequences at each step (model predictive control) or generate imagined experience for a policy. Real samples go further, but planners exploit model errors, so uncertainty and short rollouts matter.", "reach": "Dreamer learns its policy inside the model, MuZero plans with one, and video world models scale the model up.", "resources": [{"title": "Reinforcement Learning: An Introduction", "url": "http://incompleteideas.net/book/the-book-2nd.html", "type": "book", "by": "Sutton, Barto, 2nd edition, 2018", "level": 1, "note": "Chapter 8: Dyna, prioritized sweeping, rollouts and Monte Carlo tree search in the tabular setting."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The model-based RL lectures: distributional shift in models, bootstrap ensembles, MPC and MBPO."}, {"title": "Deep Reinforcement Learning in a Handful of Trials using Probabilistic Dynamics Models", "url": "https://arxiv.org/abs/1805.12114", "type": "paper", "by": "Chua, Calandra, McAllister, Levine, 2018", "level": 2, "note": "PETS: probabilistic ensembles plus sampling-based MPC, where modeling uncertainty is what makes planning work."}, {"title": "When to Trust Your Model: Model-Based Policy Optimization", "url": "https://arxiv.org/abs/1906.08253", "type": "paper", "by": "Janner, Fu, Zhang, Levine, 2019", "level": 2, "note": "Short model rollouts branched from real states, with a bound on when the model helps."}, {"title": "Mastering Atari, Go, Chess and Shogi by Planning with a Learned Model", "url": "https://arxiv.org/abs/1911.08265", "type": "paper", "by": "Schrittwieser et al., DeepMind, 2019", "level": 3, "note": "MuZero: tree search in a learned latent model that predicts only reward, value and policy."}]}, {"id": "dreamer", "title": "Dreamer: learning inside a world model", "kind": "paper", "track": "rl", "pre": ["mbrl", "vae", "actorcritic"], "frontier": false, "core": "Learn a recurrent latent model of the world from pixels, trained like a sequential VAE, then train an actor and critic entirely on imagined latent rollouts. Real interaction only collects data for the model; DreamerV3 adds normalizations so one hyperparameter setting works across domains.", "reach": "Bridges model-based RL and learned simulators; its recurrent state space model is a template for later world models.", "resources": [{"title": "World Models", "url": "https://worldmodels.github.io/", "type": "paper", "by": "Ha, Schmidhuber, 2018", "level": 1, "note": "Interactive version: a VAE, a recurrent dynamics model and a small controller trained inside the dream."}, {"title": "Dream to Control: Learning Behaviors by Latent Imagination", "url": "https://arxiv.org/abs/1912.01603", "type": "paper", "by": "Hafner, Lillicrap, Ba, Norouzi, 2019", "level": 2, "note": "The cleanest statement of the method: backpropagate values through imagined latent trajectories."}, {"title": "Mastering Diverse Domains through World Models", "url": "https://arxiv.org/abs/2301.04104", "type": "paper", "by": "Hafner, Pasukonis, Ba, Lillicrap, 2023", "level": 2, "note": "DreamerV3: one configuration across Atari, control, Crafter and Minecraft. The open-access Nature version (2025) is titled Mastering diverse control tasks through world models."}, {"title": "TD-MPC2: Scalable, Robust World Models for Continuous Control", "url": "https://arxiv.org/abs/2310.16828", "type": "paper", "by": "Hansen, Su, Wang, 2023", "level": 3, "note": "The decoder-free alternative: plan in latent space with MPPI instead of learning a policy in imagination."}]}, {"id": "exploration", "title": "Exploration and intrinsic motivation", "kind": "concept", "track": "rl", "pre": ["bandits", "dqn"], "frontier": false, "core": "When rewards are sparse, pay the agent for reaching what it has not seen. Count-based bonuses extend the bandit bonus to huge state spaces with pseudo-counts; curiosity rewards a learned model’s prediction error, and RND the error in predicting a fixed random network’s output.", "reach": "Extends bandit optimism to deep RL; skill discovery drops the task reward entirely.", "resources": [{"title": "Exploration Strategies in Deep Reinforcement Learning", "url": "https://lilianweng.github.io/posts/2020-06-07-exploration-drl/", "type": "blog", "by": "Lilian Weng, 2020", "level": 1}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The exploration lecture: optimism, posterior sampling and counts, from bandits to deep RL."}, {"title": "Unifying Count-Based Exploration and Intrinsic Motivation", "url": "https://arxiv.org/abs/1606.01868", "type": "paper", "by": "Bellemare et al., DeepMind, 2016", "level": 2, "note": "Pseudo-counts from a density model, the bridge from bandit bonuses to Atari."}, {"title": "Exploration by Random Network Distillation", "url": "https://arxiv.org/abs/1810.12894", "type": "paper", "by": "Burda, Edwards, Storkey, Klimov, 2018", "level": 2, "note": "A simple bonus that beat average human play on Montezuma’s Revenge without demonstrations."}, {"title": "Go-Explore: a New Approach for Hard-Exploration Problems", "url": "https://arxiv.org/abs/1901.10995", "type": "paper", "by": "Ecoffet et al., Uber AI, 2019", "level": 3, "note": "Remember promising states, return to them, then explore from there."}]}, {"id": "skills", "title": "Unsupervised skill discovery", "kind": "concept", "track": "rl", "pre": ["maxent", "info"], "frontier": true, "core": "With no reward, learn policies indexed by a latent skill z whose behaviors are easy to tell apart. DIAYN maximizes mutual information between skill and state, rewarding states from which a discriminator can guess z; METRA instead spreads skills apart in a learned temporal distance.", "reach": "Pretrains behaviors for downstream tasks and hierarchies, using SAC’s entropy term and variational bounds on mutual information.", "resources": [{"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 1, "note": "The advanced exploration lecture: learning diverse skills, the link to mutual information, and empowerment."}, {"title": "Diversity is All You Need: Learning Skills without a Reward Function", "url": "https://arxiv.org/abs/1802.06070", "type": "paper", "by": "Eysenbach, Gupta, Ibarz, Levine, 2018", "level": 2}, {"title": "METRA: Scalable Unsupervised RL with Metric-Aware Abstraction", "url": "https://arxiv.org/abs/2310.08887", "type": "paper", "by": "Park, Rybkin, Levine, 2023", "level": 3, "note": "Why mutual information skills can fail to explore, and a temporal distance objective that scales to pixels."}, {"title": "Dynamics-Aware Unsupervised Discovery of Skills", "url": "https://arxiv.org/abs/1907.01657", "type": "paper", "by": "Sharma, Gu, Levine, Kumar, Hausman, 2019", "level": 3, "note": "DADS: skills chosen to be predictable, so a planner can compose them."}]}, {"id": "sft", "title": "Instruction tuning", "kind": "concept", "track": "post", "pre": ["pretrain"], "frontier": false, "core": "Fine-tune a pretrained model on (instruction, response) pairs with the same next-token loss, counted only on the response tokens. A few thousand to a million good examples in a fixed chat format turn a document completer into an assistant that follows requests.", "reach": "Produces the starting policy for RLHF, DPO, and RLVR; LoRA makes it cheap.", "resources": [{"title": "Instruction Fine-Tuning (RLHF Book)", "url": "https://rlhfbook.com/c/04-instruction-tuning", "type": "book", "by": "Nathan Lambert, 2025", "level": 1}, {"title": "Finetuned Language Models Are Zero-Shot Learners", "url": "https://arxiv.org/abs/2109.01652", "type": "paper", "by": "Wei et al., Google, 2021", "level": 2}, {"title": "LIMA: Less Is More for Alignment", "url": "https://arxiv.org/abs/2305.11206", "type": "paper", "by": "Zhou et al., Meta, 2023", "level": 2}, {"title": "Hugging Face smol-course", "url": "https://github.com/huggingface/smol-course", "type": "code", "by": "Hugging Face, 2025", "level": 2, "note": "Unit 1 covers supervised fine-tuning and chat templates on a local machine."}, {"title": "Tulu 3: Pushing Frontiers in Open Language Model Post-Training", "url": "https://arxiv.org/abs/2411.15124", "type": "paper", "by": "Lambert et al., Ai2, 2024", "level": 3, "note": "A fully open recipe: SFT data, DPO, and RL with verifiable rewards."}]}, {"id": "rlhf", "title": "RLHF: reward models and PPO", "kind": "paper", "track": "post", "pre": ["sft", "ppo"], "frontier": false, "core": "Collect human rankings of model outputs, fit a reward model that predicts which output people prefer, then optimize the model against that reward with PPO while a KL penalty keeps it near the supervised start. People preferred 1.3B InstructGPT to 175B GPT-3.", "reach": "DPO removes the RL loop, constitutional AI replaces human labels, and reward hacking is what happens when the optimization goes too far.", "resources": [{"title": "Illustrating Reinforcement Learning from Human Feedback (RLHF)", "url": "https://huggingface.co/blog/rlhf", "type": "blog", "by": "Lambert, Castricato, von Werra, Havrilla, 2022", "level": 1}, {"title": "Training language models to follow instructions with human feedback", "url": "https://arxiv.org/abs/2203.02155", "type": "paper", "by": "Ouyang et al., OpenAI, 2022", "level": 2, "note": "Figure 2 shows the three steps; Section 3.5 gives the PPO objective with its KL penalty."}, {"title": "RLHF Book", "url": "https://rlhfbook.com/", "type": "book", "by": "Nathan Lambert, 2025", "level": 2, "note": "The Reward Modeling and Reinforcement Learning chapters."}, {"title": "The N+ Implementation Details of RLHF with PPO: A Case Study on TL;DR Summarization", "url": "https://arxiv.org/abs/2403.17031", "type": "paper", "by": "Huang et al., 2024", "level": 3}, {"title": "Deep reinforcement learning from human preferences", "url": "https://arxiv.org/abs/1706.03741", "type": "paper", "by": "Christiano et al., 2017", "level": 2, "note": "The original reward model from pairwise preferences, on Atari and MuJoCo."}]}, {"id": "dpo", "title": "Direct preference optimization", "kind": "paper", "track": "post", "pre": ["rlhf"], "frontier": false, "core": "The KL-regularized reward objective in RLHF has a closed-form optimal policy, so the reward can be written in terms of the policy. Substituting that into the preference model gives a classification loss on chosen versus rejected responses, with no reward model or RL loop.", "reach": "The default offline preference method, and the usual baseline for online RL methods such as RLVR.", "resources": [{"title": "Direct-Alignment Algorithms (RLHF Book)", "url": "https://rlhfbook.com/c/08-direct-alignment", "type": "book", "by": "Nathan Lambert, 2025", "level": 1, "note": "Includes the full DPO derivation."}, {"title": "Direct Preference Optimization: Your Language Model is Secretly a Reward Model", "url": "https://arxiv.org/abs/2305.18290", "type": "paper", "by": "Rafailov et al., Stanford, 2023", "level": 2, "note": "Section 4 derives the loss; Appendix A.1 derives the optimal KL-constrained policy."}, {"title": "Is DPO Superior to PPO for LLM Alignment? A Comprehensive Study", "url": "https://arxiv.org/abs/2404.10719", "type": "paper", "by": "Xu et al., 2024", "level": 3}, {"title": "A General Theoretical Paradigm to Understand Learning from Human Preferences", "url": "https://arxiv.org/abs/2310.12036", "type": "paper", "by": "Azar et al., DeepMind, 2023", "level": 3}]}, {"id": "rlvr", "title": "RL with verifiable rewards and GRPO", "kind": "concept", "track": "post", "pre": ["rlhf", "cot"], "frontier": true, "core": "When a program can check the answer, as in math or unit tests, that check is the reward and RL needs no learned reward model. GRPO samples several answers per prompt and scores each against the group’s average reward, so no value network is needed.", "reach": "Trains the long chains of thought behind reasoning models; verifier gaming is the newest form of reward hacking.", "resources": [{"title": "Reasoning and Inference-Time Scaling (RLHF Book)", "url": "https://rlhfbook.com/c/07-reasoning", "type": "book", "by": "Nathan Lambert, 2025", "level": 1}, {"title": "DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models", "url": "https://arxiv.org/abs/2402.03300", "type": "paper", "by": "Shao et al., DeepSeek, 2024", "level": 2, "note": "Section 4.1 introduces GRPO, starting from PPO."}, {"title": "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning", "url": "https://arxiv.org/abs/2501.12948", "type": "paper", "by": "DeepSeek-AI, 2025", "level": 2}, {"title": "Understanding R1-Zero-Like Training: A Critical Perspective", "url": "https://arxiv.org/abs/2503.20783", "type": "paper", "by": "Liu et al., 2025", "level": 3}, {"title": "Does Reinforcement Learning Really Incentivize Reasoning Capacity in LLMs Beyond the Base Model?", "url": "https://arxiv.org/abs/2504.13837", "type": "paper", "by": "Yue et al., 2025", "level": 3}]}, {"id": "cai", "title": "Constitutional AI and RLAIF", "kind": "paper", "track": "post", "pre": ["rlhf"], "frontier": false, "core": "Replace most human harmlessness labels with a written list of principles. The model critiques and revises its own answers against them to make supervised data, then an AI judge compares pairs of answers against the principles to make preference labels for RL.", "reach": "AI feedback and rubric judges now supply much of the preference data in post-training; deliberative alignment trains models to reason over a written spec.", "resources": [{"title": "Claude’s constitution", "url": "https://www.anthropic.com/news/claudes-constitution", "type": "blog", "by": "Anthropic, 2023", "level": 1}, {"title": "Constitutional AI: Harmlessness from AI Feedback", "url": "https://arxiv.org/abs/2212.08073", "type": "paper", "by": "Bai et al., Anthropic, 2022", "level": 2, "note": "Figure 1 shows the supervised and RL stages."}, {"title": "RLAIF vs. RLHF: Scaling Reinforcement Learning from Human Feedback with AI Feedback", "url": "https://arxiv.org/abs/2309.00267", "type": "paper", "by": "Lee et al., Google, 2023", "level": 2}, {"title": "Synthetic Data & Distillation (RLHF Book)", "url": "https://rlhfbook.com/c/12-synthetic-data", "type": "book", "by": "Nathan Lambert, 2025", "level": 2, "note": "The AI Feedback and Constitutional AI sections."}, {"title": "Deliberative Alignment: Reasoning Enables Safer Language Models", "url": "https://arxiv.org/abs/2412.16339", "type": "paper", "by": "Guan et al., OpenAI, 2024", "level": 3}]}, {"id": "overopt", "title": "Reward hacking and overoptimization", "kind": "concept", "track": "post", "pre": ["rlhf"], "frontier": true, "core": "A reward model is only a proxy for what people want, so optimizing hard against it first raises true quality and then lowers it while the proxy score keeps climbing. The gap grows predictably with how far the policy moves from where it started.", "reach": "Why RLHF keeps a KL penalty, why RLVR prefers checkable rewards, and why verifiers still get gamed.", "resources": [{"title": "Reward Hacking in Reinforcement Learning", "url": "https://lilianweng.github.io/posts/2024-11-28-reward-hacking/", "type": "blog", "by": "Lilian Weng, 2024", "level": 1}, {"title": "Scaling Laws for Reward Model Overoptimization", "url": "https://arxiv.org/abs/2210.10760", "type": "paper", "by": "Gao, Schulman, Hilton, OpenAI, 2022", "level": 2}, {"title": "Monitoring Reasoning Models for Misbehavior and the Risks of Promoting Obfuscation", "url": "https://arxiv.org/abs/2503.11926", "type": "paper", "by": "Baker et al., OpenAI, 2025", "level": 3}, {"title": "Natural Emergent Misalignment from Reward Hacking in Production RL", "url": "https://arxiv.org/abs/2511.18397", "type": "paper", "by": "MacDiarmid et al., Anthropic, 2025", "level": 3}, {"title": "Reward Model Ensembles Help Mitigate Overoptimization", "url": "https://arxiv.org/abs/2310.02743", "type": "paper", "by": "Coste et al., 2023", "level": 3}]}, {"id": "probing", "title": "Probing and linear representations", "kind": "concept", "track": "interp", "pre": ["attention"], "frontier": false, "core": "Train a simple classifier, usually linear, to read a property from a model’s hidden activations. If it beats a control, the information is present, though not necessarily used; the linear representation hypothesis says many concepts are directions in activation space.", "reach": "Directions found by probes become steering vectors, and sparse autoencoders search for such directions without labels.", "resources": [{"title": "Understanding intermediate layers using linear classifier probes", "url": "https://arxiv.org/abs/1610.01644", "type": "paper", "by": "Guillaume Alain, Yoshua Bengio, 2016", "level": 1, "note": "The original linear probe, applied layer by layer."}, {"title": "Probing Classifiers: Promises, Shortcomings, and Advances", "url": "https://arxiv.org/abs/2102.12452", "type": "paper", "by": "Yonatan Belinkov, 2021", "level": 2, "note": "A survey of what probes can and cannot show."}, {"title": "Designing and Interpreting Probes with Control Tasks", "url": "https://arxiv.org/abs/1909.03368", "type": "paper", "by": "John Hewitt, Percy Liang, 2019", "level": 2, "note": "Control tasks separate what the representation encodes from what the probe learns."}, {"title": "Emergent Linear Representations in World Models of Self-Supervised Sequence Models", "url": "https://arxiv.org/abs/2309.00941", "type": "paper", "by": "Neel Nanda, Andrew Lee, Martin Wattenberg, 2023", "level": 2, "note": "Othello-GPT’s board looked nonlinear until probed as mine versus theirs; then it was linear and steerable."}, {"title": "ARENA Chapter 1: Transformer Interpretability", "url": "https://www.arena.education/chapter1", "type": "code", "by": "Callum McDougall and contributors, ARENA, 2024", "level": 2, "note": "The Linear Probes section trains and tests probes in notebooks."}, {"title": "The Linear Representation Hypothesis and the Geometry of Large Language Models", "url": "https://arxiv.org/abs/2311.03658", "type": "paper", "by": "Kiho Park, Yo Joong Choe, Victor Veitch, 2023", "level": 3, "note": "Makes the hypothesis precise and finds the inner product under which it holds."}]}, {"id": "circuits", "title": "Transformer circuits", "kind": "paper", "track": "interp", "pre": ["attention"], "frontier": false, "core": "Read a transformer as a sum of paths through a shared residual stream. Each attention head moves information between positions, and heads in two layers can compose into an induction circuit that copies what followed the current token’s previous occurrence.", "reach": "Induction heads explain much of in-context learning; superposition is what makes circuits hard to read in larger models.", "resources": [{"title": "A Mathematical Framework for Transformer Circuits", "url": "https://transformer-circuits.pub/2021/framework/index.html", "type": "paper", "by": "Elhage et al., Anthropic, 2021", "level": 2, "note": "Read the residual stream as a communication channel, attention heads as information movement, and the two-layer induction head."}, {"title": "A Walkthrough of A Mathematical Framework for Transformer Circuits", "url": "https://www.youtube.com/watch?v=KV5gbOmHbjU", "type": "video", "by": "Neel Nanda, 2022", "level": 1, "note": "One of the authors walks through the paper section by section."}, {"title": "In-context Learning and Induction Heads", "url": "https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html", "type": "paper", "by": "Olsson et al., Anthropic, 2022", "level": 2, "note": "Induction heads form in a sudden phase change that coincides with in-context learning."}, {"title": "ARENA Chapter 1: Transformer Interpretability", "url": "https://www.arena.education/chapter1", "type": "code", "by": "Callum McDougall and contributors, ARENA, 2024", "level": 2, "note": "Introduction to Mechanistic Interpretability, then Indirect Object Identification, in notebooks with TransformerLens."}, {"title": "A Comprehensive Mechanistic Interpretability Explainer & Glossary", "url": "https://www.neelnanda.io/mechanistic-interpretability/glossary", "type": "notes", "by": "Neel Nanda, 2022", "level": 1, "note": "Look up terms as the papers use them."}, {"title": "Interpretability in the Wild: a Circuit for Indirect Object Identification in GPT-2 small", "url": "https://arxiv.org/abs/2211.00593", "type": "paper", "by": "Wang et al., 2022", "level": 3, "note": "A full circuit of 26 heads in a real model, found by path patching."}]}, {"id": "superposition", "title": "Superposition", "kind": "paper", "track": "interp", "pre": ["circuits", "linalg"], "frontier": false, "core": "A network can store more features than it has dimensions by giving each feature its own nearly orthogonal direction, which works when features are sparse and rarely active together. The price is interference, and single neurons end up responding to several unrelated features.", "reach": "Why neurons are polysemantic, and why sparse autoencoders are used to pull features back out.", "resources": [{"title": "Toy Models of Superposition", "url": "https://transformer-circuits.pub/2022/toy_model/index.html", "type": "paper", "by": "Elhage et al., Anthropic, 2022", "level": 2, "note": "Start with Definitions and Motivation and Demonstrating Superposition; the phase diagrams and geometry follow."}, {"title": "How might LLMs store facts | Deep Learning Chapter 7", "url": "https://www.youtube.com/watch?v=9-Jl0dxWQs8", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2024", "level": 1, "note": "Ends with why high-dimensional space holds far more nearly orthogonal directions than dimensions."}, {"title": "ARENA Chapter 1: Transformer Interpretability", "url": "https://www.arena.education/chapter1", "type": "code", "by": "Callum McDougall and contributors, ARENA, 2024", "level": 2, "note": "The Superposition section rebuilds the toy models in notebooks."}, {"title": "Distributed Representations: Composition & Superposition", "url": "https://transformer-circuits.pub/2023/superposition-composition/index.html", "type": "notes", "by": "Chris Olah, Anthropic, 2023", "level": 2, "note": "When features compose and when they sit in superposition."}, {"title": "Polysemanticity and Capacity in Neural Networks", "url": "https://arxiv.org/abs/2210.01892", "type": "paper", "by": "Scherlis, Sachan, Jermyn, Benton, Shlegeris, 2022", "level": 3, "note": "Treats superposition as allocating limited capacity across features by their importance to the loss."}]}, {"id": "sae", "title": "Sparse autoencoders", "kind": "concept", "track": "interp", "pre": ["superposition"], "frontier": false, "core": "Train a wide autoencoder on a model’s activations with a sparsity penalty, so each activation is rebuilt from a few of many learned directions. Those directions, called features, are often far more interpretable than neurons, partly undoing superposition at the cost of some reconstruction error.", "reach": "Features become the units of attribution graphs and the directions used for activation steering.", "resources": [{"title": "Towards Monosemanticity: Decomposing Language Models With Dictionary Learning", "url": "https://transformer-circuits.pub/2023/monosemantic-features/index.html", "type": "paper", "by": "Bricken et al., Anthropic, 2023", "level": 2, "note": "Read Problem Setup and the individual feature investigations; the interface lets you browse features."}, {"title": "An Intuitive Explanation of Sparse Autoencoders for LLM Interpretability", "url": "https://adamkarvonen.github.io/machine_learning/2024/06/11/sae-intuitions.html", "type": "blog", "by": "Adam Karvonen, 2024", "level": 1, "note": "The architecture and loss in a few lines of PyTorch, with the reasoning behind each piece."}, {"title": "Scaling Monosemanticity: Extracting Interpretable Features from Claude 3 Sonnet", "url": "https://transformer-circuits.pub/2024/scaling-monosemanticity/index.html", "type": "paper", "by": "Templeton et al., Anthropic, 2024", "level": 2, "note": "Sparse autoencoders on a production model, with scaling laws and features for abstract concepts."}, {"title": "Scaling and evaluating sparse autoencoders", "url": "https://arxiv.org/abs/2406.04093", "type": "paper", "by": "Gao et al., OpenAI, 2024", "level": 3, "note": "TopK sparsity, scaling laws, and metrics for judging autoencoders."}, {"title": "ARENA Chapter 1: Transformer Interpretability", "url": "https://www.arena.education/chapter1", "type": "code", "by": "Callum McDougall and contributors, ARENA, 2024", "level": 2, "note": "The Interpretability with SAEs section trains and inspects autoencoders in notebooks."}]}, {"id": "attribution", "title": "Attribution graphs and circuit tracing", "kind": "paper", "track": "interp", "pre": ["sae"], "frontier": true, "core": "Replace a model’s MLPs with a cross-layer transcoder whose sparse features are interpretable, then, for one prompt, trace which features cause which through linear attributions. The resulting graph shows intermediate steps, such as recalling a fact in two hops or planning a rhyme ahead.", "reach": "Builds on sparse autoencoders and transcoders; the graphs suggest which features to steer and where stated reasoning departs from the computation.", "resources": [{"title": "Circuit Tracing: Revealing Computational Graphs in Language Models", "url": "https://transformer-circuits.pub/2025/attribution-graphs/methods.html", "type": "paper", "by": "Ameisen et al., Anthropic, 2025", "level": 2, "note": "Start with Building an Interpretable Replacement Model and Attribution Graphs."}, {"title": "On the Biology of a Large Language Model", "url": "https://transformer-circuits.pub/2025/attribution-graphs/biology.html", "type": "paper", "by": "Lindsey et al., Anthropic, 2025", "level": 2, "note": "Case studies: multi-step reasoning, planning in poems, addition, refusals, and chain-of-thought faithfulness."}, {"title": "circuit-tracer", "url": "https://github.com/decoderesearch/circuit-tracer", "type": "code", "by": "Anthropic and Decode Research, 2025", "level": 2, "note": "Builds attribution graphs for open models and runs interventions; also usable on Neuronpedia with no install."}, {"title": "Transcoders Find Interpretable LLM Feature Circuits", "url": "https://arxiv.org/abs/2406.11944", "type": "paper", "by": "Jacob Dunefsky, Philippe Chlenski, Neel Nanda, 2024", "level": 3, "note": "Why replacing MLPs with transcoders makes feature circuits linear and readable."}, {"title": "Sparse Feature Circuits: Discovering and Editing Interpretable Causal Graphs in Language Models", "url": "https://arxiv.org/abs/2403.19647", "type": "paper", "by": "Marks et al., 2024", "level": 3, "note": "An earlier route: causal graphs over sparse autoencoder features."}]}, {"id": "actsteer", "title": "Activation steering", "kind": "concept", "track": "interp", "pre": ["probing", "sae"], "frontier": true, "core": "Add a fixed vector to a model’s activations during the forward pass to change its behavior, with no training. The vector is often the mean activation difference between contrasting prompts, such as honest minus dishonest, or a sparse autoencoder feature’s direction.", "reach": "Turns probing results into interventions, and the same directions can monitor behavior, as the refusal direction and persona vectors show.", "resources": [{"title": "Steering Language Models With Activation Engineering", "url": "https://arxiv.org/abs/2308.10248", "type": "paper", "by": "Turner et al., 2023", "level": 1, "note": "ActAdd: steer with the activation difference of one prompt pair, such as Love minus Hate."}, {"title": "Steering Llama 2 via Contrastive Activation Addition", "url": "https://arxiv.org/abs/2312.06681", "type": "paper", "by": "Panickssery et al., 2023", "level": 2, "note": "Averages the difference over many contrasting pairs and steers behaviors such as sycophancy."}, {"title": "Refusal in Language Models Is Mediated by a Single Direction", "url": "https://arxiv.org/abs/2406.11717", "type": "paper", "by": "Arditi et al., 2024", "level": 2, "note": "Removing one direction disables refusal; adding it makes the model refuse harmless requests."}, {"title": "Scaling Monosemanticity: Extracting Interpretable Features from Claude 3 Sonnet", "url": "https://transformer-circuits.pub/2024/scaling-monosemanticity/index.html", "type": "paper", "by": "Templeton et al., Anthropic, 2024", "level": 2, "note": "The Influence on Behavior section steers the model by clamping single sparse autoencoder features."}, {"title": "ARENA Chapter 1: Transformer Interpretability", "url": "https://www.arena.education/chapter1", "type": "code", "by": "Callum McDougall and contributors, ARENA, 2024", "level": 2, "note": "The Function Vectors & Model Steering section implements steering in notebooks."}, {"title": "Persona Vectors: Monitoring and Controlling Character Traits in Language Models", "url": "https://arxiv.org/abs/2507.21509", "type": "paper", "by": "Chen, Arditi, Sleight, Evans, Lindsey, 2025", "level": 3, "note": "Extracts trait directions automatically, then uses them to monitor, steer, and flag training data that would shift a persona."}]}, {"id": "forgetting", "title": "Catastrophic forgetting and EWC", "kind": "paper", "track": "cl", "pre": ["training", "stats"], "frontier": false, "core": "Training on task B overwrites the weights task A relied on, so performance on A collapses. Elastic weight consolidation anchors each weight to its old value with a quadratic penalty scaled by its Fisher information, an estimate of how much task A needed it.", "reach": "The baseline that replay, LoRA’s forgetting results, and the KL penalty in RLHF are all measured against.", "resources": [{"title": "Continual Learning and Catastrophic Forgetting", "url": "https://arxiv.org/abs/2403.05175", "type": "book", "by": "van de Ven, Soures, Kudithipudi, 2024", "level": 1, "note": "A short book chapter on the problem, its scenarios, and the main approaches."}, {"title": "Overcoming catastrophic forgetting in neural networks", "url": "https://arxiv.org/abs/1612.00796", "type": "paper", "by": "Kirkpatrick et al., DeepMind, 2017", "level": 2}, {"title": "Three scenarios for continual learning", "url": "https://arxiv.org/abs/1904.07734", "type": "paper", "by": "van de Ven, Tolias, 2019", "level": 2}, {"title": "On Quadratic Penalties in Elastic Weight Consolidation", "url": "https://arxiv.org/abs/1712.03847", "type": "paper", "by": "Ferenc Huszár, 2017", "level": 3}]}, {"id": "replay", "title": "Replay and rehearsal", "kind": "concept", "track": "cl", "pre": ["forgetting"], "frontier": false, "core": "Keep a small buffer of old examples, or a generator that can produce them, and mix them into training on new data so the gradient keeps serving old tasks. Even a tiny buffer of a few examples per class often beats weight regularization.", "reach": "The standard defense when continually pretraining LLMs; the replay buffer in deep RL is the same idea.", "resources": [{"title": "On Tiny Episodic Memories in Continual Learning", "url": "https://arxiv.org/abs/1902.10486", "type": "paper", "by": "Chaudhry et al., 2019", "level": 1}, {"title": "Continual Learning with Deep Generative Replay", "url": "https://arxiv.org/abs/1705.08690", "type": "paper", "by": "Shin, Lee, Kim, Kim, 2017", "level": 2}, {"title": "Simple and Scalable Strategies to Continually Pre-train Large Language Models", "url": "https://arxiv.org/abs/2403.08763", "type": "paper", "by": "Ibrahim et al., 2024", "level": 2}, {"title": "Gradient Episodic Memory for Continual Learning", "url": "https://arxiv.org/abs/1706.08840", "type": "paper", "by": "Lopez-Paz, Ranzato, 2017", "level": 3}, {"title": "Experience Replay for Continual Learning", "url": "https://arxiv.org/abs/1811.11682", "type": "paper", "by": "Rolnick et al., 2019", "level": 3}]}, {"id": "plasticity", "title": "Loss of plasticity", "kind": "paper", "track": "cl", "pre": ["forgetting", "training"], "frontier": true, "core": "A network trained for long on a stream of changing tasks gradually loses the ability to learn new ones, as units die and weights grow. Continual backprop restores it by reinitializing a small fraction of the least useful units, reinjecting the randomness of initialization.", "reach": "A failure separate from forgetting; it matters for test-time training and any model meant to keep learning after deployment.", "resources": [{"title": "Maintaining Plasticity in Deep Continual Learning", "url": "https://www.youtube.com/watch?v=p_zknyfV9fY", "type": "video", "by": "Rich Sutton, CoLLAs 2022", "level": 1, "note": "A talk on this work two years before the Nature paper."}, {"title": "Loss of plasticity in deep continual learning", "url": "https://www.nature.com/articles/s41586-024-07711-7", "type": "paper", "by": "Dohare et al., Nature, 2024", "level": 2}, {"title": "On Warm-Starting Neural Network Training", "url": "https://arxiv.org/abs/1910.08475", "type": "paper", "by": "Ash, Adams, 2020", "level": 2}, {"title": "The Primacy Bias in Deep Reinforcement Learning", "url": "https://arxiv.org/abs/2205.07802", "type": "paper", "by": "Nikishin et al., 2022", "level": 2}, {"title": "Understanding plasticity in neural networks", "url": "https://arxiv.org/abs/2303.01486", "type": "paper", "by": "Lyle et al., DeepMind, 2023", "level": 3}]}, {"id": "lora", "title": "Parameter-efficient fine-tuning and LoRA", "kind": "concept", "track": "cl", "pre": ["attention", "linalg"], "frontier": false, "core": "Freeze the pretrained weights and learn only a low-rank update, W + BA with thin matrices B and A, so fine-tuning trains and stores a tiny fraction of the parameters. The update can be merged into W afterward, adding no inference cost.", "reach": "Makes instruction tuning cheap, enables 4-bit fine-tuning (QLoRA), and gives model merging small task vectors to add.", "resources": [{"title": "Practical Tips for Finetuning LLMs Using LoRA (Low-Rank Adaptation)", "url": "https://magazine.sebastianraschka.com/p/practical-tips-for-finetuning-llms", "type": "blog", "by": "Sebastian Raschka, 2023", "level": 1}, {"title": "LoRA: Low-Rank Adaptation of Large Language Models", "url": "https://arxiv.org/abs/2106.09685", "type": "paper", "by": "Hu et al., Microsoft, 2021", "level": 2}, {"title": "LoRA Learns Less and Forgets Less", "url": "https://arxiv.org/abs/2405.09673", "type": "paper", "by": "Biderman et al., 2024", "level": 2}, {"title": "LoRA Without Regret", "url": "https://thinkingmachines.ai/blog/lora/", "type": "blog", "by": "John Schulman, Thinking Machines, 2025", "level": 2}, {"title": "QLoRA: Efficient Finetuning of Quantized LLMs", "url": "https://arxiv.org/abs/2305.14314", "type": "paper", "by": "Dettmers et al., 2023", "level": 2}]}, {"id": "merging", "title": "Model merging and task arithmetic", "kind": "concept", "track": "cl", "pre": ["lora"], "frontier": true, "core": "Subtracting a base model’s weights from a fine-tuned copy gives a task vector. Adding, scaling, or negating these vectors edits behavior without training, and averaging fine-tunes often keeps each one’s skills, since fine-tunes of one base tend to share a basin of low loss.", "reach": "A cheap alternative to replay for combining skills; LoRA adapters are compact task vectors.", "resources": [{"title": "Merge Large Language Models with mergekit", "url": "https://huggingface.co/blog/mlabonne/merge-models", "type": "blog", "by": "Maxime Labonne, 2024", "level": 1}, {"title": "Editing Models with Task Arithmetic", "url": "https://arxiv.org/abs/2212.04089", "type": "paper", "by": "Ilharco et al., 2023", "level": 2}, {"title": "Model soups: averaging weights of multiple fine-tuned models improves accuracy without increasing inference time", "url": "https://arxiv.org/abs/2203.05482", "type": "paper", "by": "Wortsman et al., 2022", "level": 2}, {"title": "TIES-Merging: Resolving Interference When Merging Models", "url": "https://arxiv.org/abs/2306.01708", "type": "paper", "by": "Yadav et al., 2023", "level": 3}, {"title": "Linear Mode Connectivity and the Lottery Ticket Hypothesis", "url": "https://arxiv.org/abs/1912.05671", "type": "paper", "by": "Frankle et al., 2020", "level": 3}]}, {"id": "ttt", "title": "Test-time training and fast weights", "kind": "concept", "track": "cl", "pre": ["ssm", "icl"], "frontier": true, "core": "Make a layer’s hidden state the weights of a small inner model, updated by one gradient step on a self-supervised loss per token, so the model keeps learning as it reads. Linear attention is the special case where each step is an outer-product write.", "reach": "Joins state-space models to continual learning; Titans and related memories use it for very long contexts.", "resources": [{"title": "Learning to (Learn at Test Time): RNNs with Expressive Hidden States", "url": "https://arxiv.org/abs/2407.04620", "type": "paper", "by": "Sun et al., 2024", "level": 2}, {"title": "Linear Transformers Are Secretly Fast Weight Programmers", "url": "https://arxiv.org/abs/2102.11174", "type": "paper", "by": "Schlag, Irie, Schmidhuber, 2021", "level": 2}, {"title": "Titans: Learning to Memorize at Test Time", "url": "https://arxiv.org/abs/2501.00663", "type": "paper", "by": "Behrouz, Zhong, Mirrokni, Google, 2024", "level": 3}, {"title": "Test-Time Training with Self-Supervision for Generalization under Distribution Shifts", "url": "https://arxiv.org/abs/1909.13231", "type": "paper", "by": "Sun et al., 2020", "level": 2}, {"title": "The Surprising Effectiveness of Test-Time Training for Few-Shot Learning", "url": "https://arxiv.org/abs/2411.07279", "type": "paper", "by": "Akyürek et al., MIT, 2024", "level": 3}]}, {"id": "diffpolicy", "title": "Diffusion Policy", "kind": "paper", "track": "embod", "pre": ["imitation", "ddpm"], "frontier": false, "core": "Represent a robot policy as a conditional diffusion model that denoises a chunk of future actions given recent camera frames. Diffusion keeps multimodal demonstrations intact, such as passing an obstacle on the left or right, where a regression policy would average them into a collision.", "reach": "The action head that VLAs inherit, often as flow matching; it joins imitation learning with DDPM.", "resources": [{"title": "Learning from demonstrations", "url": "https://manipulation.csail.mit.edu/Fall2026/lec/bc_notes.pdf", "type": "notes", "by": "MIT 6.4210 course notes, Fall 2026", "level": 1, "note": "Section 2 builds flow matching and diffusion policies on a two-route example; Section 4.2 covers action chunking."}, {"title": "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion", "url": "https://arxiv.org/abs/2303.04137", "type": "paper", "by": "Chi et al., Columbia, MIT, 2023", "level": 2}, {"title": "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware", "url": "https://arxiv.org/abs/2304.13705", "type": "paper", "by": "Zhao, Kumar, Levine, Finn, 2023", "level": 2, "note": "ALOHA and ACT: action chunking with a transformer and a CVAE, the other common recipe."}, {"title": "diffusion_policy", "url": "https://github.com/real-stanford/diffusion_policy", "type": "code", "by": "Chi et al., 2023", "level": 2, "note": "Reference code with state and vision Colab notebooks on a simulated push task."}]}, {"id": "vla", "title": "Vision-language-action models", "kind": "concept", "track": "embod", "pre": ["diffpolicy", "vlm", "fm"], "frontier": true, "core": "Start from a pretrained vision-language model and fine-tune it on robot demonstrations to output actions, either as discrete tokens (RT-2, OpenVLA) or as continuous action chunks from a flow matching head (pi0). Web pretraining brings semantic knowledge to control; diverse robot data brings generalization.", "reach": "Joins LLM pretraining, flow matching and Diffusion Policy; world models offer a way to evaluate and train them.", "resources": [{"title": "Our First Generalist Policy", "url": "https://www.physicalintelligence.company/blog/pi0", "type": "blog", "by": "Physical Intelligence, 2024", "level": 1, "note": "The pi0 announcement: a VLM backbone with a flow matching action expert, and what it can do."}, {"title": "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", "url": "https://arxiv.org/abs/2307.15818", "type": "paper", "by": "Brohan et al., Google DeepMind, 2023", "level": 2, "note": "The original move: write actions as text tokens and co-train with web data."}, {"title": "π0: A Vision-Language-Action Flow Model for General Robot Control", "url": "https://arxiv.org/abs/2410.24164", "type": "paper", "by": "Black et al., Physical Intelligence, 2024", "level": 2}, {"title": "OpenVLA: An Open-Source Vision-Language-Action Model", "url": "https://arxiv.org/abs/2406.09246", "type": "paper", "by": "Kim et al., Stanford, Berkeley, 2024", "level": 2, "note": "An open 7B model and fine-tuning recipe trained on Open X-Embodiment data."}, {"title": "π0.5: a Vision-Language-Action Model with Open-World Generalization", "url": "https://arxiv.org/abs/2504.16054", "type": "paper", "by": "Physical Intelligence, 2025", "level": 3, "note": "Co-training on web data, many robots and subtask prediction to work in homes it has never seen."}]}, {"id": "worldmodels", "title": "World models for agents and video", "kind": "concept", "track": "embod", "pre": ["dreamer", "jepa", "videogen"], "frontier": true, "core": "A world model predicts the next observation from the current one and an action. Video models trained on huge amounts of footage (Genie, Cosmos) become interactive simulators, while V-JEPA 2 predicts in a learned embedding space instead of pixels and plans robot actions there.", "reach": "Extends Dreamer from one environment to open-ended video, built from latent diffusion and joint-embedding prediction.", "resources": [{"title": "Genie 3: A new frontier for world models", "url": "https://deepmind.google/discover/blog/genie-3-a-new-frontier-for-world-models/", "type": "blog", "by": "Google DeepMind, 2025", "level": 1, "note": "What a real-time interactive video world model looks like now."}, {"title": "Genie: Generative Interactive Environments", "url": "https://arxiv.org/abs/2402.15391", "type": "paper", "by": "Bruce et al., Google DeepMind, 2024", "level": 2, "note": "Learns a latent action space from unlabeled internet video, so any clip becomes a playable environment."}, {"title": "V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning", "url": "https://arxiv.org/abs/2506.09985", "type": "paper", "by": "Assran et al., Meta, 2025", "level": 2, "note": "Predicts in embedding space, then after post-training on under 62 hours of unlabeled robot video, plans arm motions toward image goals with no task reward."}, {"title": "Cosmos World Foundation Model Platform for Physical AI", "url": "https://arxiv.org/abs/2501.03575", "type": "paper", "by": "NVIDIA, 2025", "level": 3, "note": "Open-weight video world models, tokenizers and the data pipeline behind them."}, {"title": "Diffusion for World Modeling: Visual Details Matter in Atari", "url": "https://arxiv.org/abs/2405.12399", "type": "paper", "by": "Alonso et al., 2024", "level": 3, "note": "DIAMOND: a diffusion world model good enough to train an Atari agent entirely inside it."}]}, {"id": "vit", "title": "Vision transformers", "kind": "concept", "track": "vision", "pre": ["attention", "resnets"], "frontier": false, "core": "Cut an image into 16 by 16 pixel patches, embed each patch as a token, add position embeddings, and run a standard transformer over the sequence. With little built-in image bias, a ViT needs more data than a CNN but keeps improving with scale.", "reach": "The backbone of CLIP, DINOv2, Segment Anything, vision-language models, VGGT, and diffusion transformers.", "resources": [{"title": "Dive into Deep Learning, 11.8: Transformers for Vision", "url": "https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html", "type": "tutorial", "by": "Zhang, Lipton, Li, Smola, 2023", "level": 1, "note": "Builds patch embedding and a ViT in code and trains it on Fashion-MNIST."}, {"title": "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale", "url": "https://arxiv.org/abs/2010.11929", "type": "paper", "by": "Dosovitskiy et al., Google, 2020", "level": 2}, {"title": "Masked Autoencoders Are Scalable Vision Learners", "url": "https://arxiv.org/abs/2111.06377", "type": "paper", "by": "He, Chen, Xie, Li, Dollár, Girshick, 2021", "level": 2, "note": "Hide 75 percent of the patches and reconstruct them: self-supervised pretraining for ViTs."}, {"title": "DINOv2: Learning Robust Visual Features without Supervision", "url": "https://arxiv.org/abs/2304.07193", "type": "paper", "by": "Oquab et al., Meta, 2023", "level": 3}, {"title": "Training data-efficient image transformers & distillation through attention", "url": "https://arxiv.org/abs/2012.12877", "type": "paper", "by": "Touvron et al., Meta, 2020", "level": 3, "note": "How to train a ViT on ImageNet alone, without a huge private dataset."}]}, {"id": "detection", "title": "Object detection and segmentation", "kind": "concept", "track": "vision", "pre": ["resnets"], "frontier": false, "core": "Detection outputs a box and class for each object; segmentation labels pixels, by class or by object. Two-stage detectors propose regions and classify each (Mask R-CNN adds a mask), while DETR predicts a fixed set of boxes matched one to one with the ground truth.", "reach": "Region features, mask heads, and set matching return in Segment Anything, open-vocabulary detectors, and the grounding skills of vision-language models.", "resources": [{"title": "Stanford CS231N Deep Learning for Computer Vision, 2025", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rOmsNzYBMe0gJY2XS8AQg16", "type": "lectures", "by": "Stanford, 2025", "level": 1, "note": "Lecture 9: single-stage and two-stage detectors, and semantic, instance, and panoptic segmentation."}, {"title": "Mask R-CNN", "url": "https://arxiv.org/abs/1703.06870", "type": "paper", "by": "He, Gkioxari, Dollár, Girshick, 2017", "level": 2}, {"title": "End-to-End Object Detection with Transformers", "url": "https://arxiv.org/abs/2005.12872", "type": "paper", "by": "Carion et al., Facebook AI, 2020", "level": 2, "note": "DETR: detection as set prediction with a Hungarian matching loss, no anchors or non-maximum suppression."}, {"title": "U-Net: Convolutional Networks for Biomedical Image Segmentation", "url": "https://arxiv.org/abs/1505.04597", "type": "paper", "by": "Ronneberger, Fischer, Brox, 2015", "level": 2, "note": "The encoder-decoder with skip connections that diffusion models later adopted as their denoiser."}, {"title": "Grounding DINO: Marrying DINO with Grounded Pre-Training for Open-Set Object Detection", "url": "https://arxiv.org/abs/2303.05499", "type": "paper", "by": "Liu et al., 2023", "level": 3, "note": "Detect whatever a text prompt names, not a fixed list of classes."}]}, {"id": "sam", "title": "Segment Anything", "kind": "paper", "track": "vision", "pre": ["vit", "detection"], "frontier": false, "core": "Segment whatever a prompt points at: given an image and a click, box, or rough mask, return that object’s mask. A heavy ViT encodes the image once, a light decoder answers each prompt in milliseconds, and the model helped label its 1.1 billion training masks.", "reach": "SAM 2 adds memory for video and SAM 3 takes text prompts; its masks feed 3D reconstruction, robotics, and labeling pipelines.", "resources": [{"title": "Introducing Segment Anything: Working toward the first foundation model for image segmentation", "url": "https://ai.meta.com/blog/segment-anything-foundation-model-image-segmentation/", "type": "blog", "by": "Meta AI, 2023", "level": 1}, {"title": "Segment Anything", "url": "https://arxiv.org/abs/2304.02643", "type": "paper", "by": "Kirillov et al., Meta, 2023", "level": 2}, {"title": "SAM 2: Segment Anything in Images and Videos", "url": "https://arxiv.org/abs/2408.00714", "type": "paper", "by": "Ravi et al., Meta, 2024", "level": 2, "note": "A streaming memory lets one model segment and track objects through video."}, {"title": "SAM 3: Segment Anything with Concepts", "url": "https://arxiv.org/abs/2511.16719", "type": "paper", "by": "Carion et al., Meta, 2025", "level": 3, "note": "Prompt with a noun phrase or an example and get every matching instance."}, {"title": "facebookresearch/sam2", "url": "https://github.com/facebookresearch/sam2", "type": "code", "by": "Meta, 2024", "level": 2}]}, {"id": "geometry3d", "title": "Multi-view geometry and 3D vision", "kind": "concept", "track": "vision", "pre": ["linalg", "optim"], "frontier": false, "core": "A pinhole camera maps a 3D point to a pixel with a 3 by 4 projection matrix. A pixel’s match in a second image must lie on a known line (epipolar geometry), and structure from motion recovers all cameras and points by minimizing reprojection error.", "reach": "NeRF and Gaussian splatting start from the cameras that structure from motion (COLMAP) estimates; DUSt3R and VGGT learn to replace it.", "resources": [{"title": "Camera Calibration | Uncalibrated Stereo", "url": "https://www.youtube.com/playlist?list=PL2zRqk16wsdoCCLpou-dGo7QQNks1Ppzo", "type": "lectures", "by": "Shree Nayar, Columbia, First Principles of Computer Vision", "level": 1}, {"title": "Foundations of Computer Vision", "url": "https://visionbook.mit.edu/", "type": "book", "by": "Torralba, Isola, Freeman, MIT Press, 2024", "level": 1, "note": "Chapters 39, 40, and 44: camera calibration, stereo, and multiview geometry with structure from motion."}, {"title": "Structure-from-Motion Revisited", "url": "https://openaccess.thecvf.com/content_cvpr_2016/html/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.html", "type": "paper", "by": "Schönberger, Frahm, CVPR 2016", "level": 2, "note": "The incremental pipeline inside COLMAP, the tool most 3D papers use for cameras."}, {"title": "Computer Vision: Algorithms and Applications, 2nd ed.", "url": "https://szeliski.org/Book/", "type": "book", "by": "Richard Szeliski, 2022", "level": 2, "note": "The chapters on structure from motion and SLAM, and on depth estimation. Free PDF after a short form."}, {"title": "Multiple View Geometry in Computer Vision", "url": "https://www.robots.ox.ac.uk/~vgg/hzbook/", "type": "book", "by": "Hartley, Zisserman, 2nd ed., 2004", "level": 3, "paid": true}]}, {"id": "vlm", "title": "Vision-language models", "kind": "concept", "track": "vision", "pre": ["vit", "contrastive", "sft", "crossattn"], "frontier": false, "core": "Turn an image into tokens an LLM can read. A pretrained vision encoder such as CLIP embeds image patches, a small projector maps them into the LLM’s embedding space, and training on captions and then visual instructions teaches the LLM to answer questions about images.", "reach": "The starting point for robot policies (VLAs), document and screen agents, and judges of generated images and video.", "resources": [{"title": "Understanding Multimodal LLMs", "url": "https://magazine.sebastianraschka.com/p/understanding-multimodal-llms", "type": "blog", "by": "Sebastian Raschka, 2024", "level": 1, "note": "Image tokens fed into the decoder versus cross-attention, then a tour of recent models."}, {"title": "Visual Instruction Tuning", "url": "https://arxiv.org/abs/2304.08485", "type": "paper", "by": "Liu, Li, Wu, Lee, 2023", "level": 2, "note": "LLaVA: a CLIP encoder, one projection, and GPT-written visual instructions."}, {"title": "huggingface/nanoVLM", "url": "https://github.com/huggingface/nanoVLM", "type": "code", "by": "Hugging Face, 2025", "level": 2, "note": "A whole VLM in about 750 lines of PyTorch, trainable on one GPU."}, {"title": "What matters when building vision-language models?", "url": "https://arxiv.org/abs/2405.02246", "type": "paper", "by": "Laurençon, Tronchon, Cord, Sanh, 2024", "level": 3, "note": "Controlled ablations of encoder, connector, and data choices."}, {"title": "Flamingo: a Visual Language Model for Few-Shot Learning", "url": "https://arxiv.org/abs/2204.14198", "type": "paper", "by": "Alayrac et al., DeepMind, 2022", "level": 3, "note": "The cross-attention design, trained on interleaved web images and text."}]}, {"id": "rendering", "title": "Rendering and differentiable rendering", "kind": "concept", "track": "graphics", "pre": ["calculus", "montecarlo"], "frontier": false, "core": "A pixel’s color is the light arriving along its camera ray, and the rendering equation defines that light recursively through every reflection; path tracing estimates it by Monte Carlo. A differentiable renderer also returns gradients of pixels with respect to geometry, materials, lights, and cameras.", "reach": "NeRF and Gaussian splatting are differentiable renderers of learned scenes; neural denoisers and DLSS clean up Monte Carlo noise in real time.", "resources": [{"title": "Scratchapixel", "url": "https://www.scratchapixel.com/", "type": "tutorial", "by": "Scratchapixel", "level": 1, "note": "The Foundations of 3D Rendering lessons, from the ray-tracing primer to Global Illumination and Path Tracing."}, {"title": "Physically Based Rendering: From Theory to Implementation", "url": "https://pbr-book.org/", "type": "book", "by": "Pharr, Jakob, Humphreys, 4th ed., 2023", "level": 2, "note": "Chapters 2, 4, and 13: Monte Carlo integration, radiometry, and the light transport equation with path tracing."}, {"title": "Differentiable Rendering: A Survey", "url": "https://arxiv.org/abs/2006.12057", "type": "paper", "by": "Kato et al., 2020", "level": 2}, {"title": "Mitsuba 3: Inverse rendering tutorials", "url": "https://mitsuba.readthedocs.io/en/stable/src/inverse_rendering_tutorials.html", "type": "tutorial", "by": "Jakob et al., EPFL, 2022", "level": 2, "note": "Start with Gradient-based optimization, then Radiance Field Reconstruction (NeRF-like)."}, {"title": "Physics-Based Differentiable Rendering: A Comprehensive Introduction", "url": "https://courses.shuangz.com/pbdr-course-sg20/", "type": "course", "by": "Zhao, Jakob, Li, SIGGRAPH 2020", "level": 3, "note": "Why visibility makes pixel gradients hard and how edge and boundary terms fix them."}]}, {"id": "neuralfields", "title": "Neural fields and implicit surfaces", "kind": "concept", "track": "graphics", "pre": ["backprop", "rendering"], "frontier": false, "core": "Represent a signal as a network from coordinates to values, such as (x, y) to color or (x, y, z) to signed distance from a surface. Plain MLPs blur fine detail, so coordinates first pass through Fourier features, sine activations, or learned hash grids.", "reach": "NeRF is a neural field rendered by volume rendering; the same coordinate networks appear in physics-informed networks and neural operators.", "resources": [{"title": "Stanford CS231N Deep Learning for Computer Vision, 2025", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rOmsNzYBMe0gJY2XS8AQg16", "type": "lectures", "by": "Stanford, 2025", "level": 1, "note": "Lecture 15: 3D shape representations, shape reconstruction, and neural implicit representations."}, {"title": "Fourier Features Let Networks Learn High Frequency Functions in Low Dimensional Domains", "url": "https://arxiv.org/abs/2006.10739", "type": "paper", "by": "Tancik et al., 2020", "level": 2, "note": "Why coordinate MLPs blur, and the random Fourier feature fix."}, {"title": "DeepSDF: Learning Continuous Signed Distance Functions for Shape Representation", "url": "https://arxiv.org/abs/1901.05103", "type": "paper", "by": "Park et al., 2019", "level": 2}, {"title": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "url": "https://arxiv.org/abs/2201.05989", "type": "paper", "by": "Müller, Evans, Schied, Keller, NVIDIA, 2022", "level": 2, "note": "Learned multiresolution hash grids cut training to seconds."}, {"title": "Implicit Neural Representations with Periodic Activation Functions", "url": "https://arxiv.org/abs/2006.09661", "type": "paper", "by": "Sitzmann, Martel, Bergman, Lindell, Wetzstein, 2020", "level": 3, "note": "SIREN: sine activations give fields with clean derivatives, so a loss can act on gradients."}, {"title": "Neural Fields in Visual Computing and Beyond", "url": "https://arxiv.org/abs/2111.11426", "type": "paper", "by": "Xie et al., 2021", "level": 3, "note": "Part I sorts the design space: representations, architectures, forward maps, and generalization."}]}, {"id": "nerf", "title": "Neural radiance fields", "kind": "paper", "track": "graphics", "pre": ["neuralfields", "geometry3d"], "frontier": false, "core": "A scene is a network mapping a 3D point and view direction to density and color. A pixel is the sum of colors along its ray, weighted by density and by how much light the nearer points let through; fit the network to posed photos.", "reach": "Gaussian splatting keeps its rendering model and drops the network; DreamFusion optimizes a NeRF under a diffusion prior.", "resources": [{"title": "Jon Barron - Understanding and Extending Neural Radiance Fields", "url": "https://www.youtube.com/watch?v=HfJpQCBTqZs", "type": "video", "by": "Jon Barron, MIT Vision and Graphics Seminar, 2021", "level": 1}, {"title": "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis", "url": "https://arxiv.org/abs/2003.08934", "type": "paper", "by": "Mildenhall, Srinivasan, Tancik, Barron, Ramamoorthi, Ng, 2020", "level": 2}, {"title": "Volume Rendering Digest (for NeRF)", "url": "https://arxiv.org/abs/2209.02417", "type": "notes", "by": "Tagliasacchi, Mildenhall, 2022", "level": 2, "note": "The volume rendering integral and its discrete form, derived in NeRF’s notation in a few pages."}, {"title": "nerfstudio-project/nerfstudio", "url": "https://github.com/nerfstudio-project/nerfstudio", "type": "code", "by": "Tancik et al., 2023", "level": 2}, {"title": "Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields", "url": "https://arxiv.org/abs/2111.12077", "type": "paper", "by": "Barron, Mildenhall, Verbin, Srinivasan, Hedman, 2022", "level": 3, "note": "Extends NeRF to unbounded real scenes with a nonlinear scene parameterization, online distillation, and a distortion loss."}]}, {"id": "gsplat", "title": "3D Gaussian splatting", "kind": "paper", "track": "graphics", "pre": ["nerf"], "frontier": false, "core": "Represent a scene as millions of 3D Gaussians, each with a position, shape, opacity, and view-dependent color. Render by projecting them onto the image and blending them front to back, and fit them to photos by gradient descent, splitting and pruning as training goes.", "reach": "Rasterizing instead of marching rays trains in minutes and renders in real time; feed-forward models such as pixelSplat now predict the Gaussians directly.", "resources": [{"title": "Introduction to 3D Gaussian Splatting", "url": "https://huggingface.co/blog/gaussian-splatting", "type": "blog", "by": "Dylan Ebert, Hugging Face, 2023", "level": 1}, {"title": "3D Gaussian Splatting for Real-Time Radiance Field Rendering", "url": "https://arxiv.org/abs/2308.04079", "type": "paper", "by": "Kerbl, Kopanas, Leimkühler, Drettakis, 2023", "level": 2}, {"title": "Mathematical Supplement for the gsplat Library", "url": "https://arxiv.org/abs/2312.02121", "type": "notes", "by": "Ye, Kanazawa, 2023", "level": 2, "note": "The forward and backward passes of differentiable Gaussian splatting, written out in full."}, {"title": "nerfstudio-project/gsplat", "url": "https://github.com/nerfstudio-project/gsplat", "type": "code", "by": "Ye et al., 2024", "level": 2}, {"title": "2D Gaussian Splatting for Geometrically Accurate Radiance Fields", "url": "https://arxiv.org/abs/2403.17888", "type": "paper", "by": "Huang, Yu, Chen, Geiger, Gao, 2024", "level": 3, "note": "Flat disks instead of blobs, so the splats recover surfaces."}]}, {"id": "sds", "title": "Score distillation and text-to-3D", "kind": "paper", "track": "graphics", "pre": ["nerf", "guidance"], "frontier": true, "core": "Use a pretrained image diffusion model, conditioned on a text prompt, as a critic for a 3D scene. Render from a random camera, add noise, and nudge the render toward the denoiser’s prediction; over many views, gradients through the renderer shape a consistent 3D object.", "reach": "Variational score distillation and multi-view diffusion fix its oversaturated colors and repeated faces; feed-forward 3D generators now often replace the slow per-prompt optimization.", "resources": [{"title": "DreamFusion: Text-to-3D using 2D Diffusion", "url": "https://dreamfusion3d.github.io/", "type": "blog", "by": "Poole, Jain, Barron, Mildenhall, Google, 2022", "level": 1}, {"title": "DreamFusion: Text-to-3D using 2D Diffusion", "url": "https://arxiv.org/abs/2209.14988", "type": "paper", "by": "Poole, Jain, Barron, Mildenhall, 2022", "level": 2}, {"title": "threestudio-project/threestudio", "url": "https://github.com/threestudio-project/threestudio", "type": "code", "by": "Guo et al., 2023", "level": 2, "note": "DreamFusion, ProlificDreamer, MVDream, and other score distillation methods in one framework."}, {"title": "ProlificDreamer: High-Fidelity and Diverse Text-to-3D Generation with Variational Score Distillation", "url": "https://arxiv.org/abs/2305.16213", "type": "paper", "by": "Wang et al., 2023", "level": 3}, {"title": "MVDream: Multi-view Diffusion for 3D Generation", "url": "https://arxiv.org/abs/2308.16512", "type": "paper", "by": "Shi et al., 2023", "level": 3}]}, {"id": "recon3d", "title": "Feed-forward 3D reconstruction", "kind": "concept", "track": "graphics", "pre": ["geometry3d", "vit"], "frontier": true, "core": "Skip per-scene optimization: a transformer reads unposed images and outputs, for every pixel, its 3D point in a shared frame, from which cameras and depth follow. DUSt3R does this for image pairs; VGGT takes one to hundreds of views in one forward pass.", "reach": "Replaces COLMAP as the first stage of NeRF and Gaussian splatting pipelines, and gives robots and video models fast 3D.", "resources": [{"title": "DUSt3R: Geometric 3D Vision Made Easy", "url": "https://arxiv.org/abs/2312.14132", "type": "paper", "by": "Wang, Leroy, Cabon, Chidlovskii, Revaud, 2023", "level": 2}, {"title": "VGGT: Visual Geometry Grounded Transformer", "url": "https://arxiv.org/abs/2503.11651", "type": "paper", "by": "Wang, Chen, Karaev, Vedaldi, Rupprecht, Novotny, 2025", "level": 2}, {"title": "facebookresearch/vggt", "url": "https://github.com/facebookresearch/vggt", "type": "code", "by": "Oxford VGG and Meta, 2025", "level": 1, "note": "Run it on your own photos and inspect the cameras and point cloud."}, {"title": "LRM: Large Reconstruction Model for Single Image to 3D", "url": "https://arxiv.org/abs/2311.04400", "type": "paper", "by": "Hong et al., 2023", "level": 3, "note": "One image in, a radiance field out in five seconds, from a transformer trained on about a million objects."}, {"title": "pixelSplat: 3D Gaussian Splats from Image Pairs for Scalable Generalizable 3D Reconstruction", "url": "https://arxiv.org/abs/2312.12337", "type": "paper", "by": "Charatan, Li, Tagliasacchi, Sitzmann, 2023", "level": 3}]}, {"id": "videogen", "title": "Video generation", "kind": "concept", "track": "graphics", "pre": ["latent", "fm"], "frontier": true, "core": "Compress video into a grid of spacetime latent patches with a video autoencoder, then train a diffusion or flow matching transformer to denoise all patches together, conditioned on text. Attention across frames keeps motion consistent; data curation and scale do most of the rest.", "reach": "Made interactive, video generators become world models such as Genie and Cosmos; autoregressive few-step variants stream video in real time.", "resources": [{"title": "Diffusion Models
