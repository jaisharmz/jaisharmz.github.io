<!doctype html>
<html lang="en">
<head>

<meta name="description" content="A prerequisite graph of machine learning research, from linear algebra to flow maps, diffusion language models, RL, graphics, biology and safety, with verified resources for every idea.">
<style>
/* Layout: a compact header, then the map fills the viewport; a panel slides in from the right
   (a bottom sheet on phones). Colors: the site's paper and ink, plus six track families. */
:root {
  color-scheme: light;
  --paper: #ffffff; --sunk: #f6f5f2; --card: #ffffff;
  --ink: #1b1b1d; --ink-2: #4a4a50; --muted: #70707a; --rule: #e4e3de; --rule-soft: #efeeea;
  --accent: #1a4f8c; --accent-soft: #e6eef8;
  --edge: #b9b8b2; --edge-x: #d8d7d2;
  --f-0: #8a8983; --f-1: #2a78d6; --f-2: #eb6834; --f-3: #1baf7a;
  --f-4: #eda100; --f-5: #e87ba4; --f-6: #008300; --f-7: #6250d6; --f-8: #e34948;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: "Iowan Old Style", Charter, "Palatino Linotype", Palatino, Georgia, serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #16161a; --sunk: #1c1c21; --card: #212127;
    --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
    --accent: #7fb2e3; --accent-soft: #1d2b3b;
    --edge: #5d5d66; --edge-x: #3d3d45;
    --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
    --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #16161a; --sunk: #1c1c21; --card: #212127;
  --ink: #e8e7e3; --ink-2: #c7c6c1; --muted: #93929b; --rule: #34343b; --rule-soft: #2a2a30;
  --accent: #7fb2e3; --accent-soft: #1d2b3b;
  --edge: #5d5d66; --edge-x: #3d3d45;
  --f-0: #9a9992; --f-1: #3987e5; --f-2: #d95926; --f-3: #199e70;
  --f-4: #c98500; --f-5: #d55181; --f-6: #008300; --f-7: #9085e9; --f-8: #e66767;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px;
  -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }

/* header */
header { flex: none; border-bottom: 1px solid var(--rule); padding-block: .7rem .6rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .5rem 1.2rem; align-items: end; }
.crumb { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 .25rem; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--accent); }
h1 { font-family: var(--serif); font-weight: 600; font-size: clamp(1.25rem, 2.6vw, 1.7rem); line-height: 1.15; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.lede { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; margin: .3rem 0 0; max-width: 62rem; }
.tools { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.search { position: relative; }
.search input { width: 15rem; max-width: 100%; font: .9rem var(--sans); color: var(--ink); background: var(--sunk); border: 1px solid var(--rule);
  border-radius: 8px; padding: .45rem .7rem; }
.results { position: absolute; right: 0; top: calc(100% + 4px); width: min(24rem, 86vw); max-height: 60vh; overflow: auto; z-index: 40;
  background: var(--card); border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 10px 30px rgb(0 0 0 / .14); padding: .3rem; }
.results button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 6px; padding: .45rem .55rem; cursor: pointer; }
.results button:hover, .results button[aria-selected="true"] { background: var(--sunk); }
.results .rt { font-weight: 600; font-size: .88rem; }
.results .rm { font-size: .76rem; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: .42rem .75rem; font-size: .85rem; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.totals { font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.legend { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: .3rem .35rem; }
.chip { display: inline-flex; align-items: center; gap: .35rem; font-size: .76rem; color: var(--ink-2); background: none;
  border: 1px solid var(--rule); border-radius: 999px; padding: .18rem .55rem; cursor: pointer; white-space: nowrap; }
.chip:hover { border-color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }

/* map */
main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--sunk); touch-action: none; cursor: grab; }
main.dragging { cursor: grabbing; }

.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; z-index: 1; }
.e { fill: none; stroke: var(--edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.e.x { stroke: var(--edge-x); stroke-width: 1.2; display: none; }

.e.hot { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
.e.dim { opacity: .18; }
.track { position: absolute; z-index: 0; border: 1px solid var(--rule); border-radius: 14px; background: var(--paper); }
.track .tl { position: absolute; left: 14px; top: 9px; display: flex; gap: .45rem; align-items: center;
  font-family: var(--mono); font-size: clamp(11px, calc(9px * var(--inv, 1)), 17px); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap;
  max-width: calc(100% - 28px); overflow: hidden; text-overflow: ellipsis; }
.track .tl .dot { width: 8px; height: 8px; }
.node { position: absolute; z-index: 2; display: flex; flex-direction: column; text-align: left; background: var(--card); border: 1px solid var(--rule);
  border-top: 3px solid var(--c); border-radius: 8px; padding: 5px 8px 6px; cursor: pointer; overflow: hidden;
  box-shadow: 0 1px 2px rgb(0 0 0 / .05); transition: opacity .15s, box-shadow .15s, border-color .15s; }
.node:hover { box-shadow: 0 3px 10px rgb(0 0 0 / .12); border-color: var(--muted); border-top-color: var(--c); }
.node .k { display: flex; justify-content: space-between; gap: 4px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); line-height: 1.3; }
.node .k .fr { color: var(--ink-2); }
.node .t { font-size: 12.5px; font-weight: 600; line-height: 1.22; color: var(--ink); margin-top: 1px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.node .p { margin-top: auto; height: 3px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.node .p i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 2px; }
.node.done { background: color-mix(in srgb, var(--c) 9%, var(--card)); }
.node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); border-top-color: var(--c); }
.node.anc { border-color: var(--accent); }
.node.dim { opacity: .3; }
.node.hit { box-shadow: 0 0 0 3px var(--accent); }
.zoom { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.zoom button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--rule); background: var(--card); cursor: pointer; font-size: 1.05rem; line-height: 1; }
.zoom button.w { width: auto; padding: 0 .55rem; font-size: .75rem; }
.zoom button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); width: 180px; z-index: 5;
  background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 6px; cursor: pointer; }
.mini svg { display: block; width: 100%; height: auto; }
.mini .vp { fill: var(--accent); fill-opacity: .08; stroke: var(--accent); stroke-width: 18; }
.hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 4; font-size: .76rem; color: var(--muted);
  background: var(--card); border: 1px solid var(--rule); border-radius: 999px; padding: .25rem .75rem; white-space: nowrap; }

/* track map */
.tview { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--sunk); }
.tview[hidden] { display: none !important; }
.tscroll { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 12px; }
.tsize { margin: auto; position: relative; flex: none; }
.tworld { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tworld svg.edges { z-index: 1; }
.te { fill: none; stroke: var(--edge); vector-effect: non-scaling-stroke; }
.te.hot { stroke: var(--accent); }
.te.dim { opacity: .2; }
.tnode { position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--card);
  border: 1px solid var(--rule); border-top: 4px solid var(--c); border-radius: 10px; padding: 9px 12px 7px; cursor: pointer;
  box-shadow: 0 1px 3px rgb(0 0 0 / .06); transition: opacity .15s, box-shadow .15s; overflow: hidden; }
.tnode:hover { box-shadow: 0 4px 14px rgb(0 0 0 / .13); border-color: var(--muted); border-top-color: var(--c); }
.tnode .tk { display: flex; align-items: center; gap: .4rem; font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tnode .tt { font-family: var(--serif); font-size: 17px; font-weight: 600; line-height: 1.15; color: var(--ink); }
.tnode .tc { font-family: var(--serif); font-size: 12.5px; line-height: 1.32; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tnode .tf { margin-top: auto; display: flex; align-items: center; gap: .5rem; flex: none; }
.tnode .p { flex: 1; height: 4px; border-radius: 2px; background: var(--rule-soft); overflow: hidden; }
.tnode .tpj { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); white-space: nowrap; line-height: 1; }
.tnode .p i { display: block; height: 100%; width: 0; background: var(--c); }
.tnode.sel { box-shadow: 0 0 0 2px var(--accent); }
.tnode.anc { border-color: var(--accent); border-top-color: var(--c); }
.tnode.dim { opacity: .32; }
.thint { flex: none; margin: 0; padding: .5rem 16px .7rem; text-align: center; font-size: .8rem; color: var(--muted); }
.narrow .tnode { padding: 7px 9px 8px; }
.narrow .tnode .tt { font-size: 14.5px; }
.narrow .tnode .tc { font-size: 11.5px; -webkit-line-clamp: 2; }
.primary { display: inline-flex; align-items: center; gap: .4rem; margin: .2rem 0 .2rem; font-size: .86rem; font-weight: 600; color: var(--paper);
  background: var(--ink); border: 0; border-radius: 8px; padding: .5rem .85rem; cursor: pointer; }
.tlinks { font-size: .86rem; color: var(--ink-2); line-height: 1.5; margin: 0; }
.ideas { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.ideas li button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .1rem .8rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .55rem .1rem; cursor: pointer; }
.ideas li button:hover { background: var(--sunk); }
.ideas .it { font-weight: 600; font-size: .9rem; }
.ideas .ik { font-family: var(--mono); font-size: .64rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .35rem; font-weight: 400; }
.ideas .ip { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* list */
.list { flex: 1; min-height: 0; overflow: auto; background: var(--paper); }
.list[hidden] { display: none !important; }
.list .in { max-width: 54rem; margin: 0 auto; padding-block: 1.2rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.list h2 { display: flex; gap: .5rem; align-items: center; font-family: var(--mono); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; margin: 2rem 0 .4rem; padding-bottom: .45rem; border-bottom: 1px solid var(--rule); }
.list h2:first-child { margin-top: .4rem; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; width: 100%; text-align: left; background: none; border: 0;
  border-bottom: 1px solid var(--rule-soft); padding: .75rem .2rem; cursor: pointer; }
.row:hover { background: var(--sunk); }
.row .rt { font-weight: 600; font-size: .98rem; }
.row .rk { font-family: var(--mono); font-size: .66rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-left: .4rem; font-weight: 400; }
.row .rc { grid-column: 1; font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.45; }
.row .rp { grid-row: 1; grid-column: 2; font-family: var(--mono); font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* panel */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .25); z-index: 49; }
.scrim[hidden] { display: none !important; }
aside { position: fixed; top: 0; right: 0; bottom: 0; width: min(31rem, 100%); z-index: 50; background: var(--card);
  border-left: 1px solid var(--rule); box-shadow: -12px 0 40px rgb(0 0 0 / .12); overflow: auto; overscroll-behavior: contain;
  padding-block: calc(1.1rem + env(safe-area-inset-top, 0px)) calc(2.5rem + env(safe-area-inset-bottom, 0px));
  padding-left: 1.4rem; padding-right: max(1.4rem, env(safe-area-inset-right, 0px)); }
aside[hidden] { display: none !important; }
.close { position: sticky; top: 0; float: right; width: 32px; height: 32px; margin: -.2rem -.4rem 0 0; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--card); cursor: pointer; font-size: 1.1rem; line-height: 1; z-index: 2; }
.pk { display: flex; flex-wrap: wrap; gap: .35rem .6rem; align-items: center; font-family: var(--mono); font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.badge { border: 1px solid var(--rule); border-radius: 4px; padding: .05rem .35rem; color: var(--ink-2); }

.prog { display: flex; align-items: center; gap: .6rem; font-family: var(--mono); font-size: .76rem; color: var(--muted); margin-bottom: 1rem; font-variant-numeric: tabular-nums; }

.prog .bar i { display: block; height: 100%; background: var(--c); }
.core { font-family: var(--serif); font-size: 1.12rem; line-height: 1.5; margin: 0 0 .6rem; }
.reach { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: 0 0 1.1rem; }
.uses, .worth { font-family: var(--serif); font-size: 1rem; line-height: 1.5; margin: 0 0 .45rem; }
.uses b, .worth b { font-family: var(--mono); font-weight: 500; font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: .35rem; }
.worth { margin-bottom: 1rem; }
.row .ru { grid-column: 1 / -1; font-family: var(--serif); font-size: .9rem; color: var(--ink-2); line-height: 1.4; }
.sec { font-family: var(--mono); font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1.3rem 0 .5rem; }
.links { display: flex; flex-wrap: wrap; gap: .35rem; }
.links button { display: inline-flex; align-items: center; gap: .35rem; font-size: .8rem; background: var(--sunk); border: 1px solid var(--rule); border-radius: 6px; padding: .25rem .5rem; cursor: pointer; text-align: left; }
.links button:hover { border-color: var(--muted); }

.path { font-size: .8rem; color: var(--muted); margin: .45rem 0 0; }
.res { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }

.res .rb { font-size: .78rem; color: var(--muted); margin-top: .15rem; }

.lv { align-self: start; font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; text-transform: uppercase; border-radius: 4px; padding: .12rem .4rem; white-space: nowrap; }
.lv1 { color: var(--accent); background: var(--accent-soft); }
.lv2 { color: var(--ink-2); background: var(--rule-soft); }
.lv3 { color: var(--paper); background: var(--ink-2); }
.foot { font-size: .8rem; color: var(--muted); margin-top: 1.4rem; line-height: 1.5; }
/* projects: a resource row with a label line and what you build and learn */
.res .pt { font-family: var(--mono); font-size: .64rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: .2rem; }
.res .pb { font-family: var(--serif); font-size: .92rem; color: var(--ink-2); line-height: 1.42; margin: .25rem 0 0; }
.res .pb b { font-family: var(--mono); font-weight: 500; font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-right: .4rem; }
.res li.proj { background: linear-gradient(90deg, var(--accent-soft), transparent 70%); border-radius: 6px; padding-left: .45rem; padding-right: .2rem; }
.res .ichip { margin-top: .45rem; }
.row .rk.pj { color: var(--accent); }
.pintro { font-family: var(--serif); color: var(--ink-2); font-size: .98rem; line-height: 1.5; margin: .4rem 0 0; max-width: 46rem; }
.about { font-family: var(--serif); color: var(--ink-2); font-size: .95rem; line-height: 1.55; }
.about p { margin: 0 0 .7rem; }

@media (max-width: 720px) {
  header { grid-template-columns: minmax(0, 1fr); }
  .tools { justify-content: flex-start; }
  .search { flex: 1 1 10rem; }
  .search input { width: 100%; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
const DATA = {"tracks": [{"id": "found", "label": "Math foundations", "family": 0, "core": "The math every other track borrows: linear algebra, probability, optimization, stochastic processes, and control."}, {"id": "dl", "label": "Deep learning", "family": 1, "core": "Train neural networks by gradient descent, and understand what they learn and why they generalize."}, {"id": "llm", "label": "Transformers and LLMs", "family": 1, "core": "The transformer, next-token prediction, and what scale, in-context learning, and test-time compute add."}, {"id": "sys", "label": "Systems and scale", "family": 1, "core": "Make models fast on real hardware: GPU kernels, parallelism across chips, and serving."}, {"id": "gen", "label": "Diffusion and flows", "family": 2, "core": "Turn noise into data by learning to undo a corruption process: diffusion, flow matching, and flow maps."}, {"id": "disc", "label": "Discrete and language diffusion", "family": 2, "core": "Diffusion for tokens instead of pixels, up to diffusion language models and the RL that tunes them."}, {"id": "ctrl", "label": "Diffusion meets control", "family": 2, "core": "Steer a trained diffusion model toward a reward, by fine-tuning or at sampling time, with optimal control."}, {"id": "rl", "label": "Reinforcement learning", "family": 3, "core": "Learn to act from reward: values, policy gradients, off-policy and offline learning, and world models."}, {"id": "post", "label": "Post-training", "family": 3, "core": "Turn a pretrained model into an assistant or a reasoner with human preferences and verifiable rewards."}, {"id": "interp", "label": "Interpretability", "family": 4, "core": "Reverse-engineer what a trained network computes: features, circuits, and the directions that steer it."}, {"id": "cl", "label": "Continual learning", "family": 5, "core": "Keep learning after training without forgetting old skills or losing the ability to learn new ones."}, {"id": "embod", "label": "Robotics and world models", "family": 6, "core": "Carry generative models and RL into the physical world: robot policies, VLAs, and world models."}, {"id": "vision", "label": "Computer vision", "family": 7, "core": "See with neural networks: vision transformers, detection and segmentation, 3D geometry, and models that read images and text together."}, {"id": "graphics", "label": "Graphics, 3D and video", "family": 7, "core": "Represent and render scenes with networks: neural fields, NeRF, Gaussian splats, text-to-3D, and video generation."}, {"id": "bio", "label": "Biology", "family": 8, "core": "Models of molecules and cells: structure prediction, protein and DNA language models, design, and single-cell foundation models."}, {"id": "science", "label": "ML for science", "family": 8, "core": "Networks inside simulation: physics-informed training, neural operators, ML weather models, interatomic potentials, and simulation-based inference."}, {"id": "safety", "label": "Safety and robustness", "family": 4, "core": "Make models robust and safe: adversarial examples, jailbreaks, evaluations, oversight, and model organisms of misalignment."}], "nodes": [{"id": "linalg", "title": "Linear algebra", "kind": "concept", "track": "found", "pre": [], "frontier": false, "core": "A matrix is a linear map, and the singular value decomposition says every such map is a rotation, a stretch along perpendicular axes, and another rotation. Most linear algebra in ML is finding those axes and how much each one stretches.", "reach": "Gradients, PCA, attention, low-rank adapters, and the directions behind probing and activation steering are all statements about vectors and matrices.", "uses": "Nearly every numerical program in science and engineering: Google’s original PageRank, 3D graphics and game engines, structural and circuit simulation, least-squares fitting, and the matrix multiplies that make up most of a neural network’s compute.", "worth": "you will read papers or write model code at any level, since everything else here assumes it. If you only call hosted models, skip it.", "resources": [{"title": "Essence of linear algebra", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2016", "level": 1, "note": "The geometric picture first: matrices as transformations, determinants as volume, eigenvectors as directions that only stretch."}, {"title": "MIT 18.06: Linear Algebra", "url": "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/", "type": "course", "by": "Gilbert Strang, MIT OCW, 2010", "level": 2, "note": "Full lecture videos and problem sets; the standard first course."}, {"title": "MIT 18.065: Matrix Methods in Data Analysis, Signal Processing, and Machine Learning", "url": "https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/", "type": "course", "by": "Gilbert Strang, MIT OCW, 2018", "level": 2, "note": "Strang’s follow-on course, built around the SVD and its uses in data analysis and learning."}, {"title": "Linear Algebra Done Right", "url": "https://linear.axler.net/", "type": "book", "by": "Sheldon Axler, 4th edition, 2024", "level": 3, "note": "Open access. Proof-based and determinant-free; read it once the computations feel routine."}, {"title": "MIT 18.06 problem sets, Fall 2022", "url": "https://github.com/mitmath/1806/tree/fall22/psets", "type": "project", "by": "Steven G. Johnson, MIT, 2022", "level": 2, "build": "Thirteen problem sets in Julia notebooks, with solutions, from elimination and LU through least squares, the SVD and PCA, determinants, eigenvalues, and positive definite matrices.", "teaches": "Which factorization answers which question and what it costs, learned by computing with real matrices rather than only by hand.", "time": "a term"}]}, {"id": "svd", "title": "SVD and low-rank approximation", "kind": "concept", "track": "found", "pre": ["linalg"], "frontier": false, "core": "Every matrix is a sum of rank-one pieces σ_i u_i v_i^T, with orthonormal u’s and v’s and the weights σ_i sorted largest first. Keeping the top k pieces gives the closest rank-k matrix (Eckart-Young), so a matrix whose σ’s fall fast is nearly low rank.", "reach": "PCA keeps the top singular vectors; LoRA learns a low-rank update; rank caps exact recall in matrix memories, and superposition trades exactness for more features.", "uses": "Principal component analysis, from ancestry maps built from genomes to factor models in finance; matrix factorization recommenders like those in the Netflix Prize; latent semantic indexing for search; least-squares solvers; and LoRA’s low-rank weight updates.", "worth": "data analysis, model compression, or adapter fine-tuning is in your plans; it takes a few hours past linear algebra and pays off across the map.", "resources": [{"title": "Singular Value Decomposition [Data-Driven Science and Engineering]", "url": "https://www.youtube.com/playlist?list=PLMrJAkhIeNNSVjnsviglFoY2nXildDCcv", "type": "video", "by": "Steve Brunton, University of Washington, 2020", "level": 1, "note": "Start with the first three videos: the decomposition, what U, Σ, and V mean, and truncating to the top k terms."}, {"title": "Lecture 6: Singular Value Decomposition (SVD)", "url": "https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/lecture-6-singular-value-decomposition-svd/", "type": "lectures", "by": "Gilbert Strang, MIT 18.065, 2018", "level": 2, "note": "Builds V and U from the eigenvectors of A^T A and A A^T, and shows the rank-one pieces come in order of importance."}, {"title": "Lecture 7: Eckart-Young: The Closest Rank k Matrix to A", "url": "https://ocw.mit.edu/courses/18-065-matrix-methods-in-data-analysis-signal-processing-and-machine-learning-spring-2018/resources/lecture-7-eckart-young-the-closest-rank-k-matrix-to-a/", "type": "lectures", "by": "Gilbert Strang, MIT 18.065, 2018", "level": 2, "note": "Why no other rank-k matrix comes closer to A than the top k pieces, and how PCA follows."}, {"title": "Singular Value Decomposition Part 2: Theorem, Proof, Algorithm", "url": "https://jeremykun.com/2016/05/16/singular-value-decomposition-part-2-theorem-proof-algorithm/", "type": "blog", "by": "Jeremy Kun, 2016", "level": 2, "note": "Read Part 1 first; this part builds the SVD greedily from best-fit subspaces and computes it with the power method in NumPy."}, {"title": "Finding structure with randomness: Probabilistic algorithms for constructing approximate matrix decompositions", "url": "https://arxiv.org/abs/0909.4061", "type": "paper", "by": "Halko, Martinsson, Tropp, 2009", "level": 3, "note": "Section 1 sketches the method: multiply by a random matrix to capture the range, orthonormalize, and take the SVD of the small projected matrix."}, {"title": "Computational Linear Algebra: Background Removal with Robust PCA", "url": "https://github.com/fastai/numerical-linear-algebra", "type": "project", "by": "Rachel Thomas, fast.ai, 2017", "level": 1, "note": "Notebook 3; notebook 2 does topic modeling with NMF and SVD the same way.", "build": "Background subtraction for a surveillance video: stack the frames into one matrix, then split it into a low-rank background and sparse moving people with randomized SVD and robust PCA.", "teaches": "Low-rank structure as something you can see, and why randomized SVD makes very large matrices tractable.", "time": "a weekend", "signature": true}]}, {"id": "calculus", "title": "Multivariable and matrix calculus", "kind": "concept", "track": "found", "pre": ["linalg"], "frontier": false, "core": "The derivative of a function of vectors or matrices is the linear map that best approximates it near a point. The chain rule composes those linear maps, and backpropagation is that chain rule evaluated from the output backward.", "reach": "Needed for backprop, optimization, the change of variables in normalizing flows, and every gradient in diffusion and policy gradient training.", "uses": "Every gradient-based fit, from neural network training to curve fitting in a physics lab; sensitivity analysis in engineering and economics; and the automatic differentiation in PyTorch and JAX that computes those gradients for you.", "worth": "you will read method sections or design new losses; for training standard models with standard losses, trusting autodiff and knowing the chain rule is enough.", "resources": [{"title": "The Matrix Calculus You Need For Deep Learning", "url": "https://explained.ai/matrix-calculus/", "type": "tutorial", "by": "Terence Parr, Jeremy Howard, 2018", "level": 1, "note": "Jacobians and the vector chain rule, worked through neural network examples."}, {"title": "MIT 18.S096: Matrix Calculus for Machine Learning and Beyond", "url": "https://ocw.mit.edu/courses/18-s096-matrix-calculus-for-machine-learning-and-beyond-january-iap-2023/", "type": "course", "by": "Alan Edelman, Steven G. Johnson, MIT OCW, 2023", "level": 2, "note": "Derivatives as linear operators, including derivatives with respect to matrices; lectures and notes."}, {"title": "Mathematics for Machine Learning", "url": "https://mml-book.github.io/", "type": "book", "by": "Deisenroth, Faisal, Ong, Cambridge, 2020", "level": 2, "note": "Chapter 5, Vector Calculus, connects gradients and Jacobians to backpropagation."}, {"title": "The Matrix Cookbook", "url": "https://www.math.uwaterloo.ca/~hwolkowi/matrixcookbook.pdf", "type": "notes", "by": "Kaare Brandt Petersen, Michael Syskind Pedersen, 2012", "level": 2, "note": "A reference table of matrix identities and derivatives; look things up, don’t read it."}, {"title": "MIT 18.063 Matrix Calculus problem sets", "url": "https://github.com/mitmath/matrixcalc/tree/main/psets", "type": "project", "by": "Alan Edelman, Steven G. Johnson, MIT, 2026", "level": 2, "build": "Two problem sets: derivatives of matrix functions written as linear operators, an adjoint gradient checked by finite differences, the matrix exponential’s derivative, Newton’s method on a determinant, and modified backpropagation.", "teaches": "To find a derivative by writing the change in the output as a linear map of the change in the input, then trust it only after a finite difference agrees.", "time": "a week"}]}, {"id": "prob", "title": "Probability", "kind": "concept", "track": "found", "pre": [], "frontier": false, "core": "Probability assigns each event a number that adds up like area. Conditioning on what you know shrinks the space and renormalizes, Bayes’ rule turns P(data given cause) into P(cause given data), and expectation averages a quantity under those weights.", "reach": "The language of every generative model, from VAEs to diffusion, and of RL, where returns are expectations over random trajectories.", "uses": "Spam filters, weather forecasts, insurance pricing, A/B tests, reading a medical test result correctly, and the sampling step where a language model draws each next token from a distribution over its vocabulary.", "worth": "any part of ML or data is in your future; generative models and RL are written in its language, so there is no lighter path.", "resources": [{"title": "Harvard Stat 110: Probability", "url": "https://stat110.net/", "type": "lectures", "by": "Joe Blitzstein, Harvard, 2013", "level": 1, "note": "Lectures, the Blitzstein and Hwang book, and practice problems; the best first course."}, {"title": "Probability in Electrical Engineering and Computer Science", "url": "https://link.springer.com/book/10.1007/978-3-030-49995-2", "type": "book", "by": "Jean Walrand, Springer 2021, open access", "level": 2, "note": "The text of Berkeley’s EECS 126, built around applications such as PageRank, queues and digital links."}, {"title": "High-Dimensional Probability", "url": "https://www.math.uci.edu/~rvershyn/papers/HDP-book/HDP-book.html", "type": "book", "by": "Roman Vershynin, 2nd edition, 2026", "level": 3, "note": "Chapters 2 and 3: concentration of sums and random vectors in high dimensions, where intuition from 2D fails."}, {"title": "MIT 18.05 problem sets 1 to 5", "url": "https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2022/pages/problem-sets/", "type": "project", "by": "Jeremy Orloff, Jennifer French Kamrin, MIT OCW, 2022", "level": 1, "build": "Counting, Bayes’ rule, expectation, the central limit theorem, and joint distributions, worked by hand and in R simulations, with each answer checked in an online problem checker.", "teaches": "Turning a word problem into a probability model, and catching a wrong exact answer by simulating it.", "time": "two weeks"}]}, {"id": "stats", "title": "Statistical inference", "kind": "concept", "track": "found", "pre": ["prob"], "frontier": false, "core": "Inference runs probability backward, from data to the parameters that could have produced it. Maximum likelihood picks the parameters that make the data most probable, Bayesian inference keeps a whole distribution over them, and a prior or regularizer keeps either from overfitting.", "reach": "Underlies likelihood training of language and diffusion models, Monte Carlo estimation, and the question of why deep networks generalize.", "uses": "Clinical trials, A/B tests at web companies, polling and election forecasts, fitting any model by maximum likelihood, and telling whether a benchmark gain is real or noise from a few random seeds.", "worth": "you will run experiments or report results; skipping it is how people claim gains that vanish on a second seed. Deep Bayesian theory is optional.", "resources": [{"title": "Statistical Rethinking", "url": "https://github.com/rmcelreath/stat_rethinking_2024", "type": "lectures", "by": "Richard McElreath, 2024", "level": 1, "note": "Bayesian inference taught through simulation and code, with lectures on YouTube."}, {"title": "MIT 18.650: Statistics for Applications", "url": "https://ocw.mit.edu/courses/18-650-statistics-for-applications-fall-2016/", "type": "course", "by": "Philippe Rigollet, MIT OCW, 2016", "level": 2, "note": "The frequentist side: estimators, confidence intervals, tests, and regression, with lecture videos."}, {"title": "Probabilistic Machine Learning: An Introduction", "url": "https://probml.github.io/pml-book/", "type": "book", "by": "Kevin Murphy, MIT Press, 2022", "level": 2, "note": "Book 1, Chapter 4: maximum likelihood, empirical risk, regularization, and Bayesian and frequentist statistics."}, {"title": "Statistical Rethinking 2024 homework", "url": "https://github.com/rmcelreath/stat_rethinking_2024/tree/main/homework", "type": "project", "by": "Richard McElreath, 2024", "level": 1, "build": "Nine weekly problem sets with solutions: posteriors from grids and samples, regression guided by causal graphs, MCMC, and generalized linear and multilevel models, each coded end to end.", "teaches": "Bayesian inference as a habit: simulate data from the model you believe, fit it, and check that the posterior recovers what you put in.", "time": "a term"}]}, {"id": "optim", "title": "Optimization", "kind": "concept", "track": "found", "pre": ["calculus"], "frontier": false, "core": "To minimize a function, step against its gradient. For convex functions every local minimum is global, so gradient descent provably finds the answer, and duality gives a lower bound that certifies how close you are. Deep learning keeps the steps but loses the guarantees.", "reach": "Backprop training, Adam, PPO’s trust regions, and the entropic solvers of optimal transport all start here.", "uses": "Training every neural network, plus linear programs for airline scheduling and supply chains, portfolio optimization in finance, model predictive control in robots and chemical plants, and the convex training problem of support vector machines.", "worth": "you will tune training runs or read optimizer papers; convex theory and duality can wait unless you study learning theory or optimal transport.", "resources": [{"title": "Why Momentum Really Works", "url": "https://distill.pub/2017/momentum/", "type": "blog", "by": "Gabriel Goh, Distill, 2017", "level": 1, "note": "Gradient descent and momentum on a quadratic, with interactive plots of why they converge or oscillate."}, {"title": "Stanford EE364A: Convex Optimization I", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rMJqxxviPa4AmDClvcbHi6h", "type": "lectures", "by": "Stephen Boyd, Stanford Online, 2023", "level": 2, "note": "Recorded lectures that follow the book below."}, {"title": "Convex Optimization", "url": "https://web.stanford.edu/~boyd/cvxbook/", "type": "book", "by": "Stephen Boyd, Lieven Vandenberghe, 2004", "level": 2, "note": "Chapters 2 to 5 for convexity and duality, Chapter 9 for gradient and Newton methods."}, {"title": "Convex Optimization: Algorithms and Complexity", "url": "https://arxiv.org/abs/1405.4980", "type": "book", "by": "Sébastien Bubeck, 2015", "level": 3, "note": "Convergence rates with short proofs for gradient, mirror, accelerated, and stochastic methods."}, {"title": "Additional Exercises for Convex Optimization", "url": "https://github.com/cvxgrp/cvxbook_additional_exercises", "type": "project", "by": "Stephen Boyd, Lieven Vandenberghe, 2026", "level": 2, "note": "Solutions are released only to instructors.", "build": "Exercises from Stanford EE364a homework on convex sets and functions, duality, fitting, estimation, and interior-point methods, many solved numerically in CVXPY with the provided data.", "teaches": "Spotting that a problem is convex, rewriting it into a form a solver accepts, and reading the dual variables as prices.", "time": "a term"}]}, {"id": "info", "title": "Information theory", "kind": "concept", "track": "found", "pre": ["prob"], "frontier": false, "core": "An outcome of probability p carries log(1/p) bits of surprise. Entropy is the average surprise, KL divergence is the extra bits paid for coding with the wrong distribution, and mutual information is how much one variable shortens the code for another.", "reach": "Cross-entropy losses, the ELBO in VAEs and diffusion, InfoNCE in contrastive learning, and KL penalties in PPO and RLHF all come from here.", "uses": "ZIP files and MP3 audio, the error-correcting codes in Wi-Fi, 5G, and deep-space probes, the cryptographer’s notion of perfect secrecy, and the cross-entropy loss behind nearly every classifier and language model.", "worth": "you train models or read generative modeling papers, where entropy, cross-entropy, and KL appear on every page. Channel coding theorems are optional for ML.", "resources": [{"title": "Visual Information Theory", "url": "https://colah.github.io/posts/2015-09-Visual-Information/", "type": "blog", "by": "Christopher Olah, 2015", "level": 1, "note": "Entropy, cross-entropy, KL divergence, and mutual information drawn as code lengths."}, {"title": "Information Theory, Pattern Recognition, and Neural Networks", "url": "https://www.youtube.com/playlist?list=PLruBu5BI5n4aFpG32iMbdWoRVAA-Vcso6", "type": "lectures", "by": "David MacKay, Cambridge, 2012", "level": 1, "note": "MacKay’s own lectures on the book below."}, {"title": "Information Theory, Inference, and Learning Algorithms", "url": "https://www.inference.org.uk/itprnn/book.pdf", "type": "book", "by": "David MacKay, 2003", "level": 2, "note": "Chapters 2 and 4 to 6: entropy, the source coding theorem, and symbol and stream codes."}, {"title": "Information Theory: From Coding to Learning", "url": "https://people.lids.mit.edu/yp/homepage/data/itbook-export.pdf", "type": "book", "by": "Yury Polyanskiy, Yihong Wu, Cambridge, 2025", "level": 3, "note": "Chapters 1 to 3 define entropy, divergence, and mutual information rigorously; Chapter 4 gives their variational forms."}, {"title": "EE274 Homeworks 1 and 2: Lossless Compression", "url": "https://stanforddatacompressionclass.github.io/Fall25/assignments/", "type": "project", "by": "Stanford EE274, 2025", "level": 2, "build": "Kraft’s inequality and Shannon codes, a Huffman compressor for a real file in the Stanford Compression Library, conditional entropy, and rANS with bits-back coding.", "teaches": "That entropy is an actual file size a code can reach within a fraction of a bit, and where each code loses that fraction.", "time": "two weeks"}]}, {"id": "stochastic", "title": "Markov chains and stochastic processes", "kind": "concept", "track": "found", "pre": ["prob", "linalg"], "frontier": false, "core": "A Markov chain forgets its past: the next state depends only on the current one, through a transition matrix. Run it long enough and most chains settle into a stationary distribution, the fixed point MCMC samples from and diffusion’s forward process heads toward.", "reach": "Leads to MCMC, MDPs in reinforcement learning, Brownian motion and SDEs, and the discrete diffusion of D3PM.", "uses": "PageRank’s random surfer, queueing models for call centers and networks, credit rating transitions in finance, gene finding with hidden Markov models, and the speech recognizers that ran on HMMs for decades.", "worth": "you will study RL, MCMC, or diffusion, which all assume it; for transformer engineering alone, a working picture of a Markov chain is enough.", "resources": [{"title": "Markov Chains explained visually", "url": "https://setosa.io/ev/markov-chains/", "type": "tutorial", "by": "Victor Powell, Lewis Lehe, Setosa, 2014", "level": 1, "note": "Interactive transition diagrams and matrices; ten minutes."}, {"title": "MIT 6.262: Discrete Stochastic Processes", "url": "https://ocw.mit.edu/courses/6-262-discrete-stochastic-processes-spring-2011/", "type": "course", "by": "Robert Gallager, MIT OCW, 2011", "level": 2, "note": "Graduate lectures on Poisson processes, Markov chains, renewal processes, and random walks."}, {"title": "Markov Chains and Mixing Times", "url": "https://pages.uoregon.edu/dlevin/MARKOV/mcmt2e.pdf", "type": "book", "by": "David Levin, Yuval Peres, with Elizabeth Wilmer, 2nd edition, 2017", "level": 3, "note": "How fast a chain reaches its stationary distribution, which decides whether MCMC is practical."}, {"title": "Stochastic Processes (Stanford lecture notes)", "url": "https://adembo.su.domains/math-136/nnotes.pdf", "type": "notes", "by": "Amir Dembo, revised by Kevin Ross, 2021", "level": 3, "note": "Chapters 5 and 6: Brownian motion and Markov processes, the bridge to SDEs."}, {"title": "Seven riffle shuffles", "url": "https://pages.uoregon.edu/dlevin/MARKOV/mcmt2e.pdf", "type": "project", "by": "Built on Levin, Peres, Wilmer, 2017", "level": 2, "build": "The riffle shuffle model of Gilbert, Shannon, and Reeds simulated on small decks, then the exact distance to uniform for 52 cards computed from rising sequences and Eulerian numbers.", "teaches": "Mixing time as a number, the sharp cutoff where distance falls from near 1 to near 0, and how to measure distance when a deck has 52! states.", "time": "a day", "made": true, "done": "Total variation distances after 5, 6, 7, and 8 shuffles match 0.9237, 0.6135, 0.3341, and 0.1672 from Figure 8.5, and small-deck simulations agree with the formula."}]}, {"id": "odes", "title": "ODEs and numerical integration", "kind": "concept", "track": "found", "pre": ["calculus"], "frontier": false, "core": "An ODE gives a velocity at every point, dx/dt = f(x, t), and its solution is the path that follows those velocities. Numerical solvers take small steps: Euler uses one slope per step, and Runge-Kutta methods average several slopes to cut the error.", "reach": "Flow matching, neural ODEs, DDIM and other fast samplers, and state-space models are all ODEs integrated numerically.", "uses": "Orbit and trajectory calculations, circuit simulators such as SPICE, epidemic models like SIR, drug dosing models, physics engines in games and robotics, and the samplers that turn noise into images in flow and diffusion models.", "worth": "you want to understand flow matching, diffusion samplers, or state-space models; one course chapter on Euler and Runge-Kutta covers what ML papers use.", "resources": [{"title": "Differential equations", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDNPOjrT6KVlfJuKtYTftqH6", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2019", "level": 1, "note": "Phase spaces and vector fields before formulas."}, {"title": "MIT 18.03: Differential Equations", "url": "https://ocw.mit.edu/courses/18-03-differential-equations-spring-2010/", "type": "course", "by": "Arthur Mattuck, Haynes Miller, MIT OCW, 2010", "level": 2, "note": "Lecture videos on linear ODEs, systems, and numerical methods."}, {"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "note": "Chapter 2 is a compact ODE refresher, with numerical solvers in Section 2.6; the rest of the book is the next node."}, {"title": "On Neural Differential Equations", "url": "https://arxiv.org/abs/2202.02435", "type": "book", "by": "Patrick Kidger, 2022", "level": 3, "note": "Section 5.3 covers numerical solvers and Section 5.1 backpropagation through them."}, {"title": "CMU 16-745 Homework 1, Q1: Integration", "url": "https://github.com/Optimal-Control-16-745/HW1_S25", "type": "project", "by": "CMU 16-745 Optimal Control, 2025", "level": 2, "note": "Q1 only, in Julia; the rest of the homework is Newton’s method and a QP solver.", "build": "Forward Euler, midpoint, and RK4, then backward Euler, implicit midpoint, and Hermite-Simpson solved by Newton’s method, all simulating a double pendulum and compared by energy error.", "teaches": "Why explicit Euler gains energy, implicit Euler bleeds it, and implicit midpoint holds it, which an order of accuracy alone does not reveal.", "time": "a day"}]}, {"id": "sdes", "title": "Stochastic differential equations", "kind": "concept", "track": "found", "pre": ["stochastic", "odes"], "frontier": false, "core": "An SDE is an ODE plus noise: dx = f(x, t) dt + g(t) dW, where Brownian increments dW have variance dt. Because dW is of size square root of dt, Itô’s formula replaces the chain rule and gains a second-derivative term.", "reach": "The forward and reverse processes of score-based diffusion, Langevin sampling, and stochastic optimal control are SDEs.", "uses": "Option pricing, where Black-Scholes models a stock price as an SDE, interest rate models, Langevin dynamics in molecular simulation, continuous-time tracking filters, and the forward and reverse processes of score-based diffusion models.", "worth": "you want to follow diffusion papers through their derivations; people who train and sample diffusion models can work from the discrete DDPM view instead.", "resources": [{"title": "An Introduction to Flow Matching and Diffusion Models", "url": "https://arxiv.org/abs/2506.02070", "type": "notes", "by": "Peter Holderrieth, Ezra Erives, MIT 6.S184, 2025", "level": 1, "note": "Section 2 builds ODEs, then SDEs, as generative models, aimed at the reader headed into diffusion."}, {"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "note": "Chapters 3 and 4 build SDEs and the Itô formula; Chapter 8 simulates them."}, {"title": "Stochastic Calculus, Filtering, and Stochastic Control", "url": "https://web.math.princeton.edu/~rvan/acm217/ACM217.pdf", "type": "notes", "by": "Ramon van Handel, Caltech ACM 217, 2007", "level": 3, "note": "Chapters 3 to 5: the Wiener process, the Itô integral, and SDEs, with proofs."}, {"title": "MIT 6.S184 Lab 1: Simulating ODEs and SDEs", "url": "https://github.com/eje24/iap-diffusion-labs/blob/2026/labs/lab_one.ipynb", "type": "project", "by": "Erives, Holderrieth, MIT 6.S184, 2026", "level": 1, "build": "Euler and Euler-Maruyama simulators, then Brownian motion, Ornstein-Uhlenbeck processes, and Langevin dynamics that carry samples toward a target density.", "teaches": "How noise scaled by the square root of the step moves a whole distribution, and why Langevin dynamics samples a density it knows only through its score.", "time": "an afternoon"}, {"title": "Applied SDEs, Exercises 8.1 and 8.2", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "project", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "build": "An Itô formula check on geometric Brownian motion, Milstein paths against the exact solution, then strong order 1.5 and weak order 2.0 schemes on the Beneš SDE.", "teaches": "What Itô’s correction term does to a real solution, and the difference between getting single paths right and getting the distribution right.", "time": "a day"}]}, {"id": "fokker", "title": "Fokker-Planck and the continuity equation", "kind": "concept", "track": "found", "pre": ["sdes"], "frontier": false, "core": "Move many particles along a velocity field and their density obeys the continuity equation: density drops where the flow spreads out. Add Brownian noise and you get the Fokker-Planck equation, a deterministic PDE for how an SDE’s whole distribution evolves.", "reach": "It is why a diffusion SDE has a probability flow ODE with the same marginals, and why flow matching can regress velocities.", "uses": "Fluid dynamics, where the continuity equation is conservation of mass, and spreading densities in plasma physics, neuroscience, and finance. Diffusion models share this math with heat flow, but CFD solvers do not use them.", "worth": "you want to know why probability flow ODEs and flow matching are correct; to train or use those models, the stated result is enough.", "resources": [{"title": "An Introduction to Flow Matching and Diffusion Models", "url": "https://arxiv.org/abs/2506.02070", "type": "notes", "by": "Peter Holderrieth, Ezra Erives, MIT 6.S184, 2025", "level": 1, "note": "Section 3.2 derives the continuity equation and Section 4.2 the Fokker-Planck equation, with proofs in Appendix B."}, {"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "note": "Section 5.2 derives the Fokker-Planck-Kolmogorov equation from the Itô formula."}, {"title": "{Euclidean, metric, and Wasserstein} gradient flows: an overview", "url": "https://arxiv.org/abs/1609.03890", "type": "paper", "by": "Filippo Santambrogio, 2017", "level": 3, "note": "Reads the Fokker-Planck equation as gradient descent on free energy in Wasserstein space, the JKO scheme."}, {"title": "Applied SDEs, Exercises 5.2 and 5.3", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "project", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "build": "The Fokker-Planck equation of the Beneš SDE checked against its closed-form density, solved by finite differences, and compared with a histogram of 1,000 simulated paths at t = 5.", "teaches": "That a PDE for the density and a cloud of simulated particles describe the same evolving distribution, and what each costs to compute.", "time": "a day"}]}, {"id": "ot", "title": "Optimal transport", "kind": "concept", "track": "found", "pre": ["optim", "prob"], "frontier": false, "core": "Optimal transport asks for the cheapest way to move one distribution of mass onto another, given a cost per unit moved. The minimal cost defines the Wasserstein distance, and adding an entropy penalty makes the problem solvable at scale by Sinkhorn’s matrix scaling.", "reach": "Rectified flow straightens paths with it, minibatch couplings speed up flow matching, and Schrödinger bridges are its entropic, dynamic form.", "uses": "Image retrieval with the earth mover’s distance, tracing cell development across time points in single-cell biology, matching markets in economics, and the Wasserstein distance behind WGAN training and minibatch pairing in flow matching.", "worth": "you will work on flow matching, Schrödinger bridges, or generative model theory; others can stop at the Wasserstein distance’s definition and Sinkhorn’s idea.", "resources": [{"title": "Optimal Transport for Machine Learners", "url": "https://arxiv.org/abs/2505.06589", "type": "notes", "by": "Gabriel Peyré, 2025", "level": 1, "note": "Chapters 1 to 3 go from matching point clouds to the Kantorovich relaxation; Chapter 8 is Sinkhorn; Chapter 14 is dynamic OT."}, {"title": "Computational Optimal Transport", "url": "https://arxiv.org/abs/1803.00567", "type": "book", "by": "Gabriel Peyré, Marco Cuturi, 2019", "level": 2, "note": "Chapters 2 to 4: theory, algorithms, and entropic regularization; Chapter 7: dynamic formulations."}, {"title": "Sinkhorn Distances: Lightspeed Computation of Optimal Transportation Distances", "url": "https://arxiv.org/abs/1306.0895", "type": "paper", "by": "Marco Cuturi, 2013", "level": 2, "note": "The paper that made entropic OT the default in machine learning."}, {"title": "POT: Python Optimal Transport", "url": "https://pythonot.github.io/", "type": "code", "by": "Rémi Flamary, Nicolas Courty, and contributors, 2016 onward", "level": 2, "note": "Exact and entropic solvers with example notebooks; run them on 2D point clouds."}, {"title": "Numerical Tours: Entropic Optimal Transport", "url": "https://www.numerical-tours.com/python/optimaltransp_5_entropic/", "type": "project", "by": "Gabriel Peyré", "level": 2, "build": "Sinkhorn’s algorithm written from scratch, then entropic transport plans between histograms and between point clouds as the regularization epsilon shrinks.", "teaches": "How an entropy term turns a linear program into alternating matrix scaling, and the trade between speed and blur that epsilon controls.", "time": "an afternoon"}]}, {"id": "montecarlo", "title": "Monte Carlo, importance sampling and MCMC", "kind": "concept", "track": "found", "pre": ["stochastic", "stats"], "frontier": false, "core": "Average a function over samples to estimate its expectation; the error shrinks like one over the square root of the sample count in any dimension. Importance sampling reweights samples from an easier distribution, and MCMC runs a Markov chain that converges to the target.", "reach": "Energy-based models, policy gradient estimators, off-policy correction, and sequential Monte Carlo steering of diffusion models all rest on these estimators.", "uses": "Neutron transport at Los Alamos, where the method was born, pricing exotic financial derivatives, path-traced lighting in animated films, Bayesian software such as Stan, particle physics simulation, and the gradient estimates in RL.", "worth": "you will do RL, Bayesian modeling, or sampling and steering of generative models; the square root error rate and importance weights are what everyone needs.", "resources": [{"title": "The Markov-chain Monte Carlo Interactive Gallery", "url": "https://chi-feng.github.io/mcmc-demo/", "type": "code", "by": "Chi Feng, 2016", "level": 1, "note": "Watch random-walk Metropolis, HMC, and others explore the same targets side by side."}, {"title": "Information Theory, Inference, and Learning Algorithms", "url": "https://www.inference.org.uk/itprnn/book.pdf", "type": "book", "by": "David MacKay, 2003", "level": 2, "note": "Chapters 29 and 30: importance sampling, rejection sampling, Metropolis, Gibbs, and Hamiltonian Monte Carlo."}, {"title": "Monte Carlo theory, methods and examples", "url": "https://artowen.su.domains/mc/", "type": "book", "by": "Art Owen, 2013", "level": 2, "note": "Chapter 2 for simple Monte Carlo, Chapter 9 for importance sampling, Chapter 11 for MCMC."}, {"title": "A Conceptual Introduction to Hamiltonian Monte Carlo", "url": "https://arxiv.org/abs/1701.02434", "type": "paper", "by": "Michael Betancourt, 2017", "level": 3, "note": "Why random-walk proposals fail in high dimensions and how Hamiltonian dynamics fixes it."}, {"title": "A Tutorial on Particle Filtering and Smoothing: Fifteen years later", "url": "https://www.stats.ox.ac.uk/~doucet/doucet_johansen_tutorialPF2011.pdf", "type": "paper", "by": "Arnaud Doucet, Adam Johansen, 2011", "level": 3, "note": "Sequential Monte Carlo, the basis of twisted SMC steering for diffusion models."}, {"title": "HMC versus random-walk Metropolis in 100 dimensions", "url": "https://arxiv.org/abs/1206.1901", "type": "project", "by": "Built on Radford Neal, 2011", "level": 2, "build": "Random-walk Metropolis and Hamiltonian Monte Carlo written from scratch and run for 1,000 iterations on a 100-dimensional Gaussian with standard deviations 0.01 to 1.00.", "teaches": "Why a random walk crawls when one direction is 100 times narrower than another, and how leapfrog trajectories travel far and are still accepted.", "time": "a day", "made": true, "done": "Rejection rates land near 0.13 for HMC (L = 150, step near 0.013) and 0.75 for random walk, and HMC’s errors in the means are about 10 times smaller, as in Section 3.3."}]}, {"id": "control", "title": "Optimal control and dynamic programming", "kind": "concept", "track": "found", "pre": ["optim", "odes"], "frontier": false, "core": "Choose inputs that steer a system to minimize total cost. Dynamic programming works backward from the end: the best cost-to-go satisfies Bellman’s equation, or in continuous time the Hamilton-Jacobi-Bellman equation, and for linear dynamics with quadratic cost the answer is LQR.", "reach": "Bellman’s equation becomes the MDP of RL, and Pontryagin’s costate is the adjoint behind adjoint matching.", "uses": "Autopilots, spacecraft guidance, robot arms, inventory and supply chain planning, shortest-path routing in map apps, and DNA sequence alignment in bioinformatics, which is dynamic programming over two strings.", "worth": "you plan to study RL, robotics, or adjoint methods for diffusion; pure language or vision work rarely needs more than the Bellman equation.", "resources": [{"title": "Control Bootcamp", "url": "https://www.youtube.com/playlist?list=PLMrJAkhIeNNR20Mz-VpzgfQs5zrYi085m", "type": "lectures", "by": "Steve Brunton, University of Washington, 2017", "level": 1, "note": "Short lectures from state space to LQR and the Kalman filter, with code."}, {"title": "Underactuated Robotics", "url": "https://underactuated.mit.edu/", "type": "book", "by": "Russ Tedrake, MIT, 2024", "level": 2, "note": "Chapter 7 is dynamic programming, Chapter 8 LQR, Chapter 10 trajectory optimization; online text with notebooks."}, {"title": "A Course in Reinforcement Learning", "url": "https://web.mit.edu/dimitrib/www/RLbook.html", "type": "book", "by": "Dimitri Bertsekas, 2nd edition, 2025", "level": 2, "note": "Free PDF. Chapter 1 covers exact and approximate dynamic programming, including linear quadratic problems."}, {"title": "Calculus of Variations and Optimal Control Theory: A Concise Introduction", "url": "https://liberzon.csl.illinois.edu/teaching/cvoc.pdf", "type": "book", "by": "Daniel Liberzon, 2012", "level": 3, "note": "Chapter 4 is the maximum principle, Chapter 5 the HJB equation, Chapter 6 LQR."}, {"title": "CMU 16-745 Homework 2: LQR and MPC", "url": "https://github.com/Optimal-Control-16-745/HW2_S25", "type": "project", "by": "CMU 16-745 Optimal Control, 2025", "level": 2, "note": "In Julia, with unit tests.", "build": "Finite-horizon LQR solved as a convex program and by the Riccati recursion, TVLQR tracking a cartpole swing-up, and LQR, trajectory optimization, and MPC docking a spacecraft.", "teaches": "That dynamic programming’s backward recursion and a convex solver give the same controls, and when replanning with MPC beats a fixed gain.", "time": "a week"}]}, {"id": "soc", "title": "Stochastic optimal control", "kind": "concept", "track": "found", "pre": ["control", "sdes", "info"], "frontier": false, "core": "Steer a noisy system, an SDE, to minimize expected cost. When the control is charged by its KL divergence from the uncontrolled process, a log transform makes the HJB equation linear, and the optimal path distribution is the uncontrolled one reweighted by exp(-cost).", "reach": "Adjoint matching, reward fine-tuning of diffusion models, Schrödinger bridges, and maximum-entropy RL are this problem in different clothes.", "uses": "Merton’s portfolio problem in finance, path integral controllers that drive robots and race cars aggressively (MPPI), and the KL-regularized formulations behind maximum entropy RL and reward fine-tuning of diffusion models.", "worth": "you are aiming at research on diffusion fine-tuning, samplers, or maximum entropy RL; it is graduate material, and applied work can skip it.", "resources": [{"title": "Reinforcement Learning and Control as Probabilistic Inference: Tutorial and Review", "url": "https://arxiv.org/abs/1805.00909", "type": "paper", "by": "Sergey Levine, 2018", "level": 1, "note": "The discrete-time version: the optimal policy is the prior reweighted by exponentiated reward."}, {"title": "Path integrals and symmetry breaking for optimal control theory", "url": "https://arxiv.org/abs/physics/0505066", "type": "paper", "by": "Hilbert Kappen, 2005", "level": 2, "note": "The log transform that linearizes the HJB equation, and the path integral that solves it."}, {"title": "Applied Stochastic Differential Equations", "url": "https://users.aalto.fi/~ssarkka/pub/sde_book.pdf", "type": "book", "by": "Simo Särkkä, Arno Solin, Cambridge, 2019", "level": 2, "note": "Sections 7.3 to 7.7: Girsanov, Doob’s h-transform, path integrals, and Feynman-Kac, the tools behind the reweighting."}, {"title": "Stochastic Calculus, Filtering, and Stochastic Control", "url": "https://web.math.princeton.edu/~rvan/acm217/ACM217.pdf", "type": "notes", "by": "Ramon van Handel, Caltech ACM 217, 2007", "level": 3, "note": "Chapter 6: dynamic programming for SDEs, verification theorems, and the stochastic linear regulator."}, {"title": "An optimal control perspective on diffusion-based generative modeling", "url": "https://arxiv.org/abs/2211.01364", "type": "paper", "by": "Julius Berner, Lorenz Richter, Karen Ullrich, 2022", "level": 3, "note": "Casts the reverse diffusion as the solution of a stochastic control problem."}, {"title": "Path integral control of Kappen’s double slit", "url": "https://arxiv.org/abs/physics/0505066", "type": "project", "by": "Built on Hilbert Kappen, 2005", "level": 3, "build": "The double slit problem’s cost to go computed exactly, by naive Monte Carlo over uncontrolled noisy paths, and by importance sampling, then used to steer particles through a slit.", "teaches": "That optimal control comes from reweighting uncontrolled paths by exp(-cost), and why the estimate needs importance sampling to be practical.", "time": "a weekend", "made": true, "done": "Estimates of J(x, 0) match the exact curve of Figure 2b (R = 0.1, ν = 1), with naive sampling needing 100,000 paths and importance sampling 100 (Figures 3 and 4)."}]}, {"id": "backprop", "title": "Neural networks and backpropagation", "kind": "concept", "track": "dl", "pre": ["calculus", "optim"], "frontier": false, "core": "A neural network is a composition of differentiable layers. Backpropagation gets the loss gradient for every weight in one backward pass, applying the chain rule from the output inward and reusing each intermediate result, for a few times the cost of a forward pass.", "reach": "Every trained model in the graph uses it; reverse-mode differentiation through an ODE solver becomes the adjoint method.", "uses": "Training essentially every neural network in production, from speech recognition and translation to feed ranking and protein structure prediction, and, as reverse-mode differentiation, computing sensitivities in weather forecasting and aircraft design.", "worth": "you will build or debug any neural network; frameworks run it for you, but knowing it is how you diagnose vanishing gradients and memory blowups.", "resources": [{"title": "Neural networks", "url": "https://www.youtube.com/playlist?list=PLZHQObOWTQDNU6R1_67000Dx_ZCJB-3pi", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2017", "level": 1, "note": "Chapters 1 to 4 build a network, gradient descent, and backpropagation visually."}, {"title": "The spelled-out intro to neural networks and backpropagation: building micrograd", "url": "https://www.youtube.com/watch?v=VMj-3S1tku0", "type": "video", "by": "Andrej Karpathy, 2022", "level": 1, "note": "Builds a tiny autograd engine by hand, then trains a network with it."}, {"title": "Understanding Deep Learning", "url": "https://udlbook.github.io/udlbook/", "type": "book", "by": "Simon Prince, MIT Press, 2023", "level": 2, "note": "Chapters 3, 4, and 7: shallow and deep networks, then gradients and initialization."}, {"title": "The Elements of Differentiable Programming", "url": "https://arxiv.org/abs/2403.14606", "type": "book", "by": "Mathieu Blondel, Vincent Roulet, 2024", "level": 3, "note": "Automatic differentiation in general, including the adjoint method for ODEs."}, {"title": "micrograd", "url": "https://github.com/karpathy/micrograd", "type": "project", "by": "Andrej Karpathy, 2020", "level": 1, "note": "Rebuild it from the README alone, then compare with the lecture above.", "build": "A scalar autograd engine of about 100 lines and a small neural network library on top of it, trained as a binary classifier on a toy dataset.", "teaches": "That backpropagation is the chain rule run over a graph in reverse topological order, with nothing hidden.", "time": "an afternoon", "signature": true}, {"title": "CS231n Assignment 1", "url": "https://cs231n.github.io/assignments2025/assignment1/", "type": "project", "by": "Stanford CS231n, 2025", "level": 2, "build": "k-nearest neighbors, a softmax classifier, a two-layer network, and a fully connected network for CIFAR-10, with every gradient written and vectorized in NumPy.", "teaches": "Deriving gradients for real layers by hand, and tuning hyperparameters on a validation split.", "time": "a week"}]}, {"id": "training", "title": "Training deep networks", "kind": "concept", "track": "dl", "pre": ["backprop"], "frontier": false, "core": "Training is stochastic gradient descent made reliable: initialize so signals neither explode nor vanish, normalize activations, use an adaptive optimizer like Adam with warmup and a decaying learning rate, and regularize so the network fits signal rather than noise.", "reach": "The practical layer under scaling laws, pretraining, quantization, and every experiment in continual learning and RL.", "uses": "Getting any model to converge in practice, from a class project to a frontier LLM; the same habits catch the loss spikes, divergence, and silent bugs that waste compute on large runs.", "worth": "you will train models yourself, even small ones. Anyone who only uses pretrained models through an API can skip it.", "resources": [{"title": "A Recipe for Training Neural Networks", "url": "http://karpathy.github.io/2019/04/25/recipe/", "type": "blog", "by": "Andrej Karpathy, 2019", "level": 1, "note": "A debugging order for training runs: overfit one batch first, then scale up."}, {"title": "Building makemore Part 3: Activations & Gradients, BatchNorm", "url": "https://www.youtube.com/watch?v=P6sfmUTpUmc", "type": "video", "by": "Andrej Karpathy, 2022", "level": 1, "note": "Watches activations and gradients at initialization, then adds batch normalization."}, {"title": "Understanding Deep Learning", "url": "https://udlbook.github.io/udlbook/", "type": "book", "by": "Simon Prince, MIT Press, 2023", "level": 2, "note": "Chapters 6 to 9: fitting, gradients and initialization, measuring performance, and regularization."}, {"title": "Adam: A Method for Stochastic Optimization", "url": "https://arxiv.org/abs/1412.6980", "type": "paper", "by": "Diederik Kingma, Jimmy Ba, 2014", "level": 2, "note": "The default optimizer; Algorithm 1 is the whole method."}, {"title": "Deep Learning Tuning Playbook", "url": "https://github.com/google-research/tuning_playbook", "type": "notes", "by": "Godbole, Dahl, Gilmer, Shallue, Nado, Google, 2023", "level": 2, "note": "A systematic procedure for choosing hyperparameters."}, {"title": "makemore", "url": "https://github.com/karpathy/makemore", "type": "project", "by": "Andrej Karpathy, 2022", "level": 1, "note": "The makemore lectures walk through it; rebuild each model before watching its lecture.", "build": "A character-level model that invents new names, built up from a bigram table through an MLP, a WaveNet-style network, recurrent networks, and a transformer.", "teaches": "Which choices of initialization, normalization, and architecture make training work, in models small enough to inspect.", "time": "a week"}]}, {"id": "resnets", "title": "Convolutional networks and ResNets", "kind": "concept", "track": "dl", "pre": ["backprop"], "frontier": false, "core": "A convolution slides a small filter across an image, detecting a pattern wherever it appears with few parameters. A residual block outputs its input plus a learned correction, x + f(x), which keeps gradients flowing and lets networks with hundreds of layers train.", "reach": "The residual stream of transformers, the U-Nets of diffusion models, and contrastive image encoders all come from this design.", "uses": "Medical image screening such as diabetic retinopathy detection, perception in self-driving cars, face recognition, AlphaGo Zero’s residual network for judging board positions, and the U-Net backbones in many image diffusion models.", "worth": "you work with images or video; transformer-only readers still need the residual connection, which takes an hour, and can skip the convolution details.", "resources": [{"title": "CS231n: Convolutional Neural Networks", "url": "https://cs231n.github.io/convolutional-networks/", "type": "notes", "by": "Stanford CS231n, Andrej Karpathy and others, 2015", "level": 1, "note": "Convolution, pooling, and how layer shapes work out."}, {"title": "ImageNet Classification with Deep Convolutional Neural Networks", "url": "https://papers.nips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html", "type": "paper", "by": "Krizhevsky, Sutskever, Hinton, NeurIPS 2012", "level": 2, "note": "AlexNet, the result that started the deep learning era."}, {"title": "Deep Residual Learning for Image Recognition", "url": "https://arxiv.org/abs/1512.03385", "type": "paper", "by": "He, Zhang, Ren, Sun, 2015", "level": 2}, {"title": "Identity Mappings in Deep Residual Networks", "url": "https://arxiv.org/abs/1603.05027", "type": "paper", "by": "He, Zhang, Ren, Sun, 2016", "level": 3, "note": "Why a clean identity path matters, and the pre-activation block that gives one."}, {"title": "A ConvNet for the 2020s", "url": "https://arxiv.org/abs/2201.03545", "type": "paper", "by": "Liu et al., 2022", "level": 3, "note": "Modernizes a ResNet step by step until it matches vision transformers."}, {"title": "CS231n Assignment 2", "url": "https://cs231n.github.io/assignments2025/assignment2/", "type": "project", "by": "Stanford CS231n, 2025", "level": 2, "build": "Batch normalization, dropout, and convolutional layers in NumPy, a CNN trained in PyTorch on CIFAR-10, and an RNN that captions COCO images.", "teaches": "Why normalization and dropout make deep networks trainable, and what a convolution costs when you write it yourself.", "time": "a week"}, {"title": "Reproduce the degradation problem on CIFAR-10", "url": "https://arxiv.org/abs/1512.03385", "type": "project", "by": "Built on He, Zhang, Ren, Sun, 2015", "level": 2, "build": "Plain and residual networks of 20 and 56 layers, with 16, 32, and 64 filters per stage, trained on CIFAR-10 on one GPU with the paper’s schedule.", "teaches": "That a deeper plain network trains worse, not just generalizes worse, and that identity shortcuts remove the problem.", "time": "a weekend", "made": true, "done": "Plain-56 ends with higher training error than plain-20, while ResNet-20 and ResNet-56 reach about 8.75 and 6.97 percent test error, as in Figure 6 and Table 6."}]}, {"id": "dltheory", "title": "Why deep networks generalize", "kind": "concept", "track": "dl", "pre": ["training", "stats"], "frontier": true, "core": "Deep networks can fit random labels, yet they generalize on real data, so counting parameters cannot explain them. What matters is which of the many zero-loss solutions training finds: gradient descent prefers simple ones, and test error falls again past the interpolation threshold.", "reach": "Bears on scaling laws, grokking, why large models fine-tune well, and what forgetting and plasticity loss in continual learning mean.", "uses": "Understanding rather than building: why huge overparameterized models are safe to train, how to think about model size against data, and how to read surprises such as grokking and double descent.", "worth": "you do research on training dynamics or learning theory; the field is still moving, and practitioners can stop at double descent and implicit bias.", "resources": [{"title": "Understanding Deep Learning", "url": "https://udlbook.github.io/udlbook/", "type": "book", "by": "Simon Prince, MIT Press, 2023", "level": 1, "note": "Chapter 20, Why does deep learning work?, surveys the open questions."}, {"title": "Understanding deep learning requires rethinking generalization", "url": "https://arxiv.org/abs/1611.03530", "type": "paper", "by": "Zhang, Bengio, Hardt, Recht, Vinyals, 2016", "level": 2, "note": "Networks memorize random labels, so capacity alone cannot explain generalization."}, {"title": "Deep Double Descent: Where Bigger Models and More Data Hurt", "url": "https://arxiv.org/abs/1912.02292", "type": "paper", "by": "Nakkiran et al., 2019", "level": 2, "note": "Test error rises and falls again as models grow past the point of fitting the data."}, {"title": "Deep Learning is Not So Mysterious or Different", "url": "https://arxiv.org/abs/2503.02113", "type": "paper", "by": "Andrew Gordon Wilson, 2025", "level": 2, "note": "Argues that soft inductive biases and existing bounds already explain benign overfitting and double descent."}, {"title": "Deep learning: a statistical viewpoint", "url": "https://arxiv.org/abs/2103.09177", "type": "paper", "by": "Bartlett, Montanari, Rakhlin, 2021", "level": 3, "note": "Benign overfitting and implicit regularization, with proofs."}, {"title": "Neural Tangent Kernel: Convergence and Generalization in Neural Networks", "url": "https://arxiv.org/abs/1806.07572", "type": "paper", "by": "Jacot, Gabriel, Hongler, 2018", "level": 3, "note": "In the infinite-width limit, training is kernel regression with a fixed kernel."}, {"title": "Understanding Deep Learning Notebook 20.1: Random Data", "url": "https://github.com/udlbook/udlbook/blob/main/Notebooks/Chap20/20_1_Random_Data.ipynb", "type": "project", "by": "Simon Prince, 2023", "level": 1, "build": "A network trained on MNIST-1D three ways, with true labels, with noise inputs that keep the data’s mean and variance, and with permuted labels, and the training losses compared.", "teaches": "That the same network memorizes data with no pattern at all, only more slowly, so fitting the training set says little about generalization.", "time": "an afternoon"}, {"title": "Understanding Deep Learning Notebook 8.3: Double Descent", "url": "https://github.com/udlbook/udlbook/blob/main/Notebooks/Chap08/8_3_Double_Descent.ipynb", "type": "project", "by": "Simon Prince, 2023", "level": 1, "build": "Networks of growing hidden width trained on 4,000 MNIST-1D examples, with test error plotted against capacity after predicting where both descents and the peak will fall.", "teaches": "Where the interpolation threshold sits relative to the number of training examples, and why adding parameters past it helps again.", "time": "an afternoon"}]}, {"id": "replearn", "title": "Representation learning", "kind": "concept", "track": "dl", "pre": ["backprop", "svd"], "frontier": false, "core": "A network’s hidden layers re-describe the input so that what matters for many tasks becomes simple, often linear. A good representation lets a linear probe or a small head solve a new task, and different models trained on enough data drift toward similar ones.", "reach": "The frame behind contrastive learning, JEPA, sparse autoencoders, and transfer by fine-tuning or linear probing.", "uses": "Embeddings behind semantic search, recommendations, and duplicate detection; transfer learning, where one pretrained encoder serves many tasks with few labels; face verification; and the retrieval step that feeds documents to chatbots.", "worth": "you will use embeddings or fine-tune pretrained models, which covers most applied ML; the theory of why models converge on similar representations is optional.", "resources": [{"title": "Representation Learning (Deep Learning, Chapter 15)", "url": "https://www.deeplearningbook.org/contents/representation.html", "type": "book", "by": "Goodfellow, Bengio, Courville, MIT Press, 2016", "level": 1, "note": "Greedy layerwise pretraining, transfer and domain adaptation, and what makes one representation better than another."}, {"title": "Representation Learning: A Review and New Perspectives", "url": "https://arxiv.org/abs/1206.5538", "type": "paper", "by": "Bengio, Courville, Vincent, 2013", "level": 2, "note": "The priors a good representation should encode: smoothness, multiple explanatory factors, hierarchy, and sparsity."}, {"title": "Understanding intermediate layers using linear classifier probes", "url": "https://arxiv.org/abs/1610.01644", "type": "paper", "by": "Alain, Bengio, 2016", "level": 2, "note": "The linear probe, the standard way to ask what a layer has made easy."}, {"title": "Contrastive Representation Learning", "url": "https://lilianweng.github.io/posts/2021-05-31-contrastive/", "type": "blog", "by": "Lilian Weng, 2021", "level": 2}, {"title": "The Platonic Representation Hypothesis", "url": "https://arxiv.org/abs/2405.07987", "type": "paper", "by": "Huh, Cheung
