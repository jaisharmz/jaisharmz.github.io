for Video Generation", "url": "https://lilianweng.github.io/posts/2024-04-12-diffusion-video/", "type": "blog", "by": "Lilian Weng, 2024", "level": 1}, {"title": "Video generation models as world simulators", "url": "https://openai.com/index/video-generation-models-as-world-simulators/", "type": "blog", "by": "Brooks, Peebles et al., OpenAI, 2024", "level": 1, "note": "The Sora report: spacetime patches and a diffusion transformer."}, {"title": "Movie Gen: A Cast of Media Foundation Models", "url": "https://arxiv.org/abs/2410.13720", "type": "paper", "by": "Polyak et al., Meta, 2024", "level": 2, "note": "A full recipe for a 30B model: architecture, latent space, training objective, data curation, and parallelism."}, {"title": "Wan: Open and Advanced Large-Scale Video Generative Models", "url": "https://arxiv.org/abs/2503.20314", "type": "paper", "by": "Wan Team, Alibaba, 2025", "level": 3, "note": "Open 1.3B and 14B models, with the VAE, data curation, and training described."}, {"title": "Self Forcing: Bridging the Train-Test Gap in Autoregressive Video Diffusion", "url": "https://arxiv.org/abs/2506.08009", "type": "paper", "by": "Huang, Li, He, Zhou, Shechtman, 2025", "level": 3, "note": "Each frame is trained on the model’s own earlier frames, so a few-step video model can stream in real time."}]}, {"id": "neuralrender", "title": "Neural supersampling and denoising (DLSS)", "kind": "concept", "track": "graphics", "pre": ["rendering", "resnets"], "frontier": false, "core": "Render fewer pixels and frames, and let a network fill in the rest. Using motion vectors and earlier frames, it upsamples low-resolution renders, removes the noise of ray tracing at a few samples per pixel, and generates extra frames between rendered ones.", "reach": "Makes path tracing affordable in games; DLSS 4 moved these networks from convolutions to transformers.", "resources": [{"title": "NVIDIA DLSS 2.0: A Big Leap In AI Rendering", "url": "https://www.nvidia.com/en-us/geforce/news/nvidia-dlss-2-0-a-big-leap-in-ai-rendering/", "type": "blog", "by": "Andrew Burnes, NVIDIA, 2020", "level": 1, "note": "Low-resolution frames plus motion vectors, accumulated over time and trained against 16K references."}, {"title": "DLSS 4: Transforming Real-Time Graphics with AI", "url": "https://research.nvidia.com/labs/adlr/DLSS4/", "type": "blog", "by": "NVIDIA Research, 2025", "level": 2, "note": "Multi frame generation, and transformer models for super resolution and ray-traced denoising."}, {"title": "Neural Supersampling for Real-time Rendering", "url": "https://research.facebook.com/publications/neural-supersampling-for-real-time-rendering/", "type": "paper", "by": "Xiao, Nouri, Chapman, Fix, Lanman, Kaplanyan, Facebook Reality Labs, 2020", "level": 2, "note": "A published DLSS-style network: color, depth, and motion vectors from several frames, upsampled 4 by 4 in real time."}, {"title": "Kernel-Predicting Convolutional Networks for Denoising Monte Carlo Renderings", "url": "https://jannovak.info/publications/KPCN/index.html", "type": "paper", "by": "Bako et al., Disney Research and Pixar, 2017", "level": 2, "note": "Predict a filter kernel per pixel and average its noisy neighbors with it; trained on one Pixar film, it denoises others."}, {"title": "Introducing NVIDIA DLSS 3", "url": "https://www.nvidia.com/en-us/geforce/news/dlss3-ai-powered-neural-graphics-innovations/", "type": "blog", "by": "Lin, Burnes, NVIDIA, 2022", "level": 2, "note": "The first frame generation: two rendered frames, optical flow, and motion vectors into one new frame."}, {"title": "Intel Open Image Denoise", "url": "https://www.openimagedenoise.org/", "type": "code", "by": "Intel", "level": 2, "note": "Open-source learned denoising filters for path tracers, trained from 1 sample per pixel to nearly converged."}]}, {"id": "biobasics", "title": "Molecular biology for ML researchers", "kind": "concept", "track": "bio", "pre": [], "frontier": false, "core": "A cell copies each gene’s DNA into RNA and reads it three letters at a time to chain amino acids into a protein, which folds into the shape that does its job. Every cell carries the same genome but expresses different genes.", "reach": "Sequences, structures, and per-cell expression counts are the data that structure prediction, protein and DNA language models, and single-cell models learn from.", "resources": [{"title": "MIT 7.01SC: Fundamentals of Biology", "url": "https://ocw.mit.edu/courses/7-01sc-fundamentals-of-biology-fall-2011/", "type": "course", "by": "Lander, Weinberg, Jacks, Sive, Walker, Chisholm, Mischke, MIT OCW, 2011", "level": 1, "note": "The Biochemistry and Molecular Biology units, with lecture videos and problem solving sessions."}, {"title": "Biology 2e", "url": "https://openstax.org/details/books/biology-2e", "type": "book", "by": "Clark, Douglas, Choi, OpenStax, 2018", "level": 1, "note": "Chapter 3 on biological macromolecules, then Chapters 14 to 16 on DNA, genes and proteins, and gene expression."}, {"title": "Cell Biology by the Numbers", "url": "https://book.bionumbers.org/", "type": "book", "by": "Ron Milo, Rob Phillips, 2015", "level": 2, "note": "Parts I and IV give the sizes and speeds of the molecules and machines of the central dogma."}]}, {"id": "structure", "title": "Protein structure prediction", "kind": "paper", "track": "bio", "pre": ["biobasics", "triattn"], "frontier": false, "core": "A protein’s sequence determines its 3D shape. AlphaFold 2 reads the sequence with an alignment of its evolutionary relatives, whose paired mutations show which residues touch, refines a residue pair representation with attention, and builds atom coordinates with a per-residue confidence.", "reach": "AlphaFold 3 replaces the structure module with diffusion, the step to protein generation; ESMFold replaces the alignment with a protein language model.", "resources": [{"title": "AlphaFold: A practical guide", "url": "https://www.ebi.ac.uk/training/online/courses/alphafold/", "type": "course", "by": "Magana, Kovalevskiy, EMBL-EBI with Google DeepMind, 2024", "level": 1, "note": "The introductory guide, then Inputs and outputs, which explains the pLDDT and PAE confidence scores."}, {"title": "Highly accurate protein structure prediction with AlphaFold", "url": "https://www.nature.com/articles/s41586-021-03819-2", "type": "paper", "by": "Jumper et al., DeepMind, Nature 2021", "level": 2, "note": "The Evoformer and End-to-end structure prediction sections with Figure 3; the Supplementary Information spells out every algorithm."}, {"title": "The Illustrated AlphaFold", "url": "https://elanapearl.github.io/blog/2024/the-illustrated-alphafold/", "type": "blog", "by": "Elana Simon, Jake Silberg, 2024", "level": 2, "note": "AlphaFold 3 drawn module by module, from the MSA module through the Pairformer to the diffusion module."}, {"title": "aqlaboratory/openfold", "url": "https://github.com/aqlaboratory/openfold", "type": "code", "by": "Ahdritz, AlQuraishi et al., 2022", "level": 3, "note": "A trainable PyTorch reproduction of AlphaFold 2."}, {"title": "Boltz-1: Democratizing Biomolecular Interaction Modeling", "url": "https://www.biorxiv.org/content/10.1101/2024.11.19.624167v1", "type": "paper", "by": "Wohlwend, Corso, Passaro et al., MIT, 2024", "level": 3, "note": "An open reproduction of AlphaFold 3 with training code and weights."}]}, {"id": "plm", "title": "Protein language models", "kind": "concept", "track": "bio", "pre": ["biobasics", "lm"], "frontier": false, "core": "Train a masked language model on millions of natural protein sequences. To fill in hidden amino acids it must learn which positions mutate together, so its attention recovers residue contacts, its likelihoods score mutations without labels, and ESMFold predicts structure from its embeddings.", "reach": "Replaces the alignment in structure prediction, and ESM3 extends it to generate sequence, structure, and function together for protein design.", "resources": [{"title": "Deep Learning with Proteins", "url": "https://huggingface.co/blog/deep-learning-with-proteins", "type": "blog", "by": "Matthew Carrigan, Hugging Face, 2022", "level": 1, "note": "Explains proteins to ML readers, then links notebooks that fine-tune ESM-2 and run ESMFold."}, {"title": "Evolutionary-scale prediction of atomic level protein structure with a language model", "url": "https://www.biorxiv.org/content/10.1101/2022.07.20.500902v1", "type": "paper", "by": "Lin et al., Meta AI, 2022; Science 2023", "level": 2, "note": "ESM-2 and ESMFold: contacts and structure emerge from the language model as it scales."}, {"title": "Language models enable zero-shot prediction of the effects of mutations on protein function", "url": "https://www.biorxiv.org/content/10.1101/2021.07.09.450648v1", "type": "paper", "by": "Meier et al., Meta AI, 2021", "level": 2, "note": "ESM-1v: the likelihood ratio of mutant to original amino acid predicts measured fitness with no training labels."}, {"title": "Simulating 500 million years of evolution with a language model", "url": "https://www.biorxiv.org/content/10.1101/2024.07.01.600583v1", "type": "paper", "by": "Hayes et al., EvolutionaryScale, 2024; Science 2025", "level": 3, "note": "ESM3 tokenizes sequence, structure, and function and trains one masked model over all three, then uses it to design a new fluorescent protein."}, {"title": "facebookresearch/esm", "url": "https://github.com/facebookresearch/esm", "type": "code", "by": "Meta AI, 2019 to 2023", "level": 2, "note": "Weights and examples for ESM-2, ESMFold, and ESM-1v."}]}, {"id": "proteins", "title": "Generative models for proteins and molecules", "kind": "concept", "track": "bio", "pre": ["structure", "scoresde", "fm"], "frontier": true, "core": "Represent a protein backbone as one rigid frame per residue and run diffusion or flow matching over the frames with networks that respect rotations and translations. Conditioning the generator designs binders that work in the lab, and AlphaFold 3 predicts complexes with a diffusion module.", "reach": "Where guidance, steering, and Boltzmann sampling meet a wet-lab test; search against a verifier at test time drives the 2026 binder results.", "resources": [{"title": "MIT 6.S184: Flow Matching and Diffusion Models - Lecture 06 - Diffusion for Proteins (2025)", "url": "https://www.youtube.com/watch?v=hi_s4T1-gBY", "type": "video", "by": "Jason Yim, MIT 6.S184 guest lecture, 2025", "level": 1}, {"title": "De novo design of protein structure and function with RFdiffusion", "url": "https://www.nature.com/articles/s41586-023-06415-8", "type": "paper", "by": "Watson et al., Baker lab, Nature 2023", "level": 2}, {"title": "Accurate structure prediction of biomolecular interactions with AlphaFold 3", "url": "https://www.nature.com/articles/s41586-024-07487-w", "type": "paper", "by": "Abramson et al., Google DeepMind, Nature 2024", "level": 2}, {"title": "Fast protein backbone generation with SE(3) flow matching", "url": "https://arxiv.org/abs/2310.05297", "type": "paper", "by": "Yim et al., 2023", "level": 3}, {"title": "Equivariant Diffusion for Molecule Generation in 3D", "url": "https://arxiv.org/abs/2203.17003", "type": "paper", "by": "Hoogeboom, Satorras, Vignac, Welling, 2022", "level": 3}, {"title": "Proteina: Scaling Flow-based Protein Structure Generative Models", "url": "https://arxiv.org/abs/2503.00710", "type": "paper", "by": "Geffner et al., NVIDIA, 2025", "level": 3}]}, {"id": "genomics", "title": "DNA and genomic language models", "kind": "concept", "track": "bio", "pre": ["biobasics", "lm", "ssm"], "frontier": true, "core": "Treat genomes as text in four letters and train a model to predict masked or next bases across species. The hard part is length: a regulatory element can act 100,000 bases away, so Evo 2 uses long convolutions to read a million bases at once.", "reach": "The main use of long-context state space and convolution models outside text; zero-shot variant effect scores and designed genomes follow.", "resources": [{"title": "Learning from DNA: a grand challenge in biology", "url": "https://hazyresearch.stanford.edu/blog/2024-03-14-evo", "type": "blog", "by": "Eric Nguyen, Michael Poli et al., Hazy Research and Arc Institute, 2024", "level": 1, "note": "Why DNA is hard for transformers, DNA scaling laws, and Evo’s zero-shot predictions."}, {"title": "Genomic Language Models: Opportunities and Challenges", "url": "https://arxiv.org/abs/2407.11435", "type": "paper", "by": "Benegas, Ye, Albors, Li, Song, 2024", "level": 2, "note": "What DNA language models are used for, from predicting which bases are under constraint to sequence design, and what makes them hard to build and evaluate."}, {"title": "Genome modelling and design across all domains of life with Evo 2", "url": "https://www.nature.com/articles/s41586-026-10176-5", "type": "paper", "by": "Brixi et al., Arc Institute, Nature 2026", "level": 2, "note": "A model trained on genomes from across the tree of life with a million base context, scoring variants zero-shot and generating genome-scale sequences."}, {"title": "Effective gene expression prediction from sequence by integrating long-range interactions", "url": "https://www.nature.com/articles/s41592-021-01252-x", "type": "paper", "by": "Avsec et al., DeepMind, Nature Methods 2021", "level": 2, "note": "Enformer, the supervised counterpart: it predicts thousands of measured genomic tracks from about 200,000 bases of sequence."}, {"title": "HyenaDNA: Long-Range Genomic Sequence Modeling at Single Nucleotide Resolution", "url": "https://arxiv.org/abs/2306.15794", "type": "paper", "by": "Nguyen, Poli et al., Stanford, 2023", "level": 3, "note": "The long-convolution predecessor of Evo, with context up to a million tokens."}]}, {"id": "singlecell", "title": "Single-cell foundation models", "kind": "concept", "track": "bio", "pre": ["biobasics", "attention", "lm"], "frontier": true, "core": "Each cell is a vector of counts over about 20,000 genes. Treat genes as tokens, mask some, and pretrain a transformer on tens of millions of cells, hoping its embeddings capture cell state; zero-shot tests found simpler methods often beat them.", "reach": "The step toward a virtual cell that predicts responses to perturbations; the benchmark failures make evaluation and interpretability the open problems.", "resources": [{"title": "Single-cell best practices", "url": "https://www.sc-best-practices.org/", "type": "book", "by": "Heumos, Schaar et al., scverse, 2023", "level": 1, "note": "The Introduction and RNA parts: what a count matrix measures and the standard analysis built on it."}, {"title": "scGPT: Towards Building a Foundation Model for Single-Cell Multi-omics Using Generative AI", "url": "https://www.biorxiv.org/content/10.1101/2023.04.30.538439v1", "type": "paper", "by": "Cui et al., Bo Wang lab, 2023; Nature Methods 2024", "level": 2, "note": "Genes as tokens with their expression values, masked generative pretraining on 33 million cells, and fine-tuning for annotation, integration, and perturbation response."}, {"title": "Zero-shot evaluation reveals limitations of single-cell foundation models", "url": "https://link.springer.com/article/10.1186/s13059-025-03574-x", "type": "paper", "by": "Kedzierska, Crawford, Amini, Lu, Microsoft Research, Genome Biology 2025", "level": 2, "note": "Zero-shot scGPT and Geneformer embeddings against simpler methods on cell type clustering and batch correction."}, {"title": "Transfer learning enables predictions in network biology", "url": "https://www.nature.com/articles/s41586-023-06139-9", "type": "paper", "by": "Theodoris et al., Nature 2023", "level": 2, "note": "Geneformer ranks each cell’s genes by expression instead of using counts, the main alternative to scGPT’s input.", "paid": true}, {"title": "How to Build the Virtual Cell with Artificial Intelligence: Priorities and Opportunities", "url": "https://arxiv.org/abs/2409.11654", "type": "paper", "by": "Bunne, Roohani, Rosen et al., 2024", "level": 3, "note": "The research program these models serve: a model of the cell that predicts how it responds to perturbations."}]}, {"id": "pinn", "title": "Physics-informed neural networks", "kind": "concept", "track": "science", "pre": ["backprop", "odes"], "frontier": false, "core": "Fit a network u(x, t) to sparse data while penalizing its PDE residual at random points, with derivatives from automatic differentiation. The physics acts as a regularizer, so one loss solves forward and inverse problems without a mesh, though multiscale problems often fail to train.", "reach": "Neural operators learn the whole solution map instead of one solution; differentiable solvers in the loop are the other way to train with physics.", "resources": [{"title": "So, what is a physics-informed neural network?", "url": "https://benmoseley.blog/my-research/so-what-is-a-physics-informed-neural-network/", "type": "blog", "by": "Ben Moseley, 2021", "level": 1, "note": "Fits a damped harmonic oscillator with and without the physics loss, with code."}, {"title": "Physics Informed Deep Learning (Part I): Data-driven Solutions of Nonlinear Partial Differential Equations", "url": "https://arxiv.org/abs/1711.10561", "type": "paper", "by": "Raissi, Perdikaris, Karniadakis, 2017", "level": 2, "note": "Published with Part II as the 2019 Journal of Computational Physics paper on PINNs."}, {"title": "Physics-Based Deep Learning", "url": "https://physicsbaseddeeplearning.org/", "type": "book", "by": "Nils Thuerey et al., TU Munich, 2021", "level": 2, "note": "The Physical Loss Terms chapter trains a PINN on Burgers’ equation; the Differentiable Physics chapters compare it with a solver in the loop."}, {"title": "Characterizing possible failure modes in physics-informed neural networks", "url": "https://arxiv.org/abs/2109.01050", "type": "paper", "by": "Krishnapriyan, Gholami, Zhe, Kirby, Mahoney, 2021", "level": 3, "note": "The physics loss makes simple convection and reaction problems hard to optimize; curriculum training and solving in short time windows fix them."}]}, {"id": "operators", "title": "Neural operators", "kind": "concept", "track": "science", "pre": ["pinn"], "frontier": false, "core": "Learn the map from one function to another, such as initial condition to solution at a later time, instead of solving one instance. A Fourier neural operator applies learned weights to low Fourier modes, so one trained model solves new instances fast at any resolution.", "reach": "FourCastNet runs it on the whole globe for weather; physics-informed neural operators add the PINN residual to the training loss.", "resources": [{"title": "Fourier Neural Operator", "url": "https://zongyi-li.github.io/blog/2020/fourier-pde/", "type": "blog", "by": "Zongyi Li, 2020", "level": 1, "note": "Operator learning, the Fourier layer, and why it is resolution invariant, with Burgers, Darcy, and Navier-Stokes results."}, {"title": "Fourier Neural Operator for Parametric Partial Differential Equations", "url": "https://arxiv.org/abs/2010.08895", "type": "paper", "by": "Li, Kovachki, Azizzadenesheli, Liu, Bhattacharya, Stuart, Anandkumar, 2020", "level": 2}, {"title": "DeepONet: Learning nonlinear operators for identifying differential equations based on the universal approximation theorem of operators", "url": "https://arxiv.org/abs/1910.03193", "type": "paper", "by": "Lu, Jin, Karniadakis, 2019", "level": 2, "note": "The other main design: a branch net encodes the input function and a trunk net encodes the query point."}, {"title": "Fourier Neural Operators Explained: A Practical Perspective", "url": "https://arxiv.org/abs/2512.01421", "type": "paper", "by": "Duruisseaux, Kossaifi, Anandkumar, 2025", "level": 2, "note": "Design choices and pitfalls in practice, from the authors of the neuraloperator library."}, {"title": "Neural Operator: Learning Maps Between Function Spaces", "url": "https://arxiv.org/abs/2108.08481", "type": "paper", "by": "Kovachki, Li, Liu, Azizzadenesheli, Bhattacharya, Stuart, Anandkumar, 2021", "level": 3, "note": "The general definition as stacked integral operators, a universal approximation theorem, and discretization invariance."}]}, {"id": "weather", "title": "ML weather and climate models", "kind": "concept", "track": "science", "pre": ["operators", "gnns", "scoresde"], "frontier": true, "core": "Train a network on decades of reconstructed past weather to step the atmosphere 6 hours ahead, then roll it forward. GraphCast passes messages on a mesh over the globe and beats the leading physics model on most targets; GenCast samples ensembles with diffusion.", "reach": "Operators, GNNs, and diffusion meet real physics here; hybrids such as NeuralGCM keep a physics solver for the large-scale flow and learn the rest.", "resources": [{"title": "GraphCast: AI model for faster and more accurate global weather forecasting", "url": "https://deepmind.google/discover/blog/graphcast-ai-model-for-faster-and-more-accurate-global-weather-forecasting/", "type": "blog", "by": "Google DeepMind, 2023", "level": 1}, {"title": "GraphCast: Learning skillful medium-range global weather forecasting", "url": "https://arxiv.org/abs/2212.12794", "type": "paper", "by": "Lam et al., Google DeepMind, 2022; Science 2023", "level": 2}, {"title": "Probabilistic weather forecasting with machine learning", "url": "https://www.nature.com/articles/s41586-024-08252-9", "type": "paper", "by": "Price et al., Google DeepMind, Nature 2024", "level": 2, "note": "GenCast: a conditional diffusion model whose sampled ensembles beat the leading physics ensemble."}, {"title": "Neural general circulation models for weather and climate", "url": "https://www.nature.com/articles/s41586-024-07744-y", "type": "paper", "by": "Kochkov et al., Google, Nature 2024", "level": 3, "note": "NeuralGCM: a differentiable solver for the large-scale dynamics with learned physics for the rest, stable enough for climate runs."}, {"title": "FourCastNet: A Global Data-driven High-resolution Weather Model using Adaptive Fourier Neural Operators", "url": "https://arxiv.org/abs/2202.11214", "type": "paper", "by": "Pathak et al., NVIDIA, 2022", "level": 3, "note": "The neural operator route to the same problem."}, {"title": "WeatherBench 2: A benchmark for the next generation of data-driven global weather models", "url": "https://arxiv.org/abs/2308.15560", "type": "paper", "by": "Rasp et al., Google, 2023", "level": 3, "note": "The shared data, metrics, and baselines these models are scored on."}]}, {"id": "mlip", "title": "Machine-learned interatomic potentials", "kind": "concept", "track": "science", "pre": ["geometric"], "frontier": true, "core": "Quantum chemistry gives accurate energies and forces for atoms, but its cost grows roughly as the cube of their number. Fit an equivariant network to its energies, take forces as the negative gradient, and run molecular dynamics far faster at nearly the same accuracy.", "reach": "Universal potentials trained across the periodic table, such as MACE-MP-0, act as foundation models for chemistry and materials.", "resources": [{"title": "A practical guide to machine learning interatomic potentials -- Status and future", "url": "https://arxiv.org/abs/2503.09814", "type": "paper", "by": "Jacobs, Morgan et al., 2025", "level": 1, "note": "A review for newcomers: how the model families work, what universal potentials can do, and how to pick one."}, {"title": "E(3)-equivariant graph neural networks for data-efficient and accurate interatomic potentials", "url": "https://www.nature.com/articles/s41467-022-29939-5", "type": "paper", "by": "Batzner et al., Harvard, Nature Communications 2022", "level": 2, "note": "NequIP: equivariant features match earlier models with up to a thousand times less training data."}, {"title": "MACE: Higher Order Equivariant Message Passing Neural Networks for Fast and Accurate Force Fields", "url": "https://arxiv.org/abs/2206.07697", "type": "paper", "by": "Batatia, Kovács, Simm, Ortner, Csányi, 2022", "level": 2, "note": "Four-body messages cut message passing to two layers, which makes it fast."}, {"title": "A foundation model for atomistic materials chemistry", "url": "https://arxiv.org/abs/2401.00096", "type": "paper", "by": "Batatia et al., 2023", "level": 3, "note": "MACE-MP-0: one model trained on a public materials dataset that runs stable dynamics for a wide range of molecules and materials."}, {"title": "ACEsuit/mace", "url": "https://github.com/ACEsuit/mace", "type": "code", "by": "Batatia, Kovács, Csányi et al., 2022", "level": 2, "note": "Training code and pretrained foundation models."}]}, {"id": "sbi", "title": "Simulation-based inference", "kind": "concept", "track": "science", "pre": ["nf", "montecarlo"], "frontier": false, "core": "When a simulator can generate data from parameters but its likelihood cannot be written down, simulate many parameter and data pairs and train a network, often a normalizing flow, to output the posterior given data. Inference on a new observation is then one forward pass.", "reach": "Used across physics, neuroscience, and epidemiology; flow matching and diffusion estimators now replace flows, and coverage checks catch overconfident posteriors.", "resources": [{"title": "The frontier of simulation-based inference", "url": "https://arxiv.org/abs/1911.01429", "type": "paper", "by": "Cranmer, Brehmer, Louppe, 2019; PNAS 2020", "level": 1}, {"title": "sbi", "url": "https://sbi.readthedocs.io/en/stable/", "type": "code", "by": "Macke lab and contributors, 2020", "level": 1, "note": "Getting started, then the Hodgkin-Huxley example."}, {"title": "Fast ε-free Inference of Simulation Models with Bayesian Conditional Density Estimation", "url": "https://arxiv.org/abs/1605.06376", "type": "paper", "by": "Papamakarios, Murray, 2016", "level": 2, "note": "Neural posterior estimation: train a conditional density network on simulations and read off the posterior."}, {"title": "Benchmarking Simulation-Based Inference", "url": "https://arxiv.org/abs/2101.04653", "type": "paper", "by": "Lueckmann, Boelts, Greenberg, Gonçalves, Macke, 2021", "level": 3, "note": "Neural methods generally beat classical ABC, but none wins everywhere and the metric matters."}, {"title": "A Trust Crisis In Simulation-Based Inference? Your Posterior Approximations Can Be Unfaithful", "url": "https://arxiv.org/abs/2110.06581", "type": "paper", "by": "Hermans, Delaunoy, Rozet, Wehenkel, Begy, Louppe, 2021", "level": 3, "note": "Every benchmarked method can return overconfident posteriors; ensembles help."}]}, {"id": "adversarial", "title": "Adversarial examples and robustness", "kind": "concept", "track": "safety", "pre": ["backprop", "optim"], "frontier": false, "core": "A small input change chosen with the gradient, invisible to people, can flip a classifier’s answer. The fast gradient sign method takes one step along the sign of the input gradient; adversarial training trains on the worst perturbations projected gradient descent finds.", "reach": "Robustness costs clean accuracy. The same min-max view returns in jailbreaks, where the input is text and the goal is to defeat refusal.", "resources": [{"title": "Adversarial Robustness - Theory and Practice", "url": "https://adversarial-ml-tutorial.org/", "type": "tutorial", "by": "Zico Kolter, Aleksander Madry, NeurIPS 2018", "level": 1, "note": "Chapters 3 and 4: attacks as the inner maximization and adversarial training as the outer minimization, with PyTorch code."}, {"title": "Explaining and Harnessing Adversarial Examples", "url": "https://arxiv.org/abs/1412.6572", "type": "paper", "by": "Goodfellow, Shlens, Szegedy, 2014", "level": 2, "note": "Locally linear behavior explains adversarial examples and gives the fast gradient sign method."}, {"title": "Towards Deep Learning Models Resistant to Adversarial Attacks", "url": "https://arxiv.org/abs/1706.06083", "type": "paper", "by": "Madry, Makelov, Schmidt, Tsipras, Vladu, 2017", "level": 2, "note": "Robustness as a min-max problem, trained against projected gradient descent."}, {"title": "Obfuscated Gradients Give a False Sense of Security: Circumventing Defenses to Adversarial Examples", "url": "https://arxiv.org/abs/1802.00420", "type": "paper", "by": "Athalye, Carlini, Wagner, 2018", "level": 3, "note": "Many published defenses only hid the gradient, and attacks adapted to each defense broke them."}, {"title": "Adversarial Examples Are Not Bugs, They Are Features", "url": "https://arxiv.org/abs/1905.02175", "type": "paper", "by": "Ilyas, Santurkar, Tsipras, Engstrom, Tran, Madry, 2019", "level": 3, "note": "Perturbations exploit real but brittle features that predict the label."}]}, {"id": "jailbreaks", "title": "Jailbreaks and red teaming", "kind": "concept", "track": "safety", "pre": ["adversarial", "rlhf"], "frontier": false, "core": "Safety training teaches a model to refuse harmful requests; a jailbreak is an input that makes it comply anyway. Attacks find one with gradients over suffix tokens, an attacker model that rewrites the prompt, or hundreds of fake dialogue turns in a long context.", "reach": "Red teaming runs these attacks before release and feeds evaluations; classifier defenses and refusal directions found by probing are the counters.", "resources": [{"title": "Adversarial Attacks on LLMs", "url": "https://lilianweng.github.io/posts/2023-10-25-adv-attack-llm/", "type": "blog", "by": "Lilian Weng, 2023", "level": 1}, {"title": "Universal and Transferable Adversarial Attacks on Aligned Language Models", "url": "https://arxiv.org/abs/2307.15043", "type": "paper", "by": "Zou, Wang, Carlini, Nasr, Kolter, Fredrikson, 2023", "level": 2, "note": "GCG: greedy coordinate gradient search finds suffixes that transfer from open models to closed ones."}, {"title": "Jailbreaking Black Box Large Language Models in Twenty Queries", "url": "https://arxiv.org/abs/2310.08419", "type": "paper", "by": "Chao, Robey, Dobriban, Hassani, Pappas, Wong, 2023", "level": 2, "note": "PAIR: an attacker model refines the prompt from the target’s replies, with no gradients."}, {"title": "Many-shot jailbreaking", "url": "https://www.anthropic.com/research/many-shot-jailbreaking", "type": "blog", "by": "Anil et al., Anthropic, 2024", "level": 2, "note": "Success grows as a power law in the number of faked dialogues, like ordinary in-context learning; the post links the full paper."}, {"title": "HarmBench: A Standardized Evaluation Framework for Automated Red Teaming and Robust Refusal", "url": "https://arxiv.org/abs/2402.04249", "type": "paper", "by": "Mazeika et al., 2024", "level": 2, "note": "One benchmark and judge that compares 18 attacks against 33 models and defenses."}, {"title": "Constitutional Classifiers: Defending against Universal Jailbreaks across Thousands of Hours of Red Teaming", "url": "https://arxiv.org/abs/2501.18837", "type": "paper", "by": "Sharma et al., Anthropic, 2025", "level": 3, "note": "Input and output classifiers trained on synthetic data from a written constitution."}]}, {"id": "evals", "title": "Evaluations and dangerous capabilities", "kind": "concept", "track": "safety", "pre": ["agents", "jailbreaks"], "frontier": true, "core": "Before release, test whether a model can help build a bioweapon, hack, or copy itself, eliciting its best effort with agent scaffolds. METR tracks the task length, in human working time, at which agents succeed half the time; it has doubled about every seven months.", "reach": "Evaluations set the thresholds in labs’ safety policies; sandbagging is why oversight and control cannot rely on them alone.", "resources": [{"title": "Measuring AI Ability to Complete Long Software Tasks", "url": "https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/", "type": "blog", "by": "Kwa, West et al., METR, 2025", "level": 1, "note": "The 50% time horizon and its trend; the full paper is arXiv 2503.14499."}, {"title": "Model evaluation for extreme risks", "url": "https://arxiv.org/abs/2305.15324", "type": "paper", "by": "Shevlane et al., Google DeepMind and others, 2023", "level": 2, "note": "Separates dangerous capability evaluations from alignment evaluations and places both in decisions about training and release."}, {"title": "Evaluating Frontier Models for Dangerous Capabilities", "url": "https://arxiv.org/abs/2403.13793", "type": "paper", "by": "Phuong et al., Google DeepMind, 2024", "level": 2, "note": "A concrete suite on persuasion and deception, cyber security, self-proliferation, and self-reasoning, run on Gemini 1.0."}, {"title": "Inspect", "url": "https://inspect.aisi.org.uk/", "type": "code", "by": "UK AI Security Institute, 2024", "level": 2, "note": "An open framework for writing and running evaluations, including agent tasks."}, {"title": "AI Sandbagging: Language Models can Strategically Underperform on Evaluations", "url": "https://arxiv.org/abs/2406.07358", "type": "paper", "by": "van der Weij, Hofstätter, Jaffe, Brown, Ward, 2024", "level": 3, "note": "Models prompted or fine-tuned to fail dangerous capability evaluations while keeping general performance."}]}, {"id": "oversight", "title": "Scalable oversight and AI control", "kind": "concept", "track": "safety", "pre": ["rlhf", "evals"], "frontier": true, "core": "Once models outperform their supervisors, supervision needs help. Scalable oversight makes judging easier, for example by having two models debate so a weaker judge can find the truth; AI control assumes the model may be scheming and designs monitoring that stays safe anyway.", "reach": "Training a strong model on a weak model’s labels makes the problem an experiment; model organisms supply the misaligned models control must catch.", "resources": [{"title": "The case for ensuring that powerful AIs are controlled", "url": "https://blog.redwoodresearch.org/p/the-case-for-ensuring-that-powerful", "type": "blog", "by": "Greenblatt, Shlegeris, Redwood Research, 2024", "level": 1}, {"title": "AI safety via debate", "url": "https://arxiv.org/abs/1805.00899", "type": "paper", "by": "Irving, Christiano, Amodei, OpenAI, 2018", "level": 2, "note": "Two agents argue and a judge picks the winner; with optimal play, a polynomial time judge can settle any question in PSPACE."}, {"title": "AI Control: Improving Safety Despite Intentional Subversion", "url": "https://arxiv.org/abs/2312.06942", "type": "paper", "by": "Greenblatt, Shlegeris, Sachan, Roger, 2023", "level": 2, "note": "GPT-3.5 as a trusted monitor of an untrusted GPT-4 writing code, while a red team plays the scheming model and tries to slip in backdoors."}, {"title": "Weak-to-Strong Generalization: Eliciting Strong Capabilities With Weak Supervision", "url": "https://arxiv.org/abs/2312.09390", "type": "paper", "by": "Burns et al., OpenAI, 2023", "level": 2, "note": "GPT-4 fine-tuned on labels from a GPT-2 level supervisor beats its supervisor, a stand-in for people supervising stronger models."}, {"title": "Debating with More Persuasive LLMs Leads to More Truthful Answers", "url": "https://arxiv.org/abs/2402.06782", "type": "paper", "by": "Khan et al., 2024", "level": 3, "note": "Judges who cannot see the source text answer more accurately after watching debates, and more so as debaters get more persuasive."}]}, {"id": "deception", "title": "Model organisms of misalignment", "kind": "concept", "track": "safety", "pre": ["overopt", "probing"], "frontier": true, "core": "Build models that misbehave on purpose, such as one that writes exploitable code when told the year is 2024, and test whether safety training removes it. In Sleeper Agents it survived RLHF and adversarial training; Claude 3 Opus later faked alignment without being told to.", "reach": "Gives oversight, control, and interpretability concrete targets: linear probes on activations caught the sleeper agents about to defect.", "resources": [{"title": "Model Organisms of Misalignment: The Case for a New Pillar of Alignmen     const ns = trackNodes(tid), [d, tot] = trackProg(tid);
    panel.append(closeBtn,
      el("p", { class: "pk" }, el("span", { class: "dot", style: `--c:var(--f-${t.family})` }), "Track", el("span", { class: "badge", text: `${ns.length} ideas` })),
      el("h2", { id: "ptitle", text: t.label }),
      el("div", { class: "prog" }, el("span", { class: "bar" }, el("i", { style: `width:${tot ? 100 * d / tot : 0}%` })), el("span", { text: `${d} / ${tot}` })),
      el("p", { class: "core", text: t.core }));
    const go = el("button", { class: "primary", text: "Open this track on the map" });
    go.onclick = () => { close(); setView("map"); focusTrack(tid); };
    panel.append(go);
    panel.append(el("p", { class: "sec", text: "Learn first" }), trackChips(tUp[tid] || [], "Nothing. The map starts here."));
    panel.append(el("p", { class: "sec", text: "Leads to" }), trackChips(tDown[tid] || [], "Nothing further on this map."));
    const inL = DATA.trackLinks.filter(x => x.to === tid).sort((a, b) => b.links - a.links);
    const outL = DATA.trackLinks.filter(x => x.from === tid).sort((a, b) => b.links - a.links);
    const fmt = (arr, key) => arr.map(x => `${trackById[x[key]].label} (${x.links})`).join(", ");
    panel.append(el("p", { class: "sec", text: "Every link to other tracks" }),
      el("p", { class: "tlinks", text: (inL.length ? `Its ideas build on ideas in ${fmt(inL, "from")}.` : "Its ideas build on nothing outside it.")
        + (outL.length ? ` Ideas in ${fmt(outL, "to")} build on it.` : "") + " The numbers count prerequisite arrows between ideas; the track map draws the ones a learner needs first." }));
    const roots = ns.filter(n => !n.pre.some(p => byId[p].track === tid));
    const startBox = el("div", { class: "links" });
    for (const n of roots) { const b = el("button", { style: `--c:var(--f-${t.family})` }, el("span", { class: "dot" }), n.title); b.onclick = () => openOnMap(n.id); startBox.append(b); }
    panel.append(el("p", { class: "sec", text: "Start with" }), startBox);
    const ol = el("ul", { class: "ideas" });
    for (const n of ns) {
      const [dd, tt] = prog(n);
      const b = el("button", {}, el("span", { class: "it" }, n.title, el("span", { class: "ik", text: [tagOf(n), badgeOf(n)].filter(Boolean).join(" · ") })), el("span", { class: "ip", text: `${dd}/${tt}` }));
      b.onclick = () => openOnMap(n.id);
      ol.append(el("li", {}, b));
    }
    panel.append(el("p", { class: "sec", text: "Its ideas, in order" }), ol);
    panel.hidden = false; scrim.hidden = innerWidth > 720; panel.scrollTop = 0;
    highlightTrack(tid); highlight(null);
    try { history.replaceState(null, "", "#track-" + tid); } catch (e) {}
    if (!opts.noFocus) closeBtn.focus({ preventScroll: true });
  }
  addEventListener("resize", () => { if (!tview.hidden) renderTrackMap(); });

  // views
  const views = { tracks: tview, map: document.getElementById("map"), list: document.getElementById("list"), about: document.getElementById("about") };
  let mapReady = false;
  function setView(v) {
    for (const [k, node] of Object.entries(views)) node.hidden = k !== v;
    for (const k of Object.keys(views)) document.getElementById("v-" + k).setAttribute("aria-pressed", String(k === v));
    if (v === "map") { if (!mapReady) { mapReady = true; initMap(); } else apply(); }
    if (v === "tracks") renderTrackMap();
  }
  for (const k of Object.keys(views)) document.getElementById("v-" + k).onclick = () => setView(k);

  // search
  const q = document.getElementById("q"), results = document.getElementById("results");
  let hits = [], hi = 0;
  const hideResults = () => { results.hidden = true; q.setAttribute("aria-expanded", "false"); for (const n of DATA.nodes) nodeEls[n.id].btn.classList.remove("hit"); };
  function search() {
    const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    for (const n of DATA.nodes) nodeEls[n.id].btn.classList.remove("hit");
    if (!words.length) { hideResults(); return; }
    hits = [];
    for (const n of DATA.nodes) {
      const head = (n.title + " " + trackById[n.track].label).toLowerCase();
      const body = (n.core + " " + (n.reach || "") + " " + n.resources.map(r => r.title + " " + r.by).join(" ")).toLowerCase();
      if (!words.every(w => head.includes(w) || body.includes(w))) continue;
      const res = n.resources.find(r => words.every(w => (r.title + " " + r.by).toLowerCase().includes(w)));
      hits.push({ n, score: words.every(w => head.includes(w)) ? 0 : 1, res });
    }
    hits.sort((a, b) => a.score - b.score);
    results.textContent = ""; hi = 0;
    if (!hits.length) results.append(el("div", { class: "rm", style: "padding:.5rem .6rem", text: "No idea or resource matches." }));
    hits.slice(0, 12).forEach((h, i) => {
      nodeEls[h.n.id].btn.classList.add("hit");
      const b = el("button", { role: "option", "aria-selected": String(i === 0) },
        el("div", { class: "rt", text: h.n.title }),
        el("div", { class: "rm", text: h.res ? "Resource: " + h.res.title : trackById[h.n.track].label }));
      b.addEventListener("click", () => { pick(h.n.id); });
      results.append(b);
    });
    results.hidden = false; q.setAttribute("aria-expanded", "true");
  }
  function pick(id) { hideResults(); q.blur(); if (map.hidden) setView("map"); open(id, { minS: .85 }); }
  q.addEventListener("input", search);
  q.addEventListener("keydown", ev => {
    const opts = [...results.querySelectorAll("button")];
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault(); if (!opts.length) return;
      hi = (hi + (ev.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.setAttribute("aria-selected", String(i === hi)));
    } else if (ev.key === "Enter" && hits[hi]) { ev.preventDefault(); pick(hits[hi].n.id); }
  });
  document.addEventListener("click", ev => { if (!ev.target.closest(".search")) { results.hidden = true; q.setAttribute("aria-expanded", "false"); } });

  // first frame: the track map, or the idea or track named in the link
  renderTotals();
  function start() {
    const h = location.hash.slice(1);
    if (byId[h]) { setView("map"); open(h, { noFocus: true, minS: .85 }); return; }
    setView("tracks");
    if (h.startsWith("track-") && trackById[h.slice(6)]) openTrack(h.slice(6), { noFocus: true });
  }
  // the detailed map's first view: the foundations and the row under them, readable
  function initMap() {
    const r = map.getBoundingClientRect();
    const firstTrack = Object.keys(L.tracks).sort((p, q) => L.tracks[p].y - L.tracks[q].y || L.tracks[p].x - L.tracks[q].x)[0], f = L.tracks[firstTrack];
    if (r.width <= 720) {
      const top = DATA.nodes.filter(n => n.track === firstTrack).map(n => L.nodes[n.id]).sort((p, q) => p.y - q.y)[0];
      s = .62; tx = r.width / 2 - top.x * s; ty = 12 - f.y * s; apply(); return;
    }
    s = Math.min(.9, Math.max(.6, (r.width - 48) / (f.w + 600)));
    tx = r.width / 2 - (f.x + f.w / 2) * s; ty = 16 - f.y * s; apply();
  }
  start();
  addEventListener("resize", () => drawMini());
})();

</script>
</body>
</html>
