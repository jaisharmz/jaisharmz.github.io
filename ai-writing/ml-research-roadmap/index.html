, "made": true, "done": "Throughput comes within 10 percent of the repository’s benchmark, where nano-vllm reaches 1,434 tokens per second against vLLM’s 1,362 on one laptop GPU."}]}, {"id": "pagedattn", "title": "PagedAttention", "kind": "paper", "track": "sys", "pre": ["serving", "kvattn"], "frontier": false, "core": "Store each request’s KV cache in fixed-size blocks, with a block table mapping logical to physical blocks, like virtual memory pages. Waste falls from most of the cache to under 4%, and requests can share blocks, but the attention kernel must follow the table.", "reach": "Copy-on-write sharing makes parallel sampling and beam search cheap; RadixAttention in SGLang extends sharing to common prefixes across requests.", "uses": "The vLLM serving engine, where it was introduced, and the paged KV caches in TensorRT-LLM, SGLang, and Hugging Face TGI, which let one GPU hold many more concurrent chat sessions.", "worth": "you build or tune inference servers; everyone else gets the benefit for free from vLLM or a hosted API without knowing the details.", "resources": [{"title": "vLLM: Easy, Fast, and Cheap LLM Serving with PagedAttention", "url": "https://vllm.ai/blog/2023-06-20-vllm", "type": "blog", "by": "Kwon, Li et al., Berkeley, 2023", "level": 1, "note": "Animations of blocks being allocated and shared during generation."}, {"title": "Efficient Memory Management for Large Language Model Serving with PagedAttention", "url": "https://arxiv.org/abs/2309.06180", "type": "paper", "by": "Kwon et al., Berkeley, 2023", "level": 2, "note": "Section 3 measures how much memory earlier servers waste; Section 4 builds the block table, sharing and copy-on-write."}, {"title": "Paging: Introduction", "url": "https://pages.cs.wisc.edu/~remzi/OSTEP/vm-paging.pdf", "type": "book", "by": "Remzi and Andrea Arpaci-Dusseau, Operating Systems: Three Easy Pieces", "level": 1, "note": "Chapter 18, the operating system idea being borrowed: fixed-size pages and a page table."}, {"title": "Fast and Expressive LLM Inference with RadixAttention and SGLang", "url": "https://lmsys.org/blog/2024-01-17-sglang/", "type": "blog", "by": "Zheng et al., LMSYS, 2024", "level": 2, "note": "RadixAttention keeps finished requests’ cache in a radix tree over tokens, so a later prompt sharing a prefix reuses it."}, {"title": "GeeeekExplorer/nano-vllm", "url": "https://github.com/GeeeekExplorer/nano-vllm", "type": "code", "by": "GeeeekExplorer, 2025", "level": 3, "note": "About 1,200 lines of Python; nanovllm/engine/block_manager.py holds the blocks, reference counts and prefix cache."}, {"title": "vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention", "url": "https://arxiv.org/abs/2405.04437", "type": "paper", "by": "Prabhu et al., Microsoft Research, 2024", "level": 3, "note": "The counterpoint: keep the cache contiguous in virtual memory and let CUDA’s virtual memory API page it, so unmodified kernels work."}, {"title": "A paged KV cache allocator", "url": "https://arxiv.org/abs/2309.06180", "type": "project", "by": "Built on Kwon et al., 2023", "level": 2, "build": "A KV cache manager with 16-token blocks, a block table per request, reference counts, and copy-on-write, replayed on ShareGPT request lengths beside contiguous reservation at maximum length.", "teaches": "Where KV cache memory goes, and why fixed-size pages trade a little internal waste for no external fragmentation and cheap sharing.", "time": "a day", "made": true, "done": "Token states fill about 96 percent of allocated memory with paging, against 20 to 38 percent for contiguous reservation, as in Figure 2."}]}, {"id": "specdec", "title": "Speculative decoding", "kind": "concept", "track": "sys", "pre": ["serving"], "frontier": false, "core": "A small draft model guesses several tokens cheaply, and the large model checks them all in one forward pass, keeping the longest accepted run. A rejection-sampling rule makes the output distribution exactly the large model’s, so the speedup costs no quality.", "reach": "Draft heads such as Medusa and EAGLE are the common variants; the gain depends on how memory-bound decoding is.", "uses": "Faster responses in production LLM serving: Google reports using it to speed up AI Overviews in Search, and vLLM, SGLang, and TensorRT-LLM support draft models and EAGLE-style heads.", "worth": "you serve models and care about latency; it is a short read once you know why decoding is memory-bound, and model users can skip it.", "resources": [{"title": "Looking back at speculative decoding", "url": "https://research.google/blog/looking-back-at-speculative-decoding/", "type": "blog", "by": "Leviathan, Kalman, et al., Google Research, 2024", "level": 1}, {"title": "Fast Inference from Transformers via Speculative Decoding", "url": "https://arxiv.org/abs/2211.17192", "type": "paper", "by": "Leviathan, Kalman, Matias, 2023", "level": 2}, {"title": "Medusa: Simple LLM Inference Acceleration Framework with Multiple Decoding Heads", "url": "https://arxiv.org/abs/2401.10774", "type": "paper", "by": "Cai et al., 2024", "level": 2}, {"title": "EAGLE: Speculative Sampling Requires Rethinking Feature Uncertainty", "url": "https://arxiv.org/abs/2401.15077", "type": "paper", "by": "Li, Wei, Zhang, Zhang, 2024", "level": 3}, {"title": "Implement speculative sampling and measure its acceptance rate", "url": "https://arxiv.org/abs/2211.17192", "type": "project", "by": "Built on Leviathan, Kalman, Matias, 2023", "level": 2, "build": "The draft loop around two open models of different sizes, the rejection rule that keeps the large model’s distribution, and a measurement of the acceptance rate and tokens per target pass.", "teaches": "That the speedup is a function of one number you can measure, and that correctness comes from the rejection rule rather than from the draft being good.", "time": "a weekend", "made": true, "done": "Measured tokens per target pass match Equation 1 within 5 percent at gamma of 7, and a bigram draft still gives an acceptance rate near the paper’s 0.20."}]}, {"id": "quant", "title": "Quantization and distillation", "kind": "concept", "track": "sys", "pre": ["serving", "training"], "frontier": false, "core": "Store weights, and sometimes activations, in 8 or 4 bits instead of 16, cutting the memory traffic that bounds decoding; the hard part is the few outlier values. Distillation instead trains a smaller student to match a larger teacher’s output distribution.", "reach": "Pairs with serving and speculative decoding; QLoRA fine-tunes a 4-bit base model.", "uses": "Running LLMs on laptops and phones through llama.cpp and GGUF files, cheaper serving with 8-bit and 4-bit weights, QLoRA fine-tuning on one GPU, and distilled models such as DistilBERT and the smaller Gemma 2 sizes.", "worth": "you deploy models on limited hardware or serve them at scale; API users only need to know that quantization trades a little accuracy for cost.", "resources": [{"title": "A Visual Guide to Quantization", "url": "https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization", "type": "blog", "by": "Maarten Grootendorst, 2024", "level": 1}, {"title": "Distilling the Knowledge in a Neural Network", "url": "https://arxiv.org/abs/1503.02531", "type": "paper", "by": "Hinton, Vinyals, Dean, 2015", "level": 2}, {"title": "LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale", "url": "https://arxiv.org/abs/2208.07339", "type": "paper", "by": "Dettmers et al., 2022", "level": 2}, {"title": "GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers", "url": "https://arxiv.org/abs/2210.17323", "type": "paper", "by": "Frantar et al., 2022", "level": 2}, {"title": "MIT 6.5940: TinyML and Efficient Deep Learning Computing", "url": "https://efficientml.ai/", "type": "course", "by": "Song Han, MIT", "level": 3}, {"title": "Quantize OPT-125M with round-to-nearest and with GPTQ", "url": "https://arxiv.org/abs/2210.17323", "type": "project", "by": "Built on Frantar, Ashkboos, Hoefler, Alistarh, 2022", "level": 2, "build": "Weight-only quantization of OPT-125M to 4 and 3 bits, by rounding and by the paper’s second-order update, each scored by WikiText2 perplexity.", "teaches": "Why a few outlier columns carry most of the error, and what solving for the rounding order buys over rounding each weight on its own.", "time": "a weekend", "made": true, "done": "4-bit GPTQ lands near the paper’s 31.12 perplexity against 27.65 at full precision, while rounding alone gives about 37.28 (Table 3)."}]}, {"id": "vae", "title": "Variational autoencoders and the ELBO", "kind": "concept", "track": "gen", "pre": ["backprop", "info"], "frontier": false, "core": "Assume each data point is decoded from a hidden code. The exact likelihood needs an intractable integral over codes, so train an encoder to guess the code and maximize the ELBO: reconstruction accuracy minus the KL divergence from the encoder’s guess to the prior.", "reach": "The ELBO is the objective DDPM rewrites, and the VAE is the autoencoder that latent diffusion and world models compress into.", "uses": "The image compressor inside Stable Diffusion and FLUX, whose latents the diffusion model works in; anomaly detection; early molecule generators for drug discovery; and single-cell genomics tools such as scVI.", "worth": "you will study diffusion or latent generative models, since the ELBO returns in DDPM; skip advanced VAE variants unless you work on compression or biology.", "resources": [{"title": "Variational Autoencoders (CS236 notes)", "url": "https://deepgenerativemodels.github.io/notes/vae/", "type": "notes", "by": "Stanford CS236, Ermon group", "level": 1}, {"title": "Auto-Encoding Variational Bayes", "url": "https://arxiv.org/abs/1312.6114", "type": "paper", "by": "Kingma, Welling, 2013", "level": 2, "note": "Section 2.4 is the reparameterization trick."}, {"title": "Tutorial on Diffusion Models for Imaging and Vision", "url": "https://arxiv.org/abs/2403.18103", "type": "tutorial", "by": "Stanley Chan, 2024", "level": 2, "note": "Section 1 derives the VAE in the notation its DDPM section reuses."}, {"title": "An Introduction to Variational Autoencoders", "url": "https://arxiv.org/abs/1906.02691", "type": "book", "by": "Kingma, Welling, 2019", "level": 3}, {"title": "CS294-158 Homework 2: VAEs", "url": "https://github.com/rll/deepul/tree/master/homeworks/hw2", "type": "project", "by": "Berkeley CS294-158 Deep Unsupervised Learning, 2024", "level": 2, "build": "VAEs fit to 2D Gaussians, then a VAE and a hierarchical VAE on images, then a VQ-VAE.", "teaches": "What the ELBO’s two terms do in practice, including posterior collapse, and why discrete latents help.", "time": "a week"}]}, {"id": "nf", "title": "Normalizing flows", "kind": "concept", "track": "gen", "pre": ["backprop", "calculus"], "frontier": false, "core": "Push a Gaussian through a chain of invertible maps whose Jacobian determinants are cheap to compute. The change of variables formula then gives the exact log-likelihood of every data point, so the model trains by maximum likelihood and samples by running the maps forward.", "reach": "Continuous normalizing flows replace the chain with an ODE, which leads to flow matching; Boltzmann generators use the exact likelihoods to reweight samples.", "uses": "Boltzmann generators for sampling molecules, lattice field theory in particle physics, density estimation where exact likelihoods matter, and WaveGlow-era speech synthesis. Image generation has largely moved to diffusion, though Apple’s TarFlow revived flows there.", "worth": "you need exact likelihoods, as in scientific sampling, or want the full path to flow matching; for image generation alone, a short overview suffices.", "resources": [{"title": "Flow-based Deep Generative Models", "url": "https://lilianweng.github.io/posts/2018-10-13-flow-models/", "type": "blog", "by": "Lilian Weng, 2018", "level": 1}, {"title": "Normalizing Flows for Probabilistic Modeling and Inference", "url": "https://arxiv.org/abs/1912.02762", "type": "paper", "by": "Papamakarios, Nalisnick, Rezende, Mohamed, Lakshminarayanan, 2019", "level": 2}, {"title": "Density estimation using Real NVP", "url": "https://arxiv.org/abs/1605.08803", "type": "paper", "by": "Dinh, Sohl-Dickstein, Bengio, 2016", "level": 2}, {"title": "Normalizing Flows are Capable Generative Models", "url": "https://arxiv.org/abs/2412.06329", "type": "paper", "by": "Zhai et al., Apple, 2024", "level": 3}, {"title": "UvA Deep Learning Tutorial 11: Normalizing Flows for Image Modeling", "url": "https://uvadlc-notebooks.readthedocs.io/en/latest/tutorial_notebooks/tutorial11/NF_image_modeling.html", "type": "project", "by": "Phillip Lippe, University of Amsterdam, 2020", "level": 2, "build": "A normalizing flow for MNIST written layer by layer: dequantization, then variational dequantization, affine coupling layers, and a multiscale architecture, each compared in bits per dimension.", "teaches": "Why discrete pixels must be dequantized before a flow can fit them, and how coupling layers keep the Jacobian determinant cheap.", "time": "a weekend"}]}, {"id": "gan", "title": "Generative adversarial networks", "kind": "concept", "track": "gen", "pre": ["backprop"], "frontier": false, "core": "A generator turns noise into samples while a discriminator learns to tell them from real data, and each trains against the other. At equilibrium the generator matches the data distribution with no likelihood computed, but training can oscillate or collapse onto a few modes.", "reach": "Adversarial losses return as the finishing term of one-step distillation and as the discriminator in adversarial imitation.", "uses": "StyleGAN’s photorealistic faces and early deepfakes, photo super-resolution, the adversarial losses that sharpen image autoencoders and neural audio codecs, and fast vocoders such as HiFi-GAN that turn spectrograms into speech.", "worth": "you work on image or audio decoders, tokenizers, or one-step distillation; diffusion has overtaken it as a main generator, so a light treatment suffices.", "resources": [{"title": "From GAN to WGAN", "url": "https://lilianweng.github.io/posts/2017-08-20-gan/", "type": "blog", "by": "Lilian Weng, 2017", "level": 1}, {"title": "Generative Adversarial Networks", "url": "https://arxiv.org/abs/1406.2661", "type": "paper", "by": "Goodfellow et al., 2014", "level": 2}, {"title": "Wasserstein GAN", "url": "https://arxiv.org/abs/1701.07875", "type": "paper", "by": "Arjovsky, Chintala, Bottou, 2017", "level": 2}, {"title": "The GAN is dead; long live the GAN! A Modern GAN Baseline", "url": "https://arxiv.org/abs/2501.05441", "type": "paper", "by": "Huang, Gokaslan, Kuleshov, Tompkin, 2025", "level": 3}, {"title": "CS294-158 Homework 3: GANs", "url": "https://github.com/rll/deepul/tree/master/homeworks/hw3", "type": "project", "by": "Berkeley CS294-158 Deep Unsupervised Learning, 2024", "level": 2, "build": "A GAN warmup on toy data, a GAN on CIFAR-10, and a VQGAN that adds an adversarial loss to a quantized autoencoder.", "teaches": "Why GAN training is unstable and which architecture and loss choices tame it.", "time": "a week"}]}, {"id": "ebm", "title": "Energy-based models and score matching", "kind": "concept", "track": "gen", "pre": ["montecarlo", "backprop"], "frontier": false, "core": "Define a density up to a constant, p(x) proportional to exp(-E(x)). The normalizing constant is intractable, but the score, the gradient of log p, does not depend on it, so one can fit the score directly by score matching and sample with Langevin dynamics.", "reach": "Denoising score matching across many noise levels is the score view of DDPM and the starting point of score SDEs.", "uses": "Mostly a conceptual foundation: score matching is how diffusion models are trained, Hopfield networks and Boltzmann machines are energy models, and the Langevin sampler it introduces is a standard tool in Bayesian computation.", "worth": "you want the score view of diffusion from the ground up; to train or use diffusion models, a summary of score matching is enough.", "resources": [{"title": "Generative Modeling by Estimating Gradients of the Data Distribution", "url": "https://yang-song.net/blog/2021/score/", "type": "blog", "by": "Yang Song, 2021", "level": 1}, {"title": "How to Train Your Energy-Based Models", "url": "https://arxiv.org/abs/2101.03288", "type": "tutorial", "by": "Song, Kingma, 2021", "level": 2}, {"title": "Generative Modeling by Estimating Gradients of the Data Distribution", "url": "https://arxiv.org/abs/1907.05600", "type": "paper", "by": "Song, Ermon, 2019", "level": 2, "note": "Score networks at many noise levels, sampled with annealed Langevin dynamics."}, {"title": "A Connection Between Score Matching and Denoising Autoencoders", "url": "https://doi.org/10.1162/NECO_a_00142", "type": "paper", "by": "Pascal Vincent, Neural Computation 2011", "level": 3, "note": "The proof that denoising is score matching.", "paid": true}, {"title": "Estimation of Non-Normalized Statistical Models by Score Matching", "url": "https://jmlr.org/papers/v6/hyvarinen05a.html", "type": "paper", "by": "Aapo Hyvärinen, JMLR 2005", "level": 3}, {"title": "UvA Deep Learning Tutorial 8: Deep Energy-Based Generative Models", "url": "https://uvadlc-notebooks.readthedocs.io/en/latest/tutorial_notebooks/tutorial8/Deep_Energy_Models.html", "type": "project", "by": "Phillip Lippe, University of Amsterdam, 2020", "level": 2, "build": "A CNN energy model for MNIST trained with contrastive divergence, sampled by Langevin dynamics from a replay buffer, then used to score out-of-distribution images.", "teaches": "Why an energy model trains on samples drawn from itself, and what the buffer and the energy regularizer do to keep training stable.", "time": "a weekend"}, {"title": "Plain against annealed Langevin on a two-mode mixture", "url": "https://arxiv.org/abs/1907.05600", "type": "project", "by": "Built on Song, Ermon, 2019", "level": 1, "build": "Plain and annealed Langevin samplers driven by the exact score of a 2D mixture of two Gaussians, the annealed one with 10 noise levels from 10 down to 0.1.", "teaches": "Why a score alone cannot tell how much mass each mode holds, and how added noise connects the modes so the sampler can find out.", "time": "an afternoon", "made": true, "done": "Plain Langevin splits samples between the modes in the wrong ratio, while annealed Langevin recovers the true 1/5 to 4/5 split, as in Figure 3."}]}, {"id": "ddpm", "title": "Denoising Diffusion Probabilistic Models", "kind": "paper", "track": "gen", "pre": ["vae", "ebm"], "frontier": false, "core": "Corrupt data with small Gaussian noise over many steps until it is pure noise, and train a network to predict the noise added at a random step. Running the learned denoising steps backward from fresh noise generates data, and the loss is a reweighted ELBO.", "reach": "The training loss and sampler that score SDEs, guidance, latent diffusion, flow matching, and reward fine-tuning all build on.", "uses": "Image generators like DALL-E 2, Imagen, and Stable Diffusion, video models like Sora, AlphaFold 3’s structure module, RFdiffusion for protein design, GenCast weather ensembles, and Diffusion Policy for robot arms.", "worth": "generative models of images, video, audio, molecules, or robot actions are your target; this track assumes it, and LLM-only work can skip it.", "resources": [{"title": "But how do AI images and videos actually work? | Guest video by Welch Labs", "url": "https://www.youtube.com/watch?v=iv-5mZ_9CPY", "type": "video", "by": "Welch Labs on 3Blue1Brown, 2025", "level": 1}, {"title": "What are Diffusion Models?", "url": "https://lilianweng.github.io/posts/2021-07-11-diffusion-models/", "type": "blog", "by": "Lilian Weng, 2021, updated", "level": 1}, {"title": "Denoising Diffusion Probabilistic Models", "url": "https://arxiv.org/abs/2006.11239", "type": "paper", "by": "Ho, Jain, Abbeel, 2020", "level": 2, "note": "Sections 2 and 3 hold the whole method."}, {"title": "Tutorial on Diffusion Models for Imaging and Vision", "url": "https://arxiv.org/abs/2403.18103", "type": "tutorial", "by": "Stanley Chan, 2024", "level": 2, "note": "Section 2 derives DDPM step by step from the VAE of Section 1."}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapter 2, the variational view from VAEs to DDPM."}, {"title": "Deep Unsupervised Learning using Nonequilibrium Thermodynamics", "url": "https://arxiv.org/abs/1503.03585", "type": "paper", "by": "Sohl-Dickstein, Weiss, Maheswaranathan, Ganguli, 2015", "level": 3}, {"title": "CS294-158 Homework 4: Diffusion", "url": "https://github.com/rll/deepul/tree/master/homeworks/hw4", "type": "project", "by": "Berkeley CS294-158 Deep Unsupervised Learning, 2024", "level": 2, "build": "Diffusion on a toy dataset, pixel-space diffusion on CIFAR-10, then class-conditional latent diffusion with a VAE, a diffusion transformer, and classifier-free guidance.", "teaches": "The noise schedule, the sampler, and guidance as separate choices, each changed while the rest stays fixed.", "time": "a week"}]}, {"id": "scoresde", "title": "Score-based modeling with SDEs", "kind": "paper", "track": "gen", "pre": ["ddpm", "sdes", "fokker"], "frontier": false, "core": "Let a stochastic differential equation diffuse data into noise in continuous time. Its reverse-time SDE needs only the score of each noisy marginal, which a network learns by denoising, and a deterministic probability flow ODE has the same marginals and gives exact likelihoods.", "reach": "Unifies DDPM and score networks; its probability flow ODE is what fast samplers, EDM, consistency models, and flow maps integrate.", "uses": "The theory under most modern diffusion samplers and likelihood estimates, and the basis for solving inverse problems with diffusion priors, such as rebuilding MRI images from undersampled scans to shorten scan time.", "worth": "you will do diffusion research or invent samplers; practitioners can use its results through libraries like diffusers without the SDE derivations.", "resources": [{"title": "MIT 6.S184: Introduction to Flow Matching and Diffusion Models", "url": "https://diffusion.csail.mit.edu/2026/", "type": "course", "by": "Holderrieth, Erives, MIT, 2026", "level": 1, "note": "Lectures 1 and 3-A, with the course notes and Lab 1."}, {"title": "Score-Based Generative Modeling through Stochastic Differential Equations", "url": "https://arxiv.org/abs/2011.13456", "type": "paper", "by": "Song, Sohl-Dickstein, Kingma, Kumar, Ermon, Poole, 2021", "level": 2}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapter 4 on the score SDE framework, and Appendix C on Itô calculus and Girsanov."}, {"title": "Reverse-time diffusion equation models", "url": "https://doi.org/10.1016/0304-4149(82)90051-5", "type": "paper", "by": "Brian Anderson, 1982", "level": 3, "note": "The original derivation of the reverse SDE."}, {"title": "Predictor and corrector samplers on a pretrained score model", "url": "https://arxiv.org/abs/2011.13456", "type": "project", "by": "Built on Song et al., 2021", "level": 2, "build": "Reverse diffusion, Langevin corrector, and probability flow samplers you write yourself, run on one GPU against the authors’ pretrained CIFAR-10 VE model and scored by FID.", "teaches": "One trained score model admits many samplers, and network calls spent on a corrector can beat the same calls spent on predictor steps.", "time": "a week", "made": true, "done": "On the VE model, 1000 predictor plus 1000 corrector steps beat 2000 predictor steps alone: FID near 3.60 against 4.74, as in Table 1."}]}, {"id": "samplers", "title": "Fast samplers: DDIM and ODE solvers", "kind": "concept", "track": "gen", "pre": ["scoresde"], "frontier": false, "core": "Sampling a diffusion model is numerically integrating its reverse SDE or probability flow ODE, so fewer steps calls for a better integrator. DDIM steps deterministically along the ODE, and DPM-Solver integrates its linear part exactly, giving good samples in 10 to 20 network calls.", "reach": "EDM’s Heun sampler and distillation into consistency models both start from treating sampling as ODE integration.", "uses": "Every practical diffusion app: the DDIM, DPM++, and Euler options in Stable Diffusion interfaces come from here, and cutting a thousand steps to a few dozen made image generation fast enough for consumers.", "worth": "you run, deploy, or speed up diffusion models; it is a short step past score SDEs and pays off immediately in faster sampling.", "resources": [{"title": "Denoising Diffusion Implicit Models", "url": "https://arxiv.org/abs/2010.02502", "type": "paper", "by": "Song, Meng, Ermon, 2020", "level": 2}, {"title": "DPM-Solver: A Fast ODE Solver for Diffusion Probabilistic Model Sampling in Around 10 Steps", "url": "https://arxiv.org/abs/2206.00927", "type": "paper", "by": "Lu, Zhou, Bao, Chen, Li, Zhu, 2022", "level": 2}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapter 9 covers DDIM, DEIS, DPM-Solver, and DPM-Solver++ in one notation."}, {"title": "DPM-Solver++: Fast Solver for Guided Sampling of Diffusion Probabilistic Models", "url": "https://arxiv.org/abs/2211.01095", "type": "paper", "by": "Lu, Zhou, Bao, Chen, Li, Zhu, 2022", "level": 3}, {"title": "DDIM against ancestral sampling on a pretrained DDPM", "url": "https://arxiv.org/abs/2010.02502", "type": "project", "by": "Built on Song, Meng, Ermon, 2020", "level": 2, "build": "A DDIM sampler you write yourself, with its noise setting η from 0 to 1, driving the original pretrained CIFAR-10 DDPM on one GPU, with FID at 10, 20, 50, and 100 steps.", "teaches": "How removing the sampler’s noise lets the same network take large deterministic steps, and where quality falls off as the steps get fewer.", "time": "a weekend", "made": true, "done": "At 20 steps, η = 0 gives under half the FID of η = 1, as in Table 1 (6.84 against 18.36 on CIFAR-10)."}]}, {"id": "guidance", "title": "Classifier and classifier-free guidance", "kind": "concept", "track": "gen", "pre": ["ddpm"], "frontier": false, "core": "To sample from p(x | y), add the gradient of log p(y | x_t) to the score. Classifier guidance takes it from a classifier trained on noisy data; classifier-free guidance trains one model with and without the condition and extrapolates past its conditional prediction.", "reach": "Guidance trades diversity for fidelity; steering and reward fine-tuning ask which distribution it actually samples.", "uses": "Prompt adherence in nearly every text-to-image and text-to-video model: the “CFG scale” slider in Stable Diffusion tools is this, and music generators such as MusicGen use the same trick.", "worth": "you use or build conditional generators of any kind; it is short, practical, and explains the most important knob in image generation tools.", "resources": [{"title": "Guidance: a cheat code for diffusion models", "url": "https://sander.ai/2022/05/26/guidance.html", "type": "blog", "by": "Sander Dieleman, 2022", "level": 1}, {"title": "Classifier-Free Diffusion Guidance", "url": "https://arxiv.org/abs/2207.12598", "type": "paper", "by": "Ho, Salimans, 2022", "level": 2}, {"title": "Diffusion Models Beat GANs on Image Synthesis", "url": "https://arxiv.org/abs/2105.05233", "type": "paper", "by": "Dhariwal, Nichol, 2021", "level": 2, "note": "Read it for classifier guidance."}, {"title": "Classifier-Free Guidance is a Predictor-Corrector", "url": "https://arxiv.org/abs/2408.09000", "type": "paper", "by": "Bradley, Nakkiran, 2024", "level": 3, "note": "CFG does not sample the sharpened distribution it is usually said to."}, {"title": "Guiding a Diffusion Model with a Bad Version of Itself", "url": "https://arxiv.org/abs/2406.02507", "type": "paper", "by": "Karras et al., NVIDIA, 2024", "level": 3}, {"title": "CS180 Project 5: Fun with Diffusion Models", "url": "https://cal-cs180.github.io/fa25/hw/proj5/index.html", "type": "project", "by": "Berkeley CS180, Fall 2025", "level": 1, "build": "Sampling, classifier-free guidance, SDEdit, inpainting, visual anagrams, and hybrid images with the pretrained DeepFloyd IF, then a flow matching UNet trained on MNIST with class conditioning.", "teaches": "What guidance and editing do to a sampler, by changing the noise estimate yourself at every step.", "time": "two weeks"}]}, {"id": "latent", "title": "Latent diffusion and diffusion transformers", "kind": "concept", "track": "gen", "pre": ["ddpm", "vae", "crossattn"], "frontier": false, "core": "Run diffusion in the latent space of a pretrained autoencoder rather than on pixels, which cuts the cost of training and sampling many times over, and make the denoiser a transformer over latent patches that scales like a language model.", "reach": "Stable Diffusion 3, FLUX, and most video and world models are built this way.", "uses": "Stable Diffusion, SD3, and FLUX for images, Sora, Wan, and HunyuanVideo for video, and GameNGen’s playable simulation of Doom. Compressing to latents made image model training affordable for academic and open-source teams.", "worth": "you will train or adapt image and video generators; using them only requires knowing that an autoencoder compresses images before diffusion runs.", "resources": [{"title": "Generative modelling in latent space", "url": "https://sander.ai/2025/04/15/latents.html", "type": "blog", "by": "Sander Dieleman, 2025", "level": 1}, {"title": "High-Resolution Image Synthesis with Latent Diffusion Models", "url": "https://arxiv.org/abs/2112.10752", "type": "paper", "by": "Rombach, Blattmann, Lorenz, Esser, Ommer, 2022", "level": 2}, {"title": "Scalable Diffusion Models with Transformers", "url": "https://arxiv.org/abs/2212.09748", "type": "paper", "by": "Peebles, Xie, 2023", "level": 2}, {"title": "Scaling Rectified Flow Transformers for High-Resolution Image Synthesis", "url": "https://arxiv.org/abs/2403.03206", "type": "paper", "by": "Esser et al., Stability AI, 2024", "level": 3, "note": "The MMDiT architecture and timestep sampling behind SD3."}, {"title": "Diffusion Transformers with Representation Autoencoders", "url": "https://arxiv.org/abs/2510.11690", "type": "paper", "by": "Zheng, Ma, Tong, Xie, 2025", "level": 3}, {"title": "A DiT patch size sweep on Stable Diffusion latents", "url": "https://arxiv.org/abs/2212.09748", "type": "project", "by": "Built on Peebles, Xie, 2023", "level": 3, "build": "ImageNet encoded once into 32 by 32 by 4 latents with the Stable Diffusion VAE, then DiT-S trained on them on one GPU at patch sizes 8, 4, and 2.", "teaches": "Why latents make ImageNet diffusion affordable on one GPU, and why a DiT’s quality tracks its token count when its parameters stay fixed.", "time": "a week", "made": true, "done": "FID falls as patches shrink at fixed parameters, as in the paper’s DiT-S runs at 400K steps: 153.6 at patch 8, 100.4 at 4, and 68.4 at 2."}]}, {"id": "edm", "title": "EDM: the diffusion design space", "kind": "paper", "track": "gen", "pre": ["scoresde", "samplers"], "frontier": false, "core": "Diffusion models differ in a few independent choices: the noise schedule, how the network’s input and output are scaled at each noise level, the loss weight per noise level, and the solver. Choosing each on its own merits gives better samples in far fewer steps.", "reach": "The parameterization most consistency and flow map papers start from, and the framework AlphaFold 3’s diffusion module builds on.", "uses": "The training and sampling recipe behind many strong image diffusion models and distillation methods, AlphaFold 3’s diffusion module, and the “Karras” noise schedules offered in Stable Diffusion interfaces.", "worth": "you will train diffusion models or read recent diffusion papers, which assume its notation; using pretrained models needs none of it.", "resources": [{"title": "Elucidating the Design Space of Diffusion-Based Generative Models", "url": "https://arxiv.org/abs/2206.00364", "type": "paper", "by": "Karras, Aittala, Aila, Laine, 2022", "level": 2, "note": "Table 1 puts each model family’s design choices side by side."}, {"title": "Noise schedules considered harmful", "url": "https://sander.ai/2024/06/14/noise-schedules.html", "type": "blog", "by": "Sander Dieleman, 2024", "level": 2}, {"title": "NVlabs/edm", "url": "https://github.com/NVlabs/edm", "type": "code", "by": "NVIDIA, 2022", "level": 2}, {"title": "Analyzing and Improving the Training Dynamics of Diffusion Models", "url": "https://arxiv.org/abs/2312.02696", "type": "paper", "by": "Karras et al., NVIDIA, 2024", "level": 3}, {"title": "EDM’s Heun sampler on a pretrained VP model", "url": "https://arxiv.org/abs/2206.00364", "type": "project", "by": "Built on Karras, Aittala, Aila, Laine, 2022", "level": 2, "build": "Algorithm 1 of the paper, a Heun sampler with the EDM noise schedule and time steps, written yourself and run on one GPU against the CIFAR-10 VP baseline that NVlabs/edm provides.", "teaches": "Treating the sampler as a choice separate from training, and seeing how much a second-order step and a better step schedule save on a network you did not train.", "time": "a weekend", "made": true, "done": "Your sampler comes within 3 percent of its best FID at 35 network calls, the point Figure 2a marks for the VP model."}]}, {"id": "cnf", "title": "Neural ODEs and continuous normalizing flows", "kind": "concept", "track": "gen", "pre": ["nf", "odes"], "frontier": false, "core": "Let a neural network define a velocity field and carry noise to data by integrating its ODE. Along each path the log-density changes by minus the divergence of the velocity, so likelihoods are exact without invertible layers, but maximum likelihood training must simulate the ODE.", "reach": "Flow matching removes the simulation from training; the same continuity equation underlies its marginal velocity field.", "uses": "Mostly research and history: modeling irregularly sampled time series such as clinical records, learning dynamics in scientific models, and FFJORD-style density estimation, before flow matching made continuous flows cheap to train.", "worth": "you want to understand flow matching from first principles; otherwise skip ahead to flow matching, which keeps the ODE and drops the costly training.", "resources": [{"title": "Neural Ordinary Differential Equations", "url": "https://arxiv.org/abs/1806.07366", "type": "paper", "by": "Chen, Rubanova, Bettencourt, Duvenaud, 2018", "level": 2}, {"title": "FFJORD: Free-form Continuous Dynamics for Scalable Reversible Generative Models", "url": "https://arxiv.org/abs/1810.01367", "type": "paper", "by": "Grathwohl, Chen, Bettencourt, Sutskever, Duvenaud, 2018", "level": 2}, {"title": "Flow Matching Guide and Code", "url": "https://arxiv.org/abs/2412.06264", "type": "book", "by": "Lipman et al., Meta, 2024", "level": 2, "note": "Section 3 covers flows, the continuity equation, and the instantaneous change of variables."}, {"title": "rtqichen/torchdiffeq", "url": "https://github.com/rtqichen/torchdiffeq", "type": "code", "by": "Ricky Chen", "level": 2}, {"title": "On Neural Differential Equations", "url": "https://arxiv.org/abs/2202.02435", "type": "book", "by": "Patrick Kidger, 2022", "level": 3}, {"title": "torchdiffeq examples: an ODE network and a continuous normalizing flow", "url": "https://github.com/rtqichen/torchdiffeq/tree/master/examples", "type": "project", "by": "Ricky Chen, 2018", "level": 2, "build": "An ODE network classifying MNIST, trained with and without the adjoint method, then a continuous normalizing flow fit to two concentric circles in 2D.", "teaches": "How the log-density rides along the ODE as minus the trace of the Jacobian, and what the adjoint method saves in memory and costs in time.", "time": "a weekend"}]}, {"id": "fm", "title": "Flow matching", "kind": "paper", "track": "gen", "pre": ["cnf", "ddpm", "fokker"], "frontier": false, "core": "Train a continuous flow without simulating it. Choose a simple path from each noise sample to each data sample, such as a straight line, and regress a network onto that path’s velocity; the regression target averages to the velocity field that carries noise to data.", "reach": "With Gaussian paths it equals diffusion up to schedule and weighting. Rectified flow, interpolants, flow maps, discrete flow matching, and VLA action heads extend it.", "uses": "Stable Diffusion 3, FLUX, Meta’s Movie Gen video and Voicebox speech models, the action head of Physical Intelligence’s pi0 robot policy, and many recent protein and materials generators.", "worth": "image, video, audio, or robot generators are what you want to build; it is now the simplest way into the field, simpler than DDPM.", "resources": [{"title": "MIT 6.S184: Introduction to Flow Matching and Diffusion Models", "url": "https://diffusion.csail.mit.edu/2026/", "type": "course", "by": "Holderrieth, Erives, MIT, 2026", "level": 1, "note": "Lectures 1 and 2, the course notes, and Lab 2."}, {"title": "Flow Matching for Generative Modeling", "url": "https://arxiv.org/abs/2210.02747", "type": "paper", "by": "Lipman, Chen, Ben-Hamu, Nickel, Le, 2022", "level": 2}, {"title": "Diffusion Meets Flow Matching: Two Sides of the Same Coin", "url": "https://diffusionflow.github.io/", "type": "blog", "by": "Gao, Hoogeboom, Heek, De Bortoli, Murphy, Salimans, 2024", "level": 2}, {"title": "Flow Matching Guide and Code", "url": "https://arxiv.org/abs/2412.06264", "type": "book", "by": "Lipman et al., Meta, 2024", "level": 2, "note": "Sections 2 to 4, then Section 10 on the relation to diffusion."}, {"title": "facebookresearch/flow_matching", "url": "https://github.com/facebookresearch/flow_matching", "type": "code", "by": "Meta, 2024", "level": 2}, {"title": "MIT 6.S184 labs", "url": "https://diffusion.csail.mit.edu/2026/index.html#labs", "type": "project", "by": "Holderrieth, Erives, Shprints, MIT, 2026", "level": 2, "note": "Each lab opens in Colab from the course page; solutions are linked there.", "build": "A flow matching and diffusion model from scratch in three labs: ODE and SDE simulators, flow matching and score matching, then a latent model with a VAE and a diffusion transformer.", "teaches": "The whole chain from a probability path to a trained sampler, with each piece tied to the course notes.", "time": "a week", "signature": true}]}, {"id": "rectified", "title": "Rectified flow", "kind": "paper", "track": "gen", "pre": ["fm", "ot"], "frontier": false, "core": "Learn an ODE that moves noise to data along straight lines between randomly paired samples, then reflow: pair each noise sample with where the ODE sends it and train again. Each reflow straightens paths without raising transport cost, so a few Euler steps suffice.", "reach": "The straight-path loss SD3, FLUX, and Wan train with, and the first few-step method that later flow maps generalize.", "uses": "Stable Diffusion 3, FLUX, and Wan train with its straight paths, and InstaFlow used reflow plus distillation to turn Stable Diffusion into a one-step text-to-image generator.", "worth": "you train image or video generators or care about fast sampling; it is a short add-on once flow matching is clear.", "resources": [{"title": "Flow Straight and Fast: Learning to Generate and Transfer Data with Rectified Flow", "url": "https://arxiv.org/abs/2209.03003", "type": "paper", "by": "Liu, Gong, Liu, 2022", "level": 2}, {"title": "Rectified Flow: A Marginal Preserving Approach to Optimal Transport", "url": "https://arxiv.org/abs/2209.14577", "type": "paper", "by": "Qiang Liu, 2022", "level": 3}, {"title": "InstaFlow: One Step is Enough for High-Quality Diffusion-Based Text-to-Image Generation", "url": "https://arxiv.org/abs/2309.06380", "type": "paper", "by": "Liu, Zhang, Ma, Peng, Liu, 2023", "level": 3}, {"title": "Scaling Rectified Flow Transformers for High-Resolution Image Synthesis", "url": "https://arxiv.org/abs/2403.03206", "type": "paper", "by": "Esser et al., Stability AI, 2024", "level": 3, "note": "Compares 61 formulations; rectified flow with modified timestep sampling comes out ahead."}, {"title": "Rectified flow and one reflow on MNIST", "url": "https://arxiv.org/abs/2209.03003", "type": "project", "by": "Built on Liu, Gong, Liu, 2022", "level": 2, "build": "A rectified flow on MNIST trained on random noise and image pairs, then retrained on the pairs its own ODE produces, on one GPU, sampled with one Euler step each time.", "teaches": "Why straight paths make one step enough, and how reflow straightens paths by pairing each noise sample with where the flow already sends it.", "time": "a weekend", "made": true, "done": "One Euler step gives noise before reflow and recognizable digits after, the jump Table 1 shows on CIFAR-10 (one-step FID 378 down to 12.21)."}]}, {"id": "interpolants", "title": "Stochastic interpolants", "kind": "paper", "track": "gen", "pre": ["fm", "scoresde"], "frontier": false, "core": "Connect two distributions by x_t = α(t) x_0 + β(t) x_1 + γ(t) z. Regressing on the interpolant’s time derivative gives a velocity and regressing on z gives the score, so one model yields ODE and SDE samplers, with the noise level picked after training.", "reach": "Places diffusion, flow matching, and rectified flow in one framework, and is the base for flow maps and bridge matching.", "uses": "Mostly a unifying research framework: it guides design choices in image generators such as SiT, translation between two datasets, and probabilistic forecasting of physical systems, including turbulent fluid flows.", "worth": "you do research on generative models and want one framework for diffusion and flows; practitioners can stay with flow matching.", "resources": [{"title": "Building Normalizing Flows with Stochastic Interpolants", "url": "https://arxiv.org/abs/2209.15571", "type": "paper", "by": "Albergo, Vanden-Eijnden, 2022", "level": 2, "note": "The shorter, deterministic version."}, {"title": "Stochastic Interpolants: A Unifying Framework for Flows and Diffusions", "url": "https://arxiv.org/abs/2303.08797", "type": "paper", "by": "Albergo, Boffi, Vanden-Eijnden, 2023, JMLR 2025", "level": 2, "note": "Section 2 is the framework; Section 5 connects it to score-based diffusion and rectified flow."}, {"title": "SiT: Exploring Flow and Diffusion-based Generative Models with Scalable Interpolant Transformers", "url": "https://arxiv.org/abs/2401.08740", "type": "paper", "by": "Ma, Goldstein, Albergo, Boffi, Vanden-Eijnden, Xie, 2024", "level": 3}, {"title": "Stochastic interpolants with data-dependent couplings", "url": "https://arxiv.org/abs/2310.03725", "type": "paper", "by": "Albergo, Goldstein, Boffi, Ranganath, Vanden-Eijnden, 2023", "level": 3}, {"title": "stochastic-interpolants: the checkerboard notebooks", "url": "https://github.com/malbergo/stochastic-interpolants", "type": "project", "by": "Michael Albergo, 2023", "level": 2, "build": "Velocity and score networks for a stochastic interpolant from a Gaussian to a 2D checkerboard, then samples and likelihoods from the ODE and from SDEs at several noise levels.", "teaches": "That two regressions on one interpolant give a whole family of samplers, with the amount of noise chosen after training.", "time": "a day"}]}, {"id": "consistency", "title": "Consistency models and distillation", "kind": "concept", "track": "gen", "pre": ["samplers", "edm"], "frontier": false, "core": "Train a network to map any point on a probability flow ODE trajectory to that trajectory’s clean endpoint, by making its outputs at nearby points of one trajectory agree. It then samples in one step, or in a few by alternating denoising with re-noising.", "reach": "Generalizes to flow maps, which learn jumps between any two times rather than only to the endpoint.", "uses": "One-step and few-step generation where latency matters, such as Latent Consistency Models and LCM-LoRA for near real-time Stable Diffusion, OpenAI’s sCM research, and fast sampling in speech synthesis and robot policies.", "worth": "you deploy diffusion where speed matters or research distillation; the field is moving toward flow maps, so learn the idea rather than every variant.", "resources": [{"title": "The paradox of diffusion distillation", "url": "https://sander.ai/2024/02/28/paradox.html", "type": "blog", "by": "Sander Dieleman, 2024", "level": 1}, {"title": "Consistency Models", "url": "https://arxiv.org/abs/2303.01469", "type": "paper", "by": "Song, Dhariwal, Chen, Sutskever, 2023", "level": 2}, {"title": "Progressive Distillation for Fast Sampling of Diffusion Models", "url": "https://arxiv.org/abs/2202.00512", "type": "paper", "by": "Salimans, Ho, 2022", "level": 2}, {"title": "Simplifying, Stabilizing and Scaling Continuous-Time Consistency Models", "url": "https://arxiv.org/abs/2410.11081", "type": "paper", "by": "Lu, Song, 2024", "level": 3}, {"title": "Improved Distribution Matching Distillation for Fast Image Synthesis", "url": "https://arxiv.org/abs/2405.14867", "type": "paper", "by": "Yin et al., 2024", "level": 3, "note": "The distribution matching alternative, with a GAN term."}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapters 10 and 11, distillation and consistency models in one notation."}, {"title": "Consistency tuning from a pretrained EDM", "url": "https://arxiv.org/abs/2406.14548", "type": "project", "by": "Built on Geng, Pokle, Luo, Lin, Kolter, 2024", "level": 3, "build": "A consistency tuning loop written on top of NVIDIA’s EDM CIFAR-10 checkpoint, shrinking the gap between paired noise levels on a schedule, then one-step and two-step sampling on one GPU.", "teaches": "That a diffusion model is a loose consistency model, so tightening the consistency condition by stages replaces distillation from scratch.", "time": "a day", "made": true, "done": "Two-step FID reaches about 2.73 after about one A100 hour, the figure in the paper’s abstract."}]}, {"id": "flowmaps", "title": "Flow maps and few-step generation", "kind": "concept", "track": "gen", "pre": ["consistency", "interpolants"], "frontier": true, "core": "A flow map X(s,t) jumps from time s to time t along the probability flow in one network call. Its small-step limit gives the velocity, its jump to the data end is a consistency model, and it trains from scratch by requiring jumps to compose.", "reach": "MeanFlow, shortcut models, and Align Your Flow are flow maps, the current route to one-step and few-step image, video, and action generation.", "uses": "Research on one-step and few-step generators for images, video, and robot actions, such as MeanFlow and shortcut models, which aim to cut sampling to one or a few network calls without a separate teacher.", "worth": "you research fast generation or deploy latency-bound generators; it is frontier work still settling, so most learners can stop at consistency models.", "resources": [{"title": "Learning the integral of a diffusion model", "url": "https://sander.ai/2026/05/06/flow-maps.html", "type": "blog", "by": "Sander Dieleman, 2026", "level": 1}, {"title": "Flow map matching with stochastic interpolants: A mathematical framework for consistency models", "url": "https://arxiv.org/abs/2406.07507", "type": "paper", "by": "Boffi, Albergo, Vanden-Eijnden, 2024", "level": 2}, {"title": "How to build a consistency model: Learning flow maps via self-distillation", "url": "https://arxiv.org/abs/2505.18825", "type": "paper", "by": "Boffi, Albergo, Vanden-Eijnden, 2025", "level": 2, "note": "Lagrangian, Eulerian, and progressive losses, with consistency and shortcut models as special cases."}, {"title": "Mean Flows for One-step Generative Modeling", "url": "https://arxiv.org/abs/2505.13447", "type": "paper", "by": "Geng, Deng, Bai, Kolter, He, 2025", "level": 2}, {"title": "One Step Diffusion via Shortcut Models", "url": "https://arxiv.org/abs/2410.12557", "type": "paper", "by": "Frans, Hafner, Levine, Abbeel, 2024", "level": 3}, {"title": "Align Your Flow: Scaling Continuous-Time Flow Map Distillation", "url": "https://arxiv.org/abs/2506.14603", "type": "paper", "by": "Sabour, Fidler, Kreis, 2025", "level": 3}, {"title": "MeanFlow on MNIST", "url": "https://arxiv.org/abs/2505.13447", "type": "project", "by": "Built on Geng, Deng, Bai, Kolter, He, 2025", "level": 3, "build": "A MeanFlow network for MNIST, trained on one GPU with the JVP target for the average velocity, sampled in one step, once with r = t always and once with 25 percent r ≠ t.", "teaches": "How the identity between average and instantaneous velocity turns a flow matching network into a one-step sampler.", "time": "a weekend", "made": true, "done": "One-step samples are noise when r always equals t and digits at 25 percent, the gap Table 1a shows on ImageNet (FID 328.91 against 61.06)."}]}, {"id": "bridges", "title": "Schrödinger bridges and bridge matching", "kind": "concept", "track": "gen", "pre": ["ot", "soc", "interpolants"], "frontier": true, "core": "The Schrödinger bridge is the stochastic process closest in KL to Brownian motion that starts at one distribution and ends at another: entropic optimal transport over paths. Bridge matching regresses onto Brownian bridges between paired samples, and alternating it with re-pairing converges to the bridge.", "reach": "Gives unpaired translation between datasets and, with an energy instead of data at one end, the bridge samplers in densities.", "uses": "Translating between two datasets without paired examples, as in image restoration and modeling how cell states change in single-cell biology, plus sampling from energy functions. Most uses are still research rather than shipped products.", "worth": "you do research where optimal transport meets generative modeling; it is graduate-level and still moving, so most practitioners can skip it.", "resources": [{"title": "Stochastic control liaisons: Richard Sinkhorn meets Gaspard Monge on a Schroedinger bridge", "url": "https://arxiv.org/abs/2005.10963", "type": "paper", "by": "Chen, Georgiou, Pavon, SIAM Review 2021", "level": 2, "note": "The problem through optimal transport, control, and Sinkhorn at once."}, {"title": "Diffusion Schrödinger Bridge Matching", "url": "https://arxiv.org/abs/2303.16852", "type": "paper", "by": "Shi, De Bortoli, Campbell, Doucet, 2023", "level": 2}, {"title": "Diffusion Schrödinger Bridge with Applications to Score-Based Generative Modeling", "url": "https://arxiv.org/abs/2106.01357", "type": "paper", "by": "De Bortoli, Thornton, Heng, Doucet, 2021", "level": 2}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapter 7 asks whether diffusion models solve the bridge and transport problems."}, {"title": "A survey of the Schrödinger problem and some of its connections with optimal transport", "url": "https://arxiv.org/abs/1308.0215", "type": "paper", "by": "Christian Léonard, 2013", "level": 3}, {"title": "Bridge matching between two 2D distributions", "url": "https://arxiv.org/abs/2303.16852", "type": "project", "by": "Built on Shi, De Bortoli, Campbell, Doucet, 2023", "level": 3, "build": "DSBM written yourself with small MLPs, carrying two moons to eight Gaussians by alternating Brownian bridge matching with re-pairing, beside rectified flow on the same task.", "teaches": "How Iterative Markovian Fitting keeps both endpoint distributions fixed while each round moves the coupling toward the Schrödinger bridge.", "time": "a weekend", "made": true, "done": "With 20 Euler steps, DSBM’s 2-Wasserstein error from moons to eight Gaussians is near 0.8, below rectified flow’s 1.52, as in Table 2."}]}, {"id": "d3pm", "title": "Discrete diffusion (D3PM)", "kind": "paper", "track": "disc", "pre": ["ddpm", "stochastic"], "frontier": false, "core": "Corrupt discrete tokens with a Markov chain instead of Gaussian noise: each step multiplies a token’s one-hot vector by a transition matrix, such as uniform resampling or a jump to an absorbing [MASK] state, and a network learns to reverse the chain.", "reach": "The absorbing state leads to masked diffusion language models; the continuous-time view leads to score entropy and discrete flow matching.", "uses": "Generating discrete data such as text, code, graphs, and molecules with a diffusion process; on its own it is mainly a research baseline today, and the starting point for diffusion language models.", "worth": "you want to understand diffusion language models from the ground up; others can jump to masked diffusion, which keeps the useful special case.", "resources": [{"title": "MIT 6.S184: Introduction to Flow Matching and Diffusion Models", "url": "https://diffusion.csail.mit.edu/2026/", "type": "course", "by": "Holderrieth, Erives, MIT, 2026", "level": 1, "note": "Section 7 of the course notes and Lecture 5 build discrete diffusion from continuous-time Markov chains."}, {"title": "Structured Denoising Diffusion Models in Discrete State-Spaces", "url": "https://arxiv.org/abs/2107.03006", "type": "paper", "by": "Austin et al., Google, 2021", "level": 2, "note": "Section 3.1 compares transition matrices; Section 4 relates the absorbing one to BERT and autoregressive models."}, {"title": "A Continuous Time Framework for Discrete Denoising Models", "url": "https://arxiv.org/abs/2205.14987", "type": "paper", "by": "Campbell et al., 2022", "level": 3, "note": "Moves discrete diffusion to continuous time, the form later work builds on."}, {"title": "D3PM on text8: uniform against absorbing", "url": "https://arxiv.org/abs/2107.03006", "type": "project", "by": "Built on Austin et al., 2021", "level": 2, "build": "A discrete diffusion model for characters on one GPU, with uniform and absorbing [MASK] transition matrices, trained on text8 and scored by its bound in bits per character.", "teaches": "That the corruption matrix decides what the denoiser must learn, and why masking won out for text.", "time": "a week", "made": true, "done": "The absorbing model beats the uniform one at every step count, as in Table 1, where 1000 steps give 1.45 against 1.61 bits per character."}]}, {"id": "sedd", "title": "Score entropy discrete diffusion (SEDD)", "kind": "paper", "track": "disc", "pre": ["d3pm", "ebm"], "frontier": false, "core": "The score, the gradient of log density, does not exist for discrete data, so learn ratios p(y)/p(x) between a sequence x and each neighbor y differing in one token. Score entropy fits these ratios, which define the reverse of a continuous-time Markov chain.", "reach": "Its models matched or beat GPT-2 at similar size; the ratio view recurs in discrete flow matching and masked diffusion.", "uses": "Research language models that write text in parallel rather than left to right; it won an ICML 2024 best paper award, though later diffusion LLMs mostly adopted the simpler masked objective.", "worth": "you research discrete generative models; a practitioner of diffusion LLMs can skip to masked diffusion, which most later work builds on.", "resources": [{"title": "Language Modeling by Estimating the Ratios of the Data Distribution", "url": "https://aaronlou.com/blog/2024/discrete-diffusion/", "type": "blog", "by": "Aaron Lou, 2024", "level": 1, "note": "The first author’s walkthrough, from why autoregression dominates to concrete scores and sampling."}, {"title": "Discrete Diffusion Modeling by Estimating the Ratios of the Data Distribution", "url": "https://arxiv.org/abs/2310.16834", "type": "paper", "by": "Lou, Meng, Ermon, ICML 2024", "level": 2}, {"title": "Concrete Score Matching: Generalized Score Matching for Discrete Data", "url": "https://arxiv.org/abs/2211.00802", "type": "paper", "by": "Meng, Choi, Song, Ermon, 2022", "level": 3, "note": "The earlier idea of a discrete score as ratios to neighboring states."}, {"title": "Score entropy on text8", "url": "https://arxiv.org/abs/2310.16834", "type": "project", "by": "Built on Lou, Meng, Ermon, 2024", "level": 3, "build": "The score entropy loss and a tau-leaping sampler for a 12-layer transformer on one GPU, trained on text8 with absorbing and with uniform transitions.", "teaches": "What learning probability ratios instead of denoising looks like in code, and why the absorbing version fits language better.", "time": "a week", "made": true, "done": "Absorbing reaches about 1.39 bits per character and uniform about 1.47, as in Table 2, each beating its D3PM counterpart at 1.45 and 1.61."}]}, {"id": "mdlm", "title": "Masked diffusion language models", "kind": "concept", "track": "disc", "pre": ["d3pm", "lm", "masks"], "frontier": false, "core": "Use only the absorbing [MASK] corruption. The diffusion bound then reduces to a weighted average of BERT-style masked token cross-entropies over random masking rates, so training is masked language modeling, and sampling unmasks tokens over several steps in any order.", "reach": "The recipe that LLaDA scales, block diffusion extends, and RL fine-tunes.", "uses": "Open diffusion LLMs such as LLaDA and Dream, which train with this objective, protein sequence generators such as DPLM and EvoDiff, and the research behind commercial diffusion LLMs like Mercury and Gemini Diffusion.", "worth": "you want to work on diffusion LLMs or parallel text generation; it is the most practical entry point, and autoregressive LLM work can skip it.", "resources": [{"title": "How to Build a Diffusion Language Model", "url": "https://kuleshov-group.github.io/blog/blog/2026/how-to-build-a-diffusion-language-model/", "type": "blog", "by": "Kuleshov group, Cornell, 2026", "level": 1, "note": "The sections on simple masked diffusion models."}, {"title": "Simple and Effective Masked Diffusion Language Models", "url": "https://arxiv.org/abs/2406.07524", "type": "paper", "by": "Sahoo et al., Cornell, 2024", "level": 2, "note": "Section 3 derives the Rao-Blackwellized bound; Section 4.2 adds semi-autoregressive decoding."}, {"title": "Simplified and Generalized Masked Diffusion for Discrete Data", "url": "https://arxiv.org/abs/2406.04329", "type": "paper", "by": "Shi, Han, Wang, Doucet, Titsias, 2024", "level": 2, "note": "MD4: the same objective derived independently as a weighted integral of cross-entropies, with state-dependent schedules."}, {"title": "Your Absorbing Discrete Diffusion Secretly Models the Conditional Distributions of Clean Data", "url": "https://arxiv.org/abs/2406.03736", "type": "paper", "by": "Ou et al., 2024", "level": 3, "note": "Shows the optimal network needs no time input: it predicts clean tokens given the unmasked ones."}, {"title": "tiny-diffusion", "url": "https://github.com/nathanrs/tiny-diffusion", "type": "project", "by": "Nathan Barry, 2025", "level": 1, "build": "A 10.7M parameter character-level masked diffusion model on Tiny Shakespeare, made from a small GPT by switching to bidirectional attention and a mask token, beside the autoregressive original.", "teaches": "Exactly what changes between next-token prediction and masked diffusion, in a model that trains in minutes.", "time": "a weekend", "signature": true}]}, {"id": "llada", "title": "LLaDA: diffusion LLMs at scale", "kind": "paper", "track": "disc", "pre": ["mdlm", "scaling"], "frontier": true, "core": "Train a masked diffusion model the way LLMs are trained: 8B parameters, trillions of pretraining tokens, then supervised fine-tuning. It rivals LLaMA 3 8B at in-context learning and beats GPT-4o at completing poems in reverse, so these abilities do not need left to right generation.", "reach": "Made diffusion LLMs a serious option at scale and is the base model for RL on them and for faster decoding.", "uses": "Evidence that non-autoregressive language models work at 8B scale, a base model for research on diffusion LLM reasoning and RL, and a test bed for tasks where left to right order hurts, such as reversal.", "worth": "diffusion LLMs interest you as a research bet; whether they displace autoregressive models is open, so others can watch from a distance.", "resources": [{"title": "Large Language Diffusion Models", "url": "https://arxiv.org/abs/2502.09992", "type": "paper", "by": "Nie et al., Renmin University, Ant Group, 2025", "level": 2}, {"title": "Scaling up Masked Diffusion Models on Text", "url": "https://arxiv.org/abs/2410.18514", "type": "paper", "by": "Nie et al., 2024", "level": 2, "note": "Scaling laws for masked diffusion, the evidence that set up LLaDA."}, {"title": "Dream 7B: Diffusion Large Language Models", "url": "https://arxiv.org/abs/2508.15487", "type": "paper", "by": "Ye et al., HKU, 2025", "level": 3, "note": "Starts a diffusion LLM from autoregressive weights instead of from scratch."}, {"title": "LLaDA", "url": "https://github.com/ML-GSAI/LLaDA", "type": "code", "by": "Nie et al., 2025", "level": 2, "note": "Inference and evaluation code for the released models."}, {"title": "The reversal curse, tested on LLaDA", "url": "https://github.com/ML-GSAI/LLaDA", "type": "project", "by": "Built on Nie et al., 2025", "level": 2, "note": "The poem pairs are in data/poem_data.json and LLaDA’s scorer is eval_reverse.py.", "build": "LLaDA’s low-confidence remasking sampler written from the paper, then LLaDA 8B Instruct and Qwen2.5 7B Instruct scored on the repository’s 496 poem pairs in both directions, on one GPU.", "teaches": "How a masked diffusion model samples, and why a model trained with no left to right order answers backward questions about as well as forward ones.", "time": "a day", "made": true, "done": "LLaDA scores about 51.8 forward and 45.6 reversed, while Qwen2.5 7B falls from 75.9 to 38.0, as in Table 4."}]}, {"id": "blockdiff", "title": "Block diffusion and semi-autoregressive decoding", "kind": "paper", "track": "disc", "pre": ["mdlm", "masks", "serving"], "frontier": true, "core": "Generate text block by block from left to right, with masked diffusion inside each block. Blocks attend causally to earlier ones, so KV caching and any length work as in autoregressive models, while a block’s tokens come out in parallel; block size one is autoregression.", "reach": "Interpolates between language models and masked diffusion; block-wise caching underlies training-free speedups for diffusion LLM serving.", "uses": "Making diffusion LLMs practical to serve: block decoding with KV caching appears in research systems such as BD3-LMs and Fast-dLLM, giving parallel generation without fixing the output length in advance.", "worth": "you work on diffusion LLM inference or architecture; it is recent and moving, and anyone outside that area can skip it.", "resources": [{"title": "Block Diffusion", "url": "https://m-arriola.com/bd3lms/", "type": "blog", "by": "Arriola et al., Cornell, 2025", "level": 1, "note": "The authors’ page: the likelihood, the training and sampling algorithms, and why the diffusion gap comes from variance."}, {"title": "Block Diffusion: Interpolating Between Autoregressive and Diffusion Language Models", "url": "https://arxiv.org/abs/2503.09573", "type": "paper", "by": "Arriola et al., Cornell, ICLR 2025", "level": 2}, {"title": "Fast-dLLM: Training-free Acceleration of Diffusion LLM by Enabling KV Cache and Parallel Decoding", "url": "https://arxiv.org/abs/2505.22618", "type": "paper", "by": "Wu et al., NVIDIA, 2025", "level": 3, "note": "Adds approximate block-wise KV caching and confidence-based parallel decoding to LLaDA and Dream without retraining."}, {"title": "Block diffusion at three block sizes", "url": "https://github.com/kuleshov-group/bd3lms", "type": "project", "by": "Built on Arriola et al., 2025", "level": 3, "build": "Block diffusion added to a small masked diffusion language model on one GPU: block causal attention, a KV cache across blocks, and training at block sizes 4, 8 and 16 on LM1B.", "teaches": "Where the gap between masked diffusion and autoregression comes from, and what caching and variable length cost a diffusion model.", "time": "a week", "made": true, "done": "Test perplexity falls as blocks shrink, in the order of Table 3: on LM1B, MDLM gives 31.78, block size 16 gives 30.60, 8 gives 29.83, and 4 gives 28.23."}]}, {"id": "dfm", "title": "Discrete flow matching and edit flows", "kind": "concept", "track": "disc", "pre": ["fm", "sedd"], "frontier": true, "core": "Choose a probability path that moves each token from noise or [MASK] to data, and learn the rates of a continuous-time Markov chain, the discrete analog of a velocity field, that carry samples along it. Edit Flows adds insertions and deletions, so length can change.", "reach": "Brings flow matching to tokens and treats masked diffusion and score entropy as particular choices of path and rate.", "uses": "Research generators for code, text, and molecules, including Meta’s Discrete Flow Matching code models, and protein design methods such as Multiflow that generate sequence and structure together.", "worth": "you research discrete generative models; it is frontier work, and practitioners can rely on masked diffusion until a standard emerges.", "resources": [{"title": "Flow Matching Guide and Code", "url": "https://arxiv.org/abs/2412.06264", "type": "tutorial", "by": "Lipman et al., Meta, 2024", "level": 2, "note": "Sections 6 and 7: continuous-time Markov chains, then discrete flow matching with factorized paths."}, {"title": "Discrete Flow Matching", "url": "https://arxiv.org/abs/2407.15595", "type": "paper", "by": "Gat et al., Meta, 2024", "level": 2}, {"title": "Edit Flows: Flow Matching with Edit Operations", "url": "https://arxiv.org/abs/2506.09018", "type": "paper", "by": "Havasi, Karrer, Gat, Chen, Meta, 2025", "level": 3, "note": "Insertions, deletions and substitutions as a Markov chain over sequences of any length."}, {"title": "Generative Flows on Discrete State-Spaces: Enabling Multimodal Flows with Applications to Protein Co-Design", "url": "https://arxiv.org/abs/2402.04997", "type": "paper", "by": "Campbell, Yim, Barzilay, Rainforth, Jaakkola, 2024", "level": 3, "note": "An independent derivation of discrete flows, used for joint sequence and structure generation."}, {"title": "flow_matching", "url": "https://github.com/facebookresearch/flow_matching", "type": "code", "by": "Meta FAIR, 2024", "level": 2, "note": "PyTorch library with continuous and discrete flow matching examples."}, {"title": "Discrete flow matching on two moons", "url": "https://github.com/facebookresearch/flow_matching/blob/main/examples/standalone_discrete_flow_matching.ipynb", "type": "project", "by": "Built on Lipman et al., 2024", "level": 1, "build": "Discrete flow matching written from Section 7 of the guide: a mixture path, a denoiser for points of two tokens on a 128 by 128 grid, and an Euler sampler.", "teaches": "How a probability path over tokens turns into jump rates, and how a uniform or a mask source changes sampling.", "time": "a day", "made": true, "done": "From uniform noise, 10 Euler steps of size 0.1 put the samples on the two moons, as the guide’s Code 11 does, and a mask source gets there too."}]}, {"id": "dllmrl", "title": "RL for diffusion language models", "kind": "concept", "track": "disc", "pre": ["llada", "rlvr"], "frontier": true, "core": "Policy gradient methods such as GRPO need each sampled answer’s log-probability, which a masked diffusion model cannot compute exactly. d1 approximates it from one forward pass with the prompt randomly masked; later methods use ELBO estimates with variance reduction, or upper and lower bounds together.", "reach": "Carries RL with verifiable rewards to diffusion LLMs; image diffusion meets the same likelihood problem in reward fine-tuning.", "uses": "Improving math and coding reasoning in diffusion language models such as LLaDA through methods like d1’s diffu-GRPO; for now this is research with no settled recipe.", "worth": "you research diffusion LLMs or RL for reasoning; the methods change every few months, so others can skip it entirely.", "resources": [{"title": "How to Build a Diffusion Language Model", "url": "https://kuleshov-group.github.io/blog/blog/2026/how-to-build-a-diffusion-language-model/", "type": "blog", "by": "Kuleshov group, Cornell, 2026", "level": 1, "note": "The section on post-training diffusion language models."}, {"title": "d1: Scaling Reasoning in Diffusion Large Language Models via Reinforcement Learning", "url": "https://arxiv.org/abs/2504.12216", "type": "paper", "by": "Zhao, Gupta, Zheng, Grover, 2025", "level": 2, "note": "Masked SFT, then diffu-GRPO with a mean-field, one-step log-probability estimate."}, {"title": "LLaDA 1.5: Variance-Reduced Preference Optimization for Large Language Diffusion Models", "url": "https://arxiv.org/abs/2505.19223", "type": "paper", "by": "Zhu et al., 2025", "level": 2, "note": "Preference optimization on ELBO estimates, and how to cut their variance."}, {"title": "DiffuCoder: Understanding and Improving Masked Diffusion Models for Code Generation", "url": "https://arxiv.org/abs/2506.20639", "type": "paper", "by": "Gong et al., Apple, 2025", "level": 3, "note": "Coupled-GRPO: complementary masks give lower variance likelihood estimates during RL on code."}, {"title": "SPG: Sandwiched Policy Gradient for Masked Diffusion Language Models", "url": "https://arxiv.org/abs/2510.09541", "type": "paper", "by": "Wang et al., 2025", "level": 3, "note": "Uses an upper and a lower bound on the log-likelihood to reduce policy gradient bias."}, {"title": "diffu-GRPO on Countdown", "url": "https://github.com/dllm-reasoning/d1", "type": "project", "by": "Built on Zhao et al., 2025", "level": 3, "build": "diffu-GRPO for LLaDA 8B Instruct on one GPU: the one-pass log-probability estimate with 15 percent of prompt tokens masked, LoRA on 4-bit weights, and a Countdown reward.", "teaches": "What GRPO needs from a likelihood it cannot compute exactly, and how random prompt masking changes the noise and stability of its gradient.", "time": "two weeks", "made": true, "done": "Countdown accuracy at 256 tokens rises from LLaDA’s 19.5 percent to near 31.3, the diffu-GRPO result in Table 1."}]}, {"id": "rewardft", "title": "Reward fine-tuning of diffusion models", "kind": "concept", "track": "ctrl", "pre": ["ddpm", "pg"], "frontier": false, "core": "Treat each denoising step as an action in a Markov decision process whose reward arrives only with the final sample, then fine-tune with policy gradients, or backpropagate a differentiable reward through the sampler. A KL penalty toward the pretrained model limits reward hacking.", "reach": "Adjoint matching solves the KL-regularized problem exactly; the same recipes fine-tune diffusion language models and diffusion policies.", "uses": "Aligning image generators to human preferences, aesthetics, and prompt adherence, as in DDPO and Diffusion-DPO; tuning diffusion robot policies with rewards; and pushing protein and molecule generators toward properties such as binding.", "worth": "you will fine-tune generative models toward a goal beyond the data; it needs both diffusion and policy gradients, so it suits committed practitioners.", "resources": [{"title": "Training Diffusion Models with Reinforcement Learning", "url": "https://bair.berkeley.edu/blog/2023/07/14/ddpo/", "type": "blog", "by": "Kevin Black, BAIR blog, 2023", "level": 1}, {"title": "Training Diffusion Models with Reinforcement Learning", "url": "https://arxiv.org/abs/2305.13301", "type": "paper", "by": "Black, Janner, Du, Kostrikov, Levine, 2023", "level": 2}, {"title": "Understanding Reinforcement Learning-Based Fine-Tuning of Diffusion Models: A Tutorial and Review", "url": "https://arxiv.org/abs/2407.13734", "type": "tutorial", "by": "Uehara, Zhao, Biancalani, Levine, 2024", "level": 2}, {"title": "Directly Fine-Tuning Diffusion Models on Differentiable Rewards", "url": "https://arxiv.org/abs/2309.17400", "type": "paper", "by": "Clark, Vicol, Swersky, Fleet, 2023", "level": 2}, {"title": "Flow-GRPO: Training Flow Matching Models via Online RL", "url": "https://arxiv.org/abs/2505.05470", "type": "paper", "by": "Liu et al., 2025", "level": 3}, {"title": "ddpo-pytorch", "url": "https://github.com/kvablack/ddpo-pytorch", "type": "project", "by": "Kevin Black, 2023", "level": 2, "build": "Stable Diffusion 1.5 fine-tuned with policy gradients against a reward such as JPEG compressibility or an aesthetic score, with LoRA so it fits on a GPU with 10 GB.", "teaches": "Denoising as a multi-step decision process, and how a reward model’s quirks show up in the images it comes to favor.", "time": "a week", "signature": true}]}, {"id": "adjoint", "title": "Adjoint matching", "kind": "paper", "track": "ctrl", "pre": ["rewardft", "soc", "fm"], "frontier": true, "core": "KL-regularized reward fine-tuning is a stochastic optimal control problem whose target reweights the base distribution by exp(reward). With a memoryless noise schedule that target is reached exactly, and the control is learned by regressing onto a lean adjoint state solved backward from the reward gradient.", "reach": "The same regression drives adjoint sampling and bridge samplers for unnormalized densities.", "uses": "Fine-tuning flow and diffusion image generators toward a reward while keeping their diversity, and, as adjoint sampling, generating molecular conformations from an energy function instead of from data.", "worth": "you research diffusion fine-tuning or sampling; it requires stochastic control and flow matching, and is too new for applied work to need.", "resources": [{"title": "Reward fine-tuning for flow and diffusion models (slides)", "url": "https://diffusion.csail.mit.edu/docs/guest_slides_lecture_4.pdf", "type": "notes", "by": "Carles Domingo-Enrich, 2024, hosted by MIT 6.S184", "level": 1, "note": "The first author’s walk through the method before the paper’s proofs."}, {"title": "Adjoint Matching: Fine-tuning Flow and Diffusion Generative Models with Memoryless Stochastic Optimal Control", "url": "https://arxiv.org/abs/2409.08861", "type": "paper", "by": "Domingo-Enrich, Drozdzal, Karrer, Chen, 2024", "level": 2, "note": "Sections 4 and 5 hold the method; Appendix D proves the memoryless schedule."}, {"title": "Fine-Tuning of Continuous-Time Diffusion Models as Entropy-Regularized Control", "url": "https://arxiv.org/abs/2402.15194", "type": "paper", "by": "Uehara et al., 2024", "level": 2}, {"title": "A Taxonomy of Loss Functions for Stochastic Optimal Control", "url": "https://arxiv.org/abs/2410.00345", "type": "paper", "by": "Carles Domingo-Enrich, 2024", "level": 3}, {"title": "Reinforce Adjoint Matching: Scaling RL Post-Training of Diffusion and Flow-Matching Models", "url": "https://arxiv.org/abs/2605.10759", "type": "paper", "by": "Bergmeister, Jegelka, Nüsken, Domingo-Enrich, Pidstrigach, 2026", "level": 3}, {"title": "Adjoint matching on a 1D flow under three noise schedules", "url": "https://arxiv.org/abs/2409.08861", "type": "project", "by": "Built on Domingo-Enrich, Drozdzal, Karrer, Chen, 2024", "level": 3, "build": "A 1D flow matching model fine-tuned toward a reward by adjoint matching with σ(t) = 0.2, with σ(t) = 1, and with the memoryless schedule, against the tilted density computed on a grid.", "teaches": "Why reward fine-tuning must use the memoryless noise schedule to reach the base density times exp(reward), even when you later sample without noise.", "time": "a weekend", "made": true, "done": "Only the memoryless schedule matches the tilted density, while constant σ(t) of 0.2 and 1.0 stay biased, as in Figure 2."}]}, {"id": "steering", "title": "Inference-time steering and twisted SMC", "kind": "concept", "track": "ctrl", "pre": ["guidance", "montecarlo"], "frontier": true, "core": "Leave the weights alone and steer at sampling time: run many particles through the denoiser, weight each by an estimate of its final reward, and resample. Unlike plain guidance, this sequential Monte Carlo becomes exact for the tilted or conditional target as particles grow.", "reach": "Inference-time scaling for diffusion models, and the twisted SMC used for constrained generation in language models and protein design.", "uses": "Making a pretrained generator satisfy constraints at sampling time without retraining: reward alignment for text-to-image, protein design around a fixed motif, and text generation that must obey rules or a grammar.", "worth": "you want inference-time control of generative models without fine-tuning; it is active research, and plain guidance covers most practical needs.", "resources": [{"title": "Inference-Time Alignment in Diffusion Models with Reward-Guided Generation: Tutorial and Review", "url": "https://arxiv.org/abs/2501.09685", "type": "tutorial", "by": "Uehara et al., 2025", "level": 1}, {"title": "Practical and Asymptotically Exact Conditional Sampling in Diffusion Models", "url": "https://arxiv.org/abs/2306.17775", "type": "paper", "by": "Wu, Trippe, Naesseth, Blei, Cunningham, 2023", "level": 2}, {"title": "A General Framework for Inference-time Scaling and Steering of Diffusion Models", "url": "https://arxiv.org/abs/2501.06848", "type": "paper", "by": "Singhal et al., 2025", "level": 2, "note": "Feynman-Kac steering."}, {"title": "Probabilistic Inference in Language Models via Twisted Sequential Monte Carlo", "url": "https://arxiv.org/abs/2404.17546", "type": "paper", "by": "Zhao, Brekelmans, Makhzani, Grosse, 2024", "level": 3}, {"title": "Are we really tilting? The mechanics of reward guidance in flow and diffusion models", "url": "https://arxiv.org/abs/2606.02884", "type": "paper", "by": "Dandapanthula, Boffi, 2026", "level": 3}, {"title": "Twisted SMC against guidance in two dimensions", "url": "https://arxiv.org/abs/2306.17775", "type": "project", "by": "Built on Wu, Trippe, Naesseth, Blei, Cunningham, 2023", "level": 3, "build": "TDS, plain importance sampling, and gradient guidance on a diffusion model of a 2D Gaussian with exact scores, conditioned on a noisy observation of the point’s norm.", "teaches": "Why reweighting and resampling particles makes conditional sampling exact as particles grow, while guidance stays biased however many samples you draw.", "time": "a weekend", "made": true, "done": "Error in the conditional mean falls like 1/K with K particles, a slope of -1 on a log-log plot, while guidance stays flat, as in Figure 1."}]}, {"id": "densities", "title": "Diffusion samplers for unnormalized densities", "kind": "concept", "track": "ctrl", "pre": ["bridges", "adjoint", "montecarlo"], "frontier": true, "core": "When the target is known only through an energy, as for molecules at equilibrium, there is no data to denoise. Instead, learn the drift of a controlled diffusion that carries noise to the target, using control losses built from the energy and its gradient.", "reach": "Brings diffusion to molecular simulation and Bayesian posteriors, where MCMC and parallel tempering remain the baselines to beat.", "uses": "Sampling molecular configurations and protein conformations from a physics energy, Bayesian posterior inference, and statistical physics models, competing with decades of MCMC; it could make molecular simulation cheaper but is still research.", "worth": "molecular simulation, Bayesian computation, or sampling theory is your area; it sits at the frontier and needs stochastic control and MCMC first.", "resources": [{"title": "Boltzmann Generators: Sampling Equilibrium States of Many-Body Systems with Deep Learning", "url": "https://arxiv.org/abs/1812.01729", "type": "paper", "by": "Noé, Olsson, Köhl
