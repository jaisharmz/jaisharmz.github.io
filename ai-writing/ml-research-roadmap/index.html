", "by": "Built on Dauparas et al., 2022", "level": 2, "build": "Sequences designed for a set of native backbones from the PDB, scored position by position against the real sequence, and swept over sampling temperature.", "teaches": "How much of a sequence the backbone alone decides, and the trade between recovering the native residue and finding a different one that fits.", "time": "a day", "made": true, "done": "Average native sequence recovery on native backbones lands near the paper’s 52.4 percent, against 32.9 percent reported for Rosetta."}]}, {"id": "proteins", "title": "Protein backbone generation with diffusion and flows", "kind": "concept", "track": "bio", "pre": ["structure", "scoresde", "fm", "geometric"], "frontier": true, "core": "Represent a backbone as one rigid frame per residue, a rotation and a translation. Noise those frames toward random rotations and positions, then learn to denoise them, so sampling grows a new fold whose length, symmetry, or motif you can fix in advance.", "reach": "The output is a shape with no sequence, so inverse folding or co-design supplies the amino acids, and binder design conditions on a target.", "uses": "De novo design of proteins that do not occur in nature, including binders against chosen targets and scaffolds built around a functional site. RFdiffusion-style tools are standard in design labs and startups.", "worth": "you want to generate proteins; needs structure prediction, score-based diffusion, flow matching, and equivariance, which is a serious stack.", "resources": [{"title": "MIT 6.S184: Flow Matching and Diffusion Models - Lecture 06 - Diffusion for Proteins (2025)", "url": "https://www.youtube.com/watch?v=hi_s4T1-gBY", "type": "video", "by": "Jason Yim, guest lecture, MIT 6.S184, 2025", "level": 1, "note": "38 minutes from one of the authors of the frame based models, from the SE(3) setup through to how designability is measured."}, {"title": "De novo design of protein structure and function with RFdiffusion", "url": "https://www.nature.com/articles/s41586-023-06415-8", "type": "paper", "by": "Watson, Juergens, Bennett et al., Baker lab, Nature 2023", "level": 2, "note": "Fine-tunes a structure predictor into the denoiser, then tests monomers, symmetric oligomers, motif scaffolds, and binders in the lab."}, {"title": "SE(3) diffusion model with application to protein backbone generation", "url": "https://arxiv.org/abs/2302.02277", "type": "paper", "by": "Yim, Trippe, De Bortoli et al., MIT, 2023", "level": 2, "note": "FrameDiff: the derivation of diffusion on the product of rotations and translations, trained on structures alone with no predictor inside."}, {"title": "Fast protein backbone generation with SE(3) flow matching", "url": "https://arxiv.org/abs/2310.05297", "type": "paper", "by": "Yim, Campbell et al., MIT and Microsoft Research, 2023", "level": 3, "note": "The same frames under flow matching: five times fewer sampling steps than the diffusion version, with better designability."}, {"title": "Proteina: Scaling Flow-based Protein Structure Generative Models", "url": "https://arxiv.org/abs/2503.00710", "type": "paper", "by": "Geffner et al., NVIDIA, 2025", "level": 3, "note": "Scales to a transformer five times larger on millions of predicted structures, conditioned on hierarchical fold class labels, with metrics that compare distributions rather than single samples."}, {"title": "RFdiffusion examples", "url": "https://github.com/RosettaCommons/RFdiffusion/tree/main/examples", "type": "project", "by": "Watson, Juergens, Bennett et al., Baker lab, 2023", "level": 2, "note": "run_inference.py with a contig string is the first command; the examples folder holds one script per task.", "build": "Backbones generated on one GPU from the example scripts: unconditional monomers at a chosen length, a scaffold grown around a fixed functional motif, and a symmetric oligomer.", "teaches": "What the contig syntax pins down and what the model invents on its own, and how a motif or a symmetry narrows what comes out.", "time": "a weekend"}, {"title": "Score your own backbones for designability", "url": "https://arxiv.org/abs/2310.05297", "type": "project", "by": "Built on Yim, Campbell et al., 2023", "level": 3, "build": "The field’s evaluation loop on one GPU: backbones sampled for every length from 60 to 128, eight sequences designed per backbone, each refolded, and the self-consistency RMSD measured.", "teaches": "The metric generative protein models are actually judged by, and how the number of sampling steps trades speed against designability.", "time": "a week", "made": true, "done": "At 100 integration steps designability reaches the paper’s 0.77 of samples under 2 angstroms, against 0.39 for the diffusion baseline at the same budget."}]}, {"id": "codesign", "title": "Sequence and structure co-design", "kind": "concept", "track": "bio", "pre": ["proteins", "plm", "d3pm", "dfm"], "frontier": true, "core": "Generate sequence and structure in one process rather than designing a backbone first and fitting amino acids to it afterwards. The state holds continuous coordinates and discrete residue types together, and each denoising step updates both, so they agree at every step.", "reach": "Conditioning can come from either side, a sequence motif or a structural pocket, and extends to all atom design with side chains.", "uses": "Designing a protein’s shape and its sequence together, which matters most where the two constrain each other, such as binding pockets and catalytic sites. This is active research, not settled practice.", "worth": "you research generative models for biology; needs backbone generation, protein language models, and discrete diffusion, so start elsewhere.", "resources": [{"title": "Towards deep learning sequence-structure co-generation for protein design", "url": "https://arxiv.org/abs/2410.01773", "type": "paper", "by": "Wang, Alamdari, Domingo-Enrich, Amini, Yang, Microsoft Research, 2024", "level": 1, "note": "A review that sorts these models by what each one actually denoises, and by how co-generation gets evaluated."}, {"title": "Generative Flows on Discrete State-Spaces: Enabling Multimodal Flows with Applications to Protein Co-Design", "url": "https://arxiv.org/abs/2402.04997", "type": "paper", "by": "Campbell, Yim, Barzilay, Rainforth, Jaakkola, 2024", "level": 2, "note": "Multiflow: flow matching on discrete states through continuous time Markov chains, run alongside the frame flow, and the one model also fills in either modality given the other."}, {"title": "Simulating 500 million years of evolution with a language model", "url": "https://www.biorxiv.org/content/10.1101/2024.07.01.600583v1", "type": "paper", "by": "Hayes et al., EvolutionaryScale, 2024; Science 2025", "level": 2, "note": "Masked generation over sequence, structure, and function tokens can be decoded in any order, so a prompt on one track returns the others."}, {"title": "Joint Generation of Protein Sequence and Structure with RoseTTAFold Sequence Space Diffusion", "url": "https://www.biorxiv.org/content/10.1101/2023.05.08.539766v1", "type": "paper", "by": "Lisanza, Gershon et al., Baker lab, 2023; Nature Biotechnology 2025", "level": 2, "note": "ProteinGenerator diffuses in sequence space and reads the structure out of RoseTTAFold at each step, which makes composition and multistate constraints easy to impose."}, {"title": "DPLM-2: A Multimodal Diffusion Protein Language Model", "url": "https://arxiv.org/abs/2410.13782", "type": "paper", "by": "Wang et al., 2024; ICLR 2025", "level": 3, "note": "Quantizes coordinates into structure tokens so one discrete diffusion model, warm started from a sequence model, covers both tracks."}, {"title": "La-Proteina: Atomistic Protein Generation via Partially Latent Flow Matching", "url": "https://arxiv.org/abs/2507.09466", "type": "paper", "by": "Geffner et al., NVIDIA, 2025", "level": 3, "note": "Explicit backbone coordinates plus per residue latents that carry the sequence and side chain atoms, which avoids side chains that change length during generation."}, {"title": "MultiFlow", "url": "https://github.com/jasonkyuyim/multiflow", "type": "project", "by": "Campbell, Yim et al., 2024", "level": 3, "note": "Weights and the test set are on Zenodo; the inference configs set the GPUs, the timesteps, and the folding model.", "build": "One set of published weights run on all three of its tasks on a GPU: sequence and structure generated together, sequence given structure, and structure given sequence.", "teaches": "That fixing either channel turns a co-design model into a folder or a designer, and what co-design costs against doing the two steps apart.", "time": "a weekend"}]}, {"id": "binder", "title": "Binder design: generate, fold, filter", "kind": "concept", "track": "bio", "pre": ["cofold", "proteins", "invfold"], "frontier": true, "core": "Designing something that sticks to a chosen target is a loop: generate or hallucinate a backbone against the target site, pick a sequence for it, refold the pair, and keep only the designs the predictor is confident about. Then order a few dozen and measure.", "reach": "The in silico filters stand in for a wet lab screen, so how well they correlate with real binding is what sets the hit rate.", "uses": "Finding proteins that stick to a chosen target, which is the computational half of antibody and minibinder discovery for therapeutics, diagnostics, and biosensors, with surviving designs ordered and measured in a lab.", "worth": "you sit near a wet lab or a design team; needs co-folding, backbone generation, and inverse folding, and the filters decide everything.", "resources": [{"title": "BindCraft: one-shot design of functional protein binders", "url": "https://www.biorxiv.org/content/10.1101/2024.09.30.615802v1", "type": "paper", "by": "Pacesa et al., EPFL, 2024; Nature 2025", "level": 2, "note": "Hallucinates a binder through AlphaFold 2’s own weights, redesigns the sequence, filters on interface scores, and reports 10 to 100% experimental success without screening."}, {"title": "Improving de novo protein binder design with deep learning", "url": "https://www.nature.com/articles/s41467-023-38328-5", "type": "paper", "by": "Bennett, Coventry et al., Baker lab, Nature Communications 2023", "level": 2, "note": "Where the filters came from: rescoring designed complexes with AlphaFold 2 raises the experimental hit rate about tenfold over energy based scoring."}, {"title": "martinpacesa/BindCraft", "url": "https://github.com/martinpacesa/BindCraft", "type": "code", "by": "Martin Pacesa, EPFL, 2024", "level": 2, "note": "The filter and advanced settings files are the plainest statement of which designs get thrown away."}, {"title": "De novo design of high-affinity protein binders with AlphaProteo", "url": "https://arxiv.org/abs/2409.08022", "type": "paper", "by": "Zambaldi et al., Google DeepMind, 2024", "level": 3, "note": "A generator trained on complexes: 3 to 300 times better affinities than earlier methods on seven targets, after one round of medium throughput screening."}, {"title": "Crowdsourced Protein Design: Lessons From the Adaptyv EGFR Binder Competition", "url": "https://www.biorxiv.org/content/10.1101/2025.04.17.648362v1", "type": "paper", "by": "Cotet, Krawczuk et al., Adaptyv Bio, 2025", "level": 3, "note": "Over 1,800 designs against one target, 601 measured in the same lab: the best de novo binder reached 82 nM, and the report’s conclusion is that the computational metrics cannot yet rank methods."}, {"title": "Adaptyv protein design competitions", "url": "https://proteinbase.com/competitions", "type": "project", "by": "Adaptyv Bio, 2024 to 2026", "level": 2, "note": "Finished rounds publish their targets and lab results, so they still work as benchmarks.", "build": "Binders designed against a published target such as EGFR: generated, folded, and filtered in silico, and in an open round tested for binding in Adaptyv’s lab.", "teaches": "The whole generate, fold, and filter loop, and how well in silico confidence predicts binding in a wet lab.", "time": "two weeks", "signature": true}]}, {"id": "genomics", "title": "DNA and genomic language models", "kind": "concept", "track": "bio", "pre": ["biobasics", "lm", "ssm"], "frontier": true, "core": "Treat genomes as text in four letters and train a model to predict masked or next bases across species. The hard part is length: a regulatory element can act 100,000 bases away, so Evo 2 uses long convolutions to read a million bases at once.", "reach": "The main use of long-context state space and convolution models outside text; zero-shot variant effect scores and designed genomes follow.", "uses": "Scoring whether a DNA variant is likely harmful, which feeds research on clinical interpretation, predicting regulatory activity, and designing sequences such as promoters. Evo 2 is the long-context example.", "worth": "you want long-sequence modeling with real stakes; needs biology basics, language modeling, and state-space models, and evaluation is still contested.", "resources": [{"title": "Learning from DNA: a grand challenge in biology", "url": "https://hazyresearch.stanford.edu/blog/2024-03-14-evo", "type": "blog", "by": "Eric Nguyen, Michael Poli et al., Hazy Research and Arc Institute, 2024", "level": 1, "note": "Why DNA is hard for transformers, DNA scaling laws, and Evo’s zero-shot predictions."}, {"title": "Genomic Language Models: Opportunities and Challenges", "url": "https://arxiv.org/abs/2407.11435", "type": "paper", "by": "Benegas, Ye, Albors, Li, Song, 2024", "level": 2, "note": "What DNA language models are used for, from predicting which bases are under constraint to sequence design, and what makes them hard to build and evaluate."}, {"title": "Genome modelling and design across all domains of life with Evo 2", "url": "https://www.nature.com/articles/s41586-026-10176-5", "type": "paper", "by": "Brixi et al., Arc Institute, Nature 2026", "level": 2, "note": "A model trained on genomes from across the tree of life with a million base context, scoring variants zero-shot and generating genome-scale sequences."}, {"title": "Effective gene expression prediction from sequence by integrating long-range interactions", "url": "https://www.nature.com/articles/s41592-021-01252-x", "type": "paper", "by": "Avsec et al., DeepMind, Nature Methods 2021", "level": 2, "note": "Enformer, the supervised counterpart: it predicts thousands of measured genomic tracks from about 200,000 bases of sequence."}, {"title": "HyenaDNA: Long-Range Genomic Sequence Modeling at Single Nucleotide Resolution", "url": "https://arxiv.org/abs/2306.15794", "type": "paper", "by": "Nguyen, Poli et al., Stanford, 2023", "level": 3, "note": "The long-convolution predecessor of Evo, with context up to a million tokens."}, {"title": "Evo 2: zero-shot BRCA1 variant effect prediction", "url": "https://github.com/ArcInstitute/evo2/blob/main/notebooks/brca1/brca1_zero_shot_vep.ipynb", "type": "project", "by": "Brixi et al., Arc Institute, 2025", "level": 2, "note": "The notebook uses Evo 2 1B as a demonstration and recommends the 7B and 40B models for accuracy.", "build": "An 8,192 base window around each BRCA1 single nucleotide variant scored by Evo 2 on one GPU, the change in likelihood compared between functional and loss-of-function variants, and its AUROC.", "teaches": "What a genome model’s likelihood ratio says about a variant with no labels at all, and how much the window and the model size matter.", "time": "an afternoon"}]}, {"id": "singlecell", "title": "Single-cell foundation models", "kind": "concept", "track": "bio", "pre": ["biobasics", "attention", "lm"], "frontier": true, "core": "Each cell is a vector of counts over about 20,000 genes. Treat genes as tokens, mask some, and pretrain a transformer on tens of millions of cells, hoping its embeddings capture cell state; zero-shot tests found simpler methods often beat them.", "reach": "The step toward a virtual cell that predicts responses to perturbations; the benchmark failures make evaluation and interpretability the open problems.", "uses": "Annotating cell types in new datasets, predicting how cells respond to a drug or a gene knockout, and target discovery built on that. Simpler baselines still win several benchmarks, so read claims carefully.", "worth": "you have single-cell data or want that problem; needs biology basics and transformers, and the open question is evaluation, not architecture.", "resources": [{"title": "Single-cell best practices", "url": "https://www.sc-best-practices.org/", "type": "book", "by": "Heumos, Schaar et al., scverse, 2023", "level": 1, "note": "The Introduction and RNA parts: what a count matrix measures and the standard analysis built on it."}, {"title": "scGPT: Towards Building a Foundation Model for Single-Cell Multi-omics Using Generative AI", "url": "https://www.biorxiv.org/content/10.1101/2023.04.30.538439v1", "type": "paper", "by": "Cui et al., Bo Wang lab, 2023; Nature Methods 2024", "level": 2, "note": "Genes as tokens with their expression values, masked generative pretraining on 33 million cells, and fine-tuning for annotation, integration, and perturbation response."}, {"title": "Zero-shot evaluation reveals limitations of single-cell foundation models", "url": "https://link.springer.com/article/10.1186/s13059-025-03574-x", "type": "paper", "by": "Kedzierska, Crawford, Amini, Lu, Microsoft Research, Genome Biology 2025", "level": 2, "note": "Zero-shot scGPT and Geneformer embeddings against simpler methods on cell type clustering and batch correction."}, {"title": "Transfer learning enables predictions in network biology", "url": "https://www.nature.com/articles/s41586-023-06139-9", "type": "paper", "by": "Theodoris et al., Nature 2023", "level": 2, "note": "Geneformer ranks each cell’s genes by expression instead of using counts, the main alternative to scGPT’s input.", "paid": true}, {"title": "How to Build the Virtual Cell with Artificial Intelligence: Priorities and Opportunities", "url": "https://arxiv.org/abs/2409.11654", "type": "paper", "by": "Bunne, Roohani, Rosen et al., 2024", "level": 3, "note": "The research program these models serve: a model of the cell that predicts how it responds to perturbations."}, {"title": "scGPT: fine-tuning for cell type annotation", "url": "https://scgpt.readthedocs.io/en/latest/tutorial_annotation.html", "type": "project", "by": "Cui et al., 2024", "level": 2, "build": "A pretrained single-cell foundation model fine-tuned to annotate cell types in a multiple sclerosis dataset, then checked against the expert labels.", "teaches": "What fine-tuning a single-cell foundation model involves, and how to judge it against simpler baselines.", "time": "a day"}]}, {"id": "pinn", "title": "Physics-informed neural networks", "kind": "concept", "track": "science", "pre": ["backprop", "odes"], "frontier": false, "core": "Fit a network u(x, t) to sparse data while penalizing its PDE residual at random points, with derivatives from automatic differentiation. The physics acts as a regularizer, so one loss solves forward and inverse problems without a mesh, though multiscale problems often fail to train.", "reach": "Neural operators learn the whole solution map instead of one solution; differentiable solvers in the loop are the other way to train with physics.", "uses": "Inverse problems where data is sparse and the equations are known, such as identifying material properties or reconstructing a flow from a few sensors. Classical solvers usually still win on forward problems.", "worth": "you hold sparse data plus a known PDE; needs backprop and numerical ODEs, and knowing the training failures saves wasted months.", "resources": [{"title": "So, what is a physics-informed neural network?", "url": "https://benmoseley.blog/my-research/so-what-is-a-physics-informed-neural-network/", "type": "blog", "by": "Ben Moseley, 2021", "level": 1, "note": "Fits a damped harmonic oscillator with and without the physics loss, with code."}, {"title": "Physics Informed Deep Learning (Part I): Data-driven Solutions of Nonlinear Partial Differential Equations", "url": "https://arxiv.org/abs/1711.10561", "type": "paper", "by": "Raissi, Perdikaris, Karniadakis, 2017", "level": 2, "note": "Published with Part II as the 2019 Journal of Computational Physics paper on PINNs."}, {"title": "Physics-Based Deep Learning", "url": "https://physicsbaseddeeplearning.org/", "type": "book", "by": "Nils Thuerey et al., TU Munich, 2021", "level": 2, "note": "The Physical Loss Terms chapter trains a PINN on Burgers’ equation; the Differentiable Physics chapters compare it with a solver in the loop."}, {"title": "Characterizing possible failure modes in physics-informed neural networks", "url": "https://arxiv.org/abs/2109.01050", "type": "paper", "by": "Krishnapriyan, Gholami, Zhe, Kirby, Mahoney, 2021", "level": 3, "note": "The physics loss makes simple convection and reaction problems hard to optimize; curriculum training and solving in short time windows fix them."}, {"title": "Burgers Optimization with a PINN", "url": "https://physicsbaseddeeplearning.org/physicalloss-code.html", "type": "project", "by": "Thuerey et al., Physics-based Deep Learning", "level": 1, "build": "A physics-informed network for Burgers’ equation, trained with the PDE residual in its loss to reconstruct the solution from an observation at one time.", "teaches": "How a residual loss turns a PDE into a training signal, and why the result is slower and less exact than a solver.", "time": "an afternoon", "signature": true}]}, {"id": "operators", "title": "Neural operators", "kind": "concept", "track": "science", "pre": ["pinn"], "frontier": false, "core": "Learn the map from one function to another, such as initial condition to solution at a later time, instead of solving one instance. A Fourier neural operator applies learned weights to low Fourier modes, so one trained model solves new instances fast at any resolution.", "reach": "FourCastNet runs it on the whole globe for weather; physics-informed neural operators add the PINN residual to the training loss.", "uses": "Fast surrogates that stand in for a slow simulator inside a design or optimization loop, across fluid dynamics, subsurface and reservoir modeling, and engineering design, and as the ancestor of learned weather models.", "worth": "you run simulations in a loop and need them faster; PINNs first, and resolution independence is the property to test honestly.", "resources": [{"title": "Fourier Neural Operator", "url": "https://zongyi-li.github.io/blog/2020/fourier-pde/", "type": "blog", "by": "Zongyi Li, 2020", "level": 1, "note": "Operator learning, the Fourier layer, and why it is resolution invariant, with Burgers, Darcy, and Navier-Stokes results."}, {"title": "Fourier Neural Operator for Parametric Partial Differential Equations", "url": "https://arxiv.org/abs/2010.08895", "type": "paper", "by": "Li, Kovachki, Azizzadenesheli, Liu, Bhattacharya, Stuart, Anandkumar, 2020", "level": 2}, {"title": "DeepONet: Learning nonlinear operators for identifying differential equations based on the universal approximation theorem of operators", "url": "https://arxiv.org/abs/1910.03193", "type": "paper", "by": "Lu, Jin, Karniadakis, 2019", "level": 2, "note": "The other main design: a branch net encodes the input function and a trunk net encodes the query point."}, {"title": "Fourier Neural Operators Explained: A Practical Perspective", "url": "https://arxiv.org/abs/2512.01421", "type": "paper", "by": "Duruisseaux, Kossaifi, Anandkumar, 2025", "level": 2, "note": "Design choices and pitfalls in practice, from the authors of the neuraloperator library."}, {"title": "Neural Operator: Learning Maps Between Function Spaces", "url": "https://arxiv.org/abs/2108.08481", "type": "paper", "by": "Kovachki, Li, Liu, Azizzadenesheli, Bhattacharya, Stuart, Anandkumar, 2021", "level": 3, "note": "The general definition as stacked integral operators, a universal approximation theorem, and discretization invariance."}, {"title": "Training an FNO on Darcy-Flow", "url": "https://neuraloperator.github.io/dev/auto_examples/models/plot_FNO_darcy.html", "type": "project", "by": "neuraloperator library", "level": 2, "build": "A Fourier neural operator that maps a permeability field to the pressure of Darcy flow, trained at 16 by 16 and tested zero-shot at 32 by 32.", "teaches": "What it means to learn an operator rather than a function, and why spectral layers carry over to new resolutions.", "time": "an afternoon"}]}, {"id": "weather", "title": "ML weather and climate models", "kind": "concept", "track": "science", "pre": ["operators", "gnns", "scoresde"], "frontier": true, "core": "Train a network on decades of reconstructed past weather to step the atmosphere 6 hours ahead, then roll it forward. GraphCast passes messages on a mesh over the globe and beats the leading physics model on most targets; GenCast samples ensembles with diffusion.", "reach": "Operators, GNNs, and diffusion meet real physics here; hybrids such as NeuralGCM keep a physics solver for the large-scale flow and learn the rest.", "uses": "Operational forecasting, where learned models now run alongside physics ones at national weather centers, and the energy, insurance, shipping, and agriculture decisions that buy those forecasts.", "worth": "you want machine learning with measurable public value; needs operators, graph networks, and diffusion, and the datasets are large but public.", "resources": [{"title": "GraphCast: AI model for faster and more accurate global weather forecasting", "url": "https://deepmind.google/discover/blog/graphcast-ai-model-for-faster-and-more-accurate-global-weather-forecasting/", "type": "blog", "by": "Google DeepMind, 2023", "level": 1}, {"title": "GraphCast: Learning skillful medium-range global weather forecasting", "url": "https://arxiv.org/abs/2212.12794", "type": "paper", "by": "Lam et al., Google DeepMind, 2022; Science 2023", "level": 2}, {"title": "Probabilistic weather forecasting with machine learning", "url": "https://www.nature.com/articles/s41586-024-08252-9", "type": "paper", "by": "Price et al., Google DeepMind, Nature 2024", "level": 2, "note": "GenCast: a conditional diffusion model whose sampled ensembles beat the leading physics ensemble."}, {"title": "Neural general circulation models for weather and climate", "url": "https://www.nature.com/articles/s41586-024-07744-y", "type": "paper", "by": "Kochkov et al., Google, Nature 2024", "level": 3, "note": "NeuralGCM: a differentiable solver for the large-scale dynamics with learned physics for the rest, stable enough for climate runs."}, {"title": "FourCastNet: A Global Data-driven High-resolution Weather Model using Adaptive Fourier Neural Operators", "url": "https://arxiv.org/abs/2202.11214", "type": "paper", "by": "Pathak et al., NVIDIA, 2022", "level": 3, "note": "The neural operator route to the same problem."}, {"title": "WeatherBench 2: A benchmark for the next generation of data-driven global weather models", "url": "https://arxiv.org/abs/2308.15560", "type": "paper", "by": "Rasp et al., Google, 2023", "level": 3, "note": "The shared data, metrics, and baselines these models are scored on."}, {"title": "GraphCast demo notebook", "url": "https://github.com/google-deepmind/graphcast/blob/main/docs/weathernext1_graph/graphcast_demo.ipynb", "type": "project", "by": "Google DeepMind, 2023", "level": 2, "note": "The 1 degree model is the one that fits a small free runtime.", "build": "GraphCast loaded from a pretrained snapshot in Colab, run on an example atmospheric state to produce a forecast, with the training loss and its gradients computed for one step.", "teaches": "What one learned forecast step takes in and returns, and what the smaller 1 degree model costs to run and to differentiate.", "time": "an afternoon"}, {"title": "Score a learned forecast against HRES with WeatherBench 2", "url": "https://arxiv.org/abs/2212.12794", "type": "project", "by": "Built on Lam et al., Google DeepMind, 2022", "level": 3, "note": "WeatherBench 2 publishes both the forecasts and the reanalysis as Zarr, so no model needs to be run.", "build": "A learned model’s forecasts and the physics model’s, both scored against reanalysis with WeatherBench 2 for a set of variables, levels, and lead times, then compared target by target.", "teaches": "What a forecast score actually compares, and why a single headline RMSE hides which variables and lead times a model wins.", "time": "a weekend", "made": true, "done": "The learned model beats HRES on about 90 percent of the targets you score, the paper’s figure being 90.3 percent of 1,380 verification targets."}]}, {"id": "mlip", "title": "Machine-learned interatomic potentials", "kind": "concept", "track": "science", "pre": ["geometric"], "frontier": true, "core": "Quantum chemistry gives accurate energies and forces for atoms, but its cost grows roughly as the cube of their number. Fit an equivariant network to its energies, take forces as the negative gradient, and run molecular dynamics far faster at nearly the same accuracy.", "reach": "Universal potentials trained across the periodic table, such as MACE-MP-0, act as foundation models for chemistry and materials.", "uses": "Molecular dynamics at close to quantum accuracy, battery and catalyst screening, and materials discovery pipelines, where universal potentials now act as a first pass before anyone pays for real quantum chemistry.", "worth": "you work in chemistry or materials; equivariance is the one prerequisite, and the practical skill is evaluating forces, not picking architectures.", "resources": [{"title": "A practical guide to machine learning interatomic potentials -- Status and future", "url": "https://arxiv.org/abs/2503.09814", "type": "paper", "by": "Jacobs, Morgan et al., 2025", "level": 1, "note": "A review for newcomers: how the model families work, what universal potentials can do, and how to pick one."}, {"title": "E(3)-equivariant graph neural networks for data-efficient and accurate interatomic potentials", "url": "https://www.nature.com/articles/s41467-022-29939-5", "type": "paper", "by": "Batzner et al., Harvard, Nature Communications 2022", "level": 2, "note": "NequIP: equivariant features match earlier models with up to a thousand times less training data."}, {"title": "MACE: Higher Order Equivariant Message Passing Neural Networks for Fast and Accurate Force Fields", "url": "https://arxiv.org/abs/2206.07697", "type": "paper", "by": "Batatia, Kovács, Simm, Ortner, Csányi, 2022", "level": 2, "note": "Four-body messages cut message passing to two layers, which makes it fast."}, {"title": "A foundation model for atomistic materials chemistry", "url": "https://arxiv.org/abs/2401.00096", "type": "paper", "by": "Batatia et al., 2023", "level": 3, "note": "MACE-MP-0: one model trained on a public materials dataset that runs stable dynamics for a wide range of molecules and materials."}, {"title": "ACEsuit/mace", "url": "https://github.com/ACEsuit/mace", "type": "code", "by": "Batatia, Kovács, Csányi et al., 2022", "level": 2, "note": "Training code and pretrained foundation models."}, {"title": "MACE tutorials", "url": "https://mace-docs.readthedocs.io/en/latest/examples/tutorials.html", "type": "project", "by": "MACE developers", "level": 2, "build": "A MACE interatomic potential trained and evaluated on a small dataset in Colab, then improved by active learning and by fine-tuning a foundation model.", "teaches": "The training and validation loop for an equivariant potential, and when fine-tuning a foundation model beats training from scratch.", "time": "a day"}]}, {"id": "sbi", "title": "Simulation-based inference", "kind": "concept", "track": "science", "pre": ["nf", "montecarlo"], "frontier": false, "core": "When a simulator can generate data from parameters but its likelihood cannot be written down, simulate many parameter and data pairs and train a network, often a normalizing flow, to output the posterior given data. Inference on a new observation is then one forward pass.", "reach": "Used across physics, neuroscience, and epidemiology; flow matching and diffusion estimators now replace flows, and coverage checks catch overconfident posteriors.", "uses": "Parameter estimation where only a simulator exists: gravitational wave events, cosmological surveys, particle physics analyses, epidemic models, and single-neuron models fit to recordings.", "worth": "your model is a simulator rather than a likelihood; needs normalizing flows and Monte Carlo, and coverage checks are not optional.", "resources": [{"title": "The frontier of simulation-based inference", "url": "https://arxiv.org/abs/1911.01429", "type": "paper", "by": "Cranmer, Brehmer, Louppe, 2019; PNAS 2020", "level": 1}, {"title": "sbi", "url": "https://sbi.readthedocs.io/en/stable/", "type": "code", "by": "Macke lab and contributors, 2020", "level": 1, "note": "Getting started, then the Hodgkin-Huxley example."}, {"title": "Fast ε-free Inference of Simulation Models with Bayesian Conditional Density Estimation", "url": "https://arxiv.org/abs/1605.06376", "type": "paper", "by": "Papamakarios, Murray, 2016", "level": 2, "note": "Neural posterior estimation: train a conditional density network on simulations and read off the posterior."}, {"title": "Benchmarking Simulation-Based Inference", "url": "https://arxiv.org/abs/2101.04653", "type": "paper", "by": "Lueckmann, Boelts, Greenberg, Gonçalves, Macke, 2021", "level": 3, "note": "Neural methods generally beat classical ABC, but none wins everywhere and the metric matters."}, {"title": "A Trust Crisis In Simulation-Based Inference? Your Posterior Approximations Can Be Unfaithful", "url": "https://arxiv.org/abs/2110.06581", "type": "paper", "by": "Hermans, Delaunoy, Rozet, Wehenkel, Begy, Louppe, 2021", "level": 3, "note": "Every benchmarked method can return overconfident posteriors; ensembles help."}, {"title": "Inference on the Hodgkin-Huxley model", "url": "https://sbi.readthedocs.io/en/stable/tutorials/Example_00_HodgkinHuxleyModel.html", "type": "project", "by": "sbi developers", "level": 2, "build": "A posterior over a Hodgkin-Huxley neuron’s conductances, inferred with neural posterior estimation from summary statistics of simulated voltage traces.", "teaches": "Bayesian inference when the likelihood is only a simulator, and how the choice of summary statistics shapes the posterior.", "time": "an afternoon"}]}, {"id": "adversarial", "title": "Adversarial examples and robustness", "kind": "concept", "track": "safety", "pre": ["backprop", "optim"], "frontier": false, "core": "A small input change chosen with the gradient, invisible to people, can flip a classifier’s answer. The fast gradient sign method takes one step along the sign of the input gradient; adversarial training trains on the worst perturbations projected gradient descent finds.", "reach": "Robustness costs clean accuracy. The same min-max view returns in jailbreaks, where the input is text and the goal is to defeat refusal.", "uses": "Security review of deployed classifiers, from moderation filters to sign recognition under stickers, certification work in safety-critical systems, and the gradient-on-the-input habit that interpretability and jailbreak research both reuse.", "worth": "you ship models someone has reason to fool; backprop and optimization suffice, and the robustness against accuracy trade-off is the real lesson.", "resources": [{"title": "Adversarial Robustness - Theory and Practice", "url": "https://adversarial-ml-tutorial.org/", "type": "tutorial", "by": "Zico Kolter, Aleksander Madry, NeurIPS 2018", "level": 1, "note": "Chapters 3 and 4: attacks as the inner maximization and adversarial training as the outer minimization, with PyTorch code."}, {"title": "Explaining and Harnessing Adversarial Examples", "url": "https://arxiv.org/abs/1412.6572", "type": "paper", "by": "Goodfellow, Shlens, Szegedy, 2014", "level": 2, "note": "Locally linear behavior explains adversarial examples and gives the fast gradient sign method."}, {"title": "Towards Deep Learning Models Resistant to Adversarial Attacks", "url": "https://arxiv.org/abs/1706.06083", "type": "paper", "by": "Madry, Makelov, Schmidt, Tsipras, Vladu, 2017", "level": 2, "note": "Robustness as a min-max problem, trained against projected gradient descent."}, {"title": "Obfuscated Gradients Give a False Sense of Security: Circumventing Defenses to Adversarial Examples", "url": "https://arxiv.org/abs/1802.00420", "type": "paper", "by": "Athalye, Carlini, Wagner, 2018", "level": 3, "note": "Many published defenses only hid the gradient, and attacks adapted to each defense broke them."}, {"title": "Adversarial Examples Are Not Bugs, They Are Features", "url": "https://arxiv.org/abs/1905.02175", "type": "paper", "by": "Ilyas, Santurkar, Tsipras, Engstrom, Tran, Madry, 2019", "level": 3, "note": "Perturbations exploit real but brittle features that predict the label."}, {"title": "Adversarial Robustness, Chapter 4: Adversarial Training", "url": "https://adversarial-ml-tutorial.org/adversarial_training/", "type": "project", "by": "Kolter, Madry, 2018", "level": 2, "build": "FGSM and projected gradient descent attacks on an MNIST classifier, then adversarial training against them, with robust accuracy measured before and after.", "teaches": "Robustness as a min-max problem, and why a defense counts only when it holds against the strongest attack you can run.", "time": "a weekend"}]}, {"id": "jailbreaks", "title": "Jailbreaks and red teaming", "kind": "concept", "track": "safety", "pre": ["adversarial", "rlhf"], "frontier": false, "core": "Safety training teaches a model to refuse harmful requests; a jailbreak is an input that makes it comply anyway. Attacks find one with gradients over suffix tokens, an attacker model that rewrites the prompt, or hundreds of fake dialogue turns in a long context.", "reach": "Red teaming runs these attacks before release and feeds evaluations; classifier defenses and refusal directions found by probing are the counters.", "uses": "Pre-release red teaming, the guardrail and filter products sold around model APIs, bug bounty work, and defending agents against prompt injection, which is this same problem arriving through tool output.", "worth": "you deploy or evaluate language models; needs adversarial basics and RLHF, and a week of hands-on attempts teaches more than the papers.", "resources": [{"title": "Adversarial Attacks on LLMs", "url": "https://lilianweng.github.io/posts/2023-10-25-adv-attack-llm/", "type": "blog", "by": "Lilian Weng, 2023", "level": 1}, {"title": "Universal and Transferable Adversarial Attacks on Aligned Language Models", "url": "https://arxiv.org/abs/2307.15043", "type": "paper", "by": "Zou, Wang, Carlini, Nasr, Kolter, Fredrikson, 2023", "level": 2, "note": "GCG: greedy coordinate gradient search finds suffixes that transfer from open models to closed ones."}, {"title": "Jailbreaking Black Box Large Language Models in Twenty Queries", "url": "https://arxiv.org/abs/2310.08419", "type": "paper", "by": "Chao, Robey, Dobriban, Hassani, Pappas, Wong, 2023", "level": 2, "note": "PAIR: an attacker model refines the prompt from the target’s replies, with no gradients."}, {"title": "Many-shot jailbreaking", "url": "https://www.anthropic.com/research/many-shot-jailbreaking", "type": "blog", "by": "Anil et al., Anthropic, 2024", "level": 2, "note": "Success grows as a power law in the number of faked dialogues, like ordinary in-context learning; the post links the full paper."}, {"title": "HarmBench: A Standardized Evaluation Framework for Automated Red Teaming and Robust Refusal", "url": "https://arxiv.org/abs/2402.04249", "type": "paper", "by": "Mazeika et al., 2024", "level": 2, "note": "One benchmark and judge that compares 18 attacks against 33 models and defenses."}, {"title": "Constitutional Classifiers: Defending against Universal Jailbreaks across Thousands of Hours of Red Teaming", "url": "https://arxiv.org/abs/2501.18837", "type": "paper", "by": "Sharma et al., Anthropic, 2025", "level": 3, "note": "Input and output classifiers trained on synthetic data from a written constitution."}, {"title": "HarmBench", "url": "https://github.com/centerforaisafety/HarmBench", "type": "project", "by": "Mazeika et al., Center for AI Safety, 2024", "level": 3, "note": "run_pipeline.py drives the stages; the classifiers are published on Hugging Face.", "build": "The benchmark’s four stages run end to end: test cases generated for its behaviors, completions sampled from open target models, and each one scored by its published classifier.", "teaches": "That robustness is one number per attack and per target, and how much a defense’s score depends on which attack was run.", "time": "a week"}]}, {"id": "evals", "title": "Evaluations and dangerous capabilities", "kind": "concept", "track": "safety", "pre": ["agents", "jailbreaks"], "frontier": true, "core": "Before release, test whether a model can help build a bioweapon, hack, or copy itself, eliciting its best effort with agent scaffolds. METR tracks the task length, in human working time, at which agents succeed half the time; it has doubled about every seven months.", "reach": "Evaluations set the thresholds in labs’ safety policies; sandbagging is why oversight and control cannot rely on them alone.", "uses": "The capability thresholds written into labs’ own safety policies, the work of government safety institutes and third-party evaluators, and procurement decisions that turn on what a model can actually do.", "worth": "you want safety policy or evaluation work; needs agents and red teaming, and the methodology is being invented as you read it.", "resources": [{"title": "Measuring AI Ability to Complete Long Software Tasks", "url": "https://metr.org/blog/2025-03-19-measuring-ai-ability-to-complete-long-tasks/", "type": "blog", "by": "Kwa, West et al., METR, 2025", "level": 1, "note": "The 50% time horizon and its trend; the full paper is arXiv 2503.14499."}, {"title": "Model evaluation for extreme risks", "url": "https://arxiv.org/abs/2305.15324", "type": "paper", "by": "Shevlane et al., Google DeepMind and others, 2023", "level": 2, "note": "Separates dangerous capability evaluations from alignment evaluations and places both in decisions about training and release."}, {"title": "Evaluating Frontier Models for Dangerous Capabilities", "url": "https://arxiv.org/abs/2403.13793", "type": "paper", "by": "Phuong et al., Google DeepMind, 2024", "level": 2, "note": "A concrete suite on persuasion and deception, cyber security, self-proliferation, and self-reasoning, run on Gemini 1.0."}, {"title": "Inspect", "url": "https://inspect.aisi.org.uk/", "type": "code", "by": "UK AI Security Institute, 2024", "level": 2, "note": "An open framework for writing and running evaluations, including agent tasks."}, {"title": "AI Sandbagging: Language Models can Strategically Underperform on Evaluations", "url": "https://arxiv.org/abs/2406.07358", "type": "paper", "by": "van der Weij, Hofstätter, Jaffe, Brown, Ward, 2024", "level": 3, "note": "Models prompted or fine-tuned to fail dangerous capability evaluations while keeping general performance."}, {"title": "ARENA Chapter 3: LLM Evaluations", "url": "https://learn.arena.education/chapter3_llm_evals/", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "An evaluation from threat model to results: hand-written questions, hundreds more generated and audited with a model, runs with Inspect on current models, then agents built and evaluated.", "teaches": "How to turn a vague safety worry into a measurable property, and the ways a benchmark can end up measuring something else.", "time": "a week", "signature": true}]}, {"id": "oversight", "title": "Scalable oversight and AI control", "kind": "concept", "track": "safety", "pre": ["rlhf", "evals"], "frontier": true, "core": "Once models outperform their supervisors, supervision needs help. Scalable oversight makes judging easier, for example by having two models debate so a weaker judge can find the truth; AI control assumes the model may be scheming and designs monitoring that stays safe anyway.", "reach": "Training a strong model on a weak model’s labels makes the problem an experiment; model organisms supply the misaligned models control must catch.", "uses": "Designing monitoring for agents that may be working against you, debate and critique protocols that help a weaker judge decide, and the control evaluations run before trusting a model with real access.", "worth": "you want alignment research with a concrete experimental loop; needs RLHF and evaluations, and the agenda is only a few years old.", "resources": [{"title": "The case for ensuring that powerful AIs are controlled", "url": "https://blog.redwoodresearch.org/p/the-case-for-ensuring-that-powerful", "type": "blog", "by": "Greenblatt, Shlegeris, Redwood Research, 2024", "level": 1}, {"title": "AI safety via debate", "url": "https://arxiv.org/abs/1805.00899", "type": "paper", "by": "Irving, Christiano, Amodei, OpenAI, 2018", "level": 2, "note": "Two agents argue and a judge picks the winner; with optimal play, a polynomial time judge can settle any question in PSPACE."}, {"title": "AI Control: Improving Safety Despite Intentional Subversion", "url": "https://arxiv.org/abs/2312.06942", "type": "paper", "by": "Greenblatt, Shlegeris, Sachan, Roger, 2023", "level": 2, "note": "GPT-3.5 as a trusted monitor of an untrusted GPT-4 writing code, while a red team plays the scheming model and tries to slip in backdoors."}, {"title": "Weak-to-Strong Generalization: Eliciting Strong Capabilities With Weak Supervision", "url": "https://arxiv.org/abs/2312.09390", "type": "paper", "by": "Burns et al., OpenAI, 2023", "level": 2, "note": "GPT-4 fine-tuned on labels from a GPT-2 level supervisor beats its supervisor, a stand-in for people supervising stronger models."}, {"title": "Debating with More Persuasive LLMs Leads to More Truthful Answers", "url": "https://arxiv.org/abs/2402.06782", "type": "paper", "by": "Khan et al., 2024", "level": 3, "note": "Judges who cannot see the source text answer more accurately after watching debates, and more so as debaters get more persuasive."}, {"title": "ARENA 3.5: AI Control", "url": "https://learn.arena.education/chapter3_llm_evals/05_ai_control/intro", "type": "project", "by": "ARENA, 2026", "level": 3, "build": "An AI control experiment: a model that writes backdoored code, a monitor that tries to catch it, and red and blue team protocols scored on safety against usefulness.", "teaches": "How to make a model safe to use even if it is trying to subvert you, and what that costs.", "time": "a weekend"}]}, {"id": "deception", "title": "Model organisms of misalignment", "kind": "concept", "track": "safety", "pre": ["overopt", "probing"], "frontier": true, "core": "Build models that misbehave on purpose, such as one that writes exploitable code when told the year is 2024, and test whether safety training removes it. In Sleeper Agents it survived RLHF and adversarial training; Claude 3 Opus later faked alignment without being told to.", "reach": "Gives oversight, control, and interpretability concrete targets: linear probes on activations caught the sleeper agents about to defect.", "uses": "Testing whether safety training removes a behavior or merely hides it, and giving interpretability and monitoring a case where the ground truth is known in advance, which almost no other safety experiment offers.", "worth": "you research alignment or interpretability; needs reward hacking and probing, and the results are among the field’s few hard findings.", "resources": [{"title": "Model Organisms of Misalignment: The Case for a New Pillar of Alignment Research", "url": "https://www.alignmentforum.org/posts/ChDH335ckdvpxXaXX/model-organisms-of-misalignment-the-case-for-a-new-pillar-of-1", "type": "blog", "by": "Hubinger, Schiefer, Denison, Perez, 2023", "level": 1}, {"title": "Sleeper Agents: Training Deceptive LLMs that Persist Through Safety Training", "url": "https://arxiv.org/abs/2401.05566", "type": "paper", "by": "Hubinger et al., Anthropic, 2024", "level": 2, "note": "Backdoors survived supervised fine-tuning, RLHF, and adversarial training, most in the largest models and those that reason in a chain of thought."}, {"title": "Alignment faking in large language models", "url": "https://arxiv.org/abs/2412.14093", "type": "paper", "by": "Greenblatt et al., Anthropic and Redwood Research, 2024", "level": 2, "note": "Told it was being trained to answer every request, Claude 3 Opus complied more when it believed it was in training, and its reasoning said why."}, {"title": "Simple probes can catch sleeper agents", "url": "https://www.anthropic.com/research/probes-catch-sleeper-agents", "type": "blog", "by": "MacDiarmid et al., Anthropic, 2024", "level": 2, "note": "Linear probes built from generic contrast pairs, such as asking whether the model is doing something dangerous, detect defection with AUROC above 99%."}, {"title": "Auditing language models for hidden objectives", "url": "https://arxiv.org/abs/2503.10965", "type": "paper", "by": "Marks et al., Anthropic, 2025", "level": 3, "note": "A model trained with a hidden objective, and a blind game in which auditing teams try to find it with interpretability and behavioral tools."}, {"title": "Emergent Misalignment: Narrow finetuning can produce broadly misaligned LLMs", "url": "https://arxiv.org/abs/2502.17424", "type": "paper", "by": "Betley et al., 2025", "level": 3, "note": "Fine-tuning only on insecure code made models misaligned on unrelated prompts."}, {"title": "ARENA 4.1: Emergent Misalignment", "url": "https://learn.arena.education/chapter4_alignment_science/1_emergent_misalignment/intro", "type": "project", "by": "ARENA, 2026", "level": 3, "build": "Model organisms of emergent misalignment loaded and tested, their misalignment quantified with autoraters, steered with activation vectors, and traced through phase transitions in training.", "teaches": "That a narrow fine-tune can produce broad misalignment, and the tools alignment researchers use to study it.", "time": "a weekend"}]}], "macro": [{"from": "found", "to": "dl", "links": 6}, {"from": "found", "to": "rl", "links": 8}, {"from": "dl", "to": "llm", "links": 3}, {"from": "dl", "to": "gen", "links": 4}, {"from": "dl", "to": "rl", "links": 3}, {"from": "llm", "to": "sys", "links": 4}, {"from": "llm", "to": "post", "links": 2}, {"from": "llm", "to": "interp", "links": 2}, {"from": "llm", "to": "cl", "links": 6}, {"from": "llm", "to": "disc", "links": 4}, {"from": "gen", "to": "disc", "links": 3}, {"from": "gen", "to": "ctrl", "links": 4}, {"from": "gen", "to": "embod", "links": 2}, {"from": "rl", "to": "post", "links": 1}, {"from": "rl", "to": "ctrl", "links": 1}, {"from": "rl", "to": "embod", "links": 2}, {"from": "post", "to": "disc", "links": 1}, {"from": "dl", "to": "vision", "links": 3}, {"from": "llm", "to": "vision", "links": 2}, {"from": "vision", "to": "graphics", "links": 3}, {"from": "gen", "to": "graphics", "links": 3}, {"from": "gen", "to": "bio", "links": 3}, {"from": "llm", "to": "bio", "links": 6}, {"from": "dl", "to": "science", "links": 3}, {"from": "gen", "to": "science", "links": 2}, {"from": "post", "to": "safety", "links": 3}, {"from": "interp", "to": "safety", "links": 1}], "trackLinks": [{"from": "disc", "to": "bio", "links": 2}, {"from": "dl", "to": "bio", "links": 3}, {"from": "dl", "to": "cl", "links": 2}, {"from": "dl", "to": "embod", "links": 1}, {"from": "dl", "to": "gen", "links": 4}, {"from": "dl", "to": "graphics", "links": 2}, {"from": "dl", "to": "llm", "links": 3}, {"from": "dl", "to": "rl", "links": 3}, {"from": "dl", "to": "safety", "links": 1}, {"from": "d rces off as you go.", "aboutHtml": "<h2>About this map<\/h2>\n<p>The Tracks view is the map at the largest scale: 17 tracks, with an arrow from one track to another\nwhen ideas in the second build on ideas in the first and a learner should meet the first track before it. Arrows get\nthicker the more ideas they connect. Some links skip a column or run against the arrows; each track's panel lists\nevery link, counted.<\/p>\n<p>The Map view is the same graph one level down. Each box is one idea: a concept, or a single paper, book or course\nthat defines one. An arrow from A to B means learn A before B. Arrows inside a track are always drawn; arrows between\ntracks appear when you click an idea, or all at once with Links. Click an idea and every idea on its path lights up,\nso you can see the whole chain to learn first.<\/p>\n<p>Each idea opens with why to learn it: what it is used for, including uses that are not obvious and links that\nare only conceptual, and who should put in the time to learn it and its prerequisites.<\/p>\n<p>Inside each idea, resources are ordered so that the first one is the best place to start and each one after it\nadds what the ones above did not. Start, Core and Deep say how far in each one goes. Ideas marked frontier are active research as of late 2026: expect the reading list there to move.<\/p>\n<p>Projects are the other half: things to build, with what you build, what it teaches and roughly how long it takes.\nMost are an assignment, an exercise set or a repository that people in the field actually work through. Where no such project exists, 58 were written for this map: each is built on a named paper, dataset or repository, and ends on a number from that source that tells you when you are done. Every track has one\nsignature project, the one to build if you build only one. Projects sit in each idea's list beside what to read, at\nthe top of each track's panel, and all together in the Projects view.<\/p>\n\n<p>Tracks that share a color a         tsvg.append(path); tEdges.push({ e, path });
      }
      for (const t of DATA.tracks) {
        const v = m.nodes[t.id], ns = trackNodes(t.id), marked = ns.filter(badgeOf), fr = marked.length, bar = el("i");
        const np = ns.reduce((s, n) => s + projOf(n).length, 0);
        const b = el("button", { class: "tnode", style: `left:${v.x - m.w / 2}px;top:${v.y - m.h / 2}px;width:${m.w}px;height:${m.h}px;--c:var(--f-${t.family})`,
          "aria-label": `${t.label}, ${ns.length} ideas, ${np} projects` },
          el("span", { class: "tk" }, el("span", { class: "dot" }), `${ns.length} ideas` + (fr ? ` · ${fr} ${badgeOf(marked[0])}` : "")),
          el("span", { class: "tt", text: t.label }),
          el("span", { class: "tc", text: t.core }),
          el("span", { class: "tf" }, el("span", { class: "p" }, bar), np ? el("span", { class: "tpj", text: `${np} ${np === 1 ? "project" : "projects"}` }) : null));
        b.addEventListener("click", () => openTrack(t.id));
        tworld.append(b); tEls[t.id] = { b, bar };
      }
      highlightTrack(currentTrack);
    }
    const availW = tscroll.clientWidth - 24, availH = tscroll.clientHeight - 24;
    const sc = narrow ? Math.max(.72, Math.min(1, availW / m.width)) : Math.max(.5, Math.min(1.05, availW / m.width, availH / m.height));
    tworld.style.transform = `scale(${sc})`;
    tsize.style.width = Math.round(m.width * sc) + "px"; tsize.style.height = Math.round(m.height * sc) + "px";
    if (narrow) tscroll.scrollLeft = (tscroll.scrollWidth - tscroll.clientWidth) / 2;
    paintTracks();
  }
  function paintTracks() {
    for (const t of DATA.tracks) { if (!tEls[t.id]) continue; const [d, tot] = trackProg(t.id); tEls[t.id].bar.style.width = (tot ? 100 * d / tot : 0) + "%"; }
  }
  function highlightTrack(id) {
    const anc = id ? tAnc(id) : null;
    for (const t of DATA.tracks) {
      if (!tEls[t.id]) continue; const c = tEls[t.id].b.classList;
      c.toggle("sel", t.id === id); c.toggle("anc", !!anc && anc.has(t.id)); c.toggle("dim", !!anc && t.id !== id && !anc.has(t.id));
    }
    for (const { e, path } of tEdges) {
      const hot = !!anc && anc.has(e.from) && (e.to === id || anc.has(e.to));
      path.classList.toggle("hot", hot); path.classList.toggle("dim", !!anc && !hot);
    }
  }
  function trackChips(ids, emptyText) {
    const box = el("div", { class: "links" });
    if (!ids.length) box.append(el("span", { class: "none", text: emptyText }));
    for (const x of ids) {
      const b = el("button", { style: `--c:var(--f-${trackById[x].family})` }, el("span", { class: "dot" }), trackById[x].label);
      b.addEventListener("click", () => openTrack(x));
      box.append(b);
    }
    return box;
  }
  function openOnMap(id) { setView("map"); open(id, { minS: .85 }); }
  // a track's projects as [idea, resource, index in the idea's list], signature first, then in learning order
  function trackProjects(tid) {
    const out = [];
    for (const n of trackNodes(tid)) n.resources.forEach((r, i) => { if (isProj(r)) out.push([n, r, i]); });
    return out.sort((a, b) => !!b[1].signature - !!a[1].signature);
  }
  function openTrack(tid, opts = {}) {
    const t = trackById[tid]; if (!t) return;
    current = null; currentTrack = tid; panelProg = null;
    panel.textContent = ""; panel.style.setProperty("--c", `var(--f-${t.family})`);
    const closeBtn = el("button", { class: "close", "aria-label": "Close", text: "×" }); closeBtn.onclick = close;
    const ns = trackNodes(tid), [d, tot] = trackProg(tid);
    panel.append(closeBtn,
      el("p", { class: "pk" }, el("span", { class: "dot", style: `--c:var(--f-${t.family})` }), "Track", el("span", { class: "badge", text: `${ns.length} ideas` })),
      el("h2", { id: "ptitle", text: t.label }),
      el("div", { class: "prog" }, el("span", { class: "bar" }, el("i", { style: `width:${tot ? 100 * d / tot : 0}%` })), el("span", { text: `${d} / ${tot}` })),
      el("p", { class: "core", text: t.core }));
    const go = el("button", { class: "primary", text: "Open this track on the map" });
    go.onclick = () => { close(); setView("map"); focusTrack(tid); };
    panel.append(go);
    // what to build: the signature project first, then the rest in the order of the track's ideas
    const projs = trackProjects(tid);
    if (projs.length) {
      const sig = el("ul", { class: "res" }), more = el("ul", { class: "res" });
      for (const [n, r, i] of projs) (r.signature ? sig : more).append(resItem(n, r, i, true));
      if (sig.childElementCount) panel.append(el("p", { class: "sec", text: "Signature project" }), sig);
      if (more.childElementCount) panel.append(el("p", { class: "sec", text: sig.childElementCount ? "More projects in this track" : "Projects in this track" }), more);
    }
    panel.append(el("p", { class: "sec", text: "Learn first" }), trackChips(tUp[tid] || [], "Nothing. The map starts here."));
    panel.append(el("p", { class: "sec", text: "Leads to" }), trackChips(tDown[tid] || [], "Nothing further on this map."));
    const inL = DATA.trackLinks.filter(x => x.to === tid).sort((a, b) => b.links - a.links);
    const outL = DATA.trackLinks.filter(x => x.from === tid).sort((a, b) => b.links - a.links);
    const fmt = (arr, key) => arr.map(x => `${trackById[x[key]].label} (${x.links})`).join(", ");
    panel.append(el("p", { class: "sec", text: "Every link to other tracks" }),
      el("p", { class: "tlinks", text: (inL.length ? `Its ideas build on ideas in ${fmt(inL, "from")}.` : "Its ideas build on nothing outside it.")
        + (outL.length ? ` Ideas in ${fmt(outL, "to")} build on it.` : "") + " The numbers count prerequisite arrows between ideas; the track map draws the ones a learner needs first." }));
    const roots = ns.filter(n => !n.pre.some(p => byId[p].track === tid));
    const startBox = el("div", { class: "links" });
    for (const n of roots) { const b = el("button", { style: `--c:var(--f-${t.family})` }, el("span", { class: "dot" }), n.title); b.onclick = () => openOnMap(n.id); startBox.append(b); }
    panel.append(el("p", { class: "sec", text: "Start with" }), startBox);
    const ol = el("ul", { class: "ideas" });
    for (const n of ns) {
      const [dd, tt] = prog(n);
      const b = el("button", {}, el("span", { class: "it" }, n.title, el("span", { class: "ik", text: [tagOf(n), badgeOf(n)].filter(Boolean).join(" · ") })), el("span", { class: "ip", text: `${dd}/${tt}` }));
      b.onclick = () => openOnMap(n.id);
      ol.append(el("li", {}, b));
    }
    panel.append(el("p", { class: "sec", text: "Its ideas, in order" }), ol);
    panel.hidden = false; scrim.hidden = innerWidth > 720; panel.scrollTop = 0;
    highlightTrack(tid); highlight(null);
    try { history.replaceState(null, "", "#track-" + tid); } catch (e) {}
    if (!opts.noFocus) closeBtn.focus({ preventScroll: true });
  }
  addEventListener("resize", () => { if (!tview.hidden) renderTrackMap(); });

  // projects view: every project on the map, by track, each track's signature project first
  function renderProjects() {
    const box = document.getElementById("projin"); box.textContent = "";
    const nt = DATA.tracks.filter(t => trackProjects(t.id).length).length;
    box.append(el("p", { class: "pintro", text: `${nProj} projects across ${nt} tracks: assignments, exercise sets, and repositories that people in each field actually work through` + (nMade ? `, and ${nMade} written for this map where none exists, each built on a named paper, dataset, or repository and ending on a number you can check` : "") + `. Each track's signature project comes first, the one to build if you build only one.` }));
    for (const t of DATA.tracks) {
      const projs = trackProjects(t.id);
      if (!projs.length) continue;
      const head = el("h2", { style: `--c:var(--f-${t.family})` }, el("span", { class: "dot" }), t.label);
      const ul = el("ul", { class: "res", style: `--c:var(--f-${t.family})` });
      for (const [n, r, i] of projs) ul.append(resItem(n, r, i, true));
      box.append(head, ul);
    }
  }

  // views
  const views = { tracks: tview, map: document.getElementById("map"), list: document.getElementById("list"), projects: document.getElementById("projects"), about: document.getElementById("about") };
  let mapReady = false;
  function setView(v) {
    for (const [k, node] of Object.entries(views)) node.hidden = k !== v;
    for (const k of Object.keys(views)) document.getElementById("v-" + k).setAttribute("aria-pressed", String(k === v));
    if (v === "map") { if (!mapReady) { mapReady = true; initMap(); } else apply(); }
    if (v === "tracks") renderTrackMap();
    if (v === "projects") renderProjects();
  }
  for (const k of Object.keys(views)) document.getElementById("v-" + k).onclick = () => setView(k);

  // search
  const q = document.getElementById("q"), results = document.getElementById("results");
  let hits = [], hi = 0;
  const hideResults = () => { results.hidden = true; q.setAttribute("aria-expanded", "false"); for (const n of DATA.nodes) nodeEls[n.id].btn.classList.remove("hit"); };
  function search() {
    const words = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    for (const n of DATA.nodes) nodeEls[n.id].btn.classList.remove("hit");
    if (!words.length) { hideResults(); return; }
    hits = [];
    for (const n of DATA.nodes) {
      const head = (n.title + " " + trackById[n.track].label).toLowerCase();
      const text = r => r.title + " " + r.by + (isProj(r) ? " project " + r.build + " " + r.teaches + " " + (r.done || "") : "");
      const body = (n.core + " " + (n.reach || "") + " " + (n.uses || "") + " " + (n.worth || "") + " " + n.resources.map(text).join(" ")).toLowerCase();
      if (!words.every(w => head.includes(w) || body.includes(w))) continue;
      const res = n.resources.find(r => words.every(w => text(r).toLowerCase().includes(w)));
      hits.push({ n, score: words.every(w => head.includes(w)) ? 0 : 1, res });
    }
    hits.sort((a, b) => a.score - b.score);
    results.textContent = ""; hi = 0;
    if (!hits.length) results.append(el("div", { class: "rm", style: "padding:.5rem .6rem", text: "No idea or resource matches." }));
    hits.slice(0, 12).forEach((h, i) => {
      nodeEls[h.n.id].btn.classList.add("hit");
      const b = el("button", { role: "option", "aria-selected": String(i === 0) },
        el("div", { class: "rt", text: h.n.title }),
        el("div", { class: "rm", text: h.res ? (isProj(h.res) ? "Project: " : "Resource: ") + h.res.title : trackById[h.n.track].label }));
      b.addEventListener("click", () => { pick(h.n.id); });
      results.append(b);
    });
    results.hidden = false; q.setAttribute("aria-expanded", "true");
  }
  function pick(id) { hideResults(); q.blur(); if (map.hidden) setView("map"); open(id, { minS: .85 }); }
  q.addEventListener("input", search);
  q.addEventListener("keydown", ev => {
    const opts = [...results.querySelectorAll("button")];
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault(); if (!opts.length) return;
      hi = (hi + (ev.key === "ArrowDown" ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.setAttribute("aria-selected", String(i === hi)));
    } else if (ev.key === "Enter" && hits[hi]) { ev.preventDefault(); pick(hits[hi].n.id); }
  });
  document.addEventListener("click", ev => { if (!ev.target.closest(".search")) { results.hidden = true; q.setAttribute("aria-expanded", "false"); } });

  // first frame: the track map, or the idea or track named in the link
  renderTotals();
  function start() {
    const h = location.hash.slice(1);
    if (byId[h]) { setView("map"); open(h, { noFocus: true, minS: .85 }); return; }
    if (h === "projects") { setView("projects"); return; }
    setView("tracks");
    if (h.startsWith("track-") && trackById[h.slice(6)]) openTrack(h.slice(6), { noFocus: true });
  }
  // the detailed map's first view: the foundations and the row under them, readable
  function initMap() {
    const r = map.getBoundingClientRect();
    const firstTrack = Object.keys(L.tracks).sort((p, q) => L.tracks[p].y - L.tracks[q].y || L.tracks[p].x - L.tracks[q].x)[0], f = L.tracks[firstTrack];
    if (r.width <= 720) {
      const top = DATA.nodes.filter(n => n.track === firstTrack).map(n => L.nodes[n.id]).sort((p, q) => p.y - q.y)[0];
      s = .62; tx = r.width / 2 - top.x * s; ty = 12 - f.y * s; apply(); return;
    }
    s = Math.min(.9, Math.max(.6, (r.width - 48) / (f.w + 600)));
    tx = r.width / 2 - (f.x + f.w / 2) * s; ty = 16 - f.y * s; apply();
  }
  start();
  addEventListener("resize", () => drawMini());
})();

</script>
