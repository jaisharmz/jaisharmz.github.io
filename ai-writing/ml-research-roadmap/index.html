, Wang, Isola, 2024", "level": 3, "note": "Evidence that vision and language models converge toward a shared representation as they scale."}, {"title": "Transfer Learning for Computer Vision Tutorial", "url": "https://docs.pytorch.org/tutorials/beginner/transfer_learning_tutorial.html", "type": "project", "by": "Sasank Chilamkurthy, PyTorch, 2017", "level": 1, "build": "An ImageNet ResNet-18 adapted to tell ants from bees with about 120 training images per class, once by fine-tuning everything and once as a frozen feature extractor with a new linear head.", "teaches": "That a pretrained representation turns a tiny new task into a nearly linear one, and what fine-tuning adds over a linear probe.", "time": "an afternoon"}]}, {"id": "contrastive", "title": "Contrastive and self-supervised learning", "kind": "concept", "track": "dl", "pre": ["resnets", "info", "replearn"], "frontier": false, "core": "Learn representations without labels by pulling together embeddings of two views of the same example and pushing apart views of different examples. The InfoNCE loss is a classification over the batch, picking the true partner, and it lower-bounds the mutual information between views.", "reach": "Leads to CLIP, the encoders behind latent diffusion and robot policies, and the predictive alternative of JEPA.", "uses": "CLIP, which powers zero-shot image classification, text-to-image search, and the text encoder of Stable Diffusion 1; face recognition trained with triplet losses; sentence embeddings for semantic search; and pretraining on unlabeled medical images.", "worth": "you build retrieval, multimodal, or vision systems, or train embedding models; if you only consume embeddings from an API, skip the derivations.", "resources": [{"title": "Contrastive Representation Learning", "url": "https://lilianweng.github.io/posts/2021-05-31-contrastive/", "type": "blog", "by": "Lilian Weng, 2021", "level": 1, "note": "The losses, augmentations, and methods in one place."}, {"title": "A Simple Framework for Contrastive Learning of Visual Representations", "url": "https://arxiv.org/abs/2002.05709", "type": "paper", "by": "Chen, Kornblith, Norouzi, Hinton, 2020", "level": 2, "note": "SimCLR: augmentations, a projection head, and large batches."}, {"title": "Representation Learning with Contrastive Predictive Coding", "url": "https://arxiv.org/abs/1807.03748", "type": "paper", "by": "van den Oord, Li, Vinyals, 2018", "level": 2, "note": "Introduces InfoNCE and its mutual information bound."}, {"title": "Learning Transferable Visual Models From Natural Language Supervision", "url": "https://arxiv.org/abs/2103.00020", "type": "paper", "by": "Radford et al., 2021", "level": 2, "note": "CLIP: the same loss across images and captions."}, {"title": "Understanding Contrastive Representation Learning through Alignment and Uniformity on the Hypersphere", "url": "https://arxiv.org/abs/2005.10242", "type": "paper", "by": "Tongzhou Wang, Phillip Isola, 2020", "level": 3, "note": "Splits the loss into pulling positives together and spreading all embeddings evenly over the sphere."}, {"title": "CS231n Assignment 3", "url": "https://cs231n.github.io/assignments2025/assignment3/", "type": "project", "by": "Stanford CS231n, 2025", "level": 2, "build": "A transformer for image captioning, self-supervised pretraining that improves a classifier, a DDPM image generator, and CLIP and DINO.", "teaches": "Whether representations learned without labels transfer, and how contrastive and self-distillation objectives differ in code.", "time": "a week"}]}, {"id": "jepa", "title": "Joint-embedding predictive architectures", "kind": "concept", "track": "dl", "pre": ["contrastive"], "frontier": true, "core": "Predict the embedding of a hidden part of the input from the embedding of the visible part, instead of reconstructing pixels. Predicting in representation space lets the model ignore unpredictable detail; a slowly updated target encoder or a regularizer keeps embeddings from collapsing.", "reach": "The representation learner behind V-JEPA 2’s robot planning, and one of the main proposals for world models.", "uses": "Research for now: Meta’s I-JEPA and V-JEPA image and video encoders, and V-JEPA 2, which plans robot arm motions in its embedding space. It is a bet on world models, not a production standard.", "worth": "you care about world models, robotics, or self-supervised video learning; the field is still moving, and anyone else can skip it.", "resources": [{"title": "Self-Supervised Learning from Images with a Joint-Embedding Predictive Architecture", "url": "https://arxiv.org/abs/2301.08243", "type": "paper", "by": "Assran et al., 2023", "level": 2, "note": "I-JEPA: predict the embeddings of large masked blocks from a context block, with no hand-made augmentations."}, {"title": "A Path Towards Autonomous Machine Intelligence", "url": "https://openreview.net/forum?id=BZ5a1r-kVsf", "type": "paper", "by": "Yann LeCun, 2022", "level": 2, "note": "The position paper that argues for predicting in representation space and for JEPAs as world models."}, {"title": "Revisiting Feature Prediction for Learning Visual Representations from Video", "url": "https://arxiv.org/abs/2404.08471", "type": "paper", "by": "Bardes et al., 2024", "level": 2, "note": "V-JEPA: the same objective on video."}, {"title": "V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning", "url": "https://arxiv.org/abs/2506.09985", "type": "paper", "by": "Assran et al., 2025", "level": 3, "note": "Adds a small amount of robot data and plans with the learned predictor."}, {"title": "LeJEPA: Provable and Scalable Self-Supervised Learning Without the Heuristics", "url": "https://arxiv.org/abs/2511.08544", "type": "paper", "by": "Randall Balestriero, Yann LeCun, 2025", "level": 3, "note": "Replaces the stop-gradient and teacher heuristics with a regularizer that pushes embeddings toward an isotropic Gaussian."}, {"title": "LeJEPA on Imagenette", "url": "https://github.com/galilai-group/lejepa/blob/main/MINIMAL.md", "type": "project", "by": "Built on Balestriero and LeCun, 2025", "level": 2, "build": "LeJEPA’s view prediction loss and SIGReg regularizer written from the paper, then a ViT-S/8 pretrained on Imagenette on one GPU and read out with an online linear probe.", "teaches": "How a joint embedding model avoids collapse with no teacher network or stop-gradient, and why its training loss tracks downstream accuracy.", "time": "a weekend", "made": true, "done": "The online linear probe reaches about 90 percent top-1 accuracy on Imagenette after 800 epochs at batch size 256, near the 90.7 percent the minimal example reports."}]}, {"id": "gnns", "title": "Graph neural networks", "kind": "concept", "track": "dl", "pre": ["backprop"], "frontier": false, "core": "A graph neural network updates each node by combining its own vector with an order-independent aggregate, such as a sum, of messages from its neighbors. After k rounds a node summarizes its k-hop neighborhood, and relabeling the nodes just relabels the output.", "reach": "Leads to equivariant networks for molecules and proteins; attention is a GNN on a fully connected graph.", "uses": "Drug discovery and molecular property prediction, arrival time estimates in Google Maps, Pinterest’s PinSage recommender, fraud detection in payment networks, DeepMind’s GraphCast weather forecaster, and its GNoME search for new crystal materials.", "worth": "you work on molecules, materials, recommendations, or any data shaped as a network; for pure language or image work, knowing attention is a GNN suffices.", "resources": [{"title": "A Gentle Introduction to Graph Neural Networks", "url": "https://distill.pub/2021/gnn-intro/", "type": "blog", "by": "Sanchez-Lengeling, Reif, Pearce, Wiltschko, Distill, 2021", "level": 1, "note": "Interactive diagrams of message passing on real graphs."}, {"title": "Stanford CS224W: Machine Learning with Graphs", "url": "https://web.stanford.edu/class/cs224w/", "type": "course", "by": "Jure Leskovec, Stanford, current offering", "level": 2, "note": "Slides and Colab notebooks from the standard course on learning with graphs."}, {"title": "Graph Representation Learning", "url": "https://www.cs.mcgill.ca/~wlh/grl_book/", "type": "book", "by": "William Hamilton, 2020", "level": 2, "note": "Chapters 5 to 7: the GNN model, GNNs in practice, and their theoretical motivations."}, {"title": "Neural Message Passing for Quantum Chemistry", "url": "https://arxiv.org/abs/1704.01212", "type": "paper", "by": "Gilmer et al., 2017", "level": 2, "note": "Unifies earlier GNNs as message passing."}, {"title": "How Powerful are Graph Neural Networks?", "url": "https://arxiv.org/abs/1810.00826", "type": "paper", "by": "Xu, Hu, Leskovec, Jegelka, 2018", "level": 3, "note": "Message passing is at most as strong as the Weisfeiler-Lehman test, and sum aggregation reaches that bound."}, {"title": "UvA Deep Learning Tutorial 7: Graph Neural Networks", "url": "https://uvadlc-notebooks.readthedocs.io/en/latest/tutorial_notebooks/tutorial7/GNN_overview.html", "type": "project", "by": "Phillip Lippe, University of Amsterdam, 2022", "level": 1, "build": "Graph convolution and graph attention layers from scratch in PyTorch, then node classification on Cora and graph classification on MUTAG with PyTorch Geometric.", "teaches": "Message passing as matrix multiplication with an adjacency matrix, and what attention over neighbors adds.", "time": "a day"}]}, {"id": "geometric", "title": "Geometric deep learning and equivariance", "kind": "concept", "track": "dl", "pre": ["gnns", "resnets", "linalg"], "frontier": false, "core": "If the answer should not change when the input is rotated, shifted, or permuted, build that symmetry into the network: make every layer equivariant, so transforming the input transforms the features the same way. Convolutions, GNNs, and transformers follow from a choice of symmetry.", "reach": "Underlies the equivariant networks used in generative models of molecules and proteins.", "uses": "Models that must respect rotation, such as machine-learned force fields for chemistry, protein design tools, and AlphaFold 2’s structure module, plus the general argument for why CNNs and transformers look the way they do.", "worth": "molecules, proteins, materials, or physical systems are your domain; scale has eroded its edge elsewhere, and AlphaFold 3 dropped built-in equivariance.", "resources": [{"title": "Geometric Deep Learning course (AMMI)", "url": "https://geometricdeeplearning.com/lectures/", "type": "lectures", "by": "Bronstein, Bruna, Cohen, Veličković, 2022", "level": 1, "note": "Lectures 1 to 4 build the symmetry argument before the architectures; recordings and slides."}, {"title": "Geometric Deep Learning: Grids, Groups, Graphs, Geodesics, and Gauges", "url": "https://arxiv.org/abs/2104.13478", "type": "book", "by": "Bronstein, Bruna, Cohen, Veličković, 2021", "level": 2, "note": "The proto-book the course follows."}, {"title": "Group Equivariant Convolutional Networks", "url": "https://arxiv.org/abs/1602.07576", "type": "paper", "by": "Taco Cohen, Max Welling, 2016", "level": 2, "note": "Extends convolution from translations to rotations and reflections."}, {"title": "E(n) Equivariant Graph Neural Networks", "url": "https://arxiv.org/abs/2102.09844", "type": "paper", "by": "Satorras, Hoogeboom, Welling, 2021", "level": 2, "note": "A simple equivariant message passing layer, widely used for molecules."}, {"title": "Theoretical Aspects of Group Equivariant Neural Networks", "url": "https://arxiv.org/abs/2004.05154", "type": "notes", "by": "Carlos Esteves, 2020", "level": 3, "note": "Group representations and Fourier analysis behind equivariant layers."}, {"title": "UvA Deep Learning 2: Regular Group Convolutions", "url": "https://uvadlc-notebooks.readthedocs.io/en/latest/tutorial_notebooks/DL2/Geometric_deep_learning/tutorial1_regular_group_convolutions.html", "type": "project", "by": "University of Amsterdam, Deep Learning 2", "level": 2, "build": "Lifting and group convolution layers for the rotation group C4, assembled into a network for rotated MNIST and tested for equivariance.", "teaches": "Equivariance as weight sharing over a group, checked numerically by rotating inputs and watching the features rotate with them.", "time": "a day"}]}, {"id": "attention", "title": "Attention and the transformer", "kind": "concept", "track": "llm", "pre": ["backprop"], "frontier": false, "core": "Each token updates its representation with a weighted average of the value vectors of the tokens it can see, with weights from a softmax over query-key dot products. Stacking attention with per-token MLPs and residual connections gives the transformer.", "reach": "The block this whole track builds on, from language models and mixture of experts to FlashAttention, transformer circuits, and diffusion transformers.", "uses": "ChatGPT, Gemini, and other chatbots, Google Translate, coding assistants, Whisper speech recognition, AlphaFold, image generators like Stable Diffusion 3, and protein and DNA language models. Most recent progress in AI runs through this block.", "worth": "you want to understand any modern AI system past the surface. Nobody going beyond the API can skip this one.", "resources": [{"title": "Attention in transformers, step-by-step", "url": "https://www.youtube.com/watch?v=eMlx5fFNoYc", "type": "video", "by": "3Blue1Brown, 2024", "level": 1}, {"title": "Let’s build GPT: from scratch, in code, spelled out", "url": "https://www.youtube.com/watch?v=kCc8FmEb1nY", "type": "video", "by": "Andrej Karpathy, 2023", "level": 1, "note": "Builds a small transformer in PyTorch one piece at a time."}, {"title": "Attention Is All You Need", "url": "https://arxiv.org/abs/1706.03762", "type": "paper", "by": "Vaswani et al., 2017", "level": 2, "note": "Section 3 holds the whole architecture."}, {"title": "Formal Algorithms for Transformers", "url": "https://arxiv.org/abs/2207.09238", "type": "paper", "by": "Phuong, Hutter, 2022", "level": 3, "note": "Exact pseudocode for every part, for when the diagrams are too loose."}, {"title": "ARENA 1.1: Transformers from Scratch", "url": "https://learn.arena.education/chapter1_transformer_interp/01_transformers/intro", "type": "project", "by": "ARENA, 2026", "level": 1, "build": "GPT-2 small from scratch: embeddings, attention, MLPs, and the residual stream, checked against the real weights, then trained and sampled.", "teaches": "Exactly what flows through a transformer’s residual stream, which every later interpretability exercise assumes.", "time": "a weekend"}]}, {"id": "lm", "title": "Language modeling and tokenization", "kind": "concept", "track": "llm", "pre": ["attention", "info"], "frontier": false, "core": "A language model assigns a probability to text by predicting each next token from the ones before it, trained to minimize cross-entropy, the average bits per token. A tokenizer, usually byte-pair encoding, first decides what a token is by repeatedly merging frequent pairs.", "reach": "Next-token cross-entropy is the loss that scaling laws measure and that pretraining, instruction tuning, and masked diffusion language models all build on.", "uses": "Chatbots, code assistants, autocomplete, and translation, plus less obvious ones: protein language models like ESM, compression (a better predictor is a better compressor), and tokenizers that make the same text cost more in some languages.", "worth": "you will train, fine-tune, or evaluate LLMs; API users benefit from the tokenizer part alone, which explains odd failures with spelling and arithmetic.", "resources": [{"title": "The spelled-out intro to language modeling: building makemore", "url": "https://www.youtube.com/watch?v=PaCmpygFfXo", "type": "video", "by": "Andrej Karpathy, 2022", "level": 1, "note": "A bigram character model, its likelihood, and the cross-entropy loss."}, {"title": "Let’s build the GPT Tokenizer", "url": "https://www.youtube.com/watch?v=zduSFxRajkE", "type": "video", "by": "Andrej Karpathy, 2024", "level": 1}, {"title": "Speech and Language Processing", "url": "https://web.stanford.edu/~jurafsky/slp3/", "type": "book", "by": "Jurafsky, Martin, 3rd edition draft", "level": 2, "note": "Chapter 3, N-gram Language Models; Sections 3.3 and 3.7 tie perplexity to cross-entropy."}, {"title": "Neural Machine Translation of Rare Words with Subword Units", "url": "https://arxiv.org/abs/1508.07909", "type": "paper", "by": "Sennrich, Haddow, Birch, 2016", "level": 2, "note": "Section 3.2 gives the BPE merge algorithm in a few lines of Python."}, {"title": "CS336 Assignment 1: Building a Transformer LM", "url": "https://github.com/stanford-cs336/assignment1-basics", "type": "project", "by": "Stanford CS336, 2026", "level": 2, "note": "The handout PDF is in the repository; the tests define each function’s interface.", "build": "A BPE tokenizer, a transformer language model, the cross-entropy loss, AdamW, and a training loop with checkpointing, then a model trained on TinyStories.", "teaches": "Every part of a modern language model written without a library, and what each part costs in memory and time.", "time": "two weeks", "signature": true}, {"title": "minbpe exercise", "url": "https://github.com/karpathy/minbpe/blob/master/exercise.md", "type": "project", "by": "Andrej Karpathy, 2024", "level": 1, "build": "A byte-level BPE tokenizer in steps: a basic trainer, a version that splits text with GPT-4’s regex, then encode and decode that match tiktoken exactly.", "teaches": "Where the quirks of LLM tokenization come from, and the details that make two tokenizers agree byte for byte.", "time": "a day"}]}, {"id": "scaling", "title": "Scaling laws", "kind": "concept", "track": "llm", "pre": ["lm", "training"], "frontier": false, "core": "Test loss falls as a smooth power law in parameters, data, and compute, so small runs predict large ones. For a fixed compute budget, parameters and training tokens should grow together, roughly 20 tokens per parameter.", "reach": "Sets the budgets for pretraining and mixture of experts, and the same curve fitting now describes test-time compute in chain of thought.", "uses": "Deciding how big a model should be and how much data to collect before paying for a large run, by forecasting it from small ones. Similar curves now describe vision and recommendation models too.", "worth": "you will plan training budgets or judge claims about where AI is heading; an afternoon with the Chinchilla result covers most needs.", "resources": [{"title": "Scaling Laws for LLMs: From GPT-3 to o3", "url": "https://cameronrwolfe.substack.com/p/llm-scaling-laws", "type": "blog", "by": "Cameron Wolfe, 2025", "level": 1}, {"title": "Training Compute-Optimal Large Language Models", "url": "https://arxiv.org/abs/2203.15556", "type": "paper", "by": "Hoffmann et al., DeepMind, 2022", "level": 2, "note": "Section 3 estimates the compute-optimal model size three different ways."}, {"title": "Scaling Laws for Neural Language Models", "url": "https://arxiv.org/abs/2001.08361", "type": "paper", "by": "Kaplan et al., OpenAI, 2020", "level": 2}, {"title": "Stanford CS336: Language Modeling from Scratch", "url": "https://cs336.stanford.edu/", "type": "course", "by": "Hashimoto, Liang, Stanford, 2026", "level": 2, "note": "Lectures 9 and 11 cover scaling laws; Assignment 3 has you fit one."}, {"title": "Chinchilla Scaling: A replication attempt", "url": "https://arxiv.org/abs/2404.10102", "type": "paper", "by": "Besiroglu et al., Epoch AI, 2024", "level": 3}, {"title": "CS336 Assignment 3: Scaling Laws", "url": "https://github.com/stanford-cs336/assignment3-scaling", "type": "project", "by": "Stanford CS336, 2026", "level": 3, "note": "The handout PDF is in the repository; the second half queries a hosted training API that needs a course key.", "build": "IsoFLOPs profiles fit to a set of training runs, power laws for optimal parameters and tokens extrapolated to a target budget, and the hyperparameters that budget implies.", "teaches": "That a handful of small runs predicts a large one, and how much the fit moves when you choose which runs to spend on.", "time": "a week"}]}, {"id": "pretrain", "title": "Pretraining an LLM end to end", "kind": "concept", "track": "llm", "pre": ["scaling", "parallel"], "frontier": false, "core": "Pretraining is one long next-token run over trillions of filtered, deduplicated tokens on thousands of accelerators. Most of the outcome is fixed before launch: the data mix, the architecture and its hyperparameters, the learning-rate schedule, and the parallel layout.", "reach": "Produces the base model that instruction tuning, RLHF, RLVR, LoRA, and vision-language-action models all start from.", "uses": "Producing the base models behind every chatbot and open-weight family such as Llama, Qwen, and DeepSeek, domain models for code and biology, and the filtering and deduplication pipelines that decide much of their quality.", "worth": "a pretraining team or a domain model built from scratch is your goal; most applied work starts from someone else’s base model instead.", "resources": [{"title": "Let’s reproduce GPT-2 (124M)", "url": "https://www.youtube.com/watch?v=l8pRSuU81PU", "type": "video", "by": "Andrej Karpathy, 2024", "level": 1, "note": "One full pretraining run, from an empty file to a trained model."}, {"title": "The Smol Training Playbook", "url": "https://huggingface.co/spaces/HuggingFaceTB/smol-training-playbook", "type": "book", "by": "Hugging Face, 2025", "level": 2, "note": "The decisions behind SmolLM3, a 3B model trained on 11T tokens: ablations, architecture, data, and the run itself."}, {"title": "nanochat", "url": "https://github.com/karpathy/nanochat", "type": "project", "by": "Andrej Karpathy, 2025", "level": 2, "build": "A small ChatGPT end to end: tokenizer, pretraining, finetuning, evaluation, and a chat interface, run as one speedrun script on an 8xH100 node in a few hours.", "teaches": "The stages of an LLM pipeline as one program, and where the compute goes in each.", "time": "a week"}, {"title": "The FineWeb Datasets: Decanting the Web for the Finest Text Data at Scale", "url": "https://arxiv.org/abs/2406.17557", "type": "paper", "by": "Penedo et al., Hugging Face, 2024", "level": 3}, {"title": "The Llama 3 Herd of Models", "url": "https://arxiv.org/abs/2407.21783", "type": "paper", "by": "Llama Team, Meta, 2024", "level": 3, "note": "Section 3 covers data, scaling, infrastructure, and the training recipe."}, {"title": "CS336 Assignment 4: Data", "url": "https://github.com/stanford-cs336/assignment4-data", "type": "project", "by": "Stanford CS336, 2026", "level": 2, "build": "A pipeline that turns Common Crawl HTML into training text, with filters for quality, harmful content, and personal information, and deduplication, then models trained on each variant.", "teaches": "The share of a model’s quality that the data pipeline decides, measured rather than assumed.", "time": "two weeks"}]}, {"id": "icl", "title": "In-context learning", "kind": "concept", "track": "llm", "pre": ["scaling"], "frontier": false, "core": "A large pretrained model can do a new task from a few examples placed in its prompt, with no weight update: the forward pass itself acts as a learning algorithm. Induction heads, which find an earlier match and copy what followed it, are one mechanism.", "reach": "Leads to chain of thought and agents; test-time training makes the in-context learning literal by updating weights during the forward pass.", "uses": "Few-shot prompting, where a handful of examples sets a format or teaches new labels; answering from documents pasted into the context; and much of what lets one model serve thousands of tasks without retraining.", "worth": "you write prompts or build LLM products; the mechanism through induction heads matters only if you study interpretability or architectures.", "resources": [{"title": "Language Models are Few-Shot Learners", "url": "https://arxiv.org/abs/2005.14165", "type": "paper", "by": "Brown et al., OpenAI, 2020", "level": 1, "note": "Figure 2.1 contrasts zero-, one-, and few-shot prompting with fine-tuning."}, {"title": "In-context Learning and Induction Heads", "url": "https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html", "type": "paper", "by": "Olsson et al., Anthropic, 2022", "level": 2}, {"title": "What Can Transformers Learn In-Context? A Case Study of Simple Function Classes", "url": "https://arxiv.org/abs/2208.01066", "type": "paper", "by": "Garg, Tsipras, Liang, Valiant, 2022", "level": 2}, {"title": "Transformers learn in-context by gradient descent", "url": "https://arxiv.org/abs/2212.07677", "type": "paper", "by": "von Oswald et al., 2023", "level": 3}, {"title": "An Explanation of In-context Learning as Implicit Bayesian Inference", "url": "https://arxiv.org/abs/2111.02080", "type": "paper", "by": "Xie, Raghunathan, Liang, Ma, 2022", "level": 3}, {"title": "Train a transformer to in-context learn linear regression", "url": "https://arxiv.org/abs/2208.01066", "type": "project", "by": "Built on Garg, Tsipras, Liang, Valiant, 2022", "level": 2, "note": "The authors’ code, with a small config for a quick run, is at github.com/dtsip/in-context-learning.", "build": "A 12-layer, 256-dimensional decoder trained on one GPU on prompts of input and output pairs from random 20-dimensional linear functions, with its error plotted beside least squares.", "teaches": "That in-context learning can be trained from nothing but prompts, and how close the forward pass gets to the optimal estimator.", "time": "a weekend", "made": true, "done": "Squared error at 20 in-context examples reaches the paper’s 0.02, falling to about 0.0006 at 40 examples, tracking the least squares curve."}]}, {"id": "cot", "title": "Chain of thought and test-time compute", "kind": "concept", "track": "llm", "pre": ["icl"], "frontier": true, "core": "Letting a model write intermediate steps before its answer turns one hard prediction into many easy ones. Spending more compute at inference, through longer reasoning or more samples with a vote or a verifier, then buys accuracy the way training compute does.", "reach": "Becomes a training target in RL with verifiable rewards, and the reasoning step inside every agent loop.", "uses": "Reasoning models such as OpenAI’s o1 and o3 and DeepSeek-R1, math and coding problems where longer reasoning helps most, and majority voting over many samples to raise accuracy on hard questions at higher inference cost.", "worth": "building on or studying LLMs is the goal; the field moves fast, and API users need only know when longer reasoning pays.", "resources": [{"title": "Why We Think", "url": "https://lilianweng.github.io/posts/2025-05-01-thinking/", "type": "blog", "by": "Lilian Weng, 2025", "level": 1}, {"title": "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models", "url": "https://arxiv.org/abs/2201.11903", "type": "paper", "by": "Wei et al., Google, 2022", "level": 2}, {"title": "Self-Consistency Improves Chain of Thought Reasoning in Language Models", "url": "https://arxiv.org/abs/2203.11171", "type": "paper", "by": "Wang et al., Google, 2023", "level": 2}, {"title": "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters", "url": "https://arxiv.org/abs/2408.03314", "type": "paper", "by": "Snell, Lee, Xu, Kumar, 2024", "level": 3}, {"title": "s1: Simple test-time scaling", "url": "https://arxiv.org/abs/2501.19393", "type": "paper", "by": "Muennighoff et al., 2025", "level": 3}, {"title": "Search and Learn recipes", "url": "https://github.com/huggingface/search-and-learn", "type": "project", "by": "Beeching, Tunstall, Rush, Hugging Face, 2024", "level": 2, "note": "Each config starts with four completions on ten problems; a full run at 256 samples takes hours on one GPU.", "build": "Best-of-N, beam search, and diverse verifier tree search run over a small instruct model on MATH-500, each step scored by a process reward model.", "teaches": "How accuracy climbs with samples at a fixed model size, and where the verifier’s own mistakes stop it.", "time": "a weekend"}]}, {"id": "agents", "title": "LLM agents and tool use", "kind": "concept", "track": "llm", "pre": ["cot"], "frontier": true, "core": "An agent is a model in a loop: it reads the state, reasons, picks an action such as a tool call or shell command, sees the result, and repeats until done. Most of the engineering lies in the tools, the context, and when to stop.", "reach": "Agentic RL trains these loops end to end, extending RL with verifiable rewards to multistep tool use.", "uses": "Coding agents such as Claude Code, Cursor, and Devin, browser automation, support bots that call internal tools, research assistants that search and read, and lab workflows that write and run code in a loop.", "worth": "LLM applications or RL on multistep tasks are your focus; practices change monthly, so learn the loop and how to evaluate it, not a framework.", "resources": [{"title": "Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents", "type": "blog", "by": "Anthropic, 2024", "level": 1}, {"title": "ReAct: Synergizing Reasoning and Acting in Language Models", "url": "https://arxiv.org/abs/2210.03629", "type": "paper", "by": "Yao et al., 2023", "level": 2}, {"title": "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering", "url": "https://arxiv.org/abs/2405.15793", "type": "paper", "by": "Yang et al., Princeton, 2024", "level": 2}, {"title": "Toolformer: Language Models Can Teach Themselves to Use Tools", "url": "https://arxiv.org/abs/2302.04761", "type": "paper", "by": "Schick et al., Meta, 2023", "level": 2}, {"title": "Berkeley LLM Agents MOOC", "url": "https://llmagents-learning.org/", "type": "lectures", "by": "Dawn Song et al., Berkeley, 2024 and 2025", "level": 2}, {"title": "ARENA 3.4: LLM Agents", "url": "https://learn.arena.education/chapter3_llm_evals/04_llm_agents/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "LLM agents with tool use and their own scaffolding, built to play the Wikipedia game by following links from one article to another.", "teaches": "That much of an agent’s ability comes from its scaffold rather than its model, and how to evaluate one.", "time": "a weekend"}]}, {"id": "moe", "title": "Mixture of experts", "kind": "concept", "track": "llm", "pre": ["attention", "parallel"], "frontier": false, "core": "Replace each dense MLP with many expert MLPs and a learned router that sends each token to only one or a few of them. Parameters grow while compute per token stays fixed; the hard parts are balancing load across experts and moving tokens between devices.", "reach": "Many of the largest open models are mixtures of experts, and expert parallelism joins data, tensor, and pipeline parallelism.", "uses": "Many of the largest open models, including Mixtral, DeepSeek-V3, Llama 4, and Qwen3’s largest models, and Google’s earlier GShard and Switch Transformer work, which scaled translation and language models past what dense compute allowed.", "worth": "you will train or serve large models, where it sets the hardware budget; as a model user, knowing active versus total parameters is enough.", "resources": [{"title": "Mixture of Experts Explained", "url": "https://huggingface.co/blog/moe", "type": "blog", "by": "Sanseviero et al., Hugging Face, 2023", "level": 1}, {"title": "Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity", "url": "https://arxiv.org/abs/2101.03961", "type": "paper", "by": "Fedus, Zoph, Shazeer, 2021", "level": 2}, {"title": "DeepSeekMoE: Towards Ultimate Expert Specialization in Mixture-of-Experts Language Models", "url": "https://arxiv.org/abs/2401.06066", "type": "paper", "by": "Dai et al., DeepSeek, 2024", "level": 2}, {"title": "DeepSeek-V3 Technical Report", "url": "https://arxiv.org/abs/2412.19437", "type": "paper", "by": "DeepSeek-AI, 2024", "level": 3, "note": "Section 2.1.2 balances expert load without an auxiliary loss."}, {"title": "makeMoE", "url": "https://github.com/AviSoori1x/makeMoE", "type": "project", "by": "AviSoori1x, 2024", "level": 2, "build": "A sparse mixture of experts language model written from scratch in PyTorch, with top-k gating, noisy top-k gating, and a version that enforces expert capacity.", "teaches": "What the router decides for each token, and how noise and a capacity limit change which experts a token reaches.", "time": "a weekend"}]}, {"id": "ssm", "title": "State-space models and Mamba", "kind": "concept", "track": "llm", "pre": ["linearattn", "odes"], "frontier": true, "core": "Replace attention’s growing cache with a fixed-size state updated by a linear recurrence, so each new token costs the same time and memory. Training still runs in parallel as a scan, and making the update depend on the input (Mamba) restores much of attention’s selectivity.", "reach": "Test-time training turns the state update into a gradient step; hybrids interleave these layers with attention for long contexts.", "uses": "Long sequences where attention gets expensive: audio generation, DNA models such as Caduceus, and hybrid LLMs such as Jamba and NVIDIA’s Nemotron-H that mix Mamba layers with attention.", "worth": "you work on long sequences, efficient architectures, or on-device models; the field is still moving, and transformer users can stop at the recurrence idea.", "resources": [{"title": "A Visual Guide to Mamba and State Space Models", "url": "https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-mamba-and-state", "type": "blog", "by": "Maarten Grootendorst, 2024", "level": 1}, {"title": "Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention", "url": "https://arxiv.org/abs/2006.16236", "type": "paper", "by": "Katharopoulos et al., 2020", "level": 2}, {"title": "Mamba: Linear-Time Sequence Modeling with Selective State Spaces", "url": "https://arxiv.org/abs/2312.00752", "type": "paper", "by": "Gu, Dao, 2023", "level": 2}, {"title": "State Space Duality (Mamba-2) Part I - The Model", "url": "https://tridao.me/blog/2024/mamba2-part1-model/", "type": "blog", "by": "Dao, Gu, 2024", "level": 3, "note": "Shows a selective SSM and causal linear attention computing the same structured matrix."}, {"title": "DeltaNet Explained (Part I)", "url": "https://sustcsonglin.github.io/blog/2024/deltanet-1/", "type": "blog", "by": "Songlin Yang, 2024", "level": 3}, {"title": "The Annotated S4", "url": "https://srush.github.io/annotated-s4/", "type": "code", "by": "Rush, Karamcheti, 2022", "level": 3}, {"title": "Reproduce the induction heads comparison", "url": "https://arxiv.org/abs/2312.00752", "type": "project", "by": "Built on Gu, Dao, 2023", "level": 3, "note": "Appendix E.1 gives the setup: model dimension 64, batch size 8, and test lengths from 64 up to 1,048,576.", "build": "Two-layer models on the induction heads task at length 256 with a vocabulary of 16, on one GPU: attention with absolute positions, a time-invariant SSM, and a selective one.", "teaches": "That a fixed-size state can beat attention at recall once its update depends on the input, and how each one fails outside its training length.", "time": "a weekend", "made": true, "done": "The selective SSM holds accuracy near 1.0 past 4,096 tokens, while no baseline stays above chance beyond twice the 256-token training length."}]}, {"id": "posenc", "title": "Positional encodings: sinusoidal, RoPE and ALiBi", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": false, "core": "Attention is blind to order, so position is injected. Sinusoidal and learned schemes add a position vector to each token; RoPE rotates queries and keys so scores depend only on relative distance; ALiBi subtracts a distance penalty, which degrades least past the training length.", "reach": "RoPE’s frequencies are what position interpolation and YaRN rescale for long context; NoPE asks whether an explicit encoding is needed at all.", "uses": "Stretching a chatbot’s context window from a few thousand tokens to hundreds of thousands, mostly by rescaling RoPE, which nearly every open LLM, including Llama, Qwen, and Mistral, uses.", "worth": "you will modify architectures or extend context lengths; if you only fine-tune or prompt models, a one-paragraph picture of RoPE is enough.", "resources": [{"title": "You could have designed state of the art positional encoding", "url": "https://huggingface.co/blog/designing-positional-encoding", "type": "blog", "by": "Christopher Fleetwood, Hugging Face, 2024", "level": 1, "note": "Builds from integer and binary encodings to sinusoids, then to RoPE."}, {"title": "Train Short, Test Long: Attention with Linear Biases Enables Input Length Extrapolation", "url": "https://arxiv.org/abs/2108.12409", "type": "paper", "by": "Press, Smith, Lewis, 2021", "level": 2, "note": "No position vectors at all, only a penalty on each score proportional to distance."}, {"title": "RoFormer: Enhanced Transformer with Rotary Position Embedding", "url": "https://arxiv.org/abs/2104.09864", "type": "paper", "by": "Su et al., 2021", "level": 2, "note": "Section 3.2 derives the rotation from the 2D case; Section 3.3 shows scores decay with distance."}, {"title": "The Impact of Positional Encoding on Length Generalization in Transformers", "url": "https://arxiv.org/abs/2305.19466", "type": "paper", "by": "Kazemnejad et al., 2023", "level": 3, "note": "On reasoning and math tasks, a decoder with no position encoding generalizes to longer inputs better than RoPE or ALiBi."}, {"title": "Train short, test long", "url": "https://arxiv.org/abs/2108.12409", "type": "project", "by": "Built on Press, Smith, Lewis, 2021", "level": 2, "build": "One small GPT trained at context length 512 three times, with sinusoidal, rotary, and ALiBi positions, on one GPU, then evaluated on validation inputs several times longer.", "teaches": "What breaks when a model meets positions it never saw, and why a distance penalty extrapolates where position vectors do not.", "time": "a weekend", "made": true, "done": "Sinusoidal perplexity climbs within a few dozen tokens past 512, rotary degrades more slowly, and ALiBi stays flat or improves out to thousands of tokens, as in Figure 1 (L = 512)."}]}, {"id": "kvattn", "title": "Multi-query, grouped-query and latent attention", "kind": "concept", "track": "llm", "pre": ["attention", "serving"], "frontier": false, "core": "Decoding rereads every cached key and value at each step, so cache size sets decode speed. Multi-query attention shares one key-value head across all query heads at some cost in quality, grouped-query shares one per group, and latent attention caches one compressed vector per token.", "reach": "The KV cache these shrink is what PagedAttention pages and long context must fit; latent attention reappears in DeepSeek-V3 and Kimi Linear.", "uses": "Serving cost and speed in production LLMs: PaLM used multi-query attention, Llama 2 70B and all Llama 3 models use grouped-query attention, and DeepSeek-V2 and V3 use latent attention to save memory.", "worth": "you will serve models or design architectures where memory sets cost; others need only know that the KV cache dominates long-context inference memory.", "resources": [{"title": "The Big LLM Architecture Comparison", "url": "https://magazine.sebastianraschka.com/p/the-big-llm-architecture-comparison", "type": "blog", "by": "Sebastian Raschka, 2025", "level": 1, "note": "Section 1.1 explains grouped-query attention, then latent attention, with figures."}, {"title": "Fast Transformer Decoding: One Write-Head is All You Need", "url": "https://arxiv.org/abs/1911.02150", "type": "paper", "by": "Noam Shazeer, 2019", "level": 2, "note": "Multi-query attention: all heads share one key and one value head, so each decode step reads far less memory."}, {"title": "GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints", "url": "https://arxiv.org/abs/2305.13245", "type": "paper", "by": "Ainslie et al., Google, 2023", "level": 2, "note": "A few key-value groups recover multi-head quality, and existing checkpoints convert with 5% of their pretraining compute."}, {"title": "DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model", "url": "https://arxiv.org/abs/2405.04434", "type": "paper", "by": "DeepSeek-AI, 2024", "level": 2, "note": "Section 2.1: keys and values compressed into one latent vector, a decoupled RoPE path, and a table comparing cache sizes."}, {"title": "Hardware-Efficient Attention for Fast Decoding", "url": "https://arxiv.org/abs/2505.21487", "type": "paper", "by": "Zadouri, Strauss, Dao, 2025", "level": 3, "note": "Designs attention for more compute per byte loaded: grouped-tied attention halves GQA’s cache, and grouped latent attention matches MLA while sharding more easily."}, {"title": "Four attention variants, four KV caches", "url": "https://arxiv.org/abs/2405.04434", "type": "project", "by": "Built on DeepSeek-AI, 2024", "level": 2, "build": "Multi-head, grouped-query, multi-query, and latent attention with a decoupled RoPE key, swapped into one small GPT, each decoding with its own KV cache.", "teaches": "Exactly what each variant stores per token, and how latent attention caches one small vector yet still expands it to full heads at decode time.", "time": "a weekend", "made": true, "done": "Measured cache per token per layer matches Table 1: 2 n_h d_h for MHA, 2 n_g d_h for GQA, 2 d_h for MQA, and 4.5 d_h for MLA, the size of GQA with 2.25 groups."}]}, {"id": "sparseattn", "title": "Sparse and sliding-window attention", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": false, "core": "Each query attends to a fixed or chosen subset of keys instead of all: a local window, strided positions, a few global tokens, or blocks picked by content. Cost falls from quadratic toward linear, while depth or global tokens carry information beyond the window.", "reach": "Sliding windows mixed with a few full layers make Gemma’s hybrids; Native Sparse Attention and DeepSeek Sparse Attention learn which keys each query reads.", "uses": "Long-document models such as Longformer and BigBird, Mistral 7B’s sliding window, Gemma 2 and 3’s alternating local and global layers, and GPT-3, which alternated dense layers with locally banded sparse ones.", "worth": "you work on long-context models or efficient architectures; for most applied work, knowing that a window caps both memory and recall is enough.", "resources": [{"title": "The Transformer Family Version 2.0", "url": "https://lilianweng.github.io/posts/2023-01-27-the-transformer-family-v2/", "type": "blog", "by": "Lilian Weng, 2023", "level": 1, "note": "The Sparse Attention Patterns part of Efficient Attention: local, strided, and combined local and global patterns."}, {"title": "Mistral 7B", "url": "https://arxiv.org/abs/2310.06825", "type": "paper", "by": "Jiang et al., Mistral AI, 2023", "level": 2, "note": "Section 2: a 4096-token window whose reach grows with depth, and a rolling buffer that cuts cache memory 8x at 32K tokens."}, {"title": "Native Sparse Attention: Hardware-Aligned and Natively Trainable Sparse Attention", "url": "https://arxiv.org/abs/2502.11089", "type": "paper", "by": "Yuan et al., DeepSeek, 2025", "level": 3, "note": "Each query reads compressed blocks, a few selected blocks, and a local window, with kernels shaped for GPU tiles and sparsity trained from the start."}, {"title": "Longformer: The Long-Document Transformer", "url": "https://arxiv.org/abs/2004.05150", "type": "paper", "by": "Beltagy, Peters, Cohan, AI2, 2020", "level": 2, "note": "A sliding window for every token plus global attention on a few chosen tokens."}, {"title": "Generating Long Sequences with Sparse Transformers", "url": "https://arxiv.org/abs/1904.10509", "type": "paper", "by": "Child, Gray, Radford, Sutskever, OpenAI, 2019", "level": 2, "note": "Strided and fixed factorized patterns cut cost from n squared to n times the square root of n."}, {"title": "Big Bird: Transformers for Longer Sequences", "url": "https://arxiv.org/abs/2007.14062", "type": "paper", "by": "Zaheer et al., Google, 2020", "level": 3, "note": "Window, global and random links, with proofs that this sparse graph keeps full attention’s expressive power."}, {"title": "Sliding windows and a rolling buffer cache", "url": "https://arxiv.org/abs/2310.06825", "type": "project", "by": "Built on Jiang et al., Mistral AI, 2023", "level": 2, "build": "Sliding window attention and a rolling buffer KV cache that stores position i in slot i mod W, added to a small GPT, with gradients traced back through the layers.", "teaches": "How a fixed window caps memory while depth still carries information past the window, one window per layer.", "time": "a day", "made": true, "done": "Cache memory stops growing at W tokens, 8x smaller at 32K tokens with W = 4096, and a token in layer k sees inputs up to W times k back, as in Section 2."}]}, {"id": "assocmem", "title": "Associative memory: outer products and the delta rule", "kind": "concept", "track": "llm", "pre": ["svd", "attention"], "frontier": false, "core": "Store a pair by adding v k^T to a matrix S; read with S q. Orthogonal unit keys make a d-by-d S hold d pairs exactly, and more pairs interfere. The delta rule adds (v - S k) k^T instead, replacing a key’s old value.", "reach": "Linear attention is this memory written once per token; gates add forgetting, and test-time training swaps the matrix for a network trained by gradient steps.", "uses": "Mostly a lens rather than a product: Hopfield networks, a classic model of memory in neuroscience, rest on it, and the delta rule is the Widrow-Hoff rule behind adaptive filters that cancel phone echo.", "worth": "you plan to study linear attention, state-space models, or test-time training; otherwise, the one-line picture of keys writing values into a matrix suffices.", "resources": [{"title": "DeltaNet Explained (Part I)", "url": "https://sustcsonglin.github.io/blog/2024/deltanet-1/", "type": "blog", "by": "Songlin Yang, 2024", "level": 1, "note": "Read up to the in-context retrieval section: the matrix state, the error that overlapping keys cause, and the delta rule as an overwrite."}, {"title": "Linear Transformers Are Secretly Fast Weight Programmers", "url": "https://arxiv.org/abs/2102.11174", "type": "paper", "by": "Schlag, Irie, Schmidhuber, 2021", "level": 2, "note": "Section 4.1 shows that keys of dimension d allow at most d associations without crosstalk; Section 4.2 derives the delta rule with a learned write strength."}, {"title": "Hopfield Networks is All You Need", "url": "https://ml-jku.github.io/hopfield-layers/", "type": "blog", "by": "Brandstetter et al., JKU Linz, 2020", "level": 2, "note": "Classical outer-product storage holds about 0.14d patterns; an exponential energy holds exponentially many, and its update rule is softmax attention."}, {"title": "Using Fast Weights to Attend to the Recent Past", "url": "https://arxiv.org/abs/1610.06258", "type": "paper", "by": "Ba, Hinton, Mnih, Leibo, Ionescu, 2016", "level": 2, "note": "Section 3: a decaying sum of outer products of recent hidden states acts as attention to the recent past."}, {"title": "Hopfield Networks is All You Need", "url": "https://arxiv.org/abs/2008.02217", "type": "paper", "by": "Ramsauer et al., JKU Linz, 2020", "level": 3, "note": "Section 2 holds the theorems: exponential storage capacity and retrieval after one update."}, {"title": "Capacity of a linear attention memory", "url": "https://arxiv.org/abs/2102.11174", "type": "project", "by": "Built on Schlag, Irie, Schmidhuber, 2021", "level": 2, "build": "A one-layer associative retrieval model trained on sequences of random key-value pairs, with softmax attention, a sum update, and a delta rule update, as the number of keys grows.", "teaches": "Why a d-dimensional key space holds about d associations before they interfere, and how the delta rule overwrites instead of piling up.", "time": "a day", "made": true, "done": "With 64-dimensional keys, the sum rule errs from about 60 associations while softmax holds (Figure 2); with 20 keys reused over 40 steps, the sum rule fails and the delta rule learns (Figure 3)."}]}, {"id": "linearattn", "title": "Linear attention", "kind": "concept", "track": "llm", "pre": ["attention", "assocmem"], "frontier": true, "core": "Without the softmax, attention’s sum over past keys collapses into a fixed-size matrix state updated once per token: an RNN with constant memory, but lossy recall. Variants differ in the update: fixed decay (RetNet), learned gates (GLA, Mamba-2), or overwrites by the delta rule (DeltaNet).", "reach": "Mamba-2 shows selective state-space models compute the same thing; the delta rule leads to test-time training; hybrids keep a few full layers for recall.", "uses": "LLMs that keep constant memory per token for long contexts and cheap inference, such as RWKV and RetNet, and the linear layers inside MiniMax-01 and Qwen3-Next.", "worth": "you research architectures or long-context efficiency; the field is still moving, and most practitioners can wait to see which variant wins.", "resources": [{"title": "Linear Attention and Beyond (Interactive Tutorial with Songlin Yang)", "url": "https://www.youtube.com/watch?v=d0HJvGSWw8A", "type": "video", "by": "Sasha Rush, Songlin Yang, 2025", "level": 1}, {"title": "Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention", "url": "https://arxiv.org/abs/2006.16236", "type": "paper", "by": "Katharopoulos et al., 2020", "level": 2, "note": "Replacing the softmax with a feature map lets the sum over keys be computed once and carried forward."}, {"title": "Gated Linear Attention Transformers with Hardware-Efficient Training", "url": "https://arxiv.org/abs/2312.06635", "type": "paper", "by": "Yang, Wang, Shen, Panda, Kim, 2023", "level": 2, "note": "Table 1 writes Mamba, Mamba-2, RWKV-6 and others as linear attention that differ only in the forget gate; the chunkwise algorithm makes training fast."}, {"title": "Gated Delta Networks: Improving Mamba2 with Delta Rule", "url": "https://arxiv.org/abs/2412.06464", "type": "paper", "by": "Yang, Kautz, Hatamizadeh, NVIDIA, 2024", "level": 3, "note": "DeltaNet’s delta rule overwrites the value stored at a key instead of adding to it, and the gate erases quickly. Qwen3-Next and Kimi Linear build on this layer."}, {"title": "Transformers are SSMs: Generalized Models and Efficient Algorithms Through Structured State Space Duality", "url": "https://arxiv.org/abs/2405.21060", "type": "paper", "by": "Dao, Gu, 2024", "level": 3, "note": "Mamba-2: a selective SSM with scalar decay and masked linear attention compute the same matrix, so either algorithm can run it."}, {"title": "Rethinking Attention with Performers", "url": "https://arxiv.org/abs/2009.14794", "type": "paper", "by": "Choromanski et al., Google, 2020", "level": 3, "note": "The other route: approximate the softmax kernel itself with positive random features instead of replacing it."}, {"title": "Recall against state size on MQAR", "url": "https://github.com/HazyResearch/zoology", "type": "project", "by": "Built on Arora et al., 2024", "level": 3, "build": "Linear attention with ReLU, ELU+1, squared, Taylor, CosFormer, and Performer feature maps, trained beside softmax attention on multi-query associative recall in Zoology, on one GPU, sweeping state size.", "teaches": "That linear attention recalls only as much as its state can hold, and how the feature map decides how well it uses that state.", "time": "a weekend", "made": true, "done": "With 256 key-value pairs, accuracy rises with state size, and the Taylor, ELU+1, and ReLU maps sit on the frontier, as in Figure 3 of the Based paper."}]}, {"id": "crossattn", "title": "Cross-attention and encoder-decoder models", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": false, "core": "Queries come from one sequence and keys and values from another: a decoder reads the encoder’s output, image latents read a text prompt, and a small latent array summarizes a huge input. Cost grows with the product of the two lengths, not either one squared.", "reach": "The conditioning path in latent diffusion and in Flamingo-style vision-language models; decoder-only models replace it by putting both sequences in one context.", "uses": "Whisper’s decoder reading audio features, the original transformer for translation, text prompts steering the image in Stable Diffusion, Flamingo-style visual question answering, and Perceiver models that compress huge inputs into small latent arrays.", "worth": "you work with multimodal models, speech, translation, or conditioning in diffusion; for decoder-only LLM work, a quick read suffices.", "resources": [{"title": "The Illustrated Transformer", "url": "https://jalammar.github.io/illustrated-transformer/", "type": "blog", "by": "Jay Alammar, 2018", "level": 1, "note": "The decoder part: encoder-decoder attention takes queries from the decoder and keys and values from the encoder."}, {"title": "Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer", "url": "https://arxiv.org/abs/1910.10683", "type": "paper", "by": "Raffel et al., Google, 2019", "level": 2, "note": "Section 3.2 compares encoder-decoder, decoder-only and prefix LM models and draws each one’s attention mask."}, {"title": "Perceiver: General Perception with Iterative Attention", "url": "https://arxiv.org/abs/2103.03206", "type": "paper", "by": "Jaegle et al., DeepMind, 2021", "level": 2, "note": "A small latent array cross-attends to a huge input, so cost grows linearly with the input."}, {"title": "Prompt-to-Prompt Image Editing with Cross Attention Control", "url": "https://arxiv.org/abs/2208.01626", "type": "paper", "by": "Hertz et al., Google, 2022", "level": 3, "note": "In a text-to-image diffusion model each word’s cross-attention map lays out where it appears; editing the maps edits the image."}, {"title": "Flamingo: a Visual Language Model for Few-Shot Learning", "url": "https://arxiv.org/abs/2204.14198", "type": "paper", "by": "Alayrac et al., DeepMind, 2022", "level": 3, "note": "Gated cross-attention layers inserted into a frozen language model let text tokens read image features."}, {"title": "The Annotated Transformer", "url": "https://nlp.seas.harvard.edu/annotated-transformer/", "type": "project", "by": "Huang, Subramanian, Sum, Almubarak, Biderman, after Sasha Rush, Harvard NLP, 2022", "level": 2, "build": "The original encoder-decoder transformer written line by line in PyTorch, trained on a copy task and then on Multi30k German to English translation, with source attention maps plotted.", "teaches": "Exactly where the decoder’s queries meet the encoder’s keys and values, and what that source attention learns to align.", "time": "a weekend"}]}, {"id": "masks", "title": "Attention masks: causal, bidirectional, prefix and block", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": false, "core": "The mask decides which keys each query may see, and with the training target it defines the model: causal gives autoregressive models with a reusable KV cache, prefix adds full attention over the prompt, full gives BERT and masked diffusion, and block-causal gives block diffusion.", "reach": "Block diffusion builds on this choice; FlexAttention compiles any mask written as a small Python function into a fused kernel that skips fully masked blocks.", "uses": "Deciding what a model can do: chat models are causal, BERT, used in Google Search since 2019, is bidirectional, prefix models such as UL2 read the prompt fully, and packed training needs block masks.", "worth": "you will write training code, change architectures, or study diffusion LLMs; model users can skip it, though it explains why BERT cannot write text.", "resources": [{"title": "FlexAttention: The Flexibility of PyTorch with the Performance of FlashAttention", "url": "https://pytorch.org/blog/flexattention/", "type": "blog", "by": "PyTorch team, 2024", "level": 1, "note": "Causal, sliding window, prefix LM and document masks, each a few lines of Python with a picture."}, {"title": "Unified Language Model Pre-training for Natural Language Understanding and Generation", "url": "https://arxiv.org/abs/1905.03197", "type": "paper", "by": "Dong et al., Microsoft, 2019", "level": 2, "note": "Figure 1: one shared transformer trained under bidirectional, left-to-right and sequence-to-sequence masks."}, {"title": "meta-pytorch/attention-gym", "url": "https://github.com/meta-pytorch/attention-gym", "type": "code", "by": "PyTorch, 2024", "level": 2, "note": "Masks and score modifications to run, combine and visualize."}, {"title": "What Language Model Architecture and Pretraining Objective Work Best for Zero-Shot Generalization?", "url": "https://arxiv.org/abs/2204.05832", "type": "paper", "by": "Wang et al., BigScience, 2022", "level": 3, "note": "Causal decoders, prefix decoders and encoder-decoders trained at 5B parameters; the causal decoder generalizes best zero-shot after plain pretraining."}, {"title": "Flex Attention: A Programming Model for Generating Optimized Attention Kernels", "url": "https://arxiv.org/abs/2412.05496", "type": "paper", "by": "Dong et al., PyTorch, 2024", "level": 3, "note": "How a mask written as a function becomes a block-sparse kernel in the FlashAttention style."}, {"title": "Masks as FlexAttention functions", "url": "https://pytorch.org/blog/flexattention/", "type": "project", "by": "Built on the PyTorch FlexAttention post, 2024", "level": 2, "build": "Causal, sliding window, prefix, document, and block causal masks written as FlexAttention mask functions on one GPU, each checked against a dense masked softmax and timed with its block mask.", "teaches": "That a mask is a rule on query and key positions, and that the speed comes from skipping blocks the rule hides completely.", "time": "a day", "made": true, "done": "Every mask matches dense attention, and the causal mask runs about 2x faster with its block mask than as a score modification, from its 50 percent sparsity, as the post measures."}]}, {"id": "triattn", "title": "Triangle attention and pair representations", "kind": "concept", "track": "llm", "pre": ["attention", "geometric"], "frontier": false, "core": "Keep a vector for every pair of residues and update pair (i,j) from pairs (i,k) and (j,k), the other two sides of each triangle, by multiplication or attention. Pair beliefs can become consistent, like distances obeying the triangle inequality, at cubic cost in length.", "reach": "The core of protein structure prediction: AlphaFold 2’s Evoformer and AlphaFold 3’s Pairformer; Pairmixer drops triangle attention and runs up to 4x faster.", "uses": "AlphaFold 2 and 3, OpenFold, Boltz, and Chai-1, the structure predictors used across drug discovery and protein design. Outside structural biology it is rarely used, since cubic cost limits it to short sequences.", "worth": "protein structure or biomolecular modeling is where you want to work; for language, vision, or general ML, skip it.", "resources": [{"title": "AlphaFold 2 is here: what’s behind the structure prediction miracle", "url": "https://www.blopig.com/blog/2021/07/alphafold-2-is-here-whats-behind-the-structure-prediction-miracle/", "type": "blog", "by": "Carlos Outeiral, Oxford Protein Informatics Group, 2021", "level": 1, "note": "The Evoformer part: why attention arranged around triangles of residues aims at the triangle inequality."}, {"title": "Supplementary Information for: Highly accurate protein structure prediction with AlphaFold", "url": "https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-021-03819-2/MediaObjects/41586_2021_3819_MOESM1_ESM.pdf", "type": "paper", "by": "Jumper et al., DeepMind, 2021", "level": 2, "note": "Sections 1.6.5 and 1.6.6, Algorithms 11 to 14: triangle multiplicative updates and triangle self-attention, with figures."}, {"title": "Accurate structure prediction of biomolecular interactions with AlphaFold 3: Supplementary Information", "url": "https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-024-07487-w/MediaObjects/41586_2024_7487_MOESM1_ESM.pdf", "type": "paper", "by": "Abramson et al., Google DeepMind, 2024", "level": 2, "note": "Section 3.6, Algorithm 17: the Pairformer keeps the triangle updates, drops the alignment rows, and lets pairs only bias attention over single tokens."}, {"title": "Triangle Multiplication Is All You Need For Biomolecular Structure Representations", "url": "https://arxiv.org/abs/2510.18870", "type": "paper", "by": "Ouyang-Zhang et al., 2025", "level": 3, "note": "Pairmixer keeps triangle multiplication, drops triangle attention, matches leading predictors, and runs up to 4x faster on long sequences."}, {"title": "Triangle updates from the AlphaFold 2 supplement", "url": "https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-021-03819-2/MediaObjects/41586_2021_3819_MOESM1_ESM.pdf", "type": "project", "by": "Built on Jumper et al., 2021", "level": 3, "build": "Triangle multiplicative updates and triangle self-attention around the starting and ending node, written as PyTorch modules from Algorithms 11 to 14, then tested and timed as the residue count grows.", "teaches": "What each triangle update reads and writes for a pair, and why its cubic memory limits how long a protein can be.", "time": "a day", "made": true, "done": "Modules use the defaults (c = 128 for multiplication, 4 heads of 32 channels for attention), stay equivariant when residues are permuted, and attention logits grow as N cubed (Section 1.11.8)."}]}, {"id": "hybridattn", "title": "Hybrid models: linear and full attention together", "kind": "concept", "track": "llm", "pre": ["linearattn", "sparseattn", "ssm"], "frontier": true, "core": "Most layers use a fixed-size memory (linear attention, a state-space layer, or a sliding window) and one layer in four to eight keeps full softmax attention. The full layers supply exact recall; the rest keep the KV cache and per-token cost nearly flat.", "reach": "The pattern behind Jamba, MiniMax-01, Gemma 3, Qwen3-Next, and Kimi Linear; MiniMax’s return to full attention in M2 shows the tradeoff is still open.", "uses": "Cutting the memory and cost of serving very long inputs, such as whole codebases or long agent transcripts, in models like Jamba, Gemma 3, and Qwen3-Next; how much recall it gives up is still debated.", "worth": "you design or serve long-context models; the right ratio of layer types is unsettled, so most people can wait until a standard emerges.", "resources": [{"title": "Beyond Standard LLMs", "url": "https://magazine.sebastianraschka.com/p/beyond-standard-llms", "type": "blog", "by": "Sebastian Raschka, 2025", "level": 1, "note": "Section 2: linear attention, Gated DeltaNet, the 3:1 hybrids in Qwen3-Next and Kimi Linear, and why MiniMax went back to full attention."}, {"title": "An Empirical Study of Mamba-based Language Models", "url": "https://arxiv.org/abs/2406.07887", "type": "paper", "by": "Waleffe et al., NVIDIA, 2024", "level": 2, "note": "Loss is lowest with about 8% attention layers; pure Mamba lags on copying and in-context learning, and the 8B hybrid beats the Transformer on all 12 standard tasks."}, {"title": "Jamba: A Hybrid Transformer-Mamba Language Model", "url": "https://arxiv.org/abs/2403.19887", "type": "paper", "by": "Lieber et al., AI21 Labs, 2024", "level": 2, "note": "One attention layer per seven Mamba layers gives an 8x smaller KV cache; Section 6 shows pure Mamba misses in-context formats the hybrid gets."}, {"title": "Gemma 3 Technical Report", "url": "https://arxiv.org/abs/2503.19786", "type": "paper", "by": "Gemma Team, Google DeepMind, 2025", "level": 2, "note": "Five sliding window layers per global layer (Section 2); the Section 5.2 ablation finds the ratio barely moves perplexity while shrinking the cache."}, {"title": "MiniMax-01: Scaling Foundation Models with Lightning Attention", "url": "https://arxiv.org/abs/2501.08313", "type": "paper", "by": "MiniMax, 2025", "level": 3, "note": "Section 2.2: pure lightning attention fails at retrieval, so a softmax block follows every seven lightning blocks in a 456B model."}, {"title": "Kimi Linear: An Expressive, Efficient Attention Architecture", "url": "https://arxiv.org/abs/2510.26692", "type": "paper", "by": "Kimi Team, Moonshot AI, 2025", "level": 3, "note": "Three Kimi Delta Attention layers per latent attention layer: up to 75% less KV cache and up to 6x faster decoding at 1M tokens."}, {"title": "One attention layer in a recurrent stack", "url": "https://github.com/HazyResearch/zoology", "type": "project", "by": "Built on Arora et al., 2023", "level": 2, "build": "Small models trained on multi-query associative recall in Zoology on one GPU: all softmax attention, all linear attention or Mamba, and hybrids with one attention layer, at the same model dimension.", "teaches": "Why a single full attention layer restores the exact recall that fixed-size layers lose, and what it costs in state.", "time": "a weekend", "made": true, "done": "At model dimension 64, the hybrid solves MQAR at sequence lengths 64 to 512 as fully as pure attention does in Figure 2 of the Zoology paper, while the pure recurrent model falls short."}]}, {"id": "longctx", "title": "Long context: attention sinks, ring attention and extrapolation", "kind": "concept", "track": "llm", "pre": ["posenc", "flashattn", "sparseattn", "parallel"], "frontier": true, "core": "Going past the training length breaks three things: unseen positions (rescale RoPE, as position interpolation and YaRN do), attention that dumps weight on the first tokens (keep them as sinks, as StreamingLLM does), and memory beyond one GPU (shard the sequence, as Ring Attention does).", "reach": "Hybrids and sliding windows cap the cache; RULER shows that passing needle-in-a-haystack is not the same as using the context.", "uses": "Chat over whole books, codebases, and long videos, as in Gemini’s million-token context; streaming chat that keeps running past the training length; and question answering over long legal or financial filings.", "worth": "you build products on long inputs or train long-context models; the fixes change yearly, so learn the three failure modes rather than each patch.", "resources": [{"title": "Extending the RoPE", "url": "https://blog.eleuther.ai/yarn/", "type": "blog", "by": "Fan, Peng, Quesnelle, EleutherAI, 2023", "level": 1, "note": "Position interpolation, NTK-aware scaling and YaRN, each as a change to RoPE’s frequencies."}, {"title": "Efficient Streaming Language Models with Attention Sinks", "url": "https://arxiv.org/abs/2309.17453", "type": "paper", "by": "Xiao et al., MIT, 2023", "level": 2, "note": "Keeping a few initial tokens beside a sliding window keeps models stable for 4 million tokens."}, {"title": "RULER: What’s the Real Context Size of Your Long-Context Language Models?", "url": "https://arxiv.org/abs/2404.06654", "type": "paper", "by": "Hsieh et al., NVIDIA, 2024", "level": 2, "note": "Thirteen tasks beyond a single needle, including multi-hop tracing and aggregation; half the models tested fall short at 32K tokens."}, {"title": "Ring Attention with Blockwise Transformers for Near-Infinite Context", "url": "https://arxiv.org/abs/2310.01889", "type": "paper", "by": "Liu, Zaharia, Abbeel, Berkeley, 2023", "level": 3, "note": "Each device keeps a block of the sequence and passes key-value blocks around a ring, hiding the transfer behind compute."}, {"title": "Extending Context Window of Large Language Models via Positional Interpolation", "url": "https://arxiv.org/abs/2306.15595", "type": "paper", "by": "Chen, Wong, Chen, Tian, Meta, 2023", "level": 3, "note": "Interpolated positions keep attention scores bounded where extrapolated ones blow up; 1000 fine-tuning steps reach 32K."}, {"title": "Gated Attention for Large Language Models: Non-linearity, Sparsity, and Attention-Sink-Free", "url": "https://arxiv.org/abs/2505.06708", "type": "paper", "by": "Qiu et al., Qwen, 2025", "level": 3, "note": "A sigmoid gate after attention removes the sink and improves context extension."}, {"title": "Attention sinks on a streaming model", "url": "https://arxiv.org/abs/2309.17453", "type": "project", "by": "Built on Xiao et al., 2023", "level": 2, "build": "A small open model run over 20K tokens of PG-19 on one GPU with window attention, sliding window with recomputation, and a window plus 4 sink tokens, tracking perplexity as the cache fills.", "teaches": "That models dump attention on the first tokens, and that keeping those few tokens is what keeps a sliding cache stable.", "time": "a day", "made": true, "done": "Window attention’s perplexity explodes once the first tokens are evicted (5158 against 5.40 with 4 sinks for Llama-2-13B, Table 1), and 4 sinks track the recompute baseline, as in Figure 3."}]}, {"id": "gpu", "title": "GPU programming", "kind": "concept", "track": "sys", "pre": ["linalg"], "frontier": false, "core": "A GPU runs thousands of threads in lockstep groups of 32, and most kernels are limited by moving bytes from memory rather than by arithmetic. Fast kernels tile the work so each block loads data into fast on-chip memory once and reuses it many times.", "reach": "The mental model behind FlashAttention, quantized kernels, and every roofline estimate in How to Scale Your Model.", "uses": "Writing CUDA or Triton kernels, molecular dynamics codes such as GROMACS, real-time graphics in games, and reasoning about cost: the bytes-moved arithmetic explains why LLM decoding is slow and why batching helps.", "worth": "you will write kernels, optimize training or serving, or estimate cost; researchers who only run experiments need the memory-bound idea, not CUDA itself.", "resources": [{"title": "Making Deep Learning Go Brrrr From First Principles", "url": "https://horace.io/brrr_intro.html", "type": "blog", "by": "Horace He, 2022", "level": 1, "note": "Compute, memory bandwidth, and overhead: which one bounds your model."}, {"title": "GPU Puzzles", "url": "https://github.com/srush/GPU-Puzzles", "type": "project", "by": "Sasha Rush, 2022", "level": 1, "build": "Fourteen small CUDA kernels written in Python through Numba, from mapping threads onto data to a prefix sum and a tiled matrix multiply.", "teaches": "The CUDA execution model, threads, blocks, shared memory, and synchronization, scored by how many memory reads each kernel makes.", "time": "a day"}, {"title": "How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance: a Worklog", "url": "https://siboehm.com/articles/22/CUDA-MMM", "type": "blog", "by": "Simon Boehm, 2022", "level": 2}, {"title": "Triton tutorials", "url": "https://triton-lang.org/main/getting-started/tutorials/index.html", "type": "tutorial", "by": "OpenAI Triton", "level": 2}, {"title": "Programming Massively Parallel Processors", "url": "https://shop.elsevier.com/books/programming-massively-parallel-processors/hwu/978-0-323-91231-0", "type": "book", "by": "Wen-mei Hwu, David Kirk, Izzat El Hajj, 4th edition, 2022", "level": 2, "note": "The CUDA textbook. The GPU MODE lecture repository lists it as the companion text.", "paid": true}, {"title": "GPU MODE lectures", "url": "https://github.com/gpu-mode/lectures", "type": "lectures", "by": "GPU MODE reading group, 2024 onward", "level": 3, "note": "Slides, notebooks, and code for each recorded lecture; the videos are on the GPU MODE YouTube channel."}, {"title": "Triton Puzzles", "url": "https://github.com/gpu-mode/Triton-Puzzles", "type": "project", "by": "Sasha Rush, Tejas Ramesh, Keren Zhou, 2024", "level": 2, "build": "Triton kernels that grow from trivial examples to real algorithms such as FlashAttention and a quantized matrix multiply, run in an interpreter with no GPU needed.", "teaches": "Block-level GPU programming, where loading and storing memory is what decides speed.", "time": "a weekend"}]}, {"id": "flashattn", "title": "FlashAttention", "kind": "paper", "track": "sys", "pre": ["gpu", "attention"], "frontier": false, "core": "Standard attention writes the full N by N score matrix to slow GPU memory and reads it back. FlashAttention computes the identical result tile by tile in fast on-chip memory, using a running softmax so that matrix is never stored.", "reach": "The model for IO-aware kernels across training and serving; FlashAttention-2 and -3 retune it for newer GPUs.", "uses": "Nearly every modern LLM training and inference stack, including PyTorch’s built-in attention, vLLM, and Hugging Face models; it made long contexts affordable and is the model case for redesigning any memory-bound GPU kernel.", "worth": "you write GPU kernels or want to see IO-aware thinking in its clearest form; model users only need to know to turn it on.", "resources": [{"title": "From Online Softmax to FlashAttention", "url": "https://courses.cs.washington.edu/courses/cse599m/23sp/notes/flashattn.pdf", "type": "notes", "by": "Zihao Ye, UW CSE 599M, 2023", "level": 1, "note": "The running softmax derivation in a few pages."}, {"title": "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness", "url": "https://arxiv.org/abs/2205.14135", "type": "paper", "by": "Dao, Fu, Ermon, Rudra, Ré, 2022", "level": 2}, {"title": "Fused Attention", "url": "https://triton-lang.org/main/getting-started/tutorials/06-fused-attention.html", "type": "code", "by": "OpenAI Triton tutorials", "level": 2, "note": "A FlashAttention-2 kernel in Triton to read and modify."}, {"title": "FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning", "url": "https://arxiv.org/abs/2307.08691", "type": "paper", "by": "Tri Dao, 2023", "level": 3}, {"title": "FlashAttention-3: Fast and Accurate Attention with Asynchrony and Low-precision", "url": "https://arxiv.org/abs/2407.08608", "type": "paper", "by": "Shah et al., 2024", "level": 3}, {"title": "flash-attention-minimal", "url": "https://github.com/tspeterkim/flash-attention-minimal", "type": "project", "by": "tspeterkim", "level": 3, "note": "Needs a CUDA GPU; the README’s benchmark reports 3.9 ms against 52.5 ms of CUDA time on a T4.", "build": "A tiled attention forward pass in about 100 lines of CUDA called from PyTorch, timed against manual attention, then pushed at the backward pass and dynamic block size it leaves open.", "teaches": "Where the running softmax and the tile loop sit in real CUDA, and how block size and float width decide whether the kernel wins at all.", "time": "a weekend"}]}, {"id": "parallel", "title": "How to Scale Your Model", "kind": "book", "track": "sys", "pre": ["gpu", "attention"], "frontier": false, "core": "Large training runs split the batch, the weights, and the activations across chips (data, tensor, pipeline, and sharded data parallelism) so each chip computes more than it communicates. A roofline count of FLOPs against bytes moved picks the layout before any code runs.", "reach": "The prerequisite for pretraining and mixture of experts; the book’s inference parts apply the same accounting to serving.", "uses": "Planning any run that spans many chips: choosing data, tensor, pipeline, and expert parallelism for a large LLM, estimating its cost before launch, and sizing inference clusters. Written around TPUs, the reasoning carries to GPUs.", "worth": "you will train or serve models on many accelerators, or interview for ML systems roles; single-GPU researchers can skim the roofline chapter.", "resources": [{"title": "How to Scale Your Model", "url": "https://jax-ml.github.io/scaling-book/", "type": "book", "by": "Austin et al., Google DeepMind, 2025", "level": 2, "note": "Parts 1 to 6 go from rooflines to training LLaMA; Part 12 maps the same ideas onto GPUs."}, {"title": "The Ultra-Scale Playbook", "url": "https://huggingface.co/spaces/nanotron/ultrascale-playbook", "type": "book", "by": "Hugging Face, 2025", "level": 2, "note": "The same strategies on GPUs in PyTorch, backed by over 4,000 scaling experiments."}, {"title": "ZeRO: Memory Optimizations Toward Training Trillion Parameter Models", "url": "https://arxiv.org/abs/1910.02054", "type": "paper", "by": "Rajbhandari et al., Microsoft, 2019", "level": 2}, {"title": "Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism", "url": "https://arxiv.org/abs/1909.08053", "type": "paper", "by": "Shoeybi et al., NVIDIA, 2019", "level": 2}, {"title": "Efficient Large-Scale Language Model Training on GPU Clusters Using Megatron-LM", "url": "https://arxiv.org/abs/2104.04473", "type": "paper", "by": "Narayanan et al., NVIDIA, 2021", "level": 3}, {"title": "CS336 Assignment 2: Systems and Parallelism", "url": "https://github.com/stanford-cs336/assignment2-systems", "type": "project", "by": "Stanford CS336, 2026", "level": 3, "build": "A profiling harness, activation checkpointing, a FlashAttention-2 kernel in Triton, distributed data parallel training, optimizer state sharding, and fully sharded data parallel training.", "teaches": "Where the time and memory of a training step go, and how each kind of parallelism trades communication for memory.", "time": "two weeks", "signature": true}]}, {"id": "serving", "title": "LLM inference and serving", "kind": "concept", "track": "sys", "pre": ["attention", "gpu"], "frontier": false, "core": "Generation has two phases: prefill processes the prompt in parallel and is compute-bound, while decode emits one token per step and is bound by reading weights and the KV cache. Servers batch many requests and page the KV cache to keep decode efficient.", "reach": "Speculative decoding, quantization, and block diffusion all attack the memory-bound decode step.", "uses": "Running chatbots and APIs at scale with engines like vLLM, SGLang, and TensorRT-LLM, setting per-token prices, sizing GPU fleets, and explaining why a long prompt delays the first token while later ones stream steadily.", "worth": "deploying models, running your own inference, or ML systems work is ahead; API users need only know why input and output tokens are priced differently.", "resources": [{"title": "Inference Engineering", "url": "https://www.baseten.co/inference-engineering/", "type": "book", "by": "Philip Kiely, Baseten, 2026", "level": 1}, {"title": "All About Transformer Inference", "url": "https://jax-ml.github.io/scaling-book/inference/", "type": "book", "by": "Austin et al., Google DeepMind, 2025", "level": 2, "note": "Part 7 of How to Scale Your Model: the prefill and decode rooflines, worked out."}, {"title": "Efficient Memory Management for Large Language Model Serving with PagedAttention", "url": "https://arxiv.org/abs/2309.06180", "type": "paper", "by": "Kwon et al., Berkeley, 2023", "level": 2}, {"title": "Taming Throughput-Latency Tradeoff in LLM Inference with Sarathi-Serve", "url": "https://arxiv.org/abs/2403.02310", "type": "paper", "by": "Agrawal et al., 2024", "level": 3}, {"title": "DistServe: Disaggregating Prefill and Decoding for Goodput-optimized Large Language Model Serving", "url": "https://arxiv.org/abs/2401.09670", "type": "paper", "by": "Zhong et al., 2024", "level": 3}, {"title": "Write a small inference engine against nano-vllm", "url": "https://github.com/GeeeekExplorer/nano-vllm", "type": "project", "by": "Built on nano-vllm", "level": 3, "build": "An offline serving loop for a small open model on one GPU: a block KV cache with prefix reuse, requests batched continuously, and CUDA graph capture for the decode step.", "teaches": "Where decode time actually goes, and how much of a serving engine’s speed is batching and cache reuse rather than faster kernels.", "time": "a week"
