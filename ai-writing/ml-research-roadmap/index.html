token.", "reach": "The KV cache these shrink is what PagedAttention pages and long context must fit; latent attention reappears in DeepSeek-V3 and Kimi Linear.", "resources": [{"title": "The Big LLM Architecture Comparison", "url": "https://magazine.sebastianraschka.com/p/the-big-llm-architecture-comparison", "type": "blog", "by": "Sebastian Raschka, 2025", "level": 1, "note": "Section 1.1 explains grouped-query attention, then latent attention, with figures."}, {"title": "Fast Transformer Decoding: One Write-Head is All You Need", "url": "https://arxiv.org/abs/1911.02150", "type": "paper", "by": "Noam Shazeer, 2019", "level": 2, "note": "Multi-query attention: all heads share one key and one value head, so each decode step reads far less memory."}, {"title": "GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints", "url": "https://arxiv.org/abs/2305.13245", "type": "paper", "by": "Ainslie et al., Google, 2023", "level": 2, "note": "A few key-value groups recover multi-head quality, and existing checkpoints convert with 5% of their pretraining compute."}, {"title": "DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model", "url": "https://arxiv.org/abs/2405.04434", "type": "paper", "by": "DeepSeek-AI, 2024", "level": 2, "note": "Section 2.1: keys and values compressed into one latent vector, a decoupled RoPE path, and a table comparing cache sizes."}, {"title": "Hardware-Efficient Attention for Fast Decoding", "url": "https://arxiv.org/abs/2505.21487", "type": "paper", "by": "Zadouri, Strauss, Dao, 2025", "level": 3, "note": "Designs attention for more compute per byte loaded: grouped-tied attention halves GQA’s cache, and grouped latent attention matches MLA while sharding more easily."}]}, {"id": "sparseattn", "title": "Sparse and sliding-window attention", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": false, "core": "Each query attends to a fixed or chosen subset of keys instead of all: a local window, strided positions, a few global tokens, or blocks picked by content. Cost falls from quadratic toward linear, while depth or global tokens carry information beyond the window.", "reach": "Sliding windows mixed with a few full layers make Gemma’s hybrids; Native Sparse Attention and DeepSeek Sparse Attention learn which keys each query reads.", "resources": [{"title": "The Transformer Family Version 2.0", "url": "https://lilianweng.github.io/posts/2023-01-27-the-transformer-family-v2/", "type": "blog", "by": "Lilian Weng, 2023", "level": 1, "note": "The Sparse Attention Patterns part of Efficient Attention: local, strided, and combined local and global patterns."}, {"title": "Mistral 7B", "url": "https://arxiv.org/abs/2310.06825", "type": "paper", "by": "Jiang et al., Mistral AI, 2023", "level": 2, "note": "Section 2: a 4096-token window whose reach grows with depth, and a rolling buffer that cuts cache memory 8x at 32K tokens."}, {"title": "Native Sparse Attention: Hardware-Aligned and Natively Trainable Sparse Attention", "url": "https://arxiv.org/abs/2502.11089", "type": "paper", "by": "Yuan et al., DeepSeek, 2025", "level": 3, "note": "Each query reads compressed blocks, a few selected blocks, and a local window, with kernels shaped for GPU tiles and sparsity trained from the start."}, {"title": "Longformer: The Long-Document Transformer", "url": "https://arxiv.org/abs/2004.05150", "type": "paper", "by": "Beltagy, Peters, Cohan, AI2, 2020", "level": 2, "note": "A sliding window for every token plus global attention on a few chosen tokens."}, {"title": "Generating Long Sequences with Sparse Transformers", "url": "https://arxiv.org/abs/1904.10509", "type": "paper", "by": "Child, Gray, Radford, Sutskever, OpenAI, 2019", "level": 2, "note": "Strided and fixed factorized patterns cut cost from n squared to n times the square root of n."}, {"title": "Big Bird: Transformers for Longer Sequences", "url": "https://arxiv.org/abs/2007.14062", "type": "paper", "by": "Zaheer et al., Google, 2020", "level": 3, "note": "Window, global and random links, with proofs that this sparse graph keeps full attention’s expressive power."}]}, {"id": "linearattn", "title": "Linear attention", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": true, "core": "Without the softmax, attention’s sum over past keys collapses into a fixed-size matrix state updated once per token: an RNN with constant memory, but lossy recall. Variants differ in the update: fixed decay (RetNet), learned gates (GLA, Mamba-2), or overwrites by the delta rule (DeltaNet).", "reach": "Mamba-2 shows selective state-space models compute the same thing; the delta rule leads to test-time training; hybrids keep a few full layers for recall.", "resources": [{"title": "Linear Attention and Beyond (Interactive Tutorial with Songlin Yang)", "url": "https://www.youtube.com/watch?v=d0HJvGSWw8A", "type": "video", "by": "Sasha Rush, Songlin Yang, 2025", "level": 1}, {"title": "Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention", "url": "https://arxiv.org/abs/2006.16236", "type": "paper", "by": "Katharopoulos et al., 2020", "level": 2, "note": "Replacing the softmax with a feature map lets the sum over keys be computed once and carried forward."}, {"title": "Gated Linear Attention Transformers with Hardware-Efficient Training", "url": "https://arxiv.org/abs/2312.06635", "type": "paper", "by": "Yang, Wang, Shen, Panda, Kim, 2023", "level": 2, "note": "Table 1 writes Mamba, Mamba-2, RWKV-6 and others as linear attention that differ only in the forget gate; the chunkwise algorithm makes training fast."}, {"title": "Gated Delta Networks: Improving Mamba2 with Delta Rule", "url": "https://arxiv.org/abs/2412.06464", "type": "paper", "by": "Yang, Kautz, Hatamizadeh, NVIDIA, 2024", "level": 3, "note": "DeltaNet’s delta rule overwrites the value stored at a key instead of adding to it, and the gate erases quickly. Qwen3-Next and Kimi Linear build on this layer."}, {"title": "Transformers are SSMs: Generalized Models and Efficient Algorithms Through Structured State Space Duality", "url": "https://arxiv.org/abs/2405.21060", "type": "paper", "by": "Dao, Gu, 2024", "level": 3, "note": "Mamba-2: a selective SSM with scalar decay and masked linear attention compute the same matrix, so either algorithm can run it."}, {"title": "Rethinking Attention with Performers", "url": "https://arxiv.org/abs/2009.14794", "type": "paper", "by": "Choromanski et al., Google, 2020", "level": 3, "note": "The other route: approximate the softmax kernel itself with positive random features instead of replacing it."}]}, {"id": "crossattn", "title": "Cross-attention and encoder-decoder models", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": false, "core": "Queries come from one sequence and keys and values from another: a decoder reads the encoder’s output, image latents read a text prompt, and a small latent array summarizes a huge input. Cost grows with the product of the two lengths, not either one squared.", "reach": "The conditioning path in latent diffusion and in Flamingo-style vision-language models; decoder-only models replace it by putting both sequences in one context.", "resources": [{"title": "The Illustrated Transformer", "url": "https://jalammar.github.io/illustrated-transformer/", "type": "blog", "by": "Jay Alammar, 2018", "level": 1, "note": "The decoder part: encoder-decoder attention takes queries from the decoder and keys and values from the encoder."}, {"title": "Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer", "url": "https://arxiv.org/abs/1910.10683", "type": "paper", "by": "Raffel et al., Google, 2019", "level": 2, "note": "Section 3.2 compares encoder-decoder, decoder-only and prefix LM models and draws each one’s attention mask."}, {"title": "Perceiver: General Perception with Iterative Attention", "url": "https://arxiv.org/abs/2103.03206", "type": "paper", "by": "Jaegle et al., DeepMind, 2021", "level": 2, "note": "A small latent array cross-attends to a huge input, so cost grows linearly with the input."}, {"title": "Prompt-to-Prompt Image Editing with Cross Attention Control", "url": "https://arxiv.org/abs/2208.01626", "type": "paper", "by": "Hertz et al., Google, 2022", "level": 3, "note": "In a text-to-image diffusion model each word’s cross-attention map lays out where it appears; editing the maps edits the image."}, {"title": "Flamingo: a Visual Language Model for Few-Shot Learning", "url": "https://arxiv.org/abs/2204.14198", "type": "paper", "by": "Alayrac et al., DeepMind, 2022", "level": 3, "note": "Gated cross-attention layers inserted into a frozen language model let text tokens read image features."}]}, {"id": "masks", "title": "Attention masks: causal, bidirectional, prefix and block", "kind": "concept", "track": "llm", "pre": ["attention"], "frontier": false, "core": "The mask decides which keys each query may see, and with the training target it defines the model: causal gives autoregressive models with a reusable KV cache, prefix adds full attention over the prompt, full gives BERT and masked diffusion, and block-causal gives block diffusion.", "reach": "Block diffusion builds on this choice; FlexAttention compiles any mask written as a small Python function into a fused kernel that skips fully masked blocks.", "resources": [{"title": "FlexAttention: The Flexibility of PyTorch with the Performance of FlashAttention", "url": "https://pytorch.org/blog/flexattention/", "type": "blog", "by": "PyTorch team, 2024", "level": 1, "note": "Causal, sliding window, prefix LM and document masks, each a few lines of Python with a picture."}, {"title": "Unified Language Model Pre-training for Natural Language Understanding and Generation", "url": "https://arxiv.org/abs/1905.03197", "type": "paper", "by": "Dong et al., Microsoft, 2019", "level": 2, "note": "Figure 1: one shared transformer trained under bidirectional, left-to-right and sequence-to-sequence masks."}, {"title": "meta-pytorch/attention-gym", "url": "https://github.com/meta-pytorch/attention-gym", "type": "code", "by": "PyTorch, 2024", "level": 2, "note": "Masks and score modifications to run, combine and visualize."}, {"title": "What Language Model Architecture and Pretraining Objective Work Best for Zero-Shot Generalization?", "url": "https://arxiv.org/abs/2204.05832", "type": "paper", "by": "Wang et al., BigScience, 2022", "level": 3, "note": "Causal decoders, prefix decoders and encoder-decoders trained at 5B parameters; the causal decoder generalizes best zero-shot after plain pretraining."}, {"title": "Flex Attention: A Programming Model for Generating Optimized Attention Kernels", "url": "https://arxiv.org/abs/2412.05496", "type": "paper", "by": "Dong et al., PyTorch, 2024", "level": 3, "note": "How a mask written as a function becomes a block-sparse kernel in the FlashAttention style."}]}, {"id": "triattn", "title": "Triangle attention and pair representations", "kind": "concept", "track": "llm", "pre": ["attention", "geometric"], "frontier": false, "core": "Keep a vector for every pair of residues and update pair (i,j) from pairs (i,k) and (j,k), the other two sides of each triangle, by multiplication or attention. Pair beliefs can become consistent, like distances obeying the triangle inequality, at cubic cost in length.", "reach": "The core of protein structure prediction: AlphaFold 2’s Evoformer and AlphaFold 3’s Pairformer; Pairmixer drops triangle attention and runs up to 4x faster.", "resources": [{"title": "AlphaFold 2 is here: what’s behind the structure prediction miracle", "url": "https://www.blopig.com/blog/2021/07/alphafold-2-is-here-whats-behind-the-structure-prediction-miracle/", "type": "blog", "by": "Carlos Outeiral, Oxford Protein Informatics Group, 2021", "level": 1, "note": "The Evoformer part: why attention arranged around triangles of residues aims at the triangle inequality."}, {"title": "Supplementary Information for: Highly accurate protein structure prediction with AlphaFold", "url": "https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-021-03819-2/MediaObjects/41586_2021_3819_MOESM1_ESM.pdf", "type": "paper", "by": "Jumper et al., DeepMind, 2021", "level": 2, "note": "Sections 1.6.5 and 1.6.6, Algorithms 11 to 14: triangle multiplicative updates and triangle self-attention, with figures."}, {"title": "Accurate structure prediction of biomolecular interactions with AlphaFold 3: Supplementary Information", "url": "https://static-content.springer.com/esm/art%3A10.1038%2Fs41586-024-07487-w/MediaObjects/41586_2024_7487_MOESM1_ESM.pdf", "type": "paper", "by": "Abramson et al., Google DeepMind, 2024", "level": 2, "note": "Section 3.6, Algorithm 17: the Pairformer keeps the triangle updates, drops the alignment rows, and lets pairs only bias attention over single tokens."}, {"title": "Triangle Multiplication Is All You Need For Biomolecular Structure Representations", "url": "https://arxiv.org/abs/2510.18870", "type": "paper", "by": "Ouyang-Zhang et al., 2025", "level": 3, "note": "Pairmixer keeps triangle multiplication, drops triangle attention, matches leading predictors, and runs up to 4x faster on long sequences."}]}, {"id": "hybridattn", "title": "Hybrid models: linear and full attention together", "kind": "concept", "track": "llm", "pre": ["linearattn", "sparseattn", "ssm"], "frontier": true, "core": "Most layers use a fixed-size memory (linear attention, a state-space layer, or a sliding window) and one layer in four to eight keeps full softmax attention. The full layers supply exact recall; the rest keep the KV cache and per-token cost nearly flat.", "reach": "The pattern behind Jamba, MiniMax-01, Gemma 3, Qwen3-Next, and Kimi Linear; MiniMax’s return to full attention in M2 shows the tradeoff is still open.", "resources": [{"title": "Beyond Standard LLMs", "url": "https://magazine.sebastianraschka.com/p/beyond-standard-llms", "type": "blog", "by": "Sebastian Raschka, 2025", "level": 1, "note": "Section 2: linear attention, Gated DeltaNet, the 3:1 hybrids in Qwen3-Next and Kimi Linear, and why MiniMax went back to full attention."}, {"title": "An Empirical Study of Mamba-based Language Models", "url": "https://arxiv.org/abs/2406.07887", "type": "paper", "by": "Waleffe et al., NVIDIA, 2024", "level": 2, "note": "Loss is lowest with about 8% attention layers; pure Mamba lags on copying and in-context learning, and the 8B hybrid beats the Transformer on all 12 standard tasks."}, {"title": "Jamba: A Hybrid Transformer-Mamba Language Model", "url": "https://arxiv.org/abs/2403.19887", "type": "paper", "by": "Lieber et al., AI21 Labs, 2024", "level": 2, "note": "One attention layer per seven Mamba layers gives an 8x smaller KV cache; Section 6 shows pure Mamba misses in-context formats the hybrid gets."}, {"title": "Gemma 3 Technical Report", "url": "https://arxiv.org/abs/2503.19786", "type": "paper", "by": "Gemma Team, Google DeepMind, 2025", "level": 2, "note": "Five sliding window layers per global layer (Section 2); the Section 5.2 ablation finds the ratio barely moves perplexity while shrinking the cache."}, {"title": "MiniMax-01: Scaling Foundation Models with Lightning Attention", "url": "https://arxiv.org/abs/2501.08313", "type": "paper", "by": "MiniMax, 2025", "level": 3, "note": "Section 2.2: pure lightning attention fails at retrieval, so a softmax block follows every seven lightning blocks in a 456B model."}, {"title": "Kimi Linear: An Expressive, Efficient Attention Architecture", "url": "https://arxiv.org/abs/2510.26692", "type": "paper", "by": "Kimi Team, Moonshot AI, 2025", "level": 3, "note": "Three Kimi Delta Attention layers per latent attention layer: up to 75% less KV cache and up to 6x faster decoding at 1M tokens."}]}, {"id": "longctx", "title": "Long context: attention sinks, ring attention and extrapolation", "kind": "concept", "track": "llm", "pre": ["posenc", "flashattn", "sparseattn", "parallel"], "frontier": true, "core": "Going past the training length breaks three things: unseen positions (rescale RoPE, as position interpolation and YaRN do), attention that dumps weight on the first tokens (keep them as sinks, as StreamingLLM does), and memory beyond one GPU (shard the sequence, as Ring Attention does).", "reach": "Hybrids and sliding windows cap the cache; RULER shows that passing needle-in-a-haystack is not the same as using the context.", "resources": [{"title": "Extending the RoPE", "url": "https://blog.eleuther.ai/yarn/", "type": "blog", "by": "Fan, Peng, Quesnelle, EleutherAI, 2023", "level": 1, "note": "Position interpolation, NTK-aware scaling and YaRN, each as a change to RoPE’s frequencies."}, {"title": "Efficient Streaming Language Models with Attention Sinks", "url": "https://arxiv.org/abs/2309.17453", "type": "paper", "by": "Xiao et al., MIT, 2023", "level": 2, "note": "Keeping a few initial tokens beside a sliding window keeps models stable for 4 million tokens."}, {"title": "RULER: What’s the Real Context Size of Your Long-Context Language Models?", "url": "https://arxiv.org/abs/2404.06654", "type": "paper", "by": "Hsieh et al., NVIDIA, 2024", "level": 2, "note": "Thirteen tasks beyond a single needle, including multi-hop tracing and aggregation; half the models tested fall short at 32K tokens."}, {"title": "Ring Attention with Blockwise Transformers for Near-Infinite Context", "url": "https://arxiv.org/abs/2310.01889", "type": "paper", "by": "Liu, Zaharia, Abbeel, Berkeley, 2023", "level": 3, "note": "Each device keeps a block of the sequence and passes key-value blocks around a ring, hiding the transfer behind compute."}, {"title": "Extending Context Window of Large Language Models via Positional Interpolation", "url": "https://arxiv.org/abs/2306.15595", "type": "paper", "by": "Chen, Wong, Chen, Tian, Meta, 2023", "level": 3, "note": "Interpolated positions keep attention scores bounded where extrapolated ones blow up; 1000 fine-tuning steps reach 32K."}, {"title": "Gated Attention for Large Language Models: Non-linearity, Sparsity, and Attention-Sink-Free", "url": "https://arxiv.org/abs/2505.06708", "type": "paper", "by": "Qiu et al., Qwen, 2025", "level": 3, "note": "A sigmoid gate after attention removes the sink and improves context extension."}]}, {"id": "gpu", "title": "GPU programming", "kind": "concept", "track": "sys", "pre": ["linalg"], "frontier": false, "core": "A GPU runs thousands of threads in lockstep groups of 32, and most kernels are limited by moving bytes from memory rather than by arithmetic. Fast kernels tile the work so each block loads data into fast on-chip memory once and reuses it many times.", "reach": "The mental model behind FlashAttention, quantized kernels, and every roofline estimate in How to Scale Your Model.", "resources": [{"title": "Making Deep Learning Go Brrrr From First Principles", "url": "https://horace.io/brrr_intro.html", "type": "blog", "by": "Horace He, 2022", "level": 1, "note": "Compute, memory bandwidth, and overhead: which one bounds your model."}, {"title": "GPU Puzzles", "url": "https://github.com/srush/GPU-Puzzles", "type": "code", "by": "Sasha Rush, 2022", "level": 1}, {"title": "How to Optimize a CUDA Matmul Kernel for cuBLAS-like Performance: a Worklog", "url": "https://siboehm.com/articles/22/CUDA-MMM", "type": "blog", "by": "Simon Boehm, 2022", "level": 2}, {"title": "Triton tutorials", "url": "https://triton-lang.org/main/getting-started/tutorials/index.html", "type": "tutorial", "by": "OpenAI Triton", "level": 2}, {"title": "Programming Massively Parallel Processors", "url": "https://shop.elsevier.com/books/programming-massively-parallel-processors/hwu/978-0-323-91231-0", "type": "book", "by": "Wen-mei Hwu, David Kirk, Izzat El Hajj, 4th edition, 2022", "level": 2, "note": "The CUDA textbook. The GPU MODE lecture repository lists it as the companion text.", "paid": true}, {"title": "GPU MODE lectures", "url": "https://github.com/gpu-mode/lectures", "type": "lectures", "by": "GPU MODE reading group, 2024 onward", "level": 3, "note": "Slides, notebooks, and code for each recorded lecture; the videos are on the GPU MODE YouTube channel."}]}, {"id": "flashattn", "title": "FlashAttention", "kind": "paper", "track": "sys", "pre": ["gpu", "attention"], "frontier": false, "core": "Standard attention writes the full N by N score matrix to slow GPU memory and reads it back. FlashAttention computes the identical result tile by tile in fast on-chip memory, using a running softmax so that matrix is never stored.", "reach": "The model for IO-aware kernels across training and serving; FlashAttention-2 and -3 retune it for newer GPUs.", "resources": [{"title": "From Online Softmax to FlashAttention", "url": "https://courses.cs.washington.edu/courses/cse599m/23sp/notes/flashattn.pdf", "type": "notes", "by": "Zihao Ye, UW CSE 599M, 2023", "level": 1, "note": "The running softmax derivation in a few pages."}, {"title": "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness", "url": "https://arxiv.org/abs/2205.14135", "type": "paper", "by": "Dao, Fu, Ermon, Rudra, Ré, 2022", "level": 2}, {"title": "Fused Attention", "url": "https://triton-lang.org/main/getting-started/tutorials/06-fused-attention.html", "type": "code", "by": "OpenAI Triton tutorials", "level": 2, "note": "A FlashAttention-2 kernel in Triton to read and modify."}, {"title": "FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning", "url": "https://arxiv.org/abs/2307.08691", "type": "paper", "by": "Tri Dao, 2023", "level": 3}, {"title": "FlashAttention-3: Fast and Accurate Attention with Asynchrony and Low-precision", "url": "https://arxiv.org/abs/2407.08608", "type": "paper", "by": "Shah et al., 2024", "level": 3}]}, {"id": "parallel", "title": "How to Scale Your Model", "kind": "book", "track": "sys", "pre": ["gpu", "attention"], "frontier": false, "core": "Large training runs split the batch, the weights, and the activations across chips (data, tensor, pipeline, and sharded data parallelism) so each chip computes more than it communicates. A roofline count of FLOPs against bytes moved picks the layout before any code runs.", "reach": "The prerequisite for pretraining and mixture of experts; the book’s inference parts apply the same accounting to serving.", "resources": [{"title": "How to Scale Your Model", "url": "https://jax-ml.github.io/scaling-book/", "type": "book", "by": "Austin et al., Google DeepMind, 2025", "level": 2, "note": "Parts 1 to 6 go from rooflines to training LLaMA; Part 12 maps the same ideas onto GPUs."}, {"title": "The Ultra-Scale Playbook", "url": "https://huggingface.co/spaces/nanotron/ultrascale-playbook", "type": "book", "by": "Hugging Face, 2025", "level": 2, "note": "The same strategies on GPUs in PyTorch, backed by over 4,000 scaling experiments."}, {"title": "ZeRO: Memory Optimizations Toward Training Trillion Parameter Models", "url": "https://arxiv.org/abs/1910.02054", "type": "paper", "by": "Rajbhandari et al., Microsoft, 2019", "level": 2}, {"title": "Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism", "url": "https://arxiv.org/abs/1909.08053", "type": "paper", "by": "Shoeybi et al., NVIDIA, 2019", "level": 2}, {"title": "Efficient Large-Scale Language Model Training on GPU Clusters Using Megatron-LM", "url": "https://arxiv.org/abs/2104.04473", "type": "paper", "by": "Narayanan et al., NVIDIA, 2021", "level": 3}]}, {"id": "serving", "title": "LLM inference and serving", "kind": "concept", "track": "sys", "pre": ["attention", "gpu"], "frontier": false, "core": "Generation has two phases: prefill processes the prompt in parallel and is compute-bound, while decode emits one token per step and is bound by reading weights and the KV cache. Servers batch many requests and page the KV cache to keep decode efficient.", "reach": "Speculative decoding, quantization, and block diffusion all attack the memory-bound decode step.", "resources": [{"title": "Inference Engineering", "url": "https://www.baseten.co/inference-engineering/", "type": "book", "by": "Philip Kiely, Baseten, 2026", "level": 1}, {"title": "All About Transformer Inference", "url": "https://jax-ml.github.io/scaling-book/inference/", "type": "book", "by": "Austin et al., Google DeepMind, 2025", "level": 2, "note": "Part 7 of How to Scale Your Model: the prefill and decode rooflines, worked out."}, {"title": "Efficient Memory Management for Large Language Model Serving with PagedAttention", "url": "https://arxiv.org/abs/2309.06180", "type": "paper", "by": "Kwon et al., Berkeley, 2023", "level": 2}, {"title": "Taming Throughput-Latency Tradeoff in LLM Inference with Sarathi-Serve", "url": "https://arxiv.org/abs/2403.02310", "type": "paper", "by": "Agrawal et al., 2024", "level": 3}, {"title": "DistServe: Disaggregating Prefill and Decoding for Goodput-optimized Large Language Model Serving", "url": "https://arxiv.org/abs/2401.09670", "type": "paper", "by": "Zhong et al., 2024", "level": 3}]}, {"id": "pagedattn", "title": "PagedAttention", "kind": "paper", "track": "sys", "pre": ["serving", "kvattn"], "frontier": false, "core": "Store each request’s KV cache in fixed-size blocks, with a block table mapping logical to physical blocks, like virtual memory pages. Waste falls from most of the cache to under 4%, and requests can share blocks, but the attention kernel must follow the table.", "reach": "Copy-on-write sharing makes parallel sampling and beam search cheap; RadixAttention in SGLang extends sharing to common prefixes across requests.", "resources": [{"title": "vLLM: Easy, Fast, and Cheap LLM Serving with PagedAttention", "url": "https://vllm.ai/blog/2023-06-20-vllm", "type": "blog", "by": "Kwon, Li et al., Berkeley, 2023", "level": 1, "note": "Animations of blocks being allocated and shared during generation."}, {"title": "Efficient Memory Management for Large Language Model Serving with PagedAttention", "url": "https://arxiv.org/abs/2309.06180", "type": "paper", "by": "Kwon et al., Berkeley, 2023", "level": 2, "note": "Section 3 measures how much memory earlier servers waste; Section 4 builds the block table, sharing and copy-on-write."}, {"title": "Paging: Introduction", "url": "https://pages.cs.wisc.edu/~remzi/OSTEP/vm-paging.pdf", "type": "book", "by": "Remzi and Andrea Arpaci-Dusseau, Operating Systems: Three Easy Pieces", "level": 1, "note": "Chapter 18, the operating system idea being borrowed: fixed-size pages and a page table."}, {"title": "Fast and Expressive LLM Inference with RadixAttention and SGLang", "url": "https://lmsys.org/blog/2024-01-17-sglang/", "type": "blog", "by": "Zheng et al., LMSYS, 2024", "level": 2, "note": "RadixAttention keeps finished requests’ cache in a radix tree over tokens, so a later prompt sharing a prefix reuses it."}, {"title": "GeeeekExplorer/nano-vllm", "url": "https://github.com/GeeeekExplorer/nano-vllm", "type": "code", "by": "GeeeekExplorer, 2025", "level": 3, "note": "About 1,200 lines of Python; nanovllm/engine/block_manager.py holds the blocks, reference counts and prefix cache."}, {"title": "vAttention: Dynamic Memory Management for Serving LLMs without PagedAttention", "url": "https://arxiv.org/abs/2405.04437", "type": "paper", "by": "Prabhu et al., Microsoft Research, 2024", "level": 3, "note": "The counterpoint: keep the cache contiguous in virtual memory and let CUDA’s virtual memory API page it, so unmodified kernels work."}]}, {"id": "specdec", "title": "Speculative decoding", "kind": "concept", "track": "sys", "pre": ["serving"], "frontier": false, "core": "A small draft model guesses several tokens cheaply, and the large model checks them all in one forward pass, keeping the longest accepted run. A rejection-sampling rule makes the output distribution exactly the large model’s, so the speedup costs no quality.", "reach": "Draft heads such as Medusa and EAGLE are the common variants; the gain depends on how memory-bound decoding is.", "resources": [{"title": "Looking back at speculative decoding", "url": "https://research.google/blog/looking-back-at-speculative-decoding/", "type": "blog", "by": "Leviathan, Kalman, et al., Google Research, 2024", "level": 1}, {"title": "Fast Inference from Transformers via Speculative Decoding", "url": "https://arxiv.org/abs/2211.17192", "type": "paper", "by": "Leviathan, Kalman, Matias, 2023", "level": 2}, {"title": "Medusa: Simple LLM Inference Acceleration Framework with Multiple Decoding Heads", "url": "https://arxiv.org/abs/2401.10774", "type": "paper", "by": "Cai et al., 2024", "level": 2}, {"title": "EAGLE: Speculative Sampling Requires Rethinking Feature Uncertainty", "url": "https://arxiv.org/abs/2401.15077", "type": "paper", "by": "Li, Wei, Zhang, Zhang, 2024", "level": 3}]}, {"id": "quant", "title": "Quantization and distillation", "kind": "concept", "track": "sys", "pre": ["serving", "training"], "frontier": false, "core": "Store weights, and sometimes activations, in 8 or 4 bits instead of 16, cutting the memory traffic that bounds decoding; the hard part is the few outlier values. Distillation instead trains a smaller student to match a larger teacher’s output distribution.", "reach": "Pairs with serving and speculative decoding; QLoRA fine-tunes a 4-bit base model.", "resources": [{"title": "A Visual Guide to Quantization", "url": "https://newsletter.maartengrootendorst.com/p/a-visual-guide-to-quantization", "type": "blog", "by": "Maarten Grootendorst, 2024", "level": 1}, {"title": "Distilling the Knowledge in a Neural Network", "url": "https://arxiv.org/abs/1503.02531", "type": "paper", "by": "Hinton, Vinyals, Dean, 2015", "level": 2}, {"title": "LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale", "url": "https://arxiv.org/abs/2208.07339", "type": "paper", "by": "Dettmers et al., 2022", "level": 2}, {"title": "GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers", "url": "https://arxiv.org/abs/2210.17323", "type": "paper", "by": "Frantar et al., 2022", "level": 2}, {"title": "MIT 6.5940: TinyML and Efficient Deep Learning Computing", "url": "https://efficientml.ai/", "type": "course", "by": "Song Han, MIT", "level": 3}]}, {"id": "vae", "title": "Variational autoencoders and the ELBO", "kind": "concept", "track": "gen", "pre": ["backprop", "info"], "frontier": false, "core": "Assume each data point is decoded from a hidden code. The exact likelihood needs an intractable integral over codes, so train an encoder to guess the code and maximize the ELBO: reconstruction accuracy minus the KL divergence from the encoder’s guess to the prior.", "reach": "The ELBO is the objective DDPM rewrites, and the VAE is the autoencoder that latent diffusion and world models compress into.", "resources": [{"title": "Variational Autoencoders (CS236 notes)", "url": "https://deepgenerativemodels.github.io/notes/vae/", "type": "notes", "by": "Stanford CS236, Ermon group", "level": 1}, {"title": "Auto-Encoding Variational Bayes", "url": "https://arxiv.org/abs/1312.6114", "type": "paper", "by": "Kingma, Welling, 2013", "level": 2, "note": "Section 2.4 is the reparameterization trick."}, {"title": "Tutorial on Diffusion Models for Imaging and Vision", "url": "https://arxiv.org/abs/2403.18103", "type": "tutorial", "by": "Stanley Chan, 2024", "level": 2, "note": "Section 1 derives the VAE in the notation its DDPM section reuses."}, {"title": "An Introduction to Variational Autoencoders", "url": "https://arxiv.org/abs/1906.02691", "type": "book", "by": "Kingma, Welling, 2019", "level": 3}]}, {"id": "nf", "title": "Normalizing flows", "kind": "concept", "track": "gen", "pre": ["backprop", "calculus"], "frontier": false, "core": "Push a Gaussian through a chain of invertible maps whose Jacobian determinants are cheap to compute. The change of variables formula then gives the exact log-likelihood of every data point, so the model trains by maximum likelihood and samples by running the maps forward.", "reach": "Continuous normalizing flows replace the chain with an ODE, which leads to flow matching; Boltzmann generators use the exact likelihoods to reweight samples.", "resources": [{"title": "Flow-based Deep Generative Models", "url": "https://lilianweng.github.io/posts/2018-10-13-flow-models/", "type": "blog", "by": "Lilian Weng, 2018", "level": 1}, {"title": "Normalizing Flows for Probabilistic Modeling and Inference", "url": "https://arxiv.org/abs/1912.02762", "type": "paper", "by": "Papamakarios, Nalisnick, Rezende, Mohamed, Lakshminarayanan, 2019", "level": 2}, {"title": "Density estimation using Real NVP", "url": "https://arxiv.org/abs/1605.08803", "type": "paper", "by": "Dinh, Sohl-Dickstein, Bengio, 2016", "level": 2}, {"title": "Normalizing Flows are Capable Generative Models", "url": "https://arxiv.org/abs/2412.06329", "type": "paper", "by": "Zhai et al., Apple, 2024", "level": 3}]}, {"id": "gan", "title": "Generative adversarial networks", "kind": "concept", "track": "gen", "pre": ["backprop"], "frontier": false, "core": "A generator turns noise into samples while a discriminator learns to tell them from real data, and each trains against the other. At equilibrium the generator matches the data distribution with no likelihood computed, but training can oscillate or collapse onto a few modes.", "reach": "Adversarial losses return as the finishing term of one-step distillation and as the discriminator in adversarial imitation.", "resources": [{"title": "From GAN to WGAN", "url": "https://lilianweng.github.io/posts/2017-08-20-gan/", "type": "blog", "by": "Lilian Weng, 2017", "level": 1}, {"title": "Generative Adversarial Networks", "url": "https://arxiv.org/abs/1406.2661", "type": "paper", "by": "Goodfellow et al., 2014", "level": 2}, {"title": "Wasserstein GAN", "url": "https://arxiv.org/abs/1701.07875", "type": "paper", "by": "Arjovsky, Chintala, Bottou, 2017", "level": 2}, {"title": "The GAN is dead; long live the GAN! A Modern GAN Baseline", "url": "https://arxiv.org/abs/2501.05441", "type": "paper", "by": "Huang, Gokaslan, Kuleshov, Tompkin, 2025", "level": 3}]}, {"id": "ebm", "title": "Energy-based models and score matching", "kind": "concept", "track": "gen", "pre": ["montecarlo", "backprop"], "frontier": false, "core": "Define a density up to a constant, p(x) proportional to exp(-E(x)). The normalizing constant is intractable, but the score, the gradient of log p, does not depend on it, so one can fit the score directly by score matching and sample with Langevin dynamics.", "reach": "Denoising score matching across many noise levels is the score view of DDPM and the starting point of score SDEs.", "resources": [{"title": "Generative Modeling by Estimating Gradients of the Data Distribution", "url": "https://yang-song.net/blog/2021/score/", "type": "blog", "by": "Yang Song, 2021", "level": 1}, {"title": "How to Train Your Energy-Based Models", "url": "https://arxiv.org/abs/2101.03288", "type": "tutorial", "by": "Song, Kingma, 2021", "level": 2}, {"title": "Generative Modeling by Estimating Gradients of the Data Distribution", "url": "https://arxiv.org/abs/1907.05600", "type": "paper", "by": "Song, Ermon, 2019", "level": 2, "note": "Score networks at many noise levels, sampled with annealed Langevin dynamics."}, {"title": "A Connection Between Score Matching and Denoising Autoencoders", "url": "https://doi.org/10.1162/NECO_a_00142", "type": "paper", "by": "Pascal Vincent, Neural Computation 2011", "level": 3, "note": "The proof that denoising is score matching.", "paid": true}, {"title": "Estimation of Non-Normalized Statistical Models by Score Matching", "url": "https://jmlr.org/papers/v6/hyvarinen05a.html", "type": "paper", "by": "Aapo Hyvärinen, JMLR 2005", "level": 3}]}, {"id": "ddpm", "title": "Denoising Diffusion Probabilistic Models", "kind": "paper", "track": "gen", "pre": ["vae", "ebm"], "frontier": false, "core": "Corrupt data with small Gaussian noise over many steps until it is pure noise, and train a network to predict the noise added at a random step. Running the learned denoising steps backward from fresh noise generates data, and the loss is a reweighted ELBO.", "reach": "The training loss and sampler that score SDEs, guidance, latent diffusion, flow matching, and reward fine-tuning all build on.", "resources": [{"title": "But how do AI images and videos actually work? | Guest video by Welch Labs", "url": "https://www.youtube.com/watch?v=iv-5mZ_9CPY", "type": "video", "by": "Welch Labs on 3Blue1Brown, 2025", "level": 1}, {"title": "What are Diffusion Models?", "url": "https://lilianweng.github.io/posts/2021-07-11-diffusion-models/", "type": "blog", "by": "Lilian Weng, 2021, updated", "level": 1}, {"title": "Denoising Diffusion Probabilistic Models", "url": "https://arxiv.org/abs/2006.11239", "type": "paper", "by": "Ho, Jain, Abbeel, 2020", "level": 2, "note": "Sections 2 and 3 hold the whole method."}, {"title": "Tutorial on Diffusion Models for Imaging and Vision", "url": "https://arxiv.org/abs/2403.18103", "type": "tutorial", "by": "Stanley Chan, 2024", "level": 2, "note": "Section 2 derives DDPM step by step from the VAE of Section 1."}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapter 2, the variational view from VAEs to DDPM."}, {"title": "Deep Unsupervised Learning using Nonequilibrium Thermodynamics", "url": "https://arxiv.org/abs/1503.03585", "type": "paper", "by": "Sohl-Dickstein, Weiss, Maheswaranathan, Ganguli, 2015", "level": 3}]}, {"id": "scoresde", "title": "Score-based modeling with SDEs", "kind": "paper", "track": "gen", "pre": ["ddpm", "sdes", "fokker"], "frontier": false, "core": "Let a stochastic differential equation diffuse data into noise in continuous time. Its reverse-time SDE needs only the score of each noisy marginal, which a network learns by denoising, and a deterministic probability flow ODE has the same marginals and gives exact likelihoods.", "reach": "Unifies DDPM and score networks; its probability flow ODE is what fast samplers, EDM, consistency models, and flow maps integrate.", "resources": [{"title": "MIT 6.S184: Introduction to Flow Matching and Diffusion Models", "url": "https://diffusion.csail.mit.edu/2026/", "type": "course", "by": "Holderrieth, Erives, MIT, 2026", "level": 1, "note": "Lectures 1 and 3-A, with the course notes and Lab 1."}, {"title": "Score-Based Generative Modeling through Stochastic Differential Equations", "url": "https://arxiv.org/abs/2011.13456", "type": "paper", "by": "Song, Sohl-Dickstein, Kingma, Kumar, Ermon, Poole, 2021", "level": 2}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapter 4 on the score SDE framework, and Appendix C on Itô calculus and Girsanov."}, {"title": "Reverse-time diffusion equation models", "url": "https://doi.org/10.1016/0304-4149(82)90051-5", "type": "paper", "by": "Brian Anderson, 1982", "level": 3, "note": "The original derivation of the reverse SDE."}]}, {"id": "samplers", "title": "Fast samplers: DDIM and ODE solvers", "kind": "concept", "track": "gen", "pre": ["scoresde"], "frontier": false, "core": "Sampling a diffusion model is numerically integrating its reverse SDE or probability flow ODE, so fewer steps calls for a better integrator. DDIM steps deterministically along the ODE, and DPM-Solver integrates its linear part exactly, giving good samples in 10 to 20 network calls.", "reach": "EDM’s Heun sampler and distillation into consistency models both start from treating sampling as ODE integration.", "resources": [{"title": "Denoising Diffusion Implicit Models", "url": "https://arxiv.org/abs/2010.02502", "type": "paper", "by": "Song, Meng, Ermon, 2020", "level": 2}, {"title": "DPM-Solver: A Fast ODE Solver for Diffusion Probabilistic Model Sampling in Around 10 Steps", "url": "https://arxiv.org/abs/2206.00927", "type": "paper", "by": "Lu, Zhou, Bao, Chen, Li, Zhu, 2022", "level": 2}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapter 9 covers DDIM, DEIS, DPM-Solver, and DPM-Solver++ in one notation."}, {"title": "DPM-Solver++: Fast Solver for Guided Sampling of Diffusion Probabilistic Models", "url": "https://arxiv.org/abs/2211.01095", "type": "paper", "by": "Lu, Zhou, Bao, Chen, Li, Zhu, 2022", "level": 3}]}, {"id": "guidance", "title": "Classifier and classifier-free guidance", "kind": "concept", "track": "gen", "pre": ["ddpm"], "frontier": false, "core": "To sample from p(x | y), add the gradient of log p(y | x_t) to the score. Classifier guidance takes it from a classifier trained on noisy data; classifier-free guidance trains one model with and without the condition and extrapolates past its conditional prediction.", "reach": "Guidance trades diversity for fidelity; steering and reward fine-tuning ask which distribution it actually samples.", "resources": [{"title": "Guidance: a cheat code for diffusion models", "url": "https://sander.ai/2022/05/26/guidance.html", "type": "blog", "by": "Sander Dieleman, 2022", "level": 1}, {"title": "Classifier-Free Diffusion Guidance", "url": "https://arxiv.org/abs/2207.12598", "type": "paper", "by": "Ho, Salimans, 2022", "level": 2}, {"title": "Diffusion Models Beat GANs on Image Synthesis", "url": "https://arxiv.org/abs/2105.05233", "type": "paper", "by": "Dhariwal, Nichol, 2021", "level": 2, "note": "Read it for classifier guidance."}, {"title": "Classifier-Free Guidance is a Predictor-Corrector", "url": "https://arxiv.org/abs/2408.09000", "type": "paper", "by": "Bradley, Nakkiran, 2024", "level": 3, "note": "CFG does not sample the sharpened distribution it is usually said to."}, {"title": "Guiding a Diffusion Model with a Bad Version of Itself", "url": "https://arxiv.org/abs/2406.02507", "type": "paper", "by": "Karras et al., NVIDIA, 2024", "level": 3}]}, {"id": "latent", "title": "Latent diffusion and diffusion transformers", "kind": "concept", "track": "gen", "pre": ["ddpm", "vae", "crossattn"], "frontier": false, "core": "Run diffusion in the latent space of a pretrained autoencoder rather than on pixels, which cuts the cost of training and sampling many times over, and make the denoiser a transformer over latent patches that scales like a language model.", "reach": "Stable Diffusion 3, FLUX, and most video and world models are built this way.", "resources": [{"title": "Generative modelling in latent space", "url": "https://sander.ai/2025/04/15/latents.html", "type": "blog", "by": "Sander Dieleman, 2025", "level": 1}, {"title": "High-Resolution Image Synthesis with Latent Diffusion Models", "url": "https://arxiv.org/abs/2112.10752", "type": "paper", "by": "Rombach, Blattmann, Lorenz, Esser, Ommer, 2022", "level": 2}, {"title": "Scalable Diffusion Models with Transformers", "url": "https://arxiv.org/abs/2212.09748", "type": "paper", "by": "Peebles, Xie, 2023", "level": 2}, {"title": "Scaling Rectified Flow Transformers for High-Resolution Image Synthesis", "url": "https://arxiv.org/abs/2403.03206", "type": "paper", "by": "Esser et al., Stability AI, 2024", "level": 3, "note": "The MMDiT architecture and timestep sampling behind SD3."}, {"title": "Diffusion Transformers with Representation Autoencoders", "url": "https://arxiv.org/abs/2510.11690", "type": "paper", "by": "Zheng, Ma, Tong, Xie, 2025", "level": 3}]}, {"id": "edm", "title": "EDM: the diffusion design space", "kind": "paper", "track": "gen", "pre": ["scoresde", "samplers"], "frontier": false, "core": "Diffusion models differ in a few independent choices: the noise schedule, how the network’s input and output are scaled at each noise level, the loss weight per noise level, and the solver. Choosing each on its own merits gives better samples in far fewer steps.", "reach": "The parameterization most consistency and flow map papers start from, and the framework AlphaFold 3’s diffusion module builds on.", "resources": [{"title": "Elucidating the Design Space of Diffusion-Based Generative Models", "url": "https://arxiv.org/abs/2206.00364", "type": "paper", "by": "Karras, Aittala, Aila, Laine, 2022", "level": 2, "note": "Table 1 puts each model family’s design choices side by side."}, {"title": "Noise schedules considered harmful", "url": "https://sander.ai/2024/06/14/noise-schedules.html", "type": "blog", "by": "Sander Dieleman, 2024", "level": 2}, {"title": "NVlabs/edm", "url": "https://github.com/NVlabs/edm", "type": "code", "by": "NVIDIA, 2022", "level": 2}, {"title": "Analyzing and Improving the Training Dynamics of Diffusion Models", "url": "https://arxiv.org/abs/2312.02696", "type": "paper", "by": "Karras et al., NVIDIA, 2024", "level": 3}]}, {"id": "cnf", "title": "Neural ODEs and continuous normalizing flows", "kind": "concept", "track": "gen", "pre": ["nf", "odes"], "frontier": false, "core": "Let a neural network define a velocity field and carry noise to data by integrating its ODE. Along each path the log-density changes by minus the divergence of the velocity, so likelihoods are exact without invertible layers, but maximum likelihood training must simulate the ODE.", "reach": "Flow matching removes the simulation from training; the same continuity equation underlies its marginal velocity field.", "resources": [{"title": "Neural Ordinary Differential Equations", "url": "https://arxiv.org/abs/1806.07366", "type": "paper", "by": "Chen, Rubanova, Bettencourt, Duvenaud, 2018", "level": 2}, {"title": "FFJORD: Free-form Continuous Dynamics for Scalable Reversible Generative Models", "url": "https://arxiv.org/abs/1810.01367", "type": "paper", "by": "Grathwohl, Chen, Bettencourt, Sutskever, Duvenaud, 2018", "level": 2}, {"title": "Flow Matching Guide and Code", "url": "https://arxiv.org/abs/2412.06264", "type": "book", "by": "Lipman et al., Meta, 2024", "level": 2, "note": "Section 3 covers flows, the continuity equation, and the instantaneous change of variables."}, {"title": "rtqichen/torchdiffeq", "url": "https://github.com/rtqichen/torchdiffeq", "type": "code", "by": "Ricky Chen", "level": 2}, {"title": "On Neural Differential Equations", "url": "https://arxiv.org/abs/2202.02435", "type": "book", "by": "Patrick Kidger, 2022", "level": 3}]}, {"id": "fm", "title": "Flow matching", "kind": "paper", "track": "gen", "pre": ["cnf", "ddpm", "fokker"], "frontier": false, "core": "Train a continuous flow without simulating it. Choose a simple path from each noise sample to each data sample, such as a straight line, and regress a network onto that path’s velocity; the regression target averages to the velocity field that carries noise to data.", "reach": "With Gaussian paths it equals diffusion up to schedule and weighting. Rectified flow, interpolants, flow maps, discrete flow matching, and VLA action heads extend it.", "resources": [{"title": "MIT 6.S184: Introduction to Flow Matching and Diffusion Models", "url": "https://diffusion.csail.mit.edu/2026/", "type": "course", "by": "Holderrieth, Erives, MIT, 2026", "level": 1, "note": "Lectures 1 and 2, the course notes, and Lab 2."}, {"title": "Flow Matching for Generative Modeling", "url": "https://arxiv.org/abs/2210.02747", "type": "paper", "by": "Lipman, Chen, Ben-Hamu, Nickel, Le, 2022", "level": 2}, {"title": "Diffusion Meets Flow Matching: Two Sides of the Same Coin", "url": "https://diffusionflow.github.io/", "type": "blog", "by": "Gao, Hoogeboom, Heek, De Bortoli, Murphy, Salimans, 2024", "level": 2}, {"title": "Flow Matching Guide and Code", "url": "https://arxiv.org/abs/2412.06264", "type": "book", "by": "Lipman et al., Meta, 2024", "level": 2, "note": "Sections 2 to 4, then Section 10 on the relation to diffusion."}, {"title": "facebookresearch/flow_matching", "url": "https://github.com/facebookresearch/flow_matching", "type": "code", "by": "Meta, 2024", "level": 2}]}, {"id": "rectified", "title": "Rectified flow", "kind": "paper", "track": "gen", "pre": ["fm", "ot"], "frontier": false, "core": "Learn an ODE that moves noise to data along straight lines between randomly paired samples, then reflow: pair each noise sample with where the ODE sends it and train again. Each reflow straightens paths without raising transport cost, so a few Euler steps suffice.", "reach": "The straight-path loss SD3, FLUX, and Wan train with, and the first few-step method that later flow maps generalize.", "resources": [{"title": "Flow Straight and Fast: Learning to Generate and Transfer Data with Rectified Flow", "url": "https://arxiv.org/abs/2209.03003", "type": "paper", "by": "Liu, Gong, Liu, 2022", "level": 2}, {"title": "Rectified Flow: A Marginal Preserving Approach to Optimal Transport", "url": "https://arxiv.org/abs/2209.14577", "type": "paper", "by": "Qiang Liu, 2022", "level": 3}, {"title": "InstaFlow: One Step is Enough for High-Quality Diffusion-Based Text-to-Image Generation", "url": "https://arxiv.org/abs/2309.06380", "type": "paper", "by": "Liu, Zhang, Ma, Peng, Liu, 2023", "level": 3}, {"title": "Scaling Rectified Flow Transformers for High-Resolution Image Synthesis", "url": "https://arxiv.org/abs/2403.03206", "type": "paper", "by": "Esser et al., Stability AI, 2024", "level": 3, "note": "Compares 61 formulations; rectified flow with modified timestep sampling comes out ahead."}]}, {"id": "interpolants", "title": "Stochastic interpolants", "kind": "paper", "track": "gen", "pre": ["fm", "scoresde"], "frontier": false, "core": "Connect two distributions by x_t = α(t) x_0 + β(t) x_1 + γ(t) z. Regressing on the interpolant’s time derivative gives a velocity and regressing on z gives the score, so one model yields ODE and SDE samplers, with the noise level picked after training.", "reach": "Places diffusion, flow matching, and rectified flow in one framework, and is the base for flow maps and bridge matching.", "resources": [{"title": "Building Normalizing Flows with Stochastic Interpolants", "url": "https://arxiv.org/abs/2209.15571", "type": "paper", "by": "Albergo, Vanden-Eijnden, 2022", "level": 2, "note": "The shorter, deterministic version."}, {"title": "Stochastic Interpolants: A Unifying Framework for Flows and Diffusions", "url": "https://arxiv.org/abs/2303.08797", "type": "paper", "by": "Albergo, Boffi, Vanden-Eijnden, 2023, JMLR 2025", "level": 2, "note": "Section 2 is the framework; Section 5 connects it to score-based diffusion and rectified flow."}, {"title": "SiT: Exploring Flow and Diffusion-based Generative Models with Scalable Interpolant Transformers", "url": "https://arxiv.org/abs/2401.08740", "type": "paper", "by": "Ma, Goldstein, Albergo, Boffi, Vanden-Eijnden, Xie, 2024", "level": 3}, {"title": "Stochastic interpolants with data-dependent couplings", "url": "https://arxiv.org/abs/2310.03725", "type": "paper", "by": "Albergo, Goldstein, Boffi, Ranganath, Vanden-Eijnden, 2023", "level": 3}]}, {"id": "consistency", "title": "Consistency models and distillation", "kind": "concept", "track": "gen", "pre": ["samplers", "edm"], "frontier": false, "core": "Train a network to map any point on a probability flow ODE trajectory to that trajectory’s clean endpoint, by making its outputs at nearby points of one trajectory agree. It then samples in one step, or in a few by alternating denoising with re-noising.", "reach": "Generalizes to flow maps, which learn jumps between any two times rather than only to the endpoint.", "resources": [{"title": "The paradox of diffusion distillation", "url": "https://sander.ai/2024/02/28/paradox.html", "type": "blog", "by": "Sander Dieleman, 2024", "level": 1}, {"title": "Consistency Models", "url": "https://arxiv.org/abs/2303.01469", "type": "paper", "by": "Song, Dhariwal, Chen, Sutskever, 2023", "level": 2}, {"title": "Progressive Distillation for Fast Sampling of Diffusion Models", "url": "https://arxiv.org/abs/2202.00512", "type": "paper", "by": "Salimans, Ho, 2022", "level": 2}, {"title": "Simplifying, Stabilizing and Scaling Continuous-Time Consistency Models", "url": "https://arxiv.org/abs/2410.11081", "type": "paper", "by": "Lu, Song, 2024", "level": 3}, {"title": "Improved Distribution Matching Distillation for Fast Image Synthesis", "url": "https://arxiv.org/abs/2405.14867", "type": "paper", "by": "Yin et al., 2024", "level": 3, "note": "The distribution matching alternative, with a GAN term."}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapters 10 and 11, distillation and consistency models in one notation."}]}, {"id": "flowmaps", "title": "Flow maps and few-step generation", "kind": "concept", "track": "gen", "pre": ["consistency", "interpolants"], "frontier": true, "core": "A flow map X(s,t) jumps from time s to time t along the probability flow in one network call. Its small-step limit gives the velocity, its jump to the data end is a consistency model, and it trains from scratch by requiring jumps to compose.", "reach": "MeanFlow, shortcut models, and Align Your Flow are flow maps, the current route to one-step and few-step image, video, and action generation.", "resources": [{"title": "Learning the integral of a diffusion model", "url": "https://sander.ai/2026/05/06/flow-maps.html", "type": "blog", "by": "Sander Dieleman, 2026", "level": 1}, {"title": "Flow map matching with stochastic interpolants: A mathematical framework for consistency models", "url": "https://arxiv.org/abs/2406.07507", "type": "paper", "by": "Boffi, Albergo, Vanden-Eijnden, 2024", "level": 2}, {"title": "How to build a consistency model: Learning flow maps via self-distillation", "url": "https://arxiv.org/abs/2505.18825", "type": "paper", "by": "Boffi, Albergo, Vanden-Eijnden, 2025", "level": 2, "note": "Lagrangian, Eulerian, and progressive losses, with consistency and shortcut models as special cases."}, {"title": "Mean Flows for One-step Generative Modeling", "url": "https://arxiv.org/abs/2505.13447", "type": "paper", "by": "Geng, Deng, Bai, Kolter, He, 2025", "level": 2}, {"title": "One Step Diffusion via Shortcut Models", "url": "https://arxiv.org/abs/2410.12557", "type": "paper", "by": "Frans, Hafner, Levine, Abbeel, 2024", "level": 3}, {"title": "Align Your Flow: Scaling Continuous-Time Flow Map Distillation", "url": "https://arxiv.org/abs/2506.14603", "type": "paper", "by": "Sabour, Fidler, Kreis, 2025", "level": 3}]}, {"id": "bridges", "title": "Schrödinger bridges and bridge matching", "kind": "concept", "track": "gen", "pre": ["ot", "soc", "interpolants"], "frontier": true, "core": "The Schrödinger bridge is the stochastic process closest in KL to Brownian motion that starts at one distribution and ends at another: entropic optimal transport over paths. Bridge matching regresses onto Brownian bridges between paired samples, and alternating it with re-pairing converges to the bridge.", "reach": "Gives unpaired translation between datasets and, with an energy instead of data at one end, the bridge samplers in densities.", "resources": [{"title": "Stochastic control liaisons: Richard Sinkhorn meets Gaspard Monge on a Schroedinger bridge", "url": "https://arxiv.org/abs/2005.10963", "type": "paper", "by": "Chen, Georgiou, Pavon, SIAM Review 2021", "level": 2, "note": "The problem through optimal transport, control, and Sinkhorn at once."}, {"title": "Diffusion Schrödinger Bridge Matching", "url": "https://arxiv.org/abs/2303.16852", "type": "paper", "by": "Shi, De Bortoli, Campbell, Doucet, 2023", "level": 2}, {"title": "Diffusion Schrödinger Bridge with Applications to Score-Based Generative Modeling", "url": "https://arxiv.org/abs/2106.01357", "type": "paper", "by": "De Bortoli, Thornton, Heng, Doucet, 2021", "level": 2}, {"title": "The Principles of Diffusion Models", "url": "https://arxiv.org/abs/2510.21890", "type": "book", "by": "Lai, Song, Kim, Mitsufuji, Ermon, 2025", "level": 3, "note": "Chapter 7 asks whether diffusion models solve the bridge and transport problems."}, {"title": "A survey of the Schrödinger problem and some of its connections with optimal transport", "url": "https://arxiv.org/abs/1308.0215", "type": "paper", "by": "Christian Léonard, 2013", "level": 3}]}, {"id": "d3pm", "title": "Discrete diffusion (D3PM)", "kind": "paper", "track": "disc", "pre": ["ddpm", "stochastic"], "frontier": false, "core": "Corrupt discrete tokens with a Markov chain instead of Gaussian noise: each step multiplies a token’s one-hot vector by a transition matrix, such as uniform resampling or a jump to an absorbing [MASK] state, and a network learns to reverse the chain.", "reach": "The absorbing state leads to masked diffusion language models; the continuous-time view leads to score entropy and discrete flow matching.", "resources": [{"title": "MIT 6.S184: Introduction to Flow Matching and Diffusion Models", "url": "https://diffusion.csail.mit.edu/2026/", "type": "course", "by": "Holderrieth, Erives, MIT, 2026", "level": 1, "note": "Section 7 of the course notes and Lecture 5 build discrete diffusion from continuous-time Markov chains."}, {"title": "Structured Denoising Diffusion Models in Discrete State-Spaces", "url": "https://arxiv.org/abs/2107.03006", "type": "paper", "by": "Austin et al., Google, 2021", "level": 2, "note": "Section 3.1 compares transition matrices; Section 4 relates the absorbing one to BERT and autoregressive models."}, {"title": "A Continuous Time Framework for Discrete Denoising Models", "url": "https://arxiv.org/abs/2205.14987", "type": "paper", "by": "Campbell et al., 2022", "level": 3, "note": "Moves discrete diffusion to continuous time, the form later work builds on."}]}, {"id": "sedd", "title": "Score entropy discrete diffusion (SEDD)", "kind": "paper", "track": "disc", "pre": ["d3pm", "ebm"], "frontier": false, "core": "The score, the gradient of log density, does not exist for discrete data, so learn ratios p(y)/p(x) between a sequence x and each neighbor y differing in one token. Score entropy fits these ratios, which define the reverse of a continuous-time Markov chain.", "reach": "Its models matched or beat GPT-2 at similar size; the ratio view recurs in discrete flow matching and masked diffusion.", "resources": [{"title": "Language Modeling by Estimating the Ratios of the Data Distribution", "url": "https://aaronlou.com/blog/2024/discrete-diffusion/", "type": "blog", "by": "Aaron Lou, 2024", "level": 1, "note": "The first author’s walkthrough, from why autoregression dominates to concrete scores and sampling."}, {"title": "Discrete Diffusion Modeling by Estimating the Ratios of the Data Distribution", "url": "https://arxiv.org/abs/2310.16834", "type": "paper", "by": "Lou, Meng, Ermon, ICML 2024", "level": 2}, {"title": "Concrete Score Matching: Generalized Score Matching for Discrete Data", "url": "https://arxiv.org/abs/2211.00802", "type": "paper", "by": "Meng, Choi, Song, Ermon, 2022", "level": 3, "note": "The earlier idea of a discrete score as ratios to neighboring states."}]}, {"id": "mdlm", "title": "Masked diffusion language models", "kind": "concept", "track": "disc", "pre": ["d3pm", "lm", "masks"], "frontier": false, "core": "Use only the absorbing [MASK] corruption. The diffusion bound then reduces to a weighted average of BERT-style masked token cross-entropies over random masking rates, so training is masked language modeling, and sampling unmasks tokens over several steps in any order.", "reach": "The recipe that LLaDA scales, block diffusion extends, and RL fine-tunes.", "resources": [{"title": "How to Build a Diffusion Language Model", "url": "https://kuleshov-group.github.io/blog/blog/2026/how-to-build-a-diffusion-language-model/", "type": "blog", "by": "Kuleshov group, Cornell, 2026", "level": 1, "note": "The sections on simple masked diffusion models."}, {"title": "Simple and Effective Masked Diffusion Language Models", "url": "https://arxiv.org/abs/2406.07524", "type": "paper", "by": "Sahoo et al., Cornell, 2024", "level": 2, "note": "Section 3 derives the Rao-Blackwellized bound; Section 4.2 adds semi-autoregressive decoding."}, {"title": "Simplified and Generalized Masked Diffusion for Discrete Data", "url": "https://arxiv.org/abs/2406.04329", "type": "paper", "by": "Shi, Han, Wang, Doucet, Titsias, 2024", "level": 2, "note": "MD4: the same objective derived independently as a weighted integral of cross-entropies, with state-dependent schedules."}, {"title": "Your Absorbing Discrete Diffusion Secretly Models the Conditional Distributions of Clean Data", "url": "https://arxiv.org/abs/2406.03736", "type": "paper", "by": "Ou et al., 2024", "level": 3, "note": "Shows the optimal network needs no time input: it predicts clean tokens given the unmasked ones."}]}, {"id": "llada", "title": "LLaDA: diffusion LLMs at scale", "kind": "paper", "track": "disc", "pre": ["mdlm", "scaling"], "frontier": true, "core": "Train a masked diffusion model the way LLMs are trained: 8B parameters, trillions of pretraining tokens, then supervised fine-tuning. It rivals LLaMA 3 8B at in-context learning and beats GPT-4o at completing poems in reverse, so these abilities do not need left to right generation.", "reach": "Made diffusion LLMs a serious option at scale and is the base model for RL on them and for faster decoding.", "resources": [{"title": "Large Language Diffusion Models", "url": "https://arxiv.org/abs/2502.09992", "type": "paper", "by": "Nie et al., Renmin University, Ant Group, 2025", "level": 2}, {"title": "Scaling up Masked Diffusion Models on Text", "url": "https://arxiv.org/abs/2410.18514", "type": "paper", "by": "Nie et al., 2024", "level": 2, "note": "Scaling laws for masked diffusion, the evidence that set up LLaDA."}, {"title": "Dream 7B: Diffusion Large Language Models", "url": "https://arxiv.org/abs/2508.15487", "type": "paper", "by": "Ye et al., HKU, 2025", "level": 3, "note": "Starts a diffusion LLM from autoregressive weights instead of from scratch."}, {"title": "LLaDA", "url": "https://github.com/ML-GSAI/LLaDA", "type": "code", "by": "Nie et al., 2025", "level": 2, "note": "Inference and evaluation code for the released models."}]}, {"id": "blockdiff", "title": "Block diffusion and semi-autoregressive decoding", "kind": "paper", "track": "disc", "pre": ["mdlm", "masks", "serving"], "frontier": true, "core": "Generate text block by block from left to right, with masked diffusion inside each block. Blocks attend causally to earlier ones, so KV caching and any length work as in autoregressive models, while a block’s tokens come out in parallel; block size one is autoregression.", "reach": "Interpolates between language models and masked diffusion; block-wise caching underlies training-free speedups for diffusion LLM serving.", "resources": [{"title": "Block Diffusion", "url": "https://m-arriola.com/bd3lms/", "type": "blog", "by": "Arriola et al., Cornell, 2025", "level": 1, "note": "The authors’ page: the likelihood, the training and sampling algorithms, and why the diffusion gap comes from variance."}, {"title": "Block Diffusion: Interpolating Between Autoregressive and Diffusion Language Models", "url": "https://arxiv.org/abs/2503.09573", "type": "paper", "by": "Arriola et al., Cornell, ICLR 2025", "level": 2}, {"title": "Fast-dLLM: Training-free Acceleration of Diffusion LLM by Enabling KV Cache and Parallel Decoding", "url": "https://arxiv.org/abs/2505.22618", "type": "paper", "by": "Wu et al., NVIDIA, 2025", "level": 3, "note": "Adds approximate block-wise KV caching and confidence-based parallel decoding to LLaDA and Dream without retraining."}]}, {"id": "dfm", "title": "Discrete flow matching and edit flows", "kind": "concept", "track": "disc", "pre": ["fm", "sedd"], "frontier": true, "core": "Choose a probability path that moves each token from noise or [MASK] to data, and learn the rates of a continuous-time Markov chain, the discrete analog of a velocity field, that carry samples along it. Edit Flows adds insertions and deletions, so length can change.", "reach": "Brings flow matching to tokens and treats masked diffusion and score entropy as particular choices of path and rate.", "resources": [{"title": "Flow Matching Guide and Code", "url": "https://arxiv.org/abs/2412.06264", "type": "tutorial", "by": "Lipman et al., Meta, 2024", "level": 2, "note": "Sections 6 and 7: continuous-time Markov chains, then discrete flow matching with factorized paths."}, {"title": "Discrete Flow Matching", "url": "https://arxiv.org/abs/2407.15595", "type": "paper", "by": "Gat et al., Meta, 2024", "level": 2}, {"title": "Edit Flows: Flow Matching with Edit Operations", "url": "https://arxiv.org/abs/2506.09018", "type": "paper", "by": "Havasi, Karrer, Gat, Chen, Meta, 2025", "level": 3, "note": "Insertions, deletions and substitutions as a Markov chain over sequences of any length."}, {"title": "Generative Flows on Discrete State-Spaces: Enabling Multimodal Flows with Applications to Protein Co-Design", "url": "https://arxiv.org/abs/2402.04997", "type": "paper", "by": "Campbell, Yim, Barzilay, Rainforth, Jaakkola, 2024", "level": 3, "note": "An independent derivation of discrete flows, used for joint sequence and structure generation."}, {"title": "flow_matching", "url": "https://github.com/facebookresearch/flow_matching", "type": "code", "by": "Meta FAIR, 2024", "level": 2, "note": "PyTorch library with continuous and discrete flow matching examples."}]}, {"id": "dllmrl", "title": "RL for diffusion language models", "kind": "concept", "track": "disc", "pre": ["llada", "rlvr"], "frontier": true, "core": "Policy gradient methods such as GRPO need each sampled answer’s log-probability, which a masked diffusion model cannot compute exactly. d1 approximates it from one forward pass with the prompt randomly masked; later methods use ELBO estimates with variance reduction, or upper and lower bounds together.", "reach": "Carries RL with verifiable rewards to diffusion LLMs; image diffusion meets the same likelihood problem in reward fine-tuning.", "resources": [{"title": "How to Build a Diffusion Language Model", "url": "https://kuleshov-group.github.io/blog/blog/2026/how-to-build-a-diffusion-language-model/", "type": "blog", "by": "Kuleshov group, Cornell, 2026", "level": 1, "note": "The section on post-training diffusion language models."}, {"title": "d1: Scaling Reasoning in Diffusion Large Language Models via Reinforcement Learning", "url": "https://arxiv.org/abs/2504.12216", "type": "paper", "by": "Zhao, Gupta, Zheng, Grover, 2025", "level": 2, "note": "Masked SFT, then diffu-GRPO with a mean-field, one-step log-probability estimate."}, {"title": "LLaDA 1.5: Variance-Reduced Preference Optimization for Large Language Diffusion Models", "url": "https://arxiv.org/abs/2505.19223", "type": "paper", "by": "Zhu et al., 2025", "level": 2, "note": "Preference optimization on ELBO estimates, and how to cut their variance."}, {"title": "DiffuCoder: Understanding and Improving Masked Diffusion Models for Code Generation", "url": "https://arxiv.org/abs/2506.20639", "type": "paper", "by": "Gong et al., Apple, 2025", "level": 3, "note": "Coupled-GRPO: complementary masks give lower variance likelihood estimates during RL on code."}, {"title": "SPG: Sandwiched Policy Gradient for Masked Diffusion Language Models", "url": "https://arxiv.org/abs/2510.09541", "type": "paper", "by": "Wang et al., 2025", "level": 3, "note": "Uses an upper and a lower bound on the log-likelihood to reduce policy gradient bias."}]}, {"id": "rewardft", "title": "Reward fine-tuning of diffusion models", "kind": "concept", "track": "ctrl", "pre": ["ddpm", "pg"], "frontier": false, "core": "Treat each denoising step as an action in a Markov decision process whose reward arrives only with the final sample, then fine-tune with policy gradients, or backpropagate a differentiable reward through the sampler. A KL penalty toward the pretrained model limits reward hacking.", "reach": "Adjoint matching solves the KL-regularized problem exactly; the same recipes fine-tune diffusion language models and diffusion policies.", "resources": [{"title": "Training Diffusion Models with Reinforcement Learning", "url": "https://bair.berkeley.edu/blog/2023/07/14/ddpo/", "type": "blog", "by": "Kevin Black, BAIR blog, 2023", "level": 1}, {"title": "Training Diffusion Models with Reinforcement Learning", "url": "https://arxiv.org/abs/2305.13301", "type": "paper", "by": "Black, Janner, Du, Kostrikov, Levine, 2023", "level": 2}, {"title": "Understanding Reinforcement Learning-Based Fine-Tuning of Diffusion Models: A Tutorial and Review", "url": "https://arxiv.org/abs/2407.13734", "type": "tutorial", "by": "Uehara, Zhao, Biancalani, Levine, 2024", "level": 2}, {"title": "Directly Fine-Tuning Diffusion Models on Differentiable Rewards", "url": "https://arxiv.org/abs/2309.17400", "type": "paper", "by": "Clark, Vicol, Swersky, Fleet, 2023", "level": 2}, {"title": "Flow-GRPO: Training Flow Matching Models via Online RL", "url": "https://arxiv.org/abs/2505.05470", "type": "paper", "by": "Liu et al., 2025", "level": 3}]}, {"id": "adjoint", "title": "Adjoint matching", "kind": "paper", "track": "ctrl", "pre": ["rewardft", "soc", "fm"], "frontier": true, "core": "KL-regularized reward fine-tuning is a stochastic optimal control problem whose target reweights the base distribution by exp(reward). With a memoryless noise schedule that target is reached exactly, and the control is learned by regressing onto a lean adjoint state solved backward from the reward gradient.", "reach": "The same regression drives adjoint sampling and bridge samplers for unnormalized densities.", "resources": [{"title": "Reward fine-tuning for flow and diffusion models (slides)", "url": "https://diffusion.csail.mit.edu/docs/guest_slides_lecture_4.pdf", "type": "notes", "by": "Carles Domingo-Enrich, 2024, hosted by MIT 6.S184", "level": 1, "note": "The first author’s walk through the method before the paper’s proofs."}, {"title": "Adjoint Matching: Fine-tuning Flow and Diffusion Generative Models with Memoryless Stochastic Optimal Control", "url": "https://arxiv.org/abs/2409.08861", "type": "paper", "by": "Domingo-Enrich, Drozdzal, Karrer, Chen, 2024", "level": 2, "note": "Sections 4 and 5 hold the method; Appendix D proves the memoryless schedule."}, {"title": "Fine-Tuning of Continuous-Time Diffusion Models as Entropy-Regularized Control", "url": "https://arxiv.org/abs/2402.15194", "type": "paper", "by": "Uehara et al., 2024", "level": 2}, {"title": "A Taxonomy of Loss Functions for Stochastic Optimal Control", "url": "https://arxiv.org/abs/2410.00345", "type": "paper", "by": "Carles Domingo-Enrich, 2024", "level": 3}, {"title": "Reinforce Adjoint Matching: Scaling RL Post-Training of Diffusion and Flow-Matching Models", "url": "https://arxiv.org/abs/2605.10759", "type": "paper", "by": "Bergmeister, Jegelka, Nüsken, Domingo-Enrich, Pidstrigach, 2026", "level": 3}]}, {"id": "steering", "title": "Inference-time steering and twisted SMC", "kind": "concept", "track": "ctrl", "pre": ["guidance", "montecarlo"], "frontier": true, "core": "Leave the weights alone and steer at sampling time: run many particles through the denoiser, weight each by an estimate of its final reward, and resample. Unlike plain guidance, this sequential Monte Carlo becomes exact for the tilted or conditional target as particles grow.", "reach": "Inference-time scaling for diffusion models, and the twisted SMC used for constrained generation in language models and protein design.", "resources": [{"title": "Inference-Time Alignment in Diffusion Models with Reward-Guided Generation: Tutorial and Review", "url": "https://arxiv.org/abs/2501.09685", "type": "tutorial", "by": "Uehara et al., 2025", "level": 1}, {"title": "Practical and Asymptotically Exact Conditional Sampling in Diffusion Models", "url": "https://arxiv.org/abs/2306.17775", "type": "paper", "by": "Wu, Trippe, Naesseth, Blei, Cunningham, 2023", "level": 2}, {"title": "A General Framework for Inference-time Scaling and Steering of Diffusion Models", "url": "https://arxiv.org/abs/2501.06848", "type": "paper", "by": "Singhal et al., 2025", "level": 2, "note": "Feynman-Kac steering."}, {"title": "Probabilistic Inference in Language Models via Twisted Sequential Monte Carlo", "url": "https://arxiv.org/abs/2404.17546", "type": "paper", "by": "Zhao, Brekelmans, Makhzani, Grosse, 2024", "level": 3}, {"title": "Are we really tilting? The mechanics of reward guidance in flow and diffusion models", "url": "https://arxiv.org/abs/2606.02884", "type": "paper", "by": "Dandapanthula, Boffi, 2026", "level": 3}]}, {"id": "densities", "title": "Diffusion samplers for unnormalized densities", "kind": "concept", "track": "ctrl", "pre": ["bridges", "adjoint", "montecarlo"], "frontier": true, "core": "When the target is known only through an energy, as for molecules at equilibrium, there is no data to denoise. Instead, learn the drift of a controlled diffusion that carries noise to the target, using control losses built from the energy and its gradient.", "reach": "Brings diffusion to molecular simulation and Bayesian posteriors, where MCMC and parallel tempering remain the baselines to beat.", "resources": [{"title": "Boltzmann Generators: Sampling Equilibrium States of Many-Body Systems with Deep Learning", "url": "https://arxiv.org/abs/1812.01729", "type": "paper", "by": "Noé, Olsson, Köhler, Wu, 2019", "level": 2, "note": "The problem and the reweighting idea, with normalizing flows."}, {"title": "Path Integral Sampler: a stochastic control approach for sampling", "url": "https://arxiv.org/abs/2111.15141", "type": "paper", "by": "Zhang, Chen, 2021", "level": 2}, {"title": "Adjoint Sampling: Highly Scalable Diffusion Samplers via Adjoint Matching", "url": "https://arxiv.org/abs/2504.11713", "type": "paper", "by": "Havens et al., Meta, 2025", "level": 2}, {"title": "Adjoint Schrödinger Bridge Sampler", "url": "https://arxiv.org/abs/2506.22565", "type": "paper", "by": "Liu, Choi, Chen, Miller, Chen, 2025", "level": 3}, {"title": "No Trick, No Treat: Pursuits and Challenges Towards Simulation-free Training of Neural Samplers", "url": "https://arxiv.org/abs/2502.06685", "type": "paper", "by": "He et al., 2025", "level": 3, "note": "The critique that sets parallel tempering as the baseline."}]}, {"id": "bandits", "title": "Bandits and exploration", "kind": "concept", "track": "rl", "pre": ["prob"], "frontier": false, "core": "Pull one of K arms with unknown payout rates; each pull either exploits the best-looking arm or explores another. An optimism bonus that shrinks as an arm is tried (UCB), or sampling arms from the posterior (Thompson sampling), keeps regret growing only logarithmically.", "reach": "Its exploration bonus returns in count-based exploration and Monte Carlo tree search, and regret is how RL theory scores learners.", "resources": [{"title": "Reinforcement Learning: An Introduction", "url": "http://incompleteideas.net/book/the-book-2nd.html", "type": "book", "by": "Sutton, Barto, 2nd edition, 2018", "level": 1, "note": "Chapter 2: greedy and epsilon-greedy, optimistic starts, UCB and gradient bandits on the 10-armed testbed."}, {"title": "A Tutorial on Thompson Sampling", "url": "https://arxiv.org/abs/1707.02038", "type": "tutorial", "by": "Russo et al., 2017", "level": 2, "note": "The Bayesian alternative to UCB, worked from Bernoulli bandits to harder problems."}, {"title": "Bandit Algorithms", "url": "https://tor-lattimore.com/downloads/book/book.pdf", "type": "book", "by": "Lattimore, Szepesvári, 2020", "level": 3, "note": "Chapters 4 to 8 prove regret bounds for UCB; Chapter 36 covers Thompson sampling."}]}, {"id": "mdp", "title": "MDPs, Bellman equations and dynamic programming", "kind": "concept", "track": "rl", "pre": ["stochastic", "control"], "frontier": false, "core": "A Markov decision process is states, actions, transition probabilities and rewards. A state’s value equals the expected reward now plus the discounted value of the next state (the Bellman equation); value and policy iteration solve it by repeating that update until nothing changes.", "reach": "Every RL method approximates this fixed point: TD learning samples it, Q-learning adds a max, and planners compute it with a model.", "resources": [{"title": "Introduction to Reinforcement Learning", "url": "https://www.davidsilver.uk/teaching/", "type": "lectures", "by": "David Silver, UCL, 2015", "level": 1, "note": "Lectures 2 (Markov Decision Processes) and 3 (Planning by Dynamic Programming), slides and videos."}, {"title": "Reinforcement Learning: An Introduction", "url": "http://incompleteideas.net/book/the-book-2nd.html", "type": "book", "by": "Sutton, Barto, 2nd edition, 2018", "level": 2, "note": "Chapters 3 and 4: the Bellman equations, then policy evaluation, policy iteration and value iteration."}, {"title": "A Course in Reinforcement Learning (2nd edition)", "url": "https://web.mit.edu/dimitrib/www/RLCOURSECOMPLETE%202ndEDITION.pdf", "type": "book", "by": "Dimitri Bertsekas, 2026", "level": 3, "note": "Chapter 1 treats exact and approximate dynamic programming as one subject, with rollout and Newton’s method views."}]}, {"id": "td", "title": "TD learning and Q-learning", "kind": "concept", "track": "rl", "pre": ["mdp", "montecarlo"], "frontier": false, "core": "Move a value estimate toward the reward received plus the estimate at the next state, rather than waiting for the episode’s return. Q-learning does this for action values with a max over next actions, so it learns the optimal policy while behaving otherwise (off-policy).", "reach": "Bootstrapping from your own estimates drives DQN and every critic, and causes the overestimation that offline RL fights.", "resources": [{"title": "Reinforcement Learning: An Introduction", "url": "http://incompleteideas.net/book/the-book-2nd.html", "type": "book", "by": "Sutton, Barto, 2nd edition, 2018", "level": 1, "note": "Chapter 6: TD prediction, Sarsa, Q-learning and double learning. Section 11.3 explains why off-policy TD with function approximation can diverge."}, {"title": "Introduction to Reinforcement Learning", "url": "https://www.davidsilver.uk/teaching/", "type": "lectures", "by": "David Silver, UCL, 2015", "level": 1, "note": "Lectures 4 (Model-Free Prediction) and 5 (Model-Free Control): Monte Carlo against TD, TD(lambda), Sarsa and Q-learning."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The value-based RL and Q-learning in practice lectures: fitted Q-iteration with neural networks."}]}, {"id": "pg", "title": "Policy gradients", "kind": "concept", "track": "rl", "pre": ["mdp", "backprop"], "frontier": false, "core": "Make the actions that preceded high returns more likely. The gradient of expected return is the average of grad log pi(a|s) times the return, so sampled episodes estimate it with no model of the environment; subtracting a baseline keeps it unbiased and cuts variance.", "reach": "The base of actor-critic, PPO, GRPO, and reward fine-tuning of diffusion models.", "resources": [{"title": "Deep Reinforcement Learning: Pong from Pixels", "url": "http://karpathy.github.io/2016/05/31/rl/", "type": "blog", "by": "Andrej Karpathy, 2016", "level": 1, "note": "A policy gradient agent for Pong in about 130 lines of numpy, explained from scratch."}, {"title": "Part 3: Intro to Policy Optimization", "url": "https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html", "type": "tutorial", "by": "Joshua Achiam, OpenAI Spinning Up, 2018", "level": 1, "note": "Derives the log-derivative trick, reward to go and b
