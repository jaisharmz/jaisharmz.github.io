sults are uneven, and the field is still moving.", "resources": [{"title": "Steering Language Models With Activation Engineering", "url": "https://arxiv.org/abs/2308.10248", "type": "paper", "by": "Turner et al., 2023", "level": 1, "note": "ActAdd: steer with the activation difference of one prompt pair, such as Love minus Hate."}, {"title": "Steering Llama 2 via Contrastive Activation Addition", "url": "https://arxiv.org/abs/2312.06681", "type": "paper", "by": "Panickssery et al., 2023", "level": 2, "note": "Averages the difference over many contrasting pairs and steers behaviors such as sycophancy."}, {"title": "Refusal in Language Models Is Mediated by a Single Direction", "url": "https://arxiv.org/abs/2406.11717", "type": "paper", "by": "Arditi et al., 2024", "level": 2, "note": "Removing one direction disables refusal; adding it makes the model refuse harmless requests."}, {"title": "Scaling Monosemanticity: Extracting Interpretable Features from Claude 3 Sonnet", "url": "https://transformer-circuits.pub/2024/scaling-monosemanticity/index.html", "type": "paper", "by": "Templeton et al., Anthropic, 2024", "level": 2, "note": "The Influence on Behavior section steers the model by clamping single sparse autoencoder features."}, {"title": "ARENA 1.3.2: Function Vectors and Model Steering", "url": "https://learn.arena.education/chapter1_transformer_interp/12_function_vectors/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "Function vectors extracted from in-context examples with nnsight, then steering vectors added to GPT-2 XL’s residual stream to change what it writes.", "teaches": "That some behaviors live in single directions you can find, add, and subtract.", "time": "a weekend"}, {"title": "Persona Vectors: Monitoring and Controlling Character Traits in Language Models", "url": "https://arxiv.org/abs/2507.21509", "type": "paper", "by": "Chen, Arditi, Sleight, Evans, Lindsey, 2025", "level": 3, "note": "Extracts trait directions automatically, then uses them to monitor, steer, and flag training data that would shift a persona."}]}, {"id": "forgetting", "title": "Catastrophic forgetting and EWC", "kind": "paper", "track": "cl", "pre": ["training", "stats"], "frontier": false, "core": "Training on task B overwrites the weights task A relied on, so performance on A collapses. Elastic weight consolidation anchors each weight to its old value with a quadratic penalty scaled by its Fisher information, an estimate of how much task A needed it.", "reach": "The baseline that replay, LoRA’s forgetting results, and the KL penalty in RLHF are all measured against.", "uses": "Fine-tuning a deployed model on new data without losing what it already did well, continual pretraining on fresh corpora, and on-device personalization that must not degrade the shipped behavior.", "worth": "you fine-tune models that already work; needs training basics and a little Fisher information, though EWC itself is now mostly a reference point.", "resources": [{"title": "Continual Learning and Catastrophic Forgetting", "url": "https://arxiv.org/abs/2403.05175", "type": "book", "by": "van de Ven, Soures, Kudithipudi, 2024", "level": 1, "note": "A short book chapter on the problem, its scenarios, and the main approaches."}, {"title": "Overcoming catastrophic forgetting in neural networks", "url": "https://arxiv.org/abs/1612.00796", "type": "paper", "by": "Kirkpatrick et al., DeepMind, 2017", "level": 2}, {"title": "Three scenarios for continual learning", "url": "https://arxiv.org/abs/1904.07734", "type": "paper", "by": "van de Ven, Tolias, 2019", "level": 2}, {"title": "On Quadratic Penalties in Elastic Weight Consolidation", "url": "https://arxiv.org/abs/1712.03847", "type": "paper", "by": "Ferenc Huszár, 2017", "level": 3}, {"title": "continual-learning", "url": "https://github.com/GMvandeVen/continual-learning", "type": "project", "by": "Gido van de Ven et al., 2022", "level": 2, "build": "EWC, SI, learning without forgetting, experience replay, and generative replay run on split and permuted MNIST in the task, domain, and class incremental scenarios.", "teaches": "Why a method that works when the task is named at test time can fail when it is not, the distinction that decides which results transfer.", "time": "a weekend", "signature": true}]}, {"id": "replay", "title": "Replay and rehearsal", "kind": "concept", "track": "cl", "pre": ["forgetting"], "frontier": false, "core": "Keep a small buffer of old examples, or a generator that can produce them, and mix them into training on new data so the gradient keeps serving old tasks. Even a tiny buffer of a few examples per class often beats weight regularization.", "reach": "The standard defense when continually pretraining LLMs; the replay buffer in deep RL is the same idea.", "uses": "The fraction of old data that continual pretraining runs mix back in, class-incremental image classifiers, and the data recipes that stop a fine-tuned model from losing skills it had before.", "worth": "you fine-tune on a stream of new data; one idea, one afternoon, and it beats most of the sophisticated alternatives.", "resources": [{"title": "On Tiny Episodic Memories in Continual Learning", "url": "https://arxiv.org/abs/1902.10486", "type": "paper", "by": "Chaudhry et al., 2019", "level": 1}, {"title": "Continual Learning with Deep Generative Replay", "url": "https://arxiv.org/abs/1705.08690", "type": "paper", "by": "Shin, Lee, Kim, Kim, 2017", "level": 2}, {"title": "Simple and Scalable Strategies to Continually Pre-train Large Language Models", "url": "https://arxiv.org/abs/2403.08763", "type": "paper", "by": "Ibrahim et al., 2024", "level": 2}, {"title": "Gradient Episodic Memory for Continual Learning", "url": "https://arxiv.org/abs/1706.08840", "type": "paper", "by": "Lopez-Paz, Ranzato, 2017", "level": 3}, {"title": "Experience Replay for Continual Learning", "url": "https://arxiv.org/abs/1811.11682", "type": "paper", "by": "Rolnick et al., 2019", "level": 3}, {"title": "Replay one example per class on Permuted MNIST", "url": "https://arxiv.org/abs/1902.10486", "type": "project", "by": "Built on Chaudhry et al., 2019", "level": 2, "build": "A two hidden layer network trained across permuted MNIST tasks three ways: plain fine-tuning, elastic weight consolidation, and experience replay from a memory of one example per class.", "teaches": "How little memory it takes to stop forgetting, and why a gradient from a few old examples beats a penalty on the weights.", "time": "a weekend", "made": true, "done": "Replay with one example per class beats fine-tuning by about 17 points of average accuracy and elastic weight consolidation by about 7, as in Figure 1a."}]}, {"id": "plasticity", "title": "Loss of plasticity", "kind": "paper", "track": "cl", "pre": ["forgetting", "training"], "frontier": true, "core": "A network trained for long on a stream of changing tasks gradually loses the ability to learn new ones, as units die and weights grow. Continual backprop restores it by reinitializing a small fraction of the least useful units, reinjecting the randomness of initialization.", "reach": "A failure separate from forgetting; it matters for test-time training and any model meant to keep learning after deployment.", "uses": "Diagnosing long training runs that quietly stop improving, which shows up most in reinforcement learning and continual pretraining, where a network fed a changing stream can no longer fit anything new.", "worth": "you run long or non-stationary training and watch curves flatten; needs forgetting and deep-network training, and the literature is young.", "resources": [{"title": "Maintaining Plasticity in Deep Continual Learning", "url": "https://www.youtube.com/watch?v=p_zknyfV9fY", "type": "video", "by": "Rich Sutton, CoLLAs 2022", "level": 1, "note": "A talk on this work two years before the Nature paper."}, {"title": "Loss of plasticity in deep continual learning", "url": "https://www.nature.com/articles/s41586-024-07711-7", "type": "paper", "by": "Dohare et al., Nature, 2024", "level": 2}, {"title": "On Warm-Starting Neural Network Training", "url": "https://arxiv.org/abs/1910.08475", "type": "paper", "by": "Ash, Adams, 2020", "level": 2}, {"title": "The Primacy Bias in Deep Reinforcement Learning", "url": "https://arxiv.org/abs/2205.07802", "type": "paper", "by": "Nikishin et al., 2022", "level": 2}, {"title": "Understanding plasticity in neural networks", "url": "https://arxiv.org/abs/2303.01486", "type": "paper", "by": "Lyle et al., DeepMind, 2023", "level": 3}, {"title": "Slowly Changing Regression", "url": "https://github.com/shibhansh/loss-of-plasticity/tree/main/lop/slowly_changing_regression", "type": "project", "by": "Dohare, Hernandez-Garcia, Rahman, Mahmood, Sutton, 2024", "level": 2, "note": "The README gives the commands and says one run takes about 15 CPU minutes, with at least 30 runs recommended.", "build": "The paper’s smallest problem run with backprop and with continual backprop over many seeds, with online error plotted against examples seen.", "teaches": "That plasticity drains away in a problem that never changes task, and that reinitializing a few low-utility units brings it back.", "time": "a day"}]}, {"id": "lora", "title": "Parameter-efficient fine-tuning and LoRA", "kind": "concept", "track": "cl", "pre": ["attention", "svd"], "frontier": false, "core": "Freeze the pretrained weights and learn only a low-rank update, W + BA with thin matrices B and A, so fine-tuning trains and stores a tiny fraction of the parameters. The update can be merged into W afterward, adding no inference cost.", "reach": "Makes instruction tuning cheap, enables 4-bit fine-tuning (QLoRA), and gives model merging small task vectors to add.", "uses": "Fine-tuning large models on a single GPU, serving hundreds of customer-specific adapters against one shared base, and the style adapters traded around image-generation communities.", "worth": "you fine-tune anything bigger than a small model; attention and low-rank approximation are the only prerequisites, and the payoff is immediate.", "resources": [{"title": "Practical Tips for Finetuning LLMs Using LoRA (Low-Rank Adaptation)", "url": "https://magazine.sebastianraschka.com/p/practical-tips-for-finetuning-llms", "type": "blog", "by": "Sebastian Raschka, 2023", "level": 1}, {"title": "LoRA: Low-Rank Adaptation of Large Language Models", "url": "https://arxiv.org/abs/2106.09685", "type": "paper", "by": "Hu et al., Microsoft, 2021", "level": 2}, {"title": "LoRA Learns Less and Forgets Less", "url": "https://arxiv.org/abs/2405.09673", "type": "paper", "by": "Biderman et al., 2024", "level": 2}, {"title": "LoRA Without Regret", "url": "https://thinkingmachines.ai/blog/lora/", "type": "blog", "by": "John Schulman, Thinking Machines, 2025", "level": 2}, {"title": "QLoRA: Efficient Finetuning of Quantized LLMs", "url": "https://arxiv.org/abs/2305.14314", "type": "paper", "by": "Dettmers et al., 2023", "level": 2}, {"title": "LLMs from Scratch, Appendix E: LoRA", "url": "https://github.com/rasbt/LLMs-from-scratch/tree/main/appendix-E", "type": "project", "by": "Sebastian Raschka, 2024", "level": 1, "build": "A LoRA layer written from scratch, swapped into a GPT model’s linear layers, and fine-tuned to classify spam text messages.", "teaches": "That a fine-tune needs few parameters, and where the low-rank update sits in the forward pass.", "time": "an afternoon"}]}, {"id": "merging", "title": "Model merging and task arithmetic", "kind": "concept", "track": "cl", "pre": ["lora"], "frontier": true, "core": "Subtracting a base model’s weights from a fine-tuned copy gives a task vector. Adding, scaling, or negating these vectors edits behavior without training, and averaging fine-tunes often keeps each one’s skills, since fine-tunes of one base tend to share a basin of low loss.", "reach": "A cheap alternative to replay for combining skills; LoRA adapters are compact task vectors.", "uses": "Combining separately trained fine-tunes without retraining, the merged checkpoints common in open-weight releases, averaging runs for robustness under distribution shift, and editing a behavior out by subtracting its task vector.", "worth": "you have several fine-tunes of one base and no budget to retrain; needs LoRA, and much of it stays empirical.", "resources": [{"title": "Merge Large Language Models with mergekit", "url": "https://huggingface.co/blog/mlabonne/merge-models", "type": "blog", "by": "Maxime Labonne, 2024", "level": 1}, {"title": "Editing Models with Task Arithmetic", "url": "https://arxiv.org/abs/2212.04089", "type": "paper", "by": "Ilharco et al., 2023", "level": 2}, {"title": "Model soups: averaging weights of multiple fine-tuned models improves accuracy without increasing inference time", "url": "https://arxiv.org/abs/2203.05482", "type": "paper", "by": "Wortsman et al., 2022", "level": 2}, {"title": "TIES-Merging: Resolving Interference When Merging Models", "url": "https://arxiv.org/abs/2306.01708", "type": "paper", "by": "Yadav et al., 2023", "level": 3}, {"title": "Linear Mode Connectivity and the Lottery Ticket Hypothesis", "url": "https://arxiv.org/abs/1912.05671", "type": "paper", "by": "Frankle et al., 2020", "level": 3}, {"title": "Negate and add CLIP task vectors", "url": "https://arxiv.org/abs/2212.04089", "type": "project", "by": "Built on Ilharco et al., 2023", "level": 2, "note": "The fine-tuned checkpoints for all eight tasks are published in mlfoundations/task_vectors.", "build": "Task vectors taken from a CLIP ViT-B/32 fine-tuned on each of eight classification tasks, then negated to drop one task and added to make one model, with ImageNet as the control.", "teaches": "That fine-tuning directions add and subtract like vectors, and what that says about where a fine-tune keeps its skill.", "time": "a weekend", "made": true, "done": "Negation drops the eight target tasks from 48.3 to about 24.0 percent while ImageNet stays near 60.9, and adding all eight reaches about 91.2 percent normalized accuracy."}]}, {"id": "ttt", "title": "Test-time training and fast weights", "kind": "concept", "track": "cl", "pre": ["ssm", "icl", "assocmem"], "frontier": true, "core": "Make a layer’s hidden state the weights of a small inner model, updated by one gradient step on a self-supervised loss per token, so the model keeps learning as it reads. Linear attention is the special case where each step is an outer-product write.", "reach": "Joins state-space models to continual learning; Titans and related memories use it for very long contexts.", "uses": "Long-context architectures whose recurrent state is itself a small learner, and test-time adaptation on unfamiliar tasks. The tie to linear attention is what makes it more than a curiosity.", "worth": "you research architectures or very long context; needs state-space models, in-context learning, and associative memory, so not an entry point.", "resources": [{"title": "Learning to (Learn at Test Time): RNNs with Expressive Hidden States", "url": "https://arxiv.org/abs/2407.04620", "type": "paper", "by": "Sun et al., 2024", "level": 2}, {"title": "Linear Transformers Are Secretly Fast Weight Programmers", "url": "https://arxiv.org/abs/2102.11174", "type": "paper", "by": "Schlag, Irie, Schmidhuber, 2021", "level": 2}, {"title": "Titans: Learning to Memorize at Test Time", "url": "https://arxiv.org/abs/2501.00663", "type": "paper", "by": "Behrouz, Zhong, Mirrokni, Google, 2024", "level": 3}, {"title": "Test-Time Training with Self-Supervision for Generalization under Distribution Shifts", "url": "https://arxiv.org/abs/1909.13231", "type": "paper", "by": "Sun et al., 2020", "level": 2}, {"title": "The Surprising Effectiveness of Test-Time Training for Few-Shot Learning", "url": "https://arxiv.org/abs/2411.07279", "type": "paper", "by": "Akyürek et al., MIT, 2024", "level": 3}, {"title": "Test-time training on corrupted CIFAR-10", "url": "https://arxiv.org/abs/1909.13231", "type": "project", "by": "Built on Sun, Wang, Liu, Miller, Efros, Hardt, 2020", "level": 2, "build": "A ResNet with a rotation prediction head trained on CIFAR-10, then updated at test time on each corrupted image’s own rotation loss, scored on CIFAR-10-C at level 5, on one GPU.", "teaches": "That one self-supervised step per test input buys real robustness, and which corruptions it cannot touch.", "time": "a weekend", "made": true, "done": "Online test-time training cuts error on the three noise corruptions by more than 24 percent against the jointly trained baseline, with clean error still near 8.9 percent."}]}, {"id": "compressmem", "title": "Compressive memory: constant space for unbounded context", "kind": "concept", "track": "cl", "pre": ["linearattn", "longctx", "ttt"], "frontier": true, "core": "Split the stream into chunks, attend exactly within the current chunk, and fold each finished chunk into a fixed d-by-d memory with a linear attention or delta rule write. Each query reads both. Memory stays constant at any length, but old details come back blurred.", "reach": "Deep memories trained at test time (Titans, ATLAS) raise its capacity; long-context benchmarks such as RULER and BABILong measure what it forgets.", "uses": "Reading streams longer than any cache can hold, such as hour-long transcripts, book-length documents, or an agent’s running history, by trading exact recall of old detail for memory that stops growing.", "worth": "you build long-running agents or long-context systems; needs linear attention and long-context methods, and the capacity limits bite in practice.", "resources": [{"title": "Leave No Context Behind: Efficient Infinite Context Transformers with Infini-attention", "url": "https://arxiv.org/abs/2404.07143", "type": "paper", "by": "Munkhdalai, Faruqui, Gopal, Google, 2024", "level": 2, "note": "Section 3 is the whole method: softmax attention inside each segment, a linear or delta rule memory across segments, and a learned gate between them."}, {"title": "A failed experiment: Infini-Attention, and why we should keep trying?", "url": "https://huggingface.co/blog/infini-attention", "type": "blog", "by": "Nguyen, von Werra, Wolf, Hugging Face, 2024", "level": 2, "note": "A careful reproduction: recall inside the current segment worked, but a needle placed in an earlier segment was lost, the price of a lossy memory."}, {"title": "Compressive Transformers for Long-Range Sequence Modelling", "url": "https://arxiv.org/abs/1911.05507", "type": "paper", "by": "Rae, Potapenko, Jayakumar, Lillicrap, DeepMind, 2019", "level": 2, "note": "Old activations are compressed into fewer slots instead of dropped, trained so attention over them matches attention over the originals; Section 4 introduces PG-19."}, {"title": "Recurrent Memory Transformer", "url": "https://arxiv.org/abs/2207.06881", "type": "paper", "by": "Bulatov, Kuratov, Burtsev, 2022", "level": 2, "note": "Section 3: a few memory tokens are written at the end of each segment and read at the start of the next, trained by backpropagation through time."}, {"title": "ATLAS: Learning to Optimally Memorize the Context at Test Time", "url": "https://arxiv.org/abs/2505.23735", "type": "paper", "by": "Behrouz et al., Google, 2025", "level": 3, "note": "Section 3: a delta rule matrix memory stores only about d_k pairs; polynomial key features and an update fit to a window of recent tokens raise that."}, {"title": "Infini-attention on passkey retrieval", "url": "https://huggingface.co/blog/infini-attention", "type": "project", "by": "Built on Nguyen, von Werra, Wolf, Hugging Face, 2024", "level": 3, "build": "Infini-attention added to a small pretrained model on one GPU: softmax attention inside each segment, an ELU+1 linear memory across segments, and a learned gate, then tested on passkey retrieval.", "teaches": "What a fixed-size memory keeps and loses, measured by where in the context a needle can still be found.", "time": "a week", "made": true, "done": "With 2 segments, passkey retrieval succeeds 100 percent of the time when the needle is in the current segment and fails when it is in the earlier one, as the reproduction reports."}]}, {"id": "diffpolicy", "title": "Diffusion Policy", "kind": "paper", "track": "embod", "pre": ["imitation", "ddpm"], "frontier": false, "core": "Represent a robot policy as a conditional diffusion model that denoises a chunk of future actions given recent camera frames. Diffusion keeps multimodal demonstrations intact, such as passing an obstacle on the left or right, where a regression policy would average them into a collision.", "reach": "The action head that VLAs inherit, often as flow matching; it joins imitation learning with DDPM.", "uses": "Real manipulation policies trained from demonstrations, including bimanual kitchen and assembly tasks, where keeping alternative ways of performing a motion separate is the difference between success and a collision.", "worth": "you train robot policies from demonstrations; needs imitation learning and DDPM, and it is the current default action head.", "resources": [{"title": "Learning from demonstrations", "url": "https://manipulation.csail.mit.edu/Fall2026/lec/bc_notes.pdf", "type": "notes", "by": "MIT 6.4210 course notes, Fall 2026", "level": 1, "note": "Section 2 builds flow matching and diffusion policies on a two-route example; Section 4.2 covers action chunking."}, {"title": "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion", "url": "https://arxiv.org/abs/2303.04137", "type": "paper", "by": "Chi et al., Columbia, MIT, 2023", "level": 2}, {"title": "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware", "url": "https://arxiv.org/abs/2304.13705", "type": "paper", "by": "Zhao, Kumar, Levine, Finn, 2023", "level": 2, "note": "ALOHA and ACT: action chunking with a transformer and a CVAE, the other common recipe."}, {"title": "diffusion_policy", "url": "https://github.com/real-stanford/diffusion_policy", "type": "code", "by": "Chi et al., 2023", "level": 2, "note": "Reference code with state and vision Colab notebooks on a simulated push task."}, {"title": "LeRobot: Imitation Learning on Real-World Robots", "url": "https://huggingface.co/docs/lerobot/il_robots", "type": "project", "by": "Hugging Face, 2025", "level": 2, "note": "Needs the arm kit; the training half runs on datasets from the Hub without one.", "build": "A pick-and-place policy for a low-cost SO-101 arm: teleoperate it with a leader arm, record about 50 demonstrations, train ACT or Diffusion Policy, and run it on the robot.", "teaches": "What papers on robot learning leave out: calibration, camera placement, data quality, and evaluation on hardware.", "time": "a week", "signature": true}]}, {"id": "vla", "title": "Vision-language-action models", "kind": "concept", "track": "embod", "pre": ["diffpolicy", "vlm", "fm"], "frontier": true, "core": "Start from a pretrained vision-language model and fine-tune it on robot demonstrations to output actions, either as discrete tokens (RT-2, OpenVLA) or as continuous action chunks from a flow matching head (pi0). Web pretraining brings semantic knowledge to control; diverse robot data brings generalization.", "reach": "Joins LLM pretraining, flow matching and Diffusion Policy; world models offer a way to evaluate and train them.", "uses": "Generalist robot policies that read a camera image and a written instruction, which is the approach most commercial humanoid and manipulation teams now build on, and the route to reusing web knowledge for control.", "worth": "you want to work in robot learning now; needs Diffusion Policy, vision-language models, and flow matching, and the results are months old.", "resources": [{"title": "Our First Generalist Policy", "url": "https://www.physicalintelligence.company/blog/pi0", "type": "blog", "by": "Physical Intelligence, 2024", "level": 1, "note": "The pi0 announcement: a VLM backbone with a flow matching action expert, and what it can do."}, {"title": "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control", "url": "https://arxiv.org/abs/2307.15818", "type": "paper", "by": "Brohan et al., Google DeepMind, 2023", "level": 2, "note": "The original move: write actions as text tokens and co-train with web data."}, {"title": "π0: A Vision-Language-Action Flow Model for General Robot Control", "url": "https://arxiv.org/abs/2410.24164", "type": "paper", "by": "Black et al., Physical Intelligence, 2024", "level": 2}, {"title": "OpenVLA: An Open-Source Vision-Language-Action Model", "url": "https://arxiv.org/abs/2406.09246", "type": "paper", "by": "Kim et al., Stanford, Berkeley, 2024", "level": 2, "note": "An open 7B model and fine-tuning recipe trained on Open X-Embodiment data."}, {"title": "π0.5: a Vision-Language-Action Model with Open-World Generalization", "url": "https://arxiv.org/abs/2504.16054", "type": "paper", "by": "Physical Intelligence, 2025", "level": 3, "note": "Co-training on web data, many robots and subtask prediction to work in homes it has never seen."}, {"title": "LeRobot: fine-tune SmolVLA", "url": "https://huggingface.co/docs/lerobot/smolvla", "type": "project", "by": "Hugging Face, 2025", "level": 2, "build": "SmolVLA, a 450M parameter vision-language-action model, fine-tuned on your own SO-100 or SO-101 dataset and run from language instructions.", "teaches": "What it takes to adapt a pretrained VLA to a new robot and task, and how much data that needs.", "time": "a weekend"}]}, {"id": "worldmodels", "title": "World models for agents and video", "kind": "concept", "track": "embod", "pre": ["dreamer", "jepa", "videogen"], "frontier": true, "core": "A world model predicts the next observation from the current one and an action. Video models trained on huge amounts of footage (Genie, Cosmos) become interactive simulators, while V-JEPA 2 predicts in a learned embedding space instead of pixels and plans robot actions there.", "reach": "Extends Dreamer from one environment to open-ended video, built from latent diffusion and joint-embedding prediction.", "uses": "Generating interactive environments to train and test agents, synthetic driving and robotics simulation, and evaluating a policy without hardware, which is the bottleneck in robot learning rather than a convenience.", "worth": "you work on agents needing a simulator nobody can write by hand; needs Dreamer, joint-embedding prediction, and video generation, a heavy stack.", "resources": [{"title": "Genie 3: A new frontier for world models", "url": "https://deepmind.google/discover/blog/genie-3-a-new-frontier-for-world-models/", "type": "blog", "by": "Google DeepMind, 2025", "level": 1, "note": "What a real-time interactive video world model looks like now."}, {"title": "Genie: Generative Interactive Environments", "url": "https://arxiv.org/abs/2402.15391", "type": "paper", "by": "Bruce et al., Google DeepMind, 2024", "level": 2, "note": "Learns a latent action space from unlabeled internet video, so any clip becomes a playable environment."}, {"title": "V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning", "url": "https://arxiv.org/abs/2506.09985", "type": "paper", "by": "Assran et al., Meta, 2025", "level": 2, "note": "Predicts in embedding space, then after post-training on under 62 hours of unlabeled robot video, plans arm motions toward image goals with no task reward."}, {"title": "Cosmos World Foundation Model Platform for Physical AI", "url": "https://arxiv.org/abs/2501.03575", "type": "paper", "by": "NVIDIA, 2025", "level": 3, "note": "Open-weight video world models, tokenizers and the data pipeline behind them."}, {"title": "Diffusion for World Modeling: Visual Details Matter in Atari", "url": "https://arxiv.org/abs/2405.12399", "type": "paper", "by": "Alonso et al., 2024", "level": 3, "note": "DIAMOND: a diffusion world model good enough to train an Atari agent entirely inside it."}, {"title": "DIAMOND’s diffusion world model on Breakout", "url": "https://github.com/eloialonso/diamond", "type": "project", "by": "Built on Alonso et al., 2024", "level": 3, "build": "With the authors’ code on one GPU, a diffusion world model of Breakout learned from 100k agent steps, an agent trained inside it, and a rerun with 1 denoising step instead of 3.", "teaches": "Why a world model must keep small visual details such as bricks and the score, and what a sampler with too few steps loses.", "time": "a week", "made": true, "done": "The agent’s Breakout return lands near 132.5 with 3 denoising steps and near 50.8 with 1, as in Table 7."}]}, {"id": "vit", "title": "Vision transformers", "kind": "concept", "track": "vision", "pre": ["attention", "resnets"], "frontier": false, "core": "Cut an image into 16 by 16 pixel patches, embed each patch as a token, add position embeddings, and run a standard transformer over the sequence. With little built-in image bias, a ViT needs more data than a CNN but keeps improving with scale.", "reach": "The backbone of CLIP, DINOv2, Segment Anything, vision-language models, VGGT, and diffusion transformers.", "uses": "The image encoder in nearly every multimodal model, satellite and medical imaging pipelines, industrial inspection, and the backbone that diffusion transformers and self-supervised models are built from.", "worth": "you do any vision work from the last few years; transformers and convnets first, and the patching idea takes about an hour.", "resources": [{"title": "Dive into Deep Learning, 11.8: Transformers for Vision", "url": "https://d2l.ai/chapter_attention-mechanisms-and-transformers/vision-transformer.html", "type": "tutorial", "by": "Zhang, Lipton, Li, Smola, 2023", "level": 1, "note": "Builds patch embedding and a ViT in code and trains it on Fashion-MNIST."}, {"title": "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale", "url": "https://arxiv.org/abs/2010.11929", "type": "paper", "by": "Dosovitskiy et al., Google, 2020", "level": 2}, {"title": "Masked Autoencoders Are Scalable Vision Learners", "url": "https://arxiv.org/abs/2111.06377", "type": "paper", "by": "He, Chen, Xie, Li, Dollár, Girshick, 2021", "level": 2, "note": "Hide 75 percent of the patches and reconstruct them: self-supervised pretraining for ViTs."}, {"title": "DINOv2: Learning Robust Visual Features without Supervision", "url": "https://arxiv.org/abs/2304.07193", "type": "paper", "by": "Oquab et al., Meta, 2023", "level": 3}, {"title": "Training data-efficient image transformers & distillation through attention", "url": "https://arxiv.org/abs/2012.12877", "type": "paper", "by": "Touvron et al., Meta, 2020", "level": 3, "note": "How to train a ViT on ImageNet alone, without a huge private dataset."}, {"title": "UvA Deep Learning Tutorial 15: Vision Transformers", "url": "https://uvadlc-notebooks.readthedocs.io/en/latest/tutorial_notebooks/tutorial15/Vision_Transformer.html", "type": "project", "by": "Phillip Lippe, University of Amsterdam, 2021", "level": 1, "build": "A Vision Transformer written from scratch, from splitting images into patches to the classification token, trained on CIFAR-10 and compared with the CNNs of the course’s Tutorial 5.", "teaches": "What a ViT gives up by dropping the convolution’s locality bias, seen as lower accuracy than a ResNet when both train from scratch on a small dataset.", "time": "a day"}]}, {"id": "detection", "title": "Object detection and segmentation", "kind": "concept", "track": "vision", "pre": ["resnets"], "frontier": false, "core": "Detection outputs a box and class for each object; segmentation labels pixels, by class or by object. Two-stage detectors propose regions and classify each (Mask R-CNN adds a mask), while DETR predicts a fixed set of boxes matched one to one with the ground truth.", "reach": "Region features, mask heads, and set matching return in Segment Anything, open-vocabulary detectors, and the grounding skills of vision-language models.", "uses": "Driving perception, factory defect inspection, retail and inventory counting, lesion delineation in medical scans, sports and wildlife analytics, and the crop-and-count stage of most industrial vision pipelines.", "worth": "you ship vision in the real world; convnets are background enough, and the set-matching idea in DETR is the part that lasts.", "resources": [{"title": "Stanford CS231N Deep Learning for Computer Vision, 2025", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rOmsNzYBMe0gJY2XS8AQg16", "type": "lectures", "by": "Stanford, 2025", "level": 1, "note": "Lecture 9: single-stage and two-stage detectors, and semantic, instance, and panoptic segmentation."}, {"title": "Mask R-CNN", "url": "https://arxiv.org/abs/1703.06870", "type": "paper", "by": "He, Gkioxari, Dollár, Girshick, 2017", "level": 2}, {"title": "End-to-End Object Detection with Transformers", "url": "https://arxiv.org/abs/2005.12872", "type": "paper", "by": "Carion et al., Facebook AI, 2020", "level": 2, "note": "DETR: detection as set prediction with a Hungarian matching loss, no anchors or non-maximum suppression."}, {"title": "U-Net: Convolutional Networks for Biomedical Image Segmentation", "url": "https://arxiv.org/abs/1505.04597", "type": "paper", "by": "Ronneberger, Fischer, Brox, 2015", "level": 2, "note": "The encoder-decoder with skip connections that diffusion models later adopted as their denoiser."}, {"title": "Grounding DINO: Marrying DINO with Grounded Pre-Training for Open-Set Object Detection", "url": "https://arxiv.org/abs/2303.05499", "type": "paper", "by": "Liu et al., 2023", "level": 3, "note": "Detect whatever a text prompt names, not a fixed list of classes."}, {"title": "TorchVision Object Detection Finetuning Tutorial", "url": "https://docs.pytorch.org/tutorials/intermediate/torchvision_tutorial.html", "type": "project", "by": "PyTorch documentation", "level": 1, "build": "A pretrained Mask R-CNN fine-tuned to detect and segment pedestrians in the Penn-Fudan dataset, with your own dataset class, transforms, and evaluation.", "teaches": "The practice of training a detector: boxes and masks as targets, a pretrained backbone, and COCO-style evaluation.", "time": "an afternoon", "signature": true}]}, {"id": "sam", "title": "Segment Anything", "kind": "paper", "track": "vision", "pre": ["vit", "detection"], "frontier": false, "core": "Segment whatever a prompt points at: given an image and a click, box, or rough mask, return that object’s mask. A heavy ViT encodes the image once, a light decoder answers each prompt in milliseconds, and the model helped label its 1.1 billion training masks.", "reach": "SAM 2 adds memory for video and SAM 3 takes text prompts; its masks feed 3D reconstruction, robotics, and labeling pipelines.", "uses": "Cutting annotation cost in labeling tools, microscopy and medical segmentation after light adaptation, object masks for robot grasping, and selection and rotoscoping in photo and video editors.", "worth": "you need masks without training a segmenter; ViT and detection basics suffice, and the prompting interface is the whole lesson.", "resources": [{"title": "Introducing Segment Anything: Working toward the first foundation model for image segmentation", "url": "https://ai.meta.com/blog/segment-anything-foundation-model-image-segmentation/", "type": "blog", "by": "Meta AI, 2023", "level": 1}, {"title": "Segment Anything", "url": "https://arxiv.org/abs/2304.02643", "type": "paper", "by": "Kirillov et al., Meta, 2023", "level": 2}, {"title": "SAM 2: Segment Anything in Images and Videos", "url": "https://arxiv.org/abs/2408.00714", "type": "paper", "by": "Ravi et al., Meta, 2024", "level": 2, "note": "A streaming memory lets one model segment and track objects through video."}, {"title": "SAM 3: Segment Anything with Concepts", "url": "https://arxiv.org/abs/2511.16719", "type": "paper", "by": "Carion et al., Meta, 2025", "level": 3, "note": "Prompt with a noun phrase or an example and get every matching instance."}, {"title": "facebookresearch/sam2", "url": "https://github.com/facebookresearch/sam2", "type": "code", "by": "Meta, 2024", "level": 2}, {"title": "Fine-tune SAM on a custom dataset", "url": "https://github.com/NielsRogge/Transformers-Tutorials/blob/master/SAM/Fine_tune_SAM_(segment_anything)_on_a_custom_dataset.ipynb", "type": "project", "by": "Niels Rogge, Hugging Face, 2023", "level": 2, "build": "SAM’s mask decoder fine-tuned on 130 breast ultrasound images with box prompts taken from the ground truth masks, the image and prompt encoders frozen, as MedSAM does.", "teaches": "How SAM splits the work between a heavy image encoder run once and a light prompt decoder, and how little needs training to adapt it to a new domain.", "time": "a day"}]}, {"id": "geometry3d", "title": "Multi-view geometry and 3D vision", "kind": "concept", "track": "vision", "pre": ["linalg", "optim"], "frontier": false, "core": "A pinhole camera maps a 3D point to a pixel with a 3 by 4 projection matrix. A pixel’s match in a second image must lie on a known line (epipolar geometry), and structure from motion recovers all cameras and points by minimizing reprojection error.", "reach": "NeRF and Gaussian splatting start from the cameras that structure from motion (COLMAP) estimates; DUSt3R and VGGT learn to replace it.", "uses": "Camera tracking in visual effects, drone and survey photogrammetry, SLAM on robots and headsets, and the pose estimation that every capture pipeline must finish before reconstruction can start.", "worth": "you touch 3D, robotics, or augmented reality; linear algebra and optimization are the only prerequisites, and this geometry does not go stale.", "resources": [{"title": "Camera Calibration | Uncalibrated Stereo", "url": "https://www.youtube.com/playlist?list=PL2zRqk16wsdoCCLpou-dGo7QQNks1Ppzo", "type": "lectures", "by": "Shree Nayar, Columbia, First Principles of Computer Vision", "level": 1}, {"title": "Foundations of Computer Vision", "url": "https://visionbook.mit.edu/", "type": "book", "by": "Torralba, Isola, Freeman, MIT Press, 2024", "level": 1, "note": "Chapters 39, 40, and 44: camera calibration, stereo, and multiview geometry with structure from motion."}, {"title": "Structure-from-Motion Revisited", "url": "https://openaccess.thecvf.com/content_cvpr_2016/html/Schonberger_Structure-From-Motion_Revisited_CVPR_2016_paper.html", "type": "paper", "by": "Schönberger, Frahm, CVPR 2016", "level": 2, "note": "The incremental pipeline inside COLMAP, the tool most 3D papers use for cameras."}, {"title": "Computer Vision: Algorithms and Applications, 2nd ed.", "url": "https://szeliski.org/Book/", "type": "book", "by": "Richard Szeliski, 2022", "level": 2, "note": "The chapters on structure from motion and SLAM, and on depth estimation. Free PDF after a short form."}, {"title": "Multiple View Geometry in Computer Vision", "url": "https://www.robots.ox.ac.uk/~vgg/hzbook/", "type": "book", "by": "Hartley, Zisserman, 2nd ed., 2004", "level": 3, "paid": true}, {"title": "CS180 Project 3: (Auto)stitching and Photo Mosaics", "url": "https://cal-cs180.github.io/fa25/hw/proj3/index.html", "type": "project", "by": "Berkeley CS180, Fall 2025", "level": 1, "build": "Panoramas from your own photos: homographies from hand-picked correspondences, warping and blending, then automatic matching with Harris corners, feature descriptors, and RANSAC.", "teaches": "Projective geometry you can see, and why robust estimation is needed once matches come from an algorithm instead of a person.", "time": "two weeks"}]}, {"id": "vlm", "title": "Vision-language models", "kind": "concept", "track": "vision", "pre": ["vit", "contrastive", "sft", "crossattn"], "frontier": false, "core": "Turn an image into tokens an LLM can read. A pretrained vision encoder such as CLIP embeds image patches, a small projector maps them into the LLM’s embedding space, and training on captions and then visual instructions teaches the LLM to answer questions about images.", "reach": "The starting point for robot policies (VLAs), document and screen agents, and judges of generated images and video.", "uses": "Document and receipt extraction, agents that read a screen and click, accessibility descriptions, moderation review, and chart or diagram questions in the assistants people already use daily.", "worth": "you build with multimodal models; needs ViT, contrastive learning, and instruction tuning, and the projector design is simpler than it first appears.", "resources": [{"title": "Understanding Multimodal LLMs", "url": "https://magazine.sebastianraschka.com/p/understanding-multimodal-llms", "type": "blog", "by": "Sebastian Raschka, 2024", "level": 1, "note": "Image tokens fed into the decoder versus cross-attention, then a tour of recent models."}, {"title": "Visual Instruction Tuning", "url": "https://arxiv.org/abs/2304.08485", "type": "paper", "by": "Liu, Li, Wu, Lee, 2023", "level": 2, "note": "LLaVA: a CLIP encoder, one projection, and GPT-written visual instructions."}, {"title": "nanoVLM", "url": "https://github.com/huggingface/nanoVLM", "type": "project", "by": "Hugging Face, 2025", "level": 2, "build": "A 222M parameter vision-language model, a SigLIP image encoder joined to a SmolLM2 language model, trained from about 750 lines of PyTorch on one GPU.", "teaches": "How an image becomes tokens a language model can read, and what the projection between them has to learn.", "time": "a weekend"}, {"title": "What matters when building vision-language models?", "url": "https://arxiv.org/abs/2405.02246", "type": "paper", "by": "Laurençon, Tronchon, Cord, Sanh, 2024", "level": 3, "note": "Controlled ablations of encoder, connector, and data choices."}, {"title": "Flamingo: a Visual Language Model for Few-Shot Learning", "url": "https://arxiv.org/abs/2204.14198", "type": "paper", "by": "Alayrac et al., DeepMind, 2022", "level": 3, "note": "The cross-attention design, trained on interleaved web images and text."}]}, {"id": "rendering", "title": "Rendering and differentiable rendering", "kind": "concept", "track": "graphics", "pre": ["calculus", "montecarlo"], "frontier": false, "core": "A pixel’s color is the light arriving along its camera ray, and the rendering equation defines that light recursively through every reflection; path tracing estimates it by Monte Carlo. A differentiable renderer also returns gradients of pixels with respect to geometry, materials, lights, and cameras.", "reach": "NeRF and Gaussian splatting are differentiable renderers of learned scenes; neural denoisers and DLSS clean up Monte Carlo noise in real time.", "uses": "Path-traced film, animation, and product imagery, game engine lighting, and, in differentiable form, recovering geometry, materials, and lighting from photographs, plus generating labeled synthetic training data.", "worth": "you work on 3D vision or generative 3D; needs calculus and Monte Carlo, and the rendering equation explains most pipeline design choices.", "resources": [{"title": "Scratchapixel", "url": "https://www.scratchapixel.com/", "type": "tutorial", "by": "Scratchapixel", "level": 1, "note": "The Foundations of 3D Rendering lessons, from the ray-tracing primer to Global Illumination and Path Tracing."}, {"title": "Physically Based Rendering: From Theory to Implementation", "url": "https://pbr-book.org/", "type": "book", "by": "Pharr, Jakob, Humphreys, 4th ed., 2023", "level": 2, "note": "Chapters 2, 4, and 13: Monte Carlo integration, radiometry, and the light transport equation with path tracing."}, {"title": "Differentiable Rendering: A Survey", "url": "https://arxiv.org/abs/2006.12057", "type": "paper", "by": "Kato et al., 2020", "level": 2}, {"title": "Mitsuba 3: Inverse rendering tutorials", "url": "https://mitsuba.readthedocs.io/en/stable/src/inverse_rendering_tutorials.html", "type": "tutorial", "by": "Jakob et al., EPFL, 2022", "level": 2, "note": "Start with Gradient-based optimization, then Radiance Field Reconstruction (NeRF-like)."}, {"title": "Physics-Based Differentiable Rendering: A Comprehensive Introduction", "url": "https://courses.shuangz.com/pbdr-course-sg20/", "type": "course", "by": "Zhao, Jakob, Li, SIGGRAPH 2020", "level": 3, "note": "Why visibility makes pixel gradients hard and how edge and boundary terms fix them."}, {"title": "Ray Tracing in One Weekend", "url": "https://raytracing.github.io/books/RayTracingInOneWeekend.html", "type": "project", "by": "Shirley, Black, Hollasch, v4.0.2, 2025", "level": 1, "build": "A ray tracer from an empty file: rays, sphere hits, antialiasing, diffuse, metal, and glass materials, a movable camera, and defocus blur, ending in a render of many spheres.", "teaches": "How a pixel’s color becomes an average over random light paths, and what each extra sample per pixel buys.", "time": "a weekend"}]}, {"id": "neuralfields", "title": "Neural fields and implicit surfaces", "kind": "concept", "track": "graphics", "pre": ["backprop", "rendering"], "frontier": false, "core": "Represent a signal as a network from coordinates to values, such as (x, y) to color or (x, y, z) to signed distance from a surface. Plain MLPs blur fine detail, so coordinates first pass through Fourier features, sine activations, or learned hash grids.", "reach": "NeRF is a neural field rendered by volume rendering; the same coordinate networks appear in physics-informed networks and neural operators.", "uses": "Representing shapes as signed distance functions in geometry and fabrication tools, reconstructing CT and MRI volumes from sparse measurements, compressing signals into network weights, and serving as the substrate under NeRF.", "worth": "you head toward NeRF, splatting, or scientific reconstruction; backprop and rendering basics are enough, and Fourier features are the one trick.", "resources": [{"title": "Stanford CS231N Deep Learning for Computer Vision, 2025", "url": "https://www.youtube.com/playlist?list=PLoROMvodv4rOmsNzYBMe0gJY2XS8AQg16", "type": "lectures", "by": "Stanford, 2025", "level": 1, "note": "Lecture 15: 3D shape representations, shape reconstruction, and neural implicit representations."}, {"title": "Fourier Features Let Networks Learn High Frequency Functions in Low Dimensional Domains", "url": "https://arxiv.org/abs/2006.10739", "type": "paper", "by": "Tancik et al., 2020", "level": 2, "note": "Why coordinate MLPs blur, and the random Fourier feature fix."}, {"title": "DeepSDF: Learning Continuous Signed Distance Functions for Shape Representation", "url": "https://arxiv.org/abs/1901.05103", "type": "paper", "by": "Park et al., 2019", "level": 2}, {"title": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "url": "https://arxiv.org/abs/2201.05989", "type": "paper", "by": "Müller, Evans, Schied, Keller, NVIDIA, 2022", "level": 2, "note": "Learned multiresolution hash grids cut training to seconds."}, {"title": "Implicit Neural Representations with Periodic Activation Functions", "url": "https://arxiv.org/abs/2006.09661", "type": "paper", "by": "Sitzmann, Martel, Bergman, Lindell, Wetzstein, 2020", "level": 3, "note": "SIREN: sine activations give fields with clean derivatives, so a loss can act on gradients."}, {"title": "Neural Fields in Visual Computing and Beyond", "url": "https://arxiv.org/abs/2111.11426", "type": "paper", "by": "Xie et al., 2021", "level": 3, "note": "Part I sorts the design space: representations, architectures, forward maps, and generalization."}, {"title": "Fourier features for a coordinate MLP", "url": "https://arxiv.org/abs/2006.10739", "type": "project", "by": "Built on Tancik et al., 2020", "level": 1, "build": "A four layer MLP with 256 channels fit to 512 by 512 photos from every other pixel, with no input mapping, positional encoding, and Gaussian Fourier features, scored on the held-out pixels.", "teaches": "Why a plain coordinate MLP blurs detail, and how mapping coordinates to sines and cosines at chosen frequencies lets it fit high frequencies.", "time": "an afternoon", "made": true, "done": "Gaussian features beat no mapping by about 6 dB of held-out PSNR on natural images, as in Table 1 (25.57 against 19.32)."}]}, {"id": "nerf", "title": "Neural radiance fields", "kind": "paper", "track": "graphics", "pre": ["neuralfields", "geometry3d"], "frontier": false, "core": "A scene is a network mapping a 3D point and view direction to density and color. A pixel is the sum of colors along its ray, weighted by density and by how much light the nearer points let through; fit the network to posed photos.", "reach": "Gaussian splatting keeps its rendering model and drops the network; DreamFusion optimizes a NeRF under a diffusion prior.", "uses": "Photorealistic capture of real places, including immersive map views, heritage and property scanning, and visual effects reconstruction. In research it also gave robotics a differentiable representation of a whole scene.", "worth": "you want to understand modern 3D capture; needs neural fields and multi-view geometry, though splatting has replaced it in most production work.", "resources": [{"title": "Jon Barron - Understanding and Extending Neural Radiance Fields", "url": "https://www.youtube.com/watch?v=HfJpQCBTqZs", "type": "video", "by": "Jon Barron, MIT Vision and Graphics Seminar, 2021", "level": 1}, {"title": "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis", "url": "https://arxiv.org/abs/2003.08934", "type": "paper", "by": "Mildenhall, Srinivasan, Tancik, Barron, Ramamoorthi, Ng, 2020", "level": 2}, {"title": "Volume Rendering Digest (for NeRF)", "url": "https://arxiv.org/abs/2209.02417", "type": "notes", "by": "Tagliasacchi, Mildenhall, 2022", "level": 2, "note": "The volume rendering integral and its discrete form, derived in NeRF’s notation in a few pages."}, {"title": "nerfstudio-project/nerfstudio", "url": "https://github.com/nerfstudio-project/nerfstudio", "type": "code", "by": "Tancik et al., 2023", "level": 2}, {"title": "Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields", "url": "https://arxiv.org/abs/2111.12077", "type": "paper", "by": "Barron, Mildenhall, Verbin, Srinivasan, Hedman, 2022", "level": 3, "note": "Extends NeRF to unbounded real scenes with a nonlinear scene parameterization, online distillation, and a distortion loss."}, {"title": "CS180 Project 4: Neural Radiance Field", "url": "https://cal-cs180.github.io/fa25/hw/proj4/index.html", "type": "project", "by": "Berkeley CS180, Fall 2025", "level": 2, "build": "A neural field that fits a 2D image, then a NeRF of a Lego scene from posed images, then one of an object you photographed and posed yourself with ArUco markers.", "teaches": "Volume rendering, ray sampling, and positional encoding from first principles, and how much of 3D capture is camera calibration.", "time": "two weeks", "signature": true}]}, {"id": "gsplat", "title": "3D Gaussian splatting", "kind": "paper", "track": "graphics", "pre": ["nerf"], "frontier": false, "core": "Represent a scene as millions of 3D Gaussians, each with a position, shape, opacity, and view-dependent color. Render by projecting them onto the image and blending them front to back, and fit them to photos by gradient descent, splitting and pruning as training goes.", "reach": "Rasterizing instead of marching rays trains in minutes and renders in real time; feed-forward models such as pixelSplat now predict the Gaussians directly.", "uses": "Real-time viewing of captured scenes on ordinary hardware, visual effects and virtual production, telepresence and avatar capture, and building simulation assets for robotics from a phone walkthrough.", "worth": "you work on 3D capture or rendering today; learn NeRF for the imaging model, then come here, where the tooling lives.", "resources": [{"title": "Introduction to 3D Gaussian Splatting", "url": "https://huggingface.co/blog/gaussian-splatting", "type": "blog", "by": "Dylan Ebert, Hugging Face, 2023", "level": 1}, {"title": "3D Gaussian Splatting for Real-Time Radiance Field Rendering", "url": "https://arxiv.org/abs/2308.04079", "type": "paper", "by": "Kerbl, Kopanas, Leimkühler, Drettakis, 2023", "level": 2}, {"title": "Mathematical Supplement for the gsplat Library", "url": "https://arxiv.org/abs/2312.02121", "type": "notes", "by": "Ye, Kanazawa, 2023", "level": 2, "note": "The forward and backward passes of differentiable Gaussian splatting, written out in full."}, {"title": "nerfstudio-project/gsplat", "url": "https://github.com/nerfstudio-project/gsplat", "type": "code", "by": "Ye et al., 2024", "level": 2}, {"title": "2D Gaussian Splatting for Geometrically Accurate Radiance Fields", "url": "https://arxiv.org/abs/2403.17888", "type": "paper", "by": "Huang, Yu, Chen, Geiger, Gao, 2024", "level": 3, "note": "Flat disks instead of blobs, so the splats recover surfaces."}, {"title": "CMU 16-825 Assignment 3, Part B: 3D Gaussian Splatting", "url": "https://github.com/learning3d/assignment3", "type": "project", "by": "CMU 16-825 Learning for 3D Vision, Fall 2026", "level": 2, "build": "A 3D Gaussian rasterizer in PyTorch that projects Gaussians to 2D, sorts them by depth, and alpha composites them, used to render pretrained splats and then to train Gaussians on a scene.", "teaches": "Every step between a cloud of 3D Gaussians and a pixel, written by hand, and how a photo’s gradient reaches each Gaussian’s shape and color.", "time": "a week"}]}, {"id": "sds", "title": "Score distillation and text-to-3D", "kind": "paper", "track": "graphics", "pre": ["nerf", "guidance"], "frontier": true, "core": "Use a pretrained image diffusion model, conditioned on a text prompt, as a critic for a 3D scene. Render from a random camera, add noise, and nudge the render toward the denoiser’s prediction; over many views, gradients through the renderer shape a consistent 3D object.", "reach": "Variational score distillation and multi-view diffusion fix its oversaturated colors and repeated faces; feed-forward 3D generators now often replace the slow per-prompt optimization.", "uses": "Generating 3D assets and textures from text for games, mockups, and augmented reality, and optimizing anything renderable, such as materials or avatars, under an image model’s judgment rather than a dataset.", "worth": "you generate 3D content, or want the score-as-critic trick itself; needs NeRF and guidance, and feed-forward generators may make it optional.", "resources": [{"title": "DreamFusion: Text-to-3D using 2D Diffusion", "url": "https://dreamfusion3d.github.io/", "type": "blog", "by": "Poole, Jain, Barron, Mildenhall, Google, 2022", "level": 1}, {"title": "DreamFusion: Text-to-3D using 2D Diffusion", "url": "https://arxiv.org/abs/2209.14988", "type": "paper", "by": "Poole, Jain, Barron, Mildenhall, 2022", "level": 2}, {"title": "threestudio-project/threestudio", "url": "https://github.com/threestudio-project/threestudio", "type": "code", "by": "Guo et al., 2023", "level": 2, "note": "DreamFusion, ProlificDreamer, MVDream, and other score distillation methods in one framework."}, {"title": "ProlificDreamer: High-Fidelity and Diverse Text-to-3D Generation with Variational Score Distillation", "url": "https://arxiv.org/abs/2305.16213", "type": "paper", "by": "Wang et al., 2023", "level": 3}, {"title": "MVDream: Multi-view Diffusion for 3D Generation", "url": "https://arxiv.org/abs/2308.16512", "type": "paper", "by": "Shi et al., 2023", "level": 3}, {"title": "CMU 16-825 Assignment 4, Part 2: Diffusion-guided Optimization", "url": "https://github.com/learning3d/assignment4", "type": "project", "by": "CMU 16-825 Learning for 3D Vision, Fall 2025", "level": 2, "build": "The SDS loss on Stable Diffusion, with and without guidance, used to optimize an image, then the texture of a cow mesh, then a NeRF, all from text prompts.", "teaches": "What the score distillation gradient pushes on, and which DreamFusion tricks, such as shading and view-dependent prompts, keep a NeRF from growing extra faces.", "time": "a week"}]}, {"id": "recon3d", "title": "Feed-forward 3D reconstruction", "kind": "concept", "track": "graphics", "pre": ["geometry3d", "vit"], "frontier": true, "core": "Skip per-scene optimization: a transformer reads unposed images and outputs, for every pixel, its 3D point in a shared frame, from which cameras and depth follow. DUSt3R does this for image pairs; VGGT takes one to hundreds of views in one forward pass.", "reach": "Replaces COLMAP as the first stage of NeRF and Gaussian splatting pipelines, and gives robots and video models fast 3D.", "uses": "Turning a handful of unposed photographs into geometry and cameras in one pass, which speeds mapping, augmented reality placement, robot scene understanding, and the front end of capture pipelines.", "worth": "you need 3D from casual photos; needs multi-view geometry and ViTs, and the models improve fast enough to be worth tracking.", "resources": [{"title": "DUSt3R: Geometric 3D Vision Made Easy", "url": "https://arxiv.org/abs/2312.14132", "type": "paper", "by": "Wang, Leroy, Cabon, Chidlovskii, Revaud, 2023", "level": 2}, {"title": "VGGT: Visual Geometry Grounded Transformer", "url": "https://arxiv.org/abs/2503.11651", "type": "paper", "by": "Wang, Chen, Karaev, Vedaldi, Rupprecht, Novotny, 2025", "level": 2}, {"title": "facebookresearch/vggt", "url": "https://github.com/facebookresearch/vggt", "type": "code", "by": "Oxford VGG and Meta, 2025", "level": 1, "note": "Run it on your own photos and inspect the cameras and point cloud."}, {"title": "LRM: Large Reconstruction Model for Single Image to 3D", "url": "https://arxiv.org/abs/2311.04400", "type": "paper", "by": "Hong et al., 2023", "level": 3, "note": "One image in, a radiance field out in five seconds, from a transformer trained on about a million objects."}, {"title": "pixelSplat: 3D Gaussian Splats from Image Pairs for Scalable Generalizable 3D Reconstruction", "url": "https://arxiv.org/abs/2312.12337", "type": "paper", "by": "Charatan, Li, Tagliasacchi, Sitzmann, 2023", "level": 3}, {"title": "Score VGGT and DUSt3R camera poses on CO3Dv2", "url": "https://arxiv.org/abs/2503.11651", "type": "project", "by": "Built on Wang, Chen, Karaev, Vedaldi, Rupprecht, Novotny, 2025", "level": 2, "build": "Your own pose metric, the area under the accuracy curve up to 30 degrees, applied on one GPU to VGGT and DUSt3R with 10 random frames per CO3Dv2 sequence.", "teaches": "How feed-forward reconstruction is judged against ground truth cameras, and what one forward pass gains over pairwise prediction with global alignment.", "time": "a weekend", "made": true, "done": "Feed-forward VGGT scores AUC@30 near 88.2 and DUSt3R near 76.7, the gap in Table 1, with VGGT taking about 0.2 seconds per scene."}]}, {"id": "videogen", "title": "Video generation", "kind": "concept", "track": "graphics", "pre": ["latent", "fm"], "frontier": true, "core": "Compress video into a grid of spacetime latent patches with a video autoencoder, then train a diffusion or flow matching transformer to denoise all patches together, conditioned on text. Attention across frames keeps motion consistent; data curation and scale do most of the rest.", "reach": "Made interactive, video generators become world models such as Genie and Cosmos; autoregressive few-step variants stream video in real time.", "uses": "Advertising, previsualization, and concept footage in film and games, with tools such as Sora, Veo, and Runway, and, once made interactive, the simulators robotics teams train agents inside.", "worth": "you work on generative media or world models; needs latent diffusion and flow matching, plus far more compute than a laptop has.", "resources": [{"title": "Diffusion Models for Video Generation", "url": "https://lilianweng.github.io/posts/2024-04-12-diffusion-video/", "type": "blog", "by": "Lilian Weng, 2024", "level": 1}, {"title": "Video generation models as world simulators", "url": "https://openai.com/index/video-generation-models-as-world-simulators/", "type": "blog", "by": "Brooks, Peebles et al., OpenAI, 2024", "level": 1, "note": "The Sora report: spacetime patches and a diffusion transformer."}, {"title": "Movie Gen: A Cast of Media Foundation Models", "url": "https://arxiv.org/abs/2410.13720", "type": "paper", "by": "Polyak et al., Meta, 2024", "level": 2, "note": "A full recipe for a 30B model: architecture, latent space, training objective, data curation, and parallelism."}, {"title": "Wan: Open and Advanced Large-Scale Video Generative Models", "url": "https://arxiv.org/abs/2503.20314", "type": "paper", "by": "Wan Team, Alibaba, 2025", "level": 3, "note": "Open 1.3B and 14B models, with the VAE, data curation, and training described."}, {"title": "Self Forcing: Bridging the Train-Test Gap in Autoregressive Video Diffusion", "url": "https://arxiv.org/abs/2506.08009", "type": "paper", "by": "Huang, Li, He, Zhou, Shechtman, 2025", "level": 3, "note": "Each frame is trained on the model’s own earlier frames, so a few-step video model can stream in real time."}, {"title": "A small video diffusion model on UCF-101, with and without image frames", "url": "https://arxiv.org/abs/2204.03458", "type": "project", "by": "Built on Ho, Salimans, Gritsenko, Chan, Norouzi, Fleet, 2022", "level": 3, "build": "A space-time factored U-Net that denoises 16 frame UCF-101 clips at 64 by 64 together on one GPU, trained once on video alone and once with 8 independent image frames per clip.", "teaches": "How attention split into spatial and temporal blocks lets one network denoise a whole clip, and how still frames add cheap signal about appearance.", "time": "two weeks", "made": true, "done": "Adding 8 image frames per clip lowers FVD, as in Table 4, where FVD falls from 202 with no image frames to 58 with 8."}]}, {"id": "neuralrender", "title": "Neural supersampling and denoising (DLSS)", "kind": "concept", "track": "graphics", "pre": ["rendering", "resnets"], "frontier": false, "core": "Render fewer pixels and frames, and let a network fill in the rest. Using motion vectors and earlier frames, it upsamples low-resolution renders, removes the noise of ray tracing at a few samples per pixel, and generates extra frames between rendered ones.", "reach": "Makes path tracing affordable in games; DLSS 4 moved these networks from convolutions to transformers.", "uses": "The upscaling and frame generation in modern games and consoles, denoisers that make real-time ray tracing viable at all, and offline render denoising in film production.", "worth": "you work in real-time graphics; rendering and convnet basics suffice, and it is the clearest case of a network inside a shipped loop.", "resources": [{"title": "NVIDIA DLSS 2.0: A Big Leap In AI Rendering", "url": "https://www.nvidia.com/en-us/geforce/news/nvidia-dlss-2-0-a-big-leap-in-ai-rendering/", "type": "blog", "by": "Andrew Burnes, NVIDIA, 2020", "level": 1, "note": "Low-resolution frames plus motion vectors, accumulated over time and trained against 16K references."}, {"title": "DLSS 4: Transforming Real-Time Graphics with AI", "url": "https://research.nvidia.com/labs/adlr/DLSS4/", "type": "blog", "by": "NVIDIA Research, 2025", "level": 2, "note": "Multi frame generation, and transformer models for super resolution and ray-traced denoising."}, {"title": "Neural Supersampling for Real-time Rendering", "url": "https://research.facebook.com/publications/neural-supersampling-for-real-time-rendering/", "type": "paper", "by": "Xiao, Nouri, Chapman, Fix, Lanman, Kaplanyan, Facebook Reality Labs, 2020", "level": 2, "note": "A published DLSS-style network: color, depth, and motion vectors from several frames, upsampled 4 by 4 in real time."}, {"title": "Kernel-Predicting Convolutional Networks for Denoising Monte Carlo Renderings", "url": "https://jannovak.info/publications/KPCN/index.html", "type": "paper", "by": "Bako et al., Disney Research and Pixar, 2017", "level": 2, "note": "Predict a filter kernel per pixel and average its noisy neighbors with it; trained on one Pixar film, it denoises others."}, {"title": "Introducing NVIDIA DLSS 3", "url": "https://www.nvidia.com/en-us/geforce/news/dlss3-ai-powered-neural-graphics-innovations/", "type": "blog", "by": "Lin, Burnes, NVIDIA, 2022", "level": 2, "note": "The first frame generation: two rendered frames, optical flow, and motion vectors into one new frame."}, {"title": "Intel Open Image Denoise", "url": "https://www.openimagedenoise.org/", "type": "code", "by": "Intel", "level": 2, "note": "Open-source learned denoising filters for path tracers, trained from 1 sample per pixel to nearly converged."}, {"title": "Train a render denoiser without clean references", "url": "https://arxiv.org/abs/1803.04189", "type": "project", "by": "Built on Lehtinen et al., 2018", "level": 2, "build": "Scenes path traced at 64 samples per pixel with albedo and normal buffers, then a U-Net denoiser trained on one GPU, once against converged references and once against a second 64 sample render.", "teaches": "Why the zero-mean noise of Monte Carlo rendering lets a second noisy render stand in for a converged one as the training target.", "time": "a week", "made": true, "done": "Training on noisy targets lands within about 0.5 dB of training on clean ones, as in Section 3.3, where clean targets reach 31.83 dB from 22.31 dB inputs."}]}, {"id": "biobasics", "title": "Molecular biology for ML researchers", "kind": "concept", "track": "bio", "pre": [], "frontier": false, "core": "A cell copies each gene’s DNA into RNA and reads it three letters at a time to chain amino acids into a protein, which folds into the shape that does its job. Every cell carries the same genome but expresses different genes.", "reach": "Sequences, structures, and per-cell expression counts are the data that structure prediction, protein and DNA language models, and single-cell models learn from.", "uses": "Reading the problem statement of a biology paper without guessing, and telling which object a model predicts, a sequence, a structure, or a per-cell count. Most confusion in the field reduces to that.", "worth": "you intend to work on biology for machine learning; no prerequisites, about a week, and nothing downstream parses without it.", "resources": [{"title": "MIT 7.01SC: Fundamentals of Biology", "url": "https://ocw.mit.edu/courses/7-01sc-fundamentals-of-biology-fall-2011/", "type": "course", "by": "Lander, Weinberg, Jacks, Sive, Walker, Chisholm, Mischke, MIT OCW, 2011", "level": 1, "note": "The Biochemistry and Molecular Biology units, with lecture videos and problem solving sessions."}, {"title": "Biology 2e", "url": "https://openstax.org/details/books/biology-2e", "type": "book", "by": "Clark, Douglas, Choi, OpenStax, 2018", "level": 1, "note": "Chapter 3 on biological macromolecules, then Chapters 14 to 16 on DNA, genes and proteins, and gene expression."}, {"title": "Cell Biology by the Numbers", "url": "https://book.bionumbers.org/", "type": "book", "by": "Ron Milo, Rob Phillips, 2015", "level": 2, "note": "Parts I and IV give the sizes and speeds of the molecules and machines of the central dogma."}, {"title": "Rosalind Bioinformatics Stronghold, first problems", "url": "https://rosalind.info/problems/list-view/", "type": "project", "by": "Rosalind project", "level": 1, "note": "Work the Bioinformatics Stronghold list in order; the first dozen problems cover the basics.", "build": "Programs for the opening Stronghold problems: counting nucleotides, transcribing DNA to RNA, reverse complementing a strand, translating RNA to protein, and finding a motif.", "teaches": "The central dogma written as code, with the strand and indexing conventions every later bioinformatics tool assumes.", "time": "a weekend"}]}, {"id": "structure", "title": "Protein structure prediction", "kind": "paper", "track": "bio", "pre": ["biobasics", "triattn"], "frontier": false, "core": "A protein’s sequence determines its 3D shape. AlphaFold 2 reads the sequence with an alignment of its evolutionary relatives, whose paired mutations show which residues touch, refines a residue pair representation with attention, and builds atom coordinates with a per-residue confidence.", "reach": "AlphaFold 3 replaces the structure module with diffusion, the step to protein generation; ESMFold replaces the alignment with a protein language model.", "uses": "Structural biology that used to require crystallography, target assessment in drug discovery, enzyme and antibody engineering, and databases of predicted structures now consulted about as routinely as experimental ones.", "worth": "you want to do protein machine learning; needs the biology basics and pair representations, and it is the field’s shared reference point.", "resources": [{"title": "AlphaFold: A practical guide", "url": "https://www.ebi.ac.uk/training/online/courses/alphafold/", "type": "course", "by": "Magana, Kovalevskiy, EMBL-EBI with Google DeepMind, 2024", "level": 1, "note": "The introductory guide, then Inputs and outputs, which explains the pLDDT and PAE confidence scores."}, {"title": "Highly accurate protein structure prediction with AlphaFold", "url": "https://www.nature.com/articles/s41586-021-03819-2", "type": "paper", "by": "Jumper et al., DeepMind, Nature 2021", "level": 2, "note": "The Evoformer and End-to-end structure prediction sections with Figure 3; the Supplementary Information spells out every algorithm."}, {"title": "The Illustrated AlphaFold", "url": "https://elanapearl.github.io/blog/2024/the-illustrated-alphafold/", "type": "blog", "by": "Elana Simon, Jake Silberg, 2024", "level": 2, "note": "AlphaFold 3 drawn module by module, from the MSA module through the Pairformer to the diffusion module."}, {"title": "aqlaboratory/openfold", "url": "https://github.com/aqlaboratory/openfold", "type": "code", "by": "Ahdritz, AlQuraishi et al., 2022", "level": 3, "note": "A trainable PyTorch reproduction of AlphaFold 2."}, {"title": "Boltz-1: Democratizing Biomolecular Interaction Modeling", "url": "https://www.biorxiv.org/content/10.1101/2024.11.19.624167v1", "type": "paper", "by": "Wohlwend, Corso, Passaro et al., MIT, 2024", "level": 3, "note": "An open reproduction of AlphaFold 3 with training code and weights."}, {"title": "ColabFold", "url": "https://github.com/sokrypton/ColabFold", "type": "project", "by": "Mirdita, Schütze, Moriwaki, Heo, Ovchinnikov, Steinegger, 2022", "level": 1, "build": "Structure predictions for proteins and complexes of your choice in a free Colab notebook, read through their pLDDT and PAE confidence scores.", "teaches": "What AlphaFold’s confidence scores mean, and how they warn you when a prediction should not be trusted.", "time": "an afternoon"}]}, {"id": "plm", "title": "Protein language models", "kind": "concept", "track": "bio", "pre": ["biobasics", "lm"], "frontier": false, "core": "Train a masked language model on millions of natural protein sequences. To fill in hidden amino acids it must learn which positions mutate together, so its attention recovers residue contacts, its likelihoods score mutations without labels, and ESMFold predicts structure from its embeddings.", "reach": "Replaces the alignment in structure prediction, and ESM3 extends it to generate sequence, structure, and function together for protein design.", "uses": "Scoring mutations without running experiments, steering protein engineering campaigns toward better enzymes and antibodies, predicting structure without alignments, and supplying embeddings that downstream property predictors sit on top of.", "worth": "you want protein work from a language-modeling background; needs biology basics and language modeling, and it is the cheapest entry point.", "resources": [{"title": "Deep Learning with Proteins", "url": "https://huggingface.co/blog/deep-learning-with-proteins", "type": "blog", "by": "Matthew Carrigan, Hugging Face, 2022", "level": 1, "note": "Explains proteins to ML readers, then links notebooks that fine-tune ESM-2 and run ESMFold."}, {"title": "Evolutionary-scale prediction of atomic level protein structure with a language model", "url": "https://www.biorxiv.org/content/10.1101/2022.07.20.500902v1", "type": "paper", "by": "Lin et al., Meta AI, 2022; Science 2023", "level": 2, "note": "ESM-2 and ESMFold: contacts and structure emerge from the language model as it scales."}, {"title": "Language models enable zero-shot prediction of the effects of mutations on protein function", "url": "https://www.biorxiv.org/content/10.1101/2021.07.09.450648v1", "type": "paper", "by": "Meier et al., Meta AI, 2021", "level": 2, "note": "ESM-1v: the likelihood ratio of mutant to original amino acid predicts measured fitness with no training labels."}, {"title": "Simulating 500 million years of evolution with a language model", "url": "https://www.biorxiv.org/content/10.1101/2024.07.01.600583v1", "type": "paper", "by": "Hayes et al., EvolutionaryScale, 2024; Science 2025", "level": 3, "note": "ESM3 tokenizes sequence, structure, and function and trains one masked model over all three, then uses it to design a new fluorescent protein."}, {"title": "facebookresearch/esm", "url": "https://github.com/facebookresearch/esm", "type": "code", "by": "Meta AI, 2019 to 2023", "level": 2, "note": "Weights and examples for ESM-2, ESMFold, and ESM-1v."}, {"title": "ESM: zero-shot variant prediction", "url": "https://github.com/facebookresearch/esm/tree/main/examples/variant-prediction", "type": "project", "by": "Meier et al., Meta AI, 2021", "level": 2, "build": "Zero-shot scores for every mutation in a deep mutational scan of beta-lactamase from an ensemble of ESM-1v models, compared with the measured effects by rank correlation.", "teaches": "How a model trained only to fill in masked residues comes to predict which mutations break a protein.", "time": "a day"}]}, {"id": "cofold", "title": "Co-folding: complexes with ligands, DNA and RNA", "kind": "concept", "track": "bio", "pre": ["structure", "ddpm"], "frontier": true, "core": "A complex is one structure, not several: a diffusion model denoises the coordinates of every chain, ligand, metal, and nucleic acid at once, conditioned on their sequences and chemical graphs, with residues as tokens for the polymers and single atoms for everything else.", "reach": "Interface confidence is the filter binder design relies on, and affinity prediction turns the same model into a ranking tool for drug screens.", "uses": "Modeling a drug candidate bound to its target, plus nucleic acid and metal-containing complexes. AlphaFold 3 and the open Boltz models are used this way in drug discovery, where docking tools used to stand alone.", "worth": "you work on therapeutics or design; needs structure prediction and diffusion, and the licensing terms and open replications are worth knowing.", "resources": [{"title": "The Illustrated AlphaFold", "url": "https://elanapearl.github.io/blog/2024/the-illustrated-alphafold/", "type": "blog", "by": "Elana Simon, Jake Silberg, 2024", "level": 1, "note": "Follow the token and atom streams: how a ligand’s atoms enter the same representation as residues, and what the diffusion module samples."}, {"title": "Accurate structure prediction of biomolecular interactions with AlphaFold 3", "url": "https://www.nature.com/articles/s41586-024-07487-w", "type": "paper", "by": "Abramson et al., Google DeepMind, Nature 2024", "level": 2, "note": "One diffusion head over atoms replaces the structure module, and accuracy is reported per interaction type against the specialized tool for each."}, {"title": "Generalized Biomolecular Modeling and Design with RoseTTAFold All-Atom", "url": "https://www.biorxiv.org/content/10.1101/2023.10.09.561603v1", "type": "paper", "by": "Krishna, Wang et al., Baker lab, 2023; Science 2024", "level": 2, "note": "A different route to the same problem: polymer sequences plus the bonded geometry of each small molecule, then fine-tuned into RFdiffusionAA for design around a ligand."}, {"title": "Boltz-2: Towards Accurate and Efficient Binding Affinity Prediction", "url": "https://www.biorxiv.org/content/10.1101/2025.06.14.659707v1", "type": "paper", "by": "Passaro, Corso, Wohlwend et al., MIT, 2025", "level": 3, "note": "Open weights and training code, and it predicts binding affinity as well as the structure, which is what screening asks for."}, {"title": "Predict a complex with Boltz", "url": "https://github.com/jwohlwend/boltz/blob/main/docs/prediction.md", "type": "project", "by": "Wohlwend, Corso, Passaro et al., MIT, 2025", "level": 2, "note": "The doc gives the schema for chains, bonds, pockets, and affinity, and names every output file.", "build": "A YAML input for a protein and a ligand given by SMILES, predicted on one GPU with server-generated alignments, read through its confidence scores, pocket constraints, and affinity output.", "teaches": "What a co-folding model needs stated about each chain and ligand, and which of its confidence numbers to believe for a complex.", "time": "an afternoon"}]}, {"id": "invfold", "title": "Inverse folding: a sequence for a given backbone", "kind": "paper", "track": "bio", "pre": ["structure", "gnns", "geometric"], "frontier": false, "core": "Hold the backbone fixed and ask which amino acids could fold into it. A graph network over residues, with edges carrying distances and orientations between neighbors, decodes one amino acid at a time, and many different sequences satisfy the same shape.", "reach": "The sequence step of every design pipeline: a generated backbone becomes a real protein to order, then a structure predictor checks that it folds back.", "uses": "Choosing amino acids for a designed shape, which is how a designed protein becomes orderable DNA. ProteinMPNN sequences appear in enzymes, binders, and scaffolds that labs then made and tested.", "worth": "you intend to design proteins rather than predict them; needs structure prediction, graph networks, and equivariance, then it is a short step.", "resources": [{"title": "Robust deep learning based protein sequence design using ProteinMPNN", "url": "https://www.youtube.com/watch?v=aVQQuoToTJA", "type": "video", "by": "Justas Dauparas, ML for protein engineering seminar series, 2022", "level": 1, "note": "The author’s own 53 minute talk, including why noise is added to coordinates during training and which failed Rosetta designs this rescued."}, {"title": "Robust deep learning based protein sequence design using ProteinMPNN", "url": "https://www.biorxiv.org/content/10.1101/2022.06.03.494563v1", "type": "paper", "by": "Dauparas et al., Baker lab, 2022; Science 2022", "level": 2, "note": "52.4% sequence recovery against Rosetta’s 32.9%, and coupling positions within or across chains is what makes it work on complexes."}, {"title": "dauparas/ProteinMPNN", "url": "https://github.com/dauparas/ProteinMPNN", "type": "code", "by": "Justas Dauparas, 2022", "level": 2, "note": "Runs on one PDB file; the helper scripts fix positions, tie residues across chains, and bias amino acid composition."}, {"title": "Learning inverse folding from millions of predicted structures", "url": "https://proceedings.mlr.press/v162/hsu22a.html", "type": "paper", "by": "Hsu, Verkuil, Liu, Lin, Hie, Sercu, Lerer, Rives, Meta AI, ICML 2022", "level": 3, "note": "ESM-IF1: training on 12 million AlphaFold 2 structures reaches 51% recovery, 72% on buried residues, and generalizes to partial backbones and interfaces."}, {"title": "Generative Models for Graph-Based Protein Design", "url": "https://papers.nips.cc/paper_files/paper/2019/hash/f3a4ff4839c56a5f460c88cce3666a2b-Abstract.html", "type": "paper", "by": "Ingraham, Garg, Barzilay, Jaakkola, NeurIPS 2019", "level": 2, "note": "The model this line started from: a protein as a k nearest neighbor graph with invariant edge features, decoded autoregressively."}, {"title": "Measure native sequence recovery with ProteinMPNN", "url": "https://www.biorxiv.org/content/10.1101/2022.06.03.494563v1", "type": "project
