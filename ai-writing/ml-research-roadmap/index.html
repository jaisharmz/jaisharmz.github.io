er, Wu, 2019", "level": 2, "note": "The problem and the reweighting idea, with normalizing flows."}, {"title": "Path Integral Sampler: a stochastic control approach for sampling", "url": "https://arxiv.org/abs/2111.15141", "type": "paper", "by": "Zhang, Chen, 2021", "level": 2}, {"title": "Adjoint Sampling: Highly Scalable Diffusion Samplers via Adjoint Matching", "url": "https://arxiv.org/abs/2504.11713", "type": "paper", "by": "Havens et al., Meta, 2025", "level": 2}, {"title": "Adjoint Schrödinger Bridge Sampler", "url": "https://arxiv.org/abs/2506.22565", "type": "paper", "by": "Liu, Choi, Chen, Miller, Chen, 2025", "level": 3}, {"title": "No Trick, No Treat: Pursuits and Challenges Towards Simulation-free Training of Neural Samplers", "url": "https://arxiv.org/abs/2502.06685", "type": "paper", "by": "He et al., 2025", "level": 3, "note": "The critique that sets parallel tempering as the baseline."}, {"title": "Path Integral Sampler on the funnel", "url": "https://arxiv.org/abs/2111.15141", "type": "project", "by": "Built on Zhang, Chen, 2021", "level": 3, "build": "A controlled diffusion whose drift network sees the energy’s gradient, trained with the path integral control loss to sample a 10-dimensional funnel, then importance weighted to estimate log Z.", "teaches": "How a sampler can learn from an energy alone, and how importance weights over whole paths correct what the learned drift gets wrong.", "time": "a weekend", "made": true, "done": "Your weighted log Z estimate errs by about 0.01 across runs, as PIS-Grad with reweighting does in Table 1, against 0.87 for HMC."}]}, {"id": "bandits", "title": "Bandits and exploration", "kind": "concept", "track": "rl", "pre": ["prob"], "frontier": false, "core": "Pull one of K arms with unknown payout rates; each pull either exploits the best-looking arm or explores another. An optimism bonus that shrinks as an arm is tried (UCB), or sampling arms from the posterior (Thompson sampling), keeps regret growing only logarithmically.", "reach": "Its exploration bonus returns in count-based exploration and Monte Carlo tree search, and regret is how RL theory scores learners.", "uses": "A/B tests that reallocate traffic while results come in, ad and recommendation ranking, adaptive clinical trial designs, and the selection rule inside Monte Carlo tree search. Hyperparameter search uses the same regret accounting.", "worth": "you touch any system choosing under uncertainty; probability is enough, and UCB, Thompson sampling, and regret cover most of the practical use.", "resources": [{"title": "Reinforcement Learning: An Introduction", "url": "http://incompleteideas.net/book/the-book-2nd.html", "type": "book", "by": "Sutton, Barto, 2nd edition, 2018", "level": 1, "note": "Chapter 2: greedy and epsilon-greedy, optimistic starts, UCB and gradient bandits on the 10-armed testbed."}, {"title": "A Tutorial on Thompson Sampling", "url": "https://arxiv.org/abs/1707.02038", "type": "tutorial", "by": "Russo et al., 2017", "level": 2, "note": "The Bayesian alternative to UCB, worked from Bernoulli bandits to harder problems."}, {"title": "Bandit Algorithms", "url": "https://tor-lattimore.com/downloads/book/book.pdf", "type": "book", "by": "Lattimore, Szepesvári, 2020", "level": 3, "note": "Chapters 4 to 8 prove regret bounds for UCB; Chapter 36 covers Thompson sampling."}, {"title": "ARENA 2.1: Multi-Armed Bandit", "url": "https://learn.arena.education/chapter2_rl/01_intro_rl/3-multi-armed-bandit/", "type": "project", "by": "ARENA, 2026", "level": 1, "build": "A 10-armed bandit environment and agents to play it: random, epsilon-greedy reward averaging with optimistic starts, UCB, and a cheater that knows the best arm.", "teaches": "How each exploration rule trades early reward for information, measured against the ceiling that the cheating agent sets.", "time": "an afternoon"}, {"title": "Thompson sampling against greedy on a Bernoulli bandit", "url": "https://arxiv.org/abs/1707.02038", "type": "project", "by": "Built on Russo et al., 2017", "level": 1, "build": "Greedy and Thompson sampling agents with Beta posteriors on a three-armed Bernoulli bandit, simulated many times, with selection rates and per-period regret plotted over time.", "teaches": "Why sampling from the posterior keeps trying arms that might be best, and how greedy locks onto a worse arm after a few lucky pulls.", "time": "an afternoon", "made": true, "done": "With arm means 0.9, 0.8 and 0.7 over 1,000 periods, Thompson sampling picks arm 1 in nearly every final period and its regret vanishes, while greedy’s does not (Figures 3.1 and 3.2a)."}]}, {"id": "mdp", "title": "MDPs, Bellman equations and dynamic programming", "kind": "concept", "track": "rl", "pre": ["stochastic", "control"], "frontier": false, "core": "A Markov decision process is states, actions, transition probabilities and rewards. A state’s value equals the expected reward now plus the discounted value of the next state (the Bellman equation); value and policy iteration solve it by repeating that update until nothing changes.", "reach": "Every RL method approximates this fixed point: TD learning samples it, Q-learning adds a max, and planners compute it with a model.", "uses": "The problem statement of nearly every sequential decision task, from inventory and queueing control to the setup section of RL papers. Dynamic programming itself ships inside routing, scheduling, and operations research solvers.", "worth": "you plan to read or write RL work at all; everything later assumes the Bellman equation, so skipping ahead to deep methods backfires.", "resources": [{"title": "Introduction to Reinforcement Learning", "url": "https://www.davidsilver.uk/teaching/", "type": "lectures", "by": "David Silver, UCL, 2015", "level": 1, "note": "Lectures 2 (Markov Decision Processes) and 3 (Planning by Dynamic Programming), slides and videos."}, {"title": "Reinforcement Learning: An Introduction", "url": "http://incompleteideas.net/book/the-book-2nd.html", "type": "book", "by": "Sutton, Barto, 2nd edition, 2018", "level": 2, "note": "Chapters 3 and 4: the Bellman equations, then policy evaluation, policy iteration and value iteration."}, {"title": "A Course in Reinforcement Learning (2nd edition)", "url": "https://web.mit.edu/dimitrib/www/RLCOURSECOMPLETE%202ndEDITION.pdf", "type": "book", "by": "Dimitri Bertsekas, 2026", "level": 3, "note": "Chapter 1 treats exact and approximate dynamic programming as one subject, with rollout and Newton’s method views."}, {"title": "CS188 Project 3: Reinforcement Learning", "url": "https://inst.eecs.berkeley.edu/~cs188/archive/fa25/projects/proj3/", "type": "project", "by": "Berkeley CS188, Fall 2025", "level": 1, "build": "Value iteration and Q-learning agents for Gridworld, a simulated crawler robot, and Pacman, ending with approximate Q-learning on hand-made features.", "teaches": "Bellman backups and the tradeoff between exploring and exploiting, in worlds small enough to watch every value change.", "time": "a weekend"}, {"title": "Sutton and Barto Exercise 4.7: Jack’s car rental", "url": "http://incompleteideas.net/book/RLbook2020.pdf", "type": "project", "by": "Sutton, Barto, 2nd edition, 2018", "level": 2, "note": "Example 4.2 sets up the problem; Exercise 4.7 adds the changes.", "build": "Policy iteration for Jack’s car rental, first replicating the sequence of policies in Figure 4.2, then re-solved with a free shuttle and an overnight parking charge.", "teaches": "How to turn a messy problem with Poisson demand into an MDP, and how quickly policy iteration settles once the model is exact.", "time": "a day"}]}, {"id": "td", "title": "TD learning and Q-learning", "kind": "concept", "track": "rl", "pre": ["mdp", "montecarlo"], "frontier": false, "core": "Move a value estimate toward the reward received plus the estimate at the next state, rather than waiting for the episode’s return. Q-learning does this for action values with a max over next actions, so it learns the optimal policy while behaving otherwise (off-policy).", "reach": "Bootstrapping from your own estimates drives DQN and every critic, and causes the overestimation that offline RL fights.", "uses": "The update inside most deep RL agents, and, far from engineering, the standard account of dopamine in neuroscience, where midbrain neuron firing looks like a reward prediction error rather than a reward.", "worth": "you want RL to stop being a black box; needs MDPs and basic sampling, and it is the track’s highest-return week.", "resources": [{"title": "Reinforcement Learning: An Introduction", "url": "http://incompleteideas.net/book/the-book-2nd.html", "type": "book", "by": "Sutton, Barto, 2nd edition, 2018", "level": 1, "note": "Chapter 6: TD prediction, Sarsa, Q-learning and double learning. Section 11.3 explains why off-policy TD with function approximation can diverge."}, {"title": "Introduction to Reinforcement Learning", "url": "https://www.davidsilver.uk/teaching/", "type": "lectures", "by": "David Silver, UCL, 2015", "level": 1, "note": "Lectures 4 (Model-Free Prediction) and 5 (Model-Free Control): Monte Carlo against TD, TD(lambda), Sarsa and Q-learning."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The value-based RL and Q-learning in practice lectures: fitted Q-iteration with neural networks."}, {"title": "ARENA 2.1: Intro to RL, Learning", "url": "https://learn.arena.education/chapter2_rl/01_intro_rl/2-learning/", "type": "project", "by": "ARENA, 2026", "level": 1, "build": "SARSA, Q-learning and SARSA(lambda) agents for gridworlds registered in Gymnasium, checked against a cheater that knows the optimal policy, then Q-learning against SARSA on CliffWalking.", "teaches": "What bootstrapping from the next estimate changes, and why on-policy SARSA keeps to the safe path while off-policy Q-learning hugs the cliff.", "time": "a day"}]}, {"id": "pg", "title": "Policy gradients", "kind": "concept", "track": "rl", "pre": ["mdp", "backprop"], "frontier": false, "core": "Make the actions that preceded high returns more likely. The gradient of expected return is the average of grad log pi(a|s) times the return, so sampled episodes estimate it with no model of the environment; subtracting a baseline keeps it unbiased and cuts variance.", "reach": "The base of actor-critic, PPO, GRPO, and reward fine-tuning of diffusion models.", "uses": "Post-training of large language models, continuous robot control, and any objective you can sample but not differentiate, such as architecture search, discrete pipeline choices, or a metric computed by an external program.", "worth": "you work on language-model post-training or control; requires MDPs and backprop, and the score-function trick pays off outside RL too.", "resources": [{"title": "Deep Reinforcement Learning: Pong from Pixels", "url": "http://karpathy.github.io/2016/05/31/rl/", "type": "blog", "by": "Andrej Karpathy, 2016", "level": 1, "note": "A policy gradient agent for Pong in about 130 lines of numpy, explained from scratch."}, {"title": "Part 3: Intro to Policy Optimization", "url": "https://spinningup.openai.com/en/latest/spinningup/rl_intro3.html", "type": "tutorial", "by": "Joshua Achiam, OpenAI Spinning Up, 2018", "level": 1, "note": "Derives the log-derivative trick, reward to go and baselines, with a short PyTorch implementation."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The policy gradients lecture."}, {"title": "Policy Gradient Methods for Reinforcement Learning with Function Approximation", "url": "https://papers.nips.cc/paper/1999/hash/464d828b85b0bed98e80ade0a5c43b0f-Abstract.html", "type": "paper", "by": "Sutton, McAllester, Singh, Mansour, NeurIPS 1999", "level": 3, "note": "The policy gradient theorem, and when a learned critic leaves the gradient unbiased."}, {"title": "CS 185/285 Homework 2: Policy Gradients", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/static/homeworks/hw2.pdf", "type": "project", "by": "Berkeley CS 185/285, Spring 2026", "level": 2, "note": "Starter code: homework_spring2026 on GitHub, linked from the handout.", "build": "A policy gradient agent with reward-to-go, a learned value baseline, and generalized advantage estimation, starting on CartPole and measuring what each variance reduction buys.", "teaches": "Why the vanilla policy gradient is too noisy to use, and how each fix trades bias for variance.", "time": "a week"}]}, {"id": "dqn", "title": "Deep Q-networks", "kind": "paper", "track": "rl", "pre": ["td", "backprop"], "frontier": false, "core": "Run Q-learning with a convolutional network that reads raw Atari frames, and keep it stable with two tricks: a replay buffer sampled at random to break correlations between consecutive steps, and a target network updated only occasionally, so the regression target stops chasing itself.", "reach": "Its replay buffer and target network carry over to DDPG, TD3 and SAC and to offline Q-learning.", "uses": "Discrete-action control in games and simulators, and, more lastingly, the two engineering habits it introduced, replay buffers and target networks, which almost every off-policy learner since has kept.", "worth": "you implement value-based RL; a light treatment suffices unless you tune off-policy agents, whose failure modes are exactly the ones it exposes.", "resources": [{"title": "Human-level control through deep reinforcement learning", "url": "https://storage.googleapis.com/deepmind-media/dqn/DQNNaturePaper.pdf", "type": "paper", "by": "Mnih et al., DeepMind, Nature 2015", "level": 2, "note": "DeepMind’s copy of the Nature paper; the Methods section has the full algorithm."}, {"title": "Deep Q-Learning (DQN)", "url": "https://docs.cleanrl.dev/rl-algorithms/dqn/", "type": "code", "by": "Huang et al., CleanRL, 2022", "level": 2, "note": "Single-file implementations with the paper’s hyperparameters and logged results."}, {"title": "Rainbow: Combining Improvements in Deep Reinforcement Learning", "url": "https://arxiv.org/abs/1710.02298", "type": "paper", "by": "Hessel et al., DeepMind, 2017", "level": 3, "note": "Ablates six later fixes, including double Q-learning and prioritized replay, to show which ones matter."}, {"title": "CS 185/285 Homework 3: Q-Learning and Actor-Critic", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/static/homeworks/hw3.pdf", "type": "project", "by": "Berkeley CS 185/285, Spring 2026", "level": 2, "build": "Deep Q-networks for discrete actions and soft actor-critic for continuous ones, on CartPole, LunarLander, InvertedPendulum, and Hopper.", "teaches": "Why target networks and replay make Q-learning stable, and how soft actor-critic carries the idea to continuous actions.", "time": "a week"}, {"title": "Sutton and Barto Exercise 11.3: Baird’s counterexample", "url": "http://incompleteideas.net/book/RLbook2020.pdf", "type": "project", "by": "Sutton, Barto, 2nd edition, 2018", "level": 2, "note": "Section 11.2 sets up the counterexample; Section 11.3 names the deadly triad.", "build": "One-step semi-gradient Q-learning with linear features on Baird’s seven-state counterexample, with its weights plotted as they diverge.", "teaches": "The deadly triad of function approximation, bootstrapping and off-policy updates, the instability that replay and a target network are there to contain.", "time": "an afternoon"}]}, {"id": "actorcritic", "title": "Actor-critic and advantage estimation", "kind": "concept", "track": "rl", "pre": ["pg", "td"], "frontier": false, "core": "Replace the noisy sampled return in the policy gradient with a learned critic’s estimate of the advantage: how much better an action was than the policy’s average. Generalized advantage estimation averages multi-step TD errors with weight lambda, trading the critic’s bias against the return’s variance.", "reach": "PPO, SAC and RLHF train an actor against a critic; GRPO replaces the critic with a group average.", "uses": "The shape of nearly every RL trainer in use, including language-model alignment, where advantage estimation decides how credit for one whole answer gets spread back over its tokens.", "worth": "you will read or write PPO, SAC, or RLHF code; policy gradients and TD first, and lambda is a knob you actually turn.", "resources": [{"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 1, "note": "The actor-critic lecture: from Monte Carlo returns to fitted value functions, n-step returns and GAE."}, {"title": "High-Dimensional Continuous Control Using Generalized Advantage Estimation", "url": "https://arxiv.org/abs/1506.02438", "type": "paper", "by": "Schulman, Moritz, Levine, Jordan, Abbeel, 2015", "level": 2, "note": "Defines GAE as an exponentially weighted sum of TD errors and studies the lambda trade-off."}, {"title": "Policy Gradient Algorithms", "url": "https://lilianweng.github.io/posts/2018-04-08-policy-gradient/", "type": "blog", "by": "Lilian Weng, 2018", "level": 2, "note": "A map of the family, from A2C and A3C to DDPG, TD3 and SAC, in one notation."}, {"title": "Reproduce the GAE parameter sweep on cart-pole", "url": "https://arxiv.org/abs/1506.02438", "type": "project", "by": "Built on Schulman et al., 2015", "level": 2, "build": "A policy gradient learner with a learned value function as critic and GAE advantages, run on cart-pole over a grid of gamma and lambda, and once with no value function.", "teaches": "How much the critic cuts variance, what its bias costs, and why gamma and lambda both act as dials between the two.", "time": "a day", "made": true, "done": "After 20 policy iterations, the best runs sit at intermediate settings, gamma 0.96 to 0.99 and lambda 0.92 to 0.99, as in Figure 2."}]}, {"id": "ppo", "title": "On-policy trust regions: TRPO and PPO", "kind": "concept", "track": "rl", "pre": ["actorcritic", "info"], "frontier": false, "core": "A policy gradient step is only reliable near the policy that collected the data. TRPO enforces this with a KL divergence limit on each update; PPO clips the probability ratio between new and old policies instead, so one batch supports several epochs of minibatch steps.", "reach": "The optimizer of RLHF and the template that GRPO modifies; the KL limit makes each step a natural gradient step.", "uses": "The reinforcement stage behind instruction-following chat models, large game-playing agents such as OpenAI Five, and most simulation-to-real locomotion work. Its clipped objective is the default in RL libraries.", "worth": "you touch post-training or control in practice; actor-critic first, and reading the clipping and KL terms closely beats studying the theory.", "resources": [{"title": "Proximal Policy Optimization", "url": "https://spinningup.openai.com/en/latest/algorithms/ppo.html", "type": "tutorial", "by": "Joshua Achiam, OpenAI Spinning Up, 2018", "level": 1, "note": "The clipped objective with pseudocode and a reference implementation."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The advanced policy gradients lectures: bounding the distribution change, natural gradients, TRPO and PPO."}, {"title": "Proximal Policy Optimization Algorithms", "url": "https://arxiv.org/abs/1707.06347", "type": "paper", "by": "Schulman et al., OpenAI, 2017", "level": 2, "note": "Section 3 states the clipped surrogate objective."}, {"title": "Trust Region Policy Optimization", "url": "https://arxiv.org/abs/1502.05477", "type": "paper", "by": "Schulman, Levine, Moritz, Jordan, Abbeel, 2015", "level": 3, "note": "The monotonic improvement bound that motivates the trust region."}, {"title": "The 37 Implementation Details of Proximal Policy Optimization", "url": "https://iclr-blog-track.github.io/2022/03/25/ppo-implementation-details/", "type": "blog", "by": "Huang et al., ICLR Blog Track, 2022", "level": 3, "note": "What separates a working PPO from the paper’s pseudocode."}, {"title": "ARENA 2.3: PPO", "url": "https://learn.arena.education/chapter2_rl/03_ppo/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "PPO from scratch: actor and critic networks, generalized advantage estimation, the clipped objective, and a training loop, run on CartPole, then Atari Breakout and MuJoCo Hopper.", "teaches": "The implementation details that separate a PPO that learns from one that does not, checked environment by environment.", "time": "a week", "signature": true}]}, {"id": "offpolicy", "title": "Off-policy actor-critic: DDPG, TD3 and SAC", "kind": "concept", "track": "rl", "pre": ["actorcritic", "dqn"], "frontier": false, "core": "Learn a Q-function from a replay buffer as DQN does, and train a continuous-action actor to climb its gradient. DDPG uses a deterministic actor; TD3 curbs Q overestimation with twin critics and delayed updates; SAC adds an entropy bonus and a stochastic actor.", "reach": "SAC is the standard continuous-control baseline, the entry to maximum-entropy RL, and the base of many offline methods.", "uses": "Continuous-control robotics, where SAC is the baseline nearly every new method reports against, simulated locomotion and manipulation, industrial control studies, and the starting point for most offline RL algorithms.", "worth": "you train controllers with continuous actions; needs DQN and actor-critic, and SAC alone covers most of what practitioners reach for.", "resources": [{"title": "Deep Deterministic Policy Gradient", "url": "https://spinningup.openai.com/en/latest/algorithms/ddpg.html", "type": "tutorial", "by": "Joshua Achiam, OpenAI Spinning Up, 2018", "level": 1, "note": "Then the TD3 and SAC pages, which build on it in the same notation."}, {"title": "Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic Actor", "url": "https://arxiv.org/abs/1801.01290", "type": "paper", "by": "Haarnoja, Zhou, Abbeel, Levine, 2018", "level": 2}, {"title": "Addressing Function Approximation Error in Actor-Critic Methods", "url": "https://arxiv.org/abs/1802.09477", "type": "paper", "by": "Fujimoto, van Hoof, Meger, 2018", "level": 2, "note": "The TD3 paper: why Q overestimation carries over from DQN to actor-critic, and three fixes."}, {"title": "Soft Actor-Critic Algorithms and Applications", "url": "https://arxiv.org/abs/1812.05905", "type": "paper", "by": "Haarnoja et al., 2018", "level": 3, "note": "Adds automatic tuning of the entropy temperature."}, {"title": "Spinning Up exercises", "url": "https://spinningup.openai.com/en/latest/spinningup/exercises.html", "type": "project", "by": "Joshua Achiam, OpenAI, 2018", "level": 2, "build": "A diagonal Gaussian policy and its log-likelihood, the TD3 loss computations, and a diagnosis of a silent bug in DDPG from its learning curves.", "teaches": "How deep RL code fails quietly, and how to find a bug from learning curves alone.", "time": "a weekend"}]}, {"id": "maxent", "title": "Maximum-entropy RL and control as inference", "kind": "concept", "track": "rl", "pre": ["offpolicy", "info", "vae"], "frontier": false, "core": "Add the policy’s entropy to the reward. The optimal policy becomes a Boltzmann distribution over soft Q-values, pi(a|s) proportional to exp(Q(s,a)/alpha), the same answer that inference gives in a graphical model where each step is optimal with probability exp(reward).", "reach": "Explains SAC, gives inverse RL its likelihood, and links RL to KL-regularized fine-tuning and stochastic optimal control.", "uses": "Understanding why SAC’s entropy bonus and the KL penalty in language-model fine-tuning take the forms they do. The link is conceptual rather than a product, but one derivation then serves both.", "worth": "you want the theory under entropy bonuses and KL penalties; needs SAC, information theory, and the ELBO, so skip it outside research.", "resources": [{"title": "Learning Diverse Skills via Maximum Entropy Deep Reinforcement Learning", "url": "https://bair.berkeley.edu/blog/2017/10/06/soft-q-learning/", "type": "blog", "by": "Tang, Haarnoja, BAIR, 2017", "level": 1, "note": "Why a stochastic optimal policy keeps every good way of solving a task."}, {"title": "Reinforcement Learning and Control as Probabilistic Inference: Tutorial and Review", "url": "https://arxiv.org/abs/1805.00909", "type": "tutorial", "by": "Sergey Levine, 2018", "level": 2, "note": "Sections 2 and 3: the graphical model, then maximum-entropy RL as variational inference."}, {"title": "Reinforcement Learning with Deep Energy-Based Policies", "url": "https://arxiv.org/abs/1702.08165", "type": "paper", "by": "Haarnoja, Tang, Abbeel, Levine, 2017", "level": 3, "note": "Soft Q-learning: soft Bellman backups and sampling from energy-based policies over continuous actions."}, {"title": "Soft Q-learning on the multi-goal environment", "url": "https://github.com/haarnoja/softqlearning", "type": "project", "by": "Built on Haarnoja et al., 2017", "level": 2, "build": "A soft Q-learning agent written from the paper, run beside DDPG on the authors’ 2D multi-goal point mass, with trajectories sampled from each policy plotted.", "teaches": "What the entropy term buys: a policy that keeps every good option open instead of committing early to one of them.", "time": "a weekend", "made": true, "done": "Soft Q-learning trajectories reach all 4 goals while each DDPG run commits to 1, as in Figure 1 of the paper."}]}, {"id": "imitation", "title": "Imitation learning", "kind": "concept", "track": "rl", "pre": ["mdp", "backprop"], "frontier": false, "core": "Train a policy by supervised learning on expert state-action pairs (behavior cloning). Small mistakes carry the learner into states the expert never visited, so errors compound over the horizon; DAgger fixes this by having the expert label the states the learner actually reaches.", "reach": "The training recipe of Diffusion Policy and VLAs; offline RL and inverse RL relax its need for optimal demonstrations.", "uses": "Robot manipulation trained from teleoperated demonstrations, driving policies fit to human logs, and the first stage of essentially every language-model post-training pipeline, which is behavior cloning on written answers.", "worth": "you will train any policy from demonstrations; light prerequisites, and knowing why errors compound saves weeks of unexplained failures.", "resources": [{"title": "Learning from demonstrations", "url": "https://manipulation.csail.mit.edu/Fall2026/lec/bc_notes.pdf", "type": "notes", "by": "MIT 6.4210 course notes, Fall 2026", "level": 1, "note": "Section 1 shows why averaging multimodal actions fails; Section 3 covers DAgger."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The behavioral cloning lectures: distributional shift, DAgger and multimodal behavior."}, {"title": "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning", "url": "https://arxiv.org/abs/1011.0686", "type": "paper", "by": "Ross, Gordon, Bagnell, 2011", "level": 2, "note": "The DAgger paper, with the compounding error analysis."}, {"title": "An Algorithmic Perspective on Imitation Learning", "url": "https://arxiv.org/abs/1811.06711", "type": "paper", "by": "Osa et al., 2018", "level": 3, "note": "A survey that sorts behavior cloning and inverse RL methods by what they assume."}, {"title": "CS 185/285 Homework 1: Imitation Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/static/homeworks/hw1.pdf", "type": "project", "by": "Berkeley CS 185/285, Spring 2026", "level": 2, "build": "Action-chunking policies for the Push-T task: one trained with mean squared error, then a flow matching policy in the style of Diffusion Policy.", "teaches": "Why imitation needs an expressive action distribution when demonstrations disagree about what to do.", "time": "a week"}, {"title": "CS 285 Homework 1: Behavior Cloning and DAgger", "url": "https://rail.eecs.berkeley.edu/deeprlcourse-fa23/deeprlcourse-fa23/static/homeworks/hw1.pdf", "type": "project", "by": "Berkeley CS 285, Fall 2023", "level": 2, "build": "Behavior cloning from an expert policy’s demonstrations on MuJoCo tasks such as Ant, then DAgger, with a learning curve of return against DAgger iterations.", "teaches": "Compounding error seen directly: a task where cloning falls short of the expert, and how relabeling the learner’s own states closes the gap.", "time": "a weekend"}]}, {"id": "irl", "title": "Inverse RL and adversarial imitation", "kind": "concept", "track": "rl", "pre": ["imitation", "maxent", "gan"], "frontier": false, "core": "Instead of copying actions, infer the reward the expert seems to optimize. Maximum-entropy IRL fits a reward under which expert trajectories are exponentially more likely; GAIL skips the reward and trains the policy to fool a discriminator that separates its behavior from the expert’s.", "reach": "RLHF reward models are preference-based inverse RL; AIRL recovers rewards that still work when the dynamics change.", "uses": "Modeling what human drivers or animals appear to be optimizing, reward design for robots taught by demonstration, and, in a direct line, the preference-trained reward models used in language-model alignment.", "worth": "you need a reward you cannot write down; needs imitation, max-entropy RL, and GANs, so most people meet it through RLHF instead.", "resources": [{"title": "Section 7: Inverse Reinforcement Learning and LLM RL", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/static/sections/section-7.pdf", "type": "notes", "by": "Kevin Black, Berkeley CS285, 2026", "level": 1, "note": "Four pages deriving maximum-entropy IRL from the control as inference model."}, {"title": "Maximum Entropy Inverse Reinforcement Learning", "url": "https://cdn.aaai.org/AAAI/2008/AAAI08-227.pdf", "type": "paper", "by": "Ziebart, Maas, Bagnell, Dey, AAAI 2008", "level": 2}, {"title": "Generative Adversarial Imitation Learning", "url": "https://arxiv.org/abs/1606.03476", "type": "paper", "by": "Ho, Ermon, 2016", "level": 2, "note": "Imitation as matching occupancy measures with a discriminator, no reward recovered."}, {"title": "Learning Robust Rewards with Adversarial Inverse Reinforcement Learning", "url": "https://arxiv.org/abs/1710.11248", "type": "paper", "by": "Fu, Luo, Levine, 2017", "level": 3, "note": "AIRL: a discriminator structure that separates a transferable reward from the policy."}, {"title": "Inverse Reinforcement Learning Meets Large Language Model Post-Training: Basics, Advances, and Opportunities", "url": "https://arxiv.org/abs/2507.13158", "type": "paper", "by": "Sun, van der Schaar, 2025", "level": 3, "note": "Recasts reward modeling and RLHF for LLMs as inverse RL."}, {"title": "GAIL against behavior cloning on CartPole", "url": "https://arxiv.org/abs/1606.03476", "type": "project", "by": "Built on Ho, Ermon, 2016", "level": 2, "note": "Use CartPole-v0, whose episodes end at 200 steps, and train the expert with PPO first.", "build": "GAIL, a discriminator and a policy gradient learner rewarded for fooling it, trained from 1 to 10 expert trajectories on CartPole, beside behavior cloning on the same data.", "teaches": "Why matching the expert’s state distribution beats copying its actions when demonstrations are scarce, and how adversarial training behaves in practice.", "time": "a weekend", "made": true, "done": "With 1 expert trajectory, GAIL holds CartPole at the expert’s 200 while behavior cloning averages about 72, as in Table 3."}]}, {"id": "offline", "title": "Offline RL", "kind": "concept", "track": "rl", "pre": ["offpolicy", "imitation"], "frontier": false, "core": "Learn a policy from a fixed dataset with no further interaction. A Q-function trained on that data overrates actions the data never tried, and the policy exploits those errors; offline methods stay pessimistic, pushing down Q on unseen actions (CQL) or never querying them (IQL).", "reach": "Decision Transformer recasts it as sequence modeling; RLHF on a fixed preference set faces the same distribution shift.", "uses": "Learning policies where exploring is unsafe or expensive: treatment strategies studied on hospital records, ranking from logged interactions, driving from fleet data. Every fixed preference dataset also sits in this setting.", "worth": "you have logs but no simulator; needs SAC and imitation, and pessimism transfers to anything trained on its own outputs.", "resources": [{"title": "Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems", "url": "https://arxiv.org/abs/2005.01643", "type": "tutorial", "by": "Levine, Kumar, Tucker, Fu, 2020", "level": 2, "note": "Section 2.4 explains why it is hard; Section 4 covers policy constraints and conservative value functions."}, {"title": "Conservative Q-Learning for Offline Reinforcement Learning", "url": "https://arxiv.org/abs/2006.04779", "type": "paper", "by": "Kumar, Zhou, Tucker, Levine, 2020", "level": 2, "note": "Learns a Q-function that lower-bounds the true value by penalizing actions outside the data."}, {"title": "Offline Reinforcement Learning with Implicit Q-Learning", "url": "https://arxiv.org/abs/2110.06169", "type": "paper", "by": "Kostrikov, Nair, Levine, 2021", "level": 2, "note": "Expectile regression on values, so the critic never evaluates actions outside the data."}, {"title": "A Minimalist Approach to Offline Reinforcement Learning", "url": "https://arxiv.org/abs/2106.06860", "type": "paper", "by": "Fujimoto, Gu, 2021", "level": 3, "note": "TD3 plus a behavior cloning term: the baseline any new method has to beat."}, {"title": "CS 185/285 Homework 5: Offline RL", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/static/homeworks/hw5.pdf", "type": "project", "by": "Berkeley CS 185/285, Spring 2026", "level": 3, "build": "Three offline RL algorithms, SAC+BC, IQL, and flow Q-learning, trained on fixed datasets from OGBench robot manipulation tasks.", "teaches": "How offline methods keep a learned policy near the data, and what each way of doing it costs.", "time": "a week"}]}, {"id": "dt", "title": "Decision Transformer", "kind": "paper", "track": "rl", "pre": ["offline", "attention"], "frontier": false, "core": "Write each trajectory as a sequence of return to go, state and action tokens, and train a GPT-style transformer to predict actions. At test time, prompt it with the return you want; it acts to reach it, with no value function or Bellman backup.", "reach": "Ties offline RL to language modeling; its limits in stochastic environments show what learned values still provide.", "uses": "Offline RL benchmarks, and more broadly the habit of treating control as token prediction, which is what lets robot policies reuse transformer stacks, tokenizers, and serving infrastructure built for text.", "worth": "you are curious how far sequence modeling replaces value learning; needs offline RL and transformers, and one careful paper read usually suffices.", "resources": [{"title": "Introducing Decision Transformers on Hugging Face", "url": "https://huggingface.co/blog/decision-transformers", "type": "blog", "by": "Beeching, Simonini, Hugging Face, 2022", "level": 1, "note": "The idea and a working model in a few cells."}, {"title": "Decision Transformer: Reinforcement Learning via Sequence Modeling", "url": "https://arxiv.org/abs/2106.01345", "type": "paper", "by": "Chen et al., 2021", "level": 2}, {"title": "Offline Reinforcement Learning as One Big Sequence Modeling Problem", "url": "https://arxiv.org/abs/2106.02039", "type": "paper", "by": "Janner, Li, Levine, 2021", "level": 2, "note": "The Trajectory Transformer: models states, actions and rewards jointly and plans with beam search."}, {"title": "When does return-conditioned supervised learning work for offline reinforcement learning?", "url": "https://arxiv.org/abs/2206.01079", "type": "paper", "by": "Brandfonbrener et al., 2022", "level": 3, "note": "Shows return conditioning needs stronger assumptions than dynamic programming, with examples where it fails."}, {"title": "Decision Transformer on D4RL Hopper", "url": "https://github.com/kzl/decision-transformer", "type": "project", "by": "Built on Chen et al., 2021", "level": 2, "note": "The D4RL datasets are mirrored on the Hugging Face Hub as edbeeching/decision_transformer_gym_replay.", "build": "A small GPT over return to go, state and action tokens, trained on one GPU on the D4RL Hopper medium-replay data and prompted with a range of target returns.", "teaches": "That conditioning on return can turn supervised learning into control, and where the policy stops reaching the return you ask for.", "time": "a weekend", "made": true, "done": "Normalized score on Hopper medium-replay reaches about 82.7, against 27.6 for behavior cloning (Table 2), and achieved return follows the target as in Figure 4."}]}, {"id": "mbrl", "title": "Model-based RL and planning", "kind": "concept", "track": "rl", "pre": ["mdp", "control"], "frontier": false, "core": "Learn the environment’s dynamics from data, then plan with the model: search over action sequences at each step (model predictive control) or generate imagined experience for a policy. Real samples go further, but planners exploit model errors, so uncertainty and short rollouts matter.", "reach": "Dreamer learns its policy inside the model, MuZero plans with one, and video world models scale the model up.", "uses": "Model predictive control in process plants, vehicles, and drones, sample-efficient robot learning, and the planning half of systems such as MuZero. Industrial MPC long predates any of the learned versions.", "worth": "you work where real interaction is costly and a model is learnable; needs MDPs and some optimal control background.", "resources": [{"title": "Reinforcement Learning: An Introduction", "url": "http://incompleteideas.net/book/the-book-2nd.html", "type": "book", "by": "Sutton, Barto, 2nd edition, 2018", "level": 1, "note": "Chapter 8: Dyna, prioritized sweeping, rollouts and Monte Carlo tree search in the tabular setting."}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The model-based RL lectures: distributional shift in models, bootstrap ensembles, MPC and MBPO."}, {"title": "Deep Reinforcement Learning in a Handful of Trials using Probabilistic Dynamics Models", "url": "https://arxiv.org/abs/1805.12114", "type": "paper", "by": "Chua, Calandra, McAllister, Levine, 2018", "level": 2, "note": "PETS: probabilistic ensembles plus sampling-based MPC, where modeling uncertainty is what makes planning work."}, {"title": "When to Trust Your Model: Model-Based Policy Optimization", "url": "https://arxiv.org/abs/1906.08253", "type": "paper", "by": "Janner, Fu, Zhang, Levine, 2019", "level": 2, "note": "Short model rollouts branched from real states, with a bound on when the model helps."}, {"title": "Mastering Atari, Go, Chess and Shogi by Planning with a Learned Model", "url": "https://arxiv.org/abs/1911.08265", "type": "paper", "by": "Schrittwieser et al., DeepMind, 2019", "level": 3, "note": "MuZero: tree search in a learned latent model that predicts only reward, value and policy."}, {"title": "CS 285 Homework 4: Model-Based RL", "url": "https://rail.eecs.berkeley.edu/deeprlcourse-fa23/deeprlcourse-fa23/static/homeworks/hw4.pdf", "type": "project", "by": "Berkeley CS 285, Fall 2023", "level": 2, "note": "Starter code: homework_fall2023 on GitHub, linked from the handout.", "build": "An ensemble of learned dynamics models, an MPC planner using random shooting and then CEM, and an MBPO variant that feeds short model rollouts to SAC, on obstacle, Reacher and HalfCheetah tasks.", "teaches": "How planners exploit model error, and what ensembles, short horizons, replanning and short rollouts each do about it.", "time": "a week"}]}, {"id": "dreamer", "title": "Dreamer: learning inside a world model", "kind": "paper", "track": "rl", "pre": ["mbrl", "vae", "actorcritic"], "frontier": false, "core": "Learn a recurrent latent model of the world from pixels, trained like a sequential VAE, then train an actor and critic entirely on imagined latent rollouts. Real interaction only collects data for the model; DreamerV3 adds normalizations so one hyperparameter setting works across domains.", "reach": "Bridges model-based RL and learned simulators; its recurrent state space model is a template for later world models.", "uses": "Training control policies with very little real interaction, including robots that learn to walk outdoors in about an hour and an agent that collected Minecraft diamonds without human demonstrations.", "worth": "you want world-model RL hands-on; needs model-based RL, VAEs, and actor-critic together, which makes it a month rather than a weekend.", "resources": [{"title": "World Models", "url": "https://worldmodels.github.io/", "type": "paper", "by": "Ha, Schmidhuber, 2018", "level": 1, "note": "Interactive version: a VAE, a recurrent dynamics model and a small controller trained inside the dream."}, {"title": "Dream to Control: Learning Behaviors by Latent Imagination", "url": "https://arxiv.org/abs/1912.01603", "type": "paper", "by": "Hafner, Lillicrap, Ba, Norouzi, 2019", "level": 2, "note": "The cleanest statement of the method: backpropagate values through imagined latent trajectories."}, {"title": "Mastering Diverse Domains through World Models", "url": "https://arxiv.org/abs/2301.04104", "type": "paper", "by": "Hafner, Pasukonis, Ba, Lillicrap, 2023", "level": 2, "note": "DreamerV3: one configuration across Atari, control, Crafter and Minecraft. The open-access Nature version (2025) is titled Mastering diverse control tasks through world models."}, {"title": "TD-MPC2: Scalable, Robust World Models for Continuous Control", "url": "https://arxiv.org/abs/2310.16828", "type": "paper", "by": "Hansen, Su, Wang, 2023", "level": 3, "note": "The decoder-free alternative: plan in latent space with MPPI instead of learning a policy in imagination."}, {"title": "Write Dreamer and train it from pixels", "url": "https://arxiv.org/abs/2301.04104", "type": "project", "by": "Built on Hafner et al., 2023", "level": 3, "build": "A Dreamer agent on one GPU: a recurrent state space model learned from pixels, and an actor and critic trained only on imagined latent rollouts, on DMC Walker Walk.", "teaches": "Which pieces make learning inside a model work: the latent state, KL balancing, return normalization, and how far ahead to imagine.", "time": "two weeks", "made": true, "done": "Return on visual Walker Walk passes 900 within 1M environment steps; the paper’s Dreamer reaches 961 there, and SAC from pixels 40 (Table 12)."}]}, {"id": "exploration", "title": "Exploration and intrinsic motivation", "kind": "concept", "track": "rl", "pre": ["bandits", "dqn"], "frontier": false, "core": "When rewards are sparse, pay the agent for reaching what it has not seen. Count-based bonuses extend the bandit bonus to huge state spaces with pseudo-counts; curiosity rewards a learned model’s prediction error, and RND the error in predicting a fixed random network’s output.", "reach": "Extends bandit optimism to deep RL; skill discovery drops the task reward entirely.", "uses": "Sparse-reward games that defeated earlier agents, such as Montezuma’s Revenge, exploration in procedurally generated environments, and novelty bonuses that keep reinforcement-trained generators from collapsing onto a single answer.", "worth": "your reward is sparse or your agent collapses to one behavior; bandits and DQN first, and random network distillation is the cheapest thing that works.", "resources": [{"title": "Exploration Strategies in Deep Reinforcement Learning", "url": "https://lilianweng.github.io/posts/2020-06-07-exploration-drl/", "type": "blog", "by": "Lilian Weng, 2020", "level": 1}, {"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 2, "note": "The exploration lecture: optimism, posterior sampling and counts, from bandits to deep RL."}, {"title": "Unifying Count-Based Exploration and Intrinsic Motivation", "url": "https://arxiv.org/abs/1606.01868", "type": "paper", "by": "Bellemare et al., DeepMind, 2016", "level": 2, "note": "Pseudo-counts from a density model, the bridge from bandit bonuses to Atari."}, {"title": "Exploration by Random Network Distillation", "url": "https://arxiv.org/abs/1810.12894", "type": "paper", "by": "Burda, Edwards, Storkey, Klimov, 2018", "level": 2, "note": "A simple bonus that beat average human play on Montezuma’s Revenge without demonstrations."}, {"title": "Go-Explore: a New Approach for Hard-Exploration Problems", "url": "https://arxiv.org/abs/1901.10995", "type": "paper", "by": "Ecoffet et al., Uber AI, 2019", "level": 3, "note": "Remember promising states, return to them, then explore from there."}, {"title": "CS 285 Homework 5: Exploration and Offline RL", "url": "https://rail.eecs.berkeley.edu/deeprlcourse-fa23/deeprlcourse-fa23/static/homeworks/hw5.pdf", "type": "project", "by": "Berkeley CS 285, Fall 2023", "level": 2, "build": "Random network distillation exploring three PointMass mazes of rising difficulty, compared with a random policy, then CQL, AWAC and IQL trained offline on the data it collected.", "teaches": "Where a novelty bonus takes an agent that random actions never reach, and how the data it gathers bounds what offline learning can do.", "time": "a week"}]}, {"id": "skills", "title": "Unsupervised skill discovery", "kind": "concept", "track": "rl", "pre": ["maxent", "info"], "frontier": true, "core": "With no reward, learn policies indexed by a latent skill z whose behaviors are easy to tell apart. DIAYN maximizes mutual information between skill and state, rewarding states from which a discriminator can guess z; METRA instead spreads skills apart in a learned temporal distance.", "reach": "Pretrains behaviors for downstream tasks and hierarchies, using SAC’s entropy term and variational bounds on mutual information.", "uses": "Pretraining a repertoire of behaviors before any task reward exists, which matters most in robotics and open-ended agents. This remains a research direction rather than shipped practice, so judge it as such.", "worth": "you do RL research and want reward-free pretraining; needs max-entropy RL and information theory, and the field has not settled.", "resources": [{"title": "CS 185/285: Deep Reinforcement Learning", "url": "https://rail.eecs.berkeley.edu/deeprlcourse/", "type": "lectures", "by": "Sergey Levine, Berkeley, Spring 2026", "level": 1, "note": "The advanced exploration lecture: learning diverse skills, the link to mutual information, and empowerment."}, {"title": "Diversity is All You Need: Learning Skills without a Reward Function", "url": "https://arxiv.org/abs/1802.06070", "type": "paper", "by": "Eysenbach, Gupta, Ibarz, Levine, 2018", "level": 2}, {"title": "METRA: Scalable Unsupervised RL with Metric-Aware Abstraction", "url": "https://arxiv.org/abs/2310.08887", "type": "paper", "by": "Park, Rybkin, Levine, 2023", "level": 3, "note": "Why mutual information skills can fail to explore, and a temporal distance objective that scales to pixels."}, {"title": "Dynamics-Aware Unsupervised Discovery of Skills", "url": "https://arxiv.org/abs/1907.01657", "type": "paper", "by": "Sharma, Gu, Levine, Kumar, Hausman, 2019", "level": 3, "note": "DADS: skills chosen to be predictable, so a planner can compose them."}, {"title": "DIAYN on a 2D box and Mountain Car", "url": "https://arxiv.org/abs/1802.06070", "type": "project", "by": "Built on Eysenbach et al., 2018", "level": 2, "build": "DIAYN on a laptop: a SAC agent conditioned on a skill and rewarded by a discriminator that guesses the skill from the state, trained with no task reward.", "teaches": "How a mutual information objective becomes a reward, and how skills found with no reward can still solve a task.", "time": "a weekend", "made": true, "done": "The 6 skills on the 2D box move apart as in Figure 2a, and some skill climbs MountainCarContinuous without ever seeing its reward, as in Figure 18b."}]}, {"id": "sft", "title": "Instruction tuning", "kind": "concept", "track": "post", "pre": ["pretrain"], "frontier": false, "core": "Fine-tune a pretrained model on (instruction, response) pairs with the same next-token loss, counted only on the response tokens. A few thousand to a million good examples in a fixed chat format turn a document completer into an assistant that follows requests.", "reach": "Produces the starting policy for RLHF, DPO, and RLVR; LoRA makes it cheap.", "uses": "Turning a base model into an assistant, every fine-tune that teaches a response format or a tool-calling schema, and distilling a large model’s answers into a small one cheap enough to serve.", "worth": "you touch applied language-model work at all; needs only pretraining basics, and no other intervention is this cheap or this visible.", "resources": [{"title": "Instruction Fine-Tuning (RLHF Book)", "url": "https://rlhfbook.com/c/04-instruction-tuning", "type": "book", "by": "Nathan Lambert, 2025", "level": 1}, {"title": "Finetuned Language Models Are Zero-Shot Learners", "url": "https://arxiv.org/abs/2109.01652", "type": "paper", "by": "Wei et al., Google, 2021", "level": 2}, {"title": "LIMA: Less Is More for Alignment", "url": "https://arxiv.org/abs/2305.11206", "type": "paper", "by": "Zhou et al., Meta, 2023", "level": 2}, {"title": "Hugging Face smol-course", "url": "https://github.com/huggingface/smol-course", "type": "code", "by": "Hugging Face, 2025", "level": 2, "note": "Unit 1 covers supervised fine-tuning and chat templates on a local machine."}, {"title": "Tulu 3: Pushing Frontiers in Open Language Model Post-Training", "url": "https://arxiv.org/abs/2411.15124", "type": "paper", "by": "Lambert et al., Ai2, 2024", "level": 3, "note": "A fully open recipe: SFT data, DPO, and RL with verifiable rewards."}, {"title": "LLMs from Scratch, Chapter 7: Finetuning to Follow Instructions", "url": "https://github.com/rasbt/LLMs-from-scratch/tree/main/ch07", "type": "project", "by": "Sebastian Raschka, 2024", "level": 1, "note": "The chapter code is in 01_main-chapter-code; the bonus folders add dataset generation and preference tuning.", "build": "GPT-2 medium instruction tuned on 1,100 prompt and response pairs in one fixed format, then its answers scored automatically by a local model through Ollama.", "teaches": "What the prompt format, the loss mask, and the dataset size each change, measured on answers you can read.", "time": "a weekend"}]}, {"id": "rlhf", "title": "RLHF: reward models and PPO", "kind": "paper", "track": "post", "pre": ["sft", "ppo"], "frontier": false, "core": "Collect human rankings of model outputs, fit a reward model that predicts which output people prefer, then optimize the model against that reward with PPO while a KL penalty keeps it near the supervised start. People preferred 1.3B InstructGPT to 175B GPT-3.", "reach": "DPO removes the RL loop, constitutional AI replaces human labels, and reward hacking is what happens when the optimization goes too far.", "uses": "The helpfulness and harmlessness training behind deployed chat assistants, summarization tuned to human raters, and preference tuning of image and video generators. Reward models also serve as rerankers at inference time.", "worth": "you work on or evaluate deployed models; needs instruction tuning and PPO, and the KL penalty explains most of what goes wrong.", "resources": [{"title": "Illustrating Reinforcement Learning from Human Feedback (RLHF)", "url": "https://huggingface.co/blog/rlhf", "type": "blog", "by": "Lambert, Castricato, von Werra, Havrilla, 2022", "level": 1}, {"title": "Training language models to follow instructions with human feedback", "url": "https://arxiv.org/abs/2203.02155", "type": "paper", "by": "Ouyang et al., OpenAI, 2022", "level": 2, "note": "Figure 2 shows the three steps; Section 3.5 gives the PPO objective with its KL penalty."}, {"title": "RLHF Book", "url": "https://rlhfbook.com/", "type": "book", "by": "Nathan Lambert, 2025", "level": 2, "note": "The Reward Modeling and Reinforcement Learning chapters."}, {"title": "The N+ Implementation Details of RLHF with PPO: A Case Study on TL;DR Summarization", "url": "https://arxiv.org/abs/2403.17031", "type": "paper", "by": "Huang et al., 2024", "level": 3}, {"title": "Deep reinforcement learning from human preferences", "url": "https://arxiv.org/abs/1706.03741", "type": "paper", "by": "Christiano et al., 2017", "level": 2, "note": "The original reward model from pairwise preferences, on Atari and MuJoCo."}, {"title": "Tinker Cookbook: preference learning", "url": "https://github.com/thinking-machines-lab/tinker-cookbook/tree/main/tinker_cookbook/recipes/preference", "type": "project", "by": "Thinking Machines Lab, 2025", "level": 2, "note": "The recipes are free to read; running them needs a Tinker account, which bills for compute.", "paid": true, "build": "The three-stage RLHF pipeline, supervised fine-tuning, a reward model, then RL against it, and DPO beside it, on open-weight models through the Tinker training API.", "teaches": "The hand-offs between the stages of RLHF, without writing distributed training code.", "time": "a weekend"}]}, {"id": "dpo", "title": "Direct preference optimization", "kind": "paper", "track": "post", "pre": ["rlhf"], "frontier": false, "core": "The KL-regularized reward objective in RLHF has a closed-form optimal policy, so the reward can be written in terms of the policy. Substituting that into the preference model gives a classification loss on chosen versus rejected responses, with no reward model or RL loop.", "reach": "The default offline preference method, and the usual baseline for online RL methods such as RLVR.", "uses": "Preference tuning in most open-weight model pipelines, where dropping the reward model and the sampling loop cuts cost and complexity, and quick alignment experiments that fit on a single machine.", "worth": "you tune models on preference pairs with a modest budget; read RLHF first, since this is largely its algebra rearranged.", "resources": [{"title": "Direct-Alignment Algorithms (RLHF Book)", "url": "https://rlhfbook.com/c/08-direct-alignment", "type": "book", "by": "Nathan Lambert, 2025", "level": 1, "note": "Includes the full DPO derivation."}, {"title": "Direct Preference Optimization: Your Language Model is Secretly a Reward Model", "url": "https://arxiv.org/abs/2305.18290", "type": "paper", "by": "Rafailov et al., Stanford, 2023", "level": 2, "note": "Section 4 derives the loss; Appendix A.1 derives the optimal KL-constrained policy."}, {"title": "Is DPO Superior to PPO for LLM Alignment? A Comprehensive Study", "url": "https://arxiv.org/abs/2404.10719", "type": "paper", "by": "Xu et al., 2024", "level": 3}, {"title": "A General Theoretical Paradigm to Understand Learning from Human Preferences", "url": "https://arxiv.org/abs/2310.12036", "type": "paper", "by": "Azar et al., DeepMind, 2023", "level": 3}, {"title": "CS336 Assignment 5 supplement: Instruction Tuning and RLHF", "url": "https://github.com/stanford-cs336/assignment5-alignment/blob/main/cs336_spring2026_assignment5_supplement_safety_rlhf.pdf", "type": "project", "by": "Stanford CS336, 2026", "level": 2, "build": "Zero-shot baselines, supervised fine-tuning on instruction and response pairs, and Direct Preference Optimization on pairwise preference data.", "teaches": "How DPO turns a preference dataset into a classification loss on the policy, with no reward model and no sampling loop.", "time": "a week"}]}, {"id": "rlvr", "title": "RL with verifiable rewards and GRPO", "kind": "concept", "track": "post", "pre": ["rlhf", "cot"], "frontier": true, "core": "When a program can check the answer, as in math or unit tests, that check is the reward and RL needs no learned reward model. GRPO samples several answers per prompt and scores each against the group’s average reward, so no value network is needed.", "reach": "Trains the long chains of thought behind reasoning models; verifier gaming is the newest form of reward hacking.", "uses": "Training reasoning models on problems a checker can grade, including the GRPO runs behind DeepSeek-R1, and increasingly agents scored on whether a task actually completed rather than on how the answer reads.", "worth": "you work on reasoning or agents and can write checkers; needs RLHF and chain-of-thought, and the recipes change every few months.", "resources": [{"title": "Reasoning and Inference-Time Scaling (RLHF Book)", "url": "https://rlhfbook.com/c/07-reasoning", "type": "book", "by": "Nathan Lambert, 2025", "level": 1}, {"title": "DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models", "url": "https://arxiv.org/abs/2402.03300", "type": "paper", "by": "Shao et al., DeepSeek, 2024", "level": 2, "note": "Section 4.1 introduces GRPO, starting from PPO."}, {"title": "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning", "url": "https://arxiv.org/abs/2501.12948", "type": "paper", "by": "DeepSeek-AI, 2025", "level": 2}, {"title": "Understanding R1-Zero-Like Training: A Critical Perspective", "url": "https://arxiv.org/abs/2503.20783", "type": "paper", "by": "Liu et al., 2025", "level": 3}, {"title": "Does Reinforcement Learning Really Incentivize Reasoning Capacity in LLMs Beyond the Base Model?", "url": "https://arxiv.org/abs/2504.13837", "type": "paper", "by": "Yue et al., 2025", "level": 3}, {"title": "CS336 Assignment 5: Alignment and Reasoning RL", "url": "https://github.com/stanford-cs336/assignment5-alignment", "type": "project", "by": "Stanford CS336, 2026", "level": 2, "build": "Zero-shot, few-shot, and chain-of-thought baselines for OLMo-2 1B on GSM8K, then GRPO with several policy gradient variants to raise its accuracy.", "teaches": "What GRPO’s group baseline, clipping, and importance weights each do, measured on a model you train yourself.", "time": "two weeks", "signature": true}]}, {"id": "cai", "title": "Constitutional AI and RLAIF", "kind": "paper", "track": "post", "pre": ["rlhf"], "frontier": false, "core": "Replace most human harmlessness labels with a written list of principles. The model critiques and revises its own answers against them to make supervised data, then an AI judge compares pairs of answers against the principles to make preference labels for RL.", "reach": "AI feedback and rubric judges now supply much of the preference data in post-training; deliberative alignment trains models to reason over a written spec.", "uses": "Harmlessness training that replaces most human labels with a written set of principles, the model judges that now supply much preference data, and rubric scoring in evaluation and data-filtering pipelines.", "worth": "you need safety or style data without a large labeling team; RLHF first, and writing the principles matters more than the math.", "resources": [{"title": "Claude’s constitution", "url": "https://www.anthropic.com/news/claudes-constitution", "type": "blog", "by": "Anthropic, 2023", "level": 1}, {"title": "Constitutional AI: Harmlessness from AI Feedback", "url": "https://arxiv.org/abs/2212.08073", "type": "paper", "by": "Bai et al., Anthropic, 2022", "level": 2, "note": "Figure 1 shows the supervised and RL stages."}, {"title": "RLAIF vs. RLHF: Scaling Reinforcement Learning from Human Feedback with AI Feedback", "url": "https://arxiv.org/abs/2309.00267", "type": "paper", "by": "Lee et al., Google, 2023", "level": 2}, {"title": "Synthetic Data & Distillation (RLHF Book)", "url": "https://rlhfbook.com/c/12-synthetic-data", "type": "book", "by": "Nathan Lambert, 2025", "level": 2, "note": "The AI Feedback and Constitutional AI sections."}, {"title": "Deliberative Alignment: Reasoning Enables Safer Language Models", "url": "https://arxiv.org/abs/2412.16339", "type": "paper", "by": "Guan et al., OpenAI, 2024", "level": 3}, {"title": "Constitutional AI recipe", "url": "https://github.com/huggingface/alignment-handbook/tree/main/recipes/constitutional-ai", "type": "project", "by": "Hugging Face H4, 2024", "level": 3, "note": "The recipe says the full model needs 8 GPUs with 80GB; the data generation step is in llm-swarm’s examples.", "build": "A model aligned to a written constitution: answers critiqued and revised against its principles, supervised fine-tuning on the revisions, then DPO on the original and revised pairs.", "teaches": "That the labels can come from the principles themselves, and how much of the result is decided by the critique prompt.", "time": "a week"}]}, {"id": "overopt", "title": "Reward hacking and overoptimization", "kind": "concept", "track": "post", "pre": ["rlhf"], "frontier": true, "core": "A reward model is only a proxy for what people want, so optimizing hard against it first raises true quality and then lowers it while the proxy score keeps climbing. The gap grows predictably with how far the policy moves from where it started.", "reach": "Why RLHF keeps a KL penalty, why RLVR prefers checkable rewards, and why verifiers still get gamed.", "uses": "Setting KL budgets and stopping points in post-training runs, diagnosing models that score better and read worse, and recognizing the same Goodhart failure in any heavily optimized metric, such as engagement ranking.", "worth": "you run or review preference training; needs RLHF alone, and a day spent here prevents a confidently wrong release.", "resources": [{"title": "Reward Hacking in Reinforcement Learning", "url": "https://lilianweng.github.io/posts/2024-11-28-reward-hacking/", "type": "blog", "by": "Lilian Weng, 2024", "level": 1}, {"title": "Scaling Laws for Reward Model Overoptimization", "url": "https://arxiv.org/abs/2210.10760", "type": "paper", "by": "Gao, Schulman, Hilton, OpenAI, 2022", "level": 2}, {"title": "Monitoring Reasoning Models for Misbehavior and the Risks of Promoting Obfuscation", "url": "https://arxiv.org/abs/2503.11926", "type": "paper", "by": "Baker et al., OpenAI, 2025", "level": 3}, {"title": "Natural Emergent Misalignment from Reward Hacking in Production RL", "url": "https://arxiv.org/abs/2511.18397", "type": "paper", "by": "MacDiarmid et al., Anthropic, 2025", "level": 3}, {"title": "Reward Model Ensembles Help Mitigate Overoptimization", "url": "https://arxiv.org/abs/2310.02743", "type": "paper", "by": "Coste et al., 2023", "level": 3}, {"title": "Reproduce reward model overoptimization with best-of-n", "url": "https://arxiv.org/abs/2210.10760", "type": "project", "by": "Built on Gao, Schulman, Hilton, 2022", "level": 3, "build": "A small proxy reward model trained on labels from a larger gold one, then best-of-n sampling against the proxy on one GPU, with both scores plotted against the analytic KL.", "teaches": "What overoptimization looks like when the true objective is visible, and why the proxy score alone cannot tell you where to stop.", "time": "a weekend", "made": true, "done": "The gold score peaks and then falls as n grows toward 1,000 while the proxy keeps rising, and the gold curve fits d times alpha minus beta d."}]}, {"id": "probing", "title": "Probing and linear representations", "kind": "concept", "track": "interp", "pre": ["attention"], "frontier": false, "core": "Train a simple classifier, usually linear, to read a property from a model’s hidden activations. If it beats a control, the information is present, though not necessarily used; the linear representation hypothesis says many concepts are directions in activation space.", "reach": "Directions found by probes become steering vectors, and sparse autoencoders search for such directions without labels.", "uses": "Checking what a model tracks internally, such as truth, the board in Othello-GPT, or a user’s attributes; lie detection research and model monitoring; and, conceptually, the same linear decoders neuroscientists use on brain recordings.", "worth": "interpretability or evaluating what models represent draws you; it is short and practical, and anyone not curious about model internals can skip it.", "resources": [{"title": "Understanding intermediate layers using linear classifier probes", "url": "https://arxiv.org/abs/1610.01644", "type": "paper", "by": "Guillaume Alain, Yoshua Bengio, 2016", "level": 1, "note": "The original linear probe, applied layer by layer."}, {"title": "Probing Classifiers: Promises, Shortcomings, and Advances", "url": "https://arxiv.org/abs/2102.12452", "type": "paper", "by": "Yonatan Belinkov, 2021", "level": 2, "note": "A survey of what probes can and cannot show."}, {"title": "Designing and Interpreting Probes with Control Tasks", "url": "https://arxiv.org/abs/1909.03368", "type": "paper", "by": "John Hewitt, Percy Liang, 2019", "level": 2, "note": "Control tasks separate what the representation encodes from what the probe learns."}, {"title": "Emergent Linear Representations in World Models of Self-Supervised Sequence Models", "url": "https://arxiv.org/abs/2309.00941", "type": "paper", "by": "Neel Nanda, Andrew Lee, Martin Wattenberg, 2023", "level": 2, "note": "Othello-GPT’s board looked nonlinear until probed as mine versus theirs; then it was linear and steerable."}, {"title": "ARENA 1.3.1: Linear Probes", "url": "https://learn.arena.education/chapter1_transformer_interp/11_probing/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "Linear probes for truth in a language model’s activations, compared across probing methods, tested with causal interventions, then used to detect deception.", "teaches": "What a probe can and cannot show, and how an intervention separates a representation the model uses from one that is merely present.", "time": "a weekend"}, {"title": "The Linear Representation Hypothesis and the Geometry of Large Language Models", "url": "https://arxiv.org/abs/2311.03658", "type": "paper", "by": "Kiho Park, Yo Joong Choe, Victor Veitch, 2023", "level": 3, "note": "Makes the hypothesis precise and finds the inner product under which it holds."}, {"title": "ARENA 1.5.3: OthelloGPT", "url": "https://learn.arena.education/chapter1_transformer_interp/33_othellogpt/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "Othello-GPT’s board read with linear probes in a mine versus theirs basis, interventions along probe directions that change its moves, neuron analysis, and a probe trained from scratch.", "teaches": "How a probe becomes evidence of a world model once moving activations along its direction changes what the model predicts.", "time": "a weekend"}]}, {"id": "circuits", "title": "Transformer circuits", "kind": "paper", "track": "interp", "pre": ["attention"], "frontier": false, "core": "Read a transformer as a sum of paths through a shared residual stream. Each attention head moves information between positions, and heads in two layers can compose into an induction circuit that copies what followed the current token’s previous occurrence.", "reach": "Induction heads explain much of in-context learning; superposition is what makes circuits hard to read in larger models.", "uses": "Explaining specific behaviors in safety research, such as how models copy, count, or add, and tracing a failure to the components responsible; the methods live mostly in research labs and open tools like TransformerLens.", "worth": "you want to do mechanistic interpretability or AI safety research; others can learn the residual stream picture and induction heads in an afternoon.", "resources": [{"title": "A Mathematical Framework for Transformer Circuits", "url": "https://transformer-circuits.pub/2021/framework/index.html", "type": "paper", "by": "Elhage et al., Anthropic, 2021", "level": 2, "note": "Read the residual stream as a communication channel, attention heads as information movement, and the two-layer induction head."}, {"title": "A Walkthrough of A Mathematical Framework for Transformer Circuits", "url": "https://www.youtube.com/watch?v=KV5gbOmHbjU", "type": "video", "by": "Neel Nanda, 2022", "level": 1, "note": "One of the authors walks through the paper section by section."}, {"title": "In-context Learning and Induction Heads", "url": "https://transformer-circuits.pub/2022/in-context-learning-and-induction-heads/index.html", "type": "paper", "by": "Olsson et al., Anthropic, 2022", "level": 2, "note": "Induction heads form in a sudden phase change that coincides with in-context learning."}, {"title": "ARENA 1.2: Intro to Mechanistic Interpretability", "url": "https://learn.arena.education/chapter1_transformer_interp/02_intro_mech_interp/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "Induction heads found and reverse-engineered in a two-layer attention-only model with TransformerLens, using attention patterns, hooks, and ablations.", "teaches": "The basic tools of mechanistic interpretability, used on a circuit whose job you can state exactly.", "time": "a weekend", "signature": true}, {"title": "A Comprehensive Mechanistic Interpretability Explainer & Glossary", "url": "https://www.neelnanda.io/mechanistic-interpretability/glossary", "type": "notes", "by": "Neel Nanda, 2022", "level": 1, "note": "Look up terms as the papers use them."}, {"title": "Interpretability in the Wild: a Circuit for Indirect Object Identification in GPT-2 small", "url": "https://arxiv.org/abs/2211.00593", "type": "paper", "by": "Wang et al., 2022", "level": 3, "note": "A full circuit of 26 heads in a real model, found by path patching."}, {"title": "ARENA 1.4.1: Indirect Object Identification", "url": "https://learn.arena.education/chapter1_transformer_interp/21_ioi/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "The indirect object identification circuit in GPT-2 small, traced with logit attribution, activation patching, and path patching.", "teaches": "How to find a circuit in a real model when you do not know its parts in advance.", "time": "a weekend"}]}, {"id": "superposition", "title": "Superposition", "kind": "paper", "track": "interp", "pre": ["circuits", "svd"], "frontier": false, "core": "A network can store more features than it has dimensions by giving each feature its own nearly orthogonal direction, which works when features are sparse and rarely active together. The price is interference, and single neurons end up responding to several unrelated features.", "reach": "Why neurons are polysemantic, and why sparse autoencoders are used to pull features back out.", "uses": "Explaining why single neurons are hard to read, which motivated sparse autoencoders. The math is conceptually close to compressed sensing, which recovers sparse signals from few measurements and shortens MRI scans.", "worth": "you study interpretability or representation theory; it is a short read with toy models, and outside interpretability its main payoff is intuition.", "resources": [{"title": "Toy Models of Superposition", "url": "https://transformer-circuits.pub/2022/toy_model/index.html", "type": "paper", "by": "Elhage et al., Anthropic, 2022", "level": 2, "note": "Start with Definitions and Motivation and Demonstrating Superposition; the phase diagrams and geometry follow."}, {"title": "How might LLMs store facts | Deep Learning Chapter 7", "url": "https://www.youtube.com/watch?v=9-Jl0dxWQs8", "type": "video", "by": "3Blue1Brown (Grant Sanderson), 2024", "level": 1, "note": "Ends with why high-dimensional space holds far more nearly orthogonal directions than dimensions."}, {"title": "ARENA 1.5.4: Superposition and Sparse Autoencoders", "url": "https://learn.arena.education/chapter1_transformer_interp/34_superposition/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "Anthropic’s toy models of superposition reproduced: features packed into fewer dimensions, their geometry, and sparse autoencoders that pull them back apart.", "teaches": "Why neurons are polysemantic, from a model small enough to see every feature.", "time": "a weekend"}, {"title": "Distributed Representations: Composition & Superposition", "url": "https://transformer-circuits.pub/2023/superposition-composition/index.html", "type": "notes", "by": "Chris Olah, Anthropic, 2023", "level": 2, "note": "When features compose and when they sit in superposition."}, {"title": "Polysemanticity and Capacity in Neural Networks", "url": "https://arxiv.org/abs/2210.01892", "type": "paper", "by": "Scherlis, Sachan, Jermyn, Benton, Shlegeris, 2022", "level": 3, "note": "Treats superposition as allocating limited capacity across features by their importance to the loss."}]}, {"id": "sae", "title": "Sparse autoencoders", "kind": "concept", "track": "interp", "pre": ["superposition"], "frontier": false, "core": "Train a wide autoencoder on a model’s activations with a sparsity penalty, so each activation is rebuilt from a few of many learned directions. Those directions, called features, are often far more interpretable than neurons, partly undoing superposition at the cost of some reconstruction error.", "reach": "Features become the units of attribution graphs and the directions used for activation steering.", "uses": "Finding interpretable features inside production models, as in Anthropic’s Scaling Monosemanticity, OpenAI’s sparse autoencoders on GPT-4, and DeepMind’s open Gemma Scope, and, less expectedly, uncovering biological concepts inside protein language models.", "worth": "hands-on interpretability research is the goal; open tools make it doable on small models, though whether its features are the right units is unsettled.", "resources": [{"title": "Towards Monosemanticity: Decomposing Language Models With Dictionary Learning", "url": "https://transformer-circuits.pub/2023/monosemantic-features/index.html", "type": "paper", "by": "Bricken et al., Anthropic, 2023", "level": 2, "note": "Read Problem Setup and the individual feature investigations; the interface lets you browse features."}, {"title": "An Intuitive Explanation of Sparse Autoencoders for LLM Interpretability", "url": "https://adamkarvonen.github.io/machine_learning/2024/06/11/sae-intuitions.html", "type": "blog", "by": "Adam Karvonen, 2024", "level": 1, "note": "The architecture and loss in a few lines of PyTorch, with the reasoning behind each piece."}, {"title": "Scaling Monosemanticity: Extracting Interpretable Features from Claude 3 Sonnet", "url": "https://transformer-circuits.pub/2024/scaling-monosemanticity/index.html", "type": "paper", "by": "Templeton et al., Anthropic, 2024", "level": 2, "note": "Sparse autoencoders on a production model, with scaling laws and features for abstract concepts."}, {"title": "Scaling and evaluating sparse autoencoders", "url": "https://arxiv.org/abs/2406.04093", "type": "paper", "by": "Gao et al., OpenAI, 2024", "level": 3, "note": "TopK sparsity, scaling laws, and metrics for judging autoencoders."}, {"title": "ARENA 1.3.3: Interpretability with SAEs", "url": "https://learn.arena.education/chapter1_transformer_interp/13_saes/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "A pretrained sparse autoencoder’s latents interpreted with SAELens and Neuronpedia, then SAEs of your own, trained and evaluated.", "teaches": "How to tell a real feature from a plausible story, and what the training tricks for SAEs are for.", "time": "a weekend"}]}, {"id": "attribution", "title": "Attribution graphs and circuit tracing", "kind": "paper", "track": "interp", "pre": ["sae"], "frontier": true, "core": "Replace a model’s MLPs with a cross-layer transcoder whose sparse features are interpretable, then, for one prompt, trace which features cause which through linear attributions. The resulting graph shows intermediate steps, such as recalling a fact in two hops or planning a rhyme ahead.", "reach": "Builds on sparse autoencoders and transcoders; the graphs suggest which features to steer and where stated reasoning departs from the computation.", "uses": "Tracing how a model reached one specific answer, as in Anthropic’s study of Claude 3.5 Haiku doing two-hop recall, rhyme planning, and arithmetic; open tools now draw these graphs for open models such as Gemma.", "worth": "you aim to do mechanistic interpretability research; the methods are new and changing, and anyone else can read the published graphs rather than build them.", "resources": [{"title": "Circuit Tracing: Revealing Computational Graphs in Language Models", "url": "https://transformer-circuits.pub/2025/attribution-graphs/methods.html", "type": "paper", "by": "Ameisen et al., Anthropic, 2025", "level": 2, "note": "Start with Building an Interpretable Replacement Model and Attribution Graphs."}, {"title": "On the Biology of a Large Language Model", "url": "https://transformer-circuits.pub/2025/attribution-graphs/biology.html", "type": "paper", "by": "Lindsey et al., Anthropic, 2025", "level": 2, "note": "Case studies: multi-step reasoning, planning in poems, addition, refusals, and chain-of-thought faithfulness."}, {"title": "circuit-tracer", "url": "https://github.com/decoderesearch/circuit-tracer", "type": "code", "by": "Anthropic and Decode Research, 2025", "level": 2, "note": "Builds attribution graphs for open models and runs interventions; also usable on Neuronpedia with no install."}, {"title": "Transcoders Find Interpretable LLM Feature Circuits", "url": "https://arxiv.org/abs/2406.11944", "type": "paper", "by": "Jacob Dunefsky, Philippe Chlenski, Neel Nanda, 2024", "level": 3, "note": "Why replacing MLPs with transcoders makes feature circuits linear and readable."}, {"title": "Sparse Feature Circuits: Discovering and Editing Interpretable Causal Graphs in Language Models", "url": "https://arxiv.org/abs/2403.19647", "type": "paper", "by": "Marks et al., 2024", "level": 3, "note": "An earlier route: causal graphs over sparse autoencoder features."}, {"title": "ARENA 1.4.2: SAE Circuits", "url": "https://learn.arena.education/chapter1_transformer_interp/22_sae_circuits/intro", "type": "project", "by": "ARENA, 2026", "level": 2, "build": "Gradients between sparse autoencoder latents across layers, then transcoders, attribution graphs for single prompts, and interventions on the circuits those graphs reveal.", "teaches": "How a sparse replacement for the MLPs makes a circuit linear enough to trace, and how to test a traced path by intervening on it.", "time": "a weekend"}]}, {"id": "actsteer", "title": "Activation steering", "kind": "concept", "track": "interp", "pre": ["probing", "sae"], "frontier": true, "core": "Add a fixed vector to a model’s activations during the forward pass to change its behavior, with no training. The vector is often the mean activation difference between contrasting prompts, such as honest minus dishonest, or a sparse autoencoder feature’s direction.", "reach": "Turns probing results into interventions, and the same directions can monitor behavior, as the refusal direction and persona vectors show.", "uses": "Changing a model’s behavior without fine-tuning, such as reducing sycophancy or toggling refusals; Golden Gate Claude was a steered model, and persona vectors use the same directions to monitor shifts in a model’s character.", "worth": "you do safety or interpretability research, or want cheap behavior control for open models; re
